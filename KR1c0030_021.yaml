body:
  text: 詩經疏義㑹通卷十九元朱公遷撰頌四頌者宗廟之樂歌大序所謂羙盛徳之形容以其成功告于神明者也盖頌與容古字通用故序以此言之周頌三十一篇多周公所定而亦或有康王以後之詩如昊天有成命與執競噫嘻之類魯頌四篇商頌五篇因亦以類附焉魯頌次周諸侯不可先天子也商頌次魯先代不可先時君也商頌五篇盖亡失而僅存者夫子取之以備一代之樂歌耳凡五卷輯録通釋曰雅頌無諸國别原以十篇為一卷故此分周頌三什為四之一四之二四之三魯頌四篇為四之四商頌五篇為四之五通為五卷周頌清廟之什四之一輯録雅不言周而頌獨言周者以别商魯頌也於音烏穆清廟肅雝顯相息亮反濟濟子禮反多士秉文之徳對越在天駿奔走在廟不顯不承無射音亦與斁同於人斯周頌多不叶韻未詳其説賦也於歎辭穆深逺也清清靜也廟有門堂寢室墻宇四周其深逺清靜可知輯録箋云廟之言貌也死者不可得見立宫室象貌之耳肅敬雝和顯明相助也謂助祭之公卿諸侯也助祭諸臣皆有顯眀之徳故以顯相言肅雝即顯徳也濟濟衆也多士與音預祭執事之人也越於也駿大而疾也布武而行則大而疾見其敏於事也承尊奉也謂見尊奉也斯語辭此周公既成洛邑而朝音潮諸侯因率之以祀文王之樂歌輯録吕東莱曰朝諸侯者相成王以朝諸侯也率之以祀文王者所謂王在新邑烝祭嵗是也言於穆哉此清靜之廟其助祭之公侯皆敬且和而其執事之人又無不執行文王之徳執守也執行者執持以行之也盖和則不勉敬則不怠秉徳則法文王而眸面盎背可知然此亦互文見義爾非謂顯相不䏻秉文王之徳多士不䏻盡和敬之道也既對越其在天之神而又駿奔走其在廟之主主神主也武王伐紂載文王木主以行即謂此也文王既没其神在天其主在廟随寓而著無往不然在廟之臣内而存對越之心外而盡奔走之道無非所以事文王也如此則是文王之徳豈不顯乎豈不承乎信乎其無有厭斁於人也如此二字是接上文而言觀其肅雝秉徳而見文王之徳昭著於人心是其顯也觀其對越駿奔而見文王之徳使人尊奉之是其承也文王之徳不可名言但觀奉祭之臣如此而其徳自然可見苟徳不極其盛則肅雝秉徳對越駿奔未必皆然是人心之所萃即盛徳之所致也清廟一章八句増釋許氏曰秉文之徳總承上二句其助祭能敬和明顯之諸侯及濟濟之多士皆執行文王之徳也對越在天内敬也駿奔走在廟外恭也其心足以對在天之神則方可以盡駿奔之職其助祭之臣且如是則主祭之君可知文王之徳化於後世如此則無射於人可知矣書稱王在新邑烝祭嵗烝冬祭名當時成王在洛邑舉烝祭之禮日嵗云者嵗舉之禮也文王騂牛一武王騂牛一騂牛者用特牲也清廟祭文王載見祭武王皆因諸侯来見而率以祭也豈載見之時與此同時乎實周公攝政之七年而此其升歌之辭也歌詩在堂上故曰升歌書大傳曰周公升歌清廟苟在廟中嘗見文王者愀音悄然如復去聲見文王焉言聲音詞氣之惠人如此輯録愀容色變也樂記曰清廟之瑟朱弦而疏越活又如字壹倡而三歎有遺音者矣遺猶餘也未盡音之極故有餘音太盛則止矣鄭氏曰朱弦練朱弦練之使柔而朱其色也練則聲濁越瑟底孔也疏之使聲遲也疏通也音節舒徐以象其徳也倡𤼵歌句也三歎三人從歎之耳輯録陳氏曰瑟聲濁而遲是質素之聲非要妙之音也此聲初𤼵一倡之時僅有三人從而和之言和者少也以其非極聲音之羙故好者少然而其中則有不盡之餘音存焉故曰有遺音者矣漢因秦樂乾音干豆上輯録杜氏通典注乾豆脯羞之屬上時掌反奏登歌登歌亦取升歌之意獨上歌此亦倣一倡之意也不以管絃亂人聲欲在位者徧聞之猶古清廟之歌也漢髙祖時叔孫通因秦樂人制宗廟樂大祝迎神於廟門則奏嘉至猶古降神之樂也皇帝入廟門則奏永至以為行步之節猶古采齊肆夏也乾豆上奏登歌云云猶古清廟之樂也登歌再終下奏休成之樂羙神明之既享也出漢禮樂志維天之命於音烏穆不已於同上乎音呼不顯文王之徳之純賦也天命即天道也輯録程子曰言天之自然者曰天道言天之賦予萬物者曰天命不已言無窮也純不雜也此亦祭文王之詩言天道無窮而文王之徳純一不雜與天無間以賛文王之徳之盛也文王之徳難於形容故舉天道以配之天道本来無二無雜純有不必言者故但言其不已則純自見人心之徳有純有不純惟文王之徳純乎天理故以純稱純則自然不已也穆與顯對互言之耳其實天道之流行賦予者非不顯著文王之徳仁義禮知之藴未嘗不深且逺也但詩意正欲法乎文王故以不顯歸之純徳見其明著而可法猶大雅文王末章之意耳子思子曰維天之命於穆不已盖曰天之所以為天也於乎不顯文王之徳之純盖曰文王之所以為文也純亦不已惟其一於理所以無不純惟其無不純所以無或已此天之所以為天而文王之所以為文也此文王之所以與天合徳也程子曰天道不已文王純於天道亦不已純則無二無雜不已則無間斷先後無二無雜全體也無間斷先後不息也惟其全體所以不息假春秋傳作何以溢春秋傳作恤我我其收之駿惠我文王曾孫篤之何之為假聲之轉也恤之為溢字之訛也收受駿大惠順也大順者順之之極無一毫拂戾之意曾孫後王也篤厚也言文王之神將何以恤我乎有則我當受之以大順文王之道受之即服膺勿失之之意盖存之之謂也存之而弗忘則行之而弗悖矣道者純徳之見於行事者也後王又當篤厚之而不忘也謂之篤厚之則存之尤弗忘行之愈弗悖矣此則嗣王有望於文王之意謂自今至於後来皆欲法其不已之徳夫文王之徳如此而我未之能者正當憫恤之也故願有以昭示於感格之際使神㑹而心得之庶幾我法之於今曾孫法之於後也輯録上配天道於無窮下及子孫亦無窮觧頥曰天道不已文王純於天道亦不已惟其徳之不已故其福澤之及於後人者亦不已凡神之所以恤我我之所以受之者皆其徳之不已者為之也我既有以受之則必有以順之順之而不違則已既與文王一矣後人又篤厚之而不忘則後人又與己為一矣曰駿惠曰篤皆自其不已者而推言之也維天之命一章八句輯録嚴氏曰頌者成功告神必言子孫勉力保守以慰祖考之意故此詩曰曾孫篤之天作曰子孫保之維清緝熈文王之典肇禋音因迄許乞反用有成維周之禎賦也清清明也緝續熈明肇始禋祀迄至也此亦祭文王之詩言所當清明而緝熈者文王之典也典以典禮言而祭祀之典在其中清而明之則討論宣布而文王之典益以著矣清明之功時時繼續之是則所謂緝熈也故自始祀至今有成實維周之禎祥也周之祀典自文王創始循用至於今日而成一代之規儀文制度煥然可述與國咸休非禎祥而何此清明緝熙之所致也然此詩疑有闕文焉維清一章五句前二篇是頌文王之徳此篇是頌文王之典烈文辟音璧下同公錫兹祉福惠我無疆子孫保之賦也烈光也辟公諸侯也烈文辟公言有武有文之諸侯也王氏曰為國君故稱辟舉五等之貴故稱公此祭於宗廟而獻助祭諸侯之樂歌儀禮賔三獻尸之後主人酌酒獻賔歌烈文其在此時與言諸侯助祭使我獲福則是諸侯錫此祉福而惠我以無疆使我子孫保之也此一節歸徳於諸侯之詞無封靡于爾邦維王其崇之念兹戎功繼序其皇之封靡之義未詳或曰封專利以自封殖也封者封培之義猶所謂貨財生殖也靡汰侈也取之有制則不封用之有節則不靡崇尊尚也戎大皇大也言汝能無封靡于汝邦則王當尊汝又念汝有此助祭錫福之大功則使汝之子孫繼序而益大之也序者君位相傳之次序此一節期望而欲報稱之詞諸侯能制節謹度則天子已當尊崇之又且念此錫福大功而又將愈益尊崇其子孫也爾既使我子孫保之我不使爾繼序皇之乎輯録解頥曰烈文羙其徳也錫福羙其功也無封靡所以致其戒也崇之皇之所以厚其報也諸侯助祭而有錫福之功王者報功而有以及其後嗣此所以為忠厚之至也無競維人四方其訓之不顯維徳百辟其刑之於音烏乎音呼前王不忘又言莫强於人莫顯於徳先王之徳所以人不能忘者用此道也四方訓之其化行也百辟刑之其法著也皆盛徳自然之效感孚而無間故思慕而無窮也此戒飭而勸勉之也此一節言不特無封靡而已盡人道明明徳又當進而取法於先王也先王之徳如此故人不䏻忘諸侯能以先王為法則人亦不能忘之矣若徳不極其盛則人終有忘之之時崇之皇之或替於乆也此所謂戒飭而勸勉之也中庸引不顯惟徳百辟其刑之而曰故君子篤恭而天下平輯録不顯中庸借引以為幽深𤣥逺之意篤恭言自厚於恭敬未嘗見於言動之間也篤恭而天下平所謂至徳淵微自然之應也大學引於乎前王不忘而曰君子賢其賢而親其親小人樂其樂而利其利比以没世不忘也中庸之意但謂聖人徳盛而人自化之據此一時而言爾如大學所云則有盛徳必有善治徳業垂於後世恩澤流於無窮人自思之不能忘也輯録朱子曰於乎歎詞前王謂文武也君子謂後賢後王小人謂後民也此言前王所以新民者止於至善䏻使天下後世無一物不得其所所以既沒世而人思慕之愈乆而不忘也又曰賢其賢者間而知之仰其徳業之盛也親其親者子孫保之思其覆育之恩也樂其樂者含哺鼔腹而安其樂也利其利者耕田鑿井而享其利也此皆先王盛徳至善之餘澤故雖已沒世而人猶思之愈乆而不能忘也烈文一章十三句此篇以公疆兩韻相叶未審當從何讀意亦可互用也天作髙山大音泰王荒之彼作矣文王康之彼岨矣岐沈括曰後漢書西南夷傳作彼岨者岐今按彼書岨但作徂而引韓詩薛君章句亦但訓為往獨矣字正作者如沈氏説然其注末復云岐雖阻僻則似又有岨意韓子亦云彼岐有岨疑或别有所据故今從之而定讀岐字絶句有夷之行叶户郎反子孫保之賦也髙山謂岐山也荒治治荒謂之荒猶治亂謂之亂也康安也岨險僻之意也夷平行路也此祭大王之詩言天作岐山而大王始治之大王既作而文王又安之作屏修平之類是荒之作之之功也至柞棫拔矣行道兊矣而致昆夷之駾喙則安之之功又可見矣於是彼險僻之岐山人歸者衆而有平易之道路子孫當世世保守而不失也天作岐山可為興王之地大王承天而創業文王繼世而成功治險為夷如此其難可不世世保守之乎上對天作曰荒下對康之曰作荒即作也既䏻因天所作而作之又䏻傳及文王使安之貽謀逺矣永永無隳斯可耳周之先公稱后稷公劉先王稱太王工季然天作祀太王思文祀后稷而公劉王季無其詩豈篤前烈視克配彼天者不同勤王家比肇基王迹者有間歟抑夫子正樂於殘缺之餘本有是詩而亡之也然公劉之厚民王李之受禄施孫子雅頌正可互見其為有徳之宗信矣天作一章七句詩意首尾主岐山言之故知為祀大王之詩也昊天有成命二后受之成王不敢康夙夜基命宥宻於音烏緝熈單厥心肆其靖之賦也二后文武也成王名誦武王之子也基積累于下以承藉乎上者也宥宏深也宻靜宻也宥則有容而萬理不遺宻則有守而萬機不亂積徳以基命者此其要也於歎詞靖安也此詩多道成王之徳疑祀成王之詩也文武所受之命非成王基之則殆矣故以為頌言天祚周以天下既有定命而文武受之矣定者一定而不易之謂成王繼之又能不敢康寧而其夙夜積徳以承藉天命者又宏深而靜宻不宏深則狭而淺不靜宻則躁而浮容之不廣蓄之不固雖欲不敢康亦於何者用力乎是能繼續光眀文武之業而盡其心文昭武烈之在天下著矣然不緝則間不熈則昧少不緝熈則是不盡其心也故今能安靖天下而保其所受之命也保其所受之命乃朱子推衍詩人本意以結二后受之之語此詩要㫖在不敢康夙夜基命宥宻二句不敢康無逸也夙夜基命宥宻即其存心無逸而且得其道也緝熈單厥心則指其不敢康夙夜宥宻而賛之耳盖宥宻是其用功處夙夜是其用功無間處觀其不敢康夙夜基命宥宻如此則緝熈單厥心可知矣肆其靖之則今日之效驗也國語叔向引此詩而言曰是道成王之徳也成王能明文昭定武烈者也昭烈皆光明之義文武之功徳皆顯然故以昭烈言之輯録毛氏曰古響字作向晉大夫羊舌肸字叔向左傳香兩切盖取肸向響布之義以此證之則其為祀成王之詩無疑矣小序以為郊祀天地之詩故集傳引此以證其誤昊天有成命一章七句此康王以後之詩我將我享維羊維牛維天其右叶音由之賦也將奉享獻奉而進之曰將奠而獻之曰享右尊也神坐東向在饌之右所以尊之也明堂之位帝居中文王居西南主皆西坐東向東左西右則饌在左而神在右矣此宗祀文王於明堂以配上帝之樂歌言奉其牛羊以享上帝輯録觧頥曰將曰我將則所以將而奉之者必躬必親也享曰我享則所以享而獻之者必敬必戒也羊曰維羊牛曰維牛謂於羊牛之外不敢有加物也此貴誠之義也而曰天庶其降而在此牛羊之右乎盖不敢必也不敢必者尊之至也盖有徼倖萬一之意焉儀式刑文王之典日靖四方伊嘏古雅反文王既右享叶虚良反之儀式刑皆法也嘏錫福也言我儀式刑文王之典以靖天下則此能錫福之文王既降而在此之右以享我祭若有以見其必然矣儀式刑者取法於文王不一而足也日靖四方者安靖四方之志無日而或忘也此不特以右享期之而且先以錫福望之矣是則親之之甚也故用既字對上文其字以見事帝事親之别輯録觧頥曰其者辭之疑既者辭之决所以疑者尊之而不敢必也所以决者親之而可必也我其夙夜畏天之威于時保之又言天與文王既皆右享我矣此自上一節言之盖文王即天也文王既右享之則天亦右享之矣故曰既皆右享我矣則我其敢不夙夜畏天之威以保天與文王所以降鑒之意乎輔氏曰夙夜畏天之威則儀式刑者益至而安靖四方者益乆此所以䏻保天與文王降鑒之意也愚謂此又見事帝事親同一畏敬之心如此盖明堂本是親親之禮親親意勝則近乎䙝故頌歌之際不曰帝而曰天始不敢必而終復畏其威也我將一章十句程子曰萬物本乎天人本乎祖故冬至祭天而以祖配之以冬至氣之始也萬物成形於帝而人成形於父故季秋享帝而以父配之以季秋成物之時也輔氏曰明堂以父配天固也但周公制禮若在武王之時則文王為父矣在成王之時則文王又其祖也然則周世世皆當以文王配繼周而王者世世皆當以有功者配也陳氏曰古者祭天於圜與圓同丘掃地而行事器用陶匏牲用犢其禮極簡器用陶匏無文采取其質也犢小未知牝牡之情取其純也聖人之意以為未足以盡其意之委曲故於季秋之月有大享之禮焉天即帝也郊而曰天所以尊之也天道至大見其可尊而已故以后稷配焉后稷逺矣輯録后稷生於姜嫄以上更推不去配稷於郊亦以尊稷也明堂而曰帝所以親之也帝則人之屬可親者也以文王配焉文王親也配文王於明堂亦以親文王也輯録曺氏曰以天道事之則藁秸以為席陶匏以為器繭栗之牲掃地而祭所以尊之也以帝道事之則牛羊以為牲簠簋以為器鼎俎之實其薦用熟所以親之也尊尊而親親周道備矣然則郊者古禮而明堂者周制也周公以義起之也尊尊者敬之道也親親者愛之道也敬而䏻愛則意之委曲皆盡矣故曰周道備矣東莱吕氏曰於天維庶其饗之不敢加一詞焉於文王則言儀式其典日靖四方天不待贊無聲無臭不容賛也法文王所以法天也卒章惟言畏天之威而不及文王者統於尊也畏天所以畏文王也天與文王一也天與文王一而已但一穆一顯則法天不如法文王之為切一尊一親則畏文王不如畏天之為甚立言之不同者此故也已上三條程子則言郊用冬至明堂用季秋者其故如此陳氏則言郊以后稷配明堂以文王配者其故如此吕氏則詳説此詩之義也時邁其邦昊天其子之賦也邁行也邦諸侯之國也周制十有二年王廵守殷國語出周禮秋官大行人殷衆也與殷頫殷同之義同盖四方四時分来如平時也輯録輔氏曰殷即衆也頫即見也柴望祭告諸侯畢朝音潮輯錄舜典蔡氏曰柴燔柴以祀天也望望秩以祀山川也五嶽四瀆之屬望而祭之故曰望周官云諸侯各朝于方岳此廵守而朝㑹祭告之樂歌也言我之以時廵行諸侯也必十有二年乃一廵守不先時而數不後時而慢且必春東夏南秋西冬北所謂時廵也天其子我乎哉盖不敢必也廵守之禮所以浹和神人而盡天子之職也是以有望於天之子我必以時者事天之至不敢必者畏天之至實右序有周薄言震之莫不震疊懐柔百神及河喬嶽允王維后右尊序次震動疊懼懐来柔安允信也既而曰天實右序有周矣是以使我薄言震之而四方諸侯莫不震懼又能懐柔百神輯録曺氏曰祭法云有天下者祭百神故廵守所至百神皆祭焉以至于河之深廣嶽之崇髙而莫不感格則是信乎周王之為天下君矣上一節其字與此一節實字允字相對盖始不敢必其然而終則信其果然也君者人神之主人神服從則信乎天右序之而君天下無疑矣子我之意可驗於此輯錄嚴氏曰天實右序有周矣武王之廵守也于諸侯薄警動之而莫不震懼又所至方岳之下懐百神祀河岳其人神之受職非人所䏻為也天實右序之也故天下莫不信武王之宜君天下也明昭有周式序在位載戢側立反干戈載櫜古刀反弓矢我求懿徳肆于時夏户雅反允王保之戢聚櫜韜輯錄疏櫜弓衣一名韜故納弓於衣謂韜弓肆陳也夏中國也又言明昭乎我周也既以慶讓黜陟之典式序在位之諸侯輯錄李迂仲曰孟子載廵守之事入其疆而慶讓行王制言不順不敬有黜地削爵之罰有功徳於民者有加地進律之賞凡此皆所以按諸侯之功罪而升黜之所謂式序在位也又收斂其干戈弓矢而益求懿羙之徳以布陳于中國懿徳者仁義禮智孝弟忠信之類皆是也懿徳雖人所固有然不講求則不明不布陳則不著此王者所以盡君師之道也則信乎王之能保天命也山川百神禮之而已諸侯来朝則必有以教告之故賞善罰惡以示勸懲偃武修文以圖寧謐使百辟畏威而懐徳天下去危而就安則天命之固可必矣保上天子我之意當如此曰實右序有周則信乎天之右序我也曰允王維后則信乎我之得天而為天下主也曰允王保之則信乎我之䏻保天命也以天自信則天猶在彼以保天命自信則天命在我矣或曰此詩即所謂肆夏以其有肆于時夏之語而命之也輯錄國語注云夏樂章之名時邁一章十五句增釋許氏曰廵狩諸國出以時動以禮昊天其必子愛我矣天之實右序有周何以見之廵以警諸侯則諸侯震懼而畢朝廵以祀鬼神而鬼神感格以致享若是則天實右序之而王信為天下之君矣又言我周之徳昭明燭下無隠慶讓黜陟式序在位皆得其當故戒征伐而不用敷徳教于中國若是則王信䏻保守天命而無失矣薄言震之莫不震疊朝㑹之事也懐柔百神及河喬嶽望祭之事也載戢干戈載櫜弓矢偃武也我求懿徳肆于時夏修文也春秋傳曰宣公十二年昔武王克商作頌曰載戢干戈而外傳又以為周文公之頌出周語則此詩乃武王之世周公所作也索隠曰周公謚曰周文公輯錄黄實夫曰時邁之作見武王所以得天下所以保天下者皆無愧也武王廵守之事詩有時邁書有武成時邁告祭之樂章也武成識其政事以示天下来世也庚戌柴望大告武成此告祭懐柔之實也昭我周王天休震動此莫不震疊之實也庶邦冡君暨百工受命于周此式序在位之實也偃武修文歸馬放牛此非戢櫜之意乎建官位事重民五教惇信明義崇徳報功此非懿徳以保之乎外傳又曰出魯語金奏肆夏樊遏渠天子以饗元侯也韋昭注云肆夏一名樊韶夏一名遏納夏一名渠即周禮九夏之三也鐘師掌金奏凡樂事以鐘鼔奏九夏王夏肆夏昭夏納夏章夏齊夏族夏陔夏驁夏杜子春云王出入奏王夏尸出入奏肆夏牲出入奏昭夏四方賔来奏納夏臣有功奏章夏夫人祭奏齊夏族人侍奏族夏客醉而出奏陔夏公出入奏驁夏此即所謂九夏也昭音韶齊音齋驁音敖吕叔玉云肆夏時邁也樊遏執競也渠思文也二説不同備參攷耳輯錄叔玉云肆遂也夏大也言遂於大位謂王位也樊多也遏止也言福禄止于周之多也渠大也言以后稷配天王道之大也執競武王無競維烈不顯成康上帝是皇賦也此祭武王成王康王之詩競强也言武王持其自强不息之心故其功烈之盛天下莫得而競剛健而加悠乆乃能成莫大之功武王承肅將之志十三年始一怒而安天下養勇非一日宜其功烈之無競矣豈不顯哉成王康王之徳亦上帝之所君也明徳如此宜乎上帝使居尊位矣亦字之義似輕而實重先王有非常之功後王有可尊之徳聖賢雖不同而創業守成皆可頌也自彼成康奄有四方斤斤紀覲反其明叶謨郎反斤斤明之察也言成康之徳明著如此也此則指言其不顯之實也繼明以照四方如此於先王何愧乎功徳足相稱則祭祀可相配矣武王功烈不待形容成康顯徳則有不容不言者故又特致詳如此鐘鼔喤喤華彭反叶胡光反磬筦音管將將七羊反降福穰穰如羊反喤喤和也將將集也穰穰多也言今作樂以祭而受福也此以下言今日致祭之事降福簡簡威儀反反既醉既飽福禄来反簡簡大也反反謹重也反覆也言受福之多而愈益謹重是以既醉既飽而福禄之来反覆而不厭也樂者格神之具神来格則降之福矣敬者受福之本敬以受福則福之降又無窮也執競一章十四句此昭王以後之詩祭三王無其例然武王有世室則必有專祭矣豈昭王以後祭武世室而配以成康歟借曰文世室無詩則夫子正樂於殘缺之餘但因所存者存之耳輯錄按中庸或問云如諸儒之説至其王時立武世室如劉歆之説至孝王時立武世室朱子亦以劉歆之説為然則是自昭王以下厯穆共懿孝四王而始有武世室也此或未然國語説見前篇如吕叔玉解國語則執競即樊遏而為周公所作矣然吕説未可深信朱子引之亦特備一説耳思文后稷克配彼天立我烝民莫匪爾極貽我来牟帝命率育叶曰逼反無此疆爾界叶訖力反陳常于時夏賦也思語詞文言有文徳也此所謂文乃謚法經天緯地之文也立粒通書曰烝民乃粒與此義同極至也徳之至也貽遺也来小麥牟大麥也率徧育養也言后稷之徳真可配天盖使我烝民得以粒食者莫非其徳之至也且其貽我民以来牟之種乃上帝之命以此徧養下民者是以無有逺近彼此之殊而得以陳其君臣父子之常道於中國也此疆爾界是即中國而言之謂由是而彛倫可叙於天下也舉中國則四海之内皆在其中矣立我烝民已見徳之至而舊榖既没新穀未升之時又貽之来牟以續食盖帝命以此徧養天下之民而稷䏻代天以養民也民生足食自有恒心稼穡既已徧養乎天下彛倫斯可徧叙於中國是其立生民之命開教化之源文徳之至而真可配天者于是見之矣或曰此所謂納夏者亦以其有時夏之語而命之也思文一章八句增釋吴師道曰天之於民育之以全其生教之以全其性而天所以命聖人者以此也聖人所以配天者亦以此也文者縂言后稷之徳莫匪爾極以全民之生者言陳常于時夏以全民之性者言也粒我者稷也命之者帝也後言陳常者富而教之也國語説見時邁篇清廟之什十篇十章九十五句周頌臣工之什四之二嗟嗟臣工敬爾在公王釐力之反爾成来咨来茹如預反賦也嗟嗟重平聲歎以深敕之也臣工羣臣百官也公公家也釐賜也成成法也茹度也此戒農官之詩先言王有成法以賜女女當来咨度也此一節總戒百官之詞百官皆有法守而皆宜敬守之教民稼穡尤有一定之法則又人人皆所當知也嗟嗟保介維莫音慕之春亦又何求如何新畬音余於音烏皇来牟將受厥明明昭上帝迄用康年命我衆人庤持恥反乃錢子淺反鎛音博奄觀銍殄栗反艾音刈保介見月令吕覽其説不同然皆為籍田而言盖農官之副也月令天子親載耒耜耤之於參保介之御間鄭氏云保介車右也吕氏春秋亦有此文髙誘曰保介副也莫春斗柄建辰夏正之三月也畬三嵗田也於皇嘆羙之詞来牟麥也明上帝之明賜也言麥將熟也迄至也康年猶豐年也衆人甸徒也甸治也謂凡治田之人也庤具錢銚音桃剗削之器鎛鉏皆田器也銍穫禾短鎌也艾穫也此乃言所戒之事此一節專戒農官之詞言三月則當治其新畬矣今如何哉新田用功最多故特問之然麥已將熟則可以受上帝之明賜夏麥者秋稼之占故與彼以明此而此明昭之上帝又將賜我新畬以豐年也新畬既受豐年則舊治之田可知於是命甸徒具農器以治其新畬而又將忽見其收成也始終皆以新畬言而舊治之田在其中既為農官當知農時及時用功當先其所難治者来牟可為續食之訃而西成又為卒嵗之謀彼可以受厥明於將然則此新畬之康年可知其必然天貺之足徴如此得不盡人力以待有秋乎臣工一章十五句噫嘻成王既昭假音格爾率時農夫播厥百穀駿𤼵爾私終三十里亦服爾耕十千維耦叶音擬賦也噫嘻亦歎詞也昭明假格也爾田官也時是駿大𤼵耕也私私田也三十里萬夫之地四旁有川内方三十二里有竒言三十里舉成數也此本鄭説有誤字孔氏云當作三十三里又餘百步百步者三分里之一也今按一里三夫十里三十夫三十里則九十夫又三里則九夫又三分里之一則一夫合為百夫縦横皆百夫則萬夫也耦二人並耕也此連上篇亦戒農官之詞昭假爾猶言格汝衆庶輯錄出湯誓盖成王始置田官而嘗戒命之也成王戒命之詞今日又以戒之爾當率是農夫播其百榖使之大𤼵其私田皆服其耕事農人各有其田而各以其力耕之但爾為農官則田即爾之田而耕即爾之事也萬人為耦而並耕也盖耕本以二人為耦今合一川之衆為言故云句萬人畢出并力齊心如合一耦也此必鄉遂之官司稼之屬輯錄見周禮地官其職以萬夫為界者溝洫用貢法無公田故皆謂之私昭格爾為農事也𤼵爾私則欲地利無不盡也服爾耕則欲人力無不齊也成王昭假於昔嗣王申戒於今周家重農事可謂以世繼世矣蘇氏曰民曰雨我公田遂及我私而君曰駿𤼵爾私終三十里其上下之間交相忠愛如此噫嘻一章八句臣工噫嘻非祭祀樂歌而入於頌盖頌體也抑豈祈年祈榖之時即其地以戒農官歟况或以此為豳頌則其列於頌也尤宜矣振鷺于飛于彼西雝我客戾止亦有斯容賦也振羣飛貌鷺白鳥雝澤也輯録王氏曰辟雍有水鷺所集也在西郊故曰西雍客謂二王之後夏之後杞商之後宋于周為客天子有事膰焉有䘮拜焉者也天子祭宗廟則歸之膰杞宋来弔䘮則拜以謝所謂作賔王家是也輯錄見左傳僖公二十四年此二王之後来助祭之詩言鷺飛于西雝之水而我客来助祭者其容貌脩整亦如鷺之潔白也親之曰我尊之曰客愛敬兼至以其先代之後也而徳容如此則又有可愛敬之實此即可喜之物以羙可喜之人二者非其類而若相類也或曰興也以可喜之物興可喜之人謂之興體亦可在彼無惡烏路反在此無斁叶丁故反庶㡬夙夜叶羊茹反以永終譽彼其國也在國無惡之者在此無厭之者無惡之者言皆愛之也無厭之者言皆敬之也在彼在此互言之以見無不愛敬之也盖非徳孚於人而無間者不䏻及此也如是則庶㡬其能夙夜以永終此譽矣庶㡬者望之之詞也先代之後又有徳容之羙而我誠愛敬之則既有若此之令名矣又願其徳容之羙常然而随處得人愛敬之庶㡬以日繼日而長保此令名也陳氏曰在彼不以我革其命而有惡於我知天命無常惟徳是與其心服也在我不以彼墜其命而有厭於彼崇徳象賢統承先王忠厚之至也崇徳者我尊崇其先聖王之徳也象賢者我以其象先聖王之賢也崇其徳象其賢而使之奉其先王之祭祀焉如陳氏説則有彼此相愛敬之意輯録通釋曰所引陳説在彼無惡之意與上文傳意微異故朱子初解舊本於此説之下有亦通二字振鷺一章八句上一節羙之也下一節祝之也喜幸之餘而致願望之意也豐年多黍多稌音杜亦有髙廩力錦反萬億及秭咨履反為酒為醴烝畀祖妣以洽百禮降福孔皆賦也稌稻也黍宜髙燥而寒稌宜下濕而暑黍稌皆熟則百穀無不熟矣亦助語辭數萬至萬曰億數億至億曰秭烝進畀予音與洽備皆徧也此秋冬報賽田事之樂歌盖祀田祖先農方社之屬也集傳初本作榖始登而薦於宗廟之樂歌改本作報賽田事之樂歌輔氏以初本為是趙氏以改本為是經文只言烝畀祖妣未嘗如甫田有以社以方以御田祖等語則似難捨經文而用小序之説也不知改本何以又用小序且其説又有序誤二字尤為可疑但今不敢質言特備兩説以俟明者言其收入之多至於可以供祭祀備百禮而神降之福將甚徧也從初本則自酒醴以至粢盛以及内羞黍稷之類所謂百禮也禮無不備則祖妣之降福將甚徧矣若從改本則天地山川鬼神不一祭祀之禮亦不一随處而得豐年之用則將随事而受豐年之福所以降福甚徧者莫非田祖先農方社之所致也集傳初本無收入之多以下數句豐年一章七句有瞽有瞽在周之庭賦也瞽樂官無目者也庭廟庭也輯錄鄭氏曰目無所見於音聲審也周禮上瞽四十人中瞽百人下瞽百六十人有眡瞭三百人相之序以此為始作樂而合乎祖之詩鄭氏曰合者大合諸樂而奏之輯錄濮氏曰王者功成作樂而始合奏于祖廟此工歌也兩句總序其事也設業設虡音巨崇牙樹羽應田縣鼓鞉音桃磬柷尺叔反圉魚女反既備乃奏叶音祖簫管備舉以上叶瞽字業虡崇牙見靈臺篇樹羽置五采之羽於崇牙之上也輯錄明堂位曰夏后氏之龍簨虡殷之崇牙周之璧翣陳氏曰殷人於簨之上施崇牙以挂鐘磬周人則又於簨上畫繪為翣戴之以璧下懸五采之羽而挂於簨之角焉應小鞞輯録鞞禆也裨助鼔節也田大鼔也鄭氏曰田當作􅉧音引小鼓也縣鼔周制也夏后氏足鼔殷楹鼔周縣鼔置鼔於趹上曰足鼔為楹貫鼔而樹之曰楹鼔植虡栒縣而撃之曰縣鼔鞉如鼓而小有柄兩耳持其柄而揺之則旁耳還自撃磬石磬也柷狀如漆桶輯錄方二尺四寸深一尺八寸以木為之中有椎連底挏之挏音動撞之令平聲左右撃以起樂者也圉亦作敔狀如伏虎背上有二十七鉏鋙刻為鉏鋙刻者凡二十有七也以木長尺擽之擽音厯捎也掠也輯錄書疏云擽即戞也以止樂者也輯錄柷方二尺四寸隂也敔二十七鉏鋙陽也樂作陽也以隂數成之樂止隂也以陽數成之固天地自然之理也聲之所出以虚為本控以空然後可撃及其止則歸實焉故敔為伏虎之形則實而已控苦江反簫編小竹管為之管如篴即笛字併兩而吹之者也此皆堂下之樂也鼔以主乎衆音磬以收乎衆音柷以起樂圉以止樂既皆言之而又曰備乃奏又至於簫管之細亦備舉焉則餘不言者在其中矣喤喤音横厥聲肅雝和鳴先祖是聽我客戾止永觀厥成以上叶庭字我客二王後也觀視也成樂闋也闋苦穴反樂之一終也如簫韶九成之成楚辭觀者澹兮忘歸即永觀厥成之意肅齊也嚴肅所謂皦如是也不齊則亂故以肅言獨言二王後者猶言虞賔在位我有嘉客輯錄益稷蔡氏曰虞賔丹朱也盖尤以是為盛耳樂以導和者也然先代之後有興亡之感其和最為難至今也我客永觀之則其心之和可知矣輯錄通釋曰虞賔在位則舜之作樂以此為盛我有嘉客則商人作樂以此為盛我客戾止則周人作樂以此為盛也解頥曰樂聲喤喤而和鳴故先祖是聽幽有以感乎神也我客戾止永觀厥成明有以感乎人也有瞽一章十三句作樂有其人樂作備其器故聲音極和而神人無不和此一詩之大㫖也猗於宜反與音余漆沮七余反潜有多魚有鱣張連反有鮪叶于軌反鰷音條鱨音常鰋音偃鯉以享以祀叶逸織反以介景福叶筆力反賦也猗與歎詞潜槮音滲也盖積柴養魚使得蔵隠避寒因以薄圍取之也或曰蔵之深也鰷白鰷也輯錄鱣鮪見衛碩人鱨鰋見小雅魚麗鯉見陳衡門埤雅鰷形狭而長若條性浮似鱨而白月令季冬命漁師始漁天子親往乃嘗魚先薦寢廟季春薦鮪于寢廟此其樂歌也鄭氏曰冬魚性定春鮪始来故此時薦之輯錄孔氏曰冬月既于魚不行孕性定而肥充則衆寒魚皆可薦春惟獻鮪而已潜一章六句有来雝雝與公叶篇内同至止肅肅相息亮反維辟音璧公天子穆穆賦也雝雝和也肅肅敬也相助祭也辟公諸侯也穆穆天子之容也輯錄朱子曰其助祭者公侯其主祭者天子也此武王祭文王之詩言諸侯之来皆和且敬以助我之祭事輔氏曰不和則有勉强之心不敬則有怠惰之意愚謂来雝雝至肅肅者互言以見和敬之兼盡也和敬兼盡則嚴而㤗和而節禮有全體而徳容無所病矣而天子有穆穆之容也輔氏曰此形容其一時致祭之氣象也愚按穆穆訓深逺則有儼而静之意盖駿奔走執豆籩皆有其人王無為也見其容貌氣象如此而已是則有助祭者之肅雝然後有主祭者之穆穆也盖欲歸功于助祭之諸侯故其詞如此於音烏薦廣牡相同上予肆祀叶養里反假古雅反哉皇考叶音口綏予孝子叶奬里反於歎詞廣牡大牲也輯錄王氏曰碩大肥腯之謂也肆陳假大也皇考文王也綏安也孝子武王自稱也言此和敬之諸侯薦大牲以助我之祭事而大哉之文王庶其享之以安我孝子之心也必頼諸侯助祭然後可以格神明而安孝子也此當神未降時故曰庶其享之則知主祭者致望之之詞如此對辟公言則曰天子對皇考言則曰孝子語意各有所主故不同宣哲維人文武維后燕及皇天叶鐵因反克昌厥後宣通哲知燕安也此羙文王之徳至此則既右享之洋洋如在故極其形容以賛羙之宣哲則盡人之道輔氏曰人惟萬物之靈故通知則盡人之道愚謂通則無所窒知則無所蔽是聰明睿知人道之盡也文武則備君之徳文經邦武定亂能文能武人君之徳備矣故能安人以及于天輔氏曰人道立則天道成故能安人則安及於天也而克昌其後嗣也燕及皇天而天眷之故其效如此宣哲文武皆徳也聖徳盛則治功大治功大則福澤深理固然耳蘇氏曰周人以諱事神文王名昌而此詩曰克昌厥後何也曰周之所謂諱不以其名號之耳夏商之君不諱名如此啓與太甲之類皆名也不遂廢其文也諱其名而廢其文者周禮之末失也輯錄李迂仲曰周人以諱事神者如稱文王則不敢斥之曰文王昌書稱惟爾元孫某史官不敢斥其名故也如穆王名滿當時亦有王孫滿襄王名鄭當時亦有衛侯鄭魯武公名敖而後世之臣有公孫敖觀此則知此詩克昌厥後噫嘻言駿𤼵爾私皆未嘗諱也孔子作春秋如匡王名班而書曺伯班簡王名夷而書晉侯夷吾皆未嘗諱綏我眉夀叶殖酉反介以繁祉既右音又烈考叶音口亦右文母叶滿彼反右尊也周禮所謂享右祭祀是也見太祝我將既右享之亦是此意烈考猶皇考也文母大姒也言文王昌厥後而安之以眉夀助之以多福使我得以右于烈考文母也安之以夀助之以福康强逄吉天下又安故祭祀之禮無遺典此克昌厥後而致然也雝一章十六句此詩凡四節前兩節歸重於諸侯助祭之功後兩節歸重於文王有徳之福周禮樂師及徹帥學士而歌徹輯錄樂師注學士國子也説者以為即此詩論語亦曰以雍徹然則此盖徹祭所歌而亦名為徹也載見賢遍反下同辟音璧王曰求厥章龍旂陽陽和鈴央央於良反鞗音條革有鶬七羊反休有烈光賦也載則也𤼵語辭也章法度也法度泛以朝廷典禮言交龍曰旂陽明也軾前曰和旂上曰鈴央央有鶬皆聲和也鞗革見蓼蕭休羙也此諸侯助祭于武王廟之詩先言其来朝禀受法度其車服之盛如此盛其車服者重王事顯君賜也率見昭考以孝以享叶虚良反昭考武王也廟制太祖居中左昭右穆周廟文王當穆武王當昭故書稱穆考文王而此詩及訪落皆謂武王為昭考輯録通釋曰后稷為始封之君其廟居中自二世為昭三世為穆遞數至十五世而文王廟次當穆十六世而武王廟次當昭也此乃言王率諸侯以祭武王廟也清廟祭文王載見祭武王皆因朝諸侯而率以祭也諸侯来朝供常職耳而受朝之君愴然有感於先王故率之以供祭是因其載見辟王所以率見昭考也言祀事之行非徒以合人心之和正所以一人心之敬也是則一代之典章寓焉諸侯因朝覲而求遵守之規王者因致祭而示忠敬之意此詩意也以介眉夀永言保之思皇多袩後五反烈文辟公綏以多福俾緝熈于純嘏叶音古思語辭皇大也羙也又言孝享以介眉夀而受多福永言保之只是長有之意以介眉夀則長有多祜矣是皆諸侯助祭有以致之使我得繼而明之以至于純嘏也綏以多福即介眉夀而保多祜者是已緝熈于純嘏則明融髙朗又以漸進而氣象尤為極盛矣意謂祭祀而得長有具福是皆諸侯所錫之福使我因此福而馴致乎大福也盖歸徳于諸侯之詞猶烈文之意也因諸侯来朝而使之助祭因諸侯助祭而得以受福大抵宗廟祭祀每以諸侯助祭為重觀此及清廟雝詩可見夫使王靈不振諸侯倔强不朝欲其有助祭之事也得乎宜其以自頌也載見一章十四句諸侯載見天子則因其入覲而有儀天子率見先王則賴其助祭而受福有客有客亦白其馬叶滿補反有萋有且七序反敦都回反琢其旅賦也客微子也輯錄曹氏曰微盖商圻内國名子爵也周既滅商封微子於宋以祀其先王而以客禮待之不敢臣也輯錄孔氏曰客止一人而重言之是丁寧殊異以尊大之也亦語辭也殷尚白修其禮物仍殷之舊也輯錄蔡氏曰修其典禮文物不使廢壊以備一代之法也萋且未詳傳曰敬慎貌敦琢選擇也旅其卿大夫從去聲行者也此微子来見去聲祖廟之詩而此一節言其始至也先代之後禮物不與時王同作賔王家文獻有足徴也而又敬慎威儀選擇從者其来之不苟如此則所以尊時王重祀事者至矣有客宿宿有客信信言授之縶陟立反以縶其馬同上一宿曰宿再宿曰信宿宿者宿而又宿信信者信而又信縶其馬愛之不欲其去也此一節言其將去也薄言追之左右綏之既有淫威降福孔夷追之已去而復還之愛之無已也左右綏之言所以安而留之者無方也無處不盡安之之道無事不為留之之計所謂安而留之無方也淫威未詳舊説淫大也統承先王用天子禮樂所謂淫威也夷易也大也易者不難之義但訓大則於義尤切盖大福與淫威語勢相對此一節言其留之也時王之㤙禮所謂福也爾有非常之威儀則此有非常之寵遇何以不屑而去之乎有客一章十二句萋且敦琢以見祖廟敬也尊之之詞不一而足留之之意又不一而足敬愛之兼備也有客一詩既足以見微子之賢尤足以見周家之厚於音烏皇武王無競維烈允文文王克開厥後嗣武受之勝殷遏劉耆音指定爾功賦也於歎辭皇大遏止劉殺耆致也周公象武王之功為大武之樂以不殺為武斯為武之大言武王無競之功實文王開之而武王嗣而受之勝殷止殺以致定其功也允文者言其實有此文徳也武王之功無與為比然豈無所受哉以實有文徳之文王而将天威則能用不殺之武開其後矣武王承父之志故舉兵誅討其餘不戮一人而功業遂於大定斯正以實有之文徳而成不殺之武功也輔氏謂父子一心文武一道其説當矣李氏曰武諡在於止殺武一章七句春秋傳以此為大武之首章也説見宣公十二年大武周公象武王武功之舞歌此詩以奏之禮曰朱干玉戚冕而舞大武輯錄明堂位注朱干赤盾也玉戚玉飾斧柄也着衮冕而執此干戚以舞武王伐紂之樂然傳以此詩為武王所作則篇内已有武王之謚而其説誤矣當是周公作于成王之時説見桓詩天作頌太王而下及文王武頌武王而上及文王盖太王之功非文王無以底于成武王之功非文王無以肇其始此可以見文王功徳為最盛也臣工之什十篇十章一百六句周頌閔予小子之什四之三閔予小子遭家不造叶徂候反嬛嬛其傾反在疚音救於音烏乎音呼皇考叶袪候反永世克孝叶呼候反賦也成王免䘮始朝于先王之廟而作此詩也閔病也予小子成王自稱也造成也輯録輔氏曰閔字與下疚字相應周至成王之時可謂成矣而曰遭家不造者王業雖成天下雖治而成王之心常若未成未治也如此然後䏻保其成若自謂已成已治則殆矣嬛與煢同無所依怗之意疚哀病也匡衡曰煢煢在疚言成王䘮畢思慕意氣未能平也此釋煢煢在疚之意盖所以就文武之業崇大化之本也此𤼵免䘮朝廟之意就者追而及之大化之本則以孝道言也皇考武王也歎武王之終身能孝也念兹皇祖陟降庭叶去聲止維予小子夙夜敬止皇祖文王也承上文言武王之孝思念文王常若見其陟降於庭猶所謂見堯於墻見堯於羮也見後漢李固傳楚詞云三公揖讓登降堂只與此文勢正相似大招篇本作三公穆穆而匡衡引此句顔注亦云若神明臨其朝廷是也匡衡疏曰成王思述文武之道以養其心休烈盛羙歸之二后是以上天歆享鬼神佑焉其詩曰念我皇祖陟降庭止師古曰此言成王常念文武之徳奉而行之故鬼神上下臨其朝廷也今按師古觧匡衡之説亦略與詩意不同故朱子加一若字於乎二字同上皇王繼序思不忘皇王兼指文武也承上文言我之所以夙夜敬止者思繼此序而不忘耳敬則無間斷故䏻思之不忘武王所以永世克孝者以其盡孝思之誠也成王敬以承之繼文武之序而思之亦欲如武王之念文王也敬以夙夜而思不忘亦欲如武王之永世克孝也免䘮朝廟之際其心慨然欲不重歎之不可得矣閔予小子一章十一句此成王除䘮朝廟所作疑後世遂以為嗣王朝廟之樂後三篇放此訪予落止率時昭考於音烏乎音呼悠哉朕未有艾五盖反將予就之繼猶判渙維予小子未堪家多難乃旦反紹庭上下陟降厥家休矣皇考以保明其身賦也訪問落始輯錄曹氏曰凡宫室始成則落之故以落為始悠逺也艾如夜未艾之艾判分渙散保安明顯也輯錄王氏曰保安則無危亡之憂明顯則無昏塞之患成王既朝音潮于廟因作此詩以道延訪羣臣之意言我將謀之於始涖政之始以循我昭考武王之道然而其道逺矣予不能及也將使予勉强上聲以就之而所以繼之者猶恐其判渙而不合也跂之而不可及就之而不可合武王之道逺矣所謂化不可為者此也則亦繼其上下於庭陟降於家庶幾賴皇考之休有以保明吾身而已矣成王咨訪羣臣以率武王之道再三致其仰望弗逮之詞而所以率之者惟在紹庭上下陟降厥家而已外而在庭内而在家言行政事皆可師法於此紹之則尚賴皇考之休而有以保明其身矣保其身而使之安明其身而使之顯則武王之道跂之而或可及就之而或可合家之難或可以勝也此則成王之志也増釋許氏曰紹庭上下欲法武王之正朝廷也陟降厥家欲法武王之齊其家也保明其身欲賴武王助其修身也成王之學有本末先後矣訪落一章十二句説同上篇敬之敬之天維顯思叶新夷反命不易以反䜴哉叶奬黎反無曰髙髙在上陟降厥士日監在兹叶津之反賦也顯眀也思語辭也士事也成王受羣臣之戒而述其言曰敬之哉敬之哉天道甚明其命不易保也天以主宰言命以其所福祚言其實一而已輯錄嚴氏曰禍福不爽予奪無常李迂仲曰善則福之淫則禍之栽者培之傾者覆之天之道盖顯矣故其命靡常所以為不易也無謂其髙而不吾察當知其聰明明畏輯錄注見大雅文王小序常若陟降於吾之所為而無日不臨監于此者陟降厥士無事不然日監在兹無時不然不可以不敬也天有顯道故其命難保觀天道降監之妙不逺而甚邇如此則其顯且不易者信然而當重加畏天之功矣大雅板之末章與此詩相似但此則敬于未怒未變之時彼則敬於既怒既變之後顯思不易其怒且變者正不難耳維予小子旪奬里反不聰敬止日就月將學有緝熈于光明叶謨郎反佛符弗反又音弼時仔音兹肩示我顯徳行下孟反叶户郎反將進也佛弼通仔肩任也此乃自為荅之之言曰我不聰而未䏻敬也然願學焉庶幾日有所就成也月有所進續而明之以至于光明又賴羣臣輔助我所負荷之任而示我以顯明之徳行則庶乎其可及爾及者及於聰敬之地聰與不聰係於學不聰則窒於物而不䏻敬必日新又新緝熈不已然後可以漸去其窒而馴至于光明光明即是聰而聰則無不敬也但功夫至此最為難明非羣臣輔助而示以顯徳行則光明不可至盖以爾昭昭使我昭昭乃可期于有成也夫羣臣進戒欲成王之敬天成王求助惟欲持敬以敬天䏻敬乎天則天雖顯而命可保矣敬之一章十二句輯錄陳定宇曰戒王以天之當敬者臣之忠也荅羣臣以未能敬者君之謙也憂其未䏻敬而内為學於己外求助於臣是即求所以盡此敬也學求造于光明而臣復示我以徳之顯明則天不在髙髙在上之天而在吾心之天矣其為敬天孰大于是予其懲直升反而毖後患莫予荓普經反蜂自求辛螫施隻反肇允彼桃蟲拚芳煩反飛維鳥未堪家多難乃旦反予又集于蓼音了賦也懲有所傷而知戒也毖慎荓使也蜂小物而有毒肇始允信也桃蟲鷦鷯小鳥也拚飛貌鳥大鳥也鷦鷯之雛化而為鵰故古語曰鷦鷯生鵰言始小而終大也輯錄陸氏曰説苑云鷦鷯巢於葦苕繋之以髮其巢至精宻以麻紩之如刺襪然故一名襪雀化輙為鵰埤雅曰俗呼巧婦一名工雀一名女匠蓼辛苦之物也此亦訪落之意成王自言予何所懲而謹後患乎荓蜂而得辛螫信桃蟲而不知其䏻為大鳥此其所當懲者盖指管蔡之事也然我方幼冲未堪多難而又集于辛苦之地羣臣奈何捨我而弗助哉有所懲于前故有所謹于後有所悔于已故有所賴于人徳慧術智恒存乎疢疾信哉輔氏曰此詩悔之極反之至憂之深慮之逺求助之意雖不言而可見矣小毖一章八句蘇氏曰小毖者謹之於小也謹之於小則大患無由至矣閔予小子之思念文武訪落之專法武王敬之勉於學問以敬天小毖懲其往事以謹患而皆有皇皇不及之意焉四篇盖一時詩也載芟載柞側百反叶疾各反其耕澤澤音釋叶徒洛反賦也除草曰芟除木曰柞秋官柞氏掌攻草木是也輯錄薙氏掌殺草秋繩而芟之注含實曰繩芟其繩則不成熟矣繩音孕澤澤解音蟹散也凍塗釋土膏動故觧散千耦其耘徂隰徂畛音真耘去苗閒草也輯錄謝氏曰去其稂莠稊稗之類隰為田之處也畛田畔也以上四句自墾辟耕治以至耘苗為一節侯主侯伯侯亞侯旅侯彊侯以有嗿他感反其饁于輙反思媚其婦有依其士與以叶有略其耜叶養里反俶載南畝叶滿委反主家長上聲也伯長子也亞仲叔也旅衆子弟也彊民之有餘力而来助者遂人所謂以彊予上聲任平聲甿氓同者也注云彊予謂民有餘力復予之田若餘夫然愚按如此則受餘力之田者以其人强壯治一夫之田仍有餘力也故曰彊予謂之任甿者言以此輩供農民之用也能左右之曰以太宰所謂閒音閒民轉移執事者太宰云間民無常職轉移執事注云無事業也若今時傭力之人随主人所左右者也使之左則左使之右則右嗿衆飲食聲也媚順依愛士夫也言餉婦與耕夫相慰勞去聲也輯錄嚴氏曰夫耕婦饁驩然相愛見治世之氣象焉略利俶始載事也此又覆言耕治之時然將言耕治而先以主伯亞旅彊以具言之見東作事殷農人輩作如此而人力齊天倫和于耜舉趾及時事事于此數語可見播厥百穀實函斯活叶呼酷反函含活生也既播之其實含氣而生也此播種以至萌芽之時驛驛其達叶佗悦反有厭其傑驛驛苗生貌達出土也此生出之時厭受氣足也傑先長者也此長未齊之時厭厭其苗緜緜其麃表驕反緜緜詳宻也麃耘也此已盛當耘之時此十四句又自耕田播種苗生苗長以及耘苗為一節載穫濟濟子禮反有實其積子賜反叶上聲萬億及秭為酒為醴烝畀祖妣以洽百禮濟濟人衆貌實積之實也積露積去聲也此言豐年之利足以供祭祀者如此有飶蘭即反其香邦家之光有椒其馨胡考之寧飶芬香也未詳何物胡夀也輯錄胡氏曰楚辭云桂酒椒漿古人以椒釀酒以扶髙年養疾病疏諡法保民耆艾曰胡以燕享賔客則邦家之所以光也豐盈氣象在于養賢有賢而無以養之則國不可以為國矣以共養去聲耆老則胡考之所以安也酒食所以養老者之體也此言豐年之利足以尊賢養老者又如此而連上文十句為一節匪且有且匪今斯今叶音經振古如兹無韻未詳且此振極也言非獨此處有此稼穡之事非獨今時有今豐年之慶盖自極古以来已如此矣猶言自古有年也此三句自為一節耕耘收穫稼穡之事也蓄積之厚用度之周豐年之慶也三句又因此時此處之所有而推言普天之下自古以来無不有盖極其頌羙之詞也載芟一章三十一句此詩未詳所用然辭意與豐年相似其用應亦不殊下篇放此初本無其用應亦不殊一句改本無下篇放此一句今按無上句則不足以定此詩之用無下句則不足以定後篇之用必合二本而兩存之則或祭宗廟或報田祖先農方社而三詩所用無不同矣畟畟楚反側良耜叶養里反俶足叔反載南畝叶蒲委反賦也畟畟嚴利也嚴利者嚴整而銛利也此耕治之事播厥百穀實函斯活叶呼酷反説見前篇此播種之事或来瞻女音汝載筐及筥其饟式亮反伊黍或来瞻女婦子之来饁者也饁饁耘者也筐筥饟具也此以下八句耘耔之事輯錄饟與餉炊同自家之野謂之餉謝氏曰其餉則以黍飯也其笠伊糾叶其了反其鎛音博斯趙直了反以薅呼毛反荼蓼糾然笠之輕舉也趙刺棘芒為刺刺猶利也薅去上聲也荼陸草蓼水草一物而有水陸之異也今南方人猶謂蓼為辣盧反達荼或用以毒溪取魚即所謂荼毒也荼蓼朽止黍稷茂叶莫口反止毒草朽則土熱而苗盛穫之挃挃珍栗反積之栗栗其崇如墉其比毗志反如櫛側瑟反以開百室挃挃穫聲也栗栗積之宻也櫛理髮器言宻也百室一族之人也五家為比五比為閭四閭為族輯錄見地官大司徒比毗志反族人輩作相助故同時入穀也輩作者同輩共作也一族如此每族皆然可知事此以下皆收穫以後百室盈止婦子寧止盈滿寧安也民富而安天下之福也豐年之所賜者如此輯錄謝氏曰農夫終嵗勤動婦子有饁畝之勞不得安逸今農功已畢皆得閒暇農夫之心安婦子之心亦安也殺時犉如純反牡有捄音求其角叶盧谷反以似以續續古之人無韻未詳黄牛黑唇曰犉小序以此詩為秋報社稷之詩孔疏社稷用黝牛當以黑而社為土神又當以黄故用黄牛黒唇之犉愚謂此詩若從朱子初本以為宗廟樂歌則周人用騂牡赤黄曰騂黄騂曰黄犉者騂之近色也詩人特變其文如此耳亦可通矣捄曲貌續謂續先祖以奉祭祀先祖嘗奉祭祀矣我奉祭祀以續先祖之事耳耕耘收穫而得有年斂藏蓄積以安衆志家給人足本固邦寧所願遂矣祭祀可廢先人之禮乎以似以續宜其汲汲然而不敢緩也此良耜一詩之大㫖也良耜一章二十三句載芟良耜皆頌農功而已然農功之有成即神貺之所在也若為宗廟樂歌則豐年載芟烝畀祖妣良耜續古之人詩人之意尤為明白而易見周禮籥章凡國祭蜡則撃土鼓龡豳頌以息老物王氏以為亡之或疑思文臣工噫嘻豐年載芟良耜等篇即所謂豳頌者其詳見於豳風及大田篇之末亦未知其是否也絲衣其紑孚浮反載弁俅俅音求自堂徂基自羊徂牛鼐乃代反鼎及鼒叶津之反兕觥其觩音求㫖酒思柔不呉音話不敖音傲胡考之休賦也絲衣祭服也紑潔貌載戴也弁爵弁也士祭於王之服大夫以上戴冕士則爵弁而已輯錄疏爵弁之服𤣥衣纁裳皆以絲為之故云絲衣也士冠禮注云爵弁其色赤而微黑如爵頭然俅俅恭順貌基門塾之基門側之堂謂之塾疏云廟門外西夾室之堂基也按圖門之中間為正門左右兩間各為内外塾外塾南向内塾北向塾前之地為基此盖門内西塾前之基地即堂下之南隅與西階相直處也鼐大鼎鼒小鼎也思語辭柔和也吳譁也此亦祭而飲酒之詩頌無飲酒之詩而儀禮特牲祭之前夕宗人視濯視牲厥明乃祭賔三獻尸之後主人遂獻賔及宗人宗人即前視濯視牲者此諸侯士之祭也豈天子宗廟之祭則以烈文獻顯相以絲衣獻視濯視牲者與此若可以類推矣言此服絲衣爵弁之人絲衣紑然爵弁俅然此齊明盛服之謂也升門堂視壺濯籩豆之屬祭祀設洗于阼階東南壺禁在東序籩豆鉶在東房凡席兩敦在西堂盖升自西階至東序入東房乃及西堂也降往於基告濯具此則降自西階至西階之南方東北面以濯具告主人也盖此時主人在阼階下東北上故東北面而告之壺及籩豆之類告濯几席不洗者告具而已又視牲從羊至牛反告充牲在門外故反告之反者復其故䖏也充猶肥也已句乃舉鼎冪音覓告潔鼎亦在門外鼎正當門居牲北牲居鼎南少近西禮之次也行禮有其序如此又䏻謹其威儀不諠譁不怠傲飲酒有其禮如此故䏻得夀考之福此則其交也向之視濯視牲今之獻酬飲酒始終一於禮而無違其享遐福必然也絲衣一章九句此詩或紑俅牛觩柔休並叶基韻或基鼒並叶紑韻於音烏鑠式灼反王師遵養時晦時純熈矣是用大介我龍受之蹻蹻居表反王之造叶沮候反載用有嗣叶音祠實維爾公允師賦也於歎辭鑠盛遵循循順也順此時勢也語倒熈光介甲也所謂一戎衣也龍寵也蹻蹻武貌造為載則公事允信也此亦頌武王之詩言其初有於鑠之師而不用退自循養與時皆晦既純光矣天命方新王業昌盛光輝赫奕有不可揜此純光之時也然後一戎衣而天下大定後人於是寵而受此蹻蹻然王者之功其所以嗣之者亦維武王之事是師爾武王之師盛矣然時止則止時行則行動静不失其時是以武功之成如此我既受此成功矣一有用武而繼其事則将如之何哉亦曰必以其時如武王耳輔氏曰後王之用武也不先時而動不後時而靡是則能師武王矣酌一章八句此篇重在時字武頌止殺酌頌適時盖窮兵黷武不足以為武違天悖時不足以成功可謂頌所當頌矣酌即勺也内則十三舞勺即以此詩為節而舞也然此詩與賚般音盤皆不用詩中字名篇疑取樂節之名如曰武宿夜云爾武宿夜大武别名禮記云舞莫重於武宿夜注武曲名正義云武王至商郊止宿夜士卒皆歡樂歌舞以待旦故名輯錄嚴氏曰酌其時措之宜也姑存之綏萬邦屢力注反豐年天命匪解佳賣反桓桓武王保有厥士于以四方克定厥家於音烏昭于天皇以間之賦也綏安也桓桓武貌大軍之後必有凶年輯錄見老子儉武篇而武王克商則除害以安天下故屢獲豐年之祥武王在天子位凡十七年傳所謂周饑克殷而年豐輯錄左傳僖公十九年寗荘子云是也武王用兵之効如此然天命之於周乆而不厭也故此桓桓之武王桓桓有不息之意猶曰執競云耳保有其士保有者信之專任之乆也而用之於四方以定其家綏萬邦者㑹朝清明萬姓恱服之日也定厥家則國勢確乎不拔建官位事而致垂拱之治矣其徳上昭于天也間字之義未詳傳曰間代也言君天下以代商也於昭于天皇以間之則徳益顯位益固矣武王用賢之效又如此此亦頌武王之功綏萬邦屢豐年征伐之當天心可驗矣然天又不惟應以豐年而遂止也所以眷之者不已使其任賢亦不已用以經營天下大定乃致武王之徳益昭于天而君天下以代商也詩意本謂武王于代商之後不以休祥而替用賢之心故其效驗之餘又得效驗如此耳而必本諸匪解之命者以見聖人之所為莫非天也桓一章九句春秋傳以此為大武之六章則今之篇次盖已失其舊矣又篇内已有武王之諡則其謂武王時作者亦誤矣朱子謂今之篇次已失其舊則似以左傳之説為是又舉武王二字言具誤則又以左傳之説為非大抵左氏多不可信朱子引之特備一説耳武桓二詩皆然則賚詩亦當以此類推也序以為講武類禡馬嫁反之詩豈後世取其義而用之於其事也歟維清天作武酌桓及昊天有成命六詩同一類正所謂以成功告于神明者也文王既勤止我應受之敷時繹思我徂維求定時周之命於音烏繹思賦也應當也敷布時是也繹尋繹也於嘆辭繹思尋繹而思念也上繹思指言其所事之可繹思者下繹思是欲其繹思之也此頌文王之功而言其大封功臣之意也諸本王字作武字誤盖首句是頌文王之功其下五句則言今日大封功臣之意朱子不取左傳之説故下文以其子孫三字貼我字特泛指當時大封之君而言于武王無與也言文王之勤勞天下至矣其子孫受而有之然而不敢專也布此文王功徳之在人而可繹思者尺寸之地皆文王功徳而可繹思之實也以賚有功而往求天下之安定又以為凡此皆周之命而非復商之舊矣遂歎羙之而欲諸臣受封賞者繹思文王之徳而不忘也文王功徳我當受之今乃以其功徳敷布於人者正以圖謀治功爾然則爾諸侯既受今日之恩其可忘哉我受艱難之業行封賞惟欲安定乎天下爾受賚予之命為諸侯尤當思念乎文王也賚一章六句春秋傳以此為大武之三章桓詩有武王字以為大武之六章猶可此詩無武王字而以為大武之三章則未必然也而序以為大封於廟之詩説同上篇於音烏皇時周陟其髙山嶞吐果反山喬嶽允猶翕許及反河敷天之下裒蒲侯反時之對時周之命賦也髙山泛言山耳嶞則其狭而長者喬髙也嶽則其髙而大者嶞山喬嶽即髙山而疊言之耳山言嶞嶽言喬則山之髙者至此極矣允猶未詳或曰允信也猶與由同翕河河善泛溢善多也今得其性故翕而不為暴也翕收斂也允猶翕河猶言泛河水之安流也裒聚也對荅也言羙哉此周也亦自歌者而頌之也其廵守而登此山以柴望又道於河以周四嶽嶞山喬嶽指一䖏言允猶翕河則四嶽皆徧矣言此以見嶽瀆具徧而勞之甚也凡以敷天之下莫不有望於我故聚而朝之方嶽之下以荅其意耳時周之命義見上篇故傳不重釋廵行祭告朝覲諸侯涉險與逺非徒然也吾王不㳺吾何以休吾王不豫吾何以助以天下之人心仰望如此得不有以荅之乎斯命也周天子之命也政令方新典章文物不相沿襲臣民宜知所更化矣般音盤一章七句般義未詳此與時邁同一類皆朝㑹祭告之樂歌也輯錄曹氏曰般取盤旋之義蘇氏曰般㳺也閔予小子之什十一篇一百三十六句詩經疏義㑹通卷十九
