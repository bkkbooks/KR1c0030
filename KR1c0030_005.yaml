body:
  text: 詩經疏義會通卷三元朱公遷撰鄘一之四説見上篇泛彼柏舟在彼中河髧徒坎反彼兩髦音毛實維我儀叶牛何反之死矢靡他湯河反母也天叶鐵因反只音紙下同不諒人只興也中河中於河也髧髮垂貌兩髦者翦髮夾囟音信廣韻注曰頭會腦蓋也子事父母之飾親死然後去之輯録昭武黃氏曰禮記內則拂髦注用髮為之象幼時鬌鬌注所遺髮也謂留髮為角子者也喪大記脫髦注幼時剪髮為之年長垂著兩邉髦然也明人之至親惟有孺子之義父死脫左髦母死脫右髦親沒不髦孔氏諸侯小斂脫髦士既殯脫髦此蓋指共伯也我共薑自我也輯録共伯名餘共諡伯字婦人從夫諡薑姓也儀匹之至矢誓靡無也只語助辭諒信也舊説以為衛世子共伯蚤死共伯釐侯子武公兄其妻共薑守義父母欲奪而嫁之輯録奪者欲奪其守義之志也故共薑作此以自誓言柏舟則在彼中河兩髦則實我之匹雖至於死誓無他心舟在中河而無他適之地我配兩髦而無他適之心物冇定所人冇定志而用彼我二字相呼應也母之於我覆育之恩如天罔極而何其不諒我之心乎不及父者疑時獨母在或非父意耳莊薑盡禮無懟心共薑守義無二志故二柏舟為弼鄘之首又共薑當釐侯時釐侯去康叔九世耳其子為武公其孫為莊公變始於二薑時也次第亦當然也輯録輔氏曰實維我匹一定而決不可易也之死矢靡他雖死而誓不敢易也夫母之欲嫁共薑想亦不過是惑於愛而慮其終耳今味共薑自誓之言其至誠貞固之意如此則母之惑可解而慮可釋矣泛泛柏舟在彼河側髧彼兩髦實維我特之死矢靡慝他得反母也天只不諒人只興也特亦匹也輯録朱子曰特有孤特之義而以為匹者古人用字多如此猶治之為亂也慝邪也以是為慝則其絶之甚矣增釋張氏曰他他適也慝邪之匿於心者也他適而誓之死靡為之其事猶顯至於一念邪思之微亦誓之死而靡發可見其心之貞固而節不渝矣柏舟二章章七句自誓之意以漸而深輯録真氏曰柏舟之不再適蓋婦人之大節故孔子列之使萬世取法焉程子之謂餓死事極小失節事極大可為後世深戒陳定宇曰衛之淫風流行而有共薑特立之節真可以遏人欲之橫流矣讀此詩者豈不可以感發人之善心乎解頥曰女子之生以身事人一與之齊終身不改古之制也共薑之守義裁以古制雖婦道之當然耳斯可見人心天理之未嘗泯也亦豈不足以挽風俗之衰扶綱常之重則其置之鄘風之首亦宜矣牆有茨不可掃叶蘇后反也中冓古候反之言不可道叶徒厚反也所可道也言之醜也興也茨蒺藜也蔓生細葉子有三角刺人輯録埤雅蒺藜布也蔓生子有三角刺人狀如菱而小一名茨中冓謂舍之交積材木也輯録中冓之言若曰閨閫之言也道言醜惡也舊説以為宣公卒惠公幼其庶兄頑蒸於宣薑輯録左傳閔公二年昭伯蒸宣薑生齊子戴公文公宋桓許穆夫人注惠公朔蓋年十五六昭伯即公子頑宣公之長庶伋之兄也上淫曰蒸故詩人作此詩以刺之言其閨中之事皆醜惡而不可言理或然也牆茨芒刺不可掃內言醜惡不可道是皆無所施其惡惡之心者而用語勢相呼應也牆有茨不可襄也中冓之言不可詳也所可詳也言之長也興也襄除也詳詳言之也言之長者不欲言而託以語長難竟也牆有茨不可束也中冓之言不可讀也所可讀也言之辱也興也束束而去之也讀誦言也辱猶醜也輯録輔氏曰辱深於醜牆有茨三章章六句反覆譏刺楊氏曰公子頑通乎君母閨中之言至不可讀其汙甚矣聖人何取焉而著之於經也蓋自古淫亂之君自以為密於閨門之中世無得而知者故自肆而不反聖人所以著之於經使後世為惡者知雖閨中之言亦無隱而不彰也其為訓戒深矣輯録輔氏曰楊氏之説蓋不獨為此篇發凡聖人所録淫亂之詩其意皆如此即先生所謂惡者可以懲創人之逸志者也解頥曰宣薑本伋之妻也一失身於宣公而為新臺之有泚再失身於公子頑而為中冓之不可道蓋由其節義虧缺於前是以無所顧藉於後甘以其身處於汚穢而不辭則亦無復羞愧悔悟之萌矣君子偕老副笄六珈音加叶居河反委委於危反他他待河反如山如河象服是宜叶牛何反子之不淑云如之何賦也君子夫也偕老言偕生而偕死也女子之生以身事人則當與之同生與之同死故夫死稱未亡人言亦待死而已不當復有他適之志也副祭服之首飾編篇上聲一如字髮為之列他髮為之假作紒形加於首上為飾紒音計笄衡笄也輯録衡笄以玉為之即今之簮也垂於副之兩旁當耳其下以紞懸瑱紞都感反織五采為之珈之言加也以玉加於笄而為飾也輯録孔氏曰必飾之有六飾之盛也委委他他雍容自得之貌如山安重也如河𢎞廣也此二句主德容言象服法度之服也淑善也言夫人當與君子偕老故其服飾之盛如此而雍容自得安重寬廣又有以宜其象服既為夫人則當如此今宣薑之不善乃如此雖有是服亦將如之何哉言不稱也此章言服飾之盛而德不相稱為可責增釋鄱陽張氏曰此章三截上二句言夫人能與君子偕老則得冇副笄之脤既服此宜從一而偕老中三句正言宣薑威儀容貌稱其象服下二句言今乃不善將云何哉中三句應副笄六珈下二句應君子偕老責之也玼音此兮玼兮其之翟叶去聲也鬒音軫髮如雲不屑先結反髢從帝反也玉之瑱吐殿反也象之揥敕帝反也楊且子餘反之晳星歷反叶征例反也胡然而天也胡然而帝也賦也玼鮮盛貌翟衣祭服刻繒為翟雉之形而彩畫之以為飾也刻繒為之形而彩畫之綴於衣以為文章輯録翟即揄狄見天官內司服翟狄同又見何彼穠矣小序疏義鄭箋侯伯夫人之服自褕翟而下如王后鬒黑也如雲言多而美也屑潔也髢髲音被髢也人少髮則以髢益之髮自美則不潔於髢而用之也瑱塞耳也以玉係於紞而當耳象象骨也揥所以摘髮也摘音剔蓋若今之篦子然揚眉上廣也眉下而盛則醜惡故以上廣為美且助語辭晳白也胡然而天胡然而帝言其服飾容貌之美見者驚猶鬼神也此章言服飾容貌之盛若可疑而又可畏輯録輔氏曰其者指宣薑而言玼兮玼兮其之翟也言服之美也鬒髮如雲不屑髢也言質之美也足乎已者無待於外也玉之瑱也象之揥也言飾之美也揚且之晳也言色之美也服飾容貌之美盛如天如帝然是豈可以徒居哉增釋鄱陽張氏曰此章末二句謂夫人容貌之美服飾之盛如此胡然而自天降此乎胡然而鬼神來此乎此則問辭􅾩七我反兮􅾩兮其之展涉戰反叶諸延反也蒙彼皺側救反絺是紲息列反袢薄慢反叶分乾反也子之清揚揚且之顔叶魚堅反也展如之人兮邦之媛音院也賦也􅾩亦鮮盛貌展衣也以禮見音現於君及見賔客之服也輯録毛氏曰展衣以丹縠為衣鄭氏曰展衣宜白禮記作袒音戰蒙覆音阜也皺絺絺之蹙蹙者當暑之服也輯録孔氏曰葛之精者曰絺其精尤細靡者皺也言細而縷皺紲袢東縳意以展衣蒙絺綌而為之紲袢所以自斂飭音敕也或曰蒙謂加絺綌於褻衣之上所謂表而出之也輯録朱子曰先著裏衣表絺綌而出之於外欲其不見體也清視清明也揚眉上廣也顔額角豐滿也展誠也美女曰媛見其徒有美色而無人君之德也此章言服飾容貌之盛若可喜而實可惜也增釋鄱陽張氏曰此章末則答之曰此邦之媛也惜之也君子偕老三章一章七句一章九句一章八句東萊吕氏曰首章之末云子之不淑云如之何責之也二章之末云胡然而天也胡然而帝也問之也三章之末云展如之人兮邦之媛也惜之也辭益婉而意益深矣輯録輔氏曰凡人之責人辭愈多則氣愈暴氣愈暴則辭愈厲此則志不帥氣而氣反動其志者也君子之責人則辭愈多而氣愈緩氣愈緩而辭愈和此則發乎情止乎禮義也且心有所忿懥則不得其正如此詩之辭益婉而意益深則心不至於失其正矣東萊先生責之問之惜之三字説盡詩意極好玩味爰采唐矣沫音妹之鄉矣云誰之思美孟薑矣期我乎桑中叶諸良反要於遙反我乎上宫叶居王反送我乎淇之上叶辰羊反矣賦也唐蒙菜也一名兔絲輯録圖經釋曰唐也蒙也女蘿也兔絲也一物四名本草夏生苗如絲蔓延木上生實如蠶子本經并以唐蒙為一名許氏曰唐蒙非可食之物不知何以為菜名沫衛邑也書所謂妹邦者也輯録孔氏曰酒誥注妹邦紂所都朝歌即沫也言薑齊女貴族桑中上宫淇上又沫鄉之中小地名也要猶迎也衛俗淫亂世族在位相竊妻妾故此人自言將采唐於沫而與其所思之人相期會迎送如此也爰采麥叶訖力反矣沫之北矣云誰之思美孟弋矣期我乎桑中要我乎上宫送我乎淇之上矣賦也麥榖名秋種夏熟者輯録白虎通曰麥金也金旺而生火旺而死弋春秋或作姒蓋杞女夏后氏之後亦貴族也爰采葑矣沫之東矣云誰之思美孟庸矣期我乎桑中要我乎上宫送我乎淇之上矣賦也葑蔓菁也庸未聞疑亦貴族也輯録劉執中曰采唐麥葑者欲適幽逺行其淫亂不敢正名而託以采此也許氏曰大率言貴族以誦女之美未必真冇薑弋庸三姓之女也桑中三章章七句樂記曰鄭衛之音亂世之音也比同也於慢矣五音宫為君商為臣角為民徴為事羽為物五者皆亂迭相凌謂之慢而國滅亡比於慢者亂而迭於亡也桑間濮上之音亡國之音也其政散其民流誣上行私而不可止也流者音之蕩也聞此濮上之音則知政無統紀民無維係誣其君上以行私情而不可禁止也按桑間即此篇故小序亦用樂記之語輯録鄭氏曰濮水之上地有桑間者亡國之音於此水出也昔殷紂使師延作靡靡之樂已而因沉於濮水後師涓過焉夜聞而寫之為晉平公鼓之是之謂也通釋曰朱子以桑間即此桑中詩而證以樂記之語然則鄭氏謂師涓所聞者自是濮上之音也鶉音純之奔奔鵲之疆疆音薑人之無良我以為兄叶虗王反興也鶉䳺音諳屬輯録埤雅鶉有兩種有丹鶉白鶉鋭上秃下夏出秋藏飛必附草鶉能不亂其匹鵲能不淫其匹奔奔疆疆居有常匹飛則相隨之貌人謂公子頑良善也衛人刺宣薑與頑非匹耦而相從也故為惠公之言以刺之曰人之無良鶉鵲之不若而我反以為兄何哉物有定偶人不如物故以為興輯録孔氏曰言鶉則鶉自相隨奔奔然鵲則鵲自相隨疆疆然各有常匹不亂其類今宣薑為母頑則為子而與之淫亂曽鶉鵲之不如而我反以為凡也哉鵲之疆疆鶉之奔奔叶逋珉反人之無良我以為君興也人謂宣薑君小君也輯録輔氏曰詩人疾惡宣薑至矣而又不敢不以為小君也彼謂狡童碩鼠為稱其君者何哉鶉之奔奔二章章四句一章刺頑一章刺薑范氏曰宣薑之惡不可勝道也國人疾而刺之或逺言焉或切言焉逺言之者君子偕老是也切言之者鶉之奔奔是也衛詩至此而人道盡天理滅矣其事為人所不忍言人類無以異於禽獸而國隨以亡矣胡氏曰楊時有言詩載此篇以見衛為狄所滅之因也故在定之方中之前輯録彭氏曰陳氏云木必壞然後蠧生焉國必亂然後冦生焉聖人存此詩以為狄入衛張本使後世知所戒也因以是説考於厯代凡淫亂者未有不至於殺身敗國而亡其家者然後知古詩垂戒之大而近世有獻議乞於經筵不以國風進講者殊失聖經之旨矣宋仁宗時講官不欲講新臺仁宗以謂聖人刪詩義勸戒不當有過輯録李氏曰淫亂非美事而不刪之者所以示鑒戒也亦如春秋亂臣賊子一一書之亦所以示戒也而唐太子宏受左傳至於楚世子商臣弒其君頵而請更受他書是不知聖人垂訓之意也近世有建言經筵不進國風是亦不知聖人垂訓之意也頵音均定丁佞反之方中作于楚宫揆之以日作于楚室樹之榛栗椅於宜反桐梓漆爰伐琴瑟賦也定北方之宿營室星也此星昏而正中夏正十月也此據月令為説與堯典中星異堯典冬至日在虗昏中昴九峯蔡氏傳謂今冬至日在斗昏中璧約五十一度此正嵗差之法七十五年差一度之驗也及至元辛巳方回作山經又云今冬至日在箕九度昏中室蓋又差矣然則十月定中七月流火三月三星在天皆是在當時為然耳於是時可以營制宫室故謂之營室輯録通釋曰夏正十月建亥春秋時十二月也農事已畢可以興作而人君居必南面故亥月昏時見定星當南方之午位因記此星為每嵗營作之候又因號為營室此蓋成周以後之制上考唐虞之時定星以戌月昏中嵗久而差至周時定星始以亥月昏中下逮今日此星又以子月昏中矣楚宫楚丘之宫也揆度也樹八尺之臬音齧而度其日之出入之景以定東西又參日中之景以正南北也語出周禮冬官鄭氏注云凡造城郭先以水平地乃於平地之中央樹臬以繩懸之取其正乃於日出日入之時書記臬景之端却於中臬以繩取景兩端之內一匝規之規之則逺近定而東西審度兩交之間中之以指臬則南北正矣輯録朱氏曰經之又恐南北之未正又參之以日之景焉冬至日行南陸景長一丈三尺夏至日行北陸景短一尺五寸此日中之景也楚室猶楚宫互文以協韻耳榛栗二木其實榛小栗大皆可供籩實用之賔祭椅梓實桐皮桐梧桐也輯録嚴氏曰陸璣言有青桐白桐赤桐此中琴瑟者白桐也椅桐梓漆之桐為白桐梧桐生矣之桐為青桐梓楸之踈理白色而生子者輯録本草注云梓似桐而葉小花紫亦有三種漆木有液黏念平聲黑可飾器物輯録本草注曰漆樹髙三二丈皮白葉似椿花似槐以斧斫其皮開以竹筒承之注滴則成漆也四木皆琴瑟之材也輯録嚴氏曰椅桐可為琴瑟榛栗可備籩實梓漆可供器用但言伐琴瑟者取成句耳爰於也衛為狄所滅文公徙居楚丘營立宫室國人恱之而作是詩以美之蘇氏曰種木者求用於十年之後其不求近功凡此類也候定星順天時也度日景審地勢也飭種樹備國用也致詳慎之意為永久之圖新造之時蓋如此升彼虗起居反叶起吕反矣以望楚矣望楚與堂景山與京叶居良反降觀于桑卜云其吉終然允臧賦也虗故城也楚楚丘也堂楚丘之旁邑也景測景以正方面也與既景乃岡之景同上章揆之以日是定其基址此言景山與京則又前者未定居時覽山川之影勢或曰景音璟山名見商頌京髙丘也桑木名葉可飼蠶者觀之以察其土宜也輯録通釋曰衛詩多言桑如桑中與氓詩及此皆再三言之蓋衛地跨冀兖二州桑者尤其土所宜而民生之所資也據楚丘在冀河之東兖州之境則文公所觀所説其桑土之野乎蘇氏曰降觀其下有桑土可以居民允信臧善也此章本其始之望景觀卜而言以至於終而果獲其善也文公始欲居望丘又欲居堂邑既而審察其地決意於楚從而卜之又吉乃居焉致詳致慎如此是以後來之善符當時之卜也詳此及下章文意乃詩人於文公殷富之後追述之耳靈雨既零命彼倌音官人星言夙駕説始鋭反于桑田叶徙因反匪直也人秉心塞淵叶一均反騋音來牝三千叶倉新反賦也靈善零落也倌人主駕者也星見星也説舍止也秉操塞實淵深也馬七尺以上為騋言方春時雨既降而農桑之務作文公於是命主駕者晨起駕車亟音棘往而勞去聲勸之然非獨此人所以操其心者誠實而淵深也蓋其所畜之馬七尺而牝者亦已至於三千之衆矣文公因天時而勸農事如此可謂敦本尚實而憂深思逺矣然不特此時此事為然育物之驗已如彼則勤民之心可知矣蓋人操心誠實而淵深則無所為而不成其致此富盛宜矣誠實則無虗浮之弊淵深則非淺近之謀輯録慈溪黃氏曰匪直也人語難曉至此文義方通嚴氏曰説于桑田是文公能務農重本以蓄育其人也非特人也文公操心塞實淵深故能致富強至於騋牝三千覺於上下文尤協記曰問國君之富數馬以對今言騋牝之衆如此則生息之蕃可見而衛國之富亦可知矣此章又要其終而言也於是而文公之興衛也久矣輯録曹氏曰人君之一心萬事之本也文公之能勤於農桑者此心也所以致牝馬之多者亦此心也一心之誠實淵深則無所為而不成矣定之方中三章章七句首章言其作邑之時二章言其初擇之時末章言今日富盛之時按春秋傳衛懿公九年冬狄入衛懿公及狄人戰于熒澤而敗死焉輯録杜注熒户扄反河北地名宋桓公迎衛之遺民渡河而南立宣薑子申以廬於漕輯録傳作曹衛下邑是為戴公是年卒立其弟燬是為文公於是齊桓公合諸侯以城楚丘而遷衛焉文公大布之衣大帛之冠輯録注大布粗布大帛厚纁蓋用諸侯諒暗之服或曰此文公貶損之意務材訓農通商惠工敬教勸學輯録注通商旅以遷其有無惠百工以賴其器用敬重五教勸勉為學授方任能授方者授以事為之方也元年革車三十乘輯録文公是年冬立明年為元年季年在僖公二十五年季年乃三百乘見閔公三年騋牝三千乃詩人稱美之辭不必求其實也集傳引此以見文公興衛之由蝃丁計反蝀都動反在東莫之敢指女子有行逺子萬反父母兄弟叶待里反比也蝃蝀虹也日與雨交倐然成質似有血氣之類乃隂陽之氣不當交而交者蓋天地之淫氣也輯録孔氏曰雙出色鮮盛者為雄曰虹暗者為雌曰霓在東者莫與暮同虹也虹隨日所映故朝西而莫東也輯録通釋曰虹之為質不映日不成蓋雲薄漏日日映雨氣則生也今以水噀日亦成青紅之暈此刺淫奔之詩言蝃蝀在東而人不敢指以比淫奔之惡人不可道况女子有行又當逺其父母兄弟豈可不顧此而冒行乎逺父母兄弟與泉水竹竿不同彼言不可犯義而歸此言不可犯義而行也知冇此義故為賢不知此義則流而為惡無怪也朝隮子西反于西崇朝其雨女子有行逺兄弟父母叶滿補反比也隮升也周禮十輝九曰隮注以為虹蓋忽然而見如自下而升也輯録輝音運春官注視祲掌十輝之法以觀妖祥辨吉凶輝謂日旁之光氣一曰祲隂陽氣相侵赤雲為陽黑雲為隂二曰象如赤鳥三曰雋日旁雲氣刺日四曰監赤雲在日旁如冠珥五曰暗日月食六曰瞢日月無光七曰彌雲氣貫日而過八曰敘雲氣次序如山在日上九曰隮虹也十曰想雜氣有似可形像視音視崇終也從旦至食時為終朝言方雨而虹見則其雨終朝而止矣蓋淫慝之氣有害於隂陽之和也今俗謂虹能截雨信然淫慝之氣害隂陽之和淫奔之事害男女之正其類如此輯録張南軒曰隂陽和則成雨隂氣方凝聚而日氣自他方來感不以正隂受其感其正反為之解散故雨不能成也乃如之人也懷昏姻也大無信叶斯人反也不知命叶彌并反也賦也乃如之人指淫奔者而言婚姻謂男女之欲程子曰女子以不自失為信命正理也言此淫奔之人但知思念男女之欲是不能自守其貞信之節而不知天理之正也程子曰人雖不能無欲然當有以制之無以制之而惟欲之從則人道廢而入於禽獸矣以道制欲則能順命輯録輔氏曰男女之欲人所不能無也要當有以制之無以制之則失其貞信之節而有害於天理之正道即是理理即是命以道制欲則能順命去其人欲則能循乎天理矣蝃蝀三章章四句一章賤之二章惡之三章深責之增釋許氏曰衛因淫邪以致禍敗其亂極矣文公一轉移之民之知義乃如此且其辭非止論事常言而逹理知命真君子之言也相息亮反鼠有皮叶蒲何反人而無儀叶牛何反人而無儀不死何為叶吾何反興也相視也鼠蟲之可賤惡者言視彼鼠而猶必有皮可以人而無儀乎此蓋甚言人不如物之意而以有無二字相呼為興也人而無儀則其不死亦何為哉相鼠有齒人而無止人而無止不死何俟叶羽已反又音始興也止容止也俟待也相鼠有體人而無禮人而無禮胡不遄死叶想止反興也體支體也遄速也相鼠三章章四句反覆譏刺輔氏謂蝃蝀相鼠二詩皆文公化行而人心去邪反正之時也故其疾惡如此而後篇又繼以好善之詩焉輯録嚴氏曰凡獸皆冇皮齒體獨言鼠舉卑汚可惡之物以惡人之無禮也東萊吕氏相鼠之惡無禮何其如是之甚也蓋溺於淫亂之俗不如是不足以自拔也疾惡不深則遷善不力孑孑居熱反干旄在浚蘇俊反之郊叶音髙素絲紕符至反之良馬四之彼姝赤朱反者子何以畀必寐反之賦也孑孑特出之貌干旄以旄牛尾注於旗干之首而建之車後也輯録爾雅鄭樵云注係也浚衛邑名邑外謂之郊紕織組也蓋以素絲織組而維之也四之兩服兩驂凡四馬以載之也輯録董氏曰馬在車中為服在車外為驂姝美也子指所見之人也畀與也言衛大夫乘此車馬建此旌旄以見賢者彼其所見之賢者將何以畀之而答其禮意之勤乎禮著於外意本於中車服之盛如此則好善有誠矣賢者之忠告當如何哉詩人所以預為之謀也孑孑干旟在浚之都素絲組音祖之良馬五之彼姝者子何以豫音與之賦也旟州里所建鳥隼之旗也上設旌旄其下繫斿斿下屬縿音衫旗之正幅為縿斿則其末垂者也皆畫鳥隼也輯録周禮司常曰鳥隼為旟考工記曰鳥旟七斿以象鶉火蓋畫朱鳥及隼於斿縿之上也下邑曰都五之五馬言其盛也馬止於四無五馬六馬之理詩人特言其盛固不可以辭害意也孑孑干旌在浚之城素絲祝之良馬六之彼姝者子何以告姑沃反之賦也析羽為旌干旌蓋析翟羽設於旗干之首也析分也分其羽而間綴之也輯録孔疏干之首有旄有羽其下有旒縿周禮注曰徐州夏翟之羽有虞氏以為綏後世或無故染鳥羽用之謂之夏采爾雅旄首曰旌則干旄干旌一也既設旒縿有旃旟之稱未設旒縿空有析羽謂之旌城都邑也祝屬也六之六馬極其盛而言也衛冇好賢之大夫畜德之君子而詩又識報施之禮忠告之義皆可為賢矣干旄三章章六句以良馬四之五之六之為次序也此上三詩小序皆以為文公時詩蓋見其列於定中載馳之間故爾他無所考也然衛本以淫亂無禮不樂善道而亡其國今破滅之餘人心危懼正其有以懲創往事而興起善端之時也故其為詩如此蝃蝀疾淫亂也相鼠惡無禮也干旄樂善道也蓋所謂生於憂患死於安樂者小序之言疑亦有所本云載馳載驅叶祛尤反歸唁音彥衛侯驅馬悠悠言至於漕叶祖侯反大夫跋蒲末反涉我心則憂賦也載則也吊失國曰唁悠悠逺而未至之貌草行曰跋水行曰涉宣薑之女為許穆公夫人閔衛之亡馳驅而歸將以唁衛侯於漕邑輯録朱子曰此詩之作在定之方中之前則未知其為戴公時歟文公時歟未至而許之大夫有奔走跋涉而來者夫人知其必將以不可歸之義來告故心以為憂也既而終不果歸乃作此詩以自言其意爾輯録此詩輔氏所謂夫人傷宗國之亡既歸而許之大夫乃追之于路而告之以不可歸之義觀夫人見其大夫之至亦知其必將以不可歸之義來告而心以為憂則夫人之行亦故知其於義冇不可者矣特以惻怛之情有不能自已者此可謂發乎情止乎禮義者也既不我嘉不能旋反視爾不臧我思不逺既不我嘉不能旋濟視爾不臧我思不閟賦也嘉臧皆善也逺猶忘也濟渡也自許歸衛必有所渡之水也閟閉也止也言思之不止也言大夫既至而果不以我歸為善則我亦不能旋反而濟以至於衛矣雖視爾不以我為善然我之所思終不能自已也輯録許氏曰汝既不以我歸為嘉則信不能旋反而濟視爾雖不以我為善然我之思則不逺也不止也陟彼阿丘言采其虻音盲叶謨郎反女子善懷亦各有行叶户郎反許人尤之衆稚直吏反且狂賦也偏髙曰阿丘虻貝母主療欎結之疾善懷多憂思也猶漢書云岸善崩也輯録溝洫志曰引洛水至商顔下岸善崩行道尤過也又言以其既不適衛而思終不止也故其在塗或升髙以舒憂想之情或采虻以療欎結之疾蓋女子所以善懷者亦各有道而許國之衆人以為過則亦少不更事而狂妄之人爾許人守禮非稚且狂也但以其不知已情之切至而言若是爾然而卒不敢違焉則亦豈真以為稚且狂哉我行其野芃芃蒲紅反其麥叶訖力反控苦貢反于大邦誰因誰極大夫君子無我有尤叶于其反百爾所思叶新齎反不如我所之賦也芃芃麥盛長貌控持而告之也因如因魏莊子之因輯録左傳襄公四年無終子使孟樂如晉因魏莊子納虎豹之皮以請和諸戎注云因緣也緣此而至彼也極至也大夫即跋涉之大夫君子謂許國之衆人也又言歸途在野而涉芃芃之麥又自傷許國之小而力不能救故思欲為之控告于大邦而又未知其將何所因而何所至乎大夫君子無以我為有過雖爾所以處此百方然不如使我得自盡其心之為愈也增釋許氏曰又設行野見麥之意且憂控大國誰因誰極乎大夫君子無以我有過蓋百爾所思不如我之自往也載馳四章二章章六句二章章八句一章出而在道之時二章大夫追及之時三章旋反在道之時四章歸而將至之時事見春秋傳見閔公二年舊説此詩五章一章六句二章三章四句四章六句五章八句蘇氏合二章三章以為一章按春秋傳叔孫豹賦載馳之四章而取其控于大邦誰因誰極之意襄十九年與蘇説合今從之范氏曰先王制禮父母沒則不得歸寧者義也雖國滅君死不得往赴焉義重於亡故也夫人之辭哀痛迫切若不能以為心也然使得歸衛亦何輔於滅亡哉婦人之仁先聖王之禮不待較而輕重可知馳驅已出已犯義矣聞義而能自克不害其為賢也故聖人取之如此輯録朱子曰聖人列泉水於前所以著禮之經列載馳於後所以盡事之變夫宗國覆滅莫大之變顧以父母既終而不得歸則事變之微於是可知矣然則許穆夫人亦賢矣哉又曰宣薑生衛文公宋桓夫人許穆夫人衛夀子以此觀之則人生自有秉彛不係於氣類鄘國十篇二十九章百七十六句衛一之五瞻彼淇奧於六反緑竹猗猗於宜反叶於何反有匪君子如切如磋如琢如磨瑟兮僴遐版反兮赫兮咺况晚反兮有匪君子終不可諼况元反叶况逺反兮興也淇水名奧隈音煨也輯録隈水曲爾雅崖內為奧外為隈緑色也淇上多竹漢世猶然所謂淇園之竹是也輯録漢志武帝塞瓠子決河薪柴少乃下淇園之竹以為揵又寇恂傳伐淇園之竹為矢百餘萬揵音健猗猗始生柔弱而美盛也匪斐通文章著見之貌也君子指武公也輯録孔氏曰武公和僖侯子治骨角者既切以刀斧而復磋以鑢鐋治玉石者既琢以槌鑿而復磨以沙石言其德之修飭有進而無已也輯録朱子曰切琢皆裁物使成形質也瑳磨皆治物使其滑澤也切而復磋琢而復磨言治之有敘而益致其精也瑟矜莊貌僴威嚴貌咺宣著貌諼忘也衛人美武公之德而以緑竹始生之美盛興其學問自修之進益也以始生之美盛有進益之意故以為興大學傳曰如切如磋者道學也如琢如磨者自修也此進德之事學問屬知自修屬行知行二者並進也輯録朱子曰道言也學謂講習討論之事自修者省察克治之功又曰既學而猶慮其未至則復講習討論以求之猶治骨角者既切之而復磋之既修而猶慮其未至則又省察克治以終之猶治玉石者既琢之而復磨之問道學自修此詩人美武公之本旨邪曰武公大段是冇學問底人抑之一詩義理精密詩中如此者甚不易瑟兮僴兮者恂音峻栗也赫兮咺兮者威儀也輯録朱子曰瑟嚴密貌僴武毅貌赫咺宣著盛大之貌恂栗戰懼也威可畏也儀可象也恂栗者敬之存於中也威儀者敬之見於外也皆以成德氣象言而進德工夫亦可見矣有斐君子終不可諼兮者道盛德至善民之不能忘也盛德之感人心如此大學於止至善之傳引此詩又引之以釋此至善乃大學之成功聖賢之能事則武公之德固不可以淺近窺矣輯録朱子曰盛德至善蓋人心之同然聖人亦先得之而其充盛宣著又如此是以民皆仰之而不能忘也盛德以身之所得而言也至善以理之所極而言也輔氏曰觀大學傳曾子所以解此詩首章後六句之説字義明白而旨意詳備愈讀愈冇意味此方可謂之善説詩蓋後之説詩者詳於訓詁則或略泥於旨意則或遺於訓詁惟曾子則於字義旨意兩皆極其至也增釋許氏曰武公之所以有德全在切磋琢磨四字惟其工夫如此精密故有瑟僴赫咺之效存於內者周故發於外者著下二句却就他人心上説謂此君子不可忘也又曰此章訓詁解義皆不及大學詳明蓋大學朱子晚年之書讀此章者當從大學瞻彼淇奧緑竹青青子丁反有匪君子充耳琇瑩音營會古外反辨如星瑟兮僴兮赫兮咺兮有匪君子終不可諼兮興也青青堅剛茂盛之貌充耳瑱音殿也琇瑩美石也天子玉瑱諸侯以石會縫去聲也辨皮辨也以玉飾皮辨之縫中如星之明也輯録孔疏辨師注云會縫也皮辨之縫中每貫結五采玉十二以為飾謂之琪武公諸侯則玉用三采而琪飾七也以竹之堅剛茂盛興其服飾而見其德之稱也堅剛茂盛亦有尊大威嚴之意故以為興凡服飾之尊嚴可知首章先言進德後言成德義兼首尾此與下章専主成德言故不及乎切磋琢磨也瞻彼淇奧緑竹如簀音責叶側歷反有匪君子如金如錫如圭如璧寬兮綽兮猗於綺反重直恭反較古嶽反兮善戲謔兮不為虐兮興也簀棧潺上聲也檀弓注棧謂床第也竹之密比去聲似之則盛之至也金錫言其煆鍊之精純煆鍊已至於精純則成功之極也圭璧言其生質之溫潤生質能全其溫潤則復其本然矣寬宏裕也綽開大也猗嘆辭也重較卿士之車也武公嘗入相為王卿士故乘重較之車較兩輢上出軾者謂車兩傍也輢音竒兩旁植木也語見周禮輿人注疏云較重兩旁竪之者兩輢上出軾者以較之兩頭皆置于輢上二木相附故據兩輢出軾而言也周禮無重較單較之文訓詁謂植木之上出兩橫木在下者為軾上者為較謂之重較者軾上有較層出也此説重較稍明而與周禮略異姑存之輯録詩詁云車廣六尺六寸深四尺軾去輿髙三尺三寸較去軾又髙二尺二寸通髙五尺五寸立則慿較應為敬則俯慿軾善戲謔不為虐者言其樂易而有節也輯録程子曰言其樂易而以禮中節不至於過是不為虐也以竹之至盛興其德之成就至盛則無以加亦冇成就之意故以為興而又言其寬廣而自如在輿而寬綽心廣體胖是也和易而中節也戲謔而不為虐笑語卒獲出言有章是也蓋寬綽無斂束之意戲謔非莊厲之時皆常情所忽而易致過差之地也然猶可觀而必有節焉則其動容周旋之間無適而非禮亦可見矣前二章猶有主敬之功此則無事矜持而皆出於自然也禮曰張而不弛文武不能也弛而不張文武不為也一張一弛文武之道也此之謂也語出雜記凡人斂束之時猶弓之張舒緩之時猶弓之弛有德之人嚴而泰和而節自不倚於一偏也輯録解頥曰首章以竹之美盛興其德之進修卒章以竹之至盛興其德之成就合二章而並觀之所以能有煆鍊之精純者由其知行之並進也所以能全其生質之溫潤者由其表裏之相符也寬廣者矜莊之反矜莊而又寬廣則是寬而冇制也和易者威嚴之反威嚴而又和易則是嚴而能泰也此所以為德之成也果能是則其謂之睿聖也亦可以無愧矣淇奧三章章九句一章言由進德而成德也二章以成德言也三章極言盛德之至也按國語武公年九十冇五猶針警于國曰自卿以下至于師長士師長大夫也苟在朝者無謂我老耄而舍我必恪恭於朝以交戒我遂作懿懿當讀為抑戒之詩以自警而賔之初筵亦武公悔過之作則其有文章而能聽規諫以禮自防也可知矣衛之他君蓋無足以及此者故序以此詩為美武公而今從之也有文章於瑟僴赫咺見之能聼規諫以禮自防切磋琢磨見之增釋許氏曰一章總言其講學自修之功敬德容儀之盛二章止言正其衣冠則其德容自充蓋至此德成矣三章言守之於心者貞剛如金錫施之於四體者溫粹如圭璧至於猗較則寬綽戲謔則不虐蓋動作之間無所往而非德容之盛也考槃在澗叶居賢反碩人之寬叶區權反獨寐寤言永矢弗諼况元反賦也考成也槃盤桓之意言成其隱處之室也陳氏曰考扣也槃器名蓋扣之以節歌如鼓盆拊缶之為樂音洛也二説未知孰是山夾水曰澗碩大寬廣永長矢誓諼忘也詩人美賢者隱處澗谷之間而碩大寬廣無戚戚之意雖獨寐而寤言猶自誓其不忘此樂也輯録嚴氏曰碩人之寬易所謂肥遁者也增釋許氏曰者槃在澗可謂幽僻碩德之人居之則見其寬廣之意如此考槃在阿碩人之薖苦禾反獨寐寤歌永矢弗過古禾反賦也曲陵曰阿薖義未詳或云亦寬大之意也永矢弗過自誓所願不踰於此若將終身之意也輯録輔氏曰寬大自樂若將終身焉蓋無入而不自得也考槃在陸碩人之軸獨寐寤宿永矢弗告姑沃反賦也髙平曰陸軸盤桓不行之意寤宿已覺而猶卧也弗告者不以此樂告人也素位而行遁世無悶於考槃之詩見之考槃三章章四句一章其志堅二章其願足三章其樂深輯録解頥曰賢者隱處於澗谷之間始而曰弗諼謂其心之不忘乎此也繼而曰弗過謂所願不踰於此也終而曰弗告謂不以此樂告人也碩人其頎其機反衣於既反錦褧苦逈反衣齊侯之子衛侯之妻東宫之妹邢侯之姨談公維私息夷反賦也碩人指莊薑也頎長貌褧襌單也也錦衣而加褧焉為其文之太著也輯録朱子曰褧儀禮作景禮記作絅古注以為禪衣所以襲錦衣者沈存中謂褧與檾同是用檾麻織布為之不知是否嚴氏曰褧以穀為之東宫太子所居之宫齊太子得臣也繫太子言之者明與同母言所生之貴也女子後生曰妹妻之姊妹曰姨姊妹之夫曰私邢侯談侯皆莊薑姊妹之夫互言之也輯録蘇氏曰邢周公之後謂近齊諸侯之女嫁於諸侯則尊同故歷言之輯録通釋曰歷言此者以見莊薑之姊妹與莊公之姻婭其尊皆同也莊薑事見弼風緑衣等篇春秋傳曰莊薑美而無子衛人為之賦碩人即謂此詩而其首章極稱其族類之貴以見其為正嫡小君所宜親厚而重歎莊公之昏惑也輯録孔氏曰其父母兄弟皆正大如此君何為不答之乎嚴氏曰詩人不直言莊薑不見答之事但首章厯述其親族欲讀之者知其為莊薑則不見答之事國人自知之不待察察言之矣手如柔荑徒兮反膚如凝脂領如蝤似修反蠐音齊齒如瓠户故反犀螓音秦首蛾我波反眉巧笑倩七薦反兮美目盻匹莧反叶匹見反兮賦也茅之始生曰荑言柔而白也凝脂脂寒而凝者亦言白也領頸也蝤蠐木蟲之白而長者輯録本草郭璞注腐木根下有之瘦而白瓠犀瓠中之子方正潔白而比次整齊也螓如蟬而小其額廣而方正輯録螓蜻蜻蛾蠶蛾也其眉細而長曲倩口輔之美也輯録孔氏曰服虔云輔上頷車也是牙外之皮膚頰下之别名也盻黑白分眀也此章言其容貌之美猶前章之意也碩人敖敖五毛反説始稅反于農郊叶音髙四牡有驕起橋反叶音髙朱幩符云反鑣鑣表驕反叶音褒翟茀音弗以朝直遙反叶直豪反大夫夙退無使君勞賦也敖敖長貌説舍也農郊近郊也四牡車之四馬驕壯貌幩鑣飾也鑣者馬御外鐡人君以朱纒之也鑣鑣盛也重言之則見其為盛翟翟車也夫人以翟羽飾車茀蔽也婦人之車前後設蔽輯録孔氏曰婦人不露見車前後設幛謂之茀因以翟羽為飾夙早也玉藻曰君日出而視朝輯録鄭氏曰朝內朝路寢門外之正朝也退適路寢聽政使人視大夫大夫退然後適小寢釋服輯録鄭氏曰小寢燕寢也陳氏曰視朝而見羣臣所以通上下之情聽政而適路寢所以決可否之計釋服釋朝服也此言莊薑自齊來嫁舍止近郊乘是車馬之盛以入君之朝國人樂得以為莊公之配故謂諸大夫朝於君者宜早退無使君勞於政事不得與夫人相親而歎今之不然也河水洋洋北流活活古濶反叶户劣反施罛音孤濊濊呼活反叶許月反鱣陟連反鮪于軌反發發輔末反叶方月反葭音加菼他覽反揭揭居謂反庶薑孽孽魚竭反庶士有朅欺列反賦也河在齊西衛東北流入海洋洋盛大貌活活流貌施設也罛魚罟也濊濊罟入水聲也輯録説文曰濊礙流也鱣魚似龍黃色鋭頭口在頷下背上腹下皆有甲大者千餘斤輯録孔氏曰鱣魚體有邪行甲無鱗大者長二三丈江東呼為黃魚鮪似鱣而小色青黑輯録孔氏曰陸璣云鮪頭小而尖似鐡兜鍪口亦在頷下其甲可以摩薑大者不過七八尺一名駱肉色味不如鱣也鍪音矛發發盛貌菼薍碩去聲也亦謂之荻揭揭長也庶薑謂姪姊孽孽盛飾也庶士謂媵臣朅武貌言齊地廣饒而夫人之來士女佼好禮儀盛備如此亦首章之意也碩人四章章七句一章言其族類之貴二章稱其容貌之美三章言其嫁時車馬之盛四章言其嫁時所見地利之饒從媵之美也哀傷悼惜皆在言外輯録輔氏曰觀弼風燕燕等篇則莊薑之德行文章皆未易及而此詩不之言何也朱子曰此但指其人所易見者以刺莊公之昏惑而不知耳莊薑之美則固不止此也氓之蚩蚩尺之反抱布貿莫豆反絲叶新齊反匪來貿絲來即我謀叶謀悲反送子涉淇至于頓丘叶祛竒反匪我愆期子無良媒叶謨悲反將七羊反子無怒秋以為期賦也氓民也蓋男子而不知其誰何之稱也輯録朱子曰始見其來莫知其為誰何也既與之謀則爾汝之矣此言之序也蚩蚩無知之貌蓋怨而鄙之也布幣輯録幣者布帛之名貿買也貿絲蓋初夏之時也頓丘地名輯録嚴氏曰在朝歌之東漢志陳郡有頓丘縣師古云以丘為縣也丘一成為頓丘謂一頓而成也愆過也將願也請也此淫婦為人所棄而自敘其事以道其悔恨之意夫既與之謀而不遂往又責所無以難其事再為之約以堅其志此其計亦狡矣以御蚩蚩之氓宜其有餘而不免於見棄蓋一失其身人所賤惡始雖以欲而迷後必以時而悟是以無往而不困耳穢惡之人雖姦無益也士君子立身一敗而萬事瓦裂者何以異此可不戒哉朱子又推之以戒士君子蓋廣説詩之法也乘彼垝俱毁反垣音袁以望復關叶圭貟反不見復關泣涕漣漣音連既見復關載笑載言爾卜爾筮體無咎言以爾車來以我賄呼罪反遷賦也垝毁垣墻也復關男子之所居也不敢顯言其人故託言之耳龜曰卜蓍曰筮體兆卦之體也輯録蓍音尸蒿屬龜莢傳曰天下和平王道得而蓍莖長丈生滿百莖下必有靈龜守之賄財遷徙也與之期矣故及期而乘垝垣以望之既見之矣於是問其卜筮所得卦兆之體若無凶咎之言輯録輔氏曰此章可見古人之尚卜筮然使其知易為君子謀不為小人謀則亦不敢求之筮矣則以爾之車來迎當以我之賄往遷也已上二章皆述其初奔時事以起怨悔之端桑之未落其葉沃若于音吁下同嗟鳩兮無食桑椹音甚叶知林反于嗟女兮無與士耽叶持林反士之耽兮猶可説也女之耽兮不可説也比而興也沃若潤澤貌鳩鶻音骨鳩也似山雀而小短尾青黑色多聲輯録嚴氏曰即莊子所謂鳶鳩也郭璞云似山鵲呼為鶻鵃音骨嘲本草曰鶻鵃尾短黃色多聲椹桑實也鳩食椹多則致醉耽相樂也説解也言桑之潤澤以比已之容色光麗然又念其不可恃此而從音縱欲忘反故遂戒鳩無食桑椹以興下句戒女無與士耽也鳩食椹則醉女悅士則醜皆可戒者也此以欲不可縱之意而為興輯録耽溺好也士猶可説而女不可説者婦人被棄之後深自愧悔之辭主言婦人無外事唯以貞信為節一失其正則餘無足觀爾不可便謂士之耽惑實無所妨也此亦推廣言之此章悔也輯録通釋曰集傳所謂主言者蓋以此婦立言之意専主於言婦人不可一失其節故以辭意抑揚重於女而輕於男亦非男有可耽之理而無所妨玩詩文猶之一字意亦可見讀者當不失性情之正也桑之落矣其黃而隕叶于貧反自我徂爾三嵗食貧淇水湯湯音傷漸子廉反車帷裳女也不爽叶師莊反士二其行下孟反叶户郎反士也罔極二三其德比也隕落徂往也湯湯水盛貌漸漬也帷裳車飾亦名童容婦人之車則有之輯録孔氏曰以帷障車之傍如裳以為容飾故謂童容爽差極至也言桑之黃落以比已之容色凋謝遂言自我往之爾家而值爾之貧於是見棄復乘車而度水以歸復自言其過不在此而在彼也此章怨也輯録輔氏曰女也不爽此但言其誓約之言不差耳豈不悔其初之失哉雖云曲不在已殊不知始既如此則其終固宜然也詩緝曰士二其行士心無極不可測知由其德二三不専於一故也三嵗為婦靡室勞矣夙興夜寐靡有朝叶直豪反矣言既遂矣至于暴矣兄弟不知嘻許意反其笑叶音燥矣靜言思之躬自悼矣賦也靡不夙早興起也嘻笑貌言我三嵗為婦盡心竭力不以室家之務為勞早起夜卧無有朝旦之暇與爾始相謀約之言既遂而爾遽以暴戾加我兄弟見我之歸不知其然但嘻然其笑而已蓋淫奔從人不為兄弟所齒故其見棄而歸亦不為兄弟所恤理固有必然者亦何所歸咎哉但有痛悼而已此章怨而思也及爾偕老老使我怨淇則有岸叶魚戰反隰則有泮音畔叶四見反總角之宴言笑宴宴叶伊佃反信誓旦旦叶得絹反不思其反叶孚絇反反是不思叶新齎反亦已焉哉叶將黎反賦而興也及與也泮涯也髙下之判也總角女子未許嫁則未笄但結髮為飾也孔氏曰但結其髮為兩角晏晏和柔也旦旦明也言我與汝本期偕老不知老而見棄如此徒使我怨也輯録前章以桑之意怨嘆比其色之哀此章言老使我怨而又言總角之宴則與三嵗食貧三嵗為婦若可疑者故詩緝謂未笄為氓之婦三年便見棄不應便老也通釋曰三嵗者但言其在夫家貧勞之嵗月耳淇則有岸矣隰則有泮矣而我總角之時與爾宴樂言笑成此信誓曽不思其反復以至於此也此則興也地有限止而可見事有終窮而不思此反其意以為興也反字正與岸泮二字語相應既不思其反復而至此矣則亦如之何哉亦已而已矣傳曰思其終也思其復也思其反之謂也縱欲敗禮失身從人此豈永終知敝之謂哉人窮反本此章可見此章悔也輯録襄公二十五年注曰思使終可成思其可復行也氓六章章十句一章約奔二章遂奔三章悔奔四章旋反在道而怨之深五章被棄歸宗而怨與悔俱甚六章思其始奔而悔無及也輯録劉執中曰夫婦者五品之木匹配雖自於人謀義理實根於天地順其道者足以安於其位逆其理者無以保於其生蓋肇有人倫以來未有違理犯義終其身而弗悔者此氓詩之所由作也通釋曰此詩及弼谷風皆棄婦所作故其辭意多同桑之黃隕即涇濁之色也食貧靡勞即方舟泳遊之苦也至於暴矣即有洸有潰之意也偕老而使我怨即既生育而比豫于毒也然則宴爾新昏以我御窮則其過今在於夫女之耽兮不可説也則其過昔在於已今之過在夫故可責其不念昔者之來塈昔之過在已故終於自悔昔者之不思其反此詩自悔之深固不得如谷風歸怨之深也塈音戲籊籊他歷反竹竿以釣于淇豈不爾思逺莫致之賦也籊籊長而殺去聲也輯録殺衰小之也謂釣竿長而根大其末漸漸而衰小竹衛物淇衛地也衛女嫁於諸侯思歸寧而不可得故作此詩言思以竹竿釣于淇水而逺不可至也輯録輔氏曰豈不爾思者言固不能不思也逺莫致之者以義有不可故託以逺而不能致耳泉源在左淇水在右叶羽軌反女子有行逺于萬反父母兄弟叶滿彼反賦也泉源即百泉也在衛之西北而東南流入淇故曰在左淇在衛之西南而東流與泉源合故曰在右增釋鄱陽張氏曰泉水即衛州共城之百泉淇水出相州林慮縣東流泉水自西北來窪之思二水之在衛而自歎其不如也輯録輔氏曰女子有行逺父母兄弟安之之辭淇水在右泉源在左巧笑之瑳七可反佩玉之儺乃可反賦也瑳鮮白色笑而見齒其色瑳然猶所謂粲然皆笑也增釋榖梁傳軍人粲然皆笑粲明也笑而露其齒白也儺行有度也承上章言二水在衛而自恨其不得笑語遊戲於其間也淇水悠悠音由檜楫松舟駕言出遊以寫我憂賦也悠悠流貌檜木名似柏輯録毛氏曰檜柏華松身孔氏曰禹貢栝柏注柏葉松身曰栝與此一也楫所以行舟也與泉水之卒章同意竹竿四章章四句一章歸而亂辭以決之二章思歸而以正義決之三章四章則思不能忘而義若不能決也然則所以自處者有道矣竹竿泉水載馳三詩為一類載馳之詩其情迫此與泉水其詞緩勢不同也然載馳馳驅而出矣聞大夫之言而後反泉水亦與諸姬伯姊謀而後知義理之必然而無疑此則斷之以心不待謀而後決告而後知比之泉水載馳尤為賢也芄音丸蘭之支童子佩觽許規反雖則佩觽能不我知容兮遂兮垂𢃄悸其季反兮興也芄蘭草一名蘿摩蔓生斷之有白汁可啖音淡支枝同觽錐也以象骨為之所以解結成人之佩非童子之飾也此詩不知所謂則其起興之意難曉若以為刺童孺無能則義有可推蓋芄蘭柔弱而枝葉長蔓本不稱末故以興童稚無能而服飾美盛人不稱其服也知猶智也言其才能不足以知於我也容遂舒緩放肆之貌悸𢃄下垂之貌芄蘭之葉童子佩韘失涉反雖則佩韘能不我甲叶占協反容兮遂兮垂𢃄悸兮興也韘決也以象骨為之著音斫右手大指所以鈎弦闓體闓即開字體弓體也鄭氏曰沓冒也也即大射所謂朱極三是也以朱韋為之用以彄音摳沓右手食指將去聲指無名指也朱韋皮之染赤色者也以朱韋為之故名朱極彄沓者包之也包三指所以遂弦輯録鄭氏曰極猶放也所以韜指利放弦也三者食指將指無名指甲長也言其才能不足以長於我也射者男子之事尤非童孺所能者才能甚不稱其佩服也芄蘭二章章六句佩觽已不稱佩韘尤不稱此詩不知所謂不敢強解輔氏曰此亦必刺在其位者童孺無能惟儀容之可觀耳然未知其誰何也增釋許氏曰芃蘭柔弱之草其枝葉不足取以興童孺無才智不足尚故雖服成人之佩而智不足以知我才不足以長我且猶不能自省而舒緩放肆垂𢃄悸然以自得蓋其德不稱於服飾故為人指議如此其必有所託而言也蓋朱子謂不可強解姑存于此誰謂河廣一葦杭户郎反之誰謂宋逺跂丘䜴反豫望之賦也葦蒹葭之屬杭度也衛在河北宋在河南衛滅於狄桓公迎其遺民渡河而南襄公即位則衛國在河南矣此恐當作興體不必以渡河為説也輯録左傳閔公二年冬桓公逆衛立戴公卒立文公僖公元年即河文公之元年至二十五年文公卒成公立是時衛在南十年矣宣薑之女為宋桓公夫人生襄公而出歸于衛襄公即位夫人思之而義不可往蓋嗣君承父之重與祖為體祖孫昭穆同故以祖為體輯録孔疏體上有一字母出與廟絶不可以私反不得供祭祀則與廟絶而義不可反矣故作此詩言誰謂河廣乎但以一葦加之則可以渡矣誰謂宋國逺乎但一跂足而望則可以見矣輯録嚴氏曰跂舉踵也腳根不著地明非宋逺而不可至也乃義不可而不得往耳誰謂河廣曽不容刀誰謂宋逺曽不崇朝賦也小船曰刀不容刀言小也崇終也行不終朝而至言近也輯録嚴氏曰刀􅊑古字通用輔氏曰但言非河之廣而不可渡非宋之逺而不可至以極其情思焉而終不明言其義之不得往也此意最可玩范氏以為知禮而畏義者得之矣河廣二章章四句既量於目力知其近又量於足力知其近范氏曰夫人之不往義也天下豈有無母之人歟有千乘之國而不得飬其母則人之不幸也為襄公者將若之何生則致其孝沒則盡其禮而已吕氏曰説苑載襄公為太子請於桓公立目夷公問何故對曰臣之舅在衛愛臣若終立則不可往矣襄公欲見母也而曰見舅蓋恐傷其父之志也母之慈子之孝皆止於善而不敢過焉不幸而處母子之變者可以觀矣東匯陳氏曰禮為出母期而為父後者無服心喪而已愚謂如此則襄公之於其母生不可見死不可為服矣死以心喪為禮而生其孝未之詳也豈惟終身永慕以志養志乎衛有婦人之詩自共薑至於襄公之母六人焉輯録衛有婦人之詩六人皆止於禮義謂共薑莊薑也許穆夫人也宋桓夫人也泉水之女也竹竿之女也皆止於禮義而不敢過也夫以衛之政教淫僻風俗傷敗然而女子乃有知禮而畏義如此者則以先王之化猶有存焉故也輯録輔氏曰范氏為襄公處者得其義矣所謂先王之化猶有存焉即大序所謂止乎禮義先王之澤也必如此等詩方可當之解頥曰母出固與廟絶而母之與子初無絶道也母之轍雖不可以私返而子之使則未嘗不可以私往也歲時問安之使交錯於道路而一草一木之微必先以奉乎親焉則子之心可以無愧而母之心亦可以少慰矣伯兮朅丘列反兮邦之桀兮伯也執殳市朱反為去聲王前驅賦也伯婦人目其夫之字也朅武貌桀才過人也殳長丈二而無刃輯録説文殳積竹為之冬官廬人殳長尋有四尺即丈二尺􅌛兵同強殳無刃可􅌛打人故謂之􅌛兵同強上下同堅徑也婦人以夫久從征役而作是詩言其君子之才之美如是今方執殳而為王前驅也此以侯國之人供天子之役也才美如此而執殳前驅則用之非其義矣自伯之東首如飛蓬豈無膏沐誰適都歷反為容賦也蓬草名其華如栁絮聚而飛如亂髮也膏所以澤髮者沐滌首去垢也適主也言我髮亂如此非無膏沐可以為容所以不為者君子行役無所主而為之故也傳曰女為説已容輯録晉豫讓云士為知己者死女為説已者容輔氏曰此其真情也吕氏曰膏所以膏首面沐蓋潘也左傳遺之潘沐潘音番米瀾也內則潘浙米汁也其雨其雨杲杲古老反出日願言思伯甘心首疾比也其者冀其將然之詞冀其將雨而杲然日出以比望其君子之歸而不歸也是以不堪憂思之苦而寧甘心於首疾也憂思之苦本不能堪而令人首疾也但我則思而又思寧甘心首疾而不辭耳此章辭意當與下章例之焉於虔反得諼况𡊮反草言樹之背音佩願言思伯使我心痗呼內反賦也諼忘也諼草合歡食之令人忘憂者輯録本草注曰一名鹿蔥其花名宜男懷胎婦人佩其花生男也萱草味甘令人好歡樂忘憂背北堂也輯録孔氏曰房室所居之地總謂之堂房半以北為北堂房半以南為南堂通釋曰北堂背南向北故為之背痗病也言焉得忘憂之草樹之北堂以忘吾憂乎輯録朱子曰北堂蓋古之植花草之處然終不忍忘也是以寧不求此草而但願言思伯雖至於心痗而不辭耳寧使心疾而伯不可忘也心痗則其病益深非特首疾而已也伯兮四章章四句一章憫夫之才二章明已之志三章四章則極其憂思之苦而言也范氏曰居而相離則思期而不至則憂此人之情也文王之遣戍役采薇出車杖杜之詩是也此用古注故以為文王時作周公之勞歸士東山之詩皆敘其室家之情男女之思以閔之故其民恱而忘死聖人能通天下之志是以能成天下之務兵者毒民於死者也孤人之子寡人之妻殺人之父則孤人子殺人之夫則寡人妻傷天地之和召水旱之災故聖王重之如不得已而行則告以歸期念其勤勞哀傷慘怛不啻在已是以治世之詩則言其君上閔恤之情亂世之詩則録其室家怨思之苦以為人情不出乎此也輯録輔氏曰范氏之説誠足以詔萬世人君而知此義則知謹重於用兵矣至所謂治世之詩則述其君上閔恤之情亂世之詩則録其室家怨思之苦以為人情不出乎此者又深得聖人録詩之意李氏曰古者師出不逾時所以重民力也春秋時用兵多矣未有書師還者獨於莊公八年書之以見逾時不返也然采薇之役逾年而歸東山之師三年而至詩人乃美之者蓋用之得其道則民無怨懟之心不得其道則逾時之久而人怨矣有狐綏綏在彼淇梁心之憂矣之子無裳比也狐者妖媚之獸綏綏獨行求匹之貌淫奔之詩每以狐比齊之南山亦是類也輯録嚴氏曰狐性淫又多疑綏綏然獨行而遲疑有求匹之意喻無妻之人也石絶水曰梁人於淺水以石障水而取魚也在梁則可以裳矣國亂民散喪其妃配同耦有寡婦見鰥夫而欲嫁之故託言有狐獨行而憂其無裳也濟未及梁未可裳也既及梁矣則可以裳矣有狐綏綏在彼淇厲心之憂矣之子無𢃄叶丁計反比也厲深水可涉處也𢃄所以申束衣也申重也衣已束矣又用𢃄以束之也增釋鄱陽張氏曰凡𢃄有二革𢃄加裳上所以懸佩大𢃄加衣上所以束衣而為禮也在厲則可以𢃄矣水自𢃄已上曰厲必脫去其𢃄而渡之既厲矣則可以束𢃄矣有狐綏綏在彼淇側心之憂矣之子無服叶蒲北反比也濟乎水則可以服矣梁與厲皆淇側也裳與𢃄皆所服者也此兼上兩章之意有狐三章章四句著裳然後加𢃄故用裳與𢃄為先後而又言服以兼之投我以木瓜叶攻乎反報之以瓊琚音居匪報也永以為好呼報反也比也木瓜楙音荗木也實如小瓜酢可食輯録本草曰木狀如奈花生於春末深紅色其實大者如瓜小者如拳爾雅謂之楙徐氏曰瓜有瓜瓞桃有羊桃李有雀李此皆枝蔓也故言木瓜木桃木李以别之也瓊玉之美者琚佩玉名輯録羅氏曰琚處佩之中所以貫蠙珠而上繫於珩下維璜衝牙者也言人有贈我以微物我當報之以重寶而猶未足以為報也但欲其長以為好而不忘耳疑亦男女相贈答之詞如靜女之類增釋許氏曰此雖男女贈答之辭然推而充之亦足以為法蓋彼施者雖輕我報者當重不以彼已相較而效之此厚之道也而猶曰匪報蓋如此則可永其好也投我以木桃報之以瓊瑶匪報也永以為好也比也瑤美玉也投我以木李報之以瓊玖音久叶舉里反匪報也永以為好也比也玖亦玉名也輯録説文曰玖玉黑色孔氏曰丘中有麻傳云玖石次玉者是玖非全玉也木瓜三章章四句反覆咏嘆衛國十篇三十四章二百三句張子曰衛國地濵大河其地土薄故其人氣輕浮其地平下故其人質柔弱其地肥饒不費耕耨故其人心怠惰其人情性如此則其聲音亦淫靡故聞其樂使人懈慢而有邪僻之心也鄭詩放此衛多君子於詩可見如淇澳之武公固非諸國所冇而文公興衛亦卓卓可稱者其餘如凱風之孝子北門之忠臣北風之智者干旄之賢大夫簡兮之賢伶官考槃之隱君子豈不特然於變風時其次則乘舟之爭死者亦有可憫之一節又如賢婦人六人則莊薑共薑許穆宋桓夫人泉水竹竿之女也若燕燕之能淑慎伯兮之守専一雄雉之知德行谷風被棄而冇同死之德音又在六婦人以外然則衛不特多君子而已亦可謂多賢婦人矣詩經疏義會通卷三
