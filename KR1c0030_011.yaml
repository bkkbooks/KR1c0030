body:
  text: 詩經疏義㑹通卷九元朱公遷撰小雅二大雅說附雅者正也正樂之歌也其篇本有大小之殊而先儒說又各有正變之别必列反輯録鄭氏曰小雅大雅周室居西都之時詩也小詩自鹿鳴至菁莪十六篇大雅自文王至卷阿十八篇為正經小雅六月大雅民勞之後皆謂之變雅以今考之正小雅燕饗之樂也正大雅㑹朝音潮之樂受釐即禧字陳戒之辭也受禧如生民行葦既醉嘉樂鳬鷖之類陳戒如文王大明綿公劉泂酌卷阿之類通釋曰釐與僖同祭而受福也故或歡欣和說音悅以盡羣下之情指小雅或恭敬齊音齊莊以發先王之德指大雅詞氣不同小雅舒暢而平易大雅渾涵而嚴密小雅近於風大雅幾於頌音節亦異朱子嘗謂詩之聲氣冇不可得而聞者此特以理斷之耳多周公制作時所定也輯録朱子曰周公相成王定樂歌每事以詩寫其至誠和樂而被之音聲舉是事則奏是詩及其變也則事未必同而各以其聲附之朱子曰依小雅體製作謂之小雅依大雅體製作謂之大雅輯録輔氏曰至於其變則不可以例言但以其聲之有合故以附焉而已其次序時世則有不可考者矣鹿鳴之什二之一雅頌無諸國别必列反故以十篇為一卷而謂之什猶軍法以十人為什也輯録孔疏曰風及商魯頌以當國為别詩少可以同卷二雅周頌篇數既多故分其篇每十為卷卷首之篇則為什長以統節篇之目也呦呦音幽鹿鳴叶音芒食野之蘋叶音旁我有嘉賔鼓瑟吹笙叶師莊反吹笙鼓簧音黃承筐是將人之好呼報反我示我周行叶户郎反興也呦呦聲之和也蘋藾音藾蕭也輯録今名藾蒿青色白莖如筯我主人也賔所燕之客或本國之臣或諸侯之使去聲也瑟笙燕禮所用之樂也儀禮燕禮曰工四人二瑟工歌鹿鳴四牡皇皇者華笙入奏南陔白華華黍又曰升歌鹿鳴簧笙中之簧也輯録詩氏曰樂書古者造笙以曲沃之匏汶陽之篠列管匏中而施簧管端有長短之制法象鳯凰其形鳯翼其聲鳯鳴其長四尺大者十九簧謂之巢管在匏有鳯巢之象小者十三管謂之和以大者倡則小者和也承奉也筐所以盛平聲幣帛者也將行也奉筐而行幣帛飲則以酬賓送酒食則以侑賓勸飽也侑猶勸也勸食曰侑恭敬非儀文不行故以幣將之周行大道也道者事物當然之理日用之間坦然可以由之者是也古者於旅也語故欲於此聞其言也出鄉射記注云禮成樂備乃可以言語愚謂賓筵之初禮樂方盛言語則慢之矣逮至旅酬則禮已成樂已備於是而語乃無嫌也輯録通釋曰燕飲至旅酬正禮已終然後言語以盡嘉賓之忠告而明聖人之大道也此燕饗賓客之詩也輯録李氏曰饗在廟燕在寢饗重而燕輕饗則君親獻燕則不親獻蓋君臣之分以嚴為主朝廷之禮以敬為主然一於嚴敬則情或不通而無以盡其忠告之益故先王因其飲食聚㑹而制為燕饗之禮以通上下之情而其樂歌又以鹿鳴起興而言其禮意之厚如此以物情之樂興賓主之樂增釋許氏曰鹿見野之有蘋而呦呦和聲呼其羣以共食以興君有酒食召集嘉賓而共饗也燕饗之意全在此興中故下文祗見作樂奉幣耳人之好我示我周行冀之之辭也庶乎人之好我而示我以大道也輯録孔疏王肅云飲食以饗之琴瑟以樂之幣帛以將之則庶乎好愛我而示我以道矣記曰私惠不歸德君子不自留焉語出緇衣黃氏日抄云私惠猶言私恩小惠謂人以私惠於我而不合乎德義之公則我不留之於已也愚按黃氏以合字貼歸字以已字貼自字說與古注不同而與集傳之意相合故取之留字當訓為受字蓋其所望於羣臣嘉賓者唯在於示我以大道則必不以私惠為德而自留矣望人以大道示我則示以德義之公為德而留之非以私恩小惠為德而留之也為德之德訓惠字嗚呼此其所以和樂而不淫也與鹿食蘋草呼其羣而聲甚和物情之樂也主人得嘉賓則宜冇禮意以宣其樂矣而教示於已又可樂之實故其所以致嘉賓之樂者實欲以致其樂於已也是雖樂而不失其正輯録解頥曰君之燕臣其事非一有因祭而燕者有因朝而燕者有因聘而燕者有因錫有功而燕者其事不同則所以相告語者亦異如其君之尚武歟則告之以矢其文德洽此四國可也如其君之尚文歟則告之以詰爾戎兵陟禹之迹可也如欲其君之敬天歟則告之以陟降厥士日監在兹可也如欲其君之修身歟則告之以敬慎威儀維民之則亦可也為其有兄弟也而申之以常棣之恩為其有朋友也而申之以伐木之義衮職由是而可補民情由是而可逹先王之典章由是而可修先民之話言由是而可聞莫不因事以有言因言以致戒而所謂大道者在是矣夫豈泛然為不切之論而已哉呦呦鹿鳴食野之蒿我有嘉賓德音孔昭叶側豪反視民不恌他雕反叶音洮君子是則是效胡教反叶胡髙反我有㫖酒嘉賓式燕以敖牛刀反興也蒿菣去刃反也即青蒿也輯録羅氏曰荆楚之人謂蒿為菣本草注曰春生苗葉秋開淡黃花結子如粟米大孔甚昭明也視與示同恌偷薄也敖遊也言嘉賓之德音甚明足以示民使不偷薄厚德積於中則聲譽著於外以此示民民德歸厚矣所謂嘉賓者於此可見而君子所當則效則亦不待言語之間而其所以示我者深矣盛德著聞在所當法則禮意殷勤在所當盡是以不特燕享而又使之敖遊以盡其樂而求教示焉視上章為有加矣增釋此章承上章而言德音者冇德之言即示我之周行也既足於示民使不偷薄則君子所當取則而效倣之君子几有位者也式燕以敖言其禮之從容也夫莊而不至於矜和而不至於流此其德之純也呦呦鹿鳴食野之芩其今反我有嘉賓鼓瑟鼓琴鼓瑟鼓琴和樂音洛且湛都南反叶持林反我有㫖酒以燕樂嘉賓之心興也芩草名莖如叉股葉如竹蔓生輯録陸氏曰生澤中下地鹹處牛馬喜食之湛樂之久也燕安也言安樂其心則非止養其體娛其外而已蓋所以致其殷勤之厚而欲其教示之無已也所以和樂且湛樂而又樂者蓋欲燕樂其心而求教示之意視上章又有加矣鹿鳴三章章八句首章所以燕饗如此欲其示我周行也二章燕享而又使之敖遊焉尤欲其示我周行也三章必以燕樂其心則又深欲其示我周行也一詩之意以漸而深但興起鹿鳴以興和樂之意也首章章首二句興下二句後四句在興外二章三章則盡一章之意而興之按序以此為燕羣臣嘉賓之詩而燕禮亦云工歌鹿鳴四牡皇皇者華即謂此也輯録工歌者乃堂下之歌與琴瑟笙磬相間而歌之也與升髙清廟不同鄉飲酒用樂亦然而學記言大學始教宵雅肄三亦謂此三詩宵之言小也肄習也凡入大學必先習此三詩輯録鄉飲酒注曰諸侯鄉大夫貢士與之飲酒歌鹿鳴采其嘉賓示我以善道又有明德可則效也四牡采其忠孝之至也皇華采其欲咨謀于賢智也然則又為上下通用之樂矣豈本為去聲燕羣臣嘉賓而作其後乃推而用之鄉人也歟輯録通釋曰儀禮凡上下通用之樂正是小雅二南諸詩而無歌大雅者可見大雅獨為天子之樂此二雅大小所以分也然於朝曰君臣焉於燕曰賓主焉先王以禮使臣之厚於此見矣范氏曰食音嗣之以禮樂音洛下樂而同之以樂將之以實求之以誠此所以得其心也賢者豈以飲食幣帛為悅哉夫音扶婚姻不備則貞女不行也婚姻以聘禮言禮樂不備則賢者不處上聲也賢者不處則豈得樂而盡其心乎輯録輔氏曰范氏說破君子豈為飲食幣帛而悅之意甚好然則先王制禮所以殷勤如此者亦非以為媚賢之具也各盡其道而已四牡騑騑芳非反周道倭於危反遲豈不懷歸王事靡盬音古我心傷悲賦也騑騑行不止之貌周道大路也倭遲回逺之貌盬不堅固也輯録盬亦鹽也出於河東之解池水注鹽池自結成者不經久而易壞故訓不堅固者為盬也此勞使並去聲臣之詩也夫音扶君之使臣臣之事君禮也故為臣者奔走於王事特以盡其職分扶問反之所當為而已何敢自以為勞哉然君之心則不敢以是而自安也故燕饗之際叙其情而閔其勞言駕此四牡而出使於外其道路之回逺如此當是時豈不思歸乎特以王事不可以不堅固不敢徇私以廢公是以內顧而傷悲也傷悲於心王事故也不然則可以逸樂矣臣勞於事而不自言君探其情而代之言上下之間可謂各盡其道矣傳曰思歸者私恩也靡盬者公義也傷悲者情思也輯録輔氏曰此天理人情之至也無私恩非孝子也無公義非忠臣也君子不以私害公不以家事辭王事范氏曰臣之事上也必先公而後私君之勞臣也必先恩而後義四牡騑騑嘽嘽他丹反駱音洛馬叶滿補反豈不懷歸王事靡盬不遑啓處賦也嘽嘽音灘衆盛之貌白馬黑鬛曰駱遑暇啓跪處居也項氏曰古者席地故有跪有坐跪起身居則坐也愚謂啓居猶言動靜不遑啓居王事故也不然則可以閒暇矣蓋我心傷悲者感之深不遑啓居者勞之至已上二章先言私恩後言公義而二者交相致重也翩翩音篇者隼當作隹朱惟反載飛載下叶後五反集于苞栩况甫反王事靡盬不遑將父扶甫反興也翩翩飛貌隼夫不方浮反本作鴂鴀也今鵓鳩也凡鳥之短尾者皆隹屬將養也輯録戴氏曰將扶持奉侍之謂翩翩者隼猶或飛或下而集於所安之處今使去聲人乃勞苦於外而不遑養去聲其父物得自由人不如物故以起興此君人者所以不能自安而深以為憂也范氏曰忠臣孝子之行役未嘗不念其親君之使臣豈待其勞苦而自傷哉亦憂其憂如已而已矣此聖人所以感人心也憂其憂則悅待其勞苦而自傷則怨矣輯録謝氏曰忠孝不兩全此人情之所難也先王勞使臣而言之及此探人情真切而言之也翩翩者隼載飛載止集于苞杞音起王事靡盬不遑將母叶蒲彼反興也杞枸音苟檵音計也此兩章乃言所以懷歸之故先言公義後言私恩而私恩乃所歸重也輯録嚴氏曰本草云名仙人杖西王母杖根名地骨莖幹三五尺作叢詩中有三杞將仲子樹杞栁屬也南山冇杞湛露杞棘山木也此詩苞杞四月杞桋北山言采其杞枸杞也駕彼四駱載驟助救反駸駸侵寢二音豈不懷歸是用作歌將母來諗深審二音賦也駸駸驟貌諗告也以其不獲養去聲父母之情而來告於君也非使人作是歌也設言其情而勞去聲之耳獨言將母者因上章之文也此章専言私恩不及公義則恩為甚重而義有不必言矣輯録范氏曰父至尊也母至親也知母之親則知父之尊矣卒章再言母本其恩所起以教愛也愛母則敬父矣敬父則尊君矣未有愛親而不愛其君者也解頤曰忠孝非二道忠於君者必其能養於親者也然忠孝不兩立致其勞於外則必闕其養於內又不可以不慮也為人臣者將欲致其力於私養歟則當官而行國事固不可以不恤將欲致其力於王事歟則子職之不共又何以為孝哉此王者之勞使臣所以必探其情而代之言為人臣者聞之亦必有以自慰而益不懈於用力矣四牡五章章五句一章二章言懷歸則將父母之意在其中矣三章四章言將父母則懷歸之意不言可知矣五章則曰豈不懷歸又曰將母來諗則究言之而盡其情矣按序言此詩所以勞使臣之來甚協詩意故春秋傳亦云襄公四年而外傳以為章使臣之勤所謂使臣雖叔孫之自稱亦正合其本事也輯録外傳魯語曰叔孫穆子對曰鹿鳴君所以嘉先君之好也敢不拜嘉四牡君所以章使臣之勤也敢不重拜皇華君教使臣曰每懷靡及諏謀度詢必咨於周敢不拜教但儀禮又以為上下通用之樂疑亦本為去聲勞使臣而作其後乃移以他用耳歌於使來之時則勞其來也而極言在外之情如此則章其勤也勞其來者此詩之用章其勤者詩中之意或謂皇華之使為本國之臣四牡之使為諸侯之使故朱子取小序說而引叔孫事以證之愚按如此則與首章傳意不合此謂甚協詩意特以明其為勞而不為遣引叔孫事亦以證其為勞詩耳若取來字之義則本國之使來歸亦曰來諸侯之使來朝亦曰來用之二者無不可也增釋許氏曰章各五句一章二章五章賦也自為一體上二句為一節下三句為一節第二句第五句用韻其命辭用意皆同三章四章興也亦自為一體上三句為一節下二句為一節第二句三句五句用韵命辭用意亦同一篇之中賦興既異體其文又自各為一體也金履祥曰卒章獨言將母者父丈夫也猶能自養婦人非子不能自養此尤人之情也皇皇者華芳無反與夫叶于彼原隰侁侁所巾反征夫每懷靡及興也皇皇猶煌煌也華草木之華也髙平曰原下濕曰隰侁侁衆多疾行之貌征夫使臣與其屬也懷思也此遣使臣之詩也君之使臣固欲其宣上德而達下情出則宣公德入則達下情使臣之職如此而臣之受命亦惟恐其無以副君之意也此所以冇靡及之心也故先王之遣使臣也美其行道之勤即侁侁征夫言而述其心之所懷即每懷靡及言曰彼煌煌之華則于彼原隰矣言髙原下隰皆有之也此侁侁然之征夫則其所懷思常若有所不及矣彼之物無處不有此之心無時不然彼有以悅于人此無以愜於已反順皆相因也故以為興蓋亦因以為戒輯録輔氏曰即穆子所謂君教使臣之意然其辭之婉而不迫如此詩之忠厚亦可見矣有自足之心則非臣道之當然故首章即以戒之也輯録解順曰每懷靡及者每事而思之則必歉然常若有所不及也然不曰使臣而曰征夫則不特使臣此心其屬亦此心也推此心以在外則耆老之在所當問遺逸之在所當求鰥寡之在所當恤廢墜之在所當舉上德之厚而欲其無不宣下情之逺而欲其無不達為使臣者固唯恐無以副君之意而為其屬者又惟恐無以為使臣之助庶可以稱斯職矣於遣使之時而歌此固所以勸勉之也我馬維駒恭于恭侯二反六轡如濡如朱如由二反載馳載驅虧于虧由二反周爰咨諏子須子侯二反賦也如濡鮮澤也周遍爰於也咨諏訪問也使臣自以每懷靡及故廣詢博訪以補其不及而盡其職也廣博二字釋周字程子曰咨訪使臣之大務此下四章無異義但言愈詳而意愈深矣輯録輔氏曰每懷靡及者心也諏謀度詢者事也有是心則有是事矣程子之意蓋謂人君正以耳目不得與逺民相接故遣使以宣已意而通下情為之使者豈可不咨訪以副君意哉解頥新語以諏訪其事也諏有聚議之意謀冇計畫之意度有體量之意詢有究問之意我馬維騏音其六轡如絲叶新齎反載馳載驅周爰咨謀叶莫悲反賦也如絲調忍音刃也調忍猶言和柔也謀猶諏也變文以協韻爾下章放上聲此反覆詠歌我馬維駱六轡沃烏毒反若載馳載驅周爰咨度待洛反賦也沃若猶如濡也度猶謀也我馬維駰音因六轡既均載馳載驅周爰咨詢賦也隂白雜毛曰駰輯録爾雅疏曰隂淺黑色毛淺黑而白兼雜毛者今名泥驄均調也詢猶度也所以諏謀度詢者以有靡及之心而然也皇皇者華五章章四句輔氏曰首章述其心後四章言其事按序以此詩為君遣使臣春秋內外傳皆云君教使臣此詩歌於出使之時遣之也而必使之諏謀度詢教之也言其用則曰遣言其義則曰教其說已見音現下同前篇儀禮亦見鹿鳴疑亦本為去聲遣使臣而作其後乃移以他用也然叔孫穆子所謂君教使臣曰每懷靡及諏謀度詢必咨於周敢不拜教此以忠信訓周與諸傳異輯録注言必於忠信之人咨此四事可謂得詩之意矣范氏曰王者遣使於四方教之以咨諏善道將以廣聰明也夫臣欲助其君之德必求賢以自助故臣能從善則可以善君矣臣能聽諫則可以諫君矣未有不自治而能正君者也皇華遣使勸以義四牡勞使恤以情是以出則盡其職歸則忘其勞由君之使臣有道也然四牡皇華不以遣勞先後為次序而以私恩公義輕重為次序君之厚臣如此輯録輔氏曰范氏說是餘意夫君臣一體也不能咨諏善道則君亦安能聼用已言哉常棣之華鄂五各反不韡韡韋鬼反凡今之人莫如兄弟侍禮反興也常棣棣也子如櫻桃可食鄂鄂然外見之貌不猶豈不也韡韡光明貌此燕兄弟之樂歌故言常棣之華則其鄂然而外見者豈不韡韡乎凡今之人則豈有如兄弟者乎輔氏曰此不取義但以豈不韡韡興莫如兄弟耳愚謂此與何彼穠矣同例何字正呼曷不字也此詩以莫如兄弟一句為大㫖終篇皆發此句之意輯録毛傳鄂猶鄂鄂然言外發也疏鄭氏以為華以覆鄂鄂以承華華鄂相承覆而光明猶兄弟相順而榮顯朱子從毛傳但以語相呼而為興也范氏曰凡今之人言舉世之人也莫如兄弟親之至也死喪之威兄弟孔懷叶胡威反原隰裒薄侯反矣兄弟求矣賦也威畏懷思裒聚也言死喪之禍他人所畏惡惟兄弟為相恤耳至於積尸裒聚於原野之間亦惟兄弟為相求也凡今之人莫如兄弟於此可見此詩蓋周公既誅管蔡而作故此章以下専以死喪急難鬭鬩之事為言其志切其情哀乃處上聲兄弟之變如孟子所謂其兄關音彎弓而射音石之則已垂涕泣而道去聲之者輯録朱子曰此詩是制禮作樂時作這是先被他害所以當天下平定後更作此詩故其詞哀切不似諸詩和平胡氏曰王氏云文武以來宴兄弟亦必有詩然鹿鳴四牡等篇詞多和平唯常棣一篇詞多激切意若有所懲創則周公因管蔡之事其後更為此詩無疑序以為閔管蔡之失道者得之而又以為文武之詩則誤矣大抵舊說詩之時世皆不足信舉此自相矛盾石凖反者以見其一端後不能悉辨也輯録輔氏曰二章至四章雖是周公處管蔡之變故以死喪急難鬬鬩之事為言然兄弟真切之情亦惟至此際而後見分曉若於安平之時觀之則人或以為朋友與兄弟等耳先王之制朋友之服視兄弟有差故特言之脊井益反令音零在原兄弟急難叶泥沿反每有良朋况也永歎吐丹反叶它涓反興也脊令雍渠水鳥也輯録陸氏曰大如鷃雀長腳長尾尖喙背上青灰色腹下白頸上黑如連錢杜陽人謂之連錢嚴氏曰雪姑也况發語詞或曰當作恍况上聲見柔桑脊令飛則鳴行則搖冇急難之意故以起興此與關雎之興最相似而言當此之時雖有良朋不過為去聲之長歎息而已力或不能相及也莫如兄弟又於此可見東萊吕氏曰疏其所親而親其所疏此失其本心者也故此詩反覆言朋友之不如兄弟蓋示之以親疏之分扶問反使之反循其本也輔氏曰先王之制朋友之服視兄弟聖人恐人以二者等視之也故因燕兄弟而發之本心既得則由親及疏秩然有序兄弟之親既篤朋友之義亦敦矣初非薄於朋友也苟雜施而不孫音遜順也謂順於理也雖曰厚於朋友如無源之水朝滿夕除胡可保哉於所厚者薄則欲厚其所薄不䏻也或曰人之在難朋友亦可以坐視與曰每有良朋況也永歎則非不憂憫但視兄弟急歎為有差等耳兄弟以天屬朋友以義合故其輕重如此詩人之詞容有抑揚然常棣周公作也聖人之言大小髙下皆宜而前後左右不相悖音佩重於此而不輕於彼可謂語意皆圓矣兄弟鬩許歷反于牆外禦其務春秋傳作侮罔甫反每有良朋蒸之承反也無戎叶而土反賦也鬩鬭狠也禦禁也蒸發語聲戎助也言兄弟設有不幸鬭狠于內然有外侮則同心禦之矣雖有良朋豈能有所助乎莫如兄弟又於此可見冨辰曰兄弟雖有小忿不廢懿親左傳僖公二十四年注曰懿美也然死喪相恤患難相救是天理之本鬩牆禦侮則人欲昏迷之極而天理又有不可滅者於此尤見兄弟為至親也喪亂既平既安且寧雖有兄弟不如友生叶桑經反賦也上章言患難之時兄弟相救非朋友可比此章遂言安寧之後乃有視兄弟不如友生者悖理之甚也天理每形於患難之際人欲易惑於宴安之時故其悖理如此至此而莫如兄弟若有不然者矣儐賓徹反爾籩豆飲酒之飲於慮反兄弟既具和樂音洛且孺賦也儐陳飫饜具俱也具者兄弟無故也或死或生有不同則不具矣孺小兒之慕父母也真誠相悅無或僞也言陳籩豆以醉飽而兄弟有不具焉則無與共享其樂矣輯録謝氏曰此章㑹集兄弟不惟和樂其情親義厚無異於孺子相慕也孺子無不愛其親無不敬其兄者人欲未萌天理昭著也妻子好呼報反合如鼓瑟琴兄弟既翕許及反和樂且湛答南反叶持林反賦也翕合也翕者同而無異也吉凶禍福苦樂不同則所趨異嚮而不翕矣言妻子好合如琴瑟之和而兄弟有不合焉則無以久其樂矣好合即是和合翕訓合則止是人情事勢相同而已輯録問六章七章就他逸樂時良心發處指出謂酒食備而兄弟冇不具則無以共其樂妻子合而兄弟有不翕則無以久其樂蓋居患難則人情不期而相親故天理常易復處逸樂多為物欲所轉移故天理常隱而難尋故卒章冇是究是圖亶其然乎之語反復玩味真能使人孝友之心油然而生也朱子曰此所謂生於憂患死于逸樂那二章正是遏人欲而存天理也須是恁地看增釋二章至四章言急難危殆之時惟兄弟為能相救六章七章又言燕樂和平之際無兄弟則亦無與共享而久安之反覆而言則兄弟之情相與切至而不可解者自見矣宜爾室家叶古胡反樂爾妻帑音奴是究是圖亶其然乎就用乎字為韻賦也帑孥同子究窮圖謀亶信也宜爾室家者兄弟具而後樂且孺也樂爾妻帑者兄弟翕而後樂且湛也兄弟於人其重如此試以是究而圖之豈不信其然乎莫如兄弟於此尤為可見而無疑也輯録輔氏曰觀周公之言如此則其所以誅管蔡者是豈得已者乎所謂處聖人之不幸也東萊吕氏曰告人以兄弟之當親未必不以為然者也苟非是究是圖實從事於此則亦未有誠知其然者也不誠知其然則所知者特其名而已矣知為兄弟之親而不知其所以當親也凡學蓋莫不然此又推之凡為初學之法此格物致知所以必求其極也增釋吳師道曰中庸引此二章之言子曰父母其順矣乎蓋以明行逺自邇登髙自卑之意則詩之所言而不及父母者蓋人能孝於父母自然能及于兄弟凡其薄於兄弟者皆不念父母之同體故也詩雖不言其意固具此夫子說詩所以推而及之也常棣八章章四句此詩首章略言至親莫如兄弟之意次章乃以意外不測之事言之以明兄弟之情其切如此三章但言急難則淺於死喪矣至於四章則又以其情義之甚薄而猶有所不能已者言之其序若曰不待死喪然後相收但有急難便當相助言又不幸而至於或有小忿猶必共禦外侮其所以言之者雖若益輕以約而所以著夫兄弟之義者益深且切矣至於五章遂言安寧之後乃謂兄弟不如友生則是至親反為路人而人道或幾乎息矣故下兩章乃復扶又反極言兄弟之恩異形同氣死生苦樂無適而不相須之意死生自既具言苦樂自既翕言兄弟之間有死者有苦者則生而樂者亦不得以全其樂矣卒章又申告之使反覆窮極而驗其信然可謂委曲漸次說盡人情矣讀者宜深味之輯録通釋曰五章言喪亂既平以結二章三章四章所言患難相與之意而繼言安寧之後兄弟之恩乃有疏薄者以起六章七章所陳兄弟之恩無適而不相須之意卒章又以宜室家結六章所言樂妻帑結七章所言而復繼言其理之誠然使人有以考驗之也詩凡八章唯卒章無兄弟字餘章反覆言兄弟者凡八其言人情之委曲天倫之厚重者哀傷激切故不若其他宴樂兄弟者樂歌之和平也解頤曰此詩自三章至五章皆舉朋友以明兄弟之當親自六章至八章復舉妻子以明兄弟之當厚伐木丁丁陟耕反鳥鳴嚶嚶於耕反出自幽谷遷于喬木嚶其鳴矣求其友聲相息亮反彼鳥矣猶求友聲矧伊人矣不求友生叶桑經反神之聽之終和且平興也丁丁伐木聲嚶嚶鳥聲之和也幽深遷升喬髙相視矧況也此燕朋友故舊之樂歌故以伐木之丁丁興鳥鳴之嚶嚶伐木非一人鳥鳴亦是雌雄唱和二者皆冇相應之聲也此以相應相求之意為興而言鳥之求友遂以鳥之求友喻人之不可無友也人能篤朋友之好去聲則神之聽之聽冇順從之意蓋使之遂所願也終和且平矣和平猶和好也心志孚合相與無窮所謂終和且平也交道之保始終為難惟篤於朋友之好則神必聽之而使之恆久不渝矣篤之之云即是求之之謂謂之求者竭真誠以致其厚之之心即下兩章所言是也蓋此詩歌於燕飲之時故首陳其意如此輯録楊氏云五品天叙人之大倫也朋友居一焉故謂之達道不由其道則人倫廢而天理滅得罪於天矣其能終和且平乎伐木許許呼古反釃所宜反酒有藇象吕反既有肥羜直吕反以速諸父扶雨反寧適不來微我弗顧叶居五反於音烏粲灑所懈反掃蘇報反叶蘇吼反陳饋八簋叶已有反既有肥牡以速諸舅其九反寧適不來微我有咎其九反興也輔氏曰此其起興與首章同不言鳥鳴以下者承首章而省文也下章亦然許許衆人共力之聲淮南子曰舉大木者呼邪余遮反許蓋舉重勸力之歌也輯録淮南子道應訓章翟煎對梁惠王曰夫舉大木者前呼耶許後亦應之釃酒者或以筐或以草泲子禮反之而去上聲其糟也禮所謂縮酌用茅是也以茅去滓出郊特牲輯録陳氏曰縮泲也酌斟酌也謂醴齊濁泲而後可斟酌也用茅者以茅覆藉而泲之也藇美貌羜未成羊也輯録爾雅注曰俗呼五月羔為羜也速召也諸父朋友之同姓而尊者也微無顧念也於歎辭粲鮮明貌八簋器之盛也諸舅朋友之異姓而尊者也先諸父而後諸舅者親疏之殺所界反也咎過也言具酒食以樂朋友如此寧使彼適有故而不來而無使我恩意之不至也輯録范氏曰寧適不來豈必期其至哉不來在人弗顧在我躬自厚而不責於人也孔子曰所求乎朋友先施之未能也此可謂能先施矣弗顧有咎則間隙生備極情文以篤朋友之好庶幾和平之有終也伐木于阪叶孚臠反釃酒有愆籩豆有踐在演反兄弟無逺民之失德乾餱音侯以愆叶起淺反有酒湑思吕反我無酒酤音古我坎坎鼓我蹲蹲七旬反舞我逮音待我暇叶後五反矣飲此湑矣興也愆多也踐陳列貌兄弟朋友之同儕者無逺皆在也先諸舅而後兄弟者尊卑之等也輯録通釋曰詩言兄弟多矣鄭風揚之水昏姻之黨唐杕杜雅常棣頍辨斯干行葦等篇同氣之親也此詩則同儕之友也各隨所指而不同耳乾餱食之薄者也輯録說文乾食也徐鍇云今人謂乾飯為餱王制乾豆注謂臘之以為豆實愆過也湑亦釃也酤買也坎坎擊鼓聲蹲蹲舞貌湑我者我湑之也酤我者我酤之也鼓我舞我我鼓我舞之也語皆倒逮及也言人之所以至於失朋友之義者非必有大故或但以乾餱之薄不以分人而至於有愆耳故我於朋友不計有無但及閒暇則飲酒以相樂也失德則相棄絶矣及時相樂以篤朋友之好庶幾和平之有終也輯録輔氏曰民之失德乾餱以愆曰民則自上言下之辭言細民之相失或以薄物飲酒不以相分之故蓋前章既言具厚故此章又以薄者言之且乾餱之愆亦微過耳於微過而尤不敢不謹則其大者可知矣增釋人之於朋友甚以相得而或以乾餱不及之故遂致情義之有間也謂之失德而彼有不及我無所譴則失德之謂何所與於已也但及暇時以我湑我酤我鼓我舞燕飲相樂唯如此可以篤全朋友之道哉伐木三章章十二句首章主言求友二章三章皆以發首章之求友劉氏曰此詩每章首輒云伐木凡三云伐木故知當為三章舊作六章誤矣今從其說正之此篇以求友為主求之之道無他飲食燕樂而已禮文之盛恩意之隆殷勤悃欵無所不至此即求之之道也此古人所以保交道而全天倫也輯録語録伐木大意皆自言待朋友不可不加厚之意所以感發之也天保定爾亦孔之固俾爾單音丹厚何福不除直慮反俾爾多益以莫不庶賦也保安也爾指君也輯録劉辰翁曰詩人爾君雖古人爾汝之常抑非此無以著其親愛諄至之情也固堅單盡也除除舊而生新也往者乃消來者復受福之在已無少間也庶衆也輯録猶所謂其來如幾其多如法也人君以鹿鳴以下五詩燕其臣臣受賜者歌此詩以答其君言天之安定我君使之獲福如此也無時而不受福則積之也極厚故以單厚言無事而不受福則得之也極多故以多益言何福不除以莫不庶正以申言單厚多益之意也此章言福之悠久而又盛大如此輯録通釋曰鹿鳴以下五詩所言非同一事所歌非同一時所宴非同一臣而其臣之答之則唯同歌此詩者蓋凡臣子之祝報其君唯原其福祿夀考而已試取前五詩分而讀之而各以此詩答之尤可見其一時君臣相與殷勤忠厚之意天保定爾俾爾戩子淺反穀罄無不宜受天百祿降爾遐福維日不足賦也聞去聲人氏名滋曰戩與剪同盡也穀善也盡善云者猶其曰單厚多益也罄盡無處而不受福則隨所處而皆善故以戩穀言罄無不宜又覆說戩穀之意也天既使爾盡善而盡無不善則爾於凡事皆安且適而受福甚多矣遐逺也爾有以受天之祿矣而又降爾以福輔氏曰受天百祿已然之事降爾遐福方來之事愚謂受天百祿以上言其盛大降爾遐福以下言其悠久言天人之際交相與也爾既受於天天又錫於爾一受一錫反覆申重所謂交相與也書所謂昭受上帝天其申命用休輯録見益稷蔡氏曰以是昭受于天天豈不重命而用休美乎語意正如此此章言其福之盛大而又悠逺如此輯録通釋曰此與嘉樂之詩所謂宜民宜人受祿于天保佑命之自天申之語意正同蓋此詩歌於宴享之際以答前詩嘉樂歌於繹祭之日以答鳬鷖皆祝願人君之辭也天保定爾以莫不興如山如阜如岡如陵如川之方至以莫不增賦也興盛也髙平曰陸大陸曰阜大阜曰陵皆髙大之意輯録岡為山之髙者陵為阜之大者川之方至言其盛長之未可量也山阜岡陵崇髙而盛大也川之方至增長而悠久也二者皆有興盛之意故用以形容如此輯録語録此及上章皆人臣頌祝其君之言然辭煩而不殺者以其愛君之心無已也吉蠲古𤣥反為饎尺志反是用孝享叶虛良反禴餘若反祠蒸嘗于公先王君曰卜爾萬夀無疆賦也吉言諏日擇士之善蠲言齊戒滌濯之潔諏日卜柔日也擇士選助祭之臣也齊戒其心滌濯其身內外皆致其潔也輯録諏謀也柔日丁巳也必先諏此日明日乃筮見少牢饋食禮將祭必先習射以擇士射中者得與於祭所擇之士謂諸侯諸臣及所貢士也見射義餘見生民饎輯録儀禮有饎爨注炊黍稷曰饎酒食也享獻也宗廟之祭春曰祠夏曰禴秋曰嘗冬曰蒸輯録王制礿禴嘗蒸鄭氏曰此蓋夏殷之祭名周則春曰祠夏曰礿以禘為殷祭也公先公也謂后稷以下至公叔祖類也祖類公叔名即組紺也先王大王以下也輯録鄭氏曰先公謂后稷至諸盩音綢史記曰公叔祖類生古公亶父索隱云古公亶父之父世本作太公組紺諸盩三代世表作叔類孔氏曰周之所追王太王以下太王之前皆為先公問古先追王之禮武王周公以王業肇於太王王季文王故追王三王至於組紺以上則上祀以先公之禮朱子曰然周禮祀先王以衮冕祀先公以鷩冕鷩冕諸侯之服但乃是天子祭先公之禮耳君通謂先公先王也卜猶期也此尸傳神意以嘏主人之詞嘏音假輯録祝為尸致福於主人之詞孔氏曰少牢禮云皇尸命工祝承致多福無疆于汝孝孫之等是傳神辭嘏主人也歐陽氏曰此章又言非惟天之福我君如此至于四時豐潔酒食祀其先公先王而神亦降之福文王時周未有曰先王者此必武王以後所作也此言祖宗降福之故必𫐠嘏詞以柷之者明其出於神意而非無徴之言也將祭而先盡其誠則致祭而必受其福矣神之弔都歷反矣詒以之反爾多福叶筆力反民之質矣日用飲食羣黎百姓遍為爾德賦也弔至也神之至矣猶言祖考來格也詒遺質實也言其質實無僞輯録謝氏曰不澆薄以作僞不巧詐以趨利渾渾然如太古之民是之謂質日用飲食而已耕田鑿井不任私智所謂皥皥如也羣衆也黎黑也猶秦言黔其淹反黑也首也百姓庶民也既曰羣黎又曰百姓所以盡天下之人也為爾德者則而象之猶助爾而為德也民德如此實君德冇以化之但羣黎百姓為之於下反若助人君而為德爾神降多福則不惟福爾一身而已必使民德歸厚而為人君之大福也上章専言其悠久此章専言其盛大福至於此無以加矣輯録嚴氏曰此祝君之福而祝君之德歸美之中冇責難者寓若盡言福祿則全篇皆容悅之辭豈古者君臣相與之義邪凡詩人頌福多兼德言之又言德者民心所自得而曰遍為爾德者民因君而全其天故民之德皆君之德猶曰莫匪爾極也增釋此承上章祭祀而言神之降福推而至於民之質實百姓之為德莫非君之福也亦莫非君之德也所謂德者其一篇之本領歟如月之恆胡登反如日之升如南山之夀不騫起䖍反不崩如松柏之茂無不爾或承賦也恆弦輯録恆訓弦當從古鄧反為正升出也月上弦而就盈輯録八日上弦月體正半似弓之張而弦直又進八分方滿日始出而就明騫虧也承繼也言舊葉將落而新葉已生相繼而長茂也相繼長茂則有加而無已也歐陽子曰此専欲其悠久故多引不虧不壞之物以為况輔氏曰盛大而不悠久則無足稱故末章歸宿於久長之意愚謂三章主言興盛而兼久長之意此章専言久長而兼興盛之意盛大悠久反覆詠歌不一而足也輯録解頤曰日月松柏喻其福之方進而不已南山喻其福之有常而不變天保六章章六句一章二章言天降之福三章極其形容擬議之四章五章言祖考降之福六章極其形容擬議之輯録此詩文意重復以見愛其上深至如此程子曰天保詩盛陳人君受天之祐福祿之厚䝉被臣民由君德之所致也采薇采薇薇亦作叶則故反止曰歸曰歸嵗亦莫音慕止靡室靡家叶古乎反玁音險狁音允之故不遑啓居玁狁之故此章作與莫故叶薇與歸叶家又與居叶興也薇菜名作生出地也莫晚靡無也玁狁北狄也增釋許氏曰史記唐虞以上冇三戎獫狁葷粥戰國後為胸奴注堯曰葷粥周曰玁狁獫與玁同遑暇啓跪也此遣戍役之詩以其出戍之時采薇以食而念歸期之逺也故為其自言而以采薇起興詩以正言出戍之事非為采薇而作也但借當時所事為起語而用四句相呼應耳曰采薇采薇則薇亦作止矣曰歸曰歸則嵗亦莫止矣薇方生而出戊春莫矣方以何時為歸期乎必明年之嵗莫矣預言之以定其志也然凡此所以使我舍其室家而不暇啓居者非上之人故為是以苦我也直以玁狁侵陵之故有所不得已而然耳蓋叙其勤苦悲傷之情而又風去聲以義也輯録通釋曰不遑啓居則勤苦矣曰歸曰歸靡室靡家則悲傷矣此所以叙其私情也一則曰玁狁之故二則曰玁狁之故又因風以公義也一詩之中唯以私情公義反覆為言所以感人者深矣程子曰毒民不由其上輯録此以玁狁之故生義則人懷敵愾音慨之心矣愾怒也指其可怒者而言也輯録左傳文四年敵王所愾輔氏曰程子此言萬世用兵之定法順之則吉悖之則凶又曰古者戍役兩朞而還今年春莫即暮字行明年夏代者至復留備秋至備秋二字與下文防秋相應以至字為句絶過十一月而歸又明年中即仲字春至春莫遣次戍者每秋與冬初兩畨戍者皆在疆圉如今之防秋也此章蓋即啓行之時而言其戍守之故如此輯録熊氏曰北狄畏暑耐寒又秋氣折膠則弓弩可用故秋冬易為侵暴每留屯以防之采薇采薇薇亦柔止曰歸曰歸心亦憂止憂心烈烈載飢載渴叶巨烈反我戌未定靡使歸聘興也柔始生而弱也烈烈憂貌載則也定止聘問也言戍人念歸期之逺而憂勞之甚然戍事未已則無人可使歸而問其室家之安否也此章則預言其在道之時而欲以義勝恩如此輯録輔氏曰戍者勤苦之情大概最切者有四一則有舍其室家之悲二則冇不遑啓居之勞三則有載飢載渴之苦四則有不得其家音信之憂故此詩於首兩章備道此四事以慰之采薇采薇薇亦剛止曰歸曰歸嵗亦陽止王事靡盬不遑啓處憂心孔疚叶訖力反我行不來叶六直反興也剛既成而剛也輯録李氏曰始遣戍時薇始生其後薇長而柔又其後薇壯而剛以見天時之變爾陽十月也時純隂坤用事嫌於無陽故名之曰陽月也前言嵗莫而歸啓行時也此言嵗陽戍畢將歸時也輯録問十月何以為陽月朱子曰剝盡而坤復則一陽生也復之一陽不是頓然便生乃自坤卦積來如一月三十日以復之一陽分作三十分從小雪後一日生一分到十一月半一陽始成以此見天地無休息增釋十月本隂而名陽是陽無可盡之理故也聖人設卦坤為純隂之象上六曰龍豈非抑隂扶陽之意乎孔甚疚病也來歸也此見士之竭力致死無還心也此章亦預言其在道之時而欲捐生赴義如此上章國事為重而家為輕此章王事為重而身為輊是皆所以教之也彼爾維何維常之華芳旡胡瓜二反彼路斯何君子之車斤於尺奢二反戎車既駕四牡業業豈敢定居一月三捷興也爾華盛貌輯録釋音爾乃禮反與薾通常常棣也路戎車也君子謂將帥並去聲也輯録孔氏曰乘路車而稱君子故知謂將帥得稱路者左傳鄭子僑叔孫豹王賜之大路足卿車得稱路車業業壯也捷勝也彼爾然而盛者常棣之華也彼路車者君子之車也此専以語相呼為興與何彼穠矣同例戎車既駕而四牡盛矣則何敢以定居乎庶乎一月之間三戰而三捷矣此章預言其在戍所之時而畜勇以待敵者如此駕彼四牡四牡騤騤求龜反君子所依小人所腓符非反四牡翼翼象弭彌氏反魚服叶蒲北反豈不日戒叶訖力反玁狁孔棘賦也騤騤强也依猶乘也腓猶芘也程子曰腓隨動也如足之腓足動則隨而動也輯録黃氏曰吳伯豐嘗問先生曰腓為先足而動不當引之以解此詩之義不若猶芘之得也生民詩牛羊腓字之傳亦以腓為芘先生答曰兩說誠不合當刪去按朱傳固不當兼收二說伯豐尤不當云隨動之說而存猶芘之說也毛氏初釋腓字為避字鄭氏知避之說難通遂云腓當作芘蓋改腓為芘非訓腓為芘也又豈可因其改字遂訛以為字訓耶若以腓為隨動雖祖程說而程非自為之言也字書腓者脛腨易之咸艮皆取象於腓以著其隨物而動伯豐何乃以先動為疑世豈有足不動而足肚自先動者乎若生民詩牛羊腓字之正以牛羊足不踐棄路之嬰兒以足肚回護而過之若字愛然爾亦不當援為芘義之證故此詩腓字朱傳止當獨留程說翼翼行音杭列整治去聲之狀象弭以象骨飾弓弰師交反也魚獸名似猪東海有之其皮背上斑文腹下純青可為弓鞬居言反弓衣也矢服也戒警棘急也言戎車者將帥之所依乘戍役之所芘倚輯録劉執中曰君子則依之以為備禦也小人則腓之以為進退也嚴氏曰遣將率戍役同歌是詩故以君子小人兼言之且其行列整治而器械精好如此豈不日相警戒乎玁狁之難甚急誠不可以忘備也此章以預言在戊所之時而致謹以防冦者如此上章不敢有畏心此章不敢冇慢心亦皆所以教之也輯釋通釋曰此及上章皆託為軍士自言車馬器械之盛備而以章末専以公義為言所以美之所以風之也昔我往矣楊栁依依今我來思雨于付反雪霏霏芳菲反行道遲遲載渴載飢我心傷悲莫知我哀叶於希反賦也楊栁蒲栁也輯録謝氏曰依依者初抽條之時質柔性弱嫋娜不定如欲依倚它物也霏霏雪盛貌遲遲長逺也此章又設為役人預自道其歸時之事以見其勤勞之甚也程子曰此皆極道其勞苦憂傷之情也上能察其情則雖勞而不怨雖憂而能勵矣范氏曰豫於采薇見先王以人道使人後世則牛羊而已矣此章預言其來歸之時道塗感慨如此首章風諭以不得已之意末章體悉以不忍人之心起結兩章相應也采薇六章章八句前三章雖兼私情公義言而重在義四章五章専言公義六章専言私情教戒以倡其勤憫恤以致其悅使人之道當然也此詩見先王仁厚之至增釋許氏曰采薇以下三詩雖曰遣戍勞還而専主於玁狁蓋非泛言也抑當是之時有玁狁連西戎為中國之患命將出師或周公作此詩而遣勞之故能深知其情而極道之而且勸之如此後凡出師則皆以歌之也我出我車于彼牧叶莫狄反矣自天子所謂我來叶六直反矣召彼僕夫謂之載叶節力反矣王事多難乃旦反維其棘矣賦也牧郊外也邑外曰郊郊外曰牧自從也天子周王也僕夫御夫也此勞去聲還音旋率與帥同之詩追言其始受命出征之時出車於郊外而語去聲其人曰我受命於天子之所而來於是乎召僕夫使之載其車以行而戒之曰王事多難是行也不可以緩矣𫐠其往時忠敬之心以勞之我出我車于彼郊叶音髙矣設此旐音兆矣建彼旄音毛矣彼旟音餘旐斯胡不斾斾叶蒲寐反憂心悄悄僕夫況瘁以醉反賦也郊在牧內輯録劉氏曰都城外五十里為近郊百里為逺郊也蓋前軍已至牧而後軍猶在郊也輯録邱氏曰將言建旐設旄之事又本出車言之也設陳也龜蛇曰旐建立也旄注旄於旗干之首也鳥隼曰旟鳥隼龜蛇曲禮所謂前朱雀而後𤣥武也楊氏曰師行之法四方之星各隨其方以為左右前後輯録曲禮陳氏曰朱雀𤣥武青龍白虎四方宿名也以為旗章其旒數皆效之龍旗則九旒雀則七旒虎則六旒龜蛇則四旒也進退有度各司其局局部分也左者常左右者常右前後亦然不易其所也語本曲禮輯録曲禮云進退有度左右有局各司其局鄭氏曰度謂伐與步數疏曰如牧誓所云左右有局者軍之左右各有部分不相濫也各司其局者軍行須監領也則士無失伍離次矣斾斾飛揚之貌悄悄憂貌况兹也或云當作恍况上聲言出車在郊建設旗幟音熾彼旗幟者豈不斾斾而飛揚乎但將帥方以任大責重為憂而僕夫亦為之恐懼而憔悴耳旟旐有威武奮揚之勢而將士則不免憂懼斂束之心也輯録謝氏曰兵凶器戰危事不可以易心處之為將帥者憂心則悄悄為僕夫者情况則憔悴皆臨事而懼者善用兵也東萊吕氏曰古者出師以喪禮處之輯録老子偃武章云吉事尚左凶事尚右偏將軍居左上將軍居右言以喪禮處之殺人之衆以悲哀泣之戰勝以喪禮處之命下之日士皆泣涕輯録孫子九地篇云令發之日士卒坐者涕霑襟偃卧者涕交頤增釋金履祥曰出師以喪禮處之士涕泣蓋必死也惟必死是以能勝之也夫子之言行三軍亦曰臨事而懼皆此意也述其往時憂懼之心以勞之也王命南仲往城于方出車彭彭叶鋪郎反旗旐央央於良反天子命我城彼朔方赫赫南仲玁狁于襄賦也王周王也南仲此時大將也方朔方今靈夏等州之地輯録毛氏曰近玁狁之國也彭彭衆盛貌交龍為旗此所謂左青龍也央央鮮明也赫赫威名光顯也襄除也或曰上也與懷山襄陵之襄同輯録見堯典言勝之也東萊吕氏曰大將傳天子之命以令軍衆於是車馬衆盛旗旐鮮明威靈氣熖赫然動人矣兵事以哀敬為本而所尚則威二章之戒懼三章之奮揚並行而不相悖也敬則不輕敵勇則不畏敵二者必相濟也與采薇四章五章之意相似程子曰城朔方而玁狁之難除禦戎狄之道守備為本不以攻戰為先也述其往時發揚之氣以勝之昔我往矣黍稷方華叶芳無反今我來思雨于付反雪載塗王事多難不遑啓居豈不懷歸畏此簡書賦也華盛也塗涷釋而泥塗也東風解凍之時簡書戒命也鄰國有急則以簡書相戒命也或曰簡書䇿命臨遣之詞也從後說優輯録語録云前說只據左氏簡書同惡相恤之謂然此是天子戒命不得謂之鄰國孔氏曰古者無紙冇事則書於簡此言其既歸在塗而本其往時所見與今還時所遭以見其出之久也述其來歸之時道塗感慨之情以勞之東萊吕氏曰采薇之所謂往遣戍時也此詩之所謂往在道時也采薇之所謂來戍畢時也此詩之所謂來歸而在道時也喓喓於遙反草蟲躍躍他歷反阜螽未見君子憂心忡忡敕中反既見君子我心則降户江反叶胡攻反赫赫南仲薄伐西戎賦也此言將帥並去聲之出征也其室家感時物之變而念之以為未見而憂之如此必既見而後心可降耳此與召南草蟲同但彼為婦人自述之詞此則述婦人之情而代賦其事耳然此南仲今何在乎方往伐西戎而未歸也述其未至之時室家思念之情以勞之豈既却玁狁而還師以伐昆夷也與薄之為言聊也蓋不勞餘力矣春日遲遲卉許貴反木萋萋七西反倉庚喈喈音皆叶居奚反采蘩祁祁巨移反執訊音信獲醜薄言還音旋歸赫赫南仲玁狁于夷賦也卉草也萋萋盛貌倉庚黃鸝也喈喈聲之和也訊其魁首當訊問者也醜徒衆也夷平也歐陽氏曰述其歸時春日暄妍草木榮茂而禽鳥和鳴遣戍之又明年仲春至則此時也於此之時執訊獲醜而歸豈不樂音洛哉述其今日凱還之功以勞之鄭氏曰此詩亦伐西戎獨言平玁狁者玁狁大故以為始以為終出車六章章八句前三章啓行時也四章五章歸而未至時也六章既歸時也輯録程子曰此詩所賦自受命至還歸其事有叙大要在歸功將帥增釋吳師道曰一章受命戒警二章臨時戒懼三章威怒奮揚出征時也四章感慨勞苦五章感念室家六章和樂歡欣既征而歸也先戒懼而後奮怒故其怒也無敵先勞苦而後悅樂故其樂也有終非但曲盡人情抑且當乎義理詩人善言如此有杕大計反之杜有睆華板反其實王事靡盬繼嗣我日日月陽止女心傷止征夫遑止賦也睆實貌嗣續也陽十月也此即遣戍之明年十月出車所謂嵗亦陽止之時也遑暇也此勞去聲還音旋役之詩故追𫐠其未還之時室家感於時物之變而思之曰特生之杜有睆其實則秋冬之交矣而征夫以王事出乃以日繼日而無休息之期此詩前三章雖有王事靡盬一句而實重在私情也至于十月可以歸而猶不至故女心悲傷而曰征夫亦可以暇矣曷為而不歸哉輯録通釋曰次年十月乃戍畢之時故采薇遣戍之際預言嵗亦陽止以為歸期此章之思望征夫者亦以日月陽止而知其遑暇也或曰興也謂之興則賦時物以起興爾下章倣此有杕之杜其葉萋萋王事靡盬我心傷悲卉木萋止女心悲止征夫歸止賦也萋萋盛貌春將暮之時也歸止可以歸也此又戍畢之明年二月既還而未至時也程子謂遣戍之又明年中春仲至則此時為當至矣若三章言采杞則春已暮春暮而不歸則過期矣故四章言期逝不至輯録輔氏曰王事靡盬者公義也我心傷悲者私情也雖其室家亦情義並行而不相悖也陟彼北山言采其杞王事靡盬憂我父母叶滿洧反檀車幝幝尺善反四牡痯痯古緩反叶古轉反征夫不逺賦也檀木堅宜為車幝幝敝貌痯痯罷音皮貌登山采杞則春已暮而杞可食矣杞枸杞也莖幹三五尺作叢春可作羮茹微苦蓋託以望其君子而念其以王事詒父母之憂也輔氏曰以王事詒父母之憂則非獨以室家之情而已然檀車之堅而敝矣四牡之壯而罷矣則征夫之歸亦不逺矣輯録通釋曰杞可采食而征夫猶未至則春已暮而愈過期矣故知其行必不逺矣匪載匪來叶六直反憂心孔疚叶訖力反期逝不至叶朱力反而多為恤卜筮偕叶舉里反止㑹言近叶渠紀反止征夫邇止賦也載裝疚病逝往恤憂偕俱㑹合也言征夫不裝載而來歸固已使我念之而甚病矣况歸期已過而猶不至則使我多為憂恤宜如何哉輯録胡氏曰王氏云而多為恤飢渴歟疾病歟死傷歟是何期逝不至也故且卜且筮輯録灼龜曰卜揲蓍曰筮揲實葉反蓍非脂反相襲俱作合言於繇音宙而皆曰近矣卜有兆辭筮有占辭皆曰繇則征夫其亦邇而將至矣輯録輔氏曰征夫不逺想料之辭也征夫邇止决定之辭也歸期近而思愈切者人情也期逝不至然後憂傷孔疚焉范氏曰以卜筮終之言思之切而無所不為也前三章皆有王事靡盬一句則因公義以起私情也末章不然則與過期不至憂思百端私情愈迫而義冇不暇言矣杕杜四章章七句一章戍畢之時二章歸而當至之時三四章過期而將至之時增釋許氏曰一章言冬未歸二章言至春將莫而未歸三章言春已莫而未歸四章言所期俱過而將歸也鄭氏曰遣將帥並去聲及戍役同歌同時欲其同心也反而勞之異歌異日殊尊卑也記曰賜君子小人不同日此其義也王氏曰出而用兵則均服同食一衆心也入而振旅則殊尊卑辨貴賤定衆志也范氏曰出車勞率故美其功杕杜勞衆故極其情先王以已之心為人之心故能曲盡其情使民忘其死以忠於上也輯録嚴氏曰杕杜四章皆不言戊役來歸之事唯𫐠其未歸之時室家思望之切如此則今日之歸其喜樂為何如也所以慰勞之李氏曰其遣也則預述其懷歸之事其還歸也又不忘其行役之勞故三詩遣勞帥役之事雖不同而敘其往反終始之情則一也輔氏曰鄭王范氏所發之意皆得詩人之㫖但勞帥勞役體悉其情無所不至而略不及論功行賞之事者何哉蓋古者竭誠盡瘁以勤王之事者人臣之義也君臣各行其事而已下不以賞而望其上上不以賞而夸乎下此君臣相與之至情也豈後世所能及哉胡庭芳曰王氏云上之人能知其下中心委曲之情而形於歌詠則下悅之出車枤杜是也上之人不能知而其下自陳其勞苦之狀悲傷之情則怨也揚之水鴇羽是也南陔此笙詩也有聲無詞舊在魚麗之後以儀禮考之其篇次當在此今正之說見華黍至此者意鹿鳴之什十篇一篇無辭凡四十六章二百九十七句白華之什二之二毛公以南陔以下三篇無辭故升魚麗以足鹿鳴什數而附笙詩三篇於其後因以南有嘉魚為次什之首今悉依儀禮正之毛公謂南有嘉魚之什蘇氏謂其非古乃本之六月之序為南陔之什然升魚麗猶仍毛說也徴之儀禮不合故朱子定為白華之什輯録見燕禮鄉飲酒禮篇白華笙詩也說見上下篇華黍亦笙詩也鄉飲酒禮鼓瑟而歌鹿鳴四牡皇皇者華然後笙入堂下磬南北靣立樂南陔白華華黍輯録注云以笙吹此詩以為樂也燕禮亦鼓瑟而歌鹿鳴四牡皇華然後笙入立于縣平聲中鐘鼓之縣也輯録何伯善曰縣樂之中也奏南陔白華華黍南陔以下今無以考其名篇之義然曰笙曰樂曰奏而不言歌則有聲而無詞明矣輯録鄭樵曰古者絲竹與歌相和故有譜無詞所以六詩在三百篇中但有名耳漢儒不知謂為六亡詩非也黃氏曰古之樂章今之琴譜類也琴譜有操詞具存者鹿鳴之詩之歌也有徒存其譜而無辭曲之可歌者如長清短清與長側短側之例雖無其辭未嘗無義也此亦不足疑也所以知其篇第在此者意古經篇題之下必有補焉如投壺魯鼓薛鼓之節而亡之耳魯鼓半薛鼓半此魯鼓薛鼓之節也圓者擊鼙方者擊鼓擊其鼙其聲下其音榻榻然擊其鼓其聲髙其音鏜鏜然燕禮用其全投壺用其半以下也輯録見禮記投壺篇末方性夫曰魯薛之鼓既異而傳之者又異是以記者兩存之魚麗力馳反于罶音栁與酒叶鱨音嘗鯊音沙叶蘇何反君子有酒㫖且多興也麗歷也罶以曲簿為笱而承梁之空音孔者也鱨揚也揚字本作鰑以其輕揚善飛故曰揚今黃頰魚是也似燕頭魚句說本陸璣諸家援引不同或以頭字作頷字或無似字或以身字為句絶此據孔疏所引以魚字為句絶身形厚而長大頰骨正黃魚之大而有力解下賣反飛者鯊鮀徒何反也魚狹而小常張口吹沙故又名吹沙君子指主人㫖且多㫖而又多也此燕饗通用之樂歌即燕饗所薦之羞而極道其美且多見主人禮意之勤以優賓也優厚也此不主言魚借之以為起語耳但罶中之魚既有鱨又有鯊君子之酒既已㫖又且多則又以二者兼備之意為興也增釋古人燕饗物致盛備蓋無非以寓其誠敬而賓亦樂其優勤之意也或曰賦也鱨鯊既為所薦之羞則謂之直賦其事亦可下二章放此輯録朱子曰古人以魚為重故魚麗南有嘉魚皆特舉以歌之魚麗于罶魴鱧音禮君子有酒多且㫖興也鱧鮦同重二音也輯録本草云今黑鯉魚又曰鯇音睆也輯録舍人曰鱧名鯇爾雅注華板反今鯶魚似鱒而大鱧今只謂之鱧服食家忌食魚麗于罶鰋音偃鯉君子有酒㫖且有叶羽已反興也鰋鮎念平聲也輯録詩詁云鮎腹平著地故得偃名爾雅注鰋今白魚也偃鼻向額故名鮎今只謂之鮎江東通呼為鮧埤雅曰鱨鯋之美不若魴鱧魴鱧之美不若鰋鯉故其序如此又曰鱨黃魴青鯉𤣥鰋白鯉赤則五色之魚皆備也有猶多也物其多矣維其嘉叶居何反矣賦也物其㫖矣維其偕叶舉里反矣賦也物其有叶羽已反矣維其時叶上紙反矣賦也蘇氏曰多則患其不嘉㫖則患其不齊有則患其不時今多而能嘉㫖而能齊有而能時言曲全也齊猶備也㫖即是嘉有即是偕有則無一不具而多不足言有而且時則鮮美畢備比之嘉㫖又難矣增釋許氏曰物雖盛多㫖偕有必適當其時然後盡善所謂時者不専為用之之時也苟非國家閒暇內外無故則物雖盛不能全其樂也吳師道曰此後三章恐亦可作一章是衍前所言之意魚麗六章三章章四句三章章二句此詩用㫖多多㫖疊言之而意以漸而深輯録陳定宇曰前三章多㫖有皆以酒言而後三章衍前三章之辭皆曰物以見物之與酒稱也按儀禮鄉飲酒及燕禮前樂既畢前樂謂歌鹿鳴四牡皇華奏南陔白華華黍也皆間歌魚麗笙由庚歌南有嘉魚笙崇丘歌南山有臺笙由儀間代也言一歌一吹也然則此六者蓋一時之詩而皆為燕饗賓客上下通用之樂輯録朱子曰魚麗諸篇皆君臣燕飲之詩道主人意以譽賔如今宴飲致語之類亦有間敘賓客醉者漢書載客歌驪駒主人歌客無庸歸亦此意毛公分魚麗以足前什而說者不察遂分魚麗以上上聲為文武詩嘉魚以下為成王詩其失甚矣由庚此亦笙詩說見魚麗南有嘉魚蒸之承反然罩罩張教竹卓二反君子有酒嘉賓式燕以樂五教歷各二反興也南謂江漢之間嘉魚鯉質鱒才損反鱗肌肉甚美諸本作鱒鯽肌誤增釋吳師道曰諸本作鯉質鱒鯽肌按詩記引山隂陸氏曰鯉質鱒鱗肌肉甚美傳是本此而本有誤脫今興國刋本朱鑑所傳者鯉質鱒鱗為是鯽字誤無疑出於沔南之丙穴蜀都賦云嘉魚出於丙穴注云在漢中沔南縣以穴口南丙故也蒸然發語聲也罩篧仕魚反也輯録爾雅疏今楚篧也罩以竹為之或以荆故謂之楚篧編細竹以罩魚者也重言罩罩非一之詞也此亦燕饗通用之樂故其辭曰南有嘉魚則必蒸然而罩罩之矣君子有酒則必與嘉賓共之而式燕以樂矣此亦因所薦之物而道達主人樂賓之意也以魚起興與魚麗同所薦之物不止於魚特借此為起語爾然魚必取以供燕饗酒必舉以樂賔客則又以用物之義為興也南有嘉魚蒸然汕汕所諌反君子有酒嘉賓式燕以衎苦旦反興也汕樔音嘲也以簿汕魚也簿曲簿也李氏曰以簿取魚曰汕衎樂也南有樛居幽反木甘瓠音護纍力追反之君子有酒嘉賓式燕綏之興也東萊吕氏曰瓠有甘有苦甘瓠則可食者也樛木下垂而美實纍之固結而不可解也愚謂此興之取義者似比而實興也主人卑禮而喜賓樂之綢繆繾綣亦若此也此以相得之意為興翩翩者隼之誰反蒸然來叶六直陵之二反思君子有酒嘉賓式燕又叶夷昔反或如字思興也此興之全不取義者也但以思字相呼為興思語辭也又既燕而又燕以見其至誠有加而無已也或曰又思言其又思念而不忘也前說為優南有嘉魚四章章四句以樂以衎則樂已至燕而綏之則樂已久燕而又燕則所以樂而安之者尤不一也燕樂之意以漸而深說見魚麗崇丘說見魚麗南山有臺叶田飴反北山有萊叶陵之反樂音洛只音紙君子邦光之基樂只君子萬夀無期興也臺夫音符須即莎草也輯録本草曰其實名香附子萊草名葉香可食者也君子指賓客也此亦燕饗通用之樂故其辭曰南山則有臺矣北山則有萊矣此言山有臺萊耳分屬兩句互文也樂只君子此句義與周南樛木同燕飲之際自言喜此君子也則邦家之基矣德堪重任樂只君子則萬夀無期矣南山北山有臺又有萊君子之人有德又冇此福其所冇者皆不一也故以起興所以道達主人尊賓之意美其德而祝其夀也美者即其所有而美之祝者期之於後來君子之福無窮則邦家之基亦永永無窮矣輯録通釋曰詩中所謂德音所謂民之父母邦家之基與光皆所以美其德也所謂夀考者皆所以祝其夀也通前魚麗嘉魚兩篇皆一時樂工所歌彼為優賓樂賓則此詩所以美之祝之者為尊賓也南山有桑北山有楊樂只君子邦家之光樂只君子萬夀無疆興也南山有杞北山有李樂只君子民之父母叶滿彼反樂只君子德音不已興也杞樹如樗一名狗骨民之父母謂愛利及民民所瞻仰者也既為邦家之基又為邦家之光又為民之父母則得美譽甚矣而且願其常有弗替也故以德音不已祝之德音不已則基益以固光益以盛父母斯民之心益切而民益親其上矣南山有栲音考叶音口北山有杻女九反樂只君子遐不眉夀叶直酉反樂只君子德音是茂叶莫口反興也栲山樗杻檍音億也遐何通眉夀秀眉也秀眉眉有秀毛也長眉秀出於其間為夀徵茂盛也茂則加長不但不已而已享眉夀而德音又加茂焉則年彌高德彌邵矣一章二章則有是德而願其有是福也此章則有是福而尤願其有是德也有年無德斯亦不足稱也已南山有枸俱甫反北山有梗音庾樂只君子遐不黃耇音苟叶果五反樂只君子保艾五蓋反爾後叶下五反興也枸枳枸樹髙大似白楊有子著直略反枝端大如指長數寸噉音啖之甘美如飴音移八月熟亦名木蜜輯録本草曰木蜜生南方枝葉皆可噉亦可煎食如飴其子一名枳柤味如蜜以木作屋屋中酒則味薄柤音矩漢問枸朱子曰機枸子建陽謂之皆拱子俗謂之癩指頭吾鄉呼為兼勾味甘而解酒毒人家左右前後有此木則醖酒不成楰鼠梓樹葉木理如楸音秋亦名苦楸黃老人髮復黃也耇老人面凍梨色如浮垢也保安艾養也黃耇者一身之福而已保艾爾後則福及子孫而以賢繼賢家國人民永有賴矣南山有臺五章章六句三章以前美而後祝四章以後専於祝一詩之意亦以漸而深也輯録輔氏曰後二章言遐不眉夀遐不黃耉與首章次章末句相應萬夀無期萬夀無疆者願之之辭也遐不眉夀遐不黃耇者必之之辭也解頥曰此詩前二章先德而後夀故第三章極言盛德之效以終前二章之意第四章先夀而後德故第五章極言夀考之效以終第四章之意增釋許氏曰上一截初曰邦家之基以其本而言次曰邦家之光則發而冇光華矣又次言民之父母則以其效言也其下則祝其夀而已眉夀固夀矣髮白而復黃面梨而浮垢又老之甚者也下一截前兩章祝其夀就君子之身而言次兩章曰德音不已而茂則以及於人者言之末則又言保艾其後又非一時也此詩雖各以兩木起興易韵成文而其言亦有叙也說見魚麗由儀說見魚麗蓼音六彼蕭斯零露湑息吕反兮既見君子我心寫叶想羽反兮燕笑語兮是以有譽處兮興也蓼長大貌蕭蒿也輯録嚴氏曰蕭香蒿也荻也牛尾蒿也湑湑然蕭上露貌君子指諸侯也寫輸寫也燕謂燕飲譽善聲也善聲即笑語之善聲也處安樂也蘇氏曰譽豫通凡詩之譽皆言樂也亦通諸侯朝于天子天子與之燕以云慈惠記注云享以嚴為主故曰訓恭儉燕以親為主故曰示慈惠輯録慈愛恩惠也故歌此詩言蓼彼蕭斯則零露湑然矣既見君子則我心輸寫而無留恨矣是以燕笑語而有譽處也零露於蓼蕭天子之心寫於諸侯皆天道之下濟者而語又相應也故為興夫上下交而志意通則君臣皆遂其樂矣若此有所疑彼有所畏猜嫌妨忌安能致此樂乎其曰既見蓋於其初燕而歌之也蓼彼蕭斯零露瀼瀼如羊反既見君子為龍為光其德不爽叶師莊反夀考不忘興也此其起興與上章同皆上交於下之意也下章亦然瀼瀼露蕃貌龍寵也為龍為光喜其德之詞也我以為龍我以為光則中心之喜可見矣此與我心寫兮相應爽差也其德不爽則夀考不忘矣德無差失則長久安寧為龍為光可保其終以夀考不忘為長久安寧見秦風終南故傳不重釋褒美而祝頌之又因以勸戒之也褒美自為龍為光言祝頌自夀考不忘言其德不爽則勸戒之詞也輯録解頤曰赤芾金舄㑹同有繹則為龍為光矣彼交匪敖彼交匪紓則其德不爽矣萬夀無疆萬夀無期則夀考不忘矣夫諸侯固賴天子以為本根天子亦賴諸侯以為屏蔽苟諸侯之不朝事則王室之卑亦可知矣故觀其車服之盛享其多儀之誠而天子之心得以自慰焉則其以為寵光也豈一時之虛僞云乎哉蓼彼蕭斯零露泥泥乃禮反既見君子孔燕豈弟冝兄冝弟待禮反令德夀豈開改反叶去禮反興也泥泥露濡貌孔甚豈樂音洛弟易去聲也孔燕豈弟言甚燕而甚樂無憂懼不平之意也此與笑語譽處相應冝兄冝弟猶曰宜其家人蓋諸侯繼世而立多疑忌其兄弟如晉詛無畜音勗養也羣公子晉自驪姬之亂詛無畜羣公子自是晉無公族輯録詛盟誓又見汾沮洳秦針音鉗懼選之類秦針景公弟也得罪於景公其母曰弗去懼選注曰選數也恐景公數其罪而加戮也輯録見左傳昭公元年故以宜兄宜弟美之亦所以警戒之也輯録通釋曰諸侯繼世而立三年喪畢則入朝于王此詩於其來朝而歌之夀豈夀而且樂也輯録濮氏曰甚燕而情樂易則知其宜兄弟而德可久也通釋曰令德夀豈即上章末二句之意而宜兄宜弟者又即不爽其德之本而所以為教國人者也蓼彼蕭斯零露濃濃奴同反既見君子鞗音條革沖沖敕弓反和鸞雍雍萬福攸同興也濃濃厚貌鞗轡也革轡首也馬轡所把之外有餘而垂者也輯録孔氏曰鞗革皮為之故曰鞗革沖沖垂貌和鸞皆鈴也輯録埤雅曰雌曰和雄曰鸞在式曰和在鑣曰鸞皆諸侯車馬之飾也輯録集傳於駟鐵以為乘車之鸞在衡則此傳鑣字恐當作衡字衡是車前橫木駕馬者軾是車上橫木可慿者升車則馬動馬動則鸞鳴鸞鳴則和應舒則不鳴疾則失音皆不合節奏庭燎亦以君子目諸侯而稱其鸞旗之美正此類也攸所同聚也諸侯之福天子之所賜也車馬如此而沖沖雍雍然從容自得其安樂也甚矣非萬福之所聚乎又以終首章譽處之意蕭三章以前皆用兩句興此則盡一章而興之蓋蓼承露之厚正以興諸侯受福之多也蓼蕭四章章六句輯録輔氏曰一章燕笑語兮是以有譽處兮通上下而言之天子與諸侯皆然也下三章則専美諸侯二章三章則又因以勸戒而警教之也增釋許氏曰然天子雖為天下之共戴而其用禮乃與其臣非有大相遼絶之勢蓋逺則疏而近則親疏則離而親則合故天子之禮用十有二而上公之禮用九君臣相去之間特三命爾所以三公坐而論道更相可否堯庭之都俞吁咈虞庭之賡歌君臣之間雍雍和樂而敬愛之心未嘗不存乎其中三代聖君蓋莫不由是道也觀宴樂羣臣之諸詩可見矣至於蓼蕭之詩尤見卑孫樂易直猶賓主相敵喜幸之辭安有一毫自尊陵下之意其曰見君子而我心寫燕笑語是以有譽處固備其謙接之語至曰為龍為光則又其卑孫之極者也上之人禮容揖孫乃如此而為下者所以承順悅服又當如何耶豈弟之氣象盈於朝廷被於天下其化安得不至於比屋可封哉自秦始皇尚氣勢而不知德義又自尊而卑人務使君臣之禮懸絶如天地然後上下之情離而亂臣賊子奸名犯分者愈衆矣湛湛直咸反露斯匪陽不晞音希厭厭於鹽反夜飲不醉無歸興也湛湛露盛貌陽日晞乾也厭厭安也亦久也足也夜飲私燕也輯録孔疏君留而盡私恩之義故言私燕燕禮宵則兩階及庭門皆設大燭焉引此以明有夜飲之禮輯録儀禮燕禮曰宵則庶子執燭於阼階上司宫執燭於西階上甸人執大燭於庭閽人為大燭於門外燕禮輕無庭燎設大燭而已此亦天子燕諸侯之詩言湛湛露斯非日則不晞以興厭厭夜飲不醉則不歸二者皆有久而不厭之意故用其語相呼為興蓋於其夜飲之終而歌之也諸侯來朝以早則敬之至天子燕之及夜則愛之深故蓼蕭湛露皆即時物而以露起興輯録燕禮君曰無不醉賓及卿大夫皆對曰諾敢不醉湛湛露斯在彼豐草厭厭夜飲在宗載考興也豐茂也夜飲必於宗室蓋路寢之屬也輯録燕禮云膳宰具官饌于寢東公羊傳路寢者何正寢也何休注曰公之正居也路者大也寢者居也考成也成者成其禮也露在豐草則膏澤深飲在宗室則恩意厚故以為興而又用在兩字相呼也湛湛露斯在彼把棘顯允君子莫不令德興也顯明允信也輯録謝氏曰顯者其心明白洞達允者其心忠信誠慤君子指諸侯為賓者也令善也令德謂其飲多而不亂德足以將之也將扶助也杞棘性堅强承露雖厚而不低屈飲酒之盛而不困於酒則可謂有令德矣輔氏曰莫不令德言與燕之諸侯皆有令德也其桐其椅於宜反其實離離豈弟君子莫不令儀興也離離垂也令儀言醉而不喪其威儀也桐梓柔美而實下垂飲酒之卒不以酒而强則可謂有令儀矣此二章起興若無義但顯明信實宜為剛德和樂寬易類乎柔德故前章以杞棘之堅强為興後章以桐梓之柔美為興嚴氏詩緝云然頗似得之至若令德令儀則互文爾有是德則有是儀矣湛露四章章四句前二章見親愛之至情後二章有戒飭之微意春秋傳寧武子曰諸侯朝音潮正於王朝正者謂朝而受正教也王宴樂音洛之於是賦湛露輯録見文公四年曽氏曰前兩章言厭厭夜飲後兩章言令德令儀雖過三爵亦可謂不繼以淫矣輯録春秋傳云臣侍君燕不過三爵又曰酒以成禮不繼以淫白華之什十篇五篇無辭凡二十三章一百四句詩經疏義㑹通卷九
