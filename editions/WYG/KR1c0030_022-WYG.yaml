body:
  text: 詩經疏義㑹通卷二十元朱公遷撰魯頌四之四魯少皥之墟在禹貢徐州蒙羽之野成王以封周公長子伯禽今襲慶東平府沂宻海等州即其地也輯錄襲慶府今兖州府東平府今東平州海州今寧海州宻州今髙宻縣與沂州並隷山東成王以周公有大勲勞於天下故賜伯禽以天子之禮樂魯于是乎有頌以為廟樂其後又自作詩以羙其君亦謂之頌以其皆稱羙頌禱之詞故不謂之風而謂之頌輯錄王氏曰魯頌皆以羙其君于宗廟無預其詩似用以燕樂此頌之變也舊説皆以為伯禽十九世孫僖公申之詩輯錄孔氏曰從周公數之故為十九世今無所考獨閟宫一篇為僖公之詩無疑耳夫以其詩之僭如此然夫子猶錄之者盖其體固列國之風而所歌者乃當時之事鄭衛武公亦有頌羙之詩而十二國風歌咏當時之事者甚多則猶未純於天子之頌天子之頌則歌於宗廟之中以成功告於神明者也若其所歌之事又皆有先王禮樂教化之遺意焉祭祀燕飲修閟宫攘外夷皆禮樂教化之遺意則其文疑若猶可予上聲也况夫子魯人亦安得而削之哉然因其實而著之而其是非得失自有不可揜者亦春秋之法也春秋之法直書其事而善惡自見輯錄考素曰亦如存淫亂之詩使后世有見其非耳非謂其言之當也或曰魯之無風何也先儒以為時王襃周公之後比於先代故廵守不陳其詩而其篇第不列於大師之職是以宋魯無風其或然歟輯錄蘇氏曰春秋之際大國皆有變風宋魯獨無風有頌鄭氏云宋王者之後魯聖人之後是以天子廵狩不陳其詩所以禮之也或謂夫子有所諱而削之則左氏所記當時列國大夫賦詩及吴季子觀周樂皆無曰魯風者其説不得通矣魯之醜惡無如文姜之事夫子存于齊風槩可見矣駉駉古反榮牡馬叶滿補反在坰古榮反之野叶上與反薄言駉者叶章與反有驈户橘反有皇有驪力知反有黄以車彭彭叶鋪郎反思無疆思馬斯臧賦也駉駉腹幹肥張貌幹謂馬脇張大也邑外謂之郊郊外謂之牧牧外謂之野野外謂之林林外謂之坰輯錄傳坰逺野也驪馬白跨曰驈輯錄疏郭墣曰跨髀間也然則跨者所跨據之處黄白曰皇純黒曰驪黄騂曰黄彭彭盛貌以之駕車則彭彭然思無疆言其思之深廣無窮也臧善也此詩言僖公牧馬之盛由其立心之逺此言僖公牧馬之盛用序説也但前云舊説以魯頌四篇皆為僖公之詩今無所考獨閟宫為僖公詩無疑耳如此則僖公二字似當以魯侯二字易之故羙之曰思無疆則思馬斯臧矣立心逺者言不為一時之訃而為悠乆之謀也馬之蕃息非一日能然其可以計近功乎衛文公秉心塞淵而騋牝三千亦此意也問國君之富數馬以對故詩人以之頌羙其君如此輯錄吕佚叔曰占之賢君誠心以行善政其效皆若此非獨牧馬而已通釋曰羙文公之馬則言其騋而牝者有三千之衆羙僖公之馬則言其駉而牡者有十六種之毛色盖各極其盛而言皆以見其國之殷富也駉駉牡馬在坰之野薄言駉者有騅音隹有駓符悲反有騂有騏以車伾伾符丕反思無期思馬斯才叶前西反賦也倉白雜毛曰騅黄白雜毛曰駓赤黄曰騂青黑曰騏伾伾有力也輯錄伾伾當並易攀悲反無期猶無疆也才材力也馬有材力則其盛壯可知駉駉牡馬在坰之野薄言駉者有驒徒河反有駱有駵音留有雒以車繹繹叶弋灼反思無斁叶弋灼反思馬斯作賦也青驪驎曰驒色有深淺斑駁如魚鱗今之連錢驄也白馬黑鬛曰駱赤身黑鬛曰駵黑身白鬛曰雒音洛繹繹不絶貌斁厭也有厭斁則不能悠乆作奮起也奮起猶言興起駉駉牡馬在坰之野薄言駉者有駰音因有騢音遐叶洪孤反有驔音簟有魚以車袪袪起居反思無邪叶祥余反思馬斯徂賦也隂白雜毛曰駰隂淺黑色今泥驄也彤白雜毛曰騢彤赤也豪骭閑去聲曰驔毫在骭而白也輯錄孔氏曰骭脚脛盖膝下之名二目白曰魚似魚目也袪袪彊健也徂行也健而能行馬之遂其性也思無邪者心之正也心一於正則養之必以道不枉其性而害其天矣凡思之逺者或委曲太過而不適於理故詩人以此終之孔子曰詩三百一言以蔽之曰思無邪盖詩之言羙惡不同或勸或懲皆有以使人得其情性之正輯錄朱子曰如正風雅頌等詩可以起人善心如變風刺淫等詩可以使人知戒懼人讀好底詩固是知勸若讀不好底詩便知得此心不可如此所以讀詩者便思無邪也盖詩之功用如此又曰所謂得情性之正者情性是貼思字正是貼無邪字此乃做時文相似然其明白簡切通于上下未有若此言者故特稱之以為可當三百篇之義以其要為不過乎此也學者誠能深味其言而審於念慮之間必使無所思而不出於正則日用云為莫非天理之流行矣此借思無邪一語以明詩之用蘇氏曰昔之為詩者未必知此也孔子讀詩至此而有合於其心焉是以取之盖斷章云爾此可以論詩之全體而不可以説此句之意也駉四章章八句反覆頌羙輯錄解頥曰言駉則每章同詞見其充實之如一也言有則每章異詞見其名色之不一也言坰亦每章同詞見其地有常所宫有常職初不病民居而妨民田也於車曰彭彭言其盛也伾伾則盛而有力繹繹則盛而不絶袪祛則盛而强健皆自彭彭而推言之也於馬曰斯臧言其善也斯才則材之良而非駑斯作則氣之盛而方壯斯徂則力之健而致逺皆自斯臧而推言之也於思曰無疆言其立心之逺也無期則逺之無窮無斁則逺之不已無邪則逺而能正皆自無疆而推言之也有駜蒲必反有駜駜彼乘繩證反黄夙夜在公在公明明叶謨郎反振振鷺鷺于下叶後五反鼓咽咽鳥元反醉言舞于胥樂音洛兮興也駜馬肥强貌詩意正道燕飲之事非羙其人之乘黄也但借乗黄為起語而疊用駜字與在公二字相呼應耳明明辨治也辨則不雜治則不亂道燕飲而先之以夙夜明明盖勤勞治理以其餘暇為樂耳振振羣飛貌鷺鷺羽舞者所持或坐或伏如鷺之下也咽與淵同鼓聲之深長也或曰鷺亦興也以振鷺為興則鷺指舂鋤言胥相也醉而起舞以相樂也此燕飲而頌禱之詞也有駜有駜駜彼乗牡夙夜在公在公飲酒振振鷺鷺于飛鼓咽咽醉言歸于胥樂兮興也鷺于飛舞者振作鷺羽如飛也毛氏曰臣有餘敬而君有餘惠故曰夙夜在公在公飲酒疏云臣禮朝朝莫夕不當常在君所今閒暇無事而夙夜在公是臣有餘敬也君之于臣燕享有數今以無事之故即與之飲酒是君有餘惠也愚謂飲酒而曰在公則雖非燕享之正亦非逸樂之私矣有駜有駜駜彼乘駽呼縣反夙夜在公在公載燕自今以始嵗其有叶羽已反君子有穀詒孫子叶奬里反于胥樂兮興也青驪曰駽今鐵驄也載則也有有年也穀善也或曰禄也詒遺去聲也頌禱之詞也政事之餘得為燕飲可樂矣而能致豐年以養民有善道以詒後則又可繼此而為燕樂也集傳以為頌禱則願之之詞盖有唐風蟋蟀好樂無荒之意増釋許氏曰馬雖起興亦以富盛者言之也在公明明者事上盡職也在公飲酒撫下以恩也載燕則又言夙夜無所事惟燕樂耳故上言樂舞容節而后惟頌禱也有駜三章章九句一章燕方盛二章燕將畢三章因燕飲而進頌禱之詞思樂音洛泮普半反水薄采其芹其斤反魯侯戾止言觀其旂叶其斤反其旂笩笩蒲害反鸞聲噦噦呼㑹反無小無大從公于邁賦其事以起興也思𤼵語辭也泮水泮宫之水也諸侯之學鄉射之宫謂之泮宫其東西南方有水形如半璧以其半于辟廱故曰泮水而宫亦以名也芹水菜也輯錄本草曰水斳一名水英可作菹味甘戾至也此在泮水見魯侯之来故賦陳其事而就用采芹觀旂為相應之語也笩笩飛揚也噦噦和也此飲於泮宫而頌禱之詞也此章言其方至之始鸞旂盛而觀者衆也思樂泮水薄采其藻魯侯戾止其馬蹻蹻居表反其馬蹻蹻其音昭昭叶之繞反載色載笑匪怒伊教賦其事以起興也此與下章則承首章之語以為興也蹻蹻盛貌鄭氏以音為徳音輔氏以為集傳遺此一句愚謂其音昭昭即色笑之聲音也二語相貫是以朱子略之色和顔色也謙已誨人在泮宫故也于此章則既至之時聲音笑貌接人也思樂泮水薄采其茆叶謨九反魯侯戾止在泮飲酒既飲㫖酒永錫難老叶魯吼反順彼長道叶徒吼反屈此羣醜賦其事以起興也茆音卯鳬葵也葉大如手赤圎而滑江南人謂之蓴菜者也輯錄本草注曰蓴菜三四月后通名絲蓴味甜體軟霜降以后名塊蓴味苦體澁長道猶大道也屈服醜衆也遵道而行屈服羣衆輔氏曰羣醜雖言大衆而淮夷已包在其中矣愚謂淮夷為魯國大患故此願其有以馴服之此其𤼵端之語也此章以下皆頌禱之詞也此章方為飲酒之時而進其祝頌如此穆穆魯侯敬明其徳敬慎威儀維民之則允文允武昭假音格烈祖靡有不孝自求伊祜候五反賦也内明其徳外慎其儀則可以為民法矣而表裏功夫一于敬也昭明也假與格同烈祖周公魯公也祖以烈稱則文武之徳可知其備矣魯侯信有文武之徳以昭格之則能盡夫繼述之孝而福自我致矣此正以起下四章之意盖周公魯公皆有征淮夷之功今欲致其福已以服淮夷非允文允武不能也此章言修已以敬固可以為法于下民然敬非謹慎畏縮之謂必文武兼備威徳並行然後克肖祖宗而祖宗福已故人之難服者皆以已為法魯侯盖未能然祝願之也明明魯侯克明其徳既作泮宫淮夷攸服叶蒲北反矯矯虎臣在泮獻馘古獲反況壁反叶淑問如臯陶叶夷周反在泮獻囚賦也矯矯武貌馘所格者之左耳也格鬬也不降而鬭則馘以其無聞也淑善也問訊囚也囚所虜獲者盖古者出兵受成於學成者定軍謀也及其反也釋奠於學而以訊馘告輯錄王制注曰釋菜奠幣禮先師也訊馘所生獲斷耳者故詩人因魯侯之在泮而願其有是功也上章之穆穆因敬慎而為起語此章之明明因明徳而為起語以徳服人魯侯未必有是也祝願之爾輯錄李迂仲曰占者建學養才在此飲酒在此受成在此獻功在此則學校之制不為徒設有補於風化多矣濟濟子禮反多士克廣徳心桓桓于征狄他厯反彼東南叶尼心反烝烝皇皇不吳音話不揚不告于訩音凶在泮獻功賦也廣推而大之也徳心善意也克廣徳心主下文不告于訩而言爭起于褊急宏大寛廣則無所爭矣狄猶逷也東南謂淮夷也烝烝皇皇盛也不吳不揚肅也不告于訩師克而和不爭功也此連下章以將士言所以終矯矯虎臣之意也角弓其觩音求束矢其搜色留反戎車孔博徒御無斁叶弋灼反既克淮夷孔淑不逆叶宜脚反式固爾猶淮夷卒獲叶黄郭反賦也觩弓健貌五十矢為束或曰百矢也搜矢疾聲也博廣大也無斁言競勸也競勉也逆違命也盖能審固其謀猶則淮夷終無不獲矣能備弓矢車徒以克淮夷則善且順矣今未也但審固其謀不迷不奪則獲之可必矣征伐之道用武在下𤼵謀在上智勇兼濟成功可期二章亦皆祝願之意也翩彼飛鴞吁驕反集于泮林食我桑黮尸隹反懐我好音憬九永反彼淮夷来獻其琛敕金反元龜象齒大賂南金興也鴞惡聲之鳥也黮桑實也憬覺悟也琛寳也元龜尺二寸輯錄史記龜千嵗滿尺二寸輔氏曰凡貢物龜為前列故先及之賂遺去聲也南金荆揚之金也此章前四句興後四句如行葦首章之例鴟鴞惡鳥也而懐我以好音淮夷惡類也而来獻其所有則化惡為善矣盖五章言作泮宫而獲淮夷則以文徳受伊祜六章七章言用征伐而獲淮夷則以武徳受伊祜此章又總結之皆祝願之意也泮水八章章八句一章始来二章既至三章飲酒而致祝頌四章祝其為法於民以申屈此羣醜之意五章以後專以馴服淮夷為祝而終屈此羣醜之意也輯錄胡庭芳曰蘇公以為泮宫僖公因舊而修是以不見於春秋至于克淮夷則亦以為疑而朱子於三章以下以為頌禱之詞盖以為僖公存日之詩也竊謂春秋經也魯頌亦經也今幸有魯頌以補春秋之闕誦其詩者尚何過疑之有哉増釋許氏曰前二章道其所已然後五章祝其所未然閟筆位反宫有侐况域反實實枚枚赫赫姜嫄音元其徳不回上帝是依叶音隈無災無害彌月不遲叶陳回反是生后稷降之百福叶筆力反黍稷重直龍反穋音六叶六直反植微力反稺菽麥叶訖力反奄有下國叶于逼反俾民稼穡有稷有黍有稻有秬求許反奄有下土纘禹之緒象吕反賦也閟深閟也宫廟也侐清静也此句與於穆清廟同意實實鞏固也枚枚礱宻也猶言精宻也時盖修之故詩人歌詠其事以為頌禱之詞而推本后稷之生而下及于僖公耳輯錄孔疏作者將羙僖公追述逺祖上陳姜嫄后稷至于太王文武爰及成王封建之辭魯公受賜之命言其所以有魯之由回邪也依猶眷顧也説見生民篇先種曰稙後種曰稺輯錄疏重穋稙稺生熟早晚之異稱非穀名奄有下國封於邰也種植百穀以功胙土是天降百穀為后稷之福也緒業也禹治洪水既平后稷乃播種百穀教民稼穡則無此疆爾界而厥功繼禹矣不然水土雖平何以為民用哉民下國指邰言下土則以天下言稷止封于邰而教稼穡則徧乎天下也身親稼穡而獲封有邰之地教民稼穡而能繼大禹之功此章專言后稷后稷之孫實維大音㤗王居岐之陽實始翦商至于文武纘大王之緒致天之屆于牧之野叶上與反無貳無虞上帝臨女音汝敦都回反商之旅克咸厥功叶居古反王曰叔父扶雨反建爾元子叶子古反俾侯于魯大啓爾宇為周室輔扶雨反賦也翦斷音短也大王自豳徙居岐陽四方之民咸歸往之于是而王迹始著盖有翦商之漸矣此言大王增釋許氏曰漸謂其國自是而漸之意由其民歸之然也屆極也猶言窮極也虞慮也無貳無虞上帝臨女猶大明云上帝臨女無貳爾心也此言武王而文王在其中敦治之也咸同也言輔佐之臣同有其功而周公亦與焉也敦商之旅猶言敵紂之師也此言武王諸臣而周公在其中王成王也叔父周公也元子魯公伯禽也啓開宇居也此述成王錫封告命之詞此章言大王文武繼世而成業伯禽以父而受封魯之所以有國者如此乃命魯公俾侯于東錫之山川土田附庸周公之孫莊公之子叶奬里反龍旂承祀叶養里反六轡耳耳春秋匪解音懈叶訖力反享祀不忒皇皇后帝皇祖后稷享以騂犧虚宜虚何二反是饗是宜牛竒牛何二反降福既多章移當何二反周公皇祖亦其福女音汝賦也附庸猶屬城也小國不能自達于天子而附于大國也若顓臾之類也上章既告周公以封伯禽之意此乃言其命魯公而封之也莊公之子其一閔公其一僖公知此是僖公者閔公在位不乆未有可頌此必是僖公也輯錄閔公名唘方史記云名開在位二年僖公在位三十三年耳耳柔從也春秋錯舉四時也忒過差也成王以周公有大功於王室故命魯公以夏正孟春郊祀上帝配以后稷天子以冬至祭天魯諸侯也不敢純用天子之禮故用夏之正月冬至陽之始正月嵗之始也牲用騂牡皇祖謂羣公尊稱后稷曰皇祖總稱諸公亦曰皇祖皇祖通稱也帝與后稷降之福周公皇祖又降之福降福可謂多矣此章以後皆言僖公致敬郊廟而神降之福國人稱願之如此也此章言魯公受封子孫得以主祭而僖公又善於致祭如此則格神受福乃其必然也秋而載嘗夏而楅衡叶户郎反白牡騂剛犧尊將將七羊反毛炰薄交反胾側吏反羮叶盧當反籩豆大房此下當脱一句如鐘鼓喤喤之類萬舞洋洋孝孫有慶叶袪羊反俾爾熾而昌俾爾夀而臧保彼東方魯邦是常不虧不崩不震不騰三夀作朋如岡如陵賦也嘗秋祭名楅衡施於牛角所以止觸也周禮封人云凡祭飾其牛牲設其楅衡是也秋將嘗而夏楅衡其牛言夙戒也預敬其事曰夙戒也白牡周公之牲也騂剛魯公之牲也白牡殷牲也周公有王禮故不敢與文武同魯公則無所嫌故用騂剛名不正則言不順此魯之所以不免于僣也輯錄疏説文曰剛特也何伯善曰用白者比于先代也用騂者不敢自異于時王之制也犧尊畫牛於尊腹也或曰尊作牛形鑿其背以受酒也輯錄謝氏曰犧尊盛酒則將將而盛羙毛炰周禮封人祭祀有毛炰之豚注云爓似㢘反去上聲其毛而炰之也爓以火燎之也或云湯中瀹肉之名胾切肉也羮大羮鉶音刑羮也大羮大古之羮湆音泣煮肉汁不和去聲盛平聲之以登貴其質也輯錄公食大夫禮云大羹湇不和注不和無鹽菜又見特牲饋食禮鉶羮肉汁之有菜和者也盛之鉶器故曰鉶羮大房半體之俎足下有跗音敷如堂房也房俎大可載半體萬舞名震騰驚動也輯錄曺氏曰不虧如日常盈不崩如山常固不震如地常静不騰如水常平三夀未詳鄭氏曰三卿也或曰願公夀與岡陵等而為三也鄭氏説優自俾爾熾昌以下皆𤼵孝孫冇慶一句熾而昌盛大也夀而臧悠乆也以盛大悠乆之福而保有其邦家又得者舊之臣長為之輔則盛大悠乆而愈無窮矣此章承上章專以致祭受福言公車千乗繩證反叶神陵反朱英綠縢徒登反二矛重直龍反弓叶姑𢎞反公徒三萬貝胄朱綅息㢘反叶息稜反烝徒増増戎狄是膺荆舒是懲則莫我敢承俾爾昌而熾俾爾夀而富叶方未反黄髮台背叶蒲寐反夀胥與試俾爾昌而大叶特計反俾爾耆而艾吾盖反叶五訃反萬有千嵗眉夀無有害叶暇憩反賦也千乗大國之賦也成方十里出革車一乗八百家出車一乗甲士三人左持弓右持矛中人御步卒七十二人將重車者二十五人千乗之地則三百十六里有竒音箕也縱横當得三百一十六里半朱英所以飾矛朱英以朱羽為之懸于矛之上勾也綠縢所以約弓也以繩纒之使弓體正也二矛夷矛酋矛也夷矛長二丈四尺酋矛長二丈重弓備折壊也徒步卒也三萬舉成數也車千乗法當用十萬人而為歩卒者七萬二千人然大國之賦適滿千乗苟盡用之是舉國而行也故其用之大國三軍而已公車千乗國賦之常數公徒三萬則出軍之定數三軍為車三百七十五乗三萬七千五百人其為步卒不過二萬七千人舉其中而以成數言故曰三萬也三軍􅄣甲士一千一百二十五人將重車者九千三百七十五人共一萬五百人餘二萬七千人為步卒貝胄貝飾胄也朱綅所以綴也綅綫也以朱綫綴貝而飾胄也增增衆也戎西戎狄北狄膺當也荆楚之别號舒其與國也懲艾承禦也僖公嘗從齊桓公伐楚故以此羙之車徒衆盛器械精好故師有功此羙其已然之事也而祝其昌大夀考也夀胥與試之義未詳王氏曰夀考者相與為公用也蘇氏曰願其夀而相與試其才力以為用也王氏説優盖以三夀作朋例之可見昌而熾則盛且大矣夀而富則乆而又盛矣如是而又得黄髪台背之臣以為之用則又將盛大悠乆而愈無窮也此此章羙其功而祝以福如泰山巖巖叶魚杴反魯邦所詹奄有龜蒙遂荒大東至于海邦叶卜工反淮夷来同莫不率從魯侯之功賦也泰山魯之望也詹與瞻同此二句與商邑翼翼四方之極同意輯錄孔疏泰山在齊魯之界其陽則魯其隂則齊二國皆以為望也龜蒙二山名輯錄羅氏曰郡國志泰山郡博縣有龜山䝉隂縣有蒙山在西南荒奄也大東極東也海邦近海之國也此與下章又反覆其詞專以擴充土宇為祝乃受福之最大者以𤼵上章保彼東方魯邦是常二句之意盖必能使國勢尊嚴足以攝人心收衆望而内外逺近無不服之然後乃為魯侯之功也可願哉輯錄曺氏曰淮夷来同則淮南夷在魯之南者同来㑹盟莫敢不率循而順從也保有鳬繹叶弋灼反遂荒徐宅叶達各反至于海邦淮夷蠻貊叶莫博反及彼南夷莫不率從莫敢不諾魯侯是若賦也鳬繹二山名輯錄李迂仲曰禹貢徐州嶧陽孤桐此繹即嶧陽也羅氏曰地理攷異鳬山在兖州鄒縣東南三十里嶧山一名鄒山在鄒縣南二十二里宅居也謂徐國也諾應辭若順也泰山龜蒙鳬繹魯之所有其餘則國之東南勢相連屬音燭可以服從之國也能守土宇廣封疆而盡東南諸國又皆歸于魯莫不心悦誠服之此尤詩人之所願也天錫公純嘏叶果五反眉夀保魯居常與許復周公之宇魯侯燕喜令妻夀母叶滿委反宜大夫庶士鉏里反邦國是有叶羽已反既多受祉黄髪兒齒賦也常或作嘗在薛之旁許許田也魯朝音潮宿之邑也朝㑹止宿之邑在天子之郊孔氏曰常魯南鄙許魯西鄙杜預曰許田近鄭故鄭易之未知是否皆魯之故地見侵於諸侯而未復者故魯人以是願僖公也令妻令善之妻聲姜也夀母夀考之母成風也閔公八嵗被弑必是未娶其母叔姜亦應未老輯錄成風莊公之妾叔姜莊公夫人哀姜之娣此言令妻夀母又可見公為僖公無疑也有常有也兒齒齒落更生細者亦夀徴也既願其享夀考以復侵疆矣又願其燕安喜樂之餘有以宜其室家臣庶而保其國而且福益多夀益固也此章盖以前數章之意約言之故先以純嘏二字總言其福云徂來之松新甫之栢叶逋莫反是斷音短是度待洛反是尋是尺叶尺約反松桷音角有舄叶七約反路寢孔碩叶常約反新廟奕奕叶弋灼反奚斯所作孔曼音萬且碩同上萬民是若賦也徂来新甫二山名輯錄羅氏曰地理攷異徂来亦曰尤来在衮州乾封縣新甫山在汶陽縣八尺曰尋舄大貌路寢正寢也新廟僖公所修之廟此或謂姜嫄廟或謂閔公廟又或以為僖公廟但曰姜嫄廟則不當及大王以下曰閔公廟則不當及周公皇祖以上曰僖公廟則詩正為公祝頌之僖固未薨也朱子初説以為魯之羣廟似矣而周公皇祖以上又有帝與稷則又可疑故但以為僖公所修之廟也然因祭羣公而推本所自来則謂之羣廟然矣奚斯公子魚也作者教䕶屬音燭功課章程也教者指令也䕶者監視也屬功則付以事課章程則考其工也曼長碩大也萬民是若順萬民之望也輔氏曰此章本其所以作頌者言之而取法于殷武之末章故其文勢相似閟宫九章五章章十七句内第四章脱一句二章章八句二章章十句一章專言后稷以見魯人所自出二章言先王創業周公輔之以見魯國所由始三章言僖公繼魯公之序能修郊廟之祭以致福四章羙其祭祀而祝其受福五章羙其武功而祝其受福六章七章以土宇充斥為僖公最大之福八章以諸福畢至為僖公全備之福九章乃言作廟則述今日所以頌之之由也舊説八章二章章十七句一章十二句一章三十八句二章章八句二章章十句多寡不均雜亂無次盖不知第四章有脱句而然今正其誤出師奏凱必於學故泮水專以馴服淮夷言致祭受福必於宗廟故閟宫總以享受福禄言魯頌四篇二十四章二百四十三句輯錄王氏曰周頌之詞約約所以為嚴盛徳故也魯頌之詞侈侈所以為夸徳不足故也商頌四之五契為舜司徒而封於商傳十四世而湯有天下其後三宗迭興書無逸舉中宗大戊髙宗武丁及祖甲為三宗史以大甲為大宗與大戊武丁合為三宗漢孔氏謂祖甲即大甲蔡氏非之未知孰是及紂無道為武王所滅封其庶兄微子啓於宋修其禮樂以奉商後其地在禹貢徐州泗濵西及豫州盟音孟豬之野輯錄爾雅作孟諸其後政衰商之禮樂日以放失七世至戴公時大夫正考甫得商頌十二篇於周大師歸以祀其先王至孔子編詩而又亡其七篇然其存者亦多闕文疑義今不敢强通也輯錄孔氏曰正考甫生孔父嘉孔父嘉生木金父木金父生初父初父生防叔防叔遷魯為防大夫故名防叔生伯夏伯夏生叔梁紇叔梁紇生仲尼則正考甫是孔子七世之祖周用六代之樂故有商頌商都亳宋都商邱皆在今應天府亳州界輯錄應天府今改歸徳州𨽻河南亳州今亳縣屬直𨽻鳳陽府頴州曺氏曰契封商今上雒商是也至湯凡八遷徙居亳從先王居帝嚳嘗都也湯十九世至盤庚其間又五遷後居河南亳殷即湯故都故後世或稱商或稱殷或兼稱殷商猗於宜反與音余那與置我鞉音桃鼓奏鼓簡簡衎我烈祖賦也猗歎辭那多置陳也輯錄歐陽氏曰陳鞉與鼓書曰下管鞉鼓盖虞夏以来舊物常用之簡簡和大也衎苦旦反樂也烈祖湯也記曰商人尚聲臭味未成滌音狄蕩其聲臭未成未用灌也味未成未用牲也滌蕩者動而𤼵散之義樂所以動其和而散之于外也樂三闋若穴反然後出迎牲輯錄見郊特牲陳氏曰牲未殺則未有臭味故云臭味未成滌蕩宣播之意殷人先求諸陽凡聲陽也即此是也此一節專以鼓言盖鼓者衆音之主故先言之又禮記註云鞉所以節樂樂由鞉而成獨稱鞉鼓或以此也舊説以此為祀成湯之樂也始而置之既乃奏之言之序也湯孫奏假音格綏我思成鞉鼓淵淵叶於巾反嘒嘒管聲既和且平依我磬聲於音烏赫湯孫叶思倫反穆穆厥聲湯孫主祀之時王也假與格同言奏樂以格于祖考也綏安也思成未詳鄭氏曰安我以所思而成之人謂神明来格也禮記祭義篇曰齊音齋下同之日思其居處上聲思其笑語思其志意思其所樂五教反思其所嗜居處即其地而言笑語即其人而言皆在外也志意樂嗜則在内矣思愈深也齊三日乃見其所為去聲齊者所為齊者指所祭之先祖言如齊以禮成湯則我為成湯而齊湯則其所為齊者也祭之日入室僾然必有見乎其位入室致祭彷見其在神位周旋出户肅然必有聞乎其容聲出入薦饌疑其動作有聲出户而聽愾然必有聞乎其歎息之聲薦畢闔户真若聞其𤼵之於聲也盖齊之思以漸而深祭之見聞亦以漸而著也祭義之文止此輯錄何氏曰馬氏云僾然言其貌肅然言其容愾然言其氣也輔氏云既曰必有又曰僾然肅然愾然盖誠之不可揜也此之謂思成以上鄭氏説蘇氏曰其所見聞本非有也生於思耳此二説近是盖齊而思之祭而如有見聞則成此人矣鄭注頗有脱誤今正之鄭注本云安我心所思而成之淵淵深逺也嘒嘒清亮也鼓為衆音之主管則樂之小者舉此二者則餘樂在其中矣磬玉磬也堂上升歌之樂非石磬也穆穆羙也赫有光輝貌升歌下管其音難諧而八音之中磬尤難諧今者作樂降神而堂下之樂與堂上之磬聲相諧如此赫赫然湯孫爾之樂可謂甚羙矣極其稱賛之也庸鼓有斁萬舞有奕我有嘉客亦不夷懌庸鏞通輯錄大鐘曰鏞斁斁然盛也奕奕然有次序也盖上文言鞉鼓管籥作於堂下其聲依堂上之玉磬無相奪倫者至於此則九獻之後羣小祀一獻祭社稷五祀三獻望祀山川五獻祭先公七獻大享先王九獻鐘鼓交作萬舞陳於庭而祀事畢矣祭將畢時樂盛作如楚茨言鐘鼓既戒鼓鐘送尸亦其一徴也嘉客先代之後来助祭者也夷悦也亦不夷懌乎言皆悦懌也先代之後来作祼將宜多感慨而難悦今其悦懌如此則樂之感人可知輯錄解頥曰湯孫奏假綏我思成始焉人固因樂以致其感格之效也於赫湯孫穆穆厥聲終焉樂復囚人而成其和聲之羙也至于鏞鼓之斁斁然而盛也萬舞之奕奕然有次序也則不特幽有以感乎神而嘉賔在位亦無不夷懌者矣獨言嘉客者尊之也自古在昔先民有作溫恭朝夕執事有恪恪敬也言恭敬之道古人所行以行訓作不可忘也祭將畢而思古人之敬盖恐禮行既乆而或有愆也事有始終敬無間斷于此可見閔馬父曰先聖王之傳恭猶不敢專不敢專明其有自来也稱曰自古古曰在昔昔曰先民自古又推在昔在昔又推先民如湯之敬禹之祇舜之恭堯之欽愈推之而其傳愈逺也顧予烝嘗湯孫之將將奉也言湯其尚顧我烝嘗哉此湯孫之所奉者致其丁寧之意庶㡬其顧之也神不歆非類故曰此湯孫之所將也則祖孫之間精神相感其享之也必然矣那一章二十二句閔馬父曰外傳魯語正考甫校商之名頌以那為首名頌頌之羙者其輯之亂曰云云自古在昔以下四句輯成也亂樂之卒章也篇章既成撮其大㫖以為亂即此詩也嗟嗟烈祖有秩斯祜候五反申錫無疆及爾斯所賦也烈祖湯也秩常申重也爾主祭之君盖自歌者指之也斯所猶言此處也此亦祀成湯之樂言嗟嗟烈祖有秩秩無窮之福可以申錫於無疆是以及於爾今王之所而修其祭祀如下所云也輔氏日凡子孫得以奉祭祀于先祖者皆先祖之福有以錫被于子孫也愚謂此一節與雝詩篇末同意既載清酤叶候五反賚我思成叶音常亦有和羮叶音郎既戒既平叶音旁鬷中庸作奏今從之假音格無言叶音昂時靡有爭叶音章綏我眉夀黄耇無疆酤酒輯錄酤有叶字誤賚與也思成義見上篇知羮味之調節也輯錄曺氏曰鉶羮也戒夙戒也夙戒猶云素定盖言豫敬其事而備之有道也平猶和也言味均調也儀禮於祭祀燕享之始每言羮定音訂輯錄見鄉飲酒禮鄉射禮燕禮大射儀公食大夫禮少牢饋食禮等篇注定猶熟也盖以羮熟為節然後行禮定即戒平之謂也未用之先已戒之方用之時又平之鬷中庸作奏正與上篇義同盖古聲奏族相近族聲轉平而為鬷耳奏假與上篇意同則奏樂以格神也或謂烈祖不言樂則所奏者何物耶増釋吴師道曰中庸奏假無言章句奏進也進而感格于神明極其誠敬無有言説而人自化之也烈祖鬷假傳依中庸作奏謂與上篇同義按上篇那湯孫奏假傳言奏樂以格于烈祖則奏字義不同無言無爭肅敬而齊一也肅敬則静是無言齊一則定是無爭統而言之皆敬也言其載清酤而既與我以思成矣載在尊也酒在尊而神即降則已来假於未灌之前矣及進和羮而肅敬之至則又安我以眉夀黄耇之福也行禮而盡其敬則神之降福又然也福此一節見物足以格神而敬足以致盡物盡志如此是以始終之效驗不一而足也約軝祈支反錯衡叶户郎反八鸞鶬鶬七羊反以假音格以享叶虚良反我受命溥將自天降康豐年穰穰来假音格来饗叶虚良反降福無疆約軝錯衡八鸞見采芑篇鶬見載見篇輯錄通釋曰采芑作八鸞瑲瑲烝民韓奕作八鸞鏘鏘此詩作鶬鶬載見曰鞗革有鶬字雖不同皆言其聲也言助祭之諸侯乘是車以假以享于祖宗之廟也降神曰假獻神曰享即上文載清酤進和羮之事也溥廣將大也穰穰多也言我受命既廣大而天降以豐年黍稷之多使得以祭也假之而祖考来假享之而祖考来饗則降福無疆矣諸侯之来助祭如此矧我受天貺可以供祀事故爾来與我格享之際即能致其格享無留難此福可謂甚大矣盖既歸功於助祭諸侯又推今日之福而以為豐年所賜也此詩三無疆申錫無疆則前日之福及於今黄耇無疆則今日之福及於後皆言其乆也降福無疆則因感格祖宗之易而見今日之福甚大耳福之大者亦可謂之無疆矣顧予烝嘗湯孫之將説見前篇烈祖一章二十二句天命𤣥鳥降而生商宅殷土芒芒古帝命武湯正域彼四方賦也𤣥鳥鳦也春分𤣥鳥降髙辛氏之妃有娀音嵩氏女簡狄祈于郊禖鳦遺卵簡狄吞之而生契其後世遂為有商氏以有天下事見史記宅居也殷地名芒芒大貌言封商而為大國也古猶昔也帝上帝也武湯以其有武徳號之也追述之故稱古言天又言帝天即帝也互文耳正治平聲也域封境也此亦祭祀宗廟之樂而追叙商人之所由生以及其有天下之初也此一節言契與成湯先後受命王業以漸而成以明商家興起之故也方命厥后奄有九有叶羽已反商之先后受命不殆叶養里反在武丁孫子叶奬里反方命厥后四方諸侯無不受命也命者天子之命也九有九州也此二句是覆説正域彼四方一句武丁髙宗也言商之先后受天命不危殆故今武丁孫子猶賴其福此一節言諸侯無不受命而天下無不歸商如此可見祖宗受命甚固矣是以子孫永永受福而無窮也所謂先后者盖兼契與成湯言之而受命不殆又以申上文天命帝命之意耳此上二節説先王以下三節皆説今嗣王以發在武丁孫子一句武丁孫子武王靡不勝音升龍旂十乗繩反證大糦尺志反是承武王湯號而其後世亦以自稱也龍旂諸侯所建交龍之旂也大糦黍稷也承奉也言武丁孫子今襲湯號者其武無所不勝天下之事無難舉者於是諸侯無不奉黍稷以来助祭也此一節言嗣王克肖先王而有以致助祭之臣威徳逺加祀事明備如此福之在武丁孫子可見也邦畿千里維民所止肇域彼四海叶虎洧反止居肇開也開即開闢之義前言正域若因其固有而治之以見成湯非以力取也此言肇域則非惟嗣守故疆而又擴充之以見後王之武靡不勝也言王畿之内民之所止不過千里而其封域則極乎四海之廣也此一節言王畿雖有制疆域則無限居中而能制外如此福之在武丁孫子可見也四海来假音格下同来假祈祈景員維河殷受命咸宜叶牛何反百禄是何音荷叶如字假與格同祈祈衆多貌来格祈祈則大糦是承之諸侯在其中矣景員維河之義未詳或曰景山名商所都也見殷武卒章春秋傳亦曰商湯有景亳之命是也員與下篇幅隕義同盖言周也河大河也言景山四周皆大河也何任平聲也春秋傳作荷先后今王受命咸宜故宜何此百禄也以終受命不殆之意此一節言人心歸極者衆良由山河鞏固而致然然山河之所以不改其舊者以天命之不替於今耳居中制外其所以然者如此福之在武丁孫子可見也此與上一節相應𤣥鳥一章二十二句此詩首尾皆以天命為重意謂先王因天命而得天下故有以詒子孫之福後王因天命而不失乎地利故天下諸侯皆畏威而助祭者即先王所詒之福濬哲維商長𤼵其祥洪水芒芒禹敷下土方絶句楚辭天問禹降省下土方盖用此語外大國是疆幅隕音員既長有娀息容反方將帝立子生商賦也濬音峻深哲知去聲長乆也方四方也外大國逺諸侯也幅猶言邉幅也隕讀作員謂周也幅隕即疆境之義有娀契之母家也將大也言商世世有濬哲之君契生於古之盛世而後来賢聖繼之可謂世有明徳之君矣其受命之祥𤼵見也乆矣方禹治洪水以外大國為中國之竟境同而幅隕廣大之時有娀氏始大故帝立其女之子而造商室也盖契於是時始為舜司徒掌布五教于四方而商之受命實基於此輔氏曰此自洪水芒芒以下皆申長𤼵其祥一句愚謂𤣥鳥生商言契之生者天所命也帝立子生商言契之造商者亦天所命也商之受命已在唐虞之際則天意之栽培也乆矣此章推其本始而言也𤣥王桓撥叶必烈反受小國是達叶他悦反受大國是達率履不越遂視既發叶方月反相息亮反土烈烈海外有截賦也𤣥王契也𤣥者深微之稱或曰以𤣥鳥降而生也王者追尊之號言追尊而不言追王盖追王之禮始于周且湯之祖父主壬主癸未嘗稱曰王不應舎壬癸而獨王契此特於祭祀之際以美號稱之耳下章稱湯為武王是其例也桓武撥治達通也受小國大國無所不達言其無所不宜也有武勇能治之徳則得國不拘小大政治皆行無留難者率循履禮越過發應也言契能循禮不過越遂視其民則既發以應之矣又能循禮而行身無不正故民應之言𤣥王徳盛而身修故得人心如此相土契之孫也截整齊也至是而商益大四方諸侯歸之截然整齊矣烈烈光大也鄭氏曰相土當夏后之世承契之業入為王官之伯出長諸侯威武甚矣愚謂相土之擴充如此可謂有徳之宗矣然比於契則立功自有難易故頌美之詞詳畧不同也其後湯以七十里起豈嘗中衰也與此章言商之王業興起於𤣥王奮𤼵於相土其勢有不可遏者矣帝命不違至于湯齊湯降不遲聖敬日躋子兮反昭假音格遲遲上帝是祇帝命式于九圍賦也湯齊之義未詳蘇氏曰至湯而王業成與天命㑹也降猶生也遲遲乆也祇音支敬式法也九圍九州也商之先祖既有明徳先祖指契與相上言之明徳即以濬哲言之也天命未嘗去之以至于湯湯之生也應期而降適當其時其聖敬又日躋升以至昭假于天乆而不息惟上帝是敬謂之聖敬則非若常人之敬而已日新又新上與天合惟帝是敬其心不他悠久而又專一如此皆不敢以天命自恃而然是即所謂聖人之敬也故帝命之以為法於九州也既當此時而得天人㑹合之機又有此敬以致天人交與之妙二者皆非一日之積宜受天命而立人極也此見成湯起為天子之故受小球音求大球為下國綴張衛反旒音流何音賀天之休不競不絿音求不剛不柔敷政優優百禄是遒子由反賦也小球大球之義未詳或曰小國大國所贄之玉也鄭氏曰小球鎮圭尺有二寸大球大圭三尺也皆天子之所執也輯錄玉藻云笏天子以球玉注美玉也春官典瑞云王搢大圭執鎮圭注大圭朴素無文鎮圭瑑四鎮之山下國諸侯也綴猶結也旒旗之垂者也言為天子而為諸侯所係屬音燭如旗之縿音衫為旒所綴著長入聲也旗之正幅為縿旒則屬之此言綴旒猶卷阿所謂四方為綱易所謂拘係之又從維之皆以喻其固結而不散也何荷競强絿緩也優優寛裕之意遒聚也天休即以綴旒言百禄即以天休言輔氏曰湯為諸侯所附屬如此皆上天休美之命使然也而所以然者由其有中正之徳行寛裕之政故能聚此百禄耳愚謂此與下章皆言成湯受福之故此章言其以中和之徳而受福下章言其以武勇之徳而受福也受小共音恭叶居勇反大共為下國駿音峻厖莫邦反叶莫孔反何天之龍叶丑勇反敷奏其勇不震不動叶徳總反不戁奴版反不竦小勇反百禄是總子孔反賦也小共大共駿厖之義未詳或曰小國大國所共之貢也鄭氏曰共上聲下同執也猶小球大球也蘇氏曰共珙通合珙之玉也傳曰駿大也厖厚也輯錄嚴氏曰受小國大國之共貢惟薄取之所以大厚天下也董氏曰齊詩作駿駹謂馬也輔氏曰此當從駿駹之義以喻其能乗載諸侯也龍寵也敷奏其勇猶言大進其武功也戁恐竦懼也此與丄章文勢同皆囚其效驗而探其故湯之能勝大任如此固天之所寵而致然然用武之際少動其心則餒矣惟理義之勇不可遏是以武功成而總百禄也武王載斾有䖍秉鉞音越如火烈烈則莫我敢曷漢書作遏阿葛反叶阿竭反苞有三蘖五葛反叶五竭反莫遂莫達叶他悦反九有有截韋顧既伐叶房越反昆吾夏桀賦也武王湯也𤣥鳥稱武湯此又稱武王盖湯其本號武湯武王則尊稱而别號之也又稱烈祖亦是此意䖍敬也言恭行天討也曷遏通或曰曷誰何也苞本也蘖旁生萌蘖也言一本生三蘖也本則夏桀蘖則韋也顧也昆吾也皆桀之黨也鄭氏曰韋彭姓顧昆吾己姓言湯既受命此承上三章帝命及天休天寵言載斾秉鉞以征不義桀與三蘖皆不能遂其惡王者之師除殘戢暴如此而天下截然歸商矣初伐韋次伐顧次伐昆吾乃伐夏桀當時用師之序如此用師之序必先翦其羽翼而後除其本根也輔氏曰四章言政事五章六章言武功昔在中葉有震且業允也天子叶奬里反降于卿士鉏里反實維阿衡叶户郎反實左音佐右音又商王賦也葉世震懼業危也承上文而言昔在則前乎此矣此字指成湯時言之豈謂湯之前世中衰時與允也天子指湯也允信也猶後世言真主也降言天賜之也即賚弼之義卿士則伊尹也言至於湯得伊尹而有天下也輯錄所謂五百年必有王者興其間必有名世者為之輔佐也阿衡伊尹官號也言實維阿衡又言實左右商王其歸重於伊尹之功如此輯錄阿衡言所依倚而取平也長發七章一章八句四章章七句一章九句一章六句首章專言契二章兼言契與相土三章四章五章言成湯興起之故六章言其征伐次第七章言其得輔佐之功序以此為大禘之詩盖祭其祖之所出而以其祖配也蘇氏曰犬禘之祭所及者逺故其詩厯言商之先后又及其卿士伊尹盖與去聲祭於禘者也商書曰兹予大享于先王爾祖其從與享之見盤庚是禮也豈其起於商之世歟今按大禘不及羣廟之主此言相土及湯則非禘此宜為祫祭之詩然經無明文不可考也四時之祫不陳毁廟之主大祫則合羣昭羣穆已毁未毁之主而祭之此及相丄則為大祫之詩矣撻他逹反彼殷武奮伐荆楚冞面規反入其阻裒蒲侯反荆之旅有截其所湯孫之緒象吕反賦也撻疾貌輯錄曺氏曰言其兵威神速殷武殷王之武也冞冒冒犯也謂犯險而入裒聚也叛則散以亂裒而聚之所以致其来而平之也湯孫謂髙宗舊説以此為祀髙宗之樂盖自盤庚没而殷道衰楚人叛之髙宗撻然用武以伐其國入其險阻以致其衆盡平其地使截然齊一皆髙宗之功也以功訓緒緒者功之垂於後者也易曰髙宗伐鬼方三年克之盖謂此歟愚聞之先君子梧岡翁曰髙宗伐鬼方朱子以為荆楚盖荆楚之地好鬼自古而然下至戰國之際猶爾驗諸屈原九歌可見也維女音汝荆楚居國南鄉昔有成湯自彼氐都帝反羌莫敢不来享叶虚良反莫敢不来王曰商是常賦也氐羌夷狄國在西方享獻也世見音現曰王三十年曰世荒服之君世見輯錄見秋官大行人孔氏曰謂其父死子繼及嗣王即位乃来朝也蘇氏曰既克之則告之曰爾雖逺亦居吾國之南耳昔成湯之世雖氐羌之逺猶莫敢不来朝曰此商之常禮也况汝荆楚曷敢不至哉輔氏曰此言荆楚既来之後慰安而戒敕之如此愚謂此舉逺者以戒近者之當然也天命多辟音璧設都于禹之績嵗事来辟勿予禍適直革反稼穡匪解音懈叶訖力反賦也多辟諸侯也来辟来王也適謫通言天命諸侯各建都邑于禹所治之地而皆以嵗事来至于商以祈王之不譴曰我之稼穡不敢解也庶可以免咎矣言荆楚既平而諸侯畏服也天命降監下與濫叶下民有嚴叶五剛反不僭不濫不敢怠遑命于下國叶越逼反封建厥福叶筆力反賦也監視嚴威也僭賞之差也濫刑之過也遑暇封大也言天命降監不在乎他皆在民之視聽則下民亦有嚴矣天之視聽在民則聰明明畏皆自我民矣非可畏乎惟賞不僭刑不濫而不敢怠遑則天命之以天下而大建其福此髙宗所以受命而中興也畏天在於畏民公賞罰勤政事畏民以盡畏天之實如此則得天而得民矣不僭濫執中也不怠遑持敬也命于下國即所以大建其福也上天之福顧有大於祚以國者乎此章乃髙宗所以中興之故凡荆楚之来庭諸侯之畏服功業之顯著福祚之乆長皆不僭濫怠遑以致之耳苟不務此而唯威力之是尚則民碞即天顯見其可畏而已商邑翼翼四方之極赫赫厥聲濯濯厥靈夀考且寧以保我後生叶桑經反賦也商邑王都也翼翼整敕貌極表也赫赫顯盛也濯濯光明也言髙宗中與之盛如此整敕明盛皆以中興氣象言夀考且寧云者盖髙宗之享國五十有九年我後生謂後嗣子孫也殷道中衰國勢頽靡四方慢易而弗庭者乆矣及髙宗振厲而都邑尊嚴復為民極聲威大著無逺弗加而又厯年多施澤於民乆人心天命鞏固俾子孫世世治安此中興之功所以不可及也商周中興之功見于詩者髙宗宣王是也宣王之政衰于暮年徵諸史可見祈父黄鳥諸詩之怨刺宜或有之故一傳至幽王大壊周轍遂東髙宗則用傅説而閒聖人之學始終一徳嘉靖殷邦再世且有祖甲保惠庶民不侮鰥寡殷之再造如此二王之功業詎不逺哉陟彼景山叶所旃反松栢丸丸叶胡員反是斷音短是遷方斲陟角反是䖍松桷音角有梴五連反旅楹有閑叶胡田反寢成孔安叶於連反賦也景山名商所都也丸丸直也遷徙斷髠之也遷徙之使来也方正也虔亦截也正之以繩墨然後削之以斧斤又齊之以刀鋸此言之序也梴長貌旅衆也閑閑然而大也寢廟中之寢也安所以安髙宗之神也此盖特為百世不遷之廟不在三昭三穆之數此廟在周為世室既成始祔而祭之之詩也輯錄髙宗七世親盡而立廟此詩其作於帝乙之世乎然此章與閟宫之卒章文意略同未詳何謂此章言作廟閟宫言修廟文意略有同者輔氏曰當是閟宫取法于此也殷武六章三章章六句二章章七句一章五句一章稱伐楚之功二章述戒楚之詞三章言諸侯来服四章本中興之故五章極言中興之盛且長六章則言今日作廟以祭如此為増釋許氏曰髙宗中興之功必惟伐荆楚大故作頌者惟言此以見殷之復治者在是盖蠻夷猾夏聖人所憂四夷来王盛徳所及也一章伐楚而楚人服二章楚既服而可繼成湯三章諸侯皆從四章為治有道而天降之福五章中興之盛卒章廟成而祭也商頌五篇十六章一百二十四句詩經疏義㑹通卷二十
