body:
  text: 詩經疏義會通卷十六元朱公遷撰大雅三說見小雅輯録朱子曰大雅非聖賢不能為平易明白正大光明熊去非曰文王大明綿皆天子諸侯會朝之樂皇矣追述太王王季之德業與大明綿同意旱麓有玉瓉享祀神勞等語或亦受釐之樂思齊追述太任太姒太姜之德言文王御家在宫之事為詳疑此入而燕處之樂靈臺豈亦岀而遊觀之樂乎若棫樸言文王之德下武有聲皆兼言武王之事其樂或用之宗廟或用之朝廷今皆不可知餘見小雅疏義文王之什三之一文王在上於音烏下同昭于天叶鉄因反周雖舊邦其命維新有周不顯帝命不時叶上紙反文王陟降在帝左右叶羽已反賦也於歎辭昭明也命天命也不顯猶言豈不顯也帝上帝也不時猶言豈不時也左右旁側也謂之旁側則親切之甚也周公追述文王之德明周家所以受命而代商者皆由於此以戒成王此一篇之大旨輯録通釋曰周家受命始於文王固由文王之德所致一章二章三章則專言受命之事也周家代商始於武王亦由文王之德所致四章以下則兼言代商之事也此章言文王既没而其神在上昭明于天是以周邦雖自后稷始封千有餘年而其受天命則自今始也今即文王子孫之今日也或謂此為文王時是不然集傳首言文王既没而其神在上周邦之命以此而新則命之新也在今文王子孫之今日矣大抵文王有徳而為天人所歸是為文王之受命子孫蒙其福澤而君天下斯正可見文王之受命此詩以戒成王則在成王時歌之又可以此今字為文王時乎増釋許氏曰自后稷始封至文王即位一千九十三年武王即位一千一百四十三年滅商一千一百五十六年夫文王在上而昭于天則其徳顯矣文王之徳充塞宇宙貫徹古今不以生死而有間故其神之昭於彼者即其徳之顯於此者也周雖舊邦而命則新則其命時矣時者方應其期之謂天運肇啟厯數方來此所謂新即所謂時也故又曰有周豈不顯乎帝命豈不時乎申言之以見其信然蓋以文王之神在天一升一降無時不在上帝之左右是以子孫蒙其福澤而君有天下也此為追述之語故不曰徳而曰神見其儼若生存而可賴也在上而昭于天則與天同顯而天命之新有其故矣陟降在帝左右則又與天合體同運並行渾然無間而福澤之被於今者尤可見其故也此章首尾皆言文王與天為一故成王得以君有乎天下但帝字比天字為親切左右字比上字為親切陟降字比昭字為親切蓋欲極其形容而推原其故以譬曉之故反覆申明必至於此乃止也春秋傳天王追命諸侯之詞曰叔父陟恪在我先王之左右以佐事上帝語意與此正相似或疑恪亦降字之誤理或然也昭公七年追錫衛襄公䇿命之詞輯録解頥曰此章之意約言之而四句已足惟周公告戒其君言有盡而意無窮故反覆申言之其德之顯即於昭之謂也其命之時即維新之謂也其陟降在帝左右即文王在上之謂也然於昭以言其神而不顯又言其德何也蓋周家天命之新固本於文王之德尤本於文王之神其德之顯自其在人者言之也其神之昭自其在天者言之也光于四方顯于西土此其德之在人者然也其氣發揚于上為昭明此其神之在天者然也文王生而其德之昭著既足以膺天命之眷顧没而其神之昭明尤足以基天命於悠久及其以德而受命文王與天猶二也及其昭明而在天則文王與天一矣惟其神之昭于天也故周之為國雖舊而周之受命則新斯命也非文王一人之命乃周家一代之命也其神之在天相與為無窮則其命之在後嗣亦相與為無窮文王之神即天之神也上帝之命即文王之命也上帝之陟降無一時而不監于人文王之陟降無一時而不同于帝則為後王者豈可謂天之髙髙在上而不吾察文王之神窈㝠恍惚而不吾知哉此章雖不言敬畏而不可不敬畏之意隱然見於言外矣亹亹音尾文王令聞音問不已陳錫哉周侯文王孫子叶奬里反文王孫子本支百世凡周之士不顯亦世賦也亹亹强勉之貌令聞善譽也陳猶敷也哉語辭侯維也本宗子也支庶子也輯録疏適譬本榦庶譬其枝也文王非有所勉也純亦不已而人見其若有所勉耳其德不已故今既没而其令聞猶不已也亹亹者前日文王之德令聞則著於前日而又及於今日也令聞不已是以上帝敷錫于周維文王孫子則使之本宗百世為天子支庶百世為諸侯而又及其臣子使凡周之士亦世世修德與周匹休焉文王盛德之著不以今昔而有間則天之福其後者亦不以子孫臣子而有間也輯録彭氏曰亹亹者不已之體也令聞則不已之形見也陳錫于周子孫百世仕者世禄不已之效驗也解頥曰上章言文王之德之神此章以下專言德者周公告戒成王固欲其法先王之顯德保上天之顯命非但欲其求之窈㝠恍惚而已也世之不顯厥猶翼翼思皇多士生此王國叶于逼反王國克生維周之楨音貞濟濟子禮反多士文王以寜賦也猶謀翼翼勉敬也勉敬者勉於敬也有不敢少怠之意思語辭皇美楨榦也輯録朱子曰榦者版築之楨榦今人築牆必立一木於中為骨謂之夜乂木横曰楨直曰榦濟濟多貌此承上章而言承上章末句專以人臣之世言其傳世豈不顯乎而其謀猷皆能勉敬如此也美哉此衆多之賢士而生於此文王之國也多士即今日傳世之多士文王之國亦今日文王子孫之國也觀兩此字可見文王之國能生此衆多之士輯録解頥曰以多士而生王國謂非天命之保佑不可以王國而克生此多士謂非聖化之造就不可由天命之保佑而多士以生由聖化之造就而王國克生也則足以為國之榦而文王亦賴以為安矣此文王亦以其今日在天之神言輯録嚴氏曰牆恃榦而立國恃人而立蓋言文王得人之盛而宜其傳世之顯也文王得人之盛自王國克生一句生義傳世之顯即謀猷勉敬而可見謀猷勉敬是以能為周之楨榦而文王賴之以安也美哉多士生此王國可謂盛矣然非王國克生何以能致是哉謂之克生則所以長育作成者有其道故羣臣之德傳及子孫而世之顯也如此人徒見其傳世之顯而不知夫王國克生之所致也故承上章之意而推本之穆穆文王於緝七入反熈敬止假古雅反哉天命有商孫子商之孫子其麗不億上帝既命侯于周服叶蒲北反賦也穆穆深逺之意凡人内不敬外不莊則必輕躁而淺露深逺之意惟不顯篤恭者有之緝續熈明亦不已之意止語辭假大麗數也不億不止於億也侯維也輯録嚴氏曰服事也用也故為臣而見用謂之服言服行其職也言穆穆然文王之德不已其敬如此穆穆以盛德氣象言敬則指言其德之實也緝者緝此敬熈者熈此敬文王非有意緝熈之純亦不已自有不能已爾此聖德之極致亦聖學之極功凡其所以昭于天聞於人者皆由不已其敬而致然爾故此一句為此詩之樞紐是以大命集焉以有商孫子觀之則可見矣蓋商之孫子其數不止於億然以上帝之命集於文王而今皆維服于周矣此詩專戒成王所謂福者皆以今日受福言故陳錫哉周驗於君臣傳世之餘假哉天命驗於商孫子來臣之日文王之福澤而子孫受之是受天命自今始也以此證之則謂其命維新為文王時者益見其不然矣輯録嚴氏曰此章蓋推原周之代商由於文王故以為文王能有之也侯服于周天命靡常殷士膚敏祼古亂反將于京叶居良反厥作祼將常服黼音甫冔况甫反王之藎才刃反臣無念爾祖賦也諸侯之大夫入天子之國曰某士曲禮下註云列國卿大夫其命數與天子之士等則殷士者商孫子之臣屬也膚美敏疾也祼灌鬯也將行也酌而送之也奉持而進之於神也輯録孟子註敏逹也將助也此從毛傳嚴氏曰祼灌古字通用宗廟有祼天地大神不灌京周之京師也黼黼裳也冔殷冠也輯録嚴氏曰祭服不止於黼舉一章以表之耳毛詩曰夏后氏曰收周曰冕蓋先代之後統承先王修其禮物作賓于王家統承先王奉其先王之祭祀也修其禮物用其先王之禮樂也輯録蔡氏曰賓以客禮遇之也熊去非曰此見周家忠厚之至時王不敢變焉而亦所以為戒也王指成王也藎進也言其忠愛之篤進進無已也藎臣即前所謂厥猶翼翼者也無念猶言豈得無念也爾祖文王也言商之孫子而侯服于周以天命之不可常也故殷之士助祭於周京而服商之服也於是呼王之藎臣而告之曰得無念爾祖文王之徳乎蓋以戒王而不敢斥言猶所謂敢告僕夫云爾左傳襄公四年註曰告僕夫不敢斥尊也假哉天命固為可喜而天命靡常又可畏也然則觀諸殷士而知彼所以失天下之故可不思念文王而知我所以得天下之故哉所以承上章之緝熙而起下章之修徳也劉向曰孔子論詩至於殷士膚敏祼將于京喟然嘆曰大哉天命善不可不傳于後嗣是以富貴無常殷不以善傳於後嗣是以不能保其富貴也蓋傷微子之事周而痛殷之亡也此劉向釋之之詞輯録輔氏曰劉向所述孔子之言使人讀之憂思惨怛有不能堪者蓋孔子乃殷後而向亦宗室也真氏曰以商之孫子而為周之諸侯以商之美士而奔走周廟之祭天命何常之有哉成湯惟其仁也故天命歸于商紂惟其不仁故天命轉而歸周也無念爾祖聿于筆反修厥德永言配命自求多福叶筆力反殷之未喪息浪反師克配上帝宜鑒于殷駿音峻命不易以豉反賦也聿發語辭永長配合也命天理也此詩凡八言命此命字獨以天理言餘皆以福祚言師衆也上帝天之主宰也駿大也不易言其難也言欲念爾祖在於自修其德而又常自省察使其所行無不合於天理修厥德者無他勉其敬而已永言配命則敬無間斷亦可至於文王之緝熈矣則盛大之福自我致之有不外求而得矣亦如文王之緝熈敬止而得假哉之天命也又言殷未失天下之時其德足以配乎上帝矣此指殷之六七賢君而言之今其子孫乃如此宜以為鑒而自省焉則知天命之難保矣大學傳曰得衆則得國失衆則失國此之謂也國之得失在天命而天命之去留在人心故又引大學傳以廣之去修徳如文王則福自至不修德如殷紂則天命必之亦以承上章之念祖而起下章之虞殷也命之不易無遏爾躬叶姑𢎞反宣昭義問有虞殷自天叶鉄因反上天之載無聲無臭叶初尤反儀刑文王萬邦作孚叶房尤反賦也遏絶宣布昭明義善也問聞通有又通虞度載事儀象刑法孚信也言天命之不易保故告之使無若紂之自絶于天而布明其善譽於天下善譽猶二章所謂令聞也宣而昭之亦欲其如文王之不已也又度殷之所以廢興者而折之於天折斷也然上天之事無聲無臭不可得而度也惟取法於文王則萬邦作而信之矣作起也法文王在修德修德在持敬持敬不已則合乎天而得民矣以終上章念祖修德之意子思子曰維天之命於穆不已蓋曰天之所以為天也於乎不顯文王之德之純蓋曰文王之所以為文也純亦不已夫知天之所以為天又知文王之所以為文則夫與天同德者可得而言矣天道不已以其純乎理也文王緝熈敬止則渾然天理而無不純純則自然不已也所謂與天同德者理而已矣是詩首言文王在上於昭于天文王陟降在帝左右而終之以此其㫖深矣首章之意是文王即天此章之意是法文王即所以法乎天此篇首尾皆是文王與天為一但愈言之而意愈深耳上章念祖修德配命三句此章儀刑文王一句周公切切戒成王以用功者在此而已輯録通釋曰天髙在上而文王之神亦在上帝為天之主宰而文王之神則升降乎帝之左右是天帝所在即文王所在也何以知文王之能然哉以其與天同德而已天之德於穆不已所以為天文王之德純亦不已所以為文於穆不已者天之誠也純亦不已者文王之誠也是文王之德即天之德儀刑文王即儀刑於天也天與文王一而已矣文王七章章八句東萊吕氏曰吕氏春秋引此詩仲夏紀以為周公所作味其詞意信非周公不能作也語録云文王詩直是發出許多義理今按此詩一章言文王有顯德而上帝有成命也二章言天命集於文王則不唯尊榮其身又使其子孫百世為天子諸侯也三章言命周之福不唯及其子孫而又及其羣臣之後嗣也四章言天命既絶於商則不唯誅罰其身又使其子孫亦來臣服于周也五章言絶商之禍不唯及其子孫而又及其羣臣之後嗣也六章言周之子孫臣庶當以文王為法而以商為監也七章又言當以商為監而以文王為法也其於天人之際興亡之理丁寧反覆至深切矣際者交接之義也天命之得失係君德之盛衰見天人之際國家之得失係天命之去留見興亡之理故立之樂官而因以為天子諸侯朝會之樂蓋將以戒乎後世之君臣而又以昭先王之德於天下也國語以為兩君相見之樂兩君者兩國之諸侯也見魯語特舉其一端而言耳兩君相見者朝會中之一事也輯録通釋曰一章以文王之德與上帝之命對言也二章言天之命周與四章言天之絶商為對三章言命周之羣臣後嗣與五章言絶商之羣臣後嗣為對六章先言法文王後言監商七章先言監商後言法文王亦對舉而互言之周公既以文王之德播之聲詩以戒成王矣而復叶之音律以為朝㑹通用之樂則又以告成王者告諸天下後世焉其意逺矣哉然此詩之首章言文王之昭于天而不言其所以昭次章言其令聞不已而不言其所以聞至於四章然後所以昭明而不已者乃可得而見焉輯録通釋曰四章所謂熈者光明也即所以昭明于天之本也所謂緝者繼續也即所以不已其聞之本也文王之生也繼續光明而不已其敬故其没也昭明于天而不已其聞焉然亦多詠嘆之言而語其所以為德之實則不越乎敬之一字而已然則後章所謂修厥德而儀刑之者豈可以他求哉亦勉於此而已矣文王之德不渝乎敬法文王者當從事於持敬此詩七章四章以前言所以得天下之故五章以後言所以保天下之道輯録輔氏曰敬之一字聖學之所以為始終者又可見於此二程先生挈出此一字以詔後學其有力於聖學多矣學者舎是實無以為進德之階也明明在下赫赫在上叶辰羊反天難忱市林反斯不易以豉反維王天位殷適音的使不挾子燮反四方賦也明明德之明也赫赫命之顯也忱信也不易難也天位天子之位也殷適殷之適嗣也挾有也増釋金履祥曰挾如挾泰山之挾謂提挾而有之也此亦周公戒成王之詩將陳文武受命故先言在下者有明明之德則在上者有赫赫之命此兩句一篇之大㫖達於上下去就無常有明明之徳則有赫赫之命是此理貫徹天人無間彼此有德則天命歸之無德則不能保其所有之命命之所在不可恃也此天之所以難忱而為君之所以不易也紂居天位為殷嗣乃使之不得挾四方而有之蓋以此爾先言其理如此乃以殷紂之事實之見已然之明鑑也輯録吕東萊曰天位殷適使不挾四方則下章所陳眷顧周家有加而無已者非天私我有周也栽者培之傾者覆之因其材而篤焉耳嚴氏曰首章專述天命喪殷之事摯音至仲氏任音壬自彼殷商來嫁于周曰嬪毗申反于京叶居良反乃及王季維德之行叶户郎反大音泰任有身叶户羊反生此文王賦也摯國名仲中女也任摯國姓也殷商商之諸侯也輯録自周而言則諸侯皆商也嬪婦也京周京也曰嬪于京疊言以釋上句之意猶曰釐降二女于嬀音規汭音芮嬪于虞也輯録堯典蔡氏傳曰釐理降下也嬀水名水北曰汭蓋舜所居之地言堯治装下嫁二女于嬀水之北使為舜婦于虞氏之家也王季文王父也維德之行言凡所行者皆本於德也身懐孕也輯録王氏曰摯仲氏任繫其夫而言太任繫其子而言將言文王之聖而追本其所從來者如此蓋曰自其父母而已然矣以太任配王季而太任皆維德之行天故為生文王之聖是周家以明明之德受赫赫之命久矣輯録輔氏曰維德之行所謂以成德為行也只此一句足以盡王季太任之事可謂辭約而義博也陳定字曰聖賢之生不偶然也有配偶之賢而後有嗣續之賢故詩推本聖賢之生徃徃自其所從來如生民言稷而及姜嫄此言文王而及太任下章言武王而及大姒皆是也其意深矣嚴氏曰次章述太任生文王也維此文王小心翼翼昭事上帝聿懐多福叶筆力反厥徳不回以受方國叶越逼反賦也小心翼翼恭慎之貌即前篇之所謂敬也文王之德於此為盛昭明終日乾乾對越上帝即小心事帝之謂也懐來回邪也敬以直内故不回方國四方來附之國也小心翼翼是敬厥德不回亦是敬天與之人與之皆聖敬之效驗也但以人事天則以小心翼翼言以上臨下則以厥德不回言翼翼不回德也懐多福受方國皆赫赫之命使然爾輯録嚴氏曰三章言文王之德天人所與也小心恭敬明事上帝至誠之運與天周旋也遂能懐來多福蓋其德不邪故能受此四方侯國之歸也解頥曰敬者德之輿也無敬則德不行聖人之敬上與天心合下與人心合故以之事天非有心於求福也而自足以來多福以之治人非有心於求媚也而自足以受方國天監在下有命既集叶昨合反文王初載天作之合在洽之陽在渭之涘音士叶羽已反文王嘉止大邦有子叶奬禮反賦也監視集就載年合配也洽水名本在今同州郃音洽陽夏陽縣今流已絶故去水而加邑渭水亦逕此入河也嘉婚禮也大邦莘國也子太姒也將言武王伐商之事故此又推其本而言天之監昭實在於下其命既集於周矣故於文王之初年而黙定其配初年猶曰壯盛之年也或謂即位之初年恐鑿所以洽陽渭涘當文王將婚之期而大邦有子也蓋曰非人之所能為矣天以大姒與文王為配此赫赫之命也而所以得此者以上章翼翼不回之德致之也下兩章亦承此意輯録嚴氏曰四章述天生大姒以配文王也大邦有子俔牽遍反天之妹文定厥祥親迎魚敬反于渭造舟為梁不顯其光賦也俔磬也韓詩作磬說文云俔譬也孔氏曰如今俗語譬喻物曰磬作然也大姒之德合乎天譬則天之妹也文禮祥吉也言卜得吉而以納幣之禮定其祥也造作梁橋也作船於水比之而加版於其上以通行者即今之浮橋也傳曰乗船危就橋安造舟為梁敬婚禮也傳曰天子造舟諸侯維舟大夫方舟士特舟孫炎曰連四船曰維舟併兩船曰方舟獨一船曰特舟張子曰造舟為梁文王所制而周世遂以為天子之禮也不顯顯也豈不顯然其有光也輯録嚴氏曰五章述文王親迎之事也有命自天命此文王于周于京叶居良反纘子管反女維莘所巾反長丁丈反子維行叶户郎反篤生武王保右音祐命爾燮伐大商賦也纘繼也莘國名長子長女太姒也行嫁篤厚也言既生文王而又生武王也輯録饒雙峯曰文王生於祖甲之三十一年武王後文王二十年生是商道始㣲之際二人已生矣右助燮和也言天既命文王於周之京矣而克纘大任之女事者維此莘國以其長女來嫁于我也天又篤厚之使生武王保之助之命之而使之順天命以伐商也有有徳之文王故與之以有德之大姒有有德之文王太姒故與之以有德之武王故保佑命之使順天心以伐紂皆赫赫在上者為之也輯録嚴氏曰因天人之所欲是之謂燮伐此章述大姒生武王也解頥曰有大任為之母復有大姒為之婦故謂之纘言女德之有繼也既生文王於前又生武王於後故謂之篤言天命之匪解也其伐商也上以順乎天下以應乎人故謂之燮言其無慙德也殷商之旅其㑹如林矢于牧野維予侯興叶音歆上帝臨女音汝無貳爾心賦也如林言衆也書曰受率其旅若林見武成矢陳也牧野在朝歌南七十里侯維貳疑也爾武王也此章言武王伐紂之時此下二章所以盡燮伐大商一句之義紂衆㑹集如林以拒武王而皆陳于牧野則維我之師為有興起之勢耳然衆心猶恐武王以衆寡之不敵而有所疑也故勉之曰上帝臨女毋貳爾心蓋知天命之必然而賛其决也然武王非必有所疑也設言以見衆心之同非武王之得已耳武王率師上帝臨之所謂明明在下赫赫在上也輯録輔氏曰上帝臨女無貳爾心女與爾雖皆指武王其實則是設言以見衆心之同非武王之得已也然辭意嚴恪洋洋乎如在其上如在其左右學者當常常涵泳此二句以存心養性而事天也通釋曰武王誓師曰受有臣億萬惟億萬心予有臣三千惟一心商罪貫盈天命誅之又曰朕夢恊朕卜襲于休祥戎商必克又曰雖有周親不如仁人觀是語也則武王固知上帝之監臨矣固知衆寡之不足疑矣嚴氏曰七章述武王伐商也牧野洋洋檀車煌煌駟騵音元彭彭叶鋪郎反維師尚父時維鷹揚凉音亮彼武王肆伐大商㑹朝清明叶謨郎反賦也洋洋廣大之貌檀堅木宜為車者也煌煌鮮明貌駵馬白腹曰騵輯録檀弓曰周人尚赤戎事乗騵陸佃曰言上周而下殷也彭彭强盛貌師尚父太公望為太師而號尚父也鷹揚如鷹之飛揚而將擊言其猛也凉漢書作亮佐助也王莾傳肆縱兵也㑹朝會戰之旦也此章言武王師衆之盛將帥之賢伐商以除穢濁不崇朝而天下清明輯録孔氏曰王肅云不崇朝而殺紂天下方大清明無復濁亂彭氏曰當癸亥之夕俟天休命之前猶有如隂曀之中及甲子昧爽一戰之後民情大恱向者昏亂穢濁之氣一洗而出之豈不快哉解頥曰此章述牧野之事然言其檀車之煌煌而已不及乎矛㦸之利則是無待於擊刺也言其駟騵之彭彭而已不及乎弓矢之良則是無待於貫革也言尚父之鷹揚而已不及乎徒御之衆則是無待於選鋒陷陣之勇也所以然者殷周之不敵久矣孔子曰仁不可為衆也孟子曰征之為言正也各欲正己也焉用戰皆此意也會朝清明所謂一戎衣而天下定也所以終首章之意也以有德之周伐滅德之商天命不佑彼而佑我則達于上下去就無常可見矣觀周之所以興商之所以不挾四方者如此則成王之心惕然知所戒矣輯録嚴氏曰八章終上章伐紂之事也陳定宇曰篇首之明明以德之明言之也篇末之清明以治象之明言之也然不崇朝而天下清明非德之明者能之乎大明八章四章章六句四章章八句此詩推原文武之德自王季太任始名義見小旻篇一章言天命無常惟德是與二章言王季太任之德以及文王三章言文王之德四章五章六章言文王太姒之德以及武王七章言武王伐紂八章言武王克商以終首章之意輔氏曰君有明德則天有明命有王季文王則有太任太姒有王季太任則有文王有文王太姒則有武王有武王以為君則有太公以為臣蓋天人夫婦父子君臣之際安危治亂廢興存已之機如影響形聲非苟然也增釋吳師道曰此詩言王季太任之德以及文王言文王太姒之德以及武王又言武王伐商以及尚父明一家祖孫父子夫婦婦姑皆有聖德而又有將帥之賢師衆之盛至於天命之保佑昭事之聿懐天之與聖人又相與為一蓋無一而不盡其道詩人形容之備莫過於此其章以六句八句相間又國語以此及下篇皆為兩君相見之樂見魯語說見上篇緜緜𤓰瓞田節反民之初生自土沮七余反漆音七古公亶都但反父音甫陶音桃復音福陶穴叶户橘反未有家室比也緜緜不絶貌大曰𤓰小曰瓞𤓰之近本初生者常小其蔓不絶至末而後大也民周人也自從土地也沮漆二水名在豳地自土沮漆自沮漆之土也語倒如此古公號也亶父名也或曰字也後乃追稱太王焉陶窰竈也輯録孔疏陶瓦器竈也蓋以陶去其土而為之故謂之陶復重窰也穴土室也家門内之通名也輯録爾雅室與宫互名也豳地近西戎而苦寒故其俗如此此亦周公戒成王之詩追述太王始遷岐周以開王業而文王因之以受天命也此一篇之大㫖此其首章言𤓰之先小後大以比周人始生於漆沮之上而古公之時居於窰竈土室之中其國甚小至文王而後大也厥初生民自后稷始入此室處在豳公時已然此云爾者生民之詩是推始祖所自出緜詩首章是見民人所自來姜嫄生后稷建邦啟土之由也稷封於邰而不窋竄去則有邰廢而周無民矣漆沮之豳又周之民人始生之地也夾皇遡過雖云已有宫室但穴處乃豳地所不能無謂之未有室家何怪哉况詩意主言太王肇基王迹文王克成厥勲以二王始終之者見在豳而小遷岐而大耳輯録王氏曰周國嘗幾亡矣其後土漆沮而國復興故以為民之初生也古公亶父來朝走馬叶滿補反率西水滸呼五反至于岐下叶後五反爰及姜女聿來胥宇賦也朝早也走馬避狄難去聲也輯録疏云古公避狄難其以來早朝時疾走其馬率循也滸水厓也漆沮之側也岐下岐山之下也輯録羅氏曰岐山地理考異亦名天柱山在鳯翔府岐山縣東北十里姜女太王妃也胥相去聲相者相視也宇宅也孟子曰太王居邠狄人侵之事之以皮幣珠玉犬馬而不得免乃屬音燭其耆老而告之曰狄人之所欲者吾土地也吾聞之也君子不以其所養人者害人二三子何患乎無君我將去之去邠踰梁山邑于岐山之下居焉邠人曰仁人也不可失也從之者如歸市朱子引此以明太王遷岐之故蓋不得已而然也輯録朱子曰皮謂虎豹麋鹿之皮也幣帛也屬會集也土地本生物以養人今爭地而殺人是以其所以養人者害人也邑作邑歸市人衆而爭先也張南軒曰太王之言忠厚不迫其遷本以全民不敢必民之歸而强之徙也此天地之心真保民之主也民心自不庸釋乎太王蓋戴其仁有素矣周原膴膴音武堇音謹荼如飴音移爰始爰謀計謀悲反爰契苦計反我龜曰止曰時築室于兹叶津之反賦也周地名在岐山之南廣平曰原膴膴肥美貌菫烏頭也荼苦菜蓼屬也飴􅄳徐盈反也輯録本草曰烏頭與附子同根形似烏鳥之頭蜀人謂烏頭苖為菫草孔氏曰􅄳乾糖也契所以然火而灼龜者也儀禮所謂楚焞是也楚荆木也楚焞然楚木以為灼龜之炬也出士喪禮輯録註云周禮菫氏掌共燋契以待卜事是楚焞與契為一皆謂鑚龜之荆焞存悶反許音土敦反或曰以刀刻龜甲欲鑚之處也輯録前漢書註曰挈刻也言刻開之灼而卜之挈音契言周原土地之美雖物之苦者亦甘苦者亦甘則稼穡之甘尤可見於是太王始與豳人之從已者謀居之又契龜而卜之輯録嚴氏曰爰始謀及乃心也爰謀謀及卿士庶人也契龜謀及卜筮也既得吉兆乃告其民曰可以止於是而築室矣地和如此又必恊之人神而後定居焉致重而不敢忽也或曰時謂土功之時也輯録王氏曰曰時則命其臣民以土功之時也迺慰迺止迺左迺右叶羽已反迺疆迺理迺宣迺畆叶蒲彼反自西徂東周爰執事叶上止反賦也慰安止居也左右東西列之也疆謂畫其大界理謂别其條理也註見信南山宣布散而居也或曰導其溝洫也當以導溝洫為是輯録蘇氏導作通畆治其田疇也自西徂東自西水滸而徂東也輯録疏云豳在周原西北而經言自西據至周之時從水滸而言也周徧也言靡事不為也慰止左右所以安之也疆理宣畆所以養之也制其田里之始也周爰執事則又不特此而已凡經始之事皆身親之也遷國之始其勤民如此輯録嚴氏曰凡所當為者無不盡也乃召司空乃召司徒俾立室家叶古胡反其繩則直縮色六反版以載叶節力反作廟翼翼賦也司空掌營國邑司徒掌徒役之事輯録曹氏曰量地以制邑度地以居民司空之職故先召之致衆庶令徒役司徒之職故次召之繩所以為直凡營度位處皆先以繩正之既正則束板而築也輯録朱子曰人君國都如井田様畫為九區面朝背市左祖右社中間一區則君之宫室宫室前一區為外朝凡朝㑹藏庫之屬皆在焉後一區為市市四面有門左右各三區皆民所居而外朝一區左則宗廟右則社稷焉此國君都邑規模之大槩也解頥曰此司空立室家之事縮束也載上下相承也言以索束版投土築訖則升下而上以相承載也輯録解頥曰此司徒命徒役之事君子將營宫室宗廟為先廏庫為次居室為後輯録毛傳本曲禮下語翼翼嚴正也太王遷岐與公劉遷豳之事大槩同公劉相土以山川太王相土以生物公劉之止基其民即太王慰止左右也公劉之迺理其民即太王疆理宣畆也但彼則處處廬旅言言語語其規模小此篇乃召司空以下其規模大葢時世有先後土地有廣狹故不同耳捄音俱之陾陾耳升反度待洛反之薨薨築之登登削屢馮馮扶氷反百堵丁古反皆興鼛音臯鼓弗勝音升賦也捄盛土於器也陾陾衆也度投土於版也薨薨衆聲也登登相應聲削屢墻成而削治重複也馮馮牆堅聲輯録劉執中曰謂牆成脫版削其堅凸以就平直凸音迭五版為堵其髙五版興起也此言治宫室也鼛鼓長一丈二尺以鼓役事輯録地官鼓人朱氏註曰鼛緩也以役事勞民故節之欲其緩也又通作臯弗勝者言其樂事勸功鼓不能止也此與庶民子來同意迺立皋門皋門有伉苦浪反叶苦郎反迺立應門應門將將七羊反迺立冢土戎醜攸行叶户郎反賦也傳曰王之郭門曰皋門伉髙貌王之正門曰應門將將嚴正也輯録考索云皋者逺也門最在外故曰皋應當也禮記疏謂南嚮當朝正門太王之時未有制度特作二門其名如此及周有天下遂尊以為天子之門而諸侯不得立焉冢土大音泰社也亦太王所立而後因以為天子之制也輯録朱子曰太王立岐周之社武王既有殷國遂通立周之社於天下以為大社猶漢初令民立漢社稷也戎醜大衆也起大事動大衆必有事乎社而後出謂之宜沮漆之豳一時也走馬至岐一時也未幾而垣墉成宫室興宗廟門社無不備氣象一變如此周家興起之勢不可遏昆夷駾喙有其兆矣輯録爾雅曰宜祭名以兵凶戰危慮有負敗祭之以求福宜故謂之宜肆不殄田典反厥愠紆問反亦不隕韻敏反厥問柞子洛反棫音域㧞蒲貝反矣行道兊吐外反矣混音昆夷駾徒對反矣維其喙吁貴反矣賦也肆故今也猶言遂也承上起下之辭殄絶愠怒隕墜也問聞通謂聲譽也柞櫟也枝長葉盛叢生有刺棫白桵音緌也小木亦叢生有刺輯録爾雅註曰叢生有刺實如耳璫紫赤可啖詩疏棫即柞也其材理全白無赤心者為白桵直理易破可為犢車輻又可為矛㦸矜今人謂之白梂或曰白柘二說未知孰是矜音芹柄也梂音求㧞挺㧞而上不拳曲蒙宻也兊通也始通道於柞棫之間也駾突喙息也輯録吕與叔曰喙張喙而息也奔趨者其狀如此言大王雖不能殄絶混夷之愠怒亦不隕墜已之聲聞蓋雖聖賢不能必人之不怒已但不廢其自修之實耳輯録輔氏曰自修之實而但騐其聲問者冇其實則有其名也然太王始至此岐下之時林木深阻人物鮮少至於其後生齒漸繁歸附日衆則木㧞道通昆夷畏之而奔突竄伏維其喙息而已言德盛而昆夷自服也蓋已為文王之時矣木㧞道通實太王作屏修平啟辟而然至文王特加盛耳故皇矣之詩又以斯㧞斯兊為太王時也輯録吕東萊曰此章蓋總叙周家王業積施屈伸之理始於太王而終於文王耳增釋吳師道曰孟子太王避狄太王事獯鬻集註所謂狄人即獯鬻也此詩肆不殄厥愠傳謂昆夷則為太王患者獯鬻昆夷也思齊肆戎疾不殄傳昆夷玁狁之屬則為文王患者昆夷玁狁也豳岐迫近夷狄葢非一種矣虞芮如銳反質厥成文王蹶居衛反厥生叶桑經反予曰有疏附叶上聲予曰有先息薦反後胡豆反叶下五反予曰有奔奏與走通叶宗五反予曰有禦侮賦也虞芮二國名質正成平也輯録嚴氏曰曲直得其平則無爭也傳曰虞芮之君相與爭田久而不平乃相與朝周入其境則耕者讓畔行者讓路輯録熊氏曰畔謂田之疆界讓畔則兩界之地耕墾皆不及讓路如少避長賤避貴之類入其邑男女異路輯録疏邑謂城中如王制云道路男子由右婦人由左註云以為地道尊右故也斑白不提挈輯録疏年老其髮白黑雜提挈有少者代之也入其朝士讓為大夫大夫讓為卿増釋許氏曰疏選士為大夫選大夫為卿則各以德而相讓也二國之君感而相謂曰我等小人不可以履君子之境輯録君子尚讓小人喜爭乃相讓以其所爭田為閒田而退天下聞之而歸者四十餘國輯録毛傳之說見於孔子家語好生篇孔子曰以此觀之文王之道其不可加焉不令而從不教而聽至矣哉熊氏曰被文王之化自然興起而歸附之三分天下有其二而說者以虞芮質成之年為文王受命之年亦以此歟蘇氏曰虞在陜之平陸芮在同之馮翊平陸有閒原焉増釋鄱陽張氏曰虞芮讓所事田今平陸西六十里閒原者所爭田也東西七里南北十二里則虞芮之所讓也蹶生未詳其義或曰蹶動而疾也生猶起也王業至此大盛國勢奮然而興也予詩人自予也率下親上曰疏附疏導也引導其下以親其上也相道並去聲前後曰先後引君當道是導之於前輔君進德是相之於後所謂前後者不專指其身而言也喻德宣譽曰奔走以人君之德喻於人以人君之譽宣於外不疾而速若置郵而傳命故曰奔走武臣折衝曰禦侮奔衝而來者此有以折其氣也言昆夷既服而虞芮來質其訟之成於是諸侯歸周者衆而文王由此動其興起之勢是雖其德之盛然亦由有此四臣之助而然輔氏曰四臣四等之臣故各以予曰起之其辭繁而不殺所界反者所以深歎其得人之盛也文王得人之盛如此今日喜談而樂道之詞意之詳不期而然矣上篇終之以尚父此篇終之以四臣二詩之意相似緜九章章六句一章言在豳二章言至岐三章言定宅四章言授田居民五章言作宗廟六章言治宫室七章言作門社八章言至文王而服昆夷九章遂言文王受命之事餘說見上篇輔氏曰以上三篇皆周公作以戒成王之詩文王則專美文王之德大明則上及王季下及武王之德緜則又及太王之德蓋歴述先王積累德業之盛以見成王任大責重不可不謹戒而保守之也愚謂周家世有哲王其作則垂憲者備矣周公未嘗舉古先聖王以為言所以戒者不曰文王則曰武王不曰武王則曰王季蓋祖宗之所行正子孫之所法周公拳拳於成王者正欲其守家法以承先業耳伊尹之於太甲也非成湯之事不以訓其意亦猶此歟芃芃薄紅反棫雨逼反樸音卜薪之槱音酉之濟濟子禮反辟音壁王左右趣叶此苟反之興也芃芃木盛貌樸叢生也言根枝迫迮音窄相附著直畧反也槱積也輯録嚴氏曰積以待其乾而用之濟濟容貌之美也此聖人之德容也睟面盎背如此則其根於心者可知辟君也君王謂文王也此亦以詠歌文王之德言芃芃棫樸則薪之槱之矣濟濟辟王則左右趣之矣此皆極盛之所致者以必然之理為興蓋德盛而人心歸附趣向之也此汎言左右之人其心歸向之也濟濟辟王左右奉璋奉璋峩峩玉歌反髦士攸宜叶牛何反賦也半圭曰璋祭祀之禮王祼以圭瓉諸臣助之亞祼以璋瓉瓉斚屬以圭璋為柄輯録疏曰祭統六君執圭瓉祼已太宗伯執璋瓉亞祼小宰云凡祭祀賛祼將之事是助行祼事非獨一人左右奉之其判在内亦有趣向之意圭首銳一圭中分為二璋奉於王前則其中分處向王類乎人之鞠躬内嚮而歸心焉峩峩盛壯也髦俊也宜稱也左右俊髦固有趣向之心璋判在内亦若有趣向之意儀容俊偉以奉其璋此人此器相稱也此承上章言祭祀之時人心歸向之也渒匹世反彼涇音經舟烝徒楫音接叶藉入反之周王于邁六師及之興也渒舟行貌涇水名烝衆楫櫂于徃邁行也六師六軍也輯録梁氏曰文王未嘗為天子六師之說非所施及攷詩意蓋追稱之辭則六師亦追言之耳言渒彼涇舟則舟中之人無不楫之周王于邁則六師之衆追而及之蓋衆歸其德不令而從也興取自然皆然之意無不楫之皆然也以興衆歸其德不令而從自然也烝徒楫之則亦有此意此言征伐之時人心歸向之也輯録解頥曰國之大事在祀與戎上章言人心之趣向見於祭祀之時此章言人心之趣向見於征伐之日也倬陟角反彼雲漢為章于天叶鉄因反周王夀考遐不作人興也倬大也雲漢天河也在箕斗二星之間其長竟天此以雲漢之長興周王之夀考倬字正呼夀考二字也章文章也日月星辰河漢皆天文也但河漢之體為最大河漢之長竟天尤能為章於天者也文王九十七乃終故言夀考夀考則在位久遐與何同作人謂變化鼓舞之也變化之則其遷善也不自知鼓舞之則雖頺墮委靡者亦奮然而有為矣所謂待文王而興者如此輔氏曰此章言人心所以歸向文王之故倬彼雲漢則為章于天矣周王夀考而何不作人乎作人非一朝一夕所能必積久乃可致也愚謂雲漢以其倬然而長故能為章于天文王歴年多則化行以漸而能作人也必然矣此章蓋以盛大悠久之功用為興輯録曹氏曰作者鼔舞振動之意商之末世士氣卑弱甚矣非鼔舞振動之烏能自奮而有成哉陳氏曰聖人久於其道而天下化成也追對迴反琢陟角反其章金玉其相勉勉我王綱紀四方興也追雕也金曰雕玉曰琢以金為質則雕之以玉為質則琢之相質也勉勉猶言不已也凡網罟張之為綱理之為紀總而舉之使之皆有所係謂之綱詳而理之使之各有連屬謂之紀皆是聨比之意而綱則無所遺紀則無所紊也追之琢之則所以美其文者至矣天下之政治文章至如追金琢玉者則致其華美之極而無以加矣金之玉之則所以美其質者至矣天下之物至以金玉為之相質則致其美好之極而無以加矣勉勉我王則所以綱紀乎四方者至矣天下之為治者勉而人勉如文王則維係人心之極而無以加矣此以用心至極為興蓋追琢金玉是貴重乎物而用心致美之極勉勉不已是勤勞於事而用心致治之極故取以起興如此觀集傳至矣之云可見前稱濟濟辟王此稱勉勉我王濟濟以貌言德之見於外也勉勉以心言德之存於中也輯録許氏曰竊謂卒章為有義之興言文王之德之純也文之見乎外者固若金玉之追琢質之存乎中則實金玉也表裏如一豈致飾於外而已故勉勉其德之我王能綱紀四方也今兼存之棫樸五章章四句此亦以昭先王之德使人知周所以得天下之故也旱麓思齊皆是此意此詩前三章言文王之德為人所歸後二章言文王之德有以振作綱紀天下之人而人歸之五章之序首以左右言次以六師言至作人綱紀則盡乎人矣人心所以歸之之故於此見矣自此以下至假樂皆不知何人所作疑多出於周公也瞻彼旱麓音鹿榛楛音户濟濟子禮反豈弟君子干禄豈弟興也旱山名輯録地理志漢中郡南鄭縣旱山麓山足也榛似栗而小楛似荆而赤濟濟衆多也豈弟樂易也樂者和樂也易者平易也和樂而平易必純乎天理乃能然周公以稱文王即其所固有者賛之也召康公以戒成王以其所當有者期之也君子指文王也此亦以咏歌文王之德言旱山之麓則榛楛濟濟然矣豈弟君子則其干禄也豈弟矣干禄豈弟言其干禄之有道猶曰其爭也君子云爾此皆莫之致而至者故以自然之理為興旱麓無意於榛楛而榛楛自生之以其地之美也君子無意於福禄而福禄自歸之以其德之盛也輔氏曰言樂易則無汲汲勞苦之意優柔寛裕盡其理而已非有意於干禄也自詩人歌之則若見其以豈弟之道干禄而所以干禄者有道爾瑟所乙反彼玉瓉才反黄流在中豈弟君子福禄攸降叶乎攻反興也瑟縝宻貌玉瓉圭瓉也以圭為柄黄金為勺青金為外而朱其中也錫為青金輯録疏圭以玉為之指其體謂之玉瓉據成器謂之圭瓉瓉盛鬯酒以黄金為勺有鼻口酒從中流出漢禮瓉槃大五升口徑八寸下有槃口徑一尺則瓉如勺為槃以承之天子之瓉其柄之圭長尺二寸其賜諸侯蓋九寸以下黄流鬱鬯也釀秬黍為酒築鬱金煮而和之使芬芳條鬯以瓉酌而祼之也輯録疏云草名鬱金則黄如金色酒在器流動故曰黄流攸所降下也言瑟然之玉瓉則必有黄流在其中豈弟之君子則必有福禄下其躬明寳器不薦於䙝味而黄流不注於瓦缶則知盛德必享於禄夀而福澤不降於淫人矣此物類相從之意而以必然之理為興輯録解頥曰器之美者味亦美德之盛者福亦盛鳶弋專反飛戾天叶鉄因反魚躍于淵叶一均反豈弟君子遐不作人興也鳶鴟類戾至也李氏曰抱朴子曰鳶之在下無力及至乎上聳身直翅而已蓋鳶之飛全不用力亦如魚躍怡然自得而不知其所以然也此可以見鳶魚飛躍對言之故遐何通言鳶之飛則戾于天矣魚之躍則出于淵矣豈弟君子而何不作人乎言其必作人也鳶必戾天魚必躍淵豈弟君子必作人亦取必然之理以為興然此章不言福下章不言豈弟二章之意正相足也輯録解頥曰物之囿於氣者有自然之機人之囿於德者有自然之化清酒既載叶節力反騂息營反牡既備叶蒲北反以享以祀叶免織反以介景福叶筆力反賦也載在尊也備全具也承上章言有豈弟之德則祭必受福也德有以及乎人斯有以感乎神矣故其受福之必然如此瑟彼柞棫民所燎力召反矣豈弟君子神所勞力報反矣興也瑟茂宻貌輯録通釋曰上章玉瓉故言縝宻此章柞棫故言茂宻燎爨也此皆極盛之所致者以必然之理為興或曰熂燎除其旁草使木茂也從此說則二者皆有栽者培之之意亦以必然之理為興輯録熂芟草燒之箋云勞慰撫也輯録解頥曰物之盛者必為人所用德之盛者必為神所福莫莫葛藟力軌反施以䜴反于條枚莫囘反豈弟君子求福不囘興也莫莫盛貌囘邪也葛盛則自施于條枚德盛則自享乎福禄文王之福豈囘邪要求而得之哉以足首章干禄豈弟之意起興亦與首章同旱麓六章章四句輔氏曰棫樸言文王有德而人歸之旱麓言文王有德而福歸之也愚謂旱麓首末兩章見其自然受福二章至五章見其必然受福增釋許氏曰此詩五章有豈弟君子一語者皆興中一章無此語者為賦其意則在各章末句相次為義一章君子以豈弟之道干禄二章福禄自降三章德及乎人四章德感乎神五章神降之福六章謂德既格乎上下矣而所以受福者皆自然之意言樂易受福之自然此所以為文王也思齊側皆反大音泰任文王之母莫後反思媚美記反周姜京室之婦房九反大同上姒嗣徽音則百斯男叶尼心反賦也思語辭齊莊媚愛也周姜大王之妃太姜也京周也大姒文王之妃也徽美也百男舉成數而言其多也輯録春秋傳云管蔡郕霍魯衛毛􅅨郜雍曹滕畢原豐郇文之眧也并伯邑考武王十八人然此特其見於書傳者耳亦可見其多也此詩亦歌文王之徳而推本言之曰此莊敬之太任乃文王之母實能媚于周姜而稱其為周室之婦輯録王氏曰齊者母道也媚者婦道也為人母盡母道為人婦盡婦道者太任也至於太姒又能繼其美徳之音而子孫衆多上有聖母所以成之者逺内有賢妃所以助之者深也原其質之所稟則曰聖究其徳之所成則曰賢實皆謂之賢婦人可也特據文王而言尊其母爾文言其所從來者如此王之徳有由然也惠于宗公神㒺時怨神罔時恫音通刑于寡妻至于兄弟以御牙嫁反于家邦叶卜工反賦也惠順也宗公宗廟先公也輯録張子曰未追王故稱公恫痛也痛之義與恨相近刑儀法也寡妻猶言寡小君也御迎也迎之與之相接之意齊家則與一家之人相接治國則與一國之人相接輯録此從毛傳孟子註與鄭箋同言文王順于先公而鬼神歆之無怨恫者無怨恫則祖考其安樂之矣輯録此意誠心正身修之驗也其儀法内施於閨門而至于兄弟以御于家邦也孔子曰家齊而后國治輯録通釋曰大學傳齊家治國章三引詩文始言家人次言兄弟終言四國朱子亦嘗謂即刑寡妻至兄弟御家邦之意孟子曰言舉斯心加諸彼而已孔子孟子之言皆釋刑于寡妻以下張子曰言接神人各得其道也此則通釋之也孝感於鬼神而教行于家國皆積盛致然也此言其徳之所施者如此輯録解頥曰先神而後人尊卑之序也先家而後國親疎之殺也誠以事神而神無不格誠以治人而人罔不孚此所謂接神人各得其道也雝雝於容反在宫肅肅在廟叶音貌不顯亦臨無射音亦亦保叶音鮑賦也雝雝和之至也肅肅敬之至也不顯幽隱之處也射與斁同厭也保守也言文王在閨門之内則極其和在宗廟之中則極其敬雖居幽隱亦常若有臨之者雖無厭射亦常有所守焉其純亦不已蓋如是純亦不已主亦臨亦保言居幽隱而或慢之待厭射而後守之則有間矣文王之徳見於外者隨地而然根於中者無時不然其表裏之俱盛如此輯録熊去非曰此承上章而言雝雝在宫即刑于寡妻以下之事肅肅在廟即惠于宗公以下之事解頥曰雝雝和之至也所以為治人之本也肅肅敬之至也所以為事神之本也不顯自其在已者言之亦臨則指其在神者而言也無射自其在人者言之亦保則指其在已者而言也已之所處雖在於幽隱而心之戒懼則常若有臨之者人之於我雖無所厭射而心之操存則常若有所守焉所以為純亦不已之實也肆戎疾不殄烈假古雅反不瑕不聞亦式不諌亦入此與下章用韻未詳賦也肆故今也戎大也疾猶難也犬難如姜里之囚及昆夷獫狁之屬也殄絶烈光假大瑕過也輯録過失也此兩句與不殄厥愠不隕厥問相表裏聞前聞也式法也承上章言文王之徳如此故其大難雖不殄而光大亦無玷缺光大者徳見於外有光輝而又盛大也如聲名洋溢乎中國施及蠻貊之類非所謂光且大乎雖事之無所前聞者而亦無不合於法度雖無諫諍之者而亦未嘗不入於善傳所謂性與天合是也性與天合主亦式亦入言輔氏曰不聞亦式從心所欲不踰矩也不諌亦入不思不勉從容中道也愚謂不聞亦式者法由此立不待學而能不諫亦入者由仁義行不待矯而正此言徳極盛故不因患難而有損徳本盛故不資輔導而獲益也已上二章言徳之成已者如此輯録解頥曰戎疾不殄難之自外至者聖賢有所不能必也烈假不瑕徳之由巾出者聖賢未嘗不自盡也不聞亦式其知生知不思而得故稽之徃古而不謬也不諌亦入其行安行不勉而中故質之當今而無疑也此所以為性與天合也肆成人有徳小子有造古之人無斁音亦譽髦斯士賦也冠以上為成人小子童子也造為也造訓為猶曰能也孝弟謹信洒掃應對進退之類無不能之所謂有造也古之人指文王也譽名髦俊也承上章言文王之徳見於事者如此三章和敬純是正言文王之徳四章處困而亨順理而裕則皆徳之見乎事者故一時人材皆得其所成就蓋由其徳純而不已故令此士皆有譽於天下而成其俊乂之美也譽髦即指有徳有造言斯士即指成人小子言聖人徳盛如此天下涵泳於教化中大以成大小以成小則所以譽髦之者至矣然不易致也必久於其迫而後化成彼乍作乍輟者其能與於斯乎此章言徳之成物者如此輯録吕東萊曰聖人流澤萬世者無有大於作人所以體天地生生之大徳也故此詩以是終焉文王之無斁孔子之誨人不倦其心一也王氏曰初言大姒則化成乎内也終言譽髦斯士則化成乎天下也思齊五章二章章六句三章章四句增釋許氏曰首章專主於太任而言謂太任有齊莊之徳故能生文王其徳之本則上繼於太姜其徳之化則下及於太姒此四句因及太任之徳之本效以著其所以成文王之聖也二章言文王事神接人各得其道三章言存諸身者純亦不已四章言見諸事者性與天合卒章言作成人材之盛皇矣上帝臨下有赫叶黒各反監觀四方求民之莫維此二國其政不獲叶胡郭反維彼四國爰究爰度待洛反上帝耆之憎其式廓乃眷西顧此維與宅叶逹各反賦也皇大臨視也赫威明也監亦視也莫定也二國夏商也不獲謂失其道也四國四方之國也究尋度謀也耆憎式廓未詳其義或曰耆致也致猶取也言其徳為上帝之所取也輯録程子曰毛氏武傳云憎當作增式廓猶言規模也輯録輔氏曰式如式様之式廓如匡廓之廓此謂岐周之地也此詩敘大王大伯王季之徳以及文王伐宻伐崇之事也此其首章先言天之臨下甚明但求民之安定而已彼夏商之政既不得矣桀紂之政皆政之失者也故求於四方之國苟上帝之所欲致者則増大其疆境之規模於是乃眷然顧視西土以此岐周之地與大王為居宅也人知太王避狄遷岐而不知天欲以此興周也故推本天意而言其故輯録解頥曰天豈私我有周哉其眷周也即所以求民之安定也作之屏必領反之其菑莊持反其翳一計反修之平之其灌其栵音例啟之辟婢亦反之其檉丑貞反其椐羌居反叶紀庶反攘之剔它厯反之其檿鳥劍反其柘章夜反叶都故反帝遷明徳串古患反夷載路天立厥配受命既固賦也作㧞起也屏去上聲之也菑木立死者也翳自斃者也死而仆曰斃或曰小木蒙宻蔽翳者也修平皆治之使疏宻正直得宜也灌叢生者也栵行音杭生者也啟辟芟除也檉河栁也似楊赤色生河邊輯録爾雅註曰今河旁赤莖小楊陸氏曰生水旁皮正赤如縫一名雨師松葉似松椐樻音匱也腫節似扶老可為杖者也輯録陸氏曰節中腫似扶老即今靈夀是也今人以為馬鞭及杖攘剔謂穿剔去其繁冗使成長上聲也檿山桑也與柘皆美材可為弓榦又可蚕也輔氏曰菑翳則因其死斃而㧞去之灌栵則因其叢列而修治之檉椐凡木則芟除之檿柘美材則攘剔之此皆循理而為得治物之道也明徳謂明徳之君即大王也串夷載路未詳或曰串夷即昆夷載路謂滿路而去所謂混夷駾矣者也配賢妃也謂大姜此章言大王遷於岐周之事此章發上章末句之意蓋岐周之地本皆山林險阻無人之境而近於昆夷大王居之人物漸盛然後漸次開闢如此乃上帝遷此明徳之君使居其地而昆夷逺遁天又為之立賢妃以助之是以受命堅固而卒成王業也太王之治岐如此天使安居其地而外侮除又配以賢妃而使其受此定命也天意於是確然矣輯録輔氏曰此章首八句人事也後四句天命也由天命時故人事應由人事治故天命從也帝省息井反其山柞棫斯㧞蒲貝反松栢斯兊徒外反帝作邦作對自大音泰伯王季維此王季因心則友叶羽已反則友其兄叶虛王反則篤其慶叶祛羊反載錫之光受禄無喪息浪反叶平聲奄有四方賦也㧞兊見緜篇此亦言其山林之間道路通也此承上章作屏修平啟辟攘剔言緜以為文王事此以為太王事蓋斯㧞斯兊是方然之時㧞矣兊矣則其如此者久矣詩人之詞自有間也增釋許氏曰兊字釋文於緜吐外反於皇矣徒外反是義不同而音亦不一也今傳於緜吐外反訓通以㧞兊為木㧞道通於皇矣則徒外反亦以㧞兊為木㧞道通是音異義同也校之毛詁俱當作吐外反對猶當也作對言擇其可當此國者以君之也大伯大王之長子王季大王之少子也因心非勉强上聲也輯録嚴氏曰李氏云孝弟之道豈可以偽為哉因其心而然耳生而無不知愛其親長而無不知敬其兄本於良知良能豈非人心而然哉善兄弟曰友兄謂大伯也篤厚載則也奄字之義在忽遂之間言帝省其山而見其木㧞道通則知民之歸之者益衆矣於是既作之邦又與之賢君以嗣其業蓋自其初生大伯王季之時而已定矣於是太伯見王季生文王又知天命之有在故適吳不反太王没而國傳於王季及文王而周道大興也大伯王季皆足以當其國但王季有聖子則大伯宜讓而王季宜受其讓矣然以大伯而避王季則王季疑於不友故又特言王季所以友其兄者乃因其心之自然而無待於勉强理當受讓而受之乃因其心之自然未嘗有所矯拂也一有矯拂則害其良心而非友矣既受太伯之讓則益修其徳以厚周家之慶而與其兄以讓徳之光猶曰彰其知人之明不為徒讓耳其徳如是故能受天禄而不失至于文武而奄有四方也天以大王善於治岐也故祚之以賢嗣君嗣君又篤天倫而益培之宜乎益吕其後矣王季之興起一者本於父之功二者由於已之徳此章又發上章末句之意輯録解頥曰王業之成雖在於武王得天下之時而天命之定已見於太伯讓王季之日太伯讓焉而無迹王季受之而無愧此王業之所由基也文王創造於前武王繼續於後此王業之所由成也太伯當立而不立文王可為而不為故皆謂之至徳非王季之友無以成太伯之志非武王之孝無以成文王之功武王之孝易知也王季之友難知也此因心則友則友其兄則篤其慶載錫之光詩人所以再三嘆詠於王季也維此王季帝度待洛反其心貊武伯反其徳音其徳克明克明克類克長丁丈反克君王如字或于况反此大邦克順克比必里反比毗至反于文王其徳靡悔叶虎洧反既受帝祉音恥施以豉反于孫子叶奬里反賦也度能度物制義也貊春秋傳樂記皆作莫謂其莫然清靜也克明能察是非也克類能分善惡也是非以事理言善惡以人品言克長教誨不倦也克君賞慶刑威也言其賞不僣故人以為慶刑不濫故人以為威也克長能教也克君能治也順慈和徧服也慈愛和柔人無不服比上下相親也王此大邦猶言君此大國爾王季未嘗為王但自今日追言之故云然也比于至于也悔遺恨也輯録嚴氏曰人有過則悔恨靡悔則無過從容中道無毫髪之歉也言上帝制王季之心使有尺寸能度義天使其心明知審於長短輕重也又清靜其徳音使無非間之言清靜則不淆亂亦指受讓之事言之也是以王季之徳能此六者心有權度徳無瑕疪是以能之至於文王而其徳尤無遺恨是以既受上帝之福而延及于子孫也天厚王季而其徳亦盛矣文王繼之又以極盛之徳受極盛之福王季得文王以為子則其積累之功益著矣此章正言王季相太王則受命既固王季則受禄無喪而文王則又繼以受帝祉周家之福非一日矣帝謂文王無然畔援于願反無然歆羡餞面反誕先登于岸叶魚戰反宻人不恭敢距大邦叶卜政反侵阮魚宛反徂共音恭王赫斯怒叶暖五反爰整其旅以按音遏徂旅以篤周祜候五反以對于天下叶後五反賦也帝謂文王設為天命文王之詞如下所言也無然猶言不可如此也無然禁止之詞聖人不待禁止然天禁止之則不為過矣畔離畔也援攀援也言舎此而取彼也歆欲之動也羨愛慕也增釋金履祥曰畔援兩字相反歆羨只是一意但有淺深歆心動貌羨慕也歆淺羨深言肆情以徇物也岸道之極至處也宻宻須氏也姞其入聲姓之國在今寧州阮國名在今涇州徂徃也共阮國之地名今涇州之共池是也輯録寧州涇州即今平涼府靜寧州涇州並𨽻陜西其旅周師也按遏也徂旅宻師之徃共者也輯録通釋曰二旅字所指不同祜福對答也人心有所畔援有所歆羨則溺於人欲之流而不能以自濟衆人溺於人欲則取所不當取欲所不當欲淪胥於惡而已曰溺曰流曰濟皆與經文登岸相應文王無是二者故獨能先知先覺以造七到反道之極至文王絶無人欲超然於天理中征伐之事理當伐則伐之莫不盡其所當然者至善無以加所謂登于岸也輯録彭氏曰無畔援則中正而不溺於私無歆羨則剛大而不溺於欲故能造道之極也蓋天實命之而非人力之所及也是以宻人不恭敢違其命而擅興師旅以侵阮而徃至于共輯録解頥曰敢距大邦不知有事大之禮也侵阮徂共不知有恤小之義也此天理之所當怒而王法之所當誅也則赫怒整兵而徃遏其衆以厚周家之福而答天下之心蓋亦因其可怒而怒之初未嘗有所畔援歆羨也文王以天之心為心如此此文王征伐之始也此下四章又發上章受帝祉施孫子之意依其在京叶居良反侵自阮疆陟我髙岡無矢我陵我陵我阿無飲我泉我泉我池叶徒何反度待洛反其鮮息淺反原居岐之陽在渭之將萬邦之方下民之王賦也依安貌京周京也矢陳鮮善將側方鄉也輯録孔子曰郷人嚮望之也言文王安然在周之京文王駐兵於國都以為三軍之鎮也而所整之兵既遏宻人遂從阮疆而出以侵宻輯録通釋曰按春秋書法潜師掠境曰侵聲罪致討曰伐此詩於宻言侵於崇言伐固非如春秋書法例然其師既按徂共之衆則宻人退歸矣故周師既出阮疆而遂侵之蓋亦出其不意而謂之侵也所陟之岡即為我岡而人無敢陳兵於陵飲水於泉以拒我也輯録輔氏曰詞直理正威靈氣燄莫有敵者所謂帝王之道出萬全者也於是相其髙原而徙都焉所謂程邑也文王居程邑凡三年輯録胡廷芳曰度其鮮原以下即上章以篤周祜以對天下之實事也其字指宻而言通釋曰文王伐宻之後而作程邑亦猶伐崇之後而作曹邑方其伐之討罪而已固未嘗先有作邑之心也自常情觀之必謂貪其土地矣詩人知其心之無私故言伐宻伐崇之事皆先以帝命發之其地於漢為扶風安陵今在京兆府咸陽縣輯録即今西安府咸陽縣隷陜西帝謂文王予懐明徳不大聲以色不長丁丈反夏以革不識不知順帝之則帝謂文王詢爾仇方同爾兄弟以爾鉤援音爰與爾臨衝以伐崇墉賦也予設為上帝之自稱也懐眷念也明徳文王之明徳也帝遷明徳太王也其徳克明王季也予懐明徳文王也三后皆明徳之君然徳有大小明有淺深則聖賢所以别也以猶與也夏革未詳增釋金履祥曰不大聲以色則是不言而信不動而化不長夏以革凡事不自髙不自大不輕改作皆不為已甚之意不識不知全不用其私智則法也仇方讎國也兄弟與國也輯録彭氏曰以諸侯之國為兄弟亦未嘗稱王一驗也鉤援鉤梯也所以鉤引上城所謂雲梯者也臨臨車也在上臨下者也衝衝車也從旁衝突者也皆攻城之具也崇國名在今京兆府鄠音户縣輯録即今西安府鄠縣亦𨽻陜西墉城也史記崇侯虎譛西伯於紂紂囚西伯於羑里西伯之臣閎夭之徒求美女竒物善馬以獻紂紂乃赦西伯賜之弓矢鈇鉞得專征伐曰譛西伯者崇侯虎也西伯歸三年伐崇侯虎而作豐邑言上帝眷念文王上章帝謂文王是設為上帝教戒之詞此章帝謂文王則設為上帝愛念而稱美之詞也語意不同如此而言其徳之深微不暴步吐反著其形迹夏可訓大革可訓變朱子以不大聲色不長夏革為一類皆冇深􅅗不露之意猶中庸不顯篤恭之妙也輯録程于曰天謂文王予懐爾之明徳不大其聲色而人化夫聖人之誠感無不通故所過者化所存者神豈暴著其形迹也哉是不發見大其聲色也故曰聲色之於以化民末也又能不作聰明以循天理既有渾然之徳又順自然之理此文王所以為文王也故又命之以伐崇也詢問也謂興師問罪也吕氏曰此言文王徳不形而功無迹與天同體而已徳不形以不大聲色言功無迹以不長夏革言吕氏以長夏革為長諸夏革命之事故言然與天同體則順帝之則也雖興兵以伐崇莫非順帝之則而非我也有我則用私矣兩帝謂文王之語是為伐宻伐崇張本文王伐宻非有欲心所以行之者乃事理之至極也其伐崇也非欲張其聲威氣燄所以處之者皆天理之自然也嗚呼非周公言之孰知文王奉天不已之心乎輯録嚴氏曰崇侯譛文王而文王伐之疑於報私怨者然虎倡紂為不道乃天人之所共怒文王奉天討罪何容心哉蓋由其心純乎天理故喜怒皆與天合所仇者非私怨所同者非苟合也臨衝閑閑叶胡員反崇墉言言執訊音信連連攸馘古獲反安安叶於肩反是類是禡馬嫁反叶蒲補反是致是附叶上聲四方以無侮臨衝茀茀音弗叶分聿反崇墉仡仡魚乞反是伐是肆是絶是忽叶虚屈反四方以無拂叶分聿反賦也閑閑徐緩也言言髙大也連連屬音蜀續狀馘割耳也軍法獲者不服則殺而獻其左耳以其無聞也輯録玉藻云聽鄉任左鄉向同孔氏曰罪其不聽命服罪故取其耳以計功也安安不輕暴也類將出師祭上帝也禡至所征之地而祭始造軍法者謂黄帝及蚩尤也致致其至也附使之來附也茀茀强盛貌仡仡堅壯貌肆縱兵也忽滅拂戾也春秋傳曰文王伐崇三旬不降退修教而復去聲伐之因壘而降僖公十九年因壘而降言不増兵但因其舊壘而崇自服也言文王伐崇之初緩攻徐戰告祀羣神以致附來者而四方無不畏服及終不服則縱兵以滅之而四方無不順從也輯録李于仲曰文王所伐者崇耳而四方之國無不服從以文王之伐當其罪故也夫始攻之緩戰之徐也非力不足也非示之弱也將以致附而全之也輯録通釋曰此其三旬不降之時乎及其終不下而肆之也則天誅不可以留而罪人不可以不得故也輯録通釋曰此其復伐之日乎此所謂文王之師也輔氏曰是致是附仁也是絶是忽義也仁以附之天下畏之而不敢侮仁之至也義以絶之天下從之而不敢拂義之盡也愚謂文王伐宻侵疆遏旅而已及伐崇則是伐是肆是絶是忽聖人興師致伐而有不同此不可知但詩人皆以帝謂文王起之則文王以天吏奉天討如權衡稱物低昻隨其輕重爾初亦何嘗容心哉輯録解頥曰閑閑然徐緩言設之而不用也言言然髙大言縱之而未攻也連連則相續而不絶也安安則詳審而不暴也是類是禡昭其罪於神也是致是附敷是徳於人也此四方之所以莫敢侮也茀茀然强盛則非徐緩之比也仡仡然堅壯則猶負固不服也於是伐以聲其罪肆以奮其力絶以殄其祀忽以滅其國則天誅不留而罪人斯得矣此四方之所以莫敢拂也皇矣八章章十二句一章二章言天命大王三章四章言天命王季五章六章言天命文王伐宻七章八章言天命文王伐崇一章言太王居岐之故二章言太王居岐之事三章言王季興起之故四章言王季興起之事五章言文王伐宻之故六章言文王伐宻之事七章言文王伐崇之故八章言文王伐崇之事輯録何伯善曰大抵一詩之意自始至終皆推原其本於天而非人力之所能為也經始靈臺叶田飴反經之營之庶民攻之不日成之經始勿亟居力反庶民子來叶六直反賦也經度入聲也靈臺文王所作謂之靈者言其倐然而成如神靈之所為也營表平聲即標識也經者度其廣深營者標其信置攻作也不日不終日也亟急也國之有臺所以望氛祲音浸察災祥氛災氣祲祥氣時觀游節勞佚也輯録解頥曰望氛祲察災祥憂民之憂也時觀游節勞佚樂民之樂也文王之臺方其經度營表之際而庶民已來作之所以不終日而成也雖文王心恐煩民戒令勿亟而民心樂之如子趍父事不召自來也攻之成之即是子來之事輯録陳定宇曰不欲其急而過於勞者愛民之仁子來而忘其勞者事君之義未有上好仁而下不好義也張南軒曰文王則勿亟庶民則子來君民之相與如此孟子曰文王以民力為臺為沼而民歡樂之謂其臺曰靈臺謂其沼曰靈沼輯録註言文王雖用民力而民反歡樂之加以美名也此之謂也民被文王之徳而趨事赴功如此則文王愛民之心遂於此矣可樂也王在靈囿叶音郁麀音憂鹿攸伏麀鹿濯濯直角反白鳥翯翯户角反王在靈沼叶音灼於音烏牣音刃魚躍賦也靈囿臺之下有囿所以域養禽獸也築牆為界域而養禽獸在其中麀牝鹿也伏言安其所處不驚擾也濯濯肥澤貌輯録解頥曰言其性之適而體之充也翯翯潔白貌輯録解頥曰此以上言飛走者樂其為飛走也下文於牣魚躍言鱗介者樂其為鱗介也靈沼囿之中有沼也牣滿也魚滿而躍言多而得其所也鳥獸魚鼈被文王之仁雖在囿沼而與山林川澤無異各遂其性如此則文王愛物之心遂於此矣可樂也虡音巨業維樅七凶反賁扶云反鼓維鏞音庸於論廬門反鼓鐘於樂音洛辟音璧廱賦也虡植木以懸鐘磬其横者曰栒音筍業栒上大版刻之捷業如鋸齒者也樅業上懸鐘磬處以綵色為崇牙其狀樅樅然者也輯録疏云以綵色為犬牙其狀隆然謂之崇牙樅即崇牙之貌樅樅然也業與崇牙皆所以飾栒簨也賁大鼓也長八尺鼓四尺中圍加三之一輯録人註中圍加三之一者加於面之圍三分之一也面徑四尺其圍十二尺加以三分之一則中圍十六尺徑五尺三寸三分中之一也鏞大鐘也論倫也言得其倫理也倫理條理聲音皦如無相奪倫也辟璧通廱澤也辟廱天子之學大射行禮之處也水旋丘如璧以節觀者節止也止之使不入也故曰辟廱於論鼓鐘於樂辟廱鼉徒河反鼓逢逢薄紅反矇音蒙瞍音叟奏公賦也鼉似蜥蜴長丈餘皮可冐鼓逄逄和也有眸子而無見曰矇無眸子曰瞍古者樂師皆以瞽者為之以其善聽而審於音也公事也輯録吕氏曰樂者矇瞍之事也聞鼉皷之聲而知矇瞍方奏其事也鐘鼓作於辟廱而且有善作之者則文王教民之心遂於此矣可樂也上章是作樂有其地此章是作樂有其人於講學行禮之處有鐘鼓之樂蓋亦異乎衆人之樂矣得不重言而深嘆之乎輯録嚴氏曰申言鐘皷辟雍之樂詠嘆不能已樂之更端曰奏故九成謂之九奏方言奏其事樂之不厭之詞也靈臺四章二章章六句二章章四句東萊吕氏曰前二章樂文王有臺池鳥獸之樂也後二章樂文王有鐘鼔之樂也皆述民樂之詞也靈臺辟廱本不同處在靈臺則有靈臺之樂在辟廱則有辟廱之樂與民同樂隨處皆然故民樂之而詩人得以述之也輯録解頥曰前二章言靈臺之遊觀後二章言辟廱之教育遊觀而必言其物之盛者以見涵育長養之有其素也教育而必言其樂之和者以見鼔舞作興之有其術也然則臺池鳥獸之樂固與百姓共之而鐘鼔之樂又將與賢者共之也疑問曰文王終身西伯而靈臺兩言辟廱豈西伯亦建天子之學乎朱子曰正雅皆成王周公以後之詩則在追王之後無疑故靈臺以王在靈囿王在靈沼言之則無嫌於辟廱之名矣下武維周世有哲王三后在天王配于京叶居良反賦也下義未詳或曰字當作文言文王武王實造周也哲王通言大王王季也三后大王王季文王也在天既没而其精神上與天合也猶所謂文王在上於昭于天也王武王也配對也謂繼其位以對三后也京鎬京也此章美武王能纉大王王季文王之緒而有天下也蓋此章以世有哲王為大㫖三后在天皆哲王也武王又以哲王居鎬而對彼三后在天之神可見周之世有哲王矣輯録解頥曰聖人興王之業非先后固無以基之於前而先后在天之神非聖人無以配之於下蓋一代興王之業必世徳之相承有以基之於其始而後聖徳之受命有以成之於其終也周之王業自文王而始著自武王而始成是文王武王實造周矣然推原其始則文王之前固有王季也王季之前又有太王也謂王業之所基不在於是而可乎夫惟太王王季文王既没而其精神上與天合也是以武王繼之實能配彼在天之靈於鎬京焉則武王之繼三后謂非王業之所成而可乎詩人於此原其始而歸美於三后要其終而歸功於武王則夫任繼述之責者其必知所法矣王配于京世徳作求永言配命成王之孚叶孚尤反賦也言武王能繼先王之徳而長言合於天理故能成王者之信於天下也能使天下之人皆信之然後為王者之信若暫合而遽離暫得而遽失則不足以成其信矣輔氏曰此章言武王得以對彼三后於鎬京者以其能起求先王之徳而繼之又長言合於天理故能成王者之信於天下也愚謂求徳配命非二事先王之徳即是天理繼先王之徳而加以悠久之誠則天理無間而徳極其盛積中發外自然孚合民心東西南北無思不服可謂成王之孚矣成王之孚如此故能對彼三后之神于鎬京也其曰作求猶曰仰而求之耳輯録解頥曰王配于京是以下而對乎上之辭永言配命是以人而合乎天之辭有以配對於下而已之徳既與先王而為一有以配合乎天而已之心復與天性而為一此所以能成王者之信而為天下之法也然則王者之信豈可以他求哉亦在乎求世徳配天命而已蓋世徳皆實心之形著而天命即實理之流行既有以配對於先王復有以配合乎天命則王者之徳著於下而天下之心應乎上上下交孚而其為信也成矣成王之孚下土之式永言孝思孝思維則賦也式則皆法也言武王所以能成王者之信而為四方之法者以其長言孝思而不忘是以其孝可為法耳輯録陳氏曰王者之徳著於人而可信者謂之孚存於心而不忘者謂之孝天下皆知法武王之徳而不知徳之可法者本於聖人之孝若有時而忘之則其孝者偽耳何足法哉上章因王配于京推之見武王能求徳配命而成王者之信此章因成王之孚推之見武王能孝思不忘而得天下之心求徳即是孝之事永言配命即孝思之不忘也永言孝思如此則其孝出於真誠而天下皆信之可謂能成王者之孚矣輯録解頥曰長言孝思而不忘者一飲食之頃而如見於􅃵一坐作之頃而如見於牆一陟降之頃而如見於庭無一處之不然亦無一時之不然也若有時而忘之則是勉强矯僞之所為也而豈足為天下之法哉媚兹一人應侯順徳永言孝思昭哉嗣服叶蒲北反賦也媚愛也一人謂武王應如丕應徯志之應此則天下信之之驗也輯録益稷蔡傳云天下無不丕應固有先意而徯我者侯維服事也言天下之人皆愛戴武王以為天子而所以應之維以順徳是武王能長言孝思而明哉其嗣先王之事也此又因民心愛戴武王而推見武王之能孝思嗣服也嗣服對求徳言求徳是繼志嗣服是述事自首章至此反覆其詞又以首章之意詳言之蓋美其善於繼述而得天下之心也順徳者民之順徳也上以孝思感乎下下以順徳應乎上感應以類於此見之此詩見武王之孝下篇遹追來孝見文王之孝二聖人事業非得已也以卒前人之功耳昭兹來許繩其祖武於萬斯年受天之祜候古反賦也昭兹承上句而言兹哉聲相近古蓋通用也來後世也許猶所也輯録詩緝陳氏曰許語助也昭武黄氏曰所語辭論語視其所以之類繩繼武迹也言武王之道昭明如此來世能繼其迹則久荷天禄而不替矣此下二章又言武王之道足以福後世者如此後王之孝思如武王則無不受福矣輯録解頥曰繩祖武者欲後人繼武王之迹也武王之道惟信與孝而已然武王之信乃王者之大信固非暫焉作輟之所能武王之孝乃天下之逹孝尤非暫焉勉强之所能也然則如之何曰法武王之信在乎天命之永配法武王之孝在乎世徳之是求如是而不受上天之祜者未之有也受天之祜四方來賀於萬斯年不遐有佐賦也賀朝賀也周末秦强天子致胙諸侯皆賀秦孝公下令國中曰昔我穆公布德行武東平晉亂西伯戎狄天子致胙諸侯畢賀為後世開業甚美又按孝公二年天子致胙十九年致伯二十年諸侯皆入賀秦然則諸侯入賀之事見於穆孝二公此正秦將盛之時也輯録通釋曰朱子初解此下有曰其事則猶此也但秦以力周以徳耳遐何通佐助也蓋曰豈不有助乎云爾賀也佐也猶上章之媚而應之也言得民心亦若武王耳下武六章章四句輔氏曰此詩首章言武王能纉前人之緒而有天下中三章言武王繼述之孝且有常永不已之誠故能成王者之信為天下之法以致天下之愛戴如此後兩章又言武王之成效大驗如此子孫能繼先王之緒則久受上天之福多得天下之助也愚謂武王之道繼述而已然應侯順徳大著於當時受祜有佐可及於後世效驗之大如此能配三后有以哉或疑此詩有成王字當為康王以後之詩然考尋文意恐當只如舊說且其文體亦與上下篇血脉通貫非有誤也文王有聲遹尹橘反駿音峻有聲遹求厥寧遹觀厥成文王烝哉賦也遹義未詳疑與聿同發語詞駿大烝君也此詩言文王遷豐武王遷鎬之事而首章推本之曰文王之有聲也甚大乎其有聲也聲聲聞也與赫赫厥聲同蓋以求天下之安寧而觀其成功耳文王之徳如是信乎其克君也哉此章已包下三章之意求厥寧觀厥成皆指作豐之事而言也輯録解頥曰文王惟有安天下之心故能成安天下之功惟有安天下之功故能有髙天下之譽即其聲之大而知其功之盛即其功之盛而知其心之勤此文王之所以為克君也文王受命有此武功既伐于崇作邑于豐文王烝哉賦也首章言有聲此章言有武功四章言王公伊濯一物也言之有不同耳伐崇事見皇矣篇作邑徙都也豐即崇國之地在今鄠縣杜陵西南輯録解頥曰大命自文王而始集故武功自文王而始成伐崇所以除天下之暴作豐所以立天下之本有以除天下之暴則人心服有以立天下之本則人心歸此文王之所以克君也築城伊淢況域反作豐伊匹匪􅁄居力反其欲禮記作猶遹追來孝叶許六反或呼侯反王后烝哉賦也淢成溝也淢與洫同方十里為成成間有溝深廣各八尺匹稱去聲􅁄急也王后亦指文王也輔氏曰王王也追稱也后君也本稱也愚按虞夏周之書多以羣后稱諸侯此稱王后實有二意言文王營豐邑之城因舊溝為限而築之其作邑居亦稱其城而不侈大皆非急成已之所欲也築城作豐儉為之制似􅁄其欲而實非也特追先人之志而來致其孝耳肇王迹勤王家先王志在安民久矣文王遷豐所以繼其志而盡其孝耳輯録陳定宇曰上章言作豐受命于天此章言作豐追孝于前以見作豐乃天與前人之心也解頥曰遹追來孝文王之孝也永言孝思武王之孝也文王之孝有以追先人之志武王之孝有以成文王之功此周之王業所以盛也王公伊濯直角反維豐之垣音袁四方攸同王后維翰叶胡田反王后烝哉賦也公功也濯著明也王之功所以著明者以其能築此豐之垣故爾戡黎伐宻文王之用兵不一矣而伐崇則其功之最著者也四方於是來歸而以文王為楨榦也四方攸同有所歸也王后維翰有所附也至此而三分天下有其二矣豐水東注維禹之績四方攸同皇王維辟皇王烝哉賦也豐水東北流徑豐邑之東入渭而注于河績功也皇王有天下之號指武王也辟君也輯録皇王維辟乃推夲武王君天下之徳皇王烝哉乃稱賛武王能君天下而已言豐水東注由禹之功故四方得以來同於此而以武王為君此武王未作鎬京時也豐水東入於河四方來朝者皆循其道而至是武王因古人成功而自得天下之歸徃非有作為以致之也此詩四章五章皆以四方攸同言蓋豐以前岐山之周四方攸同未可言也豐以後鎬京之周則四方攸同又不必言矣輯録解頥曰豐水東注言其水勢之順也四方攸同言其人心之合也即水勢之順而有以見神禹之功即人心之合而有以見武王之徳則武王不惟近無愧於文王而且逺無愧於神禹矣鎬京辟廱自西自東自南自北無思不服叶蒲北反皇王烝哉賦也鎬京武王所營也在豐水東去豐邑二十五里張氏曰周家自后稷居邰公劉居豳大王邑岐而文王則遷于豐至武王又居于鎬輯録按林氏曰岐有邰西北無百里豳又在岐西北四百餘里豐在岐山東南二百餘里當是時民之歸者日衆其地有不能容不得不遷也辟廱說見前篇張子曰靈臺辟廱文王之學也鎬京辟廱武王之學也至此始為天子之學矣輯録劉濟曰都鎬而先建學首善之地教化之原也嚴氏曰四方先言西鎬京在西近者先被其化也無思不服心服也孟子曰天下不心服而王者未之有也此言武王徙居鎬京講學行禮而天下自服也教化之得民心如此非以力服人而致然也輯録觧頥曰四方攸同皇王維辟見武王之盡君道也鎬京辟廱無思不服見武王之盡師道也君以治之而四方無不於此乎攸同師以教之而四方無不於此乎心服則其尚徳而不尚力於此亦可見矣考卜維王宅是鎬京叶居良反維龜正叶諸盈反之武王成之武王烝哉賦也考稽輯録董氏曰卜筮之道必先斷於心故曰考卜維王則王志先定矣其考卜者所以齊衆志也洪範稽疑以汝則從為主宅居正决也成之作邑居也稽之於卜以定其居决之於龜以成其事始終致慎不一而足也此與緜詩爰契我龜同意張子曰此舉謚者追述其事之言也輯録解頥曰武王之遷鎬非以狥一己之私也必考之於卜以定其宅焉帷龜為能致其决惟武王為能成其事則武王之遷固將上以承天意下以順民心前以成先王之志後以開無窮之基信乎其克君也哉豐水有芑武王豈不仕鉏里反詒厥孫謀以燕翼子叶槳里反武王烝哉興也芑草名仕事詒遺去聲燕安翼敬也子成王也以燕翼子敬其事以安其子也語倒如此或謂以安其能敬之子亦通鎬京猶在豐水下流故取以起興言豐水猶有芑武王豈無所事乎此用人物各有所事為興而有字與豈不二字反相呼也詒厥孫謀以燕翼子則武王之事也謀及其孫則子可以無事矣遷都定國所以裕後昆也漢武帝嘗謂吾當其勞以逸遺汝語意蓋若此類輯録解頥曰豐水則有芑矣而武王豈無所事乎水之流不窮則其生物亦無窮也聖人之徳無窮則其善後亦無窮也於孫謀曰詒則所以遺之者至矣於翼子曰燕則所以安之者亦至矣彼苟一時之安而不為悠久之計者又惡足以語此哉或曰賦也言豐水之旁生物繁茂武王豈不欲有事於此哉但以欲遺孫謀以安翼子故不得而不遷耳聿追來孝文王繼志述事也謀孫翼子武王創業垂統也一者以卒前人之業一者以定後人之業此遷豐遷鎬之本意也文王有聲八章章五句此詩以武功稱文王至於武王則言皇王維辟無思不服而已蓋文王既造其始則武王續而終之無難也此自皇王維辟言又以見文王之文非不足於武而武王之有天下非以力取之也此自無思不服言此詩以王后皇王為文武之别號夫前稱文王有其徳矣而繼以王后兼稱之則有其徳而位未稱也稱為皇王有其位矣而復舉謚以實之則有其位而徳稱之矣此或詩人之意也輯録輔氏曰每章皆言烝哉以結之者不獨以見其歎美無已之意又以示後世子孫使之知其必如文王武王之為然後於君天下為宜也故其丁寧不一而足耳孔氏曰上四章言文王之事下四章言武王君天下服四方定鎬京安後世之事問使文王更在十三四年將終事紂乎抑為武王牧野之舉乎朱子曰詩中言武功都是文王做來詩載武王武功却少但舉其伐紂耳觀文王氣勢如此度必不終竟休了一似果實文王待他黄熟自落下來通釋曰允文文王而有此武功則非不足於武也桓桓武王而鎬京辟廱則非不足於文也所謂一張一弛文之道也文王之什十篇六十六章四百一十四句鄭譜此以上為文武時詩以下為成王周公時詩今按文王首句即云文王在上則非文王之詩矣又曰無念爾祖則非武王之詩矣大明有聲并言文武者非一安得為文武之時所作乎蓋正雅皆成王周公以後之詩但此什皆為追述文武之徳故譜因此而誤耳詩經疏義會通卷十六
