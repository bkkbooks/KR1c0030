body:
  text: 詩經疏義㑹通卷六元朱公遷撰唐一之十唐國名本帝堯舊都在禹貢冀州之域太行音杭恒山之西大原大岳之野周成王以封弟叔虞為唐侯南有晉水至子燮悉恊反乃改國號曰晉後徙曲沃又徙居絳増釋許氏曰今考堯都雖有四而詩之唐國當從詩譜謂晉陽盖其時封叔虞於堯之故墟曰唐侯其子燮以晉水所出改為晉侯晉陽實晉水所出則唐叔虞之始封在晉陽矣唐以堯得名晉以水得名其地一也孔疏燮生武侯寧族族生成侯服人成侯徙曲沃穆侯徙絳昭侯以下又徙冀及武公并晉又都絳也其地土瘠音籍民貧勤儉質樸憂深思去聲逺有堯之遺風焉輯録前漢志日河東本唐堯所居有先王遺教君子深思小人儉嗇張南軒曰堯之遺風只是儉而用禮一事亦不必事事稱有遺風也其詩不謂之晉而謂之唐蓋仍其始封之舊號耳輯録通釋曰武公能滅晉之宗而不能滅唐之號能冒晉之號而不能繼唐之統君子欲絶武公於晉而不可故總名其詩為唐以寓意焉然則晉詩稱唐見曲沃武公滅宗國之罪而魏風首晉又以見曲沃獻公滅同姓之惡世變如此春秋欲不作不可也唐叔所都在今大原府曲沃及絳皆在今絳州輯録大原府即今大原府曲沃及絳今平陽府屬縣並𨽻山西蟋蟀在堂嵗聿允橘反其莫音暮今我不樂音洛下同日月其除直慮反無已大音泰康職思其居叶音據好呼報反樂無荒良士瞿瞿俱具反賦也蟋蟀蟲名似蝗而小正黒有光澤如漆有角翅或謂之促織輯録蟋蟀一名蛬一名蜻􅖹又名促織九月在堂室有戸出戸即為堂此與豳風九月在戸相合聿遂莫晚除去也太康過於樂音洛也職主也瞿瞿却顧之貌顧其後也唐俗勤儉故其民間終嵗勞苦不敢少休及其嵗晚務閒之時乃敢相與燕飲為樂而言今蟋蟀在堂而歳忽已晚矣當此之時而不為樂則日月將舎我而去矣不可不樂者以此然其憂深而思逺也故方燕樂而又遽相戒曰今雖不可以不為樂然不已過於樂乎不可過於為樂如此盍亦顧念其職之所居者使其雖好樂而無荒若彼良士之長慮而却顧焉則可以不至於危亡也善於為樂蓋如此輯録嚴氏曰職思其居啓其憂也好樂無荒作其勤也良士瞿瞿警其惰也三言而君國之道盡矣蓋其民俗之厚而前聖遺風之逺如此輯録通釋曰自堯而至於周盖千餘年矣而其風化流傳固結於唐人之心故其民間質實勤儉之習親愛和樂之恩警戒忠告之情備見於詩此其俗之所以為厚也解頥曰勤者生財之道儉者用財之節聖人教人不越乎勤儉而已夫勞苦者人情之所畏然而不可以不勉逸樂者人情之所喜然而不可以為過必也致其勤於三時之久而享其樂於一時之暫則其生財不匱而用財有節焉猶恐其或過也又戒之以思其職之所居夫斯民之職不在乎他男子之所當務者稼穡狩獵而已矣女子之所當務者桑麻紡績而已矣誠使男女各盡其職之所當為則廩有餘粟機有餘布老者衣帛食肉少者不饑不寒而於仰事俯育之間可以沛然有餘雖良士之長慮却顧亦不過如此而已豈不可以為美俗哉蟋蟀在堂嵗聿其逝今我不樂日月其邁叶力制反無已大康職思其外叶五墜反好樂無荒良士蹶蹶俱衛反賦也逝邁皆去也外餘也其所治之事固當思之而所治之餘亦不敢忽蓋其事變或出於平常思慮之所不及故當過而備之也思其外則不止於思其居矣輔氏曰人無逺慮必冇近憂故當思慮在事外也思之雖周而為之不敏則亦無益矣蹶蹶動而敏於事也動即勤動之義蟋蟀在堂役車其休今我不樂日月其慆吐刀反叶佗侯反無已大康職思其憂好樂無荒良士休休賦也庶人乗役車孔疏曰役車可載任器以供役亦可用以納禾稼輯録見春官巾車嵗晚則百工皆休矣慆過也休休安閒之貌樂而有節不至於淫所以安也輯録輔氏曰庶人之役車猶休矣則君子可無一日之樂乎職思其居謂所居之職也職思其外謂所職之外也職思其憂謂思之極而至於憂也始則瞿瞿然而思中則蹶蹶然而為終則休休然而安必如是始可以樂而謂之良士爾其意皆自近而逺自淺而深是則所謂憂深而思逺者也蟋蟀三章章八句勸人為樂之意反覆道之輯録楊氏曰此詩欲及時自樂也而卒曰好樂無荒可謂有禮矣當是時風雖變而堯之遺風未亡也朱子曰唐風自是尚有勤儉之意作是詩是一箇不敢放懐底人説今我不樂便又説無已大康通釋曰此詩必曰蟋蟀在堂而後曰今我不樂則能不逰于逸矣旣曰今我不樂又曰無已大康則能不淫于樂矣曰職思其外則儆戒無虞也曰好樂無荒則無怠無荒也以詩人之克勤克儉所憂所思雖無唐虞君臣之德業而其𤼵於詩者與伯益告戒之辭同條共貫信乎前聖遺風之逺也山有樞烏侯昌朱二反隰有榆夷周以朱二反子有衣裳弗曳弗婁力侯力俱二反子有車馬弗馳弗驅袪尤虧于二反宛於阮反其死矣他人是愉他侯以朱二反興也樞荎雉之田結二反也今刺去聲榆也榆白枌音焚也輯録樞其針刺如柘其葉如榆為茹美滑於白榆也榆之皮色白者名枌郭璞云枌榆先生葉却著莢皮色白婁亦曳也輯録曳牽也引也馳走驅䇿也輯録走馬日馳策馬日驅宛坐見貌愉樂也此詩蓋亦答前篇之意而解其憂故言山則有樞矣隰則有榆矣子有衣裳車馬而不服不乗則一旦宛然以死而他人取之以為已樂矣此亦有字相呼為興蓋言不可不及時為樂然其憂愈深而意愈蹙矣為其舉死亡以為説也山有栲音考叶去九反隰有杻女九反子有廷内弗洒弗埽叶蘇后反子有鐘鼓弗鼓弗考叶去九反宛其死矣他人是保叶補苟反興也栲山樗抽居反也似樗色小白葉差初邁反狹輯録孔疏曰栲亦類漆樹俗語曰􅩂樗栲漆相似如此杻檍音意也葉似杏而尖白色皮正赤其理多曲少直材可為弓弩幹者也考擊也保居有也山有漆音七隰有栗子有酒食何不日鼓瑟且以喜樂音洛且以永日宛其死矣他人入室興也君子無故琴瑟不離於側輯録曲禮下云士無故不徹琴瑟陳氏曰故謂災變喪疾之類永長也人多憂則覺日短飲食作樂可以永長此日也此篇衣裳車馬宫庭鐘鼓酒食日鼔瑟盖因所有以為樂無過分湛樂之意也憂深思逺而善於為樂盖如此山有樞三章章八句勸人為樂之意反覆道之輯録謝氏曰始言他人是愉中言他人是保末言他人入室一節悲一節此亦憂深思逺也増釋此詩宛其死矣他人是愉是保入室之意豈果有其然乎詩人無非勸人及時為樂之意若上章好樂無荒其言有制此為之答固將以廣其意而寛其憂其言未免有愈憂而愈蹙之弊矣揚之水白石鑿鑿子洛反素衣朱襮音愽從子于沃叶鬱鎛反旣見君子云何不樂音洛比也鑿鑿巉巖貌襮領也諸侯之服繡黼領而丹朱純音凖也繡黼為領丹朱為縁也輯録郊特牲云繡黼丹朱中衣大夫之僣禮也陳氏曰此諸侯之禮中衣者朝服祭服之裏衣也制如深衣但袖小長耳此所謂服即特牲之中衣歟子指桓叔也沃曲沃也輯録疏云地理志河東聞喜縣故曲沃也今𨽻解州晉昭侯封其叔父成師于曲沃是為桓叔輯録按左傳史記晉穆侯太子曰仇其弟曰成師穆侯薨仇立是為文侯文侯薨昭侯立封成師于曲沃師服諫曰吾聞國家之立也本大而末小是以能固故天子建國諸侯立家今晉甸侯也而建國本旣弱矣其能久乎成師為桓叔後七年晉大臣潘父弑昭侯而迎桓叔晉人敗桓叔立孝侯誅潘父後六十年桓叔之孫武公終并晉國其後沃盛强而晉㣲弱國人將叛而歸之故作此詩言水緩弱而石巉巖以比晉衰而沃盛故欲以諸侯之服從桓叔于曲沃且自喜其見君子而無不樂也鄙晉之衰喜沃之盛則人心有沃而無晉矣輯録歐陽氏曰揚之水其力弱以比昭公微弱不能制曲沃而桓叔之强於晉國如白石鑿鑿然見於水中爾揚之水白石皓皓胡老反叶胡暴反素衣朱繡叶先妙反從子于鵠叶居號反旣見君子云何其憂叶一笑反比也朱繡即朱襮也鵠曲沃邑也揚之水白石𥻘𥻘利新反我聞有命叶彌井反不敢以告人比也粼粼水清石見之貌聞其命而不敢以告人者為之𨼆也輯録嚴氏曰命謂桓叔命其徒以舉事禍將作矣我聞其事不敢以告人也言不敢告人乃所以深告昭公桓叔將以傾晉而民為之隠蓋欲其成矣增釋欲其成是成其叛國之謀也此可見民情旣知隠而不告者豈非助逆而欲歸之也季氏曰古者不軌之臣欲行其志必先施小恵以收衆情然後民翕然從之田氏之於齊亦猶是也田氏以家量貸以公量收貸多取少民皆德之故其召公子陽生於魯國人皆知其已至而不言所謂我聞有命不敢以告人也哀公六年齊景公卒陳僖子使召公子陽生於魯陽生以夜至齊立之是為悼公愚謂自古賊臣隂結人心以盜主國者多矣然使為君者施實徳以恵其民執主柄以御其下恩威一出於已則彼將何所容其偽哉此昏懦之君所以為可罪也揚之水三章二章章六句一章四句一章二章喜從其叛三章𨼆其情而助其叛増釋此詩桓叔將以傾晉國人欲叛而歸之故作是詩據無衣之詩桓叔之孫武公始伐晉滅之疏義云無衣之詩本史記説與春秋不同椒聊之實蕃衍盈升彼其音記之子碩大無朋椒聊且子餘反逺條且興而比也椒樹似茱萸有針刺其實味辛而香烈聊語助也朋比也無朋言無比例也且歎詞逺條長枝也椒之蕃盛則采之盈升矣彼其之子則碩大而無朋矣此以椒之蕃衍興沃之盛大盖用蕃盛之意為興也椒聊且逺條且歎其枝逺而實益蕃也晉至於沃而勢愈盛猶椒至逺條而實益蕃此則比也此不知其所指序亦以為沃也椒聊之實蕃衍盈匊九六反彼其之子碩大且篤椒聊且逺條且興而比也兩手曰匊輯録李氏曰陸農師云兩手為匊兩匊為升先曰升後曰匊互相備而已篤厚也椒聊二章章六句誇美之意反覆道之而揚之水椒聊二詩皆為沃作然椒聊方言其盛大耳揚之水言我聞有命則篡逆已成之勢也二詩之次序當然輯録嚴氏曰此詩言桓叔之强而不及昭公其意則憂昭公之弱言在此而意在彼也綢直留反繆芒侯反束薪三星在天叶鐵因反今夕何夕見此良人子兮子兮如此良人何興也綢繆猶纒綿也輯録束薪之謹密如此三星心也在天昏始見於東方建辰之月也月令季春之月昏七星中七星者二十八宿之星宿也星宿在正南則心星在正東矣輯録通釋曰心宿之象三星鼎立故因謂之三星然凡三星者非止心之一宿而知此詩為指心宿者盖春秋之初辰月本日在畢昏時日淪地之酉位而心宿始見於地之東方此詩男女旣過仲春之月而得成婚故適見心宿也良人夫稱也國亂民貧男女有失其時而後得遂其婚姻之禮者仲春令會男女今至三月則失其時矣詩人叙其婦語去聲夫之詞曰方綢繆以束薪也而仰見三星之在天今夕不知其何夕也而忽見良人之在此彼為偶然而見此則其所幸而見也幸而見者亦若偶然見之故託言所事而以其所見者為興旣又自謂曰子兮子兮其將奈此良人何哉喜之甚而自慶之詞也為失時而後遂願故喜不自勝如此增釋許氏曰仲春㑹男女禮也今過時之人自謂婚姻之道失矣而忽得遂此所以樂也綢繆束芻叶側九反三星在隅叶語口反今夕何夕見此邂户解反逅胡豆反叶狠口反子兮子兮如此邂逅何興也隅東南隅也昏見之星至此則夜久矣邂逅相遇之意此為夫婦相語之詞也綢繆束楚三星在戸侯古反今夕何夕見此粲采旦反者叶章與反子兮子兮如此粲者何興也戸室戸也戸必南出昏見之星至此則夜分矣昏而正東夜久而東南隅夜分而正南盖衆星隨天而轉粲美也此為夫語婦之詞也或曰女三為粲一妻二妾也輯録毛傳云案國語曰獸三為羣人三為衆女三為粲又曰粲美物言美女也綢繆三章章六句以夜之淺深為次序有杕徒細反之杜其葉湑湑私叙反獨行踽踽俱禹反豈無他人不如我同父扶雨反嗟行之人胡不比毗志反焉人無兄弟胡不佽七利反焉興也杕特也杜赤棠也輯録孔疏曰陸璣云赤常與白棠同耳但子有赤白美惡赤棠子澁而酢無味湑湑盛貌踽踽無所親之貌同父兄弟也比輔佽助也此無兄弟者自傷其孤特而求助於人之詞言杕然之杜其葉猶湑湑然人無兄弟則獨行踽踽曽杜之不如矣特生之木若甚茂而獨行之人則無與人不如物故以為興然豈無他人之可與同行也哉特以其不如我兄弟是以不免於踽踽耳於是嗟嘆行路之人何不閔我之獨行而見親憐我之無兄弟而見助也有杕之杜其葉菁菁子零反獨行睘睘求螢反豈無他人不如我同姓叶桑經反嗟行之人胡不比焉人無兄弟胡不佽焉興也菁菁亦盛貌睘睘無所依貌杕杜二章章九句由同父而同姓以親疎為次序増釋許氏曰此詩恐亦因晉沃骨肉相爭致使民之兄弟欲相棄背而知理者自相戒之辭耳羔裘豹袪起居起據二反自我人居居斤於斤御二反豈無他人維子之故攻乎古慕二反賦也羔裘君純羔大夫以豹飾袪袂也嚴氏曰羔裘上下通服君純羔大夫間之故以羔皮為裘以豹皮飾袖口居居未詳羔裘豹褎音袖自我人究究豈無他人維子之好呼報反叶呼候反賦也褎猶袪也究究亦未詳羔裘二章章四句此詩不知所謂不敢强上聲解疑亦喜其大夫之詞然居居究究則不可曉也肅肅鴇羽集于苞栩况禹反王事靡盬音古不能蓺稷黍父母何怙候古反悠悠蒼天曷其有所比也肅肅羽聲鴇鳥名似鴈而大無後趾集止也苞叢生也栩柞櫟也其子為皂斗殻可以染皂者是也輯録本草注櫟木三四月開黄花八九月結實其實為皂斗槲櫟皆有斗爾雅曰櫟其實釋曰􅀈盛實之房也其實橡也有􅀈彚自裹柞櫟也杼也栩也皆櫟之通名橡斗子煮食可止饑殻堪染皂盬不攻緻音稚也輯録李氏曰王事靡盬謂勤於王事而無不攻緻也蓺樹怙恃也民從征役而不得養其父母故作此詩言鴇之性不樹止而今乃飛集于苞栩之上如民之性本不便於勞苦今乃久從征役而不得耕田以供子職也悠悠蒼天何時使我得其所乎肅肅鴇翼集于苞棘王事靡盬不能蓺黍稷父母何食悠悠蒼天曷其有極比也極已也肅肅鴇行户郎反集于苞桑王事靡盬不能蓺稻梁父母何嘗悠悠蒼天曷其有常比也行列也稻即今南方所食稻米水生而色白者也粱粟類也有數色輯録本草注凡云粱米皆是粟類青粱殻穂有毛粒青米亦㣲青而細於黄白粱黄粱穂大毛長殻米俱麄於白粱嘗食也常復其常也復其常也遂安居之樂矣鴇羽三章章七句一章言居處何時而可定二章言行役何時而可已三章言舊時之樂何時而可復輯録通釋曰變風多作於春秋時斯時也天下不知有王之時也而北門云王事適我伯兮云為王前驅此詩亦云王事而且以靡盬為言雖皆怨者之詞猶幸王命之行於列國亦可以見君臣之義根於人心也亦可以見文武成康之遺澤也竭增釋此詩言君子之於王事不可不盡心力堅牢攻緻毋乃行役之久勞苦之甚而不得親稼穡養父母故呼天而告之曰何時而得安其所也何時行役而得已也何時而得復其常也言甚有感怨而不廹雖謂唐風之厚其為人上者使民無制盖可見矣豈曰無衣七兮不如子之衣安且吉兮賦也侯伯七命其車旗衣服皆以七為節衣三章一曰華蟲二曰火三曰宗彞裳四章一曰藻二曰粉米三曰黼四曰黻此七章也其餘如冕則七旈繅七就之類皆是也輯録見春官典命又司服云侯伯之服自鷩冕而下如公之服秋官大行人云諸侯之禮執信圭七寸繅籍七寸冕服七章建常七斿樊纓七就貳車七乗諸伯執躬圭其他皆如諸侯之禮子天子也史記曲沃桓叔之孫武公輯録佗本孫作子誤詳見揚之水注李氏曰桓叔生莊伯觶觶生武公稱伐晉滅之盡以其寳器賂周釐虚冝反與僖同王王以武公為晉君列於諸侯此詩蓋述其請命之意言我非無是七章之衣也而必請命者蓋以不如天子之命服之為安且吉也輯録黄氏曰豈曰無衣自詭强盛也不如子之衣以敵體相輕也當是時晉猶未强非得天子之命服誠不可以久安非武公謙詞也外示强大中實歉然真情所見不可掩也蓋當是時周室雖衰典刑猶在武公旣負弑君簒國之罪則人得討之而無以自立於天地之間故賂王請命而為説如此然其倨慢無禮亦已甚矣輯録輔氏曰請命于天子而敢自謂豈曰無衣不如子之所命則其辭之悖慢無禮亦甚矣釐王貪其寳玩而不思天理民彛之不可廢是以誅討不加而爵命行焉則王綱於是乎不振而人紀或幾乎絶矣嗚呼痛哉豈曰無衣六兮不如子之衣安且燠於六反兮賦也天子之卿六命變七言六者謙也不敢以當侯伯之命得受六命之服比於天子之卿亦幸矣繅六就冕六旈服則五章與子男等輯録王氏曰六者子男之服也子男之服以五為節而曰六者天子之卿六命與子男同服故也燠煖也言其可以乆也無衣二章章三句始言七終言六以謙損降殺為次序輯録嚴氏曰武公之事國人所不與也以晉世家考之初潘父弑昭侯而迎桓叔欲入晉晉人𤼵兵攻桓叔桓叔敗還歸曲沃晉人共立昭侯子平是為孝侯此桓叔初舉而國人不與也其後曲沃莊伯弑孝侯于翼晉人又攻莊伯莊伯復入曲沃晉人復立孝侯子郄是為鄂侯此莊伯再舉國人又不與也及鄂侯卒莊伯伐晉晉人立鄂侯子光是為哀侯此莊伯三舉而國人又不與也及武公誘小子侯殺之晉復立哀侯弟緡此武公四舉而國人終不與也最後武公伐晉侯緡滅之盡以其寳器賂周僖王王命武公為諸侯然後晉人不得已而從之耳然聖人致嚴於名分之際陳成子之事至沐浴而請討盖以人倫之大變天理所不容人人得而討之無衣之詩不剛者所以著世變之窮傷周之衰也吕東萊曰以史記左傳考之平王二十六年晉昭侯封成師于曲沃專封而王不問一失也平王三十二年潘父弑昭侯欲納成師而王又不問二失也四十七年曲沃莊伯弑晉孝侯而王又不問三失也桓王二年曲沃莊伯攻晉王非特不討反使尹氏武氏助之四失也至是武公簒晉僖王反受賂命為諸侯五失也以此五失觀之則禮樂征伐移於諸侯降於大夫竊於陪臣其所由来者漸矣解頥曰武公之事人情所不與天理所不容王法所必誅而序以為美之失其旨矣且武公惟有無王之心而後動於惡彼其請命于天子之使豈真知有王哉正以人心不附非假王靈則終不能以定晉也夫王不命焉而請之非禮也不聞朝王而請命于其使尤非禮也為僖王者固當正名其罪命方伯連帥帥諸侯以討之隳其都而戮其人為晉立君而後反則人紀旣壊而復正王綱已弛而復振文武之道復興於東周矣不此之圖顧乃貪於寳玩而爵命行焉其變為長惡也大矣夫子不剛其詩者所以著世之窮而傷周之衰也按解頥本嚴氏說有杕之杜生于道左彼君子兮噬韓詩作逝肯適我中心好呼報反之曷飲於鴆反食音嗣之比也左東也噬𤼵語詞曷何也此人好賢而恐不足以致之故言此杕然之杜生于道左其䕃不足以休息如已之寡弱不足恃賴則彼君子者亦安肯顧而適我哉然其中心好之則不已也但無自而得飲食之耳夫以好賢之心如此則賢者安有不至而何寡弱之足患哉有杕之杜生于道周彼君子兮噬肯來遊中心好之曷飲食之比也周曲也道左則僻道周則迂杕杜生于僻左迂迴之地力薄位卑有若此矣故兩章皆合兩句而為比輯録言道周遶之故為曲也有杕之杜二章章六句適我且不肯况肯来以遨逰乎以意之淺深為次序輯録輔氏曰好賢而自恐不足以致之則凡可以致之者必無不用也中心好之而自恐其不得飲食之則凡可以養之者必無所吝也好賢之心如此則在彼之賢安有不至而在我之勢又曷患於寡弱哉葛生䝉楚蘞音廉蔓于野叶上與反予美亡此誰與獨處興也蘞草名似栝樓葉盛而細蔓延也予美婦人指其夫也婦人以其夫久從征役而不歸故言葛生而䝉于楚蘞生而蔓于野各有所依託而予之所美者獨不在是則誰與而獨處於此乎此以人不如物為興葛生䝉棘蘞蔓于域予美亡此誰與獨息興也域塋音營域也息止也角枕粲兮錦衾爛兮予美亡此誰與獨旦賦也粲爛華美鮮明之貌獨旦獨處至旦也夏之日冬之夜叶羊茹反百歳之後歸于其居叶姬御反賦也夏日永冬夜永居墳墓也夏日冬夜獨居憂思於是為切然君子之歸無期不可得而見矣要死而相從耳輯録張南軒曰知其死亡之無日矣則斷之以百歳之後庶幾得同歸于丘而已其亦傷之至也鄭氏曰言此者婦人專一義之至情之盡蘇氏曰思之深而無異心此唐風之厚也冬之夜同上夏之日百嵗之後叶音戸歸于其室賦也室壙也葛生五章章四句前三章則思之切後二章則思之專輯録輔氏曰大序所謂𤼵乎情民之性也止乎禮義先王之澤也若是詩可以當之矣采苓采苓首陽之巔叶典因反人之為言苟亦無信叶斯人反舎音捨下同旃之然反舎旃苟亦無然人之為言胡得焉比也首陽首山之南也輯録首陽在河東蒲坂縣亦名雷首山通釋曰集傳以首為山名陽為山之南春秋傳亦曰趙宣子田于首山然此詩下章又云首陽之東則似首陽二字同為山名論語集註亦嘗指首陽為山名矣豈泛名其山則曰首山主山南而言則又獨得首陽之稱乎巔山頂也旃之也此刺聽讒之詩言子欲采苓於首陽之巔乎然人之為是言以告子者未可遽以為信也山巔固有苓矣而采苓未必於山之巔也人言以是而或非有如此矣姑舎置之而無遽以為然徐察而審聽之則造言者無所得而讒止矣或曰興也山巔之苓可采而讒人之言難信反意相承則興體也下章倣此輯録解頥曰無遽以為信則欲其察之詳也曰舎之而無遽以為然則欲其聽之審也能如是則雖誑之以理之所有其計且有所不行况欲昧之以理之所無其計果孰得而行哉小人之為讒譛或積小以成大或飾虚以為實其為害也大矣患人君不能徐察而審聽之耳苟徐察而審聽之則造言者無所遁其情而被讒者亦可以免於禍矣采苦采苦首陽之下叶後五反人之為言苟亦無與舎旃舎旃苟亦無然人之為言胡得焉比也苦苦菜也生山田及澤中得霜甜脆此芮反而美與許也采葑采葑首陽之東人之為言苟亦無從舎旃舎旃苟亦無然人之為言胡得焉比也從聽也采苓三章章八句反覆譏刺輯録埤雅曰苓生於隰葑生於圃則首陽之巔不必有苓其下不必有苦其東不必有葑則理可以無聴從矣按此説有簡兮隰有苓之可證唐國十二篇三十三章二百三句憂深思逺唐風之厚杕杜好賢盖亦知所崇尚者聴讒有刺征役有怨亦無責於變風時惟武公之元惡大憝則國風中所無有也秦一之十一秦國名其地在禹貢雍去聲州之域近鳥鼠山輯録疏秦者隴西谷名漢地理志隴西秦亭秦谷是也鳥鼠與秦谷俱在隴西故云近初伯益佐禹治平聲水有功賜姓嬴氏輯録伯翳助禹治水土舜命作虞官掌上下草木鳥獸賜姓曰嬴秦本紀秦之先帝顓頊之苗裔孫曰女脩生大業生大費是為伯翳地理志秦之先曰伯益又云嬴伯益之後則伯翳伯益聲轉字異猶一人也問姓氏如何分别朱子曰姓是姓大總腦處氏是後来次第分别䖏如魯本姬其後有孟氏季氏同為姬姓而氏不同也其後中音仲潏允律反又音决居西戎以保西垂輯録垂毛韻疆也説文逺邊也六世孫大駱生成及非子非子事周孝王養馬於汧音牽輯録地理志曰汧水出扶風汧縣西北入于渭渭之間馬大繁息孝王封為附庸而邑之秦至宣王時犬戎滅成之族宣王遂命非子曽孫秦仲為大夫誅西戎不克見殺及幽王為西戎犬戎所殺平王東遷秦仲孫襄公以兵送之王封襄公為諸侯曰能逐犬戎即有岐豐之地封諸侯過制棄祖宗興王之地以業嬴秦俾之富強卒禍周室則平王之罪也襄公遂有周西都畿内八百里之地至𤣥孫德公又徙於雍秦即今之秦州雍今京兆府興平縣是也程子曰魏唐旣變則先代之風盡矣嬴氏强大無怪也故次以秦愚謂王道衰國異政於是有霸者而桓文秦穆相繼以起齊魏唐秦上屬王鄭或以此也又按秦與吴楚皆非中國秦有詩而吳楚無之不知何故然蘇氏謂周之盛時千八百逮入春秋猶百餘變風之作先春秋久矣而見於詩者止如此雖小如檜曹亡如弼鄘魏皆在其中則是有者自有無者自無非天子不能以列之樂官亦非本有而夫子剛之也吴楚無詩無庸鑿矣召伯之燕亦當以此例觀之輯録解頥曰按成與非子本兄弚也成之族旣為犬戎所滅而非子之孫秦仲復敗死于西戎則二戎者固秦之世讎也及幽王為西戎犬戎所殺則二戎者又豈非周之世讎歟使平王而有志焉則於襄公之封冝命之糾合侯伯統率師徒而討之則王轍可以不東戎難可以必除而先王之讎亦可以少報矣旣不能然乃曰能逐犬戎即有岐豐之地夫岐豐之地興王之地也不惟其土地人民之不可棄抑先王之墳墓在焉宗廟在焉宫室之美官府之冨皆在焉如之何其可委之而去也且先王之封國有常制矣八百里之地封方百里者八以開方計之則又不止於是矣而一旦舉而畀之於秦藉曰其地已為犬戎所侵令其自取然秦能取之王獨不能率諸侯以取之乎王而少有越句踐之志則必不若是恝矣故嘗謂平王之東也忘先王之仇讎而不報棄先王之土地人民而不恤舎先王之宗廟墳墓而不顧隳先王之典章法度而不守卒使興王八百里之地悉歸於秦則秦之代興不待他日而其兆已見於此矣可勝歎哉有車鄰鄰有馬白顛都田反叶典因反未見君子寺人之令平聲賦也鄰鄰衆車之聲白顛額有白毛今謂之的顙輯録孔疏曰的白也顙額也今之戴星馬王氏曰白顛盖名馬驊騮盜驪赤兔的顱之稱君子指秦君寺人内小臣也輯録孔疏曰寺人在内細小之臣即今内小臣之官也左傳齊有寺人貂晉有寺人披是諸侯有寺人也詩緝曰寺人閹宦令使也是時秦君始有車馬及此寺人之官將見者必先使寺人通之故國人創見而誇美之也輯録廣韻創與剏同初也蘇氏曰凡此皆人君之常禮而秦之先君昔所未嘗有也阪音反有漆隰有栗旣見君子並坐鼓瑟今者不樂音洛逝者其耋田結反叶地一反興也八十曰耋逝徃也其言逝者猶曰自今以徃也阪則有漆矣隰則有栗矣輯録陂者曰阪下濕曰隰旣見君子則並坐鼓瑟矣失今不樂則逝者其耋矣輔氏曰秦國方興禮儀初備人心歡悦而勸其為樂如此與唐風山有樞之言不同愚謂勸其為樂本同也至於逸樂之是亟憂思之不知易於滿盈秦俗之敝則非唐比矣此為無義之興山有樞以兩句興六句此詩則以兩句興兩句後兩句在興外輯録嚴氏曰中二句簡易相親之俗也末二句悲壯感歎之氣也秦之强以此而止於為秦亦以此増釋𫝊文六句以則矣二字㸃掇為訓即朱子説詩之法也㸃平聲阪有桑隰有楊旣見君子並坐鼓簧今者不樂逝者其亡興也簧笙中金葉吹笙則鼓動之以出聲者也車鄰三章一章四句二章章六句首章誇其所有後二章勸其樂所有駟驖田結反孔阜符有反六轡在手公之媚媚冀反子從公于狩叶始九反賦也駟驖四馬皆黒色如鐵也孔甚也阜肥大也六轡者兩服兩驂各兩轡而驂馬兩轡納之於觖即觼字音决環之有舌者見小戎故惟六轡在手也媚子所親愛之人也輯録嚴氏曰首句言馬之良二句言御之良三句四句見便嬖足使令於前也此亦前篇之意也奉時辰牡辰牡孔碩叶常灼反公曰左之舎音捨拔蒲末反則獲叶黄郭反賦也時是辰時也牡獸之牡者辰牡者冬獻狼夏獻麋春秋獻鹿豕羣獸之類諸本脱秋字又脱群獸二字皆誤奉之者虞人翼以待射音石也輯録此本毛傳與天官獸人文稍異獸人云春秋獻獸物注狼膏聚麋膏散聚則温散則涼故冬夏獻之春秋寒温適故獸物皆獻之孔疏曰獸人所獻以供膳虞人無奉獸之文故引獸人之文以解時牡耳碩肥大也公曰左之者命御者使左其車以射音石下同獸之左也蓋射必中去聲其左乃為中殺五御所謂逐禽左者為去聲是故也詳見車攻輯録何氏曰公羊傳解第一殺第二殺第三殺皆自左膘射之達于右則左當人君之左指禽獸之左膘而言膘音縹拔矢括也輯録孔疏曰矢末為括以鏃為首故拔為末曰左之而捨拔無不獲者言獸之多而射御之善也逰于北園四馬旣閑叶胡田反輶音由車鸞鑣彼驕反載獫力驗反歇許竭反驕許喬反賦也田事已畢故逰于北園閑調習也輶輕去聲又如字也鸞鈴也效鸞鳥之聲鑣馬銜也驅音去又音區逆之車置鸞於馬銜之兩旁逆迎也謂與禽遇也輯録夏官田僕掌設驅逆之車徃驅禽使前趨獲逆御還之使不出圍御音迓埤雅曰置鸞於鑣尚輕疾也乗去聲車則鸞在衡和在軾也獫歇驕皆田犬名長喙音諱曰獫短喙曰歇驕以車載犬蓋以休其足力也輯録喙説文口也黄氏曰王嚴戴三家以為田畢而逰園載獫於輶車以歇其驕逸王曰字不從犬也嚴氏田犬無短喙者也未知然否韓愈畫記有騎去聲擁田犬者亦此類擁抱也言騎馬之人抱田犬也駟驖三章章四句首章出獵二章獲獸三章畢事輯録輔氏曰駟驖孔阜言其馬之盛也六轡在手言其御之善也公之媚子從公于狩言公有所親愛之人隨公以田獵疑即指御者而言也奉時辰牡辰牡孔碩虞人奉翼犬獸以待公之射禮儀之備也公曰左之舎拔則𫉬射御之精也遊于北園因出狩而逰觀也四馬旣閑車馬皆閑習也輶車鸞鑣載獫歇驕雖田犬而亦處得冝也此皆昔無而今有故歴叙其事而誇美之也秦本保于西戎自非子為附庸而邑之秦遂入于中國自襄公為諸侯盡有周西都畿内岐豐之地然後始備中國之禮儀侍御而詩人美之然觀其所美者如此則其所缺者亦多矣張南軒曰讀車鄰駟驖之詩則知秦之立國自其始創則不過盛其車馬奉養之事競為射獵之為而已盖不及於用賢制民也則其流風亦習乎是而已増釋許氏曰此但以君所乗車而言四馬一色君車之選也媚子公之御者也六轡在手在其手也公曰左之命此人也舎拔則獲君射之善又以見御之良也詠其辭意則車馬侍從之盛不言而可見矣小戎俴錢淺反收五楘音木梁輈陟留反游環脅驅叶居懼反又居録反隂靷音胤鋈音沃續叶辭屢反又如字文茵音因暢勅亮反轂叶又去反駕我騏音其馵之樹反又之録反言念君予温其如玉在其板屋亂我心曲賦也小戎兵車也輯録董氏曰六月言元戎此天子之車也諸侯之戎車謂之小戎冝也俴淺也收軫也謂車前後兩端横木所以收斂所載者也凡車之制廣皆六尺六寸其平地任載者為大車則軫深八尺兵車則軫深四尺四寸故曰小戎俴收也輯錄孔疏曰兵車當輿之内前軫至後軫惟深四尺四寸人之升車自後登之入於車内故以淺深言之五五束也楘歴録音禄然文章之貌也梁輈從前軫以前稍曲而上至衡則向下鉤之横衡於輈下而輈形穹隆上曲如屋之梁梁輈即轅也又以皮革五處束之其文章歴録然也㳺環靷環也以皮為環當兩服馬之背上游移前却無定處引兩驂馬之外轡貫其中而執之所以制驂馬使不得外出左傳曰如驂之有靳是也輯録定公九年注言如驂馬之隨靳也脅驅亦以皮為之前係於衡之兩端後係於軫之兩端當服馬脅之外所以驅驂馬使不得内入也隂揜軓也軓在軾前而以板横側揜之以其隂映此軓故謂之隂也軓一作􅓶從已或從凡扶泛反嚴氏以此為是蓋車軾前為􅓶也軌從九居誄反昭武黄氏以此為是謂輪有高下廣狹皆定於軌輪中之軓旣同則轍迹亦同後人因謂車轍為軌車輪崇六尺六寸軓居輪之中實得三尺三寸愚按如此則車軾前總謂之􅓶音如范其兩輪相夾之中車轂以上高廣皆三尺三寸謂之軌音如匭二字皆可通也横側揜之者横用一板揜其前側用二板揜其左右三面而揜之横側板之内與軌􅓶相映也靷以皮二條前係驂馬之頸後係隂版之上也輯録毛𫝊靷所以引也鋈續隂版之上有續靷之處消白金沃灌其環以為飾也輯録孔疏曰鋈沃也謂消白金以沃灌靷環鋈續則是作環相接蓋車衡之長六尺六寸止容二服驂馬之頸不當於衡故别為二靷以引車亦謂之靳輯録羅氏曰靳當胸之皮驂馬之首當服馬之胸胸前有靳靳居覲反左傳曰兩靷將絶是也輯録孔疏曰驂馬頸不當衡則為二靷條隂版上令驂馬引之大叔于田云兩服齊首兩驂如手明驂馬首不與服馬齊文茵車中所坐虎皮褥也暢長也轂者車輪之中外持輻内受軸者也大車之轂一尺有半兵車之轂長三尺二寸故兵車曰暢轂輯録孔疏曰言長於大車之轂騏騏文也輯録見曹風鳲鳩馬左足白曰馵君子婦人目其夫也温其如玉美之之詞也板屋者西戎之俗以版為屋念其逺在西戎也故曰在其板屋心曲心中委曲之處也西戎者秦之臣子所與不共戴天之讎也以滅成之族及殺秦仲故也襄公上承天子之命率其國人徃而征之故其從役者之家人先誇車甲之盛如此而後及其私情蓋以義興師則雖婦人亦知勇於赴敵而無所怨矣輯録朱子曰襄公報君父之仇其所以不自己者豈忮忿之心哉乃大倫之正天理之發以大義驅其人而戰之此㐮公所以能用其人而秦人所以樂為之用也四牡孔阜扶有反六轡在手騏駵音留是中叶諸仍反騧古花反驪是驂叶疏簮反龍盾順允反之合鋈以觼古穴反軜音納言念君子温其在邑叶於合反方何為期胡然我念之賦也赤馬黒鬛曰駵中兩服馬也黄馬黒喙曰騧驪黒色也盾干也輯録孔疏盾以木為之畫龍於盾合而載之以為車上之衛必載二者備破毁也輯録黄氏曰盾者今遮箭牌也盾狹而車廣一盾不足為衛必以二盾比而合之乃足為衛非防其破毁也與二矛重弓意不同觼環之有舌者軜驂内轡也置觼於軾前以係軜故謂之觼軜亦消沃白金以為飾也邑西鄙之邑也方將也將以何時為歸期乎何為使我思之極也俴駟孔羣厹音求矛鋈錞徒對反叶朱倫反蒙伐有苑叶音氲虎韔敕亮反鏤音漏膺交韔二弓叶姑𢎞反竹閉緄古本反縢直登反言念君子載寢載興厭厭於鹽反良人秩秩德音叶一陵反賦也俴駟四馬皆以淺薄之金為甲欲其輕而易於馬之旋習也孔甚羣和也輯録物不和則不得羣聚故以和為羣也厹矛三隅矛也刄有三角鋈錞以白金沃矛之下端平底者也刃在上為末其本之底者為錞輯録曲禮注鐓為矛柄尾平底䝉雜也伐中干也盾之别名盾食允反大者謂之櫓中者謂之伐干盾亦其類也苑文貌畫雜羽之文於盾上也虎韔以虎皮為弓室也鏤膺鏤金以飾馬當胷帶也交韔交二弓於韔也謂顛倒安置之必二弓以備壊也閉弓檠也儀禮作䪐緄繩縢約也以竹為閉而以繩約之於弛弓之裏檠弓體使正也輯録正弓曰檠音景弓檠讀如字正弓器也載寢載興言思之深而起居不寧也厭厭安也安重也言其德之安重也秩秩有序也聲譽之著自内及外自近及逺所謂秩秩之德音也小戎三章章十句輔氏曰上以車馬兵器言下以婦人極其憂思情也無所怨刺義也輯録解頥曰一章言其車之善二章言其馬之良三章言其器之備以如是之兵甲復如是之冦讎此其矜誇之詞也温則言其德之和易厭厭則言其德之安静秩秩則言其德之有常以如是之君子而親如是之勞苦此其閔惜之詞也西戎者秦人不共戴天之讎也故復讎討賊之義不特其君知之其卿大夫知之其國人知之雖行役者之婦人亦無不知之而其形於言者如此東周之君臣亦可以少愧矣蒹右恬反葭音加蒼蒼白露為霜所謂伊人在水一方遡所路反洄音回從之道阻且長遡㳺從之宛在水中央賦也蒹似萑音丸而細高數尺又謂之薕音廉輯録爾雅鄭註荻也蘆屬而小可為萡萑説文薍也葭蘆也蒹葭未敗而露始為霜秋水時至百川灌河之時也秋水盛川流之絶者亦通無不注於河矣輯録見莊子秋水篇伊人猶言彼人也一方彼一方也遡洄逆流而上上聲也遡游順流而下也宛然坐見貌在水之中央言近而不可至也言秋水方盛之時所謂彼人者乃在水之一方上下求之而皆不可得然不知其何所指也秦無尊賢好德之風又無男女淫奔豈朋友相念而作與輯録解頥曰白露為霜言其時之暮也在水一方言其居之逺也迫之以時之暮限之以水之逺所謂伊人果若何而求之將欲使之逆流而上以求之與則旣逺而不可即將欲使之順流而下以求之與則雖近而不可至然則斯人也其終不可見乎孔子曰未之思也夫何逺之有亦在乎心誠求之而已所謂伊人雖不知其所指然味其詞有敬慕之意而無褻慢之情則必指賢人之肥遯者惜不知其何人耳舊說以為未能用周禮者非是蒹葭凄凄白露未晞所謂伊人在水之湄遡洄從之道阻且躋遡游從之宛在水中坻直尸反賦也凄凄猶蒼蒼也晞乾也湄水草之交也岸有草水與草交則水之際也躋升也言難至也水渚曰坻蒹葭采采叶此禮反白露未已所謂伊人在水之涘叶以始二音遡洄從之道阻且右叶羽軌反遡游從之宛在水中沚賦也采采言其盛而可采也已止也右不相直音值而出其右也輯録直當也又與值同遇也小渚曰沚蒹葭三章章八句思念之意反覆道之終南何有有條有梅叶莫悲反君子至止錦衣狐裘叶渠之反顔如渥於角反丹其君也哉叶將黎反興也終南山名在今京兆府南輯録京兆府即今陜西西安府條山楸音秋也皮葉白色亦白材理好冝為車版君子指其君也至止至終南之下也錦衣狐裘諸侯之服也玉藻曰君衣去聲狐白裘錦衣以裼之凡服内有袍襗之屬然後加裘又以衣䝉之謂之裼襗音如澤渥漬疾賜反也輯録顔色如厚漬之丹言赤而澤也其君也哉言容貌衣服稱去聲其為君也終南之山有條又有梅君子之服有衣又有裘皆二者兼備之意故以為興此秦人美其君之詞亦車鄰駟驖之意也車鄰駟驖終南秦之始興也而國人之美其君者不過田獵之娛車馬侍御衣服燕樂而已禮樂教化未之開也嗚呼此豈創業垂統之謂哉終南何有有紀有堂君子至止黻音弗衣繡裳佩玉將將七羊反壽考不忘興也紀山之㢘角也堂山之寛平處也黻之狀亞兩已相戾也漢韋賢傳注云亞古弗字故因謂之黻繡刺匕亦反繡也將將佩玉聲也壽考不忘者欲其居此位服此服長久而安寧也不忘只是無窮之意終南二章章六句一章美之二章美而祝之交交黄鳥止于棘誰從穆公子車奄息維此奄息百夫之特臨其穴叶戸橘反惴惴其慄彼蒼者天叶鐵因反殱子㢘反我良人如可贖兮人百其身興也交交飛而徃來之貌從穆公從死也子車氏奄息名特傑出之稱穴壙也惴惴懼貌慄懼殱盡良善贖貿音茂也秦穆公名任好卒以子車氏之三子為殉從閒反皆秦之良也國人哀之為去聲之賦黄鳥事見春秋傳見文公六年即此詩也言交交黄鳥則止于棘矣誰從穆公則子車奄息也蓋以所見起興也彼止於棘此從穆公亦相呼應為興臨穴而惴惴蓋生納之壙中也三子皆國之良而一旦殺之若可貿以他人則人皆願百其身以易之矣交交黄鳥止于桑誰從穆公子車仲行戸郎反維此仲行百夫之防臨其穴惴惴其慄彼蒼者天殱我良人如可贖兮人百其身興也防當也言一人可以當百夫也交交黄鳥止于楚誰従穆公子車鍼音鉗虎維此鍼虎百夫之禦臨其穴惴惴其慄彼蒼者天殱我良人如可贖兮人百其身興也禦猶當也黄鳥三章章十二句此必以其兄弟長少為次序春秋傳曰君子曰秦穆公之不為盟主也冝哉死而棄民先王違世猶貽之法而况奪之善人乎今縱無法以遺去聲後嗣而又收其良以死難以在上矣君子是以知秦之不復扶又反東征也愚按穆公於此其罪不可逃矣但或以為穆公遺命如此而三子自殺以從之孔又云則三子亦不得為無罪今觀臨穴惴慄之言則是康公從父之亂命迫而納之於壙其罪有所歸矣穆公父子皆不仁之君而康公尤可罪也輯録左傳宣公十五年魏顆曰疾病則亂吾從其治命也又按史記秦武公卒初以人從才用反死死者六十六人至穆公遂用百七十七人而三良與去聲焉蓋其初特出於戎翟狄同之俗而無明王賢伯以討其罪於是習以為常則雖以穆公之賢而不免論其事者亦徒閔三良之不幸而歎秦之衰至於王政不綱諸侯擅命殺人不忌至於如此則莫知其為非也鳴呼俗之弊也久矣其後始皇之葬後宫皆令從死工匠生閉墓中尚何怪哉忍於殺人秦俗相傳之大弊輯録朱子曰始皇葬驪山下錮三泉令匠作機弩有穿近者輒射之上具天文下具地理後宫無子者皆令從死工匠為機者皆閉之墓也通釋曰古之葬者有明器但備物而不可用如芻靈亦其類也不幸流俗之弊而至於作俑又不幸而至於用人然作俑者夫子且以為不仁而謂其無後况秦武公旣用殉五傳至穆公而又用殉夫子之言反似無驗孰知穆公之後二十一傳至莊㐮王而吕氏之子遂絶嬴氏之統緒夫始皇不知所監驪山葬後未三年而吕氏之祀又絶嗚呼不仁之禍及子孫如此鴥伊橘反彼晨風叶孚愔反鬱彼北林未見君子憂心欽欽如何如何忘我實多興也鴥疾飛貌晨風鸇也鸇性急疾其飛鴥然得意也鬱茂盛貌君予指其夫也欽欽憂而不忘之貌婦人以夫不在而言鴥彼晨風則歸于鬱然之北林矣故我未見君子而憂心欽欽也物有所歸則意甚得人無所託則憂不忘人不如物故以起興彼君子者如之何而忘我之多乎此與扊扅音剡移户扃也之歌同意蓋秦俗也百里奚貴顯遺棄其妻妻作歌曰百里奚五羊皮臨别時烹伏雌炊扊扅今日富貴忘我為山有苞櫟盧狄反叶歴各反隰有六駁邦角反未見君子憂心靡樂音洛如何如何忘我實多興也駁梓榆也其皮青白如駁山則有苞櫟矣隰則有六駁矣輯録孔疏王肅云言六據所見而言也未見君子則憂心靡樂矣山高隰下則有櫟與駁夫婦離别則有靡樂之憂心物與地相冝而情與事相係也故以為興靡樂則憂之甚也山有苞棣隰有樹檖未見君子憂心如醉如何如何忘我實多興也棣唐棣檖赤羅也輯録陸氏曰其文細宻如羅又有白羅皆文木實似梨而小酢音醋可食實小而味酸可食也輯録陸氏曰一名山棃一名鹿棃一名鼠棃極有脆美者如醉則憂又甚矣晨風三章章六句憂思之意以漸而深豈曰無衣與子同袍抱毛反叶歩謀反王于興師修我戈矛與子同仇賦也袍襺音繭也純用新綿為緼也輯録玉藻云纊為繭緼為袍陳氏曰纊新綿也緼舊絮也衣之有著者用新綿則謂之繭用舊絮則謂之袍戈六尺六寸輯録周禮曰戈柲六尺有六寸柲猶柄也柲音袐矛長二丈輯録周禮曰酋矛常有四尺注八尺曰尋倍㝷曰常常冇四尺是二丈也王于興師以天子之命而興師也秦俗强悍樂於戰鬭故其人平居而相謂曰豈以子之無衣而與子同袍乎蓋以王于興師則將修我戈矛而與子同仇也其懽愛之心足以相死如此我有緼袍而與爾共之者非為爾之無衣也君有仇讎盖欲與爾共報耳市恩結死以為君上此奮不顧身者之所為也蘇氏曰秦本周地故其民猶思周之盛時而稱先王焉輯録陳君舉曰東遷之後王室雖㣲而在於人心者未泯也讀文侯之命者嘆平王之無志其有以哉或曰興也取與子同三字為義語相應也後章放此豈曰無衣與子同澤叶徒洛反王于興師修我矛㦸叶訖約反與子偕作賦也澤裏衣也以其親膚近於垢澤故謂之澤澤即襗古字通輯録說文曰襗絝也絝即袴㦸車㦸也長丈六尺作起也言起而去也豈曰無衣與子同裳王于興師脩我甲兵叶晡茫反與子偕行户郎反賦也行徃也無衣三章章五句袍轉裏而澤澤轉下而裳同仇則偕作偕作則偕行此三章前後之序者増釋許氏曰秦舊周也先王遺化猶有存其曰豈曰無衣與子同袍者相賙之意也修我戈矛與子同仇者相死之心也但秦不善用之一導之以武事而不知以禮故敦厚之風化為剛暴之氣而遂至於不可禁也此詩之作君子知其有漸矣西戎乃秦人不共戴天之讎而又有王命興師是以同心疾之謳吟思鬭雖其風俗所致然以義動者人樂為之死亦必然之理也秦人之俗大抵尚氣槩先勇力忘生輕死故其見於詩如此然本其初而論之岐豐之地文王用之以興二南之化如彼其忠且厚也秦人用之未幾而一變其俗至於如此則已悍然有招音翹舉也八州而朝音潮同列之氣矣何哉雍州土厚水深其民厚重質直無鄭衛驕惰浮靡之習以善導之則易興起而篤於仁義以猛驅之則其彊毅果敢之資亦足以彊兵力農而成富彊之業非山東諸國所及也嗚呼後世欲為定都立國之計者誠不可不監乎此而凡為國者其於導民之路尤不可不審其所之也輯録輔氏曰堯與文武皆聖人也然堯之風歴三代而尚有遺於晉至文武之風則一變為秦而不復有遺者何哉盖堯之時風氣方開純樸未散譬之人則孩提之時也至文武時則其人壯大矣今人於孩提之時教之則雖老大有不忘者至於年日益壯雖强聒之旋得旋失終不能久而不忘也謝氏曰幽王没於驪山此中國之大恥周家萬世不可忘之大讎也讀文侯之命可以知諸侯無復讎之志矣獨無衣一詩毅然以天下大義為已任其心忠而誠其氣剛而大其詞壯而直吾乃知岐豐之地被文武周公之化最深雖世降俗末人心天理不可泯滅者尚異於列國也解頥曰與子同袍恩愛相結於無事之時也與子同仇患難相恤於有事之日也先王之時居而為比閭族黨之民出而為伍兩軍師之衆其所以使之相保相愛相扶持者要非一日之積矣岐豐之地雖已屬秦然猶有先王之遺民焉故其所以相告語者如此然曰王于興師則非從其君之私也誠欲其君奉王命而為討賊復讎之舉也惜也周既不能以此而令諸侯秦復不能以此而匡王室卒之數𫝊之後討賊復讎之志既衰貪功謀利之心益勝而其囂然好戰之習非復先王之民真秦之民矣我送舅氏曰至渭陽何以贈之路車乗繩證反黄賦也舅氏秦康公之舅晉公子重平聲耳也輯録母之昆弟曰舅出亡在外穆公召而納之時康公為太子康公名罃送之渭陽而作此詩渭水名秦時都雍至渭陽者蓋東行送之於咸陽之地也輯録孔氏曰漢地理志云右扶風渭城縣故咸陽也其地在渭水之北路車諸侯之車也輯録董氏曰巾車金路以封同姓象路以封異姓革路以封四衛木路以封蕃國皆諸侯也故人君之車曰路車乘黄四馬皆黄也我送舅氏悠悠我思叶親齎反何以贈之瓊瑰古回反玉佩叶蒲眉反賦也悠悠長也序以為時康公之母穆姬已卒故康公送其舅而念母之不見也輯録嚴氏曰送舅而有所思則思母也或曰穆姬之卒不可考此但别其舅而懐思耳瓊瑰石而次玉輯録曹氏曰玉佩珩璜琚瑀之屬輔氏曰讀是詩者見其情意周至言有盡而意無窮良心之𤼵固如是也渭陽二章章四句贈送之意不一而足按春秋傳晉獻公烝於齊姜武公妾生秦穆夫人太子申生娶犬戎胡姬生重耳犬戎唐叔子孫别在戎狄者小戎子生夷吾允姓之戎子女也驪姬生奚齊其娣生卓子驪姬譛申生申生自殺又譛二公子二公子皆出奔獻公卒奚齊卓子繼立皆為去聲被也大夫里克所弑秦穆公納夷吾是為恵公卒子圉立是為懐公立之明年秦穆公又召重耳而納之是為文公此具晉文出入本末以見康公送之之由王氏曰至渭陽者送之逺也悠悠我思者思之長也路車乘黄瓊瑰玉佩者贈之厚也輯録謝氏曰送之逺贈之厚念母之心可見矣廣漢張氏曰康公為太子送舅氏而念母之不見是固良心也而卒不能自克於令平聲狐之役魯文公七年秦康公納公子雍於晉不受禦秦師敗之令狐十二年秦伯伐晉報令狐之役也怨欲害乎良心也使康公知循是心養其端而充之則怨欲可消矣渭陽之思可取而令狐之怨可罪故引張氏説以斷之於我乎夏屋渠渠今也每食無餘于音吁嗟乎不承權輿賦也夏大也渠渠深廣貌承繼也權輿始也輯録嚴氏曰造衡自權始造車自輿始此言其君始有渠渠之夏屋以待賢者而其後禮意寖衰供億寖薄億安也供其匱乏而安之也至於賢者每食而無餘於是嘆之言不能繼其始也秦君非有好賢之誠心者故其無恒如此於我乎每食四簋叶已有反今也每食不飽叶捕苟反于嗟乎不承權輿賦也簋瓦器容斗二勝輯録勝孔疏作升方曰簠圓曰簋簠盛音成稻粱簋盛黍稷四簋禮食之盛也權輿二章章五句無餘已不可不飽則甚矣譏刺之意以漸而深漢楚元王敬禮申公白公穆生穆生不嗜酒元王每置酒嘗為去聲下同穆生設醴及王戊即位嘗設後忘設焉穆生退曰可以逝矣醴酒不設王之意怠不去楚人將鉗于廉反我於市遂稱疾申公白公强上聲起之曰獨不念先王之德歟今王一旦失小禮何足至此穆生曰先王之所以禮吾三人者為道之存故也今而忽之是忘道也忘道之人胡可與久處豈為區區之禮哉輯録區區小貌此句盖與上文失小禮相應輔氏禮作醴遂謝病去亦此詩之意也引此以明詩人之意不在禮之厚薄而在誠之至與不至也秦國十篇二十七章一百八十一句小戎無衣見秦人之勇於公義如此車鄰駟驖終南秦之盛也駸駸乎不可遏矣惜乎殘忍不仁有黄鳥簡賢棄禮有權輿而骨肉相忘習俗之薄又有如晨風者秦之所以易興易亡者以其無先王禮義故也詩經疏義㑹通卷六
