body:
  text: 詩經疏義㑹通卷十五元朱公遷撰都人士之什二之八彼都人士狐裘黃黃其容不改出言有章行歸于周萬民所望叶音亡賦也都王都也黃黃狐裘色也不改有常也如色溫貌恭之類章文章也周鎬京也亂離之後人不復見昔日都邑之盛謂之彼都人士則非今此都邑之人矣人物儀容之美輯録輔氏曰容則德之符也言則德之發也容言如此則其德可知而作此詩以歎惜之也彼都人士臺笠緇撮七活反叶租恱反彼君子女綢直留反直如髮叶方月反我不見兮我心不說音恱賦也臺夫音扶須也輯録陸氏曰莎草也可以為蓑笠緇撮緇布冠也其制小僅可撮其髻也輯録王氏曰臺笠緇撮在野與衆皆作之服君子女都人貴家之女也綢直如髮未詳其義然以四章五章推之亦言其髮之美耳綢直言其多而不曲局也但如字不可曉耳或云如字當作其字彼都人士充耳琇音秀實彼君子女謂之尹吉我不見兮我心苑音愠結叶繳質仄賦也琇美石也以美石為瑱尹吉未詳鄭氏曰吉讀為姞其入聲尹氏姞氏周之昏姻舊姓也人見都人之女咸謂尹氏姞氏之女言其有禮法也輯録疏云尹氏周之舊族也姞與周室為昏姻也世貴舊姓昏連土室家風不替故有禮去也李氏曰所謂尹吉猶晉言王謝唐言崔盧也輯録王王導族謝謝安族王有太原琅琊二宗琅邪為盛山東顯族土門崔岡頭盧皆為時所稱也苑猶屈也積也彼都人士垂帶而厲叶落蓋反彼君子女卷音權髮如蠆初邁反我不見兮言從之邁賦也厲垂帶之貌卷髮鬢傍短髮不可斂者曲上卷然以為飾也蠆螫音釋蟲也尾末揵音䖍然輯録揵舉也似髮之曲上者邁行也蓋曰是不可得見也得見則我從之邁矣思之甚也匪伊垂之帶則有餘匪伊卷之髮則有旟我不見兮云何盱喜俱反矣賦也旟揚也盱望也說見何人斯篇此言士之帶非故垂之也帶自有餘耳女之髮非故卷之也髮自有餘耳言其自然閒美不假修飾也然不可得而見矣則如何而不望之乎都人士五章章六句一章専以男子言二章以後兼男子婦人言終朝采緑不盈一掬弓六反豫髮曲局薄言歸沐賦也自旦及食時為終朝緑王芻也輯録爾雅鄭樵注藎草亦名菉蓐兩手曰掬局卷音權也猶言首如飛蓬也婦人思其君子而言終朝采緑而不盈一掬者思念之深不専於事也又念其髮之曲局於是舍之而歸沐以待其君子之還也輯録嚴氏曰菉易得之菜終朝采之而不滿兩手之掬憂思之心不在故也婦人夫不在不為容飾髮久不櫛則曲局不舒展庶幾其夫之歸而沐望之之辭也終朝采藍盧談反不盈一襜尺占反叶都甘反五日為期六日不詹音占叶多甘仄賦也藍染皂也衣蔽前謂之襜即蔽膝也詹與瞻同五日為期去時之約也六日不詹過期而不見也之子于狩尺救反言韔勑亮反其弓叶姑𢎞反之子于釣言綸之繩賦也之子謂其君子也理絲曰綸言君子若歸而欲往狩耶我則為之韔其弓欲往釣耶我則為之綸其繩望之切思之深欲無往而不與之俱也輯録輔氏曰狩而韔弓釣而綸繩本非婦人之事望之切思之深設言其如此以見其欲無往而不與之俱是雖夫婦之正情然使其形於言焉則怨曠甚其釣維何維魴音房及鱮音叙叶音湑維魴及鱮薄言觀者叶掌與反賦也於其釣而有獲也又將從而觀之亦上章之意也輯録孔疏上章兼有狩此偏言釣者因上章釣文在下接而申之采緑四章章四句一章及期而將歸二章過期而不歸三章四章言歸則與之偕行偕止也預言之也芃芃蒲東反黍苗隂雨膏古報反之悠悠南行召伯勞力報反之興也芃芃長大貌悠悠逺行之意宣王封申伯於謝命召穆公往營城邑故將徒役南行而行者作此言芃芃黍苗則唯陰雨能膏之悠悠南行則唯召伯能勞之也此因所見而取人物各冇所天之意故以語相呼為興我任音壬我輦力展反我車我牛叶魚其反我行既集蓋云歸哉叶將黎反賦也任負任者也輯録疏謂器物人所負持輦人挽音晚車也牛所以駕大車也集成也營謝之役既成而歸也以此下四章觀之當是作於功畢還歸之日我徒我御我師我旅我行既集蓋云歸處賦也徒步行者御乘車者五百人為旅五旅為師春秋傳曰君行師從卿行旅從輯録春秋定公四年衛祝鮀曰嘉好之事云云肅肅謝功召伯營之烈烈征師召伯成之賦也肅肅嚴正之貌謝邑名申伯所封之國也在鄧州信陽軍輯録今河南有鄧州及信陽縣是也功工役之事也營治也烈烈威武貌征行也成者成其功也兵則武矣必召公督之而後功告成原隰既平泉流既清召伯有成王心則寧賦也土治去聲曰平水治曰清言召伯營謝邑相去聲其原隰之宜通其水泉之利此功既成宣王之心則安也當時宣王以徹申伯土田為命故云然輯録謝氏曰疆其土田事畢則原隰平矣治其溝洫事畢則泉流清矣黍苗五章章四句首章歸德於召公二章三章則城邑既成而徒役可歸也四章歸功於召公五章則上田既治而王心可安也此宣王時詩與大雅嵩髙相表裏輯録許氏曰上公則下說蓋申伯誠有功於天下而封之誠當矣故民雖勞無怨而且樂道其事也其未章既喜謝邑之平治頌召伯之成功而歸重於王心之寧忘己之勞以奉其上惟欲得王心之安爾此見忠實之情太和之氣象也隰桑有阿其葉有難乃多反既見君子其樂音洛下同如何興也隰下濕之處宜桑者也阿美貌難盛貌皆言枝葉條垂之狀此喜見君子之詩言隰桑有阿則其葉有難矣既見君子則其樂如何哉詞意大槩與菁莪相類此以可喜之物為喜見君子之興也詳見菁莪然所謂君子則不知其何所指矣變雅中之君子必非在朝有位之人然詩無歎息招徠之意則又非棄而在野者此則不可知也或曰比也下章放此以隰桑之阿難比君子容貌威儀之盛隰桑有阿其葉有沃烏酷反叶鬱縳反既見君子云何不樂興也沃光澤貌以上二章言見君子而其心樂隰桑有阿其葉有幽叶於交反既見君子德音孔膠音交興也幽黑色也桑極茂則緑深而似黑輯録幽釋文於九反膠固也德音孔膠言其德音之孚於人者無間也此章見其可樂之實下章之誠愛亦本於此耳此章以可喜之物興可喜之人比上二章小異心乎愛叶許既反矣遐不謂矣中心藏之何日忘之賦也遐與何同表記作瑕鄭氏注曰瑕之言胡也謂猶告也言我中心誠愛君子而既見之則何不遂以告之而但中心藏之將使何日而忘之邪輯録許氏曰詩人自道其愛賢之意如此楚辭所謂思公子兮未敢言輯録九歌注曰懼其瀆也意蓋如此愛之根於中者深故發之遲而存之久也此章極言既見之樂隰桑四章章四句喜樂之意反覆道之如增釋吳師道曰一章其樂何二章云何不樂三章德音孔膠四章中心藏之何日忘之一節深一節白華音花菅音姦兮白茅束兮之子之逺俾我獨兮比也白華野菅也已漚於候反漬也為菅輯録孔疏漚之柔韌異其名謂為菅因謂在野未漚者為野菅耳之子斥幽王也俾使也我申后自我也幽王娶申女以為后又得褒姒而黜申后故申后作此詩言白華為菅則白茅為束二物至微猶必相須為用何之子之逺而俾我獨耶宜相得而仄相遺可怨者也輯録朱子曰讀詩之法且如此章蓋言白華與茅尚能相依而我與子乃相去之逺何哉英英白雲露彼菅茅所莫侯反天步艱難之子不猶比也英英輕明之貌白雲水土輕清之氣當夜而上騰者也露即其散而下降者也步行也天步猶言時運也猶圖也或曰猶如也言雲之澤物無微不被今時運艱難而之子不圖不如白雲之露菅茅也恩澤宜降而不降可怨者也滮符彪反池北流浸彼稻田叶地因反嘯歌傷懷念彼碩人比也滮流貌北流豐鎬之間水多北流輯録滮當易皮休仄碩人尊大之稱亦謂幽王也言小水微流尚能浸灌王之尊大而反不能通其寵澤所以使我嘯歌傷懷而念之也恩澤宜通而不通可怨又可思也樵徂焦反彼桑薪卬五綱反烘火東反于煁市林反維彼碩人實勞我心比也樵采也桑薪薪之善者也卬我烘燎也煁無釡之竈可燎而不可烹飪者也輯録疏無釜之竈其上燃火謂之烘本為此竈止以燃火照物若今火爐也桑薪宜以烹飪而但為燎燭以比嫡后之尊而反見卑賤也當以貴處我反以賤待我可怨又可思也鼓鐘于宫聲聞音問于外念子懆懆七到反視我邁邁比也懆懆憂貌邁邁不顧也鼓鐘于宫則聲聞于外矣增釋金履祥曰宫中鼓鐘聲必外聞宫中嫡庶之亂外人豈不知哉念子懆懆而反視我邁邁何哉情宜相通而不通如此可怨者也有鶖音秋在梁有鶴在林維彼碩人實勞我心比也鶖秃鶖也輯録埤雅曰鶖性貪惡俗呼秃鶖一名扶老狀如鶴而大長頸赤目其毛辟水毒頭髙八尺善與人鬭好啖蛇梁魚梁也蘇氏曰鶖鶴皆以魚為食然鶴之於鶖清濁則有間去聲矣今鶖在梁而鶴在林鶖則飽而鶴則飢矣幽王進褒姒而黜申后譬之養鶖而棄鶴也貴賤易置處非其宜可怨又可思也鴛鴦在梁戢其左翼之子無良二三其德比也戢其左翼言不失其常也輯録通釋曰戢其左翼以相依於內舒其右翼以防患於外此禽鳥匹偶並棲之常也良善也二三其德則鴛鴦之不如矣宜有常性乃爾無常可怨者也有扁步典反斯石履之卑兮之子之逺俾我疷都禮反叶喬移反兮比也扁卑貌俾使疷病也有扁然而卑之石則履之者亦卑矣如妾之賤則寵之者亦賤矣是以之子之逺而俾我疷也以貴從賤則貴者亦賤可怨又可思也白華八章章四句此詩首章及五章七章疑當作興而集傳例以為比更詳之白華緑衣同一怨也緑衣能思古人以自處白華則未有聞也誠使處之有道寧不能已申侯之亂乎然其専一之心則可取是以夫子録之增釋許氏曰全篇比體而四六八章正比餘皆仄比一章言物必相須為用今王不然而棄我二章言天澤必普及微物今王乃不圖其大者三章言小水潤澤尚能浸灌稻田有用之美物王之尊大反不能施澤於所當施四章言物之貴者用之輕位之尊者降而賤五章言有感則必冇應今念者固至而不見答六章言近惡而逺美七章言物皆常而王心無常八章言䙝於卑者身亦自卑也綿蠻黃鳥止于丘阿道之云逺我勞如何飲於鴆反之食音嗣之教之誨之命彼後車謂之載之比也綿蠻鳥聲阿曲何也後車副車也此微賤勞苦而思有所託者為鳥言以自比也蓋曰綿蠻之黃鳥此微賤之比也自言止于丘阿而不能前蓋道逺而勞甚矣此勞苦之云也當是時也有能飲之食之教之誨之又命後車以載之者乎此則思有所託之意也增釋吳師道曰大學引而云於止知其所止雖曰斷章取義而實可以說此詩蓋徼賤勞苦而思有所託者謂綿蠻之黃鳥則止于丘阿得其所當止之地矣我之道逺勞甚木知所止當是時有能飲之食之教之誨之而又命後車以載之者乎此則興也下章豈敢憚行畏不能趨即承上章道逺勞甚而言不能前不能極即未知所止之意綿蠻黃鳥止于丘隅豈敢憚行畏不能趨飲之食之教之誨之命彼後車謂之載之比也隅角輯録朱子曰丘隅岑鬱之處憚畏也趨疾行也綿蠻黃鳥止于丘側豈敢憚行畏不能極飲之食之教之誨之命彼後車謂之載之比也側傍極至也國語云齊朝駕則夕極于魯國綿蠻三章章八句感慨期望之意仄覆道之幡幡孚煩反瓠葉采之亨叶鋪郎反之君子有酒酌言嘗之賦也幡幡瓠葉貌此亦燕飲之詩言幡幡瓠葉采之亨之至薄也然君子有酒則亦以是酌而嘗之蓋述主人之謙詞言物雖薄而必與賓客共之也有它故反斯首炮白交反之燔音煩叶汾乾反之君子有酒酌言獻叶虛言反之賦也有斯首一也猶數上聲魚以尾也毛曰炮合其毛而炮之也加火曰燔亦薄物也獻獻之於賓也有斯首燔之炙音隻叶陟略反之君子有酒酌言酢才洛反之賦也炕音抗火曰炙謂以物貫之而舉於火上以炙之酢報也賓既卒爵而酌主人也有兔斯首燔之炮叶蒲候反之君子有酒酌言酬市周反之賦也酬導飲也輯録朱子曰主人酌以獻賓曰獻賓酢主人主人又自飲而復飲賓曰酬其主人又自飲者是導賓使飲也但賓受之却不飲奠於席前瓠葉四章章四句嘗之之云總言之也獻酢酬則以次而詳言之也四章皆物薄而意厚輯録陳定宇曰燕飲之禮在誠不在物此聊舉一二以見其微薄謙詞爾燕飲之詩有盛言其豐者魚麗是也有謙言其薄者此詩是也漸漸並士銜反下同之石維其髙矣山川悠逺維其勞矣武人東征不遑朝叶直髙反矣賦也漸漸髙峻之貌武人將帥也遑暇也言無朝旦之暇也將帥出征經厯險逺不堪勞苦而作此詩也輯録歐陽氏曰漸漸髙石悠逺山川序其所經厯險阻逺道之勞耳漸漸之石維其卒在律反矣山川悠逺曷其沒叶吳矣武人東征不遑出矣賦也卒崔嵬也謂山巔之末也曷何沒盡也言所登厯何時而可盡也不遑出謂但知深入不暇謀出也有豕白蹢音的蒸涉波矣月離于畢俾滂普郎反沱徒何反矣武人東征不遑他湯何反矣賦也蹢蹄蒸衆也離月所宿也畢星名豕涉波月離畢將雨之驗也輯録埤雅豕喜雨胡庭芳曰畢星好雨月水之精也張子曰豕之負塗曳泥其常性也今其足皆白衆與涉波而去水濯其足故白水患之多可知矣輯録此與上文將雨之驗意不同此言久役又逢大雨甚勞苦而不暇及他事也輯録嚴氏曰豕性負塗常時雖白蹢者亦汙今羣然涉水濯其塗而見白是久雨亭潦多故也亭潦尚多雨歇未久而月離畢則又將雨矣不遑它事惟雨是憂耳漸漸之石三章章六句一章則起兵在道而無休息之期二章則懸軍入險而無出險之計三章則以持戈執㦸之勞有沾體塗足之苦是以智慮廢而憂患専也苕音條之華音花藝音云其黃矣心之憂矣維其傷矣比也苕陵苕也本草云即今之紫葳蔓生附於喬木之上其華黃赤色亦名凌霄輯録藝者黃之盛也詩人自以身逢周室之衰如苕附物而生雖榮不久故以為比而自言其心之憂傷也苕之華其葉青青子零反知我如此不如無生叶桑經反比也青青盛貌然亦何能久哉牂子桑反羊墳扶云反首三星在罶音柳人可以食鮮息淺反可以飽叶袖苟反賦也牂羊牝羊也墳大也羊瘠則首大也罶笱也罶中無魚而水靜但見三星之光而已言饑饉之餘百物雕耗如此苟且得食足矣豈可望其飽哉苕之華三章章四句一章二章見國勢不可久三章見民命不可全陳氏曰此詩其詞簡其情哀周室將亡不可救矣詩人傷之而已何草不黃何日不行叶户即反何人不將經營四方興也草衰則黃將亦行也周室將亡征役不息行者苦之故作此詩言何草而不黃何日而不行何人而不將以經營於四方也哉何草不𤣥叶胡勻反何人不矜古頑反韓詩作鰥叶居陵反哀我征夫獨為匪民興也𤣥赤黑色也既黃而𤣥也無妻曰矜言從役過時而不得歸失其室家之樂也哀我征夫豈獨為非民哉首章則怨國之多事此章則怨已之無家匪兕徐履反匪虎率彼曠野叶上與反哀我征夫朝夕不暇叶後五反賦也率循曠空也言征夫非兕非虎何為使之循曠野而朝夕不得閒暇也上章則怨其上不以人待已此及下章則怨其上以禽獸待己有芃薄工反者狐與車叶率彼幽草有棧士板反之車行彼周道興也芃尾長貌棧車役車也孔氏曰周禮巾車云士乘棧車庶人乘役車此有棧是車之狀非士所乘之棧名也周道大道也言不得休息也芁然之狐在草莽中其性宜也棧車行道而不息豈其性之所欲哉義既反相因語又順相應也何草不黃四章章四句輔氏曰苕之華言國家之衰微時物之消耗人民不聊其生天運窮矣何草不黃見使役之繁殷生民之勞苦上之人視人如禽獸人事極矣國家至是無可為者此黍離之所以降為國風小序謂自菀栁至此其詩多似風體雅降為風其漸與都人士之什十篇四十三章二百句詩經疏義㑹通卷十五
