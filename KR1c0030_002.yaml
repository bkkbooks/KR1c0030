body:
  text: 詩經疏義㑹通元朱公遷撰圖說下竹為之以薦果核容四升木為之以薦葅醢容四升木為之以載牲體大房半體之爼足下有跗如堂房也瓦器以盛黍稷容斗二升方曰簠圓曰簋瓦器如豆以薦大羮徑尺八寸髙二尺四寸飲器受一升上兩柱取飲不盡之義戒其過也木爵玉爵同制爵也夏曰盞殷曰斚周曰爵孔氏曰斚畫禾稼酒器刻為雲雷之象金罍以金飾之孔氏曰天子玉諸侯金士梓畫牛於尊腹也或曰尊作牛形鑿其背以受酒也圜器禮器注壺大一石秬黑黍也欎欎金草鬯暢也釀秬黍為酒築鬱金草煮而和之使芬芳條暢酌而祼神也黃流在中鬱鬯也卣中尊孫炎云尊彛為上罍為下卣居中郭璞云卣受五升楅衡施於牛角所以止觸周禮云凡祭飾其牛牲設其楅衡韓奕介圭諸侯之封圭執之為贄以合瑞於王也曹氏曰周官典瑞五等諸侯各執其圭璧公執桓圭侯執信圭伯執躬圭子執穀璧男執蒲璧以朝覲宗遇㑹同于王雲漢圭璧禮神之玉也孔氏曰大宗伯以蒼璧禮天黃琮禮地青圭禮東方赤璋禮南方白琥禮西方𤣥璜禮北方圭璧其總稱也玉瓚圭瓚以圭為柄黃金為勺酌鬯以祼也王祼以圭瓚諸臣助之亞祼以璋瓚左右奉之半圭曰璋以為瓚柄祭統云君執圭瓚祼尸大宗執璋瓚亞祼琴瑟皆絲屬琴長三尺六寸五分五絃後加文武二絃嚴氏曰笙以匏為之十三管列匏中而施簧管端吹笙則鼓動其簧而發聲禮書云三十六簧大者十九簧小者十三簧雅瑟長八尺一寸廣一尺八寸二十五絃其常用者十九絃頌瑟長七尺二寸廣一尺八寸草五絃並用簫編小竹管為之王氏曰簫大者編二十三管長尺四寸小者十六管長尺二寸參差象風翼管六孔如笛併兩而吹之者也笛今之笛也籥如笛而六孔或曰三孔而短主中聲而上下之柷狀如漆桶以木為之中有椎連底撞令左右擊以起樂者圉狀如伏虎背上有二十七鉏鋙刻以木長尺櫟之以止樂者塤土為之大如鵝子鋭上平底似稱錘六孔箎以竹為之長尺四寸圍三寸七孔一孔上出徑三分凡八孔橫吹之塤箎其竅盡合則為黃鐘其竅盡開則為應鐘蓋相應和也鐘金屬鏞大鐘也磬石為之鼓革屬賁鼓大鼓也長八尺鼓四尺中圍加三之一田亦大鼓也懸鼓周制也夏后氏足鼓殷㨕鼓周懸鼓鞉如鼓小有柄兩耳持其柄搖之則傍耳還自擊何善伯注華黍下魯鼓薛鼓禮投壺篇鄭氏注魯鼓薛鼓其節不同半魯鼓半薛鼓此魯鼓薛鼓之節也貟者擊鼙方者擊鼓古者舉事鼓必有節聞其節則知其事矣取半以下為投壺禮盡用之為射禮又一說魯鼓半薛鼓半此二者記兩家之異故兼列之植木以懸鐘磬其橫者曰栒業有瞽篇孔氏曰植者為虡橫者為栒大板謂之業所以飾此栒而為崇牙刻之如鋸齒捷業然故曰業其形卷然可以懸鼓磬樹五采之羽以為文畫繒為翣載以璧樹翣於栒之角也鼎有牛羊豕三鼎皆以銅為之三足有鉉釡屬李解云上大下小曰􅑄孫炎曰甑者非有足曰錡無足曰釡瓦器可以節樂又飲器易尊酒簋二用缶又汲器左氏具綆缶升上徑二寸下徑六分其深八分千二百黍為籥十籥為合十合為升十升為斗筐筥皆竹器方曰筐圓曰筥兵車之輪六尺六寸田車之輪六尺三寸在輿之外輻三十以象日月也車前曲木上句衡者謂之輈亦曰轅禮記車制圖云輈長一丈四尺四寸亦曰轅通謂之輈轂在車輪之中外持輻內受軸長三尺二寸徑一尺元戎十乘以先啓行元大也戎戎車先軍之前鋒也元戎甲士三人同載左持戈右持矛中御戈殳㦸矛插於輢幟畫鳥隼之章小戎篇云小戎俴收五楘梁輈遊環脅驅隂靷鋈續文茵暢轂駕我騏馵又云四牡孔阜六轡在手龍盾之合鋈以觼軜俴駟孔羣厹矛鋈錞虎韔鏤膺交韔二弓古者三甲以革為之犀甲夀可百年兕甲夀二百年合甲夀三百年後世乃用金耳說文曰胄兜鍪也兜鍪首鎧也干楯也自關而東或謂之干或謂之楯關西謂之楯戈柲長六尺有六寸戈主於刺戚揚二者斧鉞之别名戚為斧揚為鉞鉞大斧小殳即祋也長丈二而無刃主於擊禮書作八觚形酋矛長二丈夷矛長二丈四尺敦弓天子之弓彤弓諸侯之弓長六尺六寸謂之上制六尺三寸謂之中制六尺謂之下制取幹角以膠漆筋絲為之虎韔以虎皮為弓室也交韔二弓交二弓於韔中也說文弓弩矢也象鏑括羽之形釋名云矢指也有所指而迅疾服盛矢器魚獸名其背皮斑文可為矢服侯張布而射之者也侯中之的曰正大射則張皮侯而設鵠賓射則張布侯而設正五正之侯中畫朱次白次蒼黃𤣥居外三正則損𤣥黃二正則畫朱緑鳥隼曰旟龜蛇為旐曲禮所謂前朱雀而後𤣥武也交龍為旗所謂左青龍也决著於右手左指所以鈎弦開體旄以牛尾注於旗干之首旌析翟羽設於旗干之首拾以皮為之著於左臂以遂弦鞞琫有珌鞞容刀之鞞今刀鞘也琫上飾珌下飾戎服也諸國世次圖商宋附契昭明相土昌若曹圉冥振微報丁報乙報丙主壬主癸湯外丙湯次子仲壬外丙弟太甲湯嫡孫沃丁大庚沃丁弟小甲雍已小甲弟太戊雍已弟仲丁外壬仲丁弟河亶甲外壬弟祖乙祖辛沃甲祖辛弟祖丁祖辛子南庚沃甲子陽甲祖丁子盤庚陽甲弟小辛盤庚弟小乙武丁祖庚祖甲祖庚弟廪辛庚丁廪辛弟武乙大丁帝乙紂宋微子啓紂庶兄微仲啓弟宋公稽丁公湣公丁子煬公湣弟厲公湣子釐公惠公哀公戴公武公宣公穆公宣弟殤公莊公穆子湣公公子遊羣公子桓公襄公成公昭公文公昭弟共公平公元公景公昭公元曾庶孫悼公休公辟公剔公偃周豳附后稷不窋鞠陶豳公劉慶節皇僕著弗毁隃公非髙圉亞圉公叔祖類岐周太王王季文王武王成王康王昭王穆王共王懿王孝王懿弟夷王懿子厲王宣王幽王平王桓王平孫莊王釐王惠王襄王頃王匡王定王匡弟簡王靈王景王悼王敬王元王貞定王哀王思王哀弟考王哀弟威烈王安王烈王顯王慎靚王赧王周公封魯侯爵周公伯禽考公煬公考弟幽公魏公幽弟厲公獻公厲弟真武真弟懿伯御懿弟孝惠隱桓隱弟莊閔僖閔庶兄文宣成襄昭定昭弟哀悼元穆共康景平傾召公封燕侯爵召公兒世至惠侯釐頃哀鄭繆宣桓莊襄宣昭武文懿惠悼共平簡獻孝成湣釐桓文易王子噲昭惠武成孝王喜邶鄘二國封爵世次未詳衛侯爵康叔康伯考伯嗣伯疌伯靖伯貞伯項伯釐侯共伯武公共弟莊桓宣桓弟惠黔牟羣公子懿戴公子頑子文戴弟成穆定獻殤定弟襄獻子靈出靈孫莊出父班師襄孫君起靈子悼出季父敬昭懷羣公子慎敬孫聲成平侯嗣君懷元君角鄭伯爵桓公武莊厲昭子亹昭弟子嬰亹弟文穆靈襄靈弟悼成悼弟釐簡定獻聲哀共聲弟幽繻幽弟齊侯爵太公丁公乙癸哀胡哀弟獻哀弟武厲文胡子成莊釐襄桓孝昭懿孝弟惠頃靈莊景莊弟安孺子悼景子簡平簡弟宣康魏畢公髙之後封爵世次未詳唐晉曲沃附侯爵唐叔晉燮武侯成侯厲靖釐獻穆殤穆弟文穆子昭孝鄂哀小子侯緡哀弟曲沃武公獻君卓惠卓兄懷文獻子襄靈成褒弟景厲悼襄曾孫平昭頃定出哀昭曽孫幽烈孝靜秦伯爵非子秦侯公伯秦仲莊公襄公文寧文孫出子武出子兄德公武弟宣成宣弟穆成弟康共桓景哀惠哀弟悼厲共躁懷躁弟靈懷孫簡靈季父惠出獻靈子孝惠文王武王昭襄武弟孝文莊襄始皇二世子嬰陳侯爵胡公申公相公申弟孝申子慎幽釐武夷平夷弟文桓厲桓弟莊厲弟宣莊弟穆共靈成哀惠哀孫懷湣檜祝融之后封爵世次未詳曹伯爵振鐸太伯仲君宫伯孝伯夷伯幽伯戴伯惠伯石甫繆公甫弟桓莊釐羣公子昭共文宣成武平悼聲悼弟隱平弟靖伯陽作詩時世圖商詩五篇太甲以後頌三篇那烈祖長發祖甲以後頌二篇𤣥鳥殷武周詩三百六篇文王世正風二十四篇周南關雎葛覃卷耳樛木螽斯麟之趾桃夭芣苡兔罝並周國詩漢廣汝墳並南國詩召南鵲巢采蘩草蟲采蘋甘棠行露羔羊殷其靁摽有梅小星江有汜野有死麕騶虞並南國詩武王世頌二篇時邁雍武王以後正風一篇召南何彼穠矣南國詩正小雅二十二篇鹿鳴四牡皇皇者華常棣伐木天保采薇出車杕杜南陔白華華黍魚麗由􅏤南有嘉魚崇丘南山有臺由儀蓼蕭湛露彤弓菁菁者莪成王世變風七篇豳七月鴟梟東山破斧伐柯九罭狼跋正大雅十八篇文王大明綿棫朴旱麓思齊皇矣靈臺下武文王有聲生民行葦既醉鳬鷖假樂篤公劉泂酌卷阿頌二十六篇清廟維天之命維清烈文天作我將思文臣工振鷺豐年有瞽潛載見有客武閔豫小子訪落敬之小毖載芟良耜絲衣酌桓賚般康王以後頌二篇昊天有成命噫嘻昭王以後頌一篇執競厲王世變大雅四篇民勞板蕩桑柔厲王以後變小雅十篇鴻鴈庭燎沔水鶴鳴祈父白駒黃鳥我行其野斯干無羊宣王世變風一篇鄘柏舟衛釐侯時變小雅五篇六月采芑車攻吉日黍苗變大雅六篇雲漢嵩髙蒸民韓奕江漢常武幽王世變小雅八篇節南山十月之交小辨何人斯巷伯白華苕之華何草不黃變大雅二篇瞻卬召旻幽王以後變風二篇衛淇奧武公時鄭緇衣桓公武公時變小雅正月雨無正賔之初筵衛武公詩平王世變風十一篇邶柏舟緑衣日月終風並衛莊公時衛碩人莊公時王黍離揚之水鄭叔于田唐揚之水晉昭公時大叔于田秦小戎襄公時變大雅抑衛武公詩平王以後變風十二篇王君子于役兔爰葛藟君子陽陽中谷有蓷丘中有麻采葛大車唐椒聊秦車鄰駟鐵終南桓王世變風六篇邶燕燕擊鼓並衛州吁時新臺二子乘舟式微旄丘並衛宣公時桓王以後變風三篇鄘牆有茨君子偕老鶉之奔奔並衛惠公時莊王世變風齊南山敝笱載驅猗嗟並襄公時釐王世變風一篇唐無衣曲沃武公時惠王世變風六篇鄘載馳衛戴公文公時定之方中蝃蝀相鼠干旄並衛文公時鄭清人文公時惠王以後魯頌四篇駉有駜泮水閟宮僖公時襄王世變風四篇衛河廣宋襄公時秦渭陽穆公時黃鳥康公時曹候人共公時匡王以後變風一篇陳株林靈公時時世未詳變風七十五篇邶凱風雄雉匏有苦葉谷風簡兮泉水北門靜女鄘桑中衛考槃氓竹干芄蘭伯兮有狐木瓜鄭將仲子羔裘遵大路女曰雞鳴有女同車山有扶蘇蘀兮狡童褰裳丰東門之墠風雨子襟揚之水出其東門野有蔓草溱洧齊雞鳴還著東方之日東方未明甫田盧令魏葛屨汾沮洳園有桃陟岵十畝之間伐檀碩鼠唐蟋蟀山有樞綢繆杕杜羔裘鴇羽有杕之杜葛生采苓秦蒹葭晨風無衣權輿陳宛丘東門之枌衡門東門之池東門之楊墓門防有鵲巢月出澤陂檜羔裘素冠隰有萇楚匪風曹蜉蝣鳲鳩下泉變小雅三十二篇小旻小宛巧言谷風蓼莪大東四月北山無將大車小明鼓鐘楚茨信南山甫田大田瞻彼洛矣裳裳者華桑扈鴛鴦頍辨車牽青蠅魚藻采菽角弓菀栁都人士采緑隰桑綿蠻瓠葉漸漸之石
