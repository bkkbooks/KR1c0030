body:
  text: 詩經疏義會通卷十一元朱公遷撰祈父之什二之四祈勤衣反父音甫豫王之爪牙叶五胡反胡轉豫于恤靡所止居賦也祈父司馬也職掌封圻之兵甲故以為號酒誥曰圻父薄違是也薄違者迫逐違命之人也輯録孔疏古者祈圻畿同字得通用父與甫通説文男子之美稱也亦謂尊之也豫六軍之士也輯録夏官司馬注王冇六軍六卿主之平居則為卿大夫有事則為將軍也詳見瞻彼洛矣或曰司右虎賁音奔之屬也輯録夏官司右上士二人下士四人胥八人徒八十人凡國勇力之士能用五兵者屬焉虎賁氏下大夫二人中士十有二人胥八十人虎士八百人掌先後王而趨以卒伍軍旅會同亦如之舍則守王間王在國則守王宫國有大故則守王門爪牙鳥獸所用以為威者也輯録孔疏曰鳥用爪獸用牙以防衛此人自謂王之爪牙以鳥獸為喻也恤憂也軍士怨於久役故呼祈父而告之曰豫乃王之爪牙汝何轉我於憂恤之地使我無所止居乎輯録鄭氏曰此責司馬之辭謂見使從軍也六軍之士出自六鄉法不取於王之爪牙之士張子曰禁衛天子之爪牙而使之逺戍所謂轉豫於恤也古人容易出一句便不可及詩人造理深其辭儘難學增釋許氏曰一説則爪牙二字為切而得詩意祈父豫王之爪士鉏里反胡轉豫于恤靡所底之履反止賦也爪士爪牙之士也底至也祈父亶不聰胡轉豫于恤有母之尸饔賦也亶誠尸主也饔熟食也言不得奉養而使母反主勞苦之事也東萊吕氏曰越勾踐伐吳有父母耆老而無昆弟者皆遣歸見國語吳語魏公子無忌救趙亦令平聲獨子無兄弟者歸養見史記夲傳則古者有親老而無兄弟其當免征役必有成法故責司馬之不聰其意謂此法人皆聞之汝獨不聞乎乃驅吾從戎使吾親不免薪水之勞也責司馬者不敢斥王也輯録通釋曰不斥王而責司馬此詩人之忠厚也亦若北山所謂大夫不均之意增釋鄱陽張氏曰斥者指斥之謂明白指其人其事而言之今不敢言王之過而責司馬故云不敢斥王也大雅文王篇傳言以戒王而不敢斥言猶所謂敢告僕夫云爾祈父三章章四句一章二章怨而責之三章怨而訴之輯録解頥曰先王之制諸侯有故則方伯連帥以諸侯之師討之王室有故則方伯連帥以諸侯之師救之司馬所掌封圻之兵甲不過衛王室而已此詩前二章責司馬不當以王之爪牙而逺從征役後一章責司馬不當以國之孤子而逺從征役使王而自棄其爪牙則謂之不智使司馬棄王之爪牙則謂之不忠至於使孤子無以為養則又謂之不仁一事而三失具焉其刺之也宜哉序以為刺宣王之詩説者又以為宣王三十九年戰于千畒輯録索隱曰地名在西河介休縣王師敗績于薑氏之戎見國語周語下太子諌靈王同輯録韋昭曰西夷别種四嶽之後也故軍士怨而作此詩東萊吕氏曰太子晉諫靈王之詞曰自我先王厲宣幽平而貪天禍至于今未弭宣王中興之主也至與幽厲並數色主反之其詞雖過觀是詩所刺則子晉之言豈無所自歟但今考之詩文未有以見其必為宣王耳下篇放此皎皎古了反白駒食我場苖縶陟立反之維之以永今朝所謂伊人於焉逍遙賦也皎皎潔白也駒馬之未壯者謂賢者所乘也輯録謝氏曰皎皎者潔白而可愛敬其人亦美其駒也場圃也縶絆音半其足維繫其靷音引也輯録在胸曰靷永久也伊人指賢者也逍遙遊息也輯録吕氏與曰徘徊少留之貌為此詩者以賢者之去而不可留也故託以其所乘之駒食我場苖而縶維之庶幾平聲以永今朝使其人得以於此逍遙而不去若後人留客而投其轄於井中也輯録漢書陳遵字孟公每大飲輒閉門取客車轄投井中雖冇急終不得去皎皎白駒食我場藿火郭反縶之維之以永今夕叶祥籥反所謂伊人於焉嘉客叶克各反賦也藿猶苖也輯録嚴氏曰藿豆葉用以作羹夕猶朝也嘉客猶逍遙也輯録謝氏曰賢者髙蹈逺引吾知其不可留矣猶欲縶維其白駒以強留之雖一朝一夕亦滿吾意好德之彛性尊賢之良心在人自不能泯也皎皎白駒賁彼義反又音奔然來牛云俱反思爾公爾侯叶洪孤反逸豫無期愼爾優遊叶汪胡反勉爾遁思叶新齎反賦也賁然光采之貌也輯録輔氏曰賁然來思猶今言光訪寵賁之意或以為來之疾也輯録朱子曰王氏讀為奔字言其來之速也思語詞也爾指乘駒之賢人也愼勿過也勉毋決也遁思猶言去意也言此乘白駒者若其肯來則以爾為公以爾為侯而逸樂無期矣猶言橫來大者王小者侯也史記田橫故齊王族自立為齊王戰敗入居海島漢髙帝遣使召之曰云云豈可以過於優遊決於遁思而終不我顧哉蓋愛之切而不知好爵之不足縻輯録縻繫也易中孚口我有好爵吾與爾縻之留之苦而不恤其志之不得遂也輯録通釋曰此章上四句見其愛之切末二句見其留之苦皎皎白駒在彼空谷生芻楚俱反一束其人如玉毋金玉爾音而有遐心賦也賢者必去而不可留矣於是歎其乘白駒入空谷束生芻以秣之而其人之德美如玉也是詩至此方言其德夫以卷懷去亂如此非明智勇決不能信乎其美如玉矣蓋已邈音莫逺也乎其不可親矣然猶冀其相聞而無絶也故語去聲之曰毋貴重爾之音聲而有逺我之心也輯録輔氏曰此章則賢者既去而好賢之誠終無已也夫見賢而好之固人之情也至於賢者已去而眷戀之情不已且祝其無貴重其音聲以有逺我之心焉夫然後見其好賢之誠也白駒四章章六句一章二章留之也三章告以留之之意也四章雖不可留而留之之心不可已也此與隰桑及唐風有枤之杜同枤杜欲留之而不可致白駒欲留之而不可留隰桑欲言之而不忍遽言之是皆在下位者之心也使上之人有是心焉則君子在位而三詩可無作矣黃鳥黃鳥無集于榖無啄陟角反我粟此邦之人不我肯穀言旋言歸復我邦族比也榖木名榖善輯録通釋曰此二榖字異義然據韻則一從木一從禾旋回復反也民適異國不得其所故作此詩託為呼其黃鳥而告之曰爾無集于榖而啄我之粟以黃鳥之啄粟比人之害己苟此邦之人不以善道相與則我亦不久於此而將歸矣黃鳥黃鳥無集于桑無啄我粱此邦之人不可與明叶謨郎反言旋言歸復我諸兄叶虛王反比也黃鳥黃鳥無集于栩况甫反無啄我黍此邦之人不可與處言旋言歸復我諸父扶雨反比也黃鳥三章章七句輔氏曰不我肯榖猶冀其以善道相與也不可與明猶冀其知人之休戚也不可與處則不安甚矣愚謂此詩始言邦族次言諸兄次言諸父困苦愈甚而思則愈親矣東萊吕氏曰宣王之末民有失所者意他國之可居也及其至彼則又不若故鄉焉故思而欲歸使民如此亦異於還定安集之時矣今按詩文未見其為宣王之世下篇亦然我行其野蔽必制反芾方味反其樗敕雩反昏姻之故言就爾居爾不我畜復我邦家叶古胡反賦也樗惡木也輯録莊子云大枝臃腫而不中繩墨小枝卷曲而不中規矩壻之父婦之父相謂曰婚姻輯録爾雅曰壻之父為姻婦之父為婚又曰婦之父母壻之父母相謂為婚姻畜飬也民適異國依其婚姻而不見收恤故作此詩言我行於野中依惡木以自蔽於是思昏姻之故而就爾居而爾不我畜也則將復我之邦家矣我行其野言采其蓫敕六反昏姻之故言就爾宿爾不我畜言歸思復賦也蓫牛蘈音頽惡菜也今人謂之羊蹄菜我行其野言采其葍音福叶筆力反不思舊姻求爾新特成論語作誠不以富亦秖音支以異叶才織反賦也葍葍浮去聲惡菜也特匹也言爾之不思舊姻而求新匹也雖實不以彼之富而厭我之貧亦秪以其新而異於故耳此詩人責人忠厚之意依惡木采惡菜困窮如此而婚姻不見收恤薄已甚矣雖不怨焉而不免有棄絶之意也我行其野三章章六句一章二章自決以義而其意確三章責人以恕而其意微王氏曰先王躬行仁義以道去聲民厚矣猶以為未也又建官置師以孝友睦姻任恤六行去聲下同教民為去聲下同其有父母也故教以孝為其有兄弟也故教以友為其有同姓也故教以睦為其有異姓也故教以姻為鄰里鄉黨相保相愛也故教以任宅舍有故柏受寄託出周禮地官大司徒輯録鄭氏注曰保猶任也相賙相救也故教以恤輯録大司徒之職令五家為比使之相保五比為閭使之相受四閭為族使之相葬五族為黨使之相救五黨為州使之相賙五州為鄉使之相賔以為如字徒教之或不率也故使官師以時書其德行而勸之輯録族師書其孝弟睦姻者閭胥書其任恤者以為徒勸之或不率也於是乎有不孝不睦不姻不弟去聲不任不恤之刑焉輯録不弟即不友也不言不友而言不弟言兄不友其弟則教之弟不恭厥兄則刑之使少者不敢陵長也賈氏曰上言友在睦姻之上專施於兄弟此變言弟退在睦姻之下兼施於師長方是時也安有如此詩所刺之民乎此詩正為不姻而作秩秩斯干叶居焉反幽幽南山叶所旃反如竹苞叶補苟反矣如松茂叶莫口反矣兄及弟矣式相好呼報反叶許厚反矣無相猶叶余久反矣賦也秩秩有序也斯此也干水涯也南山終南之山也苞叢生而固也猶謀也相謀相圗也相圗則異心矣人君繼世而立多與兄弟相疑忌故首以為祝此築室既成而燕飲以落之輯録雜記庚蔚云落謂與賔客燕會以酒食澆落之即歡樂之義也因歌其事言此室臨水而面山其下之固如竹之苞其上之密如松之茂此見宫室之美而宜其地輯録嚴氏曰宣王作室之地在秩秩然整齊之干岸面對悠悠然深逺之南山言地勢之壯也其盤基之厚如竹之叢生其結架之密如松之茂盛言宫室之美也又言居是室者兄弟相好而無相謀則頌禱之辭猶所謂聚國族於斯者也出記檀弓輯録陳氏曰聚國族燕集國賔聚會宗族也頌者美其事而祝其福禱者祈以免禍也輔氏曰言兄弟相好者恐與蓼蕭三章同意天子諸侯繼立多與兄弟相疑忌所以祝其相好而無相謀也歐陽氏曰古人成室而落之必有稱頌祝禱之言如晉獻文子成室張老曰美哉輪焉美哉奂焉歌於斯哭於斯聚國族於斯君子謂之善頌善禱者是矣張子曰猶似也人情大抵施之不報則輟故恩不能終兄弟之間各盡已之所宜施者無學其不相報而廢恩也輯録兄弟友愛盡其在我不可視報以為施兄友而弟不恭不可學弟而廢其友弟恭而兄不友不可學兄而廢其恭君臣父子朋友之間亦莫不用此道盡已而已愚按此於文義或未必然然意則善矣張子借其言以教人朱子引之非以此釋經也特廣説詩之法耳或曰猶當作尤尤怨也咎也似續妣必履反祖築室百堵西南其户胡五反爰居爰處爰笑爰語賦也似嗣也妣先於祖者協下韻爾或曰曽氏謂薑嫄后稷也似續妣祖言其繼世而為天子之宫猶曰繼其先業也西南其户天子之宫其室非一在東者西其户在北者南其户猶言南東其畝也此見其宫室之廣大爰於也居處笑語無不於斯言其家人之羣處而和輯也約之閣閣椓陟角反之槖槖音託風雨攸除直慮反鳥鼠攸去君子攸芋香于反叶王遇反賦也約束板也閣閣上下相乘也輯録嚴氏曰即所謂束板以載也椓築也槖槖杵聲也除亦去也無風雨鳥鼠之害言其上下四旁皆牢密也此發首章竹苞松茂之喻見其宫室之堅緻芋尊大也君子之所居以為尊且大也輯録濮氏曰此以下由外而內由垣墻而堂寢次第當然也如跂音企斯翼如矢斯棘如鳥斯革叶訖立反如翬音輝斯飛君子攸躋子西反賦也跂竦立也輯録孔氏曰如跂如人跂足直立翼敬也棘急也矢行緩則枉急則直也革變翬雉躋升也言其大勢嚴正如人之竦立而其恭翼翼也其亷隅整飾如矢之急而直也其棟宇峻起如鳥之警而革也其簷阿華采而軒翔如翬之飛而矯其翼也蓋其堂之美如此輯録言望其外而雄壯軒翥也而君子之所升以聽事也輯録李氏曰宣王之營宫室可謂得禮不失之侈亦不失之陋如所謂斯翼斯棘斯革斯飛等句不失之陋將以除風雨去鳥鼠則不失之侈矣易曰上古穴居而野處後世聖人易之以宫室以待風雨然則聖人作宫室之意惟欲待風雨而已殖殖市力反其庭有覺其楹噲噲音快其正叶音征噦噦呼會反其𡨕君子攸寧賦也殖殖平正也庭宫寢之前庭也覺髙大而直也卑小迂回則暗故以髙大而直訓覺楹柱也噲噲猶快快也明快之義正向明之處也噦噦深廣之貌𡨕奧窔音要之間也室東南隅為窔西南隅為奧奧窔之間深密之地也董氏曰正陽室𡨕隂室言其室之美如此輯録謂觀其內而髙明深廣也而君子之所休息以安身也以上三章皆言其身之所處者如此然三章總言其宫室之成爾四章則自外而觀其堂之勢五章則自內而觀其室之制也升於堂安於室則尊大之氣象可見而安寧之意可知矣下莞音官上簟叶徒檢徒錦二反乃安斯寢叶子檢子錦二反乃寢乃興乃占我夢叶彌登反吉夢維何維熊維羆彼宜反叶彼何反維虺維蛇市奢反叶于其士何二反賦也莞蒲席也竹葦曰簟羆似熊而長頭髙腳猛憨火含反厲也多力能拔樹輯録本草曰熊類犬豕而性輕健好攀緣上高木虺蛇屬細頸大頭色如文綬大者長七八尺祝其君安其室居夢兆而有祥亦頌禱之詞也此承上章君子攸寧而言下章放此大音泰人占之維熊維羆男子之祥維虺維蛇女子之祥賦也大人大卜之屬占夢之官也輯録通釋曰周禮大卜為卜筮官之長凡卜師卜人龜人華氏占人簭人占夢皆其官屬也華音水簭音室熊羆陽物在山強力壯毅男子之祥也虺蛇隂物穴處柔弱隱伏女子之祥也輯録金氏曰欲其生男女固祝願之詞而熊羆虺蛇之事又其設詞形容也或曰夢之有占何也曰人之精神與天地隂陽流通故晝之所為夜之所夢其善惡吉凶各以類至所為有邪正故所夢有善惡此吉凶之所由分也是以先王建官設屬周禮春官占夢中士二人史二人徒四人使之觀天地之會鄭氏曰天地之會建厭所處之日辰賈氏釋云建謂斗柄所建厭謂前日一次建謂陽建故左旋於天厭謂隂建故右旋於天然建厭所在嵗嵗不同假令正月陽建於寅隂建在戌日據幹辰據支愚按戌者正月之日前一次也蓋季冬日窮於次則在玄枵而為子明年正月在亥右旋逆數則戌為日前一次矣故建則自寅而卯而辰厭則自戌而酉而申其逆順周旋次第一定不易然今歷家以甲巳之嵗建丙寅乙庚之嵗建戊寅則建厭所處之日辰干支嵗嵗各不同也竊意賈説如此故附之厭一涉反辨隂陽之氣鄭氏曰隂陽之氣謂休王前後賈氏釋云凡五行值時者王生王者休王所生者相王所勝者死相所勝者囚如春則木王水休火相王死金囚也賈説如此而不釋前後二字竊意休前為囚王後為相休王前後豈兼休囚王相而言與已上夢時之月日觀建厭所在辨隂陽之氣以推吉凶也以日月星辰占六夢之吉凶鄭氏曰日月星辰謂日月之行及合辰所在也愚按賈氏釋文於此甚詳今以其説考之此蓋又推後來事應之日月也某年月日冇何夢則逆知某年月日有何應蓋彼時日月五星所行於十二辰次在某處其日支干與夢之日支干若何相配合事至此當驗也然其占夢之法則賈説亡之矣六夢一曰正夢無感而自夢也二曰噩夢三曰思夢因驚愕思念而夢也四曰寤夢因覺時道之而夢也五曰喜夢六曰懼夢則又因喜懼而成夢也增釋吳師道曰周禮占夢列子同林希逸謂噩與懼不同噩者夢中驚噩則夢者也懼者冇所憂懼而夢也周禮注無别獻吉夢贈惡夢獻者獻羣臣之吉夢而歸美於王贈者祭於四方而遣之以明逆新善而去故惡也已上皆周禮占夢文其於天人相與之際察之詳而敬之至矣夢惡則恐懼修省以祈悔禍於天夢吉則增益為善以祈永命於天詳以察之莫不致其敬之之心也故曰王前巫而後史卜筮瞽侑皆在左右巫主弔臨史書言動瞽辨聲樂侑贊威儀卜筮決疑斷事皆所以慎居處也王中句心無為也以守至正守君道之至正則所為皆善而夢皆吉夢矣自前巫後史以下語出禮運輯録真氏曰巫掌祀以鬼神之事告王史掌書以三皇五帝之事告王當卜筮者以吉凶諫王暮朦之叟以歌詩諫王一人之身而左右前後挾而維之以引以翼有孝有德雖欲斯須自放得乎故王中心他無所為惟守至正而已乃生男子載寢之牀載衣於既反之裳載弄之璋其泣喤喤華彭反叶胡光反朱芾音弗斯皇室家君王賦也半圭曰璋輯録見春官典瑞及冬官王人喤大聲也芾天子純朱諸侯黃朱輯録純朱黃朱明其色有深淺也吕東萊曰白虎通云茂者蔽也行以蔽前天子朱芾諸侯赤芾以韋為之上廣一尺下廣三尺皇猶喤喤也君諸侯也寢之於牀尊之也衣之以裳服之盛也增釋許氏曰初生之子未能勝衣襁褓而已今不獨衣之衣又必衣之裳者服之備也所以期其成人也故曰服之盛也弄之以璋尚其德也言男子之生於是室者皆將服朱芾煌煌然有室有家為君為王矣乃生女子載寢之地載衣之裼他訃反載弄之瓦叶魚位反無非無儀叶音義唯酒食是議無父母詒以反罹叶音麗賦也裼褓音保也瓦紡磚也輯録黃氏曰今所見紡無用磚者而瓦亦與磚為二物恐風俗古今不同爾嘗見湖州風俗婦人皆以麻線為業人各一瓦覆膝而索麻線於其上嵗久瓦率成坎古亦豈有此事而詩人因指之歟儀善罹憂也寢之於地卑之也衣之以褓即其用而無加也褓縛兒被也小兒初生所當必用者男子則加裳以飾之女子則不復加飾但即其所常用而已弄之以瓦習其所有事也女子以紡績為事有非非婦人也有善非婦人也蓋女子以順為正無非足矣有善則亦非其吉祥可願之事也觀哲婦傾城可見唯酒食是議而無遺去聲父母之憂則可矣易曰無攸遂在中饋貞吉輯録家人六二傳曰以隂柔之才而居柔不能治於家者也故無攸遂無所為而可也若為婦人之道則其正也婦人居中而主饋者也故曰中饋本義曰六二柔順中正女之正位乎內者也故其象占如此而孟子之母亦曰婦人之禮精五飯五飯未詳據月令以為天子春食麥夏食菽稷秋食麻冬食黍又引周禮疾醫掌飬民疾而曰以五穀注謂依月令五方之榖通于上下以此五榖為飯愚謂月令五飯乃天子所食恐非孟母所言之本意周禮五飯又未必如月令之説而考之於禮飯之品冇六黍稷稻粱白黍黃粱注云此諸侯之飯也天子又益苽與麥以此觀之則五飯云者止謂五榖之飯可也冪音密酒漿養去聲舅姑縫衣裳而已矣故有閨門之修而無境外之志出列女傳此之謂也斯干九章四章章七句五章章五句一章願其宜兄弟二章願其宜室家三章至五章願其處身尊顯而安寧六章至九章願其生男與女而皆賢且淑也輯録黃氏曰先言其基址壯厚而不拔兄弟之安居而不爭次則言其室家之制度居處之歡恱又次言垣墻之固棟宇之麗堂室之美末數章則願其男女之衆多子孫之蕃衍而禱頌之意盡矣輔氏曰禱頌之詞始於兄弟之和睦而終於兒女之賢善家道之成無踰此者也解頥曰首及夫兄弟者人之居室兄弟之好未易完也兄弟之相好而無相猶則非篤天倫之親者不能也果能篤於兄弟之好則宜爾室家樂爾妻孥和氣之益充大福之益集而子孫之繁衍基業之昌盛有不可勝言者矣此所以為善頌善禱歟舊説厲王既流于彘宫室圮部鄙反毁也壞輯録通釋曰厲王出居于彘凡十四年而後宣王立故疑其國都宫室之壞也故宣王即位更平聲作宫室既成而落之今亦未有以見其必為是時之詩也或曰儀禮下管新宫下管與升歌對蓋堂下之樂也出燕禮與大射儀輯録注云笙奏也又云吹蕩以播新宫之樂春秋傳宋元公賦新宫昭公二十五年恐即此詩然亦未有明證輯録輔氏曰若以儀禮之下管新宫當之則此詩非宣王之詩矣誰謂爾無羊三百維羣誰謂爾無牛九十其犉而純反爾羊來思其角濈濈莊立反爾牛來思其耳濕濕始立反賦也黃牛黑唇曰犉羊以三百為羣其羣不可數也牛之犉者九十非犉者尚多也輯録董氏曰三百維羣以羣訃也九十其犉以犉計也黑唇為犉則黑皆為牰黑耳為犚亦各以其數也皆音砌牰音袖犚音尉聚其角而息濈濈然呞音癡食已復出嚼之也而動其耳濕濕然王氏曰濈濈和也羊以善觸為患善多也故言其和謂聚而不相觸也濕濕潤澤也牛病則耳燥安則潤澤也輯録陸氏曰古之視牛者以耳祭義所謂大夫袒而毛牛尚耳此詩言牧事有成而牛羊衆多也孔氏曰周禮牧人掌牧六牲牛馬羊豕犬雞也大豕雞比牛羊為卑馬則祭之用者少故特舉牛羊愚謂雞豚狗彘之畜非牛羊匹也問國君之富數馬以對則馬又非牛羊可匹也特舉二者以此與或降于阿或飲于池叶唐何反或寢或訛爾牧來思何河可反蓑素多反何笠音立或負其餱音侯三十維物叶徵律反爾牲則具叶居律反賦也訛動何揭音竭擔也也蓑笠所以備雨三十維物齊其色而别之凡為色三十也言牛羊無驚畏輯録鄭氏曰降阿飲池或寢或訛者美其無所驚畏也而牧人持雨具齎飲食從其所適以順其性輯録此申言章首三句是以生養蕃息至於其色無所不備而於用無所不有也如祭四方之神而各用其方色之牲則五色各有所用色備如此隨用而足爾牧來思以薪以蒸之承反以雌以雄叶于陵反爾羊來思矜矜兢兢不騫不崩麾之以肱畢來既升賦也粗曰薪細曰蒸雌雄禽獸也矜矜兢兢堅強也堅強猶曰壯盛輯録釋文兢其氷反騫虧也崩羣疾也少損曰騫全壞曰崩不騫不崩猶言無損壞也羊有疾輒相汙故曰羣疾肱臂也既盡也升入牢也輯録牢防獸閩也言牧人有餘力則出取薪蒸摶禽獸其羊亦馴擾從人不假箠楚輯録擾音饒馴擾皆順也箠主水反䇿也但以手麾之使來則畢來使升則既升也輔氏曰羊躁而難制牛順而易馴羊馴如此牛可知矣輯録解頥曰末二句見人識物情物解人意而無事乎奔走追逐之勞也增釋許氏曰首章言牛羊此章獨言羊者蓋牛服耒乘車動知人意是牛易於馴者羊負狠好鬪難於馴擾今但麾之以肱則畢來既升其馴可知矣故首章亦言其濈濈而和於牛則惟曰濕濕也羊且能馴則牛之馴不言自見矣或曰二章乃獨言牛爾此章唯言羊也牧人乃夢衆維魚矣旐音兆維旟音餘矣大人占之衆維魚矣實維豐年叶尼因反旐維旟矣室家溱溱側巾反賦也占夢之説未詳溱溱衆也或曰衆謂人也旐郊野所建統人少旟州里所建統人多輯録春官司常州里建旟縣鄙建旐夏官大司馬郊野載旐蓋人不如魚之多旐所統不如旟所統之衆故夢人乃是魚則為豐年旐乃是旟則為人衆牧人之性渾厚質朴日用飲食而已故雖卑賤而其夢可占衆維魚旐維旟皆以少變多之象也夢中變化之祥如此則天下富庶之兆可推蓋因牧事冇成而設為頌禱之詞也牛羊衆多已為可喜民人富庶又大可願而至可喜故廣其意以祝之然豐年之占若難曉豈以人殖五榖而又用五榖人多如魚則五榖之蕃盛可見邪增釋許氏曰此章傳謂占夢之説未詳豈古者卜筮之家冇是説與詩記此牧成而考之之詩故設以吉祥之事終焉則亦豐年民乃間樂故以田以魚夢魚斯豐年之祥也旐者旟者田官所建旐統人少旟統人多今建旐之處乃建旟則民庶衆矣無羊四章章八句首言畜産遂其生次言祭祀足於用繼言其強盛馴擾之可喜終則因致稱願之詞節音截下同彼南山維石巖巖赫赫師尹民具爾瞻叶側䘖反憂心如惔徒藍反不敢戲談國既卒子律反斬叶側亍反何用不監古反興也節髙峻貌巖巖積石貌赫赫顯盛貌師尹大音泰師尹氏也大師三公尹氏蓋吉甫之後春秋書尹氏卒公羊子以為譏世卿者即此也隱公三年世卿者父死子繼也輯録李氏曰春秋後又書尹氏立王子朝則尹氏之為世卿其來甚久具俱瞻視惔燔卒終斬絶監視也此詩家父音甫所作刺王用尹氏以致亂言節彼南山則維石巖巖矣赫赫師尹則民具爾瞻矣輔氏曰此以南山之高峻興師尹之尊崇而其所為不善使人憂心如火燔灼又畏其威而不敢言也然則國既終斬絶矣汝何用而不察哉何用不監一語所以起下章之不平也輯録何用不察察則有以知其不平矣輔氏曰憂心如惔憂之甚也不敢戲談畏其威也戲談猶且不敢而况敢正言其失直指其非乎然國既終將斬絶矣汝何用而不察哉蓋事已至此而在家父則又有不得而不言者也節彼南山有實其猗於宜反叶於何反赫赫師尹不平謂何天方薦徂殿反瘥才何反喪息浪反亂𢎞多民言無嘉叶居何反憯七感反莫懲嗟叶遭哥反興也有實其猗未詳其義傳曰實滿猗長也箋云猗倚也言草木滿其旁倚之畎谷也或以為草木之實猗猗然皆不甚通此句難通則起興之意亦難曉不輯録輔氏曰先生以為諸説皆甚通者蓋與不平之意不相似耳然鄭氏之意大鑿而或者之説似可通故蘇氏亦云草木山之實也山之生物平均如一凡草木之生於上者無不猗猗其長也如此則與不平之意相近矣今存以備一説薦荐通重直用反也瘥病𢎞大喪亂𢎞多疊上文薦瘥而言也􅉃曽懲創也節然南山則有實其猗矣赫赫師尹而不平其心則謂之何哉不平謂何乃一篇之大要以下數章皆自此推之蘇氏曰為政者不平其心則下之榮瘁勞佚有大相絶者矣是以神怒而重之以喪去聲亂神怒即天怒也人怨而謗讟徒谷反其上然尹氏曽不懲創咨嗟求所以自改也輯録輔氏曰是則所謂安危利災而樂其所以亡者其亦不仁甚矣尹氏大音泰師維周之氐丁禮反叶都黎反秉國之均四方是維天子是毗婢伊反俾民不迷不弔昊天不宜空我師叶霜夷反賦也氐本均平維持毗輔弔愍空窮師衆也輯録吕東萊曰空我師如空其國空其地之類蓋曰人之類將滅矣甚言之也言尹氏大師維周之氐輯録王氏曰京師以大族為氐朝廷以尊官為氐氐者安危存亡所出也尹氏大族也大師尊官也而秉國之均政主乎平故曰均則是宜有以維持四方毗輔天子而使民不迷曉然知所勸懲而無疑惑也乃其職也今乃不平其心而既不見愍弔於昊天矣不曰國政而曰國均則非平其心者不能秉平其心則天佑之矣尹氏之心不平所以不為天所恤也則不宜久在其位使天降禍亂而我衆并及空窮也不平之禍及於國者必如此弗躬弗親庶民弗信叶斯人反弗問弗仕鉏里反下同勿罔君子叶奬里反式夷式已無小人殆叶養里反瑣瑣素火反姻亞則無膴音武仕賦也仕事罔欺也君子指王也夷平已止輯録王氏曰已廢退也孟子所謂士師不能治士則已之與此已同義殆危也瑣瑣小貌壻之父曰姻兩壻相謂曰亞輯録孔疏言每一人娶姊一人娶妹相亞次也膴厚也輯録箋云無厚任用之言王委政於尹氏尹氏又委政於姻婭之小人而以其未嘗問未嘗事者欺其君也凡事必咨訪而後明必更練而後熱苟未能然而欲妄試之則是欺其君耳故戒之曰汝之弗躬弗親庶民已不信矣其所弗問弗事則豈可以罔君子哉民已不可欺况可欺其君乎當平其心視所任之人有不當者則已之無以小人之故而至於危殆其國也瑣瑣姻婭而必皆膴仕則小人進矣任用小人皆不平之心為之而所當改者也故以式夷式已告之輯録輔氏曰小人而濫居要職躐處髙位其智識既不能以照察幾微其才力又不能以綜理事務則其勢必至於分委姻婭之人以任政而小人因得以並進矣鑿空妄説誕慢相欺必至於以其未嘗問未嘗仕者欺其君而政荒事廢召禍致災無所不至當是之時是宜反躬自責而私欲昏蔽迷惑不反不至於危殆其國家則不已者此小人之常態也若能平其心視所任之人冇不當者則已之瑣瑣姻婭悉皆屏去而無使汙縉紳而盜名器焉則何至於危殆其國家也哉昊天不傭敕龍反降此鞠九六反訩音凶昊天不惠降此大戾君子如屆音戒叶居例反俾民心闋古穴反叶苦桂反君子如夷惡烏路反怒是違賦也傭均鞠窮訩亂戾乖屆至惡字對傭字屆字對夷字訓義雖不同皆主均平之意也闋息違逺也言昊天不均而降此窮極之亂昊天不順而降此乖戾之變鞠凶大戾即二章天怒人怨之事也不平之禍至於如此然所以靖之者亦在夫音扶人而已君子無所苟而用其至則必躬必親而民之亂心息矣君子無所偏而平其心則式夷式已而民之惡怒逺矣民無怨丄之心若其逺去爾平其心則其效如此傷王與尹氏之不能也夫為政不平以召禍亂者人也而詩人以為天實為之者蓋無所歸咎而歸之天也增釋許氏曰詩謂鞠凶大戻匪降自天皆尹氏為之也民罹其害無可奈何而歸之於天也在民視之則難在王視之則易進賢而退姦為國之至理而二者之情狀惟平其心者見之王如幡然用其賢則尹氏必不居位而民之怨息矣王如坦然平其心則尹氏自不能逃其罪而民惡怒逺矣夫何難哉抑有以見君臣隱諱之義焉有以見天人合一之理焉後皆放此輯録輔氏曰初言天而後止言人者天人一理人心説則天意解矣先生發明有以見君臣隱諱之義有以見天人合一之理之説先儒所不及施之變雅刺詩皆可通也不弔昊天叶鐵因反亂靡有定叶唐丁反式月斯生叶桑經反俾民不寧憂心如酲誰秉國成不自為政叶諸盈反卒勞百姓叶桑經反賦也酒病曰酲成平卒終也蘇氏曰天不之恤故亂未有所止而禍患與嵗月增長上聲君子憂之曰誰秉國成者乃不自為政而以付之姻婭之小人其卒使民為去聲之受其勞斃以至此也不曰國政而曰國成亦非平其心者不能秉也此與三章相似亦與四章相應駕彼四牡四牡項領我瞻四方蹙蹙子六反靡所騁戚領反賦也項大也輯録馬頸大則其肥壯可知蹙蹙縮小之貌言駕四牡而四牡項領可以騁矣欲去亂也而視四方則皆昏亂蹙蹙然無可往之所亦將何所騁哉輯録嚴氏曰家父駕此四牡可以騁矣然視四方蹙蹙然縮小無可馳騁之地是以留而不去蓋世亂則若見天地之狹矣東萊吕氏曰本根病則枝葉皆瘁是以無可往之地也天下之亂如此皆秉國成者之罪也方茂爾惡相息亮反爾矛矣既夷既懌如相酬市由反矣賦也茂盛相視懌恱也言方盛其惡以相加則視其矛戟如欲戰鬭及既夷平恱懌則相與歡然如賔主而相酬酢不以為怪也蓋小人之性無常而習於鬭亂其喜怒之不可期如此是以君子無所適而可也蹙蹙靡所騁者此故也導民以惡倡民以亂非尹氏而何哉昊天不平我王不寧不懲其心覆芳服反怨其正叶諸盈反賦也尹氏之不平若天使之故曰昊天不平若是則我王亦不得寧矣然尹氏猶不自懲創其心乃反怨人之正已者則其為惡何時而已哉小人不責己而責人如此輯録吕東萊曰篇將終矣復嘆曰昊天其使尹氏不平乎我王其不得安寧乎今尹氏不懲創其惡覆怨正人之攻己者家父音甫作誦叶侯容反以究王訩式訛爾心以畜許六反萬邦叶卜工反賦也家氏父字周大夫也究窮訛化畜養也家父自言作為此誦輯録誦歌誦也以窮究王政昏亂之所由冀其改心易慮以畜養萬邦也因其心之不懲也故告以訛爾心訛爾心則不平者可平矣陳氏曰尹氏厲威使人不得戲談而家父作詩乃復自表其出於已以身當尹氏之怒而不辭者蓋家父周之世臣義與國俱存亡故也東萊吕氏曰篇終矣故窮其亂本而歸之王心焉致亂者雖尹氏而用尹氏者則王心之蔽也輯録輔氏曰東萊謂篇終矣故窮其亂本而歸之王心焉此説當矣故直至此章方説箇王字蓋言至此則王亦不得不任其責前章雖嘗譏尹氏之用小人而不及王然王之所以用尹氏者亦不能逃其責矣李氏曰孟子曰人不足與適音謫也政不足與間去聲也惟大人為能格君心之非蓋用人之失政事之過雖皆君之非然不必先論也惟格君心之非則政事無不善矣用人皆得其當矣節南山十章六章章八句四章章四句此詩十章以不平謂何為主一章居髙肆惡而國家禍患不知省二章謀邪作辟而天人禍謫不知懲三章昧於所事致上天絶已而不知退四章怠於所事以私黨宰國而不知已五章天雖云變而尚可消其變六章天益生亂而不肯止其亂七章則君子避亂無所八章則小人習亂成俗九章言天禍我王尹氏則怙惡而嫉善十章又歸本於王欲其改惡而為善也增釋許氏曰此詩刺王用尹氏前九章惟極言尹氏之罪而卒章以一言歸之王心則輕重本末自見此家父之善於辭也其所以刺尹氏者大要有二事為政不平而委任小人也一章言尹氏之失民望而致愁蹙二章言為政不平而不顧天怒民怨三章言大師為國根本為政當均平而其任之重如此四章言任用小人連引私黨五章言君子可消天變六章承上言尹氏不但不能弭天變抑且生禍亂下四句則應前第四章而又起下章欲遁逃之意七章言欲遁無所往八章言小人情狀九章言尹氏自用拒諫十章歸之於王也序以此為幽王之詩而春秋桓十五年有家父來求車輯録桓公八年家父來聘十五年家父乘求車於周為桓王之世上距幽王之終已七十五年不知其人之同異大抵序之時世皆不足信今姑闕焉可也正音政月繁霜我心憂傷民之訛言亦孔之將念我獨兮憂心京京叶居良反哀我小心癙音鼠憂以癢音羊賦也正月夏之四月謂之正月者以純陽用事為正陽之月也繁多訛偽將大也京京亦大也癙憂幽憂也癢病也此詩亦大夫所作言霜降失節不以其時增釋四月純陽也霜隂也非其時降故謂之失節既使我心憂傷矣而造為姦偽之言以惑羣聼者又方甚大上之人有以縱之也輯録董氏曰霜降非時災降于上也訛言非常禍起于下也上下如此則國亡無日矣然衆人莫以為憂故我獨憂之以至於病也輯録輔氏曰正月而繁霜則災之降於天者甚矣訛言而孔將則亂之起於人者深矣天災人禍雜然並見而當時君臣上下恬然不以為憂是皆所謂安其危而利其災者也惟作此詩之大夫獨以為憂故曰念我獨兮憂心京京乂曰自哀我之憂所以如是大者政緣其小心畏慎是以幽憂而至於病也解頥曰京京言所憂者大則非止於一節也癙憂言所憂之獨則有以異於衆人也父母生我胡俾我愈音庾不自我先不自我後叶下五反好言自口叶孔五反下同莠餘久反言自口憂心愈愈是以有侮賦也愈病自從莠醜也輯録王氏曰莠惡也榖謂之善則莠惡可知愈愈益甚之意疾痛故呼父母而傷已適丁是時也訛言之人虛偽反覆言之好醜皆不出於心而但出於口輯録輔氏曰此重言訛言之害也夫言心聲也言出於心則有根源合義理是以我之憂心益甚而反見侵侮也輯録輔氏曰夫君子之處亂世彼以為是而已以為非彼以為樂而已以為憂動與衆違此所以反見侵侮也憂心惸惸其營反念我無祿民之無辜并必政反其臣僕哀我人斯于何從祿瞻烏爰止于誰之屋賦也惸惸憂意也無祿猶言不幸爾辜罪并俱也古者以罪人為臣僕亡國所虜亦以為臣僕箕子所謂商其淪喪去聲我罔為臣僕是也言不幸而遭國之將亡與此無罪之民將俱被囚虜而同為臣僕輯録輔氏曰民指在下之民人則并上下而言之未知將復從何人而受祿如視烏之飛不知其將止於誰之屋也輯録解順曰念我無祿傷已之不幸也并其臣僕傷斯民之俱不幸也于何從祿未知其所從之人也此哀國之將亡而無所定之詞也瞻彼中林侯薪侯蒸之丞反民今方殆視天夢夢莫工反叶莫登反既克有定靡人弗勝音升有皇上帝伊誰云憎興也中林林中也侯維殆危也夢夢不明也皇大也上帝天之神也程子曰以其形體謂之天以其主宰謂之帝言瞻彼中林則維薪維蒸分明可見也民今方危殆疾痛號平聲訴於天而視天反夢夢然若無意於分别必列反善惡者人之視物小大甚明而天之於人善惡乃無别此以人之冇見興天之無知亦反其意以為興也然此特值其未定之時爾及其既定則未有不為天所勝者也夫天豈有所憎而禍之乎福善禍淫亦自然之理而已申包胥曰人衆則勝天天定亦能勝人輯録史記吳兵入郢伍子胥求昭王不得掘楚平王墓鞭尸三百申包胥使人謂之曰子之報讎其已甚乎吾間云云疑出於此謂山蓋卑為岡為陵民之訛言寧莫之懲召彼故老訊音信之占夢叶莫登反具曰豫聖誰知烏之雌雄叶胡陵反賦也山脊曰岡廣平曰陵懲止也故老舊臣也訊問也占夢官名掌占夢者也具俱也烏之雌雄相似而難辨者也謂山蓋卑而其實則岡陵之崇也輯録謝氏曰山為岡為陵人皆知山之髙矣訛言者乃謂山為卑今民之訛言如此矣而王猶安然莫之止也前責讒人矣至此乃以縱讒責其上及其詢之故老訊之占夢則又皆自以為聖人亦誰能别必列反其言之是非乎輯録輔氏曰故老舊臣可以決事理之是非者也占夢之官可以決徵兆吉凶者也今也不平心據實而言但皆自以為聖人而已耳誰能别其言之果是果非乎子思言於衛侯曰君之國事將日非矣公曰何故對曰有由然焉君出言自以為是而卿大夫莫敢矯其非輯録正曲曰矯卿大夫出言亦自以為是而士庶人莫敢矯其非君臣既自賢矣而羣下同聲賢之賢之則順而有福矯之則逆而有禍如此則善安從生詩曰具曰豫聖誰知烏之雌雄抑亦似君之君臣乎君臣皆好訛言如此况望其能止讒乎謂天蓋髙不敢不局叶居亦反謂地蓋厚不敢不蹐井亦反維號音豪斯言有倫有脊哀今之人胡為虺吁鬼反蜴星歷反賦也局曲也蹐纍足也號長言之也脊理蜴螈音原也虺蜴皆毒螫音釋之蟲也輯録爾雅蠑螈蜥蜴注小而青者曰蜥蜴言遭世之亂天雖高而不敢不局地雖厚而不敢不蹐卷曲而立身之僂也纍足而行步之狹也其所號呼而為此言者又皆有倫理而可考也哀今之人胡為肆毒以害人而使之至此乎指讒人輯録輔氏曰所謂此者即上所言局蹐而不敢自安者也謝氏曰身在天地間如無所容則人之害人者為虺為蜴世道亦可哀矣瞻彼阪音反田有菀音鬱其特天之扤五忽反我如不我克彼求我則如不我得執我仇仇亦不我力興也阪田崎嶇墝音敲埆音殼之處輯録崎嶇山險也墝埆瘠薄也菀茂盛之貌特特生之苖也扤動也輯録胡氏曰扤有齟齬頓挫之意力謂用力瞻彼阪田猶有菀然之特而天之扤我如恐其不我克何哉地力雖至薄且能生物天心夲至仁乃不愛人皆理之難明者也故以為興亦無所歸咎之詞也夫始而求之以為法則惟恐不我得也及其得之則又執我堅固如仇讎然然終亦莫能用也求之甚艱而棄之甚易去聲其無常如此求之如此執之如此則不可退用之如此則不可進是其扤我之甚也輯録鄭氏曰言有貪賢之召無用賢之實心之憂矣如或結之今兹之正胡為厲叶力桀反矣燎力詔反之方揚寧或滅之赫赫宗周褒姒音似滅呼恱反之賦也正政也厲暴惡也火田為燎揚盛也宗周鎬京也褒姒幽王之嬖妾褒國女姒姓也輯録朱子曰褒人有罪入此女以贖罪是為褒姒幽王為廢申后及太子而立以為后滅亦滅也言我心之憂如結者為去聲國政之暴惡故也政由褒姒是以暴惡燎之方盛之時則寧有能撲而滅之者乎然赫赫然之宗周而一褒姒足以滅之火盛難滅國盛易亡女禍之可畏如此增釋心憂如結而憂不可解者以國政之暴也火燎于田寧或滅之以勢之方盛也然盛大之宗周一女色之禍而致危亡蓋可傷也已其有國者可不戒哉蓋傷之也時宗周未滅以褒姒淫妬讒諂而王惑之知其必滅周也輯録歐陽氏曰此上七章皆𫐠王信訛言亂政至此始言滅周主於褒姒者謂王溺女色而致昏惑推其禍亂之夲以歸罪也或曰此東遷後詩也時宗周已滅矣其言褒姒滅之有監戒之意而無憂懼之情似亦道已然之事而非慮其將然之詞今亦未能必其然否也終其永懷又窘永隕反隂雨其車既載寸再反乃棄爾輔叶扶雨反載如字輸爾載才再反將七羊反伯助豫叶演女反比也隂雨則泥濘寧去聲而車易去聲以陷也載車所載也輔如今人縳杖於輻以防輔車也輯録孔疏輔是可解脫之物輸墮音隳壞也也將請也伯或者之字也蘇氏曰王為淫虐譬如行險而不知止君子永思其終知其必有大難去聲故曰終其永懷又窘隂雨王又不虞難之將至而棄賢臣焉輯録虞度也防也故曰乃棄爾輔君子求助於未危故難不至苟其載之既墮而後號伯以助豫則無及矣輯録號召也呼也呼增釋喻乎時棄賢不用國危而後求之助則已晚矣無棄爾輔貟音云于爾輻方六反叶筆力反屢顧爾僕不輸爾載叶節力反終踰絶險曽是不意叶乙力反比也貟益也輔所以益輻也屢數音朔顧視也僕將車者也此承上章言若能無棄爾輔以益其輻而又數數顧視其僕則不墮爾所載而踰於絶險若初不以為意者蓋能謹其初則厥終無難也輯録解頥曰輻以固轂輔以益輻僕以將車三者皆備然後可以不墮所載苟始之不謹則終之敗也必矣一説王曽不以是為意乎魚在于沼之紹反叶音灼亦匪克樂音洛潛雖伏矣亦孔之照音灼憂心慘慘七感反當作懆七各反念國之為虐比也沼池也照明易見也魚在于沼其為生已蹙矣其濳雖深然亦照然而易見言禍亂之及無所逃也輯録嚴氏曰君子不專一身之安危其憂心慘慘愁蹙者唯念國政之虐而民罹其害耳彼有旨酒又有嘉殽户交反無韻未詳洽比毗志反其鄰昏姻孔云念我獨兮憂心殷殷賦也洽比皆合也云旋也云訓旋周旋也殷殷然痛也言小人得志指讒人輩有旨酒嘉殽以合比其鄰里怡懌其昏姻而我獨憂心至於疾痛也輯録解頥曰旨酒嘉殽以合比其鄰里怡懌其昏姻惟優遊無事者能之若憂亂畏禍之人則其家之不能恤而何以合比其鄰里其身之不能保而何以怡懌其昏姻此君子之憂所以至於疾痛而自嘆小人之不如也昔人有言燕雀處堂母子相安自以為樂也突決棟焚而怡然不知禍之將及出孔叢子論勢篇輯録突竈突囱也決破壞也其此之謂乎輯録李氏曰國勢如此而小人徒乃羣居飲酒以相樂殆燕雀之類也佌佌音此彼有屋䔩䔩音速方有榖民今之無祿天夭於遙反是椓陟角反叶都木反哿哥我反矣富人哀此惸獨賦也佌佌小貌䔩䔩窶音巨陋貌指王所用之小人也榖祿夭禍椓害哿可獨單也佌佌然之小人既有屋矣蔌蔌窶陋者又將有榖矣亦指讒人輩而民今獨無祿者是天禍椓喪之耳亦無所歸咎之詞也亂至於此富人猶或可勝平聲惸獨甚矣輯録胡庭芳曰前章念我獨兮憂心殷殷若唯及其私矣此章哿矣富人哀此惸獨其不忘天下之情如此解頥曰富者優於財而裕於力惸獨者罷於力而傷於財此孟子所以言文王發政施仁必先鰥寡孤獨也正月十三章八章章八句五章章六句一章言讒人不畏天變二章言讒人反侮正人三章則民將俘虜而已同其禍也四章言天未肯分别善惡五章言人莫與辨是非六章言已方畏懼而人肆其毒也七章言國家不用賢人八章言女禍能覆宗國詞意憤厲至此極矣九章十章則復説棄賢之意十一章則復説畏禍之意十二章十三章則復説縱讒人之意十月之交朔日辛卯叶莫後反日有食之亦孔之醜彼月而微此日而微今此下民亦孔之哀叶於希反賦也十月以夏正言之建亥之月也交日月交會謂晦朔之間也歷法周天三百六十五度四分度之一輯録陳師凱曰三百六十五度之外其餘分於一度之中當四分之一如以一度分作九百四十分當得二百三十五分也左旋於地輯録陳師凱曰坐北面南則東為左西為右天運降於西升於東故為左旋一晝一夜則其行一周而又過一度輯録陳師凱曰天運一日夜轉一匝三百六十五度四分度之一之外又攙進一度也黃存齋以天運日月皆從角一度起為凖謂天行一周因日右行退了一度故每日須進一度然後日出是為天過一度以其過處分為天之一度日月皆右行於天一晝一夜則日行一度月行十三度十九分度之七日行一度月行十三度十九分度之七則日不及月十三度十九分度之七十九分度之七以十分計之則三分七釐弱也輯録陳師凱曰如以一度為九百四十分而以十九除之則每分該四十九分四釐七毫三絲六忽八微以七乘之該三百四十六分三釐一毫五絲七忽六微以十九乘為全度該九百三十九分九釐九毫九絲九忽二微虧八微故日一歲而一周天約計三百六十五日零三時輯録此即三百六十五度二百三十五分也月二十九日有竒居宜反而一周天約計二十九日六時零三刻輯録竒即九百四十分日之四百九十九也陳師凱曰以一日十二時除九百四十則一時該七十八分三分分之一此云四百九十九者是六時零二十九分也又逐及於日而與之會一歲凡十二會輯録許氏曰日月之説與蔡氏書傳説異蓋蔡夲儒家之言而詩傳則以歷法退數算之夲孔疏之説故上文首以歷法冠之陳懼齋曰月行常以二十七日千一十六分日之三百二十七而與天會二十九日九百四十分日之四百九十九而與日會日一年與天一會月一年與天十三會與日十二會其與天會者無所用故古今少道之其説又與集傳二十九日有竒周天而與日會不同方會則月光都盡而為晦已晦則月光復蘇而為朔輯録以月及日光盡體伏謂之晦晦而復蘇明於是乎生焉謂之朔朔後晦前各十五日日月相對則月光正滿而為望輯録渾儀説曰月行甚逺而與日對相去百八十二度六十二分有竒謂衡分天之中為望望在十五日其常也或進在十四日或退在十六日其變也晦朔而日月之合東西同度南北同道道者日月所行之道也度者三百六十五度四分度之一之度也日月之行冇先後則一東一西各在一度至此而東西相會同其度矣日月所行相去常六度則一南一北各有其道也至此而南北相交同其道矣尋常之合只是同度同度而又同道則縱橫相合最親切者也則月掩日而日為之食天體外旋日月內轉月又在日之內高下相去亦六度故日為月所掩而食輯録語録曰天有黃赤二道沈存中云非天實有之特歷家設色以記日月之行耳夫日之所由謂之黃道史家又謂月有九行黑道二出黃道北赤道二出黃道南白道二出黃道西青道二出黃道東并黃道而九孔氏曰月行之道與日道相近交路而過半在日道之裏半在日道之表其當交則兩道相合交去極逺處兩道相去六度又曰歷家為交食之法大率以百七十三日有竒為限望而日月之對同度同道尋常之對只是同度同度而又同道則縱橫相對最親切者也則月亢苦浪反日而月為之食亢當也日為火火體光散在外而內則暗月為水水體外暗而內則受光日月相對大親切則月正當日之內暗處故月無所受之光而月食是皆有常度矣然王者修德行政用賢去上聲姦能使陽盛足以勝隂隂衰不能侵陽則日月之行雖或當食而月常避日故其遲速髙下必有參初簮反差義宜反而不正相合不正相對者所以當食而不食也此又天人相與感應之理而數有不足言者也按月避日者由陽氣壯盛隂氣不敢犯之自然退縮如水見焦釜其流自緩也才少退縮即彼此相差而同度必不同道同道必不同度也若國無政不用善使臣子背音佩君父妾婦乘陵也其夫小人陵君子夷狄侵中國則隂盛陽微當食必食輯録交而食陽微而隂乘之也交而不食陽盛而隂不能掩也此則係乎人事所感雖曰行有常度而實為非常之變矣以數言之則其常以理言之則其變矣輯録黃祥翁曰杜預云日月動物雖行度有大量不能不小有盈縮故雖有交會而不食者或冇頻交而食者然日月同度同道之際行有分數則食亦有分數也若以常度論之一歲兩交當兩食而春秋二百四十二年日食三十六唐二百九十年食百餘者此所謂雖交而不食或頻交而食者也在乎人君行事之所感召耳蘇氏曰日食天變之大者也然正陽之月古尤忌之夏之四月為純陽故謂之正月十月純隂疑其無陽故謂之陽月純陽而食陽弱之甚也純隂而食隂壯之甚也輯録孔甚醜惡也微虧也彼月則宜有時而虧矣此日不宜虧而今亦虧是亂亡之兆也輯録蘇氏曰天變既見君子知國之將亡國亡則民首被其患是以哀之也李氏曰唐志云十月之交以歷推之在幽王之六年日月告凶不用其行叶户郎反四國無政不用其良彼月而食則維其常此日而食于何不臧賦也行道也凡日月之食皆有常度矣而以為不用其行者月不避日失其道也然其所以然者則以四國無政不用善人故也增釋許氏曰此言日食因不用善人婦也臣也小人也皆隂類也相與蠱王心而敗政事故謫見于天也如此則日月之食皆非常矣而以月食為其常日食為不臧者隂亢陽而不勝猶可言也輯録輔氏曰望時月所以蝕固是隂敢與陽亢後如此然歷家又謂之暗虛陽而掩之不可言也故春秋日食必書輯録隱公一桓公二莊公四僖公三文公二宣公三成公二襄公九昭公七定公三凡三十冇六而月食則無紀記也焉亦以此爾增釋許氏曰日月告凶證不由其道謂月掩日也四方無政事而不用其善謂暴亂又作也因天變而修人事則可以轉災為祥今天變既如彼人事又如此郭林宗所謂夜觀乾象畫察人事天之所廢不可支也此主言口食而云日月告凶者謂月侵於日而食也日月之食皆為變然以陽侵隂猶為常事以隂侵陽何其不善也燁燁丁輒反震電不寧不令叶虛經反百川沸騰山冡崒祖恤反崩髙岸為谷深谷為陵哀今之人胡憯七感反莫懲賦也燁燁電光貌震雷也寧安徐也令善輯録前漢李尋傳注曰雷電失序不安不善沸出騰乘也山頂曰冡崒崔嵬也髙岸崩陷故為谷深谷填塞故為陵􅉃曽也言非但日食而已十月而雷電山崩水溢亦災異之甚者是宜恐懼修省悉井反改紀理也其政而幽王曽莫之懲也輯録謝氏曰災異如此幽王之心曽不懲創詩人不指幽王而曰哀今之人微而婉也嚴氏曰十月雷電天道乖矣川沸山崩陵谷遷變地道亂矣胡為莫懲創也董子曰國家將有失道之敗而天乃先出災異以譴告之不知自省又出怪異以警懼之尚不知變而傷敗乃至此見天心仁愛人君而欲止其亂也由董子之言觀之則當上天災異譴告之時正人君恐懼修省之日使幽王於此能懲之則亂可止矣朱子引之以證詩人願望其君之意已上二章言災變之不一如此皇父音甫卿士畨維司徒家伯冢宰仲允膳夫棸側留反子內史蹶俱衛反維趣七走反馬叶滿補反楀音矩維師氏豔餘膽反妻煽音扇方處賦也皇父家伯仲允皆字也畨棸蹶楀皆氏也輯録孔氏曰父及伯仲是字之義畨棸蹶楀單言又棸子以子配之若曽子閔子然故知皆氏卿士六卿之外更為都官以總六官之事也或曰卿士蓋卿之士周禮大宰之屬有上中下士見天官冢宰輯録周禮太宰卿一人宰夫上士八人中士十六人下士三十二人公羊所謂宰士隱公元年天王使宰咺來歸仲子之賵公羊氏曰宰咺宰士也賵豐去聲左氏所謂周公以蔡仲為已卿士是也定公四年蓋以宰屬而兼總六官位卑而權重也證以常武首章則前説為是輯録許氏曰常武之皇父是卿士兼太師也太師三公之首而卿士兼之則非太宰之屬明矣常武皇父賢者也故詳著其官而又本其祖蓋非十月之皇父矣然足以證卿士或説之未然司徒掌邦教冢宰掌邦治皆卿也輯録天官太宰卿一人地官大司徒卿一人膳夫上士掌王之飲食音嗣膳羞者也輯録天官膳夫上士二人鄭氏曰食飯也飲酒漿也膳牲肉也羞有滋味者內史中大夫掌爵祿廢置殺生豫音與奪之法者也輯録春官內史中大夫一人掌王八柄之法趣馬中士掌王馬之政者也輯録夏官屬孔疏下士集傳從鄭箋師氏亦中大夫掌司朝音潮得失之事者也輯録地官屬居虎門之左司王朝掌國中失之事注王視朝則居其左以司察之中中禮者失失禮者杜子春云中當為得記君之得失也美色曰豔豔妻即褒姒也煽熾也輯録王氏曰言其勢盛若火之煽然方處方居其所未變徙也言所以致變異者由小人用事於外而嬖妾蠱惑王心於內以為之主故也此章即不用其良一句而詳言之蓋推原災變之故而歸之賈禍者但是詩專為皇父所困而作故先數之以為罪之魁也輯録李氏曰此上三章言災異之事下五章言災異之由由所用非人也故斥外所用之人又責其內寵言所以致之之由也抑此皇父豈曰不時胡為我作不即我謀叶謨悲反徹我牆屋田卒汙音烏萊叶陵之反曰豫不戕在良反禮則然矣叶於姬反賦也抑發語詞時農隙之時也作動即就卒盡也汙停水也萊草穢也輯録孔氏曰汙者記曰汙其宫而豬焉是也萊者楚茨云田萊多荒是也戕害也言皇父不自以為不時欲動我以徙而不與我謀乃遽徹我牆屋使我田不獲治卑者汙而髙者萊又曰非我戕汝乃下供上役之常禮耳輯録彭氏曰三代之君不敢鄙夷其民以從已之欲每有興作謀及庶民如盤庚遷殷登進厥民而告之三代世守此道故詩人曰胡為我作不即我謀孔氏曰皇父以親寵封於圻內築都邑令邑人居之役之不以其時先毁墻屋而後令遷邑人廢其家業故述其情如此王氏曰此章專言皇父專恣而害及于民也解頥曰豈曰不時言其任智而自是也不即我謀言其挾勢而妄作也徹我墻屋則無以安其身田卒汙萊則無以食其力如是而猶曰非我戕汝乃禮之當然也夫下供上役固禮之常也然豈有作大事動大衆而不通衆志不盡下情者哉皇父孔聖作都于向式亮反下同擇三有事亶侯多藏才浪反不憗魚覲反遺一老俾守我王叶于放反擇有車馬以居徂向賦也孔甚也聖通明也輯録王氏曰皇父自謂甚聖故因而譏之曰孔聖也都大邑也周禮畿內大都方百里小都方五十里皆天子公卿所封也向地名在東都畿內今孟州河陽縣是也輯録孟州即今懷慶府孟縣𨽻河南三有事三卿也輯録孔氏曰皇父封圻內當二卿今立三卿以比列國也亶信侯維藏蓄也憗者心不欲而自強上聲之詞有車馬者亦富民也徂往也言皇父自以為聖而作都則不求賢而但取富人以為卿又不自強留一人以衛天子但有車馬者則悉與俱往不忠於上而但知貪利以自私也上章言皇父役以非時而戕其民此章言皇父動以私事而棄其君使下不義事上不忠國之賊也黽民允反勉從事不敢告勞無罪無辜讒口囂囂五刀反下民之孽魚列反匪降自天叶鐵因反噂子損反沓徒合反背蒲昧反憎職競由人賦也囂衆多貌孽災害也噂聚也輯録説文聚語也沓重平聲復也職主競力也言黽勉從皇父之役未嘗敢告勞也猶且無罪而遭讒輯録蘇氏曰無罪而且見讒而况敢告勞乎然下民之孽非天之所為也噂噂沓沓多言以相説恱同而背則相憎專力為此者皆由讒口之人耳已雖黽勉以從皇父之役而猶不免讒則禍非天降實小人所為爾深怨之也悠悠我里亦孔之痗莫背反叶呼洧反四方有羡徐面反我獨居憂民莫不逸我獨不敢休天命不徹叶直質反我不敢效我友自逸賦也悠悠憂也里居痗病羡餘逸樂徹均也當是之時天下病矣而獨憂我里之甚病且以為四方皆有餘而我獨憂衆人皆得逸豫而我獨勞者以皇父病之而被禍尤甚故也然此乃天命之不均吾豈敢不安於所遇而必效我友之自逸哉上章言匪降自天則知禍所從來矣而處禍患猶以命則無可奈何而安之之詞也蓋詩人之忠厚如此十月之交八章章八句前三章俱言災變四章歷數致災召變之人五章六章專責皇父七章八章言已遭皇父之害而歸之於命也正月繁霜十月日食天變屢見此二詩相承之意也增釋許氏曰詩人謂天災地變之交見內有褒姒之邪嬖外有皇父之貪殘牽引惡類相為表裏褒姒禍之夲皇父罪之魁以致流離破壞無所安處故作是詩以刺之浩浩昊天不駿其德降喪息浪反飢饉其靳反斬伐四國叶于逼反旻密巾反天疾威弗慮弗圖舍音赦彼有罪既伏其辜若此無罪淪胥以鋪普烏反賦也浩浩廣大貌昊亦廣大之意輯録王氏曰浩浩廣大流通之意元氣廣大曰昊天駿大德惠也輯録傳喪喪亂榖不熟曰飢𬞞不熟曰饉疾威猶暴虐也慮圖皆謀也舍置輯録謝氏曰舍彼有罪處彼有罪者伏其辜心服而甘受其罪也淪陷胥相鋪遍也此時飢饉之後羣臣離散其不去者作詩以責去者故推本而言昊天不大其惠降此飢饉而殺伐四國之人如何昊天曽不思慮圖謀而遽為此乎輯録此篇不訓旻字小旻不訓疾威字可以互見謝氏曰仁覆閔下者旻天也今乃疾威如此豈不為斯民之慮乎豈不為斯民之謀乎通釋曰以昊天言不駿其德以旻天言疾威各以義類而歸怨之耳彼有罪而飢死則是既伏其辜矣舍之可也此無罪者亦相與而陷於死亡則如之何哉有罪而伏辜者殺之猶未巳無罪之人又且不免焉此號天而兾免之詞也周宗既滅靡所止戾正大夫離居莫知我勩夷世反三事大夫莫肯夙夜叶弋灼反邦君諸侯莫肯朝夕叶祥籥反庶曰式臧覆芳服反出為惡賦也宗族姓也戾定也正長上聲也周官八職一曰正謂六官之長皆上大夫也出天官宰夫一曰正二曰師三曰司四曰旅五曰府六曰史七曰胥八曰徒離居蓋以飢饉散去而因以避讒譛之禍也我不去者自我也勩勞也三事三公也輯録董氏曰陳壽翁云如漢魏以來史之位登三事皆指為三公大夫六卿及中下大夫也輯録夙夜夙興夜寐朝見曰朝暮見曰夕臧善覆反也言將有易姓之禍其兆已見音現而天變人離又如此上章言天變此章言人離輯録范氏曰靡所止戾未知天之所命民之所定也莫肯夙夜無在公之節也莫肯朝夕無尊王之禮也庶幾曰王改而為善乃覆出為惡而不悛且緣反改也也輯録李氏曰時王上為天所怒下為民所怨內則宗族破滅外則羣臣諸侯携二孤立而不懼此所謂安其危而利其災樂其所以亡者解頥曰此章言天之變既如彼人之離又如此則敗亡之兆即此而可見矣庶幾王改而為善乃覆出而為惡則天意豈可得而回人心豈可得而挽哉或曰疑此亦東遷後詩也輯録通釋曰詩言周宗既滅似亦道已然之事而非慮其將然之辭似果作於東遷之後也如何昊天叶鐵因反下同辟言不信叶斯人反如彼行邁則靡所臻凡百君子各敬爾身胡不相畏不畏于天賦也如何昊天呼天而訴之也辟法臻至也凡百君子指羣臣也言如何乎昊天也法度之言而不聽信則如彼行往而無所底至也然凡百君子豈可以王之為惡而不敬其身哉不敬爾身不相畏也輯録相畏畏人也不相畏不畏天也此詩以敬身為主所謂敬身者謹恪以盡臣道不使其身流於放肆是也能敬其身則能敬人而敬天矣羣臣以王不聽法言而去之逸樂之計得矣而於敬身之道何有此章始因責王而遂責散去之人也輯録蘇氏曰君子呼天而告之曰奈何哉法度之言王終莫肯信者如人恣行而忘反我不知其所至矣輔氏曰常人之情無特操者見王所為如此則皆從風而靡故戒之曰凡百君子各敬爾身豈可因王之為惡而遽自放逸以棄其身哉詩人發此意至為深切學者不可不深醴而力行也戎成不退叶吐類反下同飢成不遂曽在登反我􅉏思列反御憯憯于感反日瘁徂醉反凡百君子莫肯用訊叶息悴反聽言則答譖言則退賦也戎兵遂進也易曰不能退不能遂是也大壯上六􅉏御近侍也國語曰居寢有􅉏御之針輯録通釋曰楚語􅉏作褻注云近也蓋如漢侍中之官也入侍天子故曰侍中憯憯憂貌瘁病訊告也言兵冦已成而王之為惡不退飢饉已成而王之遷善不遂輯録解頥曰兵已成矣而為惡不退則人離而冦亂將益進矣飢已成矣而遷善不遂則天怒而飢饉將益甚矣使我􅉏御之臣憂之而慘慘日瘁也凡百君子莫肯以是告王者雖王有問而欲聽其言則亦答之而已不敢盡言也一有譖言及已則皆退而離居莫肯夙夜朝夕於王矣其意若曰王雖不善而君臣之義豈可以若是恝苦八反無憂貌乎王雖不可輔也然已不忍去爾羣臣乃畏禍而去之其於敬身之義何在乎此章雖有責王之詞而所以責去者益切矣二章言莫知我勩此章言憯憯日瘁見􅉏御者之能敬其身如此輯録輔氏曰聽言則答譛言則退則皆不敬其身者聽言則答靣從者也譛言則退畏罪者也靣從者不盡其情畏罪者惟知冇已皆不能敬也通釋曰四章言王為不善而羣臣無忠告也哀哉不能言匪舌是出人遂反維躬是瘁哿矣能言巧言如流俾躬處休賦也出出之也瘁病哿可也言之忠者當世之所謂不能言者也故非但出諸口而適以瘁其躬出者用力以出之也用力以出其言則其言甚艱正與巧言如流者相反對佞人之言當世所謂能言者也故巧好其言如水之流無所凝滯而使其身處於安樂音洛之地蓋亂世昏主惡去聲忠直而好去聲諛佞類如此詩人所以深歎之也棄忠用佞如此若可去矣然去則非敬身也維曰于仕鉏里反孔棘且殆叶養里反云不可使得罪于天子叶奬里反亦云可使怨及朋友叶羽已反賦也于往棘急殆危也蘇氏曰人皆曰往仕耳曽不知仕之急且危也當是之時直道者王之所謂不可使不可使直而拙也而枉道者王之所謂可使也直道者得罪于君而枉道者見怨于友此仕之所以艱也仕之難也如此若可去矣然去則非敬身也此二章憂時感時而責散去者之意在言外也輯録輔氏曰直道而盡言者則得罪於其君巧言以徇人者則見怨於其友以是言之則當時之仕又豈易為哉忠言獲罪而巧言處休直道見抑而枉道見容皆亂世之常事也嚴氏曰六章言亂世進退皆冇咎也從道則違時從時則違道寧得罪於天子不可得罪於公議也謂爾遷于王都曰豫未有室家叶古胡反鼠思息嗣反泣血叶虛屈反無言不疾昔爾出居誰從作爾室賦也爾指離居者鼠思猶言癙憂也輯録吕叔與曰癙憂幽憂也與鼠思義同當是時言之難能而仕之多患如此輯録通釋曰此承上文五章六章而言也故羣臣有去者有居者居者不忍王之無臣已之無徒則告去者使復還于王都去者不聽而托於無家以拒之至於憂思泣血輯録憂思而至於泣血憂之極矣孔氏曰人淚必因悲聲而出若血出則不由聲也今無聲而涕出如血之出故曰泣血有無言而不痛疾者蓋其懼禍之深至於如此然所謂無家者則非其情也故詰契吉反之曰昔爾之去也誰為去聲爾作室者而今以是辭我哉我告爾以反居王所而爾以無家辭言之痛切若可念者然昔之去也亦無家則今豈真為無家之故哉不知敬身而謀自逸爾可責也此章正責散去者雨無正七章二章章十句二章章八句三章章六句首章述災禍而告諸天二章陳亂離而責其王三章四章既責天子而復責散去之人五章六章雖道時事而實責散去之人七章則又詰之以情而正責之也增釋許氏曰首章言昊天降災雖曰賦而實如比雖曰飢饉而終篇大意皆刺王之不德也然忠厚惻怛之意正已勸人之言前後屢見作詩者蓋􅉏御之賢者也歐陽公曰古之人於詩多不命題而篇名往往無義例其或有命名者則必述詩之意如巷伯常武之類是也今雨無正之名據序所言與詩絶異當闕其所疑元城劉氏曰嘗讀韓詩有雨無極篇序云雨無極正大夫刺幽王也至其詩之文則比毛詩篇首多雨無其極傷我稼穡八字愚按劉説似有理然第一二章夲皆十句今遽增之則長短不齊非詩之例又此詩實正大夫離居之後􅉏御之臣所作其曰正大夫刺幽王者亦非是且其為幽王詩亦未有所考也輯録通釋曰詩文四章言曽我􅉏御慘慘日瘁固可見其作於􅉏御之臣矣但二章首言周宗既滅繼言正大夫離居卒章又言謂爾遷于王都曰豫未有室家似是束遷之際羣臣懼禍者因以離居不復隨王同遷于東都故見於詩詞如此而文侯之命亦曰即我御事罔或耆夀俊在厥服則其驗也參考正月所謂赫赫宗周褒姒滅之及節南山國既卒斬何用不監等語疑此三詩猶皆為東周之變雅其後雅亡於上而國風作於下於是春秋託始於隱公實為平王之四十九年也祈父之什十篇六十四章四百二十六句詩經疏義會通卷十一
