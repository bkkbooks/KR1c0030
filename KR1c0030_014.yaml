body:
  text: 詩經疏義會通卷十二元朱公遷撰小旻之什旻天疾威敷于下土謀猶回遹音聿何日斯沮在舉反謀臧不從不臧覆用叶于封反我視謀猶亦孔之卭其凶反賦也旻幽逺之意敷布猶謀回邪遹僻沮止臧善覆又卭病也大夫以王惑於邪謀不能斷丁貫反以從善而作此詩言旻天之疾威布于下土使王之謀猶邪僻無日而止謀之善者則不從而其不善者反用之故我視其謀猶亦甚病也違善從惡所以為邪僻之謀而視之使人甚病也慶源輔氏曰邪亂之世庸暗之君謀猶邪僻無日而沮止者故無所歸咎而歸之天也潝潝許急反訿訿音紫亦孔之哀叶於希反謀之其臧則具是違謀之不臧則具是依我視謀猶伊于胡底之履反叶都黎反賦也潝潝相和去聲也訿訿相詆也靣相和而背相詆也具俱底至也言小人同而不和其慮深矣陽與而隂排之深為自全之計也輯録謝氏曰習俗如此亦甚可哀然於謀之善者則違之其不善者則從之輯録此即謀臧不從不臧覆用也亦何能有所定乎以上二章言其惑於邪謀如此蓋無聽言之明而用捨不當也然上章專責其君此章并責其臣我龜既厭不我告猶叶于救反謀夫孔多是用不集韓詩作就叶疾救反發言盈庭誰敢執其咎叶巨又反如匪行邁謀是用不得于道叶徒候反賦也集成也卜筮數音朔則瀆而龜厭之故不復告其所圖之吉凶增釋易曰再三瀆瀆則不告謂求筮之意煩數不能誠一則瀆慢矣故不告也謀夫衆則是非相奪而莫適音嫡所從輯録輔氏曰洪範云謀及卜筮夫謀貴乎博故謀及卿士謀及庶民蓋彼之所以謀不過盡衆人之情而主之者則一人而已而此之所謂謀夫則是各主其謀也故所謀終亦不成蓋發言盈庭各是其是無肯任其責而決之者猶不行不邁而坐謀所適謀之雖審而亦何得於道路哉輯録孔氏曰謀而不行則於道不進言而無決則於事不成哀哉為猶匪先民是程匪大猶是經維邇言是聽叶平聲維邇言是爭叶側陘反如彼築室于道謀是用不潰于成賦也先民古之聖賢也程法猶道輯録通釋曰詩中猷猶字通用故前章猶訓謀此訓道而徽猷與秩秩大猷又皆作猷亦訓道經常潰遂也言哀哉今之為謀不以先民為法不以大道為常其所聽而爭者皆淺末之言以是相持如將築室而與行道之人謀之人人得為異論其能有成也哉古語曰作舍道邊三年不成輯録東漢博士曹褒請著漢禮班固以為宜廣集諸儒共議得失章帝曰諺言云云會禮之家名為聚訟互生疑異筆不得下昔堯作大章一夔足矣蓋出於此以上二章言其不能斷以從善又如此蓋無聽言之明而用捨不決也國雖靡止或聖或否方九反叶捕美反民雖靡膴火吳反或哲或謀叶莫徒反或肅或艾音乂如彼泉流無淪胥以敗叶蒲寐反賦也止定也聖通明也膴大也多也艾與乂同洽也淪陷胥相也言國論雖不定然有聖者焉有否者焉或聖或否言是非明著可見也民雖不多然有哲者焉有謀者焉有肅者焉有艾者焉但王不用善則雖有善者不能自存將如泉流之不反而淪胥以至於敗矣能别聖否則不惑邪謀矣能用哲謀肅艾則是斷以從善矣不然則邪謀之致敗也必矣聖哲謀肅艾即洪範五事之德聖人之德五者咸備此則人各有其一德耳豈作此詩者亦傳箕子之學也與五事之德各一其德也但此章既以聖否對言然後詳數哲謀肅艾則聖之一德足以兼乎四者矣又通而智則謀無不審嚴而治則謀無不定故聖哲居謀之前肅艾居謀之後詩意蓋以謀為主故其序亦與書不同也書之序肅艾哲謀聖蓋以五行為序耳輯録蔡氏傳曰貌言視聽思五事之序恭從明聰睿五事之德肅艾哲謀聖五德之用與集傳亦不同不敢暴虎不敢馮皮冰反河人知其一莫知其他湯河反戰戰兢兢如臨深淵叶一均反如履薄冰賦也徒搏曰暴徒涉曰馮如馮几然也戰戰恐也兢兢戒也如臨深淵恐墜也如履薄冰恐陷也衆人之慮不能及逺暴虎馮河之患近而易見則知避之喪國亡家之禍隱於無形則不知以為憂也故曰戰戰兢兢如臨深淵如履薄冰懼及其禍之詞也惟其惑之而不知不斷之為害也故詩人危之如此上章以其不明不決而憂禍不可救此章以其不明不決而恐禍不可避也小旻六章三章章八句三章章七句增釋許氏曰一章言君邪僻不用善謀而用不臧二章言臣阿比共違善謀而從不臧一章之謀猶君之謀猶也二章之謀猶臣之謀猶也一章謀臧之謀指臣之謀二章謀之之謀指衆人之謀也三章又言臣無有任責而決衆謀四章又言君臣不法古而無逺慮五章言天下未嘗無才但不能用之則望望而去六章言為國者當於事未形者戒謹恐懼以終之蘇氏曰小旻小宛小辨小明四詩皆以小名篇所以别必列反其為小雅也其在小雅者謂之小故其在大雅者謂之召旻大明獨宛辨闕焉意者孔子刪之矣雖去上聲其大而其小者猶謂之小蓋即用其舊也宛於阮反彼鳴鳩翰胡旦反飛戾天叶鐵因反我心憂傷念昔先人明發不寐有懷二人興也宛小貌鳴鳩班鳩也輯録陸氏曰似鵓鳩項有繡文翰羽戾至也明發謂將旦而光明開發也二人父母也此大夫遭時之亂而兄弟相戒以免禍之詩故言彼宛然之小鳥亦翰飛而至于天矣則我心之憂傷豈能不念昔之先人哉鳴鳩雖小而戾天努力然也父母之賢雖不可及亦努力追及之爾此皆勉強以求其至者物既皆然人不可以不然也故以起興是以明發不寐而有懷乎父母也不寐有懷正可以見努力追及之意前二句興後四句也言此以為相戒之端不及其親則遭禍而辱其親矣是以念欲及之而有懷甚切也增釋許氏曰此章宛彼鳴鳩本不能髙舉今乃能飛戾于天矣以興人皆可學而進其德也父母之賢晝夜思以效之人之齊聖飲酒溫克彼昏不知一醉日富叶筆力反各敬爾儀天命不又叶夷益反賦也齊肅也聖通明也克勝也富猶甚也又復扶乂反也言齊聖之人雖醉猶溫恭自持以勝輯録解頤曰整肅者必不以酒而喪儀通明者必不以酒而敗德此所以能溫恭自持以勝也所謂不為酒困也彼昏然而不知者則一於醉而日甚矣輯録一專也專務酣飲也於是言各敬謹爾之威儀此篇以敬威儀為主溫克能敬者也昏而不能敬者也一善一惡可以為勸戒矣天命已去將不復來不可以不恐懼也敬則天命在我矣時王以酒敗德臣下化之故此兄弟相戒首以為説輯録輔氏曰昏亂於酒則必自喪其威儀故相戒各自敬謹我身之威儀天命不又蓋言不可恃天之常如此會有禍亂生也人能敬我身之威儀則能敬天矣天豈在外哉此義精矣中原有菽音叔庶民采叶此禮反之螟音冥蛉音零有子蜾音果螺力果反負叶蒲美反之教誨爾子式榖似叶養里反之興也中原原中也菽大豆也螟蛉桑上小青蟲也似步屈蜾螺土蜂也似蜂而小腰取桑蟲負之於木空上聲中七日而化為其子輯録釋文曰蜾螺即細腰蜂本草注雖名土蜂不就土中為窟謂褳土作房耳細腰物無雌皆取青蟲教祝變成已子嘗拆窠而視之亦生子如半粟米大所負蟲却在子下褳音璉祝音咒式用榖善也中原有菽則庶民采之矣言民皆可采也以興善道人皆可行也螟蛉有子則蜾螺負之以興不似者可教而似也教誨爾子則用善而似之可也似之者使之似已也此章既以其可公共之理為興又以其可變化之理為興善也似也終上文兩句所興而言也榖所以終乎菽之興似所以終負螟蛉之興戒之以不惟獨善其身又當教其子使為善也教其子使為善亦敬威儀而已輯録解頤曰善其身所以繼先人也教其子所以繼吾身也物之在外也猶可采而有之况性善本吾身之所冇乎物之不似也猶可負而化之况子之性亦吾之性乃其本似者乎為此詩者其於保身於教子可謂兩得矣題大計反彼脊令音零載飛載鳴我日斯邁而月斯征夙興夜寐無忝爾所生叶桑經反興也題視也脊令飛則鳴行則搖載則而汝忝辱也視彼脊令則且飛而且鳴矣我既日斯邁則汝亦月斯征矣漢東方朔傳云日夜孳孳敏行而不怠譬如脊令飛且鳴矣愚謂飛而且鳴用力為甚努力進善亦猶是也此亦以勉強勤勞之意為興輯録謝氏曰當如日斯邁如月斯征無一時不勤可也言當各務努力不可暇逸取禍恐不及相救恤也夙興夜寐各求無辱於父母而已努力以求無辱其親亦曰敬威儀而已此申首章及二章之意輯録解頤曰脊令之且飛且鳴其勢之不能以已也我兄弟之日邁月征亦其情之不能以已也夙興夜寐各務努力以求無黍於先人可也天之密運聖人之不已君子之自強皆此意也而此詩及之其亦有得於聖賢之學也歟交交桑扈音户率場啄粟哀我填都田反寡宜岸宜獄握粟出卜自何能榖興也交交往來之貌桑扈竊脂也俗呼青觜肉食不食粟輯録孔氏曰俗呼青雀喜盜脂膏食之因以名云埤雅曰桑扈有二種青質者觜曲食肉好盜脂膏素質者其翅與領皆有文章所謂率場啄粟有鶯其羽者也呂東萊曰淮南子云馬不食脂桑扈不食粟填與癲同病也岸亦獄也韓詩作犴鄉亭之繫曰犴朝廷曰獄輯録亭道路所舍也犴犴同胡地野犬也所以守者故謂獄為狴犴扈不食粟而今則率場啄粟矣病寡不宜岸獄今則宜岸宜獄矣此以受所不堪受者為興言王不恤鰥寡喜陷之於刑辟音闢也所謂我心憂傷者此故也然不可不求所以自善之道故握持其粟出而卜之曰何自而能善乎所以自善之道亦曰敬威儀而已然又憂不能決而決之於卜也言握粟以見其貧窶之甚此章又申敬爾儀之意溫溫恭人如集于木惴惴之瑞反小心如臨于谷戰戰兢兢如履薄冰賦也溫溫和柔貌輯録謝氏曰溫溫而恭者謙和之人也惴惴而小心者畏謹之人也如集于木恐隊音墜也如臨于谷恐隕也彼溫恭者則如集于木也彼小心者則如臨于谷也賢者之敬其威儀如此我之戰兢得不然哉此章又以終敬爾儀之意輯録鄭氏曰衰亂之世賢人君子雖無罪猶恐懼如此小宛六章章六句首章念父母以發相戒之端二章敬爾儀以示相戒之實三章言爾當教子以此敬四章言我之與爾當日就月將於此敬五章言時事如此已不可以不敬六章言賢者如此已不可以不敬此詩之詞最為明白而意極懇至説者必欲為刺王之言故其説穿鑿破碎無理尤甚今悉改定讀者詳之增釋許氏曰此詩遇亂而戒兄弟修德以免禍修德當法其親免禍則謹其德前四章修德之事後二章免禍之意辨薄于反彼鸒音豫斯叶先齎反歸飛提提是移反民莫不榖我獨于罹何辜于天我罪伊何心之憂矣云如之何興也辨飛拊翼貌鸒雅烏也雅與鴉同小而多羣腹下白江東呼為鵯匹又音卑烏輯録爾雅鸒斯鵯鶋詩詁曰既曰雅又曰烏語似重復今定以鸒卑居也卑居雅也雅即烏也冇數種斯語詞也提提羣飛安間之貌榖善罹憂也舊説幽王太子宜臼被廢而作此詩言辨彼鸒斯則歸飛提提矣民莫不善而我獨于憂則鸒斯之不如已物得自如人不如物故以起興何辜于天我罪伊何者怨而慕也輯録怨咎已之不得其親而思慕也舜號泣于旻天曰父母之不我愛於我何哉蓋如此矣心之憂矣云如之何則知其無可奈何而安之之詞也怨之之詞相似慕之之心又同故集傳本諸孟子而以此證之輯録解頤曰民莫不榖謂其皆有父子之親兄弟之懿也我獨于罹謂得罪於父則母子兄弟之間皆不能以保其樂也子以父為天父之不吾愛即天之不吾與也何辜于天我罪伊何自責不知已有何罪而不見愛於父也心之憂矣云如之何此詩本敘其哀痛迫切之情故以憂之一字為一篇之綱領下章凡七言之踧踧徒厯反周道叶徒苟反鞠九六反為茂草叶此苟反我心憂傷惄乃厯反焉如搗丁老反叶丁口反假寐永嘆維憂用老叶魯口反心之憂矣疢丑覲反如疾首興也踧踧平易去聲也周道大道也鞠窮窮塞也謂廢塞而不用也惄思搗舂也不脫衣冠而寐曰假寐疢猶疾也踧踧周道則將鞠為茂草矣我心憂傷則惄焉如搗矣平易之路一或塞之則生草憂傷之事一或念之則痛心是皆先事而致慮之之意且以一廢一舉相對也精神憒古對反眊至於假寐之中而不忘永歎憂之之深是以未老而老也輯録年少而容貌老也疢如疾首則又憂之甚矣輯録謝氏曰惄焉如搗深悲至痛如有物之搗其心也事關心者夢中亦長吁故曰假寐永歎憂愁多者年少而髮白故曰維憂用老解頤曰此章憂之一字几三言之惄焉如搗憂之而至於痛也維憂用老憂之而至於衰也疢如疾首憂之而至於病也維桑與梓叶奬里反必恭敬止靡瞻匪父靡依匪母叶滿彼反不屬音燭于毛不離于裏天之生我我辰安在叶此里反興也桑梓二木古者五畝之宅輯録廬井邑居各二畝半以為宅也樹之牆下以遺去聲子孫給蠶食具器用者也瞻者尊而仰之依者親而倚之屬連也毛膚體之餘氣末屬也離麗輯録附也也裏心腹也辰猶時也言桑梓父母所植尚且必加恭敬况父母至尊至親宜莫不瞻依也此以情愛輕重相對而為興然父母之不我愛豈我不屬于父母之毛乎豈我不離于父母之裏乎無所歸咎則推之於天曰豈我生時不善哉何不祥至是也首章與此章皆怨而慕也但首章有控告之意此章冇痛切之懷輯録謝氏曰父母不我愛求其説而不可得曰不知天生我之時果在何歟不可得而知也菀音鬱彼柳斯鳴蜩音條嘒嘒呼惠反有漼于罪反者淵萑音九葦韋鬼反淠淠孚計反譬彼舟流不知所屆音戒叶居氣反心之憂矣不遑假寐興也菀茂盛貌蜩蟬也嘒嘒聲也漼深貌淠淠當易匹詣反衆也屆至遑暇也菀彼柳斯則鳴蜩嘒嘒矣有漼者淵則萑葦淠淠矣今我獨見棄逐如舟之流于水中不知其何所至乎物類相容則冇可止息之處我不見容則知人所不用之舟而無可止息之處矣此以人不如物而起興是以憂之之深昔猶假寐而今不暇也鹿斯之奔維足伎伎其宜反雉之朝雊音遘尚求其雌叶千西反譬彼壞胡罪反木疾用無枝心之憂矣寧莫之知興也伎伎舒貌宜疾而舒留其羣也留猶顧也雊雉鳴也壞傷病也寧猶何也鹿斯之奔則足伎伎然雉之朝雊亦知求其妃音配匹輯録蘇氏曰鹿走而留其羣雉鳴而求其雌物無不冇思於其親者今王獨棄其子何哉今我獨見棄逐如傷病之木憔悴而無枝物相顧念則有可生全之理我既不見顧念則如生意所不及之木而無可生全之理矣亦以人不如物起興是以憂之而人莫之知也相息亮反彼投兔尚或先蘇薦反叶蘇晉反之行有死人尚或墐音覲之君子秉心維其忍之心之憂矣涕既隕音藴之興也相視投奔行道墐埋秉執隕墜也相彼被逐而投人之兔尚或有哀其窮而先脫之者道有死人尚或有哀其暴步木反露而埋藏之者蓋皆有不忍之心焉今王信讒棄逐其子曽視投兔死人之不如則其秉心亦忍矣以不忍之心興忍心又以待至親不如待疏賤起興也是以心憂而涕隕也五章以前多為自怨之詞以怨已此及下章則雖自怨而實怨其親矣君子信讒如或酬市由反叶市敕反之君子不惠不舒究之伐木掎寄彼反叶居何反矣析薪杝敕氏反叶湯何反矣舍音捨彼有罪豫之他吐賀反叶湯何反矣賦而興也酬報惠愛舒緩究察也掎倚也以物倚其巔也杝隨其理也他加也言王惟讒是聽如受酬爵得即飲之輯録孔氏曰酬酬古字通用此喻得讒即授而行之如旅酬也曽不加惠愛舒緩而究察之輯録解頤曰不加愛是無復惻隱之萌矣不加察是無復是非之辨矣夫苟舒緩而究察之則讒者之情得矣伐木者尚倚其巔輯録箋此句下有不欲妄踣之一句下文皆不字亦作不欲析薪者尚隨其理皆不妄挫折之今乃捨彼有罪之譛人而加我以非其罪輯録解頤曰惟其無是非之心故人之有罪者則舍之而不問惟其無惻隱之心故我之無罪者則加之而不恤曽伐木析薪之不若也此則興也凡處細微之事者必有理而乃以非理罪我乎此以待人不如處物起興莫髙匪山叶所旃反莫浚蘇俊反匪泉君子無易夷䜴反由言耳屬音燭于垣無逝我梁無發我笱我躬不閲遑恤我後賦而比也山極髙矣而或陟其巔泉極深矣而或入其底故君子不可易於其言恐耳屬于垣者有所觀望左右而生讒譛也輯録陳氏曰王無輕發言小人之為讒者尚屬耳於垣壁間以窺伺之讒賊之生也亦伺君子之向背如何耳王於是卒以褒姒為后伯服為太子故告之曰母逝我梁母發我笱我躬不閲遑恤我後蓋比詞也輯録王氏曰母逝梁發笱者太子放逐而其憂終不忘國也我躬不閲遑恤我後者無如之何自歎之辭東萊吕氏曰唐德宗將廢太子而立舒王輯録舒王德宗姪李泌諫之且曰願陛下還宫勿露此意左右聞之將樹功於舒王太子危矣此正君子無易由言耳屬于垣之謂也小辨之作太子既廢矣而猶云爾者蓋推本亂之所由生言語以為階也引德宗事見未發以前當如此蓋以證前四句之意也輯録輔氏曰此章則總其始終言之申后之黜宜臼之逐雖主於褒姒伯服之讒意者幽王之昏暴必先嘗泄此意於言語之間故其左右得以附會而成之自古如是多矣東萊先生以為推本其亂之所由生言語以為階者是也無逝我梁以下四句則事已決後絶意之辭耳小辨八章章八句一章怨慕也二章自怨也三章又為怨慕之辭四章無所底止五章無所聊生則又為自怨之辭六章七章則怨及其親而怨之中不忘於慕也至八章無逝我梁以下始為絶意之詞云何增釋許氏曰篇內五心之憂矣一曰云如之其詞尚緩二曰疢如疾首則切於身矣三曰不遑假寐則書夜無冇休止四曰寧莫之知則無所告訴而倉卒急迫故終之以涕隕也幽王娶於申生太子宜臼後得褒姒而惑之生子伯服信其讒黜申后逐宜臼而宜臼作此以自怨也序以為太子之傅述太子之情以為是詩不知其何所據也傳曰髙子曰小辨小人之詩也孟子曰何以言之曰怨曰固哉髙叟之為詩也輯録固謂執滯不通也為猶治也有人於此越人關音彎弓而射音石之則已談笑而道之無他疏之也其兄關弓而射之則已垂涕泣而道之無他戚之也小辨之怨親親也親親仁也輯録親親之心仁之發也固矣夫髙叟之為詩也兄射其弟以比幽王棄子涕泣道之以比太子怨詞戚之之心即親親之仁也若小辨不怨則疏其親矣可乎哉惟其慕之所以怨之小辨之可取者正以此耳曰凱風何以不怨曰凱風親之過小者也小辨親之過大者也親之過大而不怨是愈疏也親之過小而怨是不可磯也愈疏不孝也不可磯亦不孝也微激之而遽怒放逺之而遂忘均為不孝也孔子曰舜其至孝矣五十而慕旻天之怨怨己也小辨之怨始於怨已而終則怨其親也不得乎親而談笑道之則其心恝然矣不必計其怨之同異也所可惜者小辨之親親一時之慕爾使能即此良心以致終身之慕則戍申戍甫豈遂至於忘其親乎孟子論是詩無貶詞毛傳引之集傳用之以見孔子録之之故也輯録朱子曰言舜猶怨慕小辨之怨不為不孝也解頤曰小辨之詩處父子之變白華之詩處夫婦之變聖人備録於經所以著周室禍敗之由又以見天理民彛之不容泯也然嘗考之小辨之詩其前六章皆興白華之詩其八章皆比小辨之詞婉而切猶有望之之意處父子之間則然也白華之詞簡而莊不無責之之意處夫婦間則然也悠悠昊天曰父母且子餘反無罪無辜亂如此憮火吳反昊天已威叶紂胃反豫慎無罪叶音悴昊天泰憮豫慎無辜賦也悠悠逺大之貌且語詞憮大也已泰皆甚也慎審也大夫傷於讒無所控告而訴之於天曰悠悠昊天為人之父母胡為使無罪之人遭亂如此其大也昊天之威已甚矣我審無罪也昊天之威甚大矣我審無辜也此自訴而求免之詞也輯録嚴氏曰首章傷已被讒也亂之初生僣側蔭反始既涵音含亂之又生君子信讒君子如怒叶奴五反亂庶遄市專反沮慈吕反君子如祉音耻亂庶遄已賦也僣始不信之端也涵容受也君子指王也遄疾沮止也祉猶喜也言亂之所以生者由讒人以不信之言始入而王涵容不察其真偽也亂之又生者則既信其讒言而用之矣君子見讒人之言若怒而責之則亂庶幾遄沮矣見賢者之言若喜而納之則亂庶幾遄已矣今涵容不斷讒信不分是以讒者益勝而君子益病也容不當容則讒來而造亂用不當用則讒行而益亂若喜怒以正遏惡揚善則讒無從生亂無從起矣蘇氏曰小人為讒於其君必以漸入之其始也進而嘗之君容之而不拒知言之無忌於是復進既而君信之然後亂成輯録嚴氏曰次章言亂生於讒讒生於優柔不斷所謂懷狐疑之心者來讒賊之口持不斷之意者開羣枉之門也今忠讒不分是以邪正混淆是非易位而亂天下也君子屢盟叶謨渾反亂是用長丁丈反叶直良反君子信盜亂是用暴盜言孔甘亂是用餤音談匪其止共音恭維王之卭其恭反賦也屢數音朔也盟邦國有疑則殺牲歃音霎血告神以相要平聲束也輯録周禮司盟注曰盟者書其辭於䇿殺牲取血歃其牲加書於上而理之有疑不協也李氏曰考之春秋傳如伯有之亂鄭伯與其臣下盟蓋盟者生於君臣相疑而致也歃啜也盟者以血塗口旁曰歃盜指讒人也餤進卭病也言君子不能已亂而屢盟以相要則亂是用長矣君子不能堲輯録舜典朕堲讒説殄行蔡氏傳堲疾也音即讒而信盜以為虐則亂是用暴矣讒言之美如食之甘使人嗜之而不厭則亂是用進矣然此讒人不能供其職事徒以為王之病而已增釋吳師道所謂亂是用長是用暴是用餤皆進進不已之意共亦訓進此言若不止所進則維王之病矣是承上意而總言之夫良藥苦口而利於病忠言逆耳而利於行維其言之甘而悅焉則其國豈不殆哉不能止讒而喜聽讒則讒為亂階必矣以申上章之意也奕奕寢廟君子作之秩秩大猷聖人莫之他人有心豫忖七損反度音鐸之躍躍他厯反毚士咸反兔遇犬獲叶黃郭反之興而比也奕奕大也秩秩序也猷道莫定也躍躍跳疾貌毚狡也奕奕寢廟則君子作之秩秩大猷則聖人莫之以興他人有心則豫得而忖度之寢廟難作而君子能作之大猷難定而聖人能定之人各有心難忖度也而我能忖度之此以能所難能為興而又以躍躍毚兔遇犬獲之比焉反覆興比以見讒人之心我皆得之不能隱其情也以二事為興言得讒人之心若難以犬獲兔為比言得讒人之心甚易也輯録朱子曰詩人所見極大如此章本意只是惡巧言讒譛之人却以奕奕寢廟秩秩大猷起興便見其所見極大形於言者無非義理之極致也潘時舉對云此亦是先王之澤未泯禮義根於其心故其形於是言者自無非義理也荏而甚反染柔木君子樹叶上主反之往來行言心焉數所主反之蛇蛇以支反碩言出自口叶孔五反矣巧言如簧顔之厚叶胡五反矣興也荏染柔貌柔木桐梓之屬可用者也行言行道之言也數辨也蛇蛇安舒也碩大也謂善言也顔厚者頑不知耻也荏染柔木則君子樹之矣輯録樹植也往來行言則心能辨之矣柔木皆可用故君子樹之人言有讒信不同則未必皆可用也故以其心辨之此用處置事理不同為興若善言出於口者宜也巧言如簧則豈可出於口哉輯録解頤曰詳審而不暴質實而無偽善言也阿徇以為容逢迎以為悅巧言也真氏曰憸巧之言悅耳人聽如笙簧然言之徒可羞愧而彼顔之厚不知以為耻也孟子曰為機變之巧者無所用耻焉其斯人之謂與我得其心彼不知耻所以足上章之意增釋吳師道曰蛇蛇安舒正對顔厚而言巧言者自欺之心逹於靣終有不可得而掩者其顔豈得不厚乎上章第五句六句以見能得讒人之情此章第三句四句至末三句又以深見讒人之狀言也彼何人斯居河之麋音眉無拳音權無勇職為亂階叶居溪反既微且腫市勇反爾勇伊何為猶將多爾居徒幾音紀叶居希反何賦也何人斥讒人也此必有所指矣賤而惡烏故反之故為不知其姓名而曰何人也斯語辭也水草交謂之麋見秦風蒹葭篇拳力階梯也音限瘍音羊為微腫足為腫輯録孔氏曰郭璞云腳脛也瘍瘡也膝脛之下有瘡腫是涉水所為猶謀將大也言此讒人居下濕之地雖無拳勇可以為亂而讒口交鬪專為亂之階梯又有微腫之疾亦何能勇哉而為讒謀則大且多如此是必有助之者矣然其所與居之徒衆幾何人哉言亦不能甚多也為惡者弱黨惡者寡是亦無足畏也鄙而賤之之詞巧言六章章八句輔氏曰四章五章謂讒言易辨六章謂讒人易除愚謂三章以前刺聽讒者五章以後刺造讒者訴增釋許氏曰夫人既被讒終篇末嘗有怨懟斥之語拳拳專以欲諷上之審聽而五章且以開讒人之迷不自憂其身而惟憂天下之亂不惡怒其人而發其羞耻之心詩人之忠厚如此以五章巧言二字名篇彼何人斯其心孔艱叶居銀反胡逝我梁不入我門叶眉貧反伊誰云從維暴之云賦也何人亦若不知其姓名也孔甚艱險也我舊説以為蘇公也暴暴公也皆畿內諸侯也舊説暴公為卿士而譛蘇公故蘇公作詩以絶之然不欲直斥暴公故但指其從行者而言彼何人者其心甚險胡為往我之梁輯録歐陽氏曰魚梁者古人營生之具詩屢言之而不入我之門乎似詩之作以此既而問其所從則暴公也夫以從暴公而不入我門則暴公之譛已也明矣但舊説於詩無明文可考未敢信其必然耳輯録輔氏曰首二句責之也而不為已甚之辭中二句疑之也而猶冇望之之意末二句始明言之而其情既不得而遁然亦無忿懟之辭可謂忠厚矣二人從行誰為此禍胡果反胡逝我梁不入唁我始者不如今云不我可賦也二人暴公與其徒也唁弔失位也言二人相從而行不知誰譛已而禍之乎輯録輔氏曰雖已明知其人之譛已而猶為不知之辭既使我得罪矣而其逝我梁也又不入而唁我汝始者與我親厚之時豈嘗如今不以我為可乎彼何人斯胡逝我陳我聞其聲不見其身不愧于人不畏于天叶鐵因反賦也陳堂塗也堂下至門之徑也在我之陳則又近矣聞其聲而不見其身言其蹤迹之詭祕也不愧于人則以人為可欺也天不可欺女獨不畏于天乎奈何其譛我也首章疑之二章三章微責之輯録輔氏曰人或可欺而天其可欺乎爾獨不畏于天而譛我如是也古人責人往往至天而極如雨無正所謂胡不相畏不畏于天亦是意也彼何人斯其為飄風叶孚愔反胡不自北胡不自南叶尼心反胡逝我梁祗音支攪交卯反我心賦也飄風暴風也攪擾亂也言其往來之疾若飄風然自北自南則與我不相值也今則逝我之梁則適所以攪亂我心而已輯録適所以訓祗字爾之安行亦不遑舍叶啇居反爾之亟紀力反行遑脂爾車一者之來云何其盱况于反賦也安徐遑暇舍息亟疾盱望也字林云盱張目也易曰盱豫悔輯録豫六三爻本義曰盱上視也隂不中正而近於四四為卦主故六三上視於四而下溺於豫宜有悔者也三都賦云盱衡而語是也眉上曰衡謂舉目揚眉也左太沖賦本作盱衡而誥言爾平時徐行猶不暇息而况亟行則何暇脂其車哉今脂其車則非亟也乃託以亟行而不入見我則非其情矣何不一來見我如何使我望汝之切乎爾還而入我心易以䜴反叶以支反也還而不入否難知也一者之來俾我祗也賦也還反易説音悅祗安也輯録祗當作祁言爾之往也既不入我門矣儻還而入則我心猶庶乎其説也還而不入則爾之心我不可得而知矣何不一來見我而使我心安乎輯録李氏曰亦以見讒譛之人愧不敢來也董氏曰是詩至此其詞益緩若不知其為譛矣此三章一意又皆反覆以其不見為疑也伯氏吹塤况袁反仲氏吹箎音池及爾知貫諒不我知出此三物以詛側助反爾斯叶先齎反賦也伯仲兄弟也俱為王臣則有兄弟之義矣樂器土曰塤大如鵝子鋭上平底似稱去聲錘六孔輯録孔氏曰塤周禮小師職作塤古今字異耳注云燒土為之竹曰箎長尺四寸圍三寸七孔一孔上出徑三分凡八孔橫吹之如貫如繩之貫物也言相連屬音燭也諒誠也三物犬豕雞也刺其血以詛盟也輯録周禮疏盟是盟將來詛是詛過往釋文以禍福之言相要曰詛伯氏吹塤而仲氏吹箎言其心相親愛而聲相應和並去聲也親愛以伯仲言應和以塤箎言與汝如物之在貫如物在貫言無間也伯仲塤箎相與如此可謂無間矣豈誠不我知而譛我哉苟曰誠不我知則出此三物以詛之可也此章始言其譛已也昔者知我今者譛我與二章之意相應而加詳為鬼為蜮音域則不可得有靦土典反面目視人罔極作此好歌以極反側賦也蜮短狐也江淮水皆有之能含沙以射水中人影其人輒病而不見其形也輯録孔氏曰蜮如鱉二足陸機云一名射影含沙射影其瘡如疥埤雅曰冇長角橫在口前如弩擔臨其角端曲如上弩以氣為矢因水勢以射人俗呼水弩鵝能食之靦面見人之貌也好善也反側反覆不正直也言汝為鬼為蜮則不可得而見矣女乃人也靦然有面目與人相視無窮極之時豈其情終不可測哉是以作此好歌以究極爾反側之心也此章乃正言以責之輯録王氏曰作此詩將以絶之而曰好歌者有欲其悔悟之心焉爾何人斯八章章六句此詩與上篇文意相似疑出一手但上篇先刺聽者此篇專責讒人耳王氏曰暴公不忠於君不義於友所謂大故也故蘇公絶之然其絶之也不斥暴公言其從行而已不著其譛也示以所疑而已既絶之矣而猶告以一者之來俾我祗也蓋君子之處已也忠其遇人也恕使其由此悔悟更以善意從我固所願也雖其不能如此我固不為已甚豈若小丈夫然哉一與人絶則醜詆固拒輯録醜惡詆廣韻注呰也呰音訾口毁也固堅也唯恐其復合也萋七西反兮斐孚匪反兮成是貝錦彼譛人者亦已大音泰甚食荏反比也萋斐小文之貌貝水中介蟲也有文彩似錦輯録孔氏曰錦而連貝故知為貝之文其文彩之異小大之殊甚衆占者貨貝是也埤雅曰錦文如貝謂之貝錦貝中肉如科斗而有首尾以其背用謂之貝貝皆背也時冇遭讒而被宫刑為巷伯者作此詩輯録曹氏曰注云寺之言侍也正內路寢也侍王於路寢之內蓋奄人也巷永巷也內人之所居伯長也其官為寺人而職長永巷故寺人而稱巷伯焉言因萋斐之形而文致之以成貝錦以比讒人者因人之小過而飾成大罪也彼為是者亦已太甚矣輯録嚴氏曰甚之者言為禍痛深疾之之辭哆昌者反兮侈尺是反兮成是南箕彼譛人者誰適丁厯反下同與謀叶謨悲反比也哆侈微張之貌南箕四星二為踵二為舌輯録通釋曰即箕星也常見於南方故謂南箕其踵狹而舌廣則大張矣前章言文致之以成其罪此章言張大之以成其罪適主也誰適與謀言其謀之閟也輯録閟音祕幽深也解頤曰萋斐以成貝錦喻讒人者能因細小而飾成大罪也哆侈以成南箕喻讒人者能因疑似而搆成實罪也始則以小而成大終則以虛而為實此讒人者所以能傾人之家國也緝緝七立反翩翩音篇叶批賔反謀欲譛人慎爾言也謂爾不信叶斯人反賦也緝緝口舌聲或曰緝緝人之罪也或曰有條理貌皆通翩翩往來貌譛人者自以為得意矣然不慎爾言聽者有時而悟且將以爾為不信矣輯録解頤曰緝緝者如麻之績繼續而不已也翩翩者如鳥之飛往來而自得也譛之初行既以不信而加諸人言之不慎亦將以不信而責於汝戒之也捷捷幡幡芳煩反叶芬邅反謀欲譛言豈不爾受既其女音汝遷賦也捷捷儇血平聲利貌幡幡反覆貌王氏曰上好譛則固將受女然好譛不已則過譛之禍亦既遷而及女矣輯録嚴氏曰汝能譛人人亦能譛汝其禍捋遷及汝矣曽氏曰上章及此皆忠告之詞輯録輔氏曰慎爾言也謂爾不信自譛者而言也豈不爾受既其女遷自聽者而言也皆所必至之理故以之忠告於為譛者庶乎其知所畏而不敢肆耳解頤曰好譛之初固惟汝之受好譛不已又捋於汝乎遷亦戒之之詞也驕人好好勞人草草蒼天蒼天叶鐵因反視彼驕人矜此勞人賦也好好樂也草草憂也驕人譛行而得意勞人遇譛而失度其狀如此輯録王氏狀上有情字輔氏曰視彼驕人庶乎有以抑遏沮止之也矜此勞人庶乎有以扶持慰安之也彼譛人者叶掌與反誰適與謀叶滿補反取彼譛人投畀豺士皆反虎豺虎不食投畀有北有北不受叶承呪反投畀有昊叶許候反賦也再言彼譛人者誰適與謀者甚嫉之故重言之也或曰衍去聲文也投棄也輯録畀付與也説文豺狼屬狗聲北北方寒涼不毛之地也輯録通釋曰窮北之地多寒不生草木五榖投棄讒人於彼使凍飢之也不食不受言讒譛之人物所共惡烏故反也昊昊天也投畀昊天使制其罪輯録制斷也正也此皆設言以見欲其死亡之甚也故曰好賢如緇衣惡惡下如字如巷伯一者好之之至一者惡之之至楊園之道猗於綺反于畝丘叶法竒反寺人孟子作為此詩凡百君子敬而聽之興也楊園下地也楊者近水之木宜下隰故楊園為下地猗加也加者出其上也畝丘髙地也畝田之壟也丘如田壟故曰畝丘寺人內小臣輯録周禮天官屬注寺之言侍也又音侍蓋以讒被宫而為此官也孟子其字也楊園之道而猗于畝丘以興賤者之言或有補於君子也卑可升髙有下可益上之意故以為興蓋譛始於微者而其漸將及於大臣也故作詩使聽而謹之也劉氏曰其後王后太子及大夫果多以讒廢者輯録董氏曰幽王之世大臣傷於讒者如蘇公小臣傷於讒如寺人孟子則上下其得以免乎通釋曰劉氏此言蓋從小序以此為幽王時詩也集傳既引其説而未嘗明言其為幽王詩讀者當自得之巷伯七章四章章四句一章五句一章八句一章六句一章二章責之三章四章誨之五章怨而訴之六章深思而痛疾之七章則言作詩以為君子之戒也輯録陳定宇曰巧言何人斯巷伯三篇其述讒言之禍與讒人之情狀可謂極矣巷是宫內道名秦漢所謂永巷是也輯録三輔黃圖曰永長也宫中長巷幽閉宫女之有罪者武帝時改為掖庭置獄焉謂之掖庭詔獄伯長也主宫內道官之長即寺人也故以名篇班固司馬遷贊云迹其所以自傷悼小雅巷伯之倫其意亦謂巷伯本以被譛而遭刑也司馬遷以救李陵而得罪下蠶室輯録孔氏曰司馬遷以良史之才所坐非罪及其刋述典墳詞多慷慨是以班固云小雅巷伯之倫焉而楊氏曰寺人內侍之微者出入於王之左右親近於王而日見之宜無間去聲之可伺矣今也亦傷於讒則疏逺者可知故其詩曰凡百君子敬而聽之使在位知戒也其説不同然亦有理姑存於此云被讒而遭刑則見讒能禍人以寺人而遭讒則見讒能間人已上三篇皆刺讒者之詩故相屬習習谷風維風及雨將恐邱勇反將懼維豫與女音汝將安將樂音洛女轉棄豫叶演女反興也習習和調貌谷風東風也將且也恐懼謂危難去聲憂患之時也此朋友相怨之詩故言習習谷風則維風及雨矣將恐將懼之時則維豫與女矣風雨相須所以興維豫與女也奈何將安將樂而女轉棄豫哉患難則相保安樂則相遺此無恆心之人也習習谷風維風及頽徒雷反將恐將懼置之䜴反豫于懷叶胡隈反將安將樂棄豫如遺叶夷回反興也頽風之焚輪者也焚輪旋轉之貌回風從上下謂之頽頽下也輯録爾雅焚輪謂之頽注暴風從上下鄭樵曰焚輪自上而下一説焚輪亦當時方言回風為飄注旋風也置與置同置于懷親之也如遺忘去而不復存省悉井反也頽則暴而易散所以興棄豫如遺也首章以物之相須興人之相與則後二句在興外此章以物之不常興人之無常則盡一章而興之習習谷風維山崔徂回反嵬五回反無草不死無木不萎叶於回反忘我大德思我小怨叶韻未詳比也崔嵬小巔也習習谷風維山崔嵬則風之所被者廣矣然猶無不死之草無不萎之木輯録萎音逶草木枯况於朋友豈可以忘大德而思小怨乎谷風生物之功甚大也而猶有所憾功之難全固然也恩施雖厚而不能無不足蓋若此矣忘大德思小怨則責人之不恕也故此章為比而與上二章不同或曰興也以谷風生物興大德以草死木萎興小怨謂興體亦可也此蓋謂之比則重在忘字與思字謂之興則重在大德小怨字增釋許氏曰傳意謂谷中之風而及於崔嵬之山是所被者廣矣風本生物者也而草木不免於萎死是天地之功亦有所不足也而况於朋友豈無小過哉當存大義而全交道可也今乃忘我大德而思我小怨乎谷風三章章六句一章二章怨其始合而終暌三章怨其不當以此而見暌也谷風蓋與伐木為反對終和且平則無谷風之怨矣輯録吕氏曰急則相求緩則相棄恩厚不知怨小必記皆小人之交也蓼蓼音六者莪五河反匪莪伊蒿呼毛反哀哀父母生我劬勞比也蓼長大貌莪美菜也蒿賤草也人民勞苦孝子不得終養去聲而作此詩言昔謂之莪而今非莪也特蒿而已以比父母生我以為美材可賴以終其身而今乃不得其養以死於是乃言父母生我之劬勞而重自哀傷也輯録嚴氏曰始生謂莪長大為蒿為莪猶可食為蒿則無用喻父母生長我身至于長大乃是無用之子不能終養也此孝子自怨其身之辭也蓼蓼者莪匪莪伊蔚音尉哀哀父母生我勞瘁似醉反比也蔚牡菣去刃反也三月始生七月始華如胡麻華而紫赤八月為角似小豆角鋭而長瘁病也已上二章先發哀慕之意瓶之罄音慶矣維罍之耻鮮息淺反民之生不如死之久叶舉里反矣無父何怙無母何恃出則銜恤入則靡至比也瓶小罍大皆酒器也罄盡鮮寡恤憂靡無也言瓶資於罍而罍資瓶瓶以泄之罍以蓄之二者交相賴也猶父母與子相依為命也故瓶罄矣乃罍之耻猶父母不得其所乃子之責瓶取給於罍親仰給於子理相似也而輯録通釋曰瓶罍但取其相資之義不取義於瓶罍之小大也所以窮獨之民生不如死也輯録下四句又所以實此二句蓋無父則無所怙無母則無所恃是以出則中心銜恤入則如無所歸也此章備極哀慕之情輯録輔氏曰玩此四句真能道孝子之情非身履而親厯之不知其味也父兮生我母兮鞠我拊音撫我畜喜六反我長丁丈反我育我顧我復我出入腹我欲報之德昊天罔極賦也生者本其氣也鞠畜皆養也拊拊循也輯録史記拊循其民劉執中曰防其驚也則拊之育覆孚救反育也輯録禮記煦嫗覆育顧旋視也輯録孔氏曰謂去之而反顧也復反覆也輯録嚴氏曰復謂顧之又顧反覆不能暫捨也腹懷抱也罔無極窮也言父母之恩如此欲報之以德而其恩之大如天無窮不知所以為報也此章極言父母之恩如此以發上文劬勞勞瘁之意輯録嚴氏曰父生母鞠此總言我身是父母所生養下乃詳言父母之恩勤也謝氏曰天生萬物其恩無窮萬物無能報其恩者父母生子其恩如天之無窮子亦無可以報其恩者南山烈烈飄風發發民莫不榖我獨何害叶音曷興也烈烈髙大貌發發疾貌榖善也南山烈烈則飄風發發矣民莫不善而我獨何為遭此害也哉山髙大則風亦疾民莫不榖則我當與之皆善也而獨遭此害何哉此以物理之齊興人事之不齊亦反其意以為興也南山律律飄風弗弗叶分聿反民莫不榖我獨不卒興也律律猶烈烈也弗弗猶發發也卒終也言終養也此與上章重自哀痛以申不得終養之意蓼莪六章四章章四句二章章八句晉王裒以父死非罪每讀詩至哀哀父母生我劬勞未嘗不三復流涕受業者為廢此篇詩之感人如此王裒父儀事魏將軍司馬昭昭與吳人戰敗問曰戰而敗績誰任其咎儀曰責在元帥昭怒斬之集傳引此以明詩之用輯録李氏曰凱風母不安其室之詩也小辨太子見棄之詩也蓼莪孝子不得終養之詩也故其咎責怨慕哀痛如此苟不為母所棄不為父所逐不困於行役而得終養則其歡欣可知矣觀詩者當以此類求之解順曰孝子行役不得以養其父母而形於嘆詠者如陟岵鴇羽皆是也而蓼莪之詩獨使人誦之者流涕鳴咽而不能止何也曰陟岵鴇羽思念於父母尚存之日蓼莪之詩感傷於父母既沒之後噫彼父母俱存者猶未知是詩之悲也若父母既沒誦是詩而不三復流涕者是亦非人子也有饛音蒙簋音軌飱音孫有救音求棘匕必履反周道如砥之履反其直如矢君子所履小人所視叶善止反眷音眷言顧之潸所姦反焉出涕音體興也饛滿簋貌飱熟食也輯録孔氏曰禮簋盛黍稷救曲貌棘匕以棘為七所以載鼎肉而升之於俎也輯録孔氏曰雜記匕用桑長三尺喪祭也吉祭及賔客之七則用棘古之祭祀享食必體解其肉之胖既大故賔用匕載之謂出之於鼎升之於俎也胖音判牲之半體砥礪石言平也矢言直也君子在位履行小人下民也眷反顧也潸涕下貌序以為東國困於役而傷於財談大夫作此以告病輯録孔氏曰談國在京師之東言有饛簋飱則有救棘匕周道如砥則其直如矢此固宜為無義之興但簋飱饛然突而不平周道則平如砥也棘匕救然曲而不直周道則直如矢也以突興平以曲興直相因之義或然是用存之以備一説是以君子履之而小人視焉適周之道既平且直乃人所共履共視者此蓋互文見義耳今乃顧之而出涕者則以東方之賦役莫不由是而西輸於周也此章首發憫恤之意小東大東叶都郎反杼直吕反柚音逐其空叶枯郎反糾糾葛屨可以履霜佻佻徒雕反公子行彼周行叶戶郎反既往既來叶六直反使我心疚叶訖力反賦也小東大東東方小大之國也自周視之則諸侯之國皆在東方杼持緯者也輯録梭也柚受經者也空盡也佻輕薄不奈勞苦之貌公子諸侯之貴臣也周行大路也疚病也言東方小大之國杼柚皆已空矣至於以葛屨履霜而其貴戚之臣奔走往來不勝音升其勞使我心憂而病也既傷於財又困於役即此見之此章指言所可憫恤之事輯録輔氏曰糾糾葛屨可以履霜舉其甚者言之也以葛屨履霜則冬裘之不備可知矣既往既來則言其來往之不一也周道一也方其盛時君子履之而小人視焉及其衰也公子行之而人心病焉時移事變而人心所感不同如此有洌音列汍音軌泉叶才勻反無浸穫薪契契苦訃反寤歎哀我憚丁佐反人薪是穫薪尚可載叶節力反也哀我憚人亦可息也興也洌寒意也側出曰汍泉穫艾音刈也契契憂苦也憚勞也尚庶幾平聲也載載以歸也蘇氏曰薪已穫矣而復扶又反漬之則腐民已勞矣而復事之則病故已艾則庶其載而畜之已勞則庶其息而安之此以愛物之心興愛人之心此章則承上章之意又舉所可憫恤之人而致願望之詞東人之子職勞不來音賚叶六直仄西人之子粲粲衣服叶浦北反舟人之子熊羆是裘叶渠之反私人之子百僚是試叶申之反賦也東人諸侯之子也職專主也來慰撫也西人京師人也粲粲鮮盛貌舟人舟楫之人也熊羆是裘言富也私人私家皂𨽻之屬也僚官試用也舟人私人皆西人也輯録解頤曰别舟人私人言之者舉卑賤以見其餘也此言賦役不均羣小得志也此又厯言所可憫恤之事而深怨之也輯録李氏曰此章言東人之勞西人之逸小人得志綱紀敗壞無復王室之舊也或以其酒不以其漿鞙鞙胡犬反佩璲音遂不以其長維天有漢監古暫反亦有光跂丘䜴反彼織女終日七襄賦也鞙鞙長貌璲瑞也瑞玉名輯録以瑞玉為珮漢天河也輯録楊泉物理論漢水之精也氣發而著精華浮上宛轉隨流名曰天河一曰雲漢跂隅貌織女星名在漢旁三星跂然如隅也孔氏曰三星鼎足望之跂然而成三角在天市垣北七襄未詳傳曰反也箋云駕也駕謂更平聲其肆也蓋天有十二次日月所止舍所謂肆也肆謂止舍處經星一晝一夜左旋一周而有餘二十八宿謂之經星則終日之間自卯至酉當更七次也輯録孔氏曰在天為次在地為辰通釋曰日月五星為緯其餘皆為經星經星周布與天為體所謂經星一晝夜左旋一周天而有餘者即天之旋一周而又過一度者也然周天十二次一晝夜十二時則一時當厯一次故終其晝日之問自卯至酉凡七時織女星當厯七次也言東人或饋之以酒而西人曽不以為漿東人或與之以鞙然之佩而西人曽不以為長維天之有漢則庶乎其有以監我輯録歐陽氏曰不言日月之明而言雲漢之光者謂不能下監也而織女之七襄則庶乎其能成文章以報我矣無所赴訴而言惟天庶乎其恤我耳此怨其上之弗加憫恤而冀天之憫恤也輯録輔氏曰侯邦供王賦役固其職也然為王者當有以體恤之不敢易視而輕用之可也今也東國財力俱困易視輕用之必矣此東國之所以怨病而訴之於天也解頤曰酒之厚而不以為漿佩之鞙鞙而不以為長其出之也甚艱其視之也甚賤蓋其意氣驕溢類如此然則貧富勞逸之不均吾將曷訴哉亦惟訴之於天而已漢之有光其亦能監視我也耶織女之七襄其亦能成文章以報我也耶其詞之婉而不迫如此詩之忠厚亦可見矣雖則七襄不成報章晥華板反彼牽牛不以服箱東有啓明叶謨郎反西有長庚叶古郎反有救天畢載施之行戶郎反賦也晥明星貌牽牛星名輯録六星北方宿爾雅謂何鼓何胡可反服駕也箱車箱也輯録孔氏曰兩較之間謂之箱是車內容物之處較音角啓明長庚皆金星也以其先日而出故謂之啓明以其後日而入故謂之長庚輯録庚續也劉執中曰金星朝在東所以啓日之明夕在西所以續日之長蓋金水二星常附日行而或先或後但金大水小故獨以金星為言也輯録通釋曰金水附日而行無定在或一在日先一在日後或俱在日先或俱在日後金星行在日後則晨見而昏不見行在日先則昏見而晨又不見也天畢畢星也狀如掩兔之畢畢長柄小網也畢八星二星直上如柄六星曲為兩行張其口如畢網也行行列也言彼織女不能成報我之章牽牛不可以服我之箱而啓明長庚天畢者亦無實用但施之行列而已輯録謝氏曰織女無織成文錦之實牽牛無服箱之實啓明非真能啓日之明長庚非真能續日之長畢不可以掩捕鳥獸不過施設於經星之行列耳皆有其名而無其實也至是則知天亦無若我何矣此又怨夫天弗能加憫恤也維南有箕不可以簸波我反揚維北有斗不可以挹音揖酒漿維南有箕載翕許急反其舌維北有斗西柄之揭音訐賦也箕斗二星以夏秋之間見於南方輯録通釋曰六七月間見於南方者指當時昏見為言也云北斗者以其在箕之北也或日北斗常見不隱者也輯録箕東方宿南斗六星在箕北北斗七星其六在紫微垣內其一在外運乎天中臨制四方翕引也舌下二星也箕四星在天漢之中二為踵在上二為舌在下踵反在上故曰引其舌也南斗柄固指西若北斗而西柄則亦秋時也言南箕既不可以簸揚粳粃北斗既不可以挹酌酒漿輯録亦皆有其名而無其實也而箕引其舌反若有所吞噬斗西揭其柄反若有所挹取於東是天非徒無若我何乃亦若助西人而見困甚怨之詞也此又言天弗憫恤而且若欲加害也輯録歐陽氏曰自維天冇漢以下皆述談人仰訴於天之詞其意言我談人困於供億取資於地者皆已竭矣欲取於天又不可得也未言箕斗非徒不可用箕反若有所噬斗反若有所挹取於東是皆怨諷之詞也輔氏曰二章三章以下文意竒逸其詞雖若濶疏而意脈實相連屬作此詩者非唯怨得其正其亦老於文墨者歟大東七章章八句增釋許氏曰一章言上不恤下而賦役不均也二章上四句傷於財下四句困於役三章欲得休息之意四章言賦役不均羣小得志五章言為西人所虐視而覬天之監六七章傳言已明四月維夏叶後五反六月徂暑先祖匪人胡寧忍豫叶演女反興也徂往也四月六月亦以夏正數上聲之建已建未之月也此亦遭亂自傷之詩言四月維夏則六月徂暑矣我先祖豈非人乎何忍使我遭此禍也四月維夏時暑方來而必以六月而去先祖忍豫遭禍則禍之來也何時始去乎暑去有時禍去無時天不忍以暑害人先祖忍以禍害人也亂世之禍與暑氣酷烈同故以起興無所歸咎之詞也怨先祖與怨天之意同不忍斥言其上也秋日凄凄七西反百卉許貴反具腓芳菲反亂離瘼音莫矣奚家語作奚其適歸興也凄凄涼風也卉草腓病離憂瘼病奚何適之也秋日凄凄則百卉具腓矣亂離瘼矣則我將何所適歸乎哉肅殺用威則何物可免亂離為害則何處可安草木之病者皆然人民見病者隨地而然也亂世之氣象與秋之凋瘵同故以起興冬日烈烈飄風發發民莫不榖我獨何害叶音曷興也烈烈猶栗烈也發發疾貌榖善也日寒則風疾其氣相似也民榖而我害其情何不相似乎但亂則俱害矣而云然者自傷之甚爾亂世之物情與冬之慘戚同故以起興夏則暑秋則病冬則烈言禍亂日進無時而息也不言春者春日暄妍與禍亂之世非類也山有嘉卉侯栗侯梅叶莫悲反廢為殘賊莫知其尤叶于其反興也嘉善侯維廢變尤過也山有嘉卉則維栗與梅矣輯録錢氏曰通言之則草木皆卉也在位者變為殘賊則誰之過哉物之美者能全其美可見也人之善者乃變而惡不可知也物性有常人性無常此以人不如物起興也相息亮反彼泉水載清載濁叶殊玉反我日構禍曷云能榖興也相視載則構合也相彼泉水猶有時而清有時而濁而我乃日日遭害則曷云能善乎泉水之濁有時或清而禍亂之遭無時可已也此亦以二者相反對而為興者也滔滔吐刀反江漢南國之紀盡瘁以仕寧莫我有叶羽已反興也滔滔大水貌江漢二水名紀綱紀也謂經帶包絡之也此有不忍遺棄之意瘁病也有識有也識有猶言顧念滔滔江漢猶為南國之紀今也盡瘁以仕而王何其不我有哉輔氏曰江漢為南國之紀則是江漢之有南國也王不我有則是自絶於下矣愚謂此以人情不如物理為興與江有汜同匪鶉徒九反匪鳶以專反叶以旬反翰飛戾天叶鐵因反匪鱣張連反匪鮪于軌反潛逃于淵叶一均反賦也諸本作興非鶉雕也輯録埤雅日雕能食草似鷹而大黑色俗呼為皂雕鳶亦鷙鳥也其飛上薄雲漢鱣鮪大魚也鶉鳶則能翰飛戾天鱣鮪則能潛逃于淵我非是四者則亦無所逃矣輯録陳氏曰言雖欲髙飛深藏而不可得也山有蕨薇隰有杞桋音夷君子作歌維以告哀叶於希反興也杞枸音苟檵音訃也輯録本草曰枸杞一名地骨春夏採葉秋採莖實冬採根皆可食桋赤梀音色也樹葉細而岐鋭皮理錯戾好叢生山中中去聲為車輞輯録輞車之牙即輮也考工記注輮牙也以為輪之周抱也山則有蕨薇隰則有杞桋君子作歌則維以告哀而已此則託物為無義之興四月八章章四句一章至三章言禍亂日進而四章則怨其上五章又言禍亂不息而六章又怨其上七章言去亂無計八章言作詩告哀小旻之什十篇六十五章四百十四句詩經疏義會通卷十二
