body:
  text: 詩經疏義㑹通卷二元朱公遷撰邶一之三邶鄘衛三國名在禹貢冀州西阻太行北逾衡漳東南跨河以及兖州桑土之野及商之季而紂都焉武王克商分自紂城朝歌而北謂之邶南謂之鄘東謂之衛以封諸侯邶鄘不詳其始封衛則武王弟康叔之國也輯録通釋曰武王作酒誥戒康叔而曰明大命於妹邦妹邦即紂都則康叔封衛明在武王時矣邶鄘之地豈始為武庚三叔之封至成王滅武庚誅三監乃復以封他國而其後又并入於衛也歟衛本都河北朝歌之東淇水之北百泉之南其後不知何時并得邶鄘之地至懿公為狄所㓕戴公東徙渡河野處漕邑文公又徙居於楚丘朝歌故城在今衛州衛縣西二十二里所謂殷墟衛故都即今衛縣漕楚丘皆在滑州大抵今懐衛澶音蟬相滑濮等州開封大名府界皆衛境也輯録懐州今懐慶府衛州今衛輝府相州今彰徳府開封府今仍舊並𨽻河南大名府今仍舊澶州今開州滑州今滑縣並𨽻北京濮州今東昌府濮州𨽻山東但邶鄘地既入衛其詩皆為衛事而猶繫其故國之名則不可曉或謂得之於邶者係之邶得之衛鄘係之衛鄘或謂三國之音不同故仍其舊為三國二説未知是否而舊説以此下十三國皆為變風焉程子曰衛之并邶鄘之地變風以衛為首所以著衛之惡也輯録竹房張氏曰正風以關雎為首者得夫婦人倫之至正者也變風以邶栢舟為首者母子莊姜處夫婦人倫之變者也次鄘栢舟者處之變者也蘇氏曰春秋所見百七十餘國變風之作春秋數世矣而載於大師者獨十三國意者列國不皆有詩其有詩者雖禬曹之小邶鄘之亡而有不能已者汎芳劔反彼栢舟亦汎其流耿耿古幸反不寐如有隠憂微我無酒以敖五羔反以逰比也汎流貌栢木名耿耿小明憂之貌也輯録輔氏曰盖人有所憂則其心耿耿然故不能寐也隠痛也微猶非也婦人不得於其夫故以栢舟自比輯録通釋曰有全章皆属比者亦冇比意之外繼陳其事者如此章之類今以集傳賦而比之體反觀之則此類恐亦可以為比而賦也言以栢為舟堅緻音稚宻也牢實貞固有守亦若是也而不以乘載無所依薄但汎然於水中而已故其隠憂之深如此非為無酒可以遨逰而解之也増釋許氏曰此章言栢舟則宜以載物乃汎汎於水中而無所川以此喻已故耿耿而憂思至於不能寐如有所隠痛之憂非無酒以自樂然此憂非酒之所能遣也列女傳以此為婦人之詩今考其辭氣卑順柔弱且居變風之首而與下篇相類豈亦莊姜之詩也歟栢舟與關雎鵲巢為反對而處變以常不愧於后妃夫人之化所以首變風而繼二南也輯録鄭氏曰莊姜莊公夫人齊女姓姜氏我心匪鑒不可以茹如預反亦有兄弟不可以據薄言往愬逢彼之怒賦也鑒鏡茹度據依愬告也言我心既匪鑒而不能度物雖有兄弟而又不可依以為重故往告之而反遭其怒也増釋許氏曰此章言鑑明則可度物我心憂煩不能度事不知何以處此歸而告諸兄弟聊以舒此憤隔而又逢彼之怒是兄弟亦不可據慿而終莫知所以自處也我心匪石不可轉也我心匪席不可卷卷勉反也威儀棣棣不可選也賦也棣棣富而間習之貌輯録輔氏曰富謂富盛也富盛則全備而無欠缺閑習則從容而不生踈選簡擇也言石可轉而我心不可轉席可卷而我心不可卷威儀無一不善又不可得而簡擇取舎皆自反而無闕之意不可轉其志確也不可卷其節堅也不可選其德備也存諸中者不可移形於外者無不善荘姜之賢具於此章增釋許氏曰此章於是自反平昔我心貞固過於石而不可轉我心平直過於席而不可卷威儀動止之間皆無一失而不必選而不見答於君子豈我心之過哉石不可轉是其貞潔自守之操堅席不可卷是其公平逮下之心溥也憂心悄悄七小反愠于羣小覯古豆反閔既多受侮不少靜言思之寤辟避亦反有摽符小反賦也悄悄憂貌愠怒意羣小衆妾也言見怒於衆妾也覯見閔病也辟拊心也摽拊心貌此章言已所以憂之之事不得於其夫則必見侮於其下理勢然也輯録爾雅注摽椎胷也增釋許氏曰此章謂我之憂者自揆無過正以見怒諸妾讒譛而致然黙而思之無可柰何惟拊心而已日居月諸胡迭待結反而微心之憂矣如匪澣户管反衣静言思之不能奮飛比也居諸語辭迭更微虧也輯録嚴氏曰微謂不明也日月食則不明十月之交云彼月而微此日而微匪澣衣謂垢汙不濯之衣奮飛如鳥奮翼而飛去也言日當常明月則有時而虧猶正嫡當尊衆妾當卑今衆妾反勝正嫡是日月更迭而虧是以憂之至於煩寃憒古對反心亂也眊音冐蒙䝉日不明之貌如衣不澣之衣恨不能奮起而飛去也婦人從一而終無可去之理惟安於義命而已増釋此章再言上下失序所以憂不能解但恨不可飛去耳憂之極止曰不能奮飛是不可以去謂正而不怨也栢舟五章章六句一章言徳不見取於夫而二章則内外俱困也三章言德不備於已而四章則上下俱困也五章則以無可柰何而自安之意結之輯録解頥曰莊姜不得志於夫而無怨夫之意不見禮於兄弟而無絶兄弟之情不見愛於衆妾而無怨衆妾之心而所以自反者惟知心志不可以不專一威儀不可以不閑習使惡我者無得而簡擇怒我者無得以瑕疵亦可謂善自處矣此所以居變風之首也歟増釋許氏曰此詩舊説男子作朱子以為婦人詩盖觀其辭氣而得之而卑順柔弱四言舉一篇大㫖此讀詩凡例也讀詩者每於一詩吟哦上下優㳺涵泳以意隨之而求詩人志之所在庶不負朱子之教也緑兮衣兮緑衣黄裏心之憂矣曷維其已比也緑蒼勝黄之間色黄中央土之正色輯録青黄赤白黑為之正色緑紅碧紫纁為之間色木克土故蒼勝黄間色賤而以為衣正色貴而以為裏言皆失其所也已止也荘公惑於嬖妾輯録荘公楊武公子嬖妾蓋公子州吁之母嬖幸也愛也夫人荘姜賢而失位故作此詩言緑衣黄裏以比賤妾尊顯而正嫡幽微輯録孔氏曰間色為衣而見正色反為裏而隠猶妾䝉寵而顯夫人反見踈而微也使我憂之不能自已也輯録謝氏曰嫡妾易位尊卑不明家不齊則國不治荘姜之心豈但憂一身哉為君憂為君之子憂為國家後日憂其憂何時能止也緑兮衣兮緑衣黄裳心之憂矣曷維其亡比也上曰衣下曰裳記曰衣正色裳間色今以緑為衣而黄者自裏轉而為裳其失所益甚矣幽微已不可卑賤尤不可輯録孔氏曰間色為衣而在上正色為裳而處下猶妾䝉寵而尊夫人反見踈而卑前以表裏喻幽顯此以上下喻尊卑增釋前以掩蔽而言此以倒置而言皆夫人之失位也亡之為言忘也緑兮絲兮女音汝所治平聲兮我思古人俾無訧音尤叶于其反兮比也女指其君子而言也治謂理而織之也俾使訧過也言緑方為絲而女又治之以比妾方少艾而女又嬖之也然則我将如之何哉亦思古人有甞邅此而善處之者以自勵焉使不至於有過而已輯録輔氏曰彼之所為自違悖而我之所為則欲其無過而已此其所以為賢也絺兮綌兮淒七西反其以風叶為愔反我思古人實𫉬我心比也淒寒風也絺綌而遇寒風猶已之過時而見棄也故思古人之善處此者真能先得我心之所求也年有老少則恩有隆替此理之必然無足恠者但思古人而俾無訧則取法於彼以免過也思古人而𫉬我心則彼已同然而過可免矣增釋許氏曰此章之思古人反謂之𫉬我心是在我者處之素定而古人善處此者反得我心之所同然者耳至此豈有一毫怨懟不平之氣哉此莊姜所以為賢也緑衣四章章四句莊姜事見春秋傳此詩無所考姑從序説下三篇同前二章𤼵乎情後二章止乎禮義前二章則觀事勢顛倒而傷其變後二章則察時運盛衰以處其變輯録解頥曰前之憂憂今日遇此而無聊也後之思思古人處此之有道也然古人之處此亦豈有它道哉亦曰安於義命而已矣陳定宇曰不得於夫而不疾其妾惟思古人以自修其身憂而不傷怨而不怒孔子謂詩可以怨其此類也夫燕燕于飛差初宜反池其羽之子于歸逺送于野叶上與反瞻望弗及泣涕如雨興也燕鳦音壹也謂之燕燕者重言之也差池不齊之貌相随而飛一先一後也之子指戴媯也歸大歸也婦人已嫁復歸宗曰大歸大歸者不反之義輯録郊外曰野無聲出涕曰泣莊姜無子以陳女戴媯之子完為已子莊公卒完即位嬖人之子州吁弑之故戴媯大歸于陳輯録左𫝊莊公又娶於陳曰厲媯生孝伯早死其娣戴媯生完是為桓公𨼆公四年州吁弑之厲戴皆諡媯陳姓也而莊姜送之作此詩也彼相隨而不離此逺送而難别意有相類故用起興輯録蘇氏曰禮婦人送迎不出門逺送于野情之所不能已也嚴氏曰風人含不盡之意此但叙離别之恨而子弑國危之戚皆𨼆然在不言之中矣燕燕于飛頡户結反之頏户郎反之之子于歸逺于將之瞻望弗及佇立以泣興也飛而上曰頡飛而下曰頏將送也佇立久立也燕燕于飛下上時掌反其音之子于歸逺送于南叶尼心反瞻望弗及實勞我心興也鳴而上曰上音鳴而下曰下音送于南者陳在衛南頡之頏之飛相上下也下丄其音聲相應和也皆不忍相違之意輯録輔氏曰泣涕如雨初别時也佇立以泣已别而久立以泣也實勞我心既去而思之不忘也仲氏任而今反只音紙其心塞淵叶一均反終温且惠淑慎其身先君之思以勗㐫肉反寡人賦也仲氏戴媯字也以恩相信曰任只語辭塞實淵深終竟温和惠順淑善也塞實則不虚妄淵深則不淺露温和則不剛愎忠順則不乖戻以此淑慎其身可謂賢矣而又相勉以思先君二南之外無此媵妾先君謂莊公也朂勉也寡人寡徳之人莊姜自稱也言戴媯之賢如此又以先君之思勉我使我常念之而不失其守也此章備言嫡媵相與如此以見涕泣勞心之故也輯録疏云仲氏有徳行其心誠實而深逺又終能温和恭順善自謹慎其身内外之徳既如此又於將歸之時以思先君之故勸勉寡人以禮義也楊氏曰州吁之暴桓公之死戴媯之去皆夫人失位不見答於先君所致也而戴媯猶以先君之思勉其夫人真可謂温且惠矣輯錄朱子曰古人文字之美詞氣温和理義精宻如此秦漢以後無此等語某讀詩於此數語讀書至先王肇修人紀至兹惟艱哉深誦歎之又曰譬如畫工傳神一般直是寫得他精神出燕燕四章章六句前三章述已之情後一章美媯之徳輯録解頥曰余讀是詩未甞不歎莊公之狂惑也使其翻然悔悟立莊姜以為之主俾戴媯以為之助則閨門正矣立子完以為之嫡命石蜡以為之輔則國本定矣若州吁者可教則姑教之不可教則去之夫如是則衛非今日之衛即康叔武公之衛矣顧乃以寵奪正以孽奪宗卒貽國家無窮之禍不謂之狂惑而可乎日居月諸照臨下土乃如之人兮逝不古處昌吕反胡能有定寜不我顧叶果五反賦也日居月諸呼而訴之也之人指莊公也逝𤼵語辭古處未詳或云以古道相處也輯録王氏曰不以古夫婦之道處我胡寜皆何也莊姜不見答於莊公故呼日月而訴之言日月之照臨下土久矣今乃有如是之人而不以古道相處輯録輔氏曰觀緑衣之詩所謂我思古人則於此歎荘公不以古道處已者宜也自處以古人為法而望人以古道處已莊姜之處已望人皆有則矣是其心志囬惑亦何能有定哉而何為其獨不我顧也見棄如此而猶有望之之意焉此詩人所以為厚也輯録四胡有定期之之辭謂今其心囬惑何時而能定乎此莊姜忠厚之意也朱子説是已然之辭通釋曰每章章末二句皆有望之之意日居月諸下土是冒乃如之人兮逝不相好呼報反胡能有定寜不我報賦也冒覆也報答也日居月諸出自東方乃如之人兮徳音無良胡能有定俾也可忘賦也日旦必出東方月望亦出東方徳音美其辭無良醜其實也雖若美而實則醜矣俾也可忘言何獨使我為可忘者耶莊姜之賢可親不可忘者也而莊公忘之何哉日居月諸東方自出父兮母兮畜我不卒胡能有定報我不述賦也畜養卒終也不得其夫而歎父母養我之不終蓋憂患疾痛之極必呼父母人之至情也增釋呼日月而訴之猶未極其情呼父母而訴之其憂患之情極其至也述循也言不循義理也始責其不以古道處我終責其不循義理以報我性情之厚而𤼵於正者也報我不述於終風首章可見日月四章章六句呼日月而怨其夫則又望焉者也呼日月而怨父母則絶意於夫無所望也此詩當在燕燕之前下篇放此終風有惠來之時則公猶未絶於姜也栢舟有往愬之語則姜猶冀夫兄弟之助已也緑衣思古人日月呼父母則無可柰何亦已而已四詩次第當然終風且暴顧我則笑叶音燥謔許約反浪笑敖五報反中心是悼比也終風終日風也暴疾也謔戯言也浪放蕩也悼傷也莊公之為人狂蕩暴疾莊姜盖不忍斥言之故但以終風且暴為比言雖其狂暴如此然亦有顧我則笑之時但皆出於戯慢之意而無愛敬之誠輯録顧我則笑是不禮其夫人而不能相敬如賓可見矣則又使我不敢言而心獨傷之耳盖莊公暴慢無常而莊姜正静自守所以忤其意而不見答也輯録忤音悞逆也違戾也終風且霾亡皆反叶音貍惠然肯來叶如字又陵之反莫往莫來悠悠我思叶新才新齎二反比也霾雨去聲土䝉霿音茂又音夢也輯録爾雅曰大風揚塵土從上而下也惠順也悠悠思之長也終風且霾以比莊公之狂惑也雖云狂惑然亦或惠然而肯來輯録毛氏曰時有順心也但又有莫往莫來之時則使我悠悠而思之望其君子之深厚之至也終風且曀於計反不日有曀寤言不寐願言則嚏都麗反比也隂而風曰曀有又也輯録古有又通不日有曀言既曀矣不旋日而又曀也亦比人之狂惑暫開而復蔽也願思也嚏鼽音仇嚏也輯録禮記月令民多鼽嚏陳氏曰􅍠者氣室於鼻嚏者聲出於口皆肺疾也人氣感傷閉欎又為風霿所襲則有是疾也輯録輔氏曰寤則憂而不能寐思之則感傷氣閉而成疾其憂危甚矣曀曀其隂虺虺其靁寤言不寐願言則懐叶胡揋反比也曀曀隂貌虺虺靁將𤼵而未震之聲輯録吕氏曰驟雨迅雷其止可待至於曀曀之隂虺虺之雷則殊未有開霽之期也以比人之狂惑愈深而未巳也比不日有曀為尤甚懐思也終風四章章四句説見上始則怨其愛之不誠次則怨其來之不繼始則怨其迷惑之不悟終則怨其迷惑之漸深輯録許氏曰莊姜賢夫人也所思者大矣國君及夫人父母一國而國人作則者也莊公無君人儀度其曰終風且暴曰霾曀隂雷曰謔浪笑傲為君如此果足正一國乎夫人賢而不見答果足以示人齊家之道乎國君之家不齊則一國之家不齊一國之家不齊則國殆矣夫人之中心是悼悠悠之思寤而不寐願言而嚏而懐所思者大矣非情欲之謂也儻莊姜為思情欲之人則謔浪笑傲而必喜隂曀虺雷而必怒矣解頥曰變風之始於莊姜何也曰婦人夫其所天也以夫則狂惑妾其所使也以妾則上僣子其所特頼以終身也以子則暴而無禮莊姜之處此亦難矣雖遭人倫之變而不失乎天理之常則莊姜亦賢矣哉是可以為處變者之法矣擊鼓其鏜叶當反踊躍用兵叶晡芒反土國城漕我獨南行叶户郎反賦也鏜擊鼓聲也踊躍坐作擊刺之狀也兵謂戈㦸之属土土功也國國中也漕衛邑名輯録漕鄘地也在河南増釋鄱陽張氏曰西征記今白馬城衛之漕邑今滑州白馬縣衛人從軍者自言其所為因言衛國之民或役土功於國或築城於漕而我獨南行有鋒鏑死亡之憂輯録鋒兵端也鏑音滴矢鋒也危苦尤甚也此章言其啓行之事而怨之輯録李迂仲曰土國城漕非不勞苦而獨處於境内今我之在外死亡未可知也鄭氏曰南行從軍南行伐鄭從孫子仲平陳與宋不我以歸憂心有忡敕中反叶敕衆反賦也孫氏子仲字時軍帥也平和也合二國之好也輯録胡氏曰必先和陳宋而後進兵也舊説以此為春秋𨼆公四年州吁自立之時宋衛陳蔡伐鄭之事恐或然也輯録左傳隠公四年衛州吁弑桓公而自立將修先君之怨於鄭而求寵於諸侯使告於宋曰君若伐鄭以除君害君為主敝邑以賦與陳蔡從宋人許之夏宋陳蔡衛伐鄭圍其東門五日而還秋四國復伐鄭敗鄭徒兵取其禾而還朱子曰圍鄭五日而還出兵不為久而怨之如此者自犯大逆衆叛親離莫肯為之用者矣以猶與也言不與我而歸也此章本其啓行之故而怨之爰居爰處爰䘮息浪反其馬叶滿補反于以求之于林之下叶後五反賦也爰於也於是居於是處於是䘮其馬而求之於林下見其失伍離次無闘志也此章陳其怠慢之狀而怨之死生契舌結反闊叶苦劣反與子成説執子之手與子偕老叶魯吼反賦也契闊隔逺之意成説謂成其約誓之言從役者念其室家因言始為室家之時期以死生契闊不相忘棄又相與執手而期以偕老也此章述其室家之情而怨之于音吁下同嗟闊叶苦劣反兮不我活叶户劣反兮于嗟洵音荀兮不我信叶師人反兮賦也于嗟歎辭也闊契闊也活生洵信也信與申同言昔者契闊之約如此而今不得活偕老之信如此而今不得伸意必死亡不復得與其室家遂前約之信也此章極其室家之思而怨之擊鼓五章章四句輯録解頥曰役土功於國者此民也築城於漕者亦此民也南行而平陳與宋者又此民也先王之於民也不得已而用之則必先其所急後其所緩未聞衆役並興罷民之力以逞已之志若斯之甚者也是亦可謂忍矣其卒至於敗亡也宜哉凱風自南叶尼心反吹彼棘心棘心夭夭於驕反母氏劬勞叶音僚比也南風謂之凱風長養萬物者也棘小木叢生多刺難長而心又其稚弱而未成者也輯録許氏曰字書棘如棗而多刺木堅色赤叢生白色為白棘實酸者為樲棘夭夭少好貌劬勞病苦也衛之淫風流行雖有七子之母猶不能安其室故其子作此詩以凱風比母棘心比子之㓜時此章言母不言子是直以凱風比母棘心比子之㓜時也盖曰母生衆子㓜而育之其劬勞甚矣輯録嚴氏曰棘至夏始生凱風南來吹彼稚弱之棘心至於夭天然少好則風之為力多矣比母以慈愛之情養我七子之身至於少長則母亦當苦矣母之養子於少時最勞苦本其始而言以起自責之端也凱風自南吹彼棘薪母氏聖善我無令人興也輯録通釋曰上章言凱風棘心而下句無應故属比此章言風與棘而下文以母與子應故屬興二章相似而不同也聖叡令善也棘可以為薪則成矣然非美材故以興子之壯大而無善也此章言母氏又言子則是以凱風興母棘心興子盖美惡之不相類為興復以聖善稱其母而自謂無令人其自責也深矣輯録劉執中曰自言七子之中有一令善之入則母亦不舍之而去爰有寒泉在浚之下叶後五反有子七人母氏勞苦興也浚衛邑増釋鄱陽張氏曰寒泉在濮州濮陽縣東南水經注濮水枝津東逕浚城南而北去濮陽三十五里城側有寒泉岡即詩寒泉浚下浚都陳留曰浚儀諸子自責言寒泉在浚之下猶能有所滋益於浚而有子七人反不能事母而使母至於勞苦乎泉有益浚之理人無事母之能人不如物所以為興於是乃若微指其事而痛自刻責以感動其母心也母以淫風流行不能自守而諸子自責但以不能事母使母勞苦為詞輯録孔氏曰此謂母今日勞苦思嫁與上章劬勞不同也婉詞㡬諌增釋鄱陽張氏曰事父母㡬諌㡬微也内則篇父母有過下氣怡色柔聲以諌也不顯其親之惡可謂孝矣下章放此睍胡顯反睆華板反黄鳥載好其音有子七人莫慰母心興也睍睆清和圎轉之意言黄鳥猶能好其音以恱人而我七子獨不能慰恱母心哉此亦以人不如物起興凱風四章章四句一章起自責之端二章極自責之義三章四章主於自責而有微諷之意焉免凱風親之過小者也然以他人言之則不乎怨而其子之負罪引慝如此但小弁其一時發見之良心耳此則真誠實意哀痛懇切欲以感悟其親二詩不能無間也雄雉于飛泄泄移世反其羽我之懐矣自詒伊阻興也雉野雞雄者有冠長尾身有文采善鬭泄泄飛之緩也懐思詒遺去聲阻隔也婦人以其君子從役于外故言雄雉之飛舒緩自得如此而我之所思者乃從役於外而自遺阻隔也物得自由人不如物故以起興輯録輔氏曰我之懐矣指其夫也自詒伊阻不以怨人也雄雉于飛下上時掌反其音展矣君子實勞我心興也下上其音言其飛鳴自得也展誠也言誠又言實所以甚言此輯録此字或作其字君子之勞我心也上章托物為君子之行役勞苦而起興此章托物為己之思念勞役而起興也輯録輔氏曰言有盡而意無窮也瞻彼日月悠悠我思叶新齎反道之云逺曷云能來叶陵之反賦也悠悠思之長也見日月之往來而思其君子從役之久也輯録鄭氏曰視日月之行迭往迭來今君子獨久行役而不來使我心悠悠然思之百爾君子不知徳行下孟反叶户郎反不忮之豉反不求何用不臧賦也百猶凡也忮害求貪臧善也言凡爾君子豈不知徳行乎若能不忮害又不貪求仁則不忮義則不求此則所謂德行也則何所為而不善哉憂其逺行之犯患冀其善處而得全也思君子之詩多矣而未有及於徳行者此雄雉所以為最賢也輯録吕氏曰思其君子之切而知其未得歸也於是自解曰凡百君子但不忮害不貪求則何所用而不善錐久處軍旅之間固無患也胡氏曰此亦𤼵乎情止乎禮義之意雄雉四章章四句前三章極思之之心後一章致願之之意輯録解頥曰此詩則雖思之之切是亦情之正也惟其思之也切故其憂之也深惟其憂之也深故其勉之也至噫不忮不求此孔門克己之術求仁之方而行役之婦人能言之其亦可謂賢也已此其所以為先王之遺澤也歟匏有苦葉濟有深渉深則厲淺則揭苦例反比也匏瓠音䕶也輯録埤雅曰長而瘦上曰瓠短頸大腹曰匏盖匏苦而瓠甘復有長短之殊非一物也匏之苦者不可食特可佩以渡水而已然今尚有葉則亦未可用之時也輯録范氏曰深則厲共葉枯落然後乾之佩以渡水濟渡處也行渡水曰渉以衣而渉曰厲水自帶已上至心曰厲渡水不祼體故著裏衣而渡也褰音騫衣而渉曰掲輯録爾雅曰繇膝以下為掲繇膝以上為渉繇帶以上為厲繇自也此刺淫亂之詩言匏未可用輯録尚未可用為浮渡之器而渡處方深行者當量其淺深而後可渡以比男女之際亦當量度禮義而行也輯録范氏曰深則厲淺則掲宜斟酌也若不顧禮義猶不度水之深淺而欲濟也有瀰彌爾反濟盈有鷕以小反雉鳴濟盈不濡軌居美反叶居有反雉鳴求其牡比也瀰水滿貌鷕雌雉聲軌車轍也車輪輾地處為轍飛曰雌雄走曰牝牡夫濟盈必濡其轍雉鳴當求其雄此常理也今濟盈而曰不濡軌雉鳴而反求其牡輯録竹房張氏曰走曰牝牡此爾雅釋獸之正例諸家以牝雞雄狐為證言飛走通也殊不識詩人之意曰當濡其轍今乃不濡其轍迹是大可怪也當求其維今乃求其牡獸是大異常也如此歌之則得詩人之意知集𫝊之㫖也以比淫亂之人不度禮義非其配耦而犯禮以相求也輯録解頥曰禮有節文義有裁制禮其體也義其用也棄禮則必至於妄作違義則必至於妄求此淫亂之人所以逆埋犯分而不顧也増釋吳師道曰此章盈鳴此句中冇韻朱子謂之腰韻説見九罭公歸鴻飛下雝雝鳴鴈叶魚旰反旭許玉反日始旦士如歸妻迨氷未泮賦也雝雝聲之和也鴈鳥名似鵞畏寒秋南春北旭日初出貌昏禮納采用鴈輯録娶妻之禮以昏為期因名禮必以昏者取陽往隂來之義也納其采擇之禮用鴈為摯者取其順隂陽往來之義六禮唯納徴用幣餘皆用鴈程子曰取其不再偶也親迎去聲以昏而納采請期以旦歸妻以氷泮而納采請期迨氷未泮之時輯録注納采問名納吉納徴請期皆用昕唯親迎用昏用昕使者用昏壻也所謂氷泮即仲春時也言古人之於婚姻其求之不暴輯録暴横猝也急也而節之以禮如此以深刺去聲淫亂之人也陳古義以刺今此章可以當之招招照遥反舟子叶奬里反人渉卬五郎反否叶補美反人渉卬否卬須我友叶羽軌反比也招招號音毫召之貌舟子舟人主濟渡者卬我也舟人招人以渡人皆從之而我獨否者待我友之招而後從之也以比男女必待其配耦而相從而刺此人之不然也匏有苦葉四章章四句一章言事適其可為宜二章言物反其常為恠三章言古禮不可悖四章言非類不可從度増釋許氏曰此詩一章以水喻禮渉是徒歩水之名水淺可渉則是合禮而可行者也水深險而不可渉則是非禮而不可行者也今濟處有深渉是不可渉者也况匏尚未可為浮渡之器乎以比非禮絶不可行之事是指淫亂而言也然於可渡處又當分擇深淺以厲以掲比事有合禮可行而又須擇義謂雖於禮可成男女之好又擇義而行之可也大抵四句作兩截㸔深渉之深非深厲之深深渉是水大深而不可渉者下靣是水可渉而又就其中度淺深而揭厲也二章正刺不度禮義非其配偶犯禮相求濟盈不濡軌應一章下兩句雉鳴求其牝應一章上兩句三章言昏禮之正即深厲淺揭之意而濟盈不濡意軌之反四章言非類不可從是濟冇深渉之而雉鳴求其牡之反習習谷風以隂以雨黽勉同心不宜有怒叶暖五反采葑孚容反采菲妃鬼反無以下體徳音莫違及爾同死川想止反比也習習和舒也東風謂之谷風輯録毛氏曰隂陽和而谷風生葑蔓音萬菁音精也菲似葍音福莖麄葉厚而長有毛下體根也輯録釋文今菘菜也江南有菘江北有蔓菁相似而異菲葍類爾雅謂菜河内謂蓿菜皆可食之物也葑菲根莖皆可食而其根則有時而美惡徳音美譽也婦人為夫所棄故作此詩以叙其悲怨之情言隂陽和而後雨澤降如夫婦和而後家道成故為夫婦者當黽輯録黽勉也勉以同心而不宜至於有怒又言采葑菲者不可以其根之惡而棄其莖之美如為夫婦者不可以其顔色之衰而棄其徳音之善但徳音之不違則可以與爾同死矣此章正言夫婦之道行道遲遲中心有違不逺伊邇薄送我畿音祈誰謂荼音徒苦其甘如薺音泚宴爾新昏如兄如弟待禮反賦而比也遲遲舒行貌違相背也畿門内也荼苦菜蓼属也詳見良耜薺甘菜宴樂也新昏夫所更娶之妻也言我之被棄行於道路遲遲不進盖其足欲前而心有所不忍如相背然而故夫之送我乃不逺而甚邇亦至其門内而止耳又言荼雖甚苦反甘如薺以比已之見棄其苦有甚於荼而其夫方且宴樂其新昏如兄如弟而不見恤盖婦人從一而終今雖見棄猶有望夫之情厚之至也此章見棄之時不忍絶意於夫而夫則絶意於已也輯録通釋曰此章上四句賦其望夫之意而及其夫之薄情下四句則比已之甚苦而嘆其夫之方樂涇以渭濁湜湜音殖其沚音止宴爾新昏不我屑以毋逝我梁毋𤼵我笱古口反我躬不閲遑恤我後胡口反比也涇渭二水名涇水出今原州百泉縣笄頭山東南至永興軍髙陵入渭渭水出渭州渭源縣鳥䑕山至同州馮翊縣入河輯録呂氏曰詩人多述土風以衛詩而逺引涇渭者盖取其清濁之意而比之耳原州百泉縣今平涼府鎮原縣永興軍髙陵今西安府髙陵縣渭州渭源縣今平涼府渭源縣同州馮翊縣今西安府同州地並𨽻陜西湜湜清貌沚水渚也屑潔以與逝之也梁堰音宴石障水而空音控其中以通魚之往來者也笱以竹為器而承梁之空以取魚者也閲容也涇濁渭清然涇未屬渭之時雖濁而未甚見由二水既合而清濁益分然其别出之渚流或稍緩則猶有清處婦人以自比其容貌之衰久矣又以新昏形之益見憔悴然其心則固猶有可取者但以故夫之安於新昏故不以我為潔而與之耳又言毋逝我之梁毋𤼵我之笱以比欲戒新昏毋居我之處毋行我之事而又自思我身且不見容何暇恤我已去之後哉知不能禁而絶意之辭也此章言已之容貌雖衰而徳猶可取者然夫既絶意於已則已無可柰何矣在已且然况暇為新婚計哉輯録輔氏曰不忍遂棄其家事者仁也知其不能禁而絶意焉者知也就其深矣方之舟之就其淺矣泳之游之何有何亡黽勉求之凡民有䘮匍音蒲匐蒲北反救叶居尤反之興也方桴舟船也潜行曰泳浮水曰游輯録通釋曰泳與㳺今俗所謂迷與泅也匍匐手足並行急遽之甚也輯録説文曰匍手行也匐伏地也婦人自陳其治家勤勞之事言我隨事盡其心力而為之深則方舟淺則泳游不計其有與亡而勉強以求之人之濟水必量淺深我之治家不計有無謂以處事之道反相因為興可也但集𫝊釋興體無此例疑興字當作比字而深則方舟之上有如字輯録孔氏曰隨水深淺期於必渡猶隨事難易期於必成不問貧富吾皆盡力求之又周睦其隣里鄉黨莫不盡其道也此章則皆自許之辭言其不當見棄不我能慉許六反反以我為讎既阻我徳賈音古用不售市救反叶市周反昔育恐育鞠居六反及爾顛覆芳服反既生既育比予于毒賦也慉養阻却鞠窮也承上章言我於女家勤勞如此而女既不我養而反以我為仇讎惟其心既拒却我之善故雖勤勞如此而不見取如賈之不見售也輯録説文售賣去手也因念其昔時相與為生惟恐其生理窮盡而及爾皆至於顛覆今既遂其生矣乃反比我於毒而棄之乎張子曰育恐謂生於恐懼之中育鞠謂生於困窮之際亦通此章言故夫棄我之確然如此患難相保安樂相違可怨也谷風之婦人前以徳音自許後以我徳自許觀其經營於内周恤於外困窮不陷渉險而亨則其所以自許者誠不為過矣輯録李氏曰正所謂將恐將懼惟予與汝將安將樂汝轉棄予是也我有㫖蓄勅六反亦以御魚吕反下同冬宴爾新昏以我御窮有洸音光有潰户對反既詒我肄羊至反不念昔者伊余來塈興也㫖美蓄聚御當也洸武貌潰怒色也輯録項氏曰洸水涌也其勇如水涌水之潰者其𫝑横暴而四出故怒之盛者為潰肄勞塈息也又言我之所以蓄聚美菜者盖欲以禦冬月乏無之時至於春夏則不食之矣今君子安於新昏而厭棄我是但使我禦其窮苦之時至於安樂則棄之也物可棄陳而取新夫婦不可圗新而厭舊也此以處置事理不同為興又言於我極其武怒而盡遺我以勤勞之事曽不念昔者我之來息時也追言其始見君子之時接禮之厚怨之深也初以安逸與我後以勤勞遺我何終始之不相似也此章又承上章之意而怨其有始無卒也谷風六章章八句輯録朱子曰㸔詩義理外更好㸔他文章且如谷風他只是如此説出來然而序得事曲折先後皆有次序而今費盡氣力去做後尚做得不好輔氏曰觀此一詩比物連類因事興詞條理秩然有序勤而不怨怨而不怒玩而味之可謂賢婦人矣而見棄於夫者亦獨何哉解頥曰谷風雖棄婦所作而觀其自叙有治家之勤有睦隣之善有安貧之志有周急之義皆其節之可取者也至於見棄矣而拳拳忠厚之意猶藹然溢於言辭之表則是初無可棄之罪也徒以其夫之安於新昏不以為潔而棄之耳然其言之有序而不廹如此殆庶㡬乎夫子所謂可與怨者矣式微式微胡不歸微君之故胡為乎中露賦也式𤼵語辭微猶衰也再言之者言衰之甚也輯録范氏曰諸侯失國而寄於他國之邑㣲莫甚焉故郭璞註云言至㣲也㣲猶非也中露露中也言有露濡之辱而無所芘覆音阜也舊説以為黎侯失國而寓於衛輯録鄭氏曰寓寄也黎侯為狄人所逐棄其國而寄於衛增釋鄱陽張氏曰黎氏故國或云黎山氏國子諸侯爵即西伯所戡者與紂都接今潞州東十八里有故黎侯城有黎亭其臣勸之曰衰㣲甚矣何不歸哉我若非以君之故則亦胡為而辱於此哉増釋許氏曰此詩兩章上二句勸歸之辭下二句怨辭也晏子曰君為社稷死則死之為社稷亡則亡之若為已死已亡非其私䁥誰敢任之今曰㣲君之故又曰㣲君之躬以黎侯有為已亡之意盖黎侯必有不君致亂之階而召狄故其謂所以濡於中露陷於泥中者為君之躬故耳否則主危臣憂主辱臣死又何有胡為乎之怨乎式㣲式㣲胡不歸㣲君之躬胡為乎泥中賦也泥中言有陷溺之難而不見拯救也式㣲二章章四句泥中之禍甚於中露之辱此無所考姑從序説衛有他國之詩六篇式㣲旄丘河廣作於衛者也載馳泉水竹竿為衛而作者也作於衛者衛國之所録為衛而作者衛國之所傳况黎許國小宋無風泉水竹竿不知出何國列於衛何恠乎旄丘之葛叶居謁反兮何誕徒旱反之節兮叔兮伯叶音逼兮何多日也興也前髙後下曰旄丘誕闊也叔伯衛之諸臣也舊説黎之臣子自言久寓於衛時物變矣故登旄丘之上見其葛長大而節踈闊因託以起興曰旄丘之葛何其節之闊也衛之諸臣何其多日而不見救也因所見則若偶然者但節之踈闊日之久逺義亦相因故用其語相呼而為興此詩本責衛君而但斥其臣可見其優柔而不迫也輯録輔氏曰本責衛君而但斥其臣望之雖切而其辭益緩真可見其温柔寛厚之情也何其處也必有與也何其久也叶舉里反也必有以也賦也處安處也與與國也與猶黨與也相與和好之國曰與國以他故也因上章何多日也而言何其安處而不來意必有與國相俟而俱來耳又言何其久而不來意其或有他故而不得來耳詩之曲盡人情如此狐裘䝉戎匪車不東叔兮伯兮靡所與同賦也大夫狐蒼裘䝉戎亂貌言弊也又自言客久而裘弊矣豈我之車不東告於女乎但叔兮伯兮不與我同心雖往告之而不肯來耳至是始㣲諷切之或曰狐裘䝉戎指衛大夫而譏其憒音㑹亂之意匪車不東言非其車不肯東來救我也但其人不肯與俱來耳其人大夫所與之人也今按黎國在衛西前説近是黎國注見前式㣲章下𤨏素果反兮尾兮流離之子叶奬里反叔兮伯兮褎由救反如充耳賦也𤨏細尾末也流離漂散也褎多笑貌充耳塞耳也耳聾之人恒多笑言黎之君臣流離𤨏尾若此其可憐也而衛之諸臣褎然如塞耳而無聞何哉至是然後盡其詞焉流離患難之餘而其言之有序而不廹如此其人亦可知矣旄丘四章章四句一章恠之二章疑之三章㣲諷之四章直責之説同上篇式㣲處困而思奮旄丘責人而不刻可謂賢矣簡兮簡兮方將萬舞日之方中在前上處賦也簡簡易不恭之意萬者舞之總名輯録何休云舞謂之萬者象武王以萬人定天下民樂之故名之商頌亦曰萬舞有奕殷亦以武定天下武用干戚文用羽籥也輯録吕氏曰萬舞二舞之總名干舞者武舞之别名籥舞者文舞之别名也文舞又謂之羽舞又䟽言干則有戚禮記朱干玉戚冕而舞大武言籥則有羽籥師教國子舞羽吹籥又禮書干盾也以革為之其背曰瓦設鍚朱質而繪以龍龍之外又繪以雜羽其繫之也以繡韋其属繡韋以紛戚斧也玉戚以玉飾其柄柯長三尺愽三寸厚一寸有半五分其長以其一為之首錫音陽白金也紛音分如緩又樂書羽舞者翟羽可用為儀執以之以所以為蔽翼者也日之方中在前上處言當明顯之處賢者不得志而仕於伶官輯録鄭氏曰伶氏世掌樂官而善焉故後世號樂官為伶官有輕世肆志之心焉故其言如此若自譽而實自嘲也輯録輔氏曰此章既自以為簡易次章又自以為碩人只此便可見其為不恭也當明顯之處公然為此而不以為辱亦是不恭之意與此章所謂公庭萬舞同先生謂其若自譽而實自嘲者深得其㫖也碩人俁俁疑矩反公庭萬舞有力如虎執轡如組音祖賦也碩大也俁俁大貌轡今之韁也組織絲為之言其柔也御能使馬則轡柔如組矣人馬皆從容不急廹故轡柔如此又自譽其才之無所不備亦上章之意也左手執籥余若反右手秉翟亭歴反叶直角反赫如渥於角反赭音者叶陟畧反公言錫爵賦也執籥秉翟者文舞也籥如笛而六孔或曰三孔翟雉羽也赫赤貌渥厚漬也赭赤色也言其顔色之充盛也公言錫爵即儀禮燕飲而獻工之禮也工告樂備主人獻工所以勞之也輯録燕禮主人洗升獻工工不興左瑟一人拜受爵主人西階上拜送爵又鄉飲酒鄉射大射儀皆有獻工之禮以碩人而得此則亦辱矣乃反以其賚予音與之親洽為榮而誇美之亦玩世不恭之意也輯録玩戯也弄也輔氏曰意唯輕之是以玩之志唯肆焉故不恭也山有榛側巾反隰有苓音苓云誰之思西方美人彼美人兮西方之人兮興也榛似栗而小下濕曰隰苓一名大苦葉似地黄即今甘草也輯録爾雅曰蘦大苦諸本作大葉誤也葉字上下無所属當為衍文昭武黄氏曰甘而言苦者古人語倒西方美人託言以指西周之盛王如離騷亦以羙人目其君也以彼所有之物興此所無有之人輯録目猶稱也又曰西方之人者歎其逺而不得見之辭也賢者不得志於衰世之下國而思盛際之顯王故其言如此而意逺矣此章乃見不恭之情實夫其所思者在西方之羙人則當世人君無有可其意者故玩之如此簡兮四章三章章四句一章六句一章自譽其位處二章自譽其才備三章自譽其勞寵四章乃言其情實而有欎欎之意焉舊三章章六句今改定張子曰為禄仕而抱關擊柝輯録音託夜行所擊木也則猶恭其職也為伶官則雜於侏儒俳優之間輯録侏儒短人也俳音排戱也優倡也漢書談笑類俳倡不恭甚矣其得謂之賢者雖其迹如此而其中固有以過人又能卷而懐之是亦可以為賢矣東方朔似之輯録許氏曰侏儒俳優盖亦衰世用之非樂中所當用者今按儀禮中之歌詩用樂則侏儒徘優誠無所用竊恐許氏之説或有補於張子之意也姑存之毖悲位反彼泉水亦流于淇有懐于衛靡日不思叶新齎反孌力轉反彼諸姬聊與之謀叶謨悲反興也毖泉始出之貌泉水即今衛州共音恭城之百泉也淇水出相去聲州林慮音閭縣輯録相州林慮縣今河南彰徳府林縣東流泉水自西北而東南來注之孌好貌諸姬謂姪娣也衛女嫁於諸侯父母終思歸寜而不得故作此詩言毖然之泉水亦流于淇矣我之有懐于衛則亦無日而不思矣泉水流淇不易其地女心思衛不忘共慮彼此皆有定向也故以為興是以即諸姬而與之謀為歸衛之計如下兩章之云也輯録輔氏曰讀首章四句便可見其思歸之心凡人之情營私背公故不詢謀惟恐人之或知也衛女思歸愽謀於諸姬而無所隠則其情之正大可知矣出宿于泲子禮反飲餞音踐于禰乃禮反女子有行逺于萬反父母兄弟待禮反問我諸姑遂及伯姊川奬禮反賦也泲地名飲餞者古之行者必有祖道之祭祭畢處者送之飲於其側而後行也輯録禮記曽子問曰道而出陳氏曰祖祭道神而後出行也孔氏曰此無言出宿者見飲餞為出宿而設也禰亦地名皆自衛來時所經之處也諸姑伯姊即所謂諸姬也言始嫁來時則固已逺其父母兄弟矣此篇之㫖在逺父母兄弟二句竹竿亦然况今父母既終而復可歸哉是以問於諸姑伯姊而謀其可否云耳鄭氏曰國君夫人父母在則歸寜没則使大夫寜於兄弟出宿于干叶居焉反飲餞于言載脂載牽胡瞎反叶下介反還音旋車言邁遄市専反臻于衛此字本與邁害叶今讀誤不瑕有害賦也千言地名適衛所經之地也脂以脂膏塗其牽使滑澤也舝車軸也不駕則脱之設之而後行也輯録舝與轄同車軸頭鐵也還回旋也旋其嫁來之車也遄疾臻至也瑕何古音相近通用言如是則其至衛疾矣然豈不害於義理乎疑之而不敢遂之辭也此章出宿飲餞與上章不同上章是嫁來之時如此此章是旋反於衛則如此我思肥泉兹之永歎叶它㳙反思須與漕叶沮侯反我心悠悠駕言出逰以寫我憂賦也肥泉水名輯録爾雅歸異出同肥注引毛𫝊曰所出同所歸異也集𫝊不取只云水名須漕衛邑也悠悠思之長也寫除也輯録嚴氏曰寫者傾而除之既不敢歸然其思衛地不能忘也安得出游於彼而寫其憂哉輯録問此只是因思歸不得故欲出逰于國以寫其憂否朱子曰夫人之逰亦不可輕出只是思逰於彼地耳輔氏曰思歸寜者思之正也謀及姪姊謀之正也恐害義理而卒於不歸事之正也始終一出於正雖賢士且難之况婦人乎泉水四章章六句一章思歸而欲與决其疑二章三章致問而得與决其疑四章則疑已决而不忘也楊氏曰衛女思歸發乎情也其卒也不歸止乎禮義也聖人著之於經以示後世使知適異國者父母終無歸寜之義則能自克者知所處矣輯録朱子曰觀楊氏之説則知聖人以詩為教之意深矣出自北門叶眉貧反憂心殷殷終窶其矩反且貧莫知我艱叶居銀反已焉哉叶將共反下同天實為之謂之何哉比也北門背陽向隂陽明隂暗北門所以喻昏亂之朝也殷殷憂也窶者貧而無以為禮也有大夫士之位斯冇大夫士之禮禄不稱位則無以為禮矣輯録李氏曰衛臣終窶且貧不見知於君也非専較廪禄之厚薄也衛之賢者處亂世事暗君不得其志故因出北門而賦以自比輯録問只作賦説如何朱子曰當作賦而比當時必欲出北門而後作此詩亦有比意思又歎其貧窶人莫知之而歸之於天也輯録輔氏曰終者已焉之辭盖自以為無復冇望也故歎之曰已焉哉天實為之謂之何哉此盖知其無可柰何而歸之於天也是亦所謂發乎情止乎禮義者也王事適我政事一埤避支反益我我入自外室人交徧讁知革反叶竹棘反我已焉哉天實為之謂之何哉賦也王事王命使為之事也適之也輯録適之皆至也政事其國之政事也天子所命則王事也一猶皆也埤厚室家讁責也王事既適我矣政事又一切以埤益我其勞如此而窶貧又甚室人至無以自安而交徧讁我則其困於内外極矣輯録范氏曰關雎之化行則婦人能閔其君子至於衰世則室家日見而有不知其心者增釋許氏曰外不見知於君而不得行其志内為窶貧之故而有室人之讁困於内外極矣乃一歸之於天非知命樂義之君子能如是乎王事敦叶都回反我政事一埤遺唯季反叶夷回反我我入自外室人交徧摧徂回反我已焉哉天實為之謂之何哉賦也敦猶投擲也遺加摧沮也北門三章章七句前一章歎其貧窶而安於命後二章嘆其貧窶勞苦而安於命楊氏曰忠信重禄所以勸士也衛之忠臣至於窶貧而莫知其艱則無勸士之道矣仕之所以不得志也先王視臣如手足豈有以事投遺之而不知其艱哉然不擇事而安之無懟憾之辭輯録莊子人間世云夫事其君者不擇事而安之忠之盛也知其無可柰何而歸之於天所以為忠臣也輯録輔氏曰楊氏之説其論君臣之道備矣而衛之忠臣則處其變而不失其道者可以為萬世臣子之法也北風其凉雨于付反雪其雱普康反惠而好呼報反下同我攜手同行叶户郎反其虚其邪音徐下同既亟只音紙下同且子餘反下同比也北風寒凉之風也凉寒氣也雱雪盛貌惠愛行去也虚寛貌邪一作徐緩也亟急也只且語助辭言北風雨雪以比國家危亂將至而氣象愁慘也故欲與其相好之人去而避之且曰是尚可以寛徐乎彼其禍亂之廹已甚而去不可不速矣北風其喈音皆叶居奚反雨雪其霏芳非反惠而好我攜手同歸其虚其邪既亟只且比也喈疾聲也霏雨雪分散之狀輯録謝氏曰北風怒而有聲不止於凉矣雨雪霏霏而宻不止於雱矣喻禍害愈急也歸者去而不反之辭也莫赤匪狐莫黒匪烏惠而好我攜手同車其虚其邪既亟只且比也狐獸名似犬黄赤色烏鵶黒色皆不祥之物人所惡見者也所見無非此物輯録無非訓莫匪字則國將危亂可知不良之人不善之政不美之俗皆不祥而可惡者也増釋此章則見國將危亂而氣象愁慘猶若惡見其不祥之物也同行同歸猶賤者也同車則貴者亦去矣勢已漸而廹輯録謝氏曰謂一節急一節風人之法度也北風三章章六句同行則去危同歸則就安同車則二者之意兼之矣北門之處困忠臣也北風之去亂智者也又北風與魏風十畆之間相似然彼則其意舒其辭緩猶之可也此則危廹已甚明夷之飛將垂其翼矣靜女其姝赤朱反俟我於城隅愛而不見搔蘇刀反首踟直知反蹰直誅反賦也靜者閒雅之意姝美色也輯録此淫奔者自相稱美之詞非真閒雅也城隅幽僻之處不見者期而不至也踟蹰猶躑躅也輯録踟蹰行不進貌躑躅跳貌此淫奔期㑹之詩也靜女其孌貽我彤徒冬反管叶古兖反彤管有煒于鬼反説音悦懌音亦女羙賦也孌好貌於是則見之矣彤管未詳何物盖相贈以結殷勤之意耳輯録殷勤委曲貌煒赤貌言既得此物而又恱懌此女之羙也自牧歸荑徒兮徒計二反洵羙且異夷曵二音匪女音汝之為羙羙人之貽與異同賦也牧外野也輯録郊外謂之牧牧外謂之野歸亦貽也荑茅之始生者洵信也女指荑而言也言静女又贈我以荑而其荑亦羙且異然非此荑之為羙特以羙人之所贈故其物亦羙耳輯録許氏曰首言城隅末言自牧盖不特逐於城隅抑且相逐於野靜女三章章四句一章未見之時二章胥㑹之時三章既㑹而歸之時新臺有泚此禮反河水瀰瀰莫邇反燕婉之求籧音渠篨音除不鮮斯淺反叶想止反賦也泚鮮明也瀰瀰盛也燕安婉順也籧篨不能俯疾之醜者也盖籧篨本竹席之名人或編以為囷其狀如人之擁腫而不能俯者故又因以名此疾也鮮少也籧篨不鮮猶曰擁腫之病也舊説以為衛宣公為其子伋娶於齊而聞其羙欲自娶之乃作新臺於河上而要音腰之輯録孔疏云此時伋妻盖自齊始來未至於衛公於河上作臺以待其至李氏曰新臺臨河今澶州遺址尚存國人惡之而作此詩以刺之言齊女本求與伋為燕婉之好而反得宣公醜惡之人也新臺有洒七罪反叶先典反河水浼浼每罪反叶羙辨反燕婉之求籧篨不殄賦也洒髙峻也輯録臺在河上曰泚曰洒皆從水義泚謂水中臺影鮮明之貌洒謂水光之中見其臺之髙峻也浼浼平也殄絶也言其病不已也魚網之設鴻則離之燕婉之求得此戚施興也鴻鴈之大者離麗也戚施不能仰亦醜疾也輯録謝氏曰籧篨戚施之疾宣公非有此疾國人惡其無禮義亂人倫故以醜惡之疾比之既無人道亦非人形也言設魚網而反得鴻以興永燕婉而反得醜疾之人所得非所求也麗平聲歴也此以所得非所求為興新臺三章章四句不鮮已甚不已尤甚既不能俯又不能仰則尤為甚凡宣姜事首末見春秋傳然於詩則皆未有考也諸篇放此衛風美者多淫詩少本不當與鄭比也然新臺墻茨之惡又國風中無所有故論淫詩必以鄭衛並稱盖鄭舉其全衛舉其重輯録諸篇曰諸者墻有茨君子偕老鶉之奔奔是也二子乘舟汎汎芳劔反其景叶舉兩反願言思子中心養養以兩反賦也二子謂伋夀也乘舟渡河如齊也景古影字養養猶漾漾憂不知所定之貌舊説以為宣公納伋之妻是為宣姜生夀及朔朔與宣姜愬伋於公公令伋之齊使賊先待於隘而殺之夀知之以告伋伋曰君命也不可以逃夀竊其節而先往輯録左傳曰及行飲以酒夀子載其旌以先賊殺之伋至曰君命殺我夀有何罪賊又殺之國人傷之而作是詩也増釋鄱陽張氏曰此章言伋夀二子乘舟渉河以適齊其影汎汎然何所歸乎為其將見殺顧其影而憐之也我念而思之中心養養然憂不知所定也二子乘舟汎汎其逝此字本與害叶今讀誤願言思子不瑕有害賦也逝往也不瑕疑辭義見泉水此則見其不歸而疑之也増釋鄱陽張氏曰此章言二子汎汎然從此逝矣痛其往而不返也詩人深求其心之無它而恕之曰不為何過而有害也二子乘舟二章章四句一章憂其被害二章疑其被害太史公曰余讀世家言至於宣公之子以婦見誅弟夀爭死以相讓此與普太子申生不敢明驪姬之過同俱惡傷父之志然卒死亡何其悲也或父子相殺兄弟相戮亦獨何哉小杖則受大杖則逃走伋夀之死未盡善也然伋寜被殺而不忍違其父夀寜代死而不忍死其兄則其志有可哀者聖人於此亦閔其不幸而不忍刪去之集傳引此以見孔子録之之故也輯録輔氏曰二子處此亦不得為是而夫子取此詩者所以著宣公志行之惡而其禍至於如是之酷以為萬世戒爾故先生嘗謂太史公欠此意然其言有抑楊可以感𤼵人故取之非便以二子所處為是也觧頥曰宣公納子之妻以為妻則夫婦之倫滅矣因宣姜而殺二子則父子之倫滅矣夫而不夫父而不父則君之道以之不立而君臣之倫亦廢矣春秋以來三綱廢九法斁未釋有甚於此時者以其卒胥為夷也宜哉増鄱陽張氏曰詩緝衛自宣公殺伋夀以朔為世子代立是為惠公左右公子怨朔之䜛殺伋乃作亂立黔牟惠公奔齊其後諸侯納惠公黔牟奔周惠公怨周之容黔牟與燕伐周立子頽為王惠王奔温及惠公卒子懿公立百姓大臣猶以殺伋之故皆不服狄乘其釁殺懿公而滅衛嗚呼衛之亂極矣父子兄弟君臣之間相戕相賊不唯流毒子孫啟侮夷狄以之殺身亡國其餘殃所漸且稔王空之禍盖綱常道盡天地㡬於傾陷矣推原亂根始於夫婦之不正衽席之禍一至此邪以是知詩首關雎聖人之意深逺矣哉邶十九篇七十二章三百六十三句輯録通釋曰衛三十九篇而弼風才十有九然觀緑衣則妾僣嫡矣燕燕則臣弑君矣谷風則夫婦之道乖新臺則男女之倫滅二子乘舟則父子之恩絶旄丘則無恤隣之義簡兮則無尊賢之心北門則失勸士之道亂常敗政莫甚於此所以居變風之首歟於呼渡河野處已兆矣不待讀定之方中而后知也詩經疏義㑹通卷二
