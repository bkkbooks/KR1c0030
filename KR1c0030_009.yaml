body:
  text: 詩經疏義會通卷七元朱公遷撰陳一之十二陳國名太皥伏羲氏之墟音驅在禹貢豫州之東其地廣平無名山大川西望外方東不及孟諸周武王時帝舜之胄有虞閼音遏父為周陶正武王賴其利器用與其神明之後以元女大音泰姬妻去聲其子滿而封之于陳都于宛丘之側與黃帝帝堯之後共為三恪樂記云武王未下車封黃帝之後于薊帝堯之後于祝帝舜之後于陳是為三恪恪者敬也先聖之後當敬者也輯録左傳襄公二十五年注云舜聖故謂之神明是為胡公大姬婦人尊貴好樂五教反巫覡胡狄反歌舞之事其民化之大姬無子故好巫覡禱祈鬼神歌舞之事輯録女曰巫男曰覡今之陳州即其地也按陳檜曹皆小國故居變風之終又變風訖于陳靈陳有靈公之詩亦冝居變風之終但檜曹比陳為尤小且有思治之詩故二國不可先陳而以陳列于其前也輯録陳州今𨽻河南開封府子之湯他郎他浪二反兮宛丘之上辰羊辰亮二反兮洵音荀有情兮而無望武方武放二反兮也賦子指遊蕩之人也湯蕩也四方髙中央下曰宛丘輯録宛丘因以為其地之名洵信也望人所瞻望也國人見此人常遊蕩于宛丘之上故敘其事以刺之言雖信有情思而可樂矣然無威儀可瞻望也輯録輔氏曰遊蕩以為樂情也威儀之可望禮也溺于情者必不足于禮故詩人譏之曰洵有情兮而無望兮其諷切之者深矣坎其擊鼓宛丘之下叶後五反無冬無夏叶與下同值直買反其鷺羽賦也坎擊鼓聲值植也鷺舂鉏今鷺鷥好而潔白頭上有長毛十數枚羽以其羽為翳舞者持以指麾也輯録孔氏曰持鷺羽翳身而舞言無時不出遊而鼓舞于是也輯録范氏曰祁寒大暑之時不少息則其他時可知矣坎其擊缶方有反宛丘之道叶徒厚反無冬無夏值其鷺翿音導叶殖有反賦也缶瓦器可以節樂即今瓦盆翿翳也宛丘三章章四句一章刺其蕩二章三章刺其久于蕩東門之枌符云反宛丘之栩况浦反子仲之子婆娑素何反其下叶後五反賦也枌白榆也先生葉卻著音斫莢皮色白子仲之子子仲氏之女也婆娑舞貌此男女聚會歌舞而賦其事以相樂也榖旦于差初住反叶七何反南方之原無韻未詳不績其麻叶謨婆反市也婆娑賦也榖善差擇也既差擇善旦以會于南方之原于是棄其業以舞于市而往會也此章専主女子言也榖旦于逝越以鬷子紅反邁叶力制反視爾如荍祁饒反貽我握椒賦也逝往越于鬷衆也邁行也荍芘音毗芣音浮也又名荆葵紫色輯録孔疏一曰蚍􅗶水草多花少葉又翹起似蕪菁濮氏曰芘芣紫荆春時開花葉未生花紫色自根及幹而上連接甚密有類蟣窠故爾雅名蚍蜉俗曰火蟣椒芬芳之物也言又以善旦而往于是以其衆行而男女相與道其慕悅之詞曰我視爾顔色之美如芘芣之華于是遺去聲我以一握之椒而交情好去聲也增釋吳師道曰此詩貽我握椒與贈芍藥相去幾何傳謂男女慕悅道顔色之美而交情好當為淫詩邪類前篇是刺男子其所刺止于遊蕩歌舞此詩若無末二句則亦止為男女歌舞相樂之詩惡猶未甚也東門之枌三章章四句一章自述今日之事二章追言昨日之約以及今日之事三章又陳今日之情輯録輔氏曰夫民勞則思思則善心生逸則淫淫則忘善忘善則惡心生理勢之必然也陳國之地廣平又以大姫之化故其俗遊蕩無度已見於宛丘之詩其逸甚矣故繼以東門之枌男女聚會歌舞婦人棄其所業相與慕悅各有所贈以交情好動其淫欲者亦其勢之必然也又曰男女雜處淫亂必生衡門之下可以棲音西遲泌悲泣反之洋洋可以樂音洛飢賦也衡門橫木為門也門之深者有阿孰堂宇重屋為阿門側之堂謂之孰增釋許氏曰衡門之詩隱士所作阿孰堂宇傳因疏文之舊亦大約言門之深者有是名也命士之堂三尺庶人蓋無級門之制豈復若是巍然哉然則衡門固隱士之常然耳此惟衡木為之輯録孔疏衡古文橫字此橫木為門言其淺也棲遲遊息也泌泉水也洋洋水流貌此隱居自樂音洛而無求者之詞言衡門雖淺陋然亦可以遊息泌水雖不可飽然亦可以玩樂而忘飢也此與衛詩考槃相似增釋此一章有自足之意此下兩章無外慕之心雖皆賦體實似比意豈其食魚必河之魴音房豈其取音娶妻必齊之薑賦也薑齊姓輯録謝氏曰齊宋皆大國豈其食魚必河之鯉豈其取妻必宋之子叶奬里反賦也輯録本草鯉魚眷中鱗一道數至尼無小大皆三十六鱗有赤白黃三種故為魚之貴者子宋姓食色性之欲也而食魚不必魴鯉娶妻不必齊美宋子則凡所以自奉者皆不求全而責備矣素位而行不願乎其外斯人之謂歟衡門三章章四句一章則自安而無勉強之意二章三章則自足而無歆羡之心陳詩十篇二詩蕩六詩淫一詩刺惡人汙穢之風不良之徒皆可惡者惟衡門之隱君子則卓立乎流俗者也賢哉東門之池可以漚烏豆反麻叶謨婆反彼美淑姬可與晤五故反歌興也池城池也漚漬疾賜反也治麻者必先以水漬之輯録孔疏漸漬使之柔忍晤猶解下介反也此亦男女會遇之詞蓋因其會遇之地所見之物以起興也語相應東門之池可以漚紵直吕反彼美淑姬可與晤語興也紵麻屬輯録陸氏曰紵科生數十莖宿根在地中至春自生荆揚間一歲三收剝去其皮之表但得其裏緝以成布東門之池可以漚菅古顔反叶居賢反彼美淑姬可與晤言興也菅葉似茅而滑澤莖有白粉柔韌而報反宜為索也輯録濮氏曰左傳云雖有絲麻無棄菅蒯蒯與菅皆謂苕也黃華者俗名黃芒即蒯也白華者俗名白芒即菅也東門之池三章章四句愛慕之意反覆道之東門之揚其葉牂牂子桑反昏以為期明星煌煌興也東門相期之地也揚栁之揚起者也牂牂盛貌明星啓明也煌煌大明貌此亦男女期會而有負約不至者故因其所見以起興也東門之揚其葉肺肺普計反昏以為期明星晳晳之世反興也肺肺猶牂牂也晳晳猶煌煌也語不相應義不相因特即所見以為興上章同東門之揚二章章四句疑慮之意反覆道之墓門有棘斧以斯所宜反之夫也不良國人知之知而不已誰昔然矣興也墓門凶僻之地多生荆棘斯析也夫指所刺之人也誰昔昔也猶言疇昔也輯録誰疇皆發語之辭言墓門有棘則斧以斯之矣此人不良則國人知之矣人皆知之人皆非之矣此以惡惡之意為興國人知之而猶不自改則自疇昔而已然非一日之積矣所謂不良之人亦不知其何所指也輯録慶源輔氏曰人之為惡初動于隱微之中猶有懼人之知之心至于公然形肆于外則已無所忌憚矣然猶幸其為人所規正刺譏而冇改也今其為惡至于國人皆知之而猶不自改自疇昔而已然則非一日之積矣蓋不可得而救藥之也墓門有梅有梟萃止夫也不良歌以訊叶息悴反之訊豫不顧叶果五反顛倒思豫叶寅女反興也鴟梟干嬌反惡聲之鳥也萃集訊告也顛倒狼狽之狀墓門有梅則有梟萃之矣夫也不良則有歌其惡以訊之者矣此以可惡之物以為惡惡之興訊之而不豫顧至于顛倒然後思豫則豈有所及哉改惡為善則可免患然則及今則可以速改也此見詩人愛人無已之意或曰訊豫之豫疑當依前章作而字墓門二章章六句前章絶之後章微教之防有鵲巢卭其恭反有旨苕徒雕反叶徒刀反誰侜陟留反豫美心焉忉忉都勞反興也防人所築以捍水者卭丘旨美也苕苕饒也莖如勞豆而細葉似蒺藜而青其莖葉緑色可生食如小豆藿也侜張也輯録毛傳侜張誑也猶鄭風之所謂廷居望反也豫美指所與私者也忉忉憂貌此男女之有私而憂或間之之詞故曰防則有鵲巢矣卭則有旨苕矣今此何人而侜張豫之所美使我憂之而至于忉忉乎彼所宜有之物則皆有此所不當有之事乃有之蓋以尋常之物興怪異之事也中唐有甓蒲歷反卭有旨鷊五歷反誰侜豫美心焉惕惕吐歷反興也廟中路謂之唐輯録疏堂下至門之徑也甓瓴音零甋音滴也爾雅注曰㼾甎也音鹿専鷊小草雜色如綬惕惕猶忉忉也防有鵲巢二章章四句憂慮之意反覆道之月出皎兮佼古卯反人僚音了兮舒窈鳥了反糾已小反兮勞心悄七小反兮興也皎月光也佼人美人也僚好貌窈幽逺也糾愁結也悄憂也此亦男女相悅而相念之詞言月出則皎然矣佼人則僚然矣安得見之而舒窈糾之情乎是以為之勞心而悄然也此因所見以起興蓋月出于夜正私心所發之時也意與東方之日略同月出皓胡老反兮佼人懰力久反叶朗老反兮舒懮於久反受叶時倒反兮勞心慅七老反兮興也懰好貌懮受憂思也慅猶悄也月出照兮佼人燎力召反兮舒夭於表反紹實照反兮勞心慘當作懆七弔反兮興也燎明也夭紹糾緊之意凡人心平則舒緩有憂則糾緊慘憂也輯録懆七弔反恐是叶音當與白華篇內同又音草吕氏曰此詩用字聱牙意者其方言與月出三章章四句思念之情反覆道之輯録解頥曰月出之詩其悅之也至其思之也切其憂之也深移是心以好賢亦將何思求而不獲哉惜也吾未見好德如好色者也胡為乎株林從夏戶雅反南叶尼心反下同匪適株林從夏南賦也株林夏氏邑也輯録寰宇記陳州西安縣西南三十里有夏亭城城北五里有株林縣志宋州柘城縣本陳之株邑故柘城在南陵縣南七十里季氏曰王氏以為株邑也邑外曰郊郊外曰牧牧外曰野野外曰林夏南徵舒字也靈公淫于夏徵舒之母朝夕而往夏氏之邑故其民相與語曰君胡為乎株林乎曰從夏南耳然則非適株林也特以從夏南故耳蓋淫乎夏姬不可言也故以從其子言之詩人之忠厚如此駕我乘繩證反馬叶滿補反説音稅于株野叶上與反乘平聲我乘駒朝食于株賦也説舍也馬六尺以下曰駒輯録鄭氏曰我國人我君也株林二章章四句前章隱其惡後章惡其深于惡春秋傳夏姬鄭穆公之女也嫁于陳大夫夏御叔靈公與其大夫孔寧儀行父通焉泄息列反冶諫不聽而殺之宣公九年後卒為去聲下同其子徵舒所弒宣公十年而徵舒復扶又反為楚莊王所誅宣公十一年荒穢者必亡弒逆者必誅集傳舉其大要而所以示鑒戒者亦明矣輯録左氏傳史記靈公十四年公與其大夫孔寧儀行父通于夏姬皆衷其衵服以戲于朝泄冶諫曰公卿宣淫民無效焉公告二子請殺泄冶公弗禁遂殺之十五年公與二子飲于夏氏謂行父曰徵舒似汝對曰亦似君徵舒怒公出自其廏射而殺之二子奔楚徵舒自立為陳侯明年楚莊王伐陳殺徵舒立靈公子午是為成公父方武反衵汝栗反婦人近身內衣射食亦反解頥曰衛之亂至于墻有茨而極于是有狄入衛之禍陳之亂至于株林而極于是有楚入陳之禍然則狄非能入衛也宣薑實召之也楚非能入陳也夏姬實召之也此所謂女戎也比事以觀可以為淫亂者之戒矣彼澤之陂叶音波有蒲與荷音何有美一人傷如之何寤寐無為涕他弟反泗音四滂普光反沱徒何反興也陂澤障也輯録澤障謂障水之岸澤水所鍾聚也蒲水草可為席者輯録説文曰蒲似莞而褊有脊滑柔而溫荷芙蕖也輯録爾雅曰荷芙蕖其莖茄其葉蕸其本蔤其華菡萏其實蓮其根藕茄音加蕸音遐蔤亡筆反自目曰涕上聲自鼻曰泗此詩大旨與月出相類增釋許氏曰月出男子思婦人也澤陂婦人思男子也言彼澤之陂則有蒲與荷矣有美一人而不可見則雖憂傷而如之何哉寤寐無為涕泗滂沱而已矣即彼之地則冇其物即此之事則獨無其計物與地相稱事與願相違有字相呼而無字反應有字為興彼澤之陂有蒲與蕳古顔反叶居賢反有美一人碩大且卷其員反寤寐無為中心悁悁烏玄反興也蕳蘭也卷鬢髮之美也輯録李氏曰盧令其人美且鬈字雖不同其義則一悁悁猶悒悒也輯録不安也又憂也彼澤之陂有蒲菡户感反萏大感反叶待檢反有美一人碩大且儼魚檢反寤寐無為輾轉伏枕叶知險反興也菡萏荷華也儼矜莊貌輾轉伏枕卧而不寐思之深且久也澤陂三章章六句思念之情反覆道之陳國十篇二十六章一百二十四句輔氏曰陳風十篇男女淫泆之詩居其大半此則遊蕩無度之所致也愚謂淫亂之風鄭衛以外陳為最陳詩首以遊蕩之詩以見蕩則必淫也若魏之儉嗇褊急唐之憂深思逺秦人勇赴公義而汲汲乎興國則又豈暇于淫蕩哉是故淫亂之詩三國免焉有以也東萊吕氏曰變風終于陳靈其間男女夫婦之詩一何多邪曰有天地然後有萬物有萬物然後有男女有男女然後有夫婦有夫婦然後有父子有父子然後有君臣有君臣然後有上下有上下然後禮義有所錯輯録易序卦文程子曰天地萬物之本夫婦人倫之始錯與措同施布也安著也男女者三綱之本萬事之先也輯録昏禮男女有别而後夫婦有義夫婦有義而後父子有親正風之所以為正者舉其正者以勸之也變風之所以為變者舉其不正者以戒之也道之升降時之治亂俗之汙隆民之死生于是乎在録之煩悉篇之重平聲復力六反亦何疑哉詩之為教懲惡勸善而已春秋書亂賊之事豈教人弒逆乎或者乃謂宜取淫奔諸詩悉去之則善有可法惡無可戒恐非聖經本意矣輯録通釋曰變風終于陳靈其間詩凡一百二十八篇以集傳考之男女夫婦之詩凡六十六篇不啻居其半也檜一之十三檜國名髙辛氏火正祝融之墟在禹貢豫州外方之北滎波之南輯録滎波孔氏以為一水周禮職方云其川滎雒其浸波溠則二水也滎音榮溠音詐居溱洧之間其君妘姓祝融之後輯録釋文曰王肅云周武王封祝融之後于濟洛河潁之間為檜子增釋史記楚世家帝顓頊髙陽生稱稱生卷章世本名老童卷章生重黎為帝嚳髙辛火正甚有功能光融天下帝嚳命曰祝融祝大融明也共工氏作亂帝使祝融誅之而不盡帝乃誅重黎而以其弟吳回居火正為祝融吳回亦卷章生吳回生陸終陸終子六人其四曰會人此即檜之祖也妘姓檜本祝融所封之墟唯妘姓之後處其地妘音云周衰為鄭桓公所滅而遷國焉諸本作桓公誤今之鄭州即其地也輯録鄭州今𨽻河南開封府蘇氏以為檜詩皆為去聲鄭作如弼鄘之于衛也未知是否羔裘逍遙狐裘以朝直遙反叶直勞反豈不爾思勞心忉忉音刀賦也緇衣羔裘諸侯之朝服錦衣狐裘其朝天子之服也臨下朝君各有其服今檜君以臨朝之服為燕服必服朝天子之服而臨朝則侈矣舊説檜君好潔其衣服逍遙遊宴而不能自強于政治故詩人憂之檜小國也強于為治或可以免禍耳逍遙遊宴如此殆戰輯録張南軒曰其所事惟在衣服之間則其不能強于政治可知矣羔裘翺翔狐裘在堂豈不爾思我心憂傷賦也翺翔猶逍遙也堂公堂也羔裘如膏古報反日出有曜羊照反叶羊號反豈不爾思中心是悼賦也膏脂所漬也日出有曜日照之則有光也羔裘三章章四句憂念之情反覆道之輯録輔氏曰勞心忉忉思之也我心憂傷悲之也中心是悼則知其不可復救也羔裘如膏日出有曜其君之服飾非不美也豈不爾思中心是悼則其所闕者蓋可知矣增釋許氏曰羔裘狐裘國君所得服非奢也然羔裘以視朝可也而以逍遙翺翔狐裘以朝天子可也而以自朝其羣臣則固已失禮之正矣而又不能強于政治惟服其服尸其位而已觀如膏有曜之言則實有好潔衣服之僻耳可不殆哉旴黎朱氏曰為君者惟致飾于外愛君者常不忘于中故其發言如此庶見素冠兮棘人欒欒力端反兮勞心慱慱徒端反兮賦也庶幸也縞音呆冠素紕音皮既祥之冠也語出記玉藻黑經白緯曰縞緣去聲邊曰紕棘急也喪事欲其縱縱音總爾哀遽之狀也記檀弓喪事欲其縱縱爾吉事欲其折折爾雅曰縱縱急也折折緩也折音題欒欒瘠音籍貌慱慱憂勞之貌祥冠祥則冠去聲之禫徒感反則除之禫除服祭名儀禮中月而禫中猶間也與大祥間一月自初喪至此凡二十七月矣輯録祥亦祭名去凶從吉之義禫之言淡淡平安意也石梁王氏曰二十四月再期其月餘日不數為二十五月中月而禫注謂間一月則所間之月是空一月為二十六月出月禫祭為二十七月徙月則樂矣今人皆不能行三年之喪矣安得見此服乎當時賢者庶幾見之至于憂勞也輯録解頥曰三年之喪非為其服之難情稱其服之難也棘以言其哀遽之狀欒欒以言其毁瘠之形則是其衣服之變顔色之哀心志之思慕皆可即是而見之夫惟表裏之相稱本末之兼善所以為賢惜乎今之不及見斯人也則安得而不勞心慱慱乎庶見素衣兮我心傷悲兮聊與子同歸兮賦也素冠則素衣矣與子同歸愛慕之詞也輯録李氏曰言庶幾欲見服既祥之素衣者今無此人故我心悲傷也如有其人則我且與之同歸矣謝氏曰同歸如書云同歸于治同歸于亂非與之同歸其家也庶見素韠音畢兮我心藴於粉反結叶訖力反兮聊與子如一兮賦也韠蔽膝也以韋為之輯録孔疏曰古者佃漁而食因衣其皮先知蔽前後知蔽後後王易以布帛而猶存其蔽前者不忘本也陳氏曰古者席地而坐以臨爼豆故設蔽膝以備濡漬韠之言蔽也冕服謂之韍分勿反其餘曰韠韠從裳色素衣素裳則素韠矣藴結思之不解也與子如一甚于同歸矣輯録輔氏曰素衣素冠不祥之服也常情之所厭見也檜國之俗不能行三年之喪則不復見此既祥之衣冠矣而當時賢者庶幾見之而不可得則至于憂勞如此是其心必有大不安者也幸而得見之則又為之愛慕而欲與同歸為一焉是又必有大慊于其心者也此秉彛之心也先王之制喪服亦以是心而已豈強民而為之哉素冠三章章三句素冠素衣素韠以上下為次序而意漸深按喪禮為去聲父為君斬衰音催三年事父母致喪三年事君方喪三年詩人所指致喪者也此見三年之喪為最重非他服可比也輯録儀禮注斬不緝也不言裁割而言斬者取痛甚之意凡服上曰衰下曰裳衰長六寸博四寸綴于外襟之上當心李寶之曰衰綴于衣因統名衣為衰也昔宰豫欲短喪夫子曰子生三年然後免于父母之懷豫也有三年之愛于其父母乎三年之喪天下之通喪也此推本喪之所以三年之故傳曰子夏三年之喪畢見音現于夫子援平聲琴而弦衎衎苦旦反而樂作而曰先王制禮不敢不及夫子曰君子也閔子騫三年之喪畢見于夫子援琴而弦切切而哀作而曰先王制禮不敢過也夫子曰君子也子路曰敢問何謂也夫子曰子夏哀已盡能引而致之于禮故曰君子也閔子騫哀未盡能自割以禮故曰君子也夫三年之喪賢者之所輕不肖者之所勉此見三年之喪為不易之定制短喪固非禮而欲過之者亦非所以為禮也輯録輔氏曰子夏閔子騫之事毛傳所載如此與禮記不同先生併取宰豫之事言之而不加一辭焉然熟讀而詳玩之則自有所發而可以為情性之正矣又曰非以三年之喪為足以報其親所謂喪三年以為極亡則弗之忘矣者也至于聖人既為之中制則賢者必當俯而就不肖者必當跂而及也隰有萇丈羊反楚猗於可反儺乃可反其枝夭於驕反之沃沃烏毒反樂音洛子之無知賦也萇楚銚音遙弋今羊桃也子如小麥亦似桃輯録陸氏曰葉如桃而光尖長而狹花紫赤色其枝莖弱過一尺引蔓于草上一名業楚生平澤中子細如棗核苗弱不能為樹猗儺柔順也夭少去聲好貌沃沃光澤貌子指萇楚也政煩賦重人不堪其苦歎其不如草木之無知而無憂也隰有萇楚猗儺其華芳無胡瓜二反夭之沃沃樂子之無家古胡古牙二反賦也無家言無纍去聲也隰有萇楚猗儺其實夭之沃沃樂子之無室賦也無室猶無家也隰有萇楚三章章四句憂傷之意反覆道之輯録輔氏曰人之有知所以為萬物之靈也有家有室所以異于物也今也政煩賦重不堪其苦反嘆不如物之無知無家焉則不樂其生甚矣何為使之至此極哉為人上者宜有所覺矣匪風發叶方月反兮匪車偈起竭反兮顧瞻周道中心怛都逹反叶旦悅反兮賦也發飄揚貌偈疾驅貌周道適周之路也怛傷也周室衰微賢人憂歎而作此詩天下無王則政自諸侯出強陵弱衆暴寡徵發之煩供億之困侵伐之虐所以敝小國者可知思周之詩獨作于檜曹者此故也言常時風發而車偈而中心怛然今非風發也非車偈也特顧瞻周道而思王室之陵遲輯録荀子注言丘陵之勢漸慢也故中心為之怛然耳匪風飄匹遙反叶匹妙反兮匪車嘌符遙反叶匹妙反兮顧瞻同道中心弔兮賦也回風輯録爾雅注旋風也謂之飄嘌漂搖不安之貌弔亦傷也誰能亨魚溉古愛反之釡符甫反􅑄音尋誰將西歸懷之好音興也溉滌也􅑄釡屬輯録説文曰大釡一曰鼎大上小下若甑曰􅑄西歸歸于周也檜在周之東故言西歸誰能亨魚乎有則我願為之溉其釡􅑄誰將西歸乎有則我願慰以好音亨魚則可得美味尊王則可得善治此皆可喜可願之事故用其語相呼為興也好音猶好語慰以好音蓋言文武之治由是而可復爾以見思之之甚但有西歸之人即思有以厚之也嚴氏曰此詩當作于夷厲之時匪風三章章四句一章二章歎其衰微三章願其興復見文武之德在人而人不能忘如此輯録輔氏曰王政不綱周室陵遲諸侯放恣無復知有尊王之義者而詩人顧瞻周道而為之憂傷聞有歸周之人則為之歎慕慰勉而不能自己如此熟讀而詳玩之則足以見君臣之彛矣黃氏曰周之得民當于此詩觀之解頥曰周之盛時其君則文武成康其臣則周召毛畢東諸侯之朝覲聘問與其臣民之往來以供百役者若百川之赴海蓋靡日而不有也而今也征伐之煩會盟之數吾小國僕僕焉奔走以事大國之不暇而適周者寂乎其無聞也則安得不為之怛然而悲傷乎夫惟適周者之寂然也故又重言以結之曰孰有能西歸者乎冇則我願慰之以好音所以重傷夫今王之不如古而又以重嘆夫今人之不知有王也檜國四篇十二章四十五句曹一之十四曹國名其地在禹貢兖州陶丘之北雷夏荷澤之野周武王以封其弟振鐸待洛反今之曹州即其地也輯録曹州今改為曹縣𨽻山東兖州府蜉蝣之羽衣裳楚楚叶創舉反心之憂矣于我歸處比也蜉蝣渠略也似蛣音乞蜣音羌身狹而長有角諸本脫有字黃黑色朝生暮死輯録陸氏曰蜉蝣甲下有翅能飛夏月隂雨時出地中蛣蜣黑甲蟲故云似之楚楚鮮明貌此詩蓋以時人有玩細娛而忘逺慮者故以蜉蝣為比而刺之言蜉蝣之羽翼猶衣裳之楚楚可愛也然其朝生暮死不能久存有目前之娛而不久蓋若此矣故我心憂之而欲其于我歸處耳于我歸處則將告以人無逺慮必有近憂庶幾其有備而無患也輯録輔氏曰人有玩細娛忘逺慮至如蜉蝣之朝生暮死而不自知所以欲其于我歸處者蓋思有以警誨之耳增釋金履祥曰君子念夫人雖不知久逺之計而亦知所以自修故心之憂之而欲其以我為歸也蓋君子之于人無不欲其入于善苟有一毫自治之心固君子之所欲進之也序以為刺其君或然而未有考也蜉蝣之翼采采衣服叶蒲比反心之憂矣于我歸息比也采采華飾也息止也蜉蝣掘求勿反閲麻衣如雪心之憂矣于我歸説音稅叶輸爇反比也掘閲未詳輯録昭武黃氏曰掘通作掘説文突也注疏閲者悅懌之意此蟲土裏化生掘地而出形容解閲説舍息也蜉蝣三章章四句憂思之意反覆道之彼候人兮何上聲戈與祋音對彼其音記之子三百赤芾音弗賦也諸本作興也誤候人道路迎送賔客之官何揭祋殳音殊也輯録孔疏云夏官候人上士六人下士十有二人徒百有三十人則諸侯候人亦應是士命徒數必自有職各掌其方之道治與其禁令以設候人注禁令備姦冦也設候人者選士卒以為之有四方來者則致之于朝歸則送之于境荷戈兵防衛姦冦之子指小人芾冕服之韠也輯録芾與韍通玉藻曰韠下廣二尺上廣一尺長三尺其頸五寸肩革帶博二寸陳氏曰凡韠皆韋為之故其字從韋又以著衣畢然後著之故名為韠韠之言蔽也一命緼音溫赤黃間色芾黝音酉黜色珩再命赤芾黝珩三命赤芾蔥淺青色珩輯録佩玉之珩也大夫以上赤芾乘軒輯録許氏曰禮記公侯伯之卿三命下大夫再命上士一命曹為伯爵大夫再命是大夫以上皆服赤芾于法又得乘軒故連言之軒大夫之車也此刺其君逺去聲君子而近小人之詞言彼候人而何戈與祋者宜也彼其之子而三百赤芾何哉晉文公入曹數上聲其不用僖負羈而乘軒者三百人左傳僖公二十八年注云軒大夫車言其無德居位者多其謂是歟維鵜徒低反在梁不濡其翼彼其之子不稱尺證反其服叶蒲北反興也鵜汙音烏又音互澤輯録爾雅作鸅水鳥也俗所謂淘河也鵜處所不當處之地則欲不遂小人服所不當服之服則身不稱此見物理不可反其常也故以為興維鵜在梁不濡其咮陟救反彼其之子不遂其媾古豆反興也咮喙音諱遂稱去聲媾寵也遂之曰稱猶今人謂遂意曰稱意薈烏會反兮蔚於貴反兮南山朝隮子兮反婉於阮反兮孌力轉反兮季女斯飢比也薈蔚草木盛多之貌朝隮雲氣升騰也婉少貌孌好貌薈蔚朝隮言小人衆多而氣焰盛也季女婉孌自保不妄從人而反飢困言賢者守道而反貧賤也候人四章章四句一章二章即其衣服言三章即其恩寵言四章即其威勢言而且深嘆于此以甚惡于彼也鳲鳩在桑其子七兮淑人君子其儀一兮其儀一兮心如結叶訖力反兮興也鳲鳩秸音戛鞠音掬也爾雅作鴶鵴亦名戴勝今之布穀也飼音嗣子朝從上下暮從下上平均如一也如結如物之固結而不散也専而無雜一而無二收斂之至如結之然詩人美君子之用心均平専一均平訓如一字専一訓如結字故言鳲鳩在桑則其子七矣淑人君子則其儀一矣其儀一則心如結矣鳲鳩之子七兮衆矣而所以飼之者均平如一也人之一身其容儀亦已多矣而君子之容儀未嘗謹于此而不謹于彼亦均平如一也所以然者以其心専一耳其心専一則警惕常存而施諸身者無不中其常度矣衛武公以抑抑威儀為德之隅而又以不愧屋漏為德之實蓋與此詩同一意也然不知其何所指也曹小國也有賢如此則曹豈止于曹哉但詩詞寬廣無嘆惜招徠之意則又非棄而在野者是故不知其何所指也陳氏曰君子動容貌斯逺去聲暴慢正顔色斯近信出辭氣斯逺鄙倍與背同見論語其見音現于威儀動作之間者有常度矣豈固為是拘拘者哉蓋和順積中而英華發外見樂記是以由其威儀一于外而心如結于內者從可知也輯録輔氏曰陳氏引曾子之言為説不惟解得此詩意出又正得曽子所言之本旨內外無二理見其內可以占其外也鳲鳩在桑其子在梅叶莫悲反淑人君子其帶伊絲叶新齎反其帶伊絲其辨伊騏音其興也鳲鳩常言在桑其子每章異木子自飛去母常不移也蘇氏曰從其在梅則失其在棘從其在棘則失其在榛居一以俟之則無不及愚按母常不移見鳲鳩之専一専一如此是以能均及也帶大帶也大帶用素絲有雜色飾焉辨皮辨也騏馬之青黑色者辨之色亦如此也書云四人騏辨今作綦絲帶則當騏辨如緇衣羔裘素衣麑裘之類欲其色之相稱也言鳲鳩在桑則其子在梅矣淑人君子則其帶伊絲矣其帶伊絲則其辨伊騏矣言有常度不差忒也鳩性専一故不失在梅之子君子之心専一故不失其外之儀衣服者威儀之一也衣服亦中其常度則施諸身者無所不均可見矣首章是即其均平而見専一之心此下三章是因其専一而有均平之驗鳲鳩在桑其子在棘淑人君子其儀不忒他得反其儀不忒正是四國叶于逼反興也有常度而其心一故儀不忒威儀本有常度其心又復専一則能使之各中其度而無少差忒者矣儀不忒則足以正四國矣四國者四方之國非一人也然威儀俱中其度則教示之功可以均及于彼矣大學傳曰其為父子兄弟足法而後民法之也傳引此者又以推廣詩人之意見君子之人以身立教所當謹者不但容貌衣服而已然父子兄弟亦特舉其大者而言其實人倫日用之間凡可謂之儀必其無不可法而後人法之也是故君子無所不用其極也鳲鳩在桑其子在榛側巾反淑人君子正是國人正是國人胡不萬年叶尼因反興也儀不忒故能正國人國人亦非一人正是國人亦見均及于人之意胡不萬年願其夀考之詞也能正國人則願其夀考使人常有所法也鳲鳩四章章六句一章言其容貌二章言其衣服三章總以威儀言之而推其功用四章因其功用而為祝頌之詞又其起興之例不同首章及三章四章皆以兩句興兩句其後兩句在興外惟二章則盡以下四句而興之輯録通釋曰鳲鳩之子雖非一而鳲鳩飼之之心則如一其子之飛往雖無常而鳲鳩居以待之則有常詩人托興之取義者亦以應按事物之變四國人民之衆而君子則度有常而心如一也然其言之有序以為君子之心如結是以其儀専一而有常度有常度是以其帶與辨亦有常而不差忒不差忒是以其儀不忒而可以表正四國表正四國則其終也可以受天之祿而夀考萬年是雖祝願之詞固亦天人感通之理也陳定宇曰心結而儀一且不忒表裏一致也四國國人之皆正逺近一致也由之久而胡不萬年久近一致也國人願其年夀之久豈非欲賴其表正之久哉冽音列彼下泉浸彼苞稂音郎愾苦愛反我寤嘆念彼周京叶居良反比而興也冽寒也輯録列旁二點者從氷寒也下泉泉下流者也苞草叢生也稂童梁莠屬也愾嘆息之聲也周京天子所居也王室陵夷而小國困弊故以寒泉下流而苞稂見傷為比遂興其愾然以念周京也寒泉則不能潤物下流則不能及物浸漬則害物此衰周之比也而語又相應為興體增釋許氏曰泉固以潤物也然必于春夏之時乃能發生至于寒則不適于用而徒以浸彼稂蕭著草而又傷之耳于以見王澤不下流而所被之政非澤也所以寤而即嘆以念先王之治寤嘆則見其憂思之極嘆之不已惟寐則已爾卒章則先王之政也冽彼下泉浸彼苞蕭叶疏鳩反愾我寤嘆念彼京周比而興也蕭蒿也京周猶周京也冽彼下泉浸彼苞蓍音尸愾我寤嘆念彼京師叶霜夷反比而興也蓍筮草也輯録本草注曰其生如蒿高五六尺用其莖為筮以知吉凶故謂之神物史記云蓍滿百莖者其下有神龜守之上有青雲覆之京師猶京周也輯録周京與京周京師一也因異章而變文耳詳見大雅公劉篇芃芃薄工反黍苖隂雨膏古報反之四國有王郇音荀伯勞力報反之比而興也芃芃美貌郇伯郇侯文王之後嘗為州伯治諸侯有功輯録李氏曰郇國今河中猗氏縣王制謂二百一十國為州州冇伯是九州中有九伯也言黍苖既芃芃然矣又有隂雨以膏之四國既有王矣而又有郇伯以勞之前三章則衰頽相似而語又相呼此章則興盛相似而語又相呼故皆為比而興傷今之不然也傷今思古邈焉其不可追于是而周已衰固然無可為矣下泉四章章四句三章以前皆以傷今末章思古所以傷今程子曰易剝之為卦也諸陽消剝已盡獨有上九一爻尚存如碩大之果不見食將有復生之理上九亦變則純隂矣然陽無可盡之理變于上則生于下無間去聲可容息也輯録建安葉氏曰一氣無頓消亦無頓息以卦配月積三十日而成一月亦積三十分而成一爻九月中于卦為剝陽未剝盡猶有上九一爻剝三十分至十月中陽氣消盡而為純坤然陽才盡于上則已萌于下積三十分至十一月中然後陽氣應于地下而成復之一爻也蓋隂陽二氣語其流行則一氣耳息則為陽消則為隂消之終即息之始不容有間斷隂道極盛之時其亂可知亂極則自當思治故衆心願戴于君子君子得輿也輯録一陽在上則為衆隂所載是君子得輿之象詩匪風下泉所以居變風之終也輔氏曰匪風作于東遷之前意尚覬乎周道之復興也故曰誰將西歸懷之好音下泉作于齊桓之後無復有興起之望矣直慨嘆想慕之而已陳氏曰亂極而不治變極而不正則天理滅矣人道絶矣聖人于變風之極則係之以思治之詩以示循環之理以言亂之可治變之可正也輯録程子因解剝卦而及匪風下泉二詩居變風之終之説可謂得聖人之意矣陳氏所謂以示循環之理以言亂之可治變之可正尤足以補程子之説故並載之增釋吳師道曰先儒謂匪風下泉居變風之終以明亂之可治變之可正也嘗因是而合觀二國之風乃知聖人非獨于二篇為然夫檜曹其地褊小當以節儉為先在上者惟好羔裘之潔其衣服蜉蝣之衣裳楚楚其下效之必有甚焉素冠之棘人安得而見乎彼其之子安得而不三百赤芾乎素冠當服而不服者也赤芾不當服而服者也由上失其道故下失其常也禮制廢壞奪于情欲故嘆其反不如物之無知無家也小人進而君子退威儀無度用心不一故以鳲鳩起興而嘆淑人君子之不可見篇中帶絲辨騏即上篇鵜梁不稱之反也夫端慤而無情欲者質之美也其儀一而心如結者德之盛也誠有其人則不可見矣然此皆周室陵夷政教衰微上無明王下無賢伯在位皆小人是以政煩賦重民生困悴以至此極西周之思其能已乎聖人于檜曹小國著之以見其困之尤甚思之尤切此匪風下泉之所以為終而其本意皆主于思賢以為有賢者作則反之自易聖人之意深矣曹國四篇十五章六十八句鄭衛淫僻齊陳荒穢王衰微泰強盛魏儉嗇褊急唐憂深思逺檜曹窮困而思治此諸國變風之大略也詩經疏義會通卷七
