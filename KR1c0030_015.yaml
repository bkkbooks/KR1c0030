body:
  text: 詩經疏義會通卷十三元朱公遷撰北山之什二之六陟彼北山言采其杞偕偕士子叶奬里反朝夕從事叶上止反王事靡盬憂我父母叶滿彼反賦也偕偕強壯貌士子詩人自謂也大夫行役而作此詩自言陟北山而采祀以食者皆強壯之人而朝夕從事者也蓋以王事不可以不勤是以貽我父母之憂耳輯録謝氏曰言王事不可以不堅固也子以王事為憂父母以子之勤勞為憂溥音普天之下叶後五反莫非王土率土之濵莫非王臣大夫不均我從事獨賢叶下珍反賦也溥大率循濵涯也輯録疏九州海環之濵是四畔近水之處言土之廣臣之衆而王不均平使我從事獨勞也輯録雙峰饒氏曰無才者多逸有才者多勞以其能任事故也言凡為王臣者皆當任王事何獨使我為賢而勞之乎不斥王而曰大夫大夫行役而怨大夫不均蓋天子之大夫非一人也此則指夫執政者而言不言獨勞而曰獨賢詩人之忠厚如此四牡彭彭叶鋪郎反王事傍傍布彭反叶布光反嘉我未老鮮息淺反我方將旅力方剛經營四方賦也彭彭然不得息也傍傍然不得已也嘉善鮮少也以為少而難得也將壯也旅與膂同輯録旅力方剛言其健也言王之所以使我者善我之未老而方壯旅力可以經營四方耳輯録謝氏曰經經畫營營造如人作室曰經之營之言區畫造作四方之事也猶上章之言獨賢也或燕燕居息或盡瘁事國叶越逼反或息偃在床或不已于行叶戶郎反賦也燕燕安息貌瘁徂醉反病已止也言役使之不均也下章放此輯録輔氏曰此章而下則方言其不均之實然亦不過以其勞逸者對言之使上之人自察耳但言之重辭之復則其望於上者亦切矣詩可以怨謂此類也或不知叫號戶刀反或慘慘七感反劬勞或栖音西遲偃仰或王事鞅於兩反掌賦也不知叫號深居安逸不聞人聲也鞅掌失容也言事煩勞不暇為儀容也增釋鞅掌煩勞失容之狀或湛都南反樂飲酒或慘慘畏咎巨九反或出入風音諷議叶魚羈反或靡事不為賦也咎猶罪過也出入風議言親信而從七恭反容也北山六章三章章六句三章章四句一章勞苦而思其親二章三章勞苦而怨其上四章以後極言勞逸不均而深怨之也輯録胡庭芳曰補傳云大東言賦之不均北山言役之不均無將大車祗音支自塵兮無思百憂祗自疧劉氏曰當作疧與痻同眉貧反兮興也將扶進也大車平地任載之車駕牛者也祗適疧釋文都禮反病也此亦行役勞苦而憂思者之作言將大車則塵汚之思百憂則病及之也此皆言之可戒者故因行役所見而用語相呼為興輯録輔氏曰夫行役者進而有王事之期程惟恐其有不期之悔退而冇家事之多端唯恐其有意外之虞所可憂者固不一而足也故曰百憂戒之以無思者言姑置之勿以為念可也不然適所以自病而已矣無將大車維塵冥冥叶莫逈反無思百憂不出于熲古逈反興也冥冥昏晦也熲與耿同小明也在憂中耿耿然不能出也人心冇憂則拘而迫無將大車維塵雍於勇於容二反兮無思百憂祗自重直勇直龍二反兮興也雍猶蔽也重猶纍也無將大車三章章四句憂傷之意反覆道之明明上天照臨下土我征徂西至于艽音求野叶上與反二月初吉載離寒暑心之憂矣其毒大音泰苦念彼共音恭下章並同人涕零如雨豈不懷歸畏此罪罟音古賦也征行徂往也艽野地名蓋荒逺之地也二月亦以夏正數色主反之建卯月也初吉朔日也輯録疏君子舉事尚早故以朔為吉毒言心中如有藥毒也輯録謝氏曰載再也離厯也曰憂曰毒而又曰大苦其情有犬不堪者矣共人僚友之處者也懷思罟網也大夫以二月西征至于嵗暮而未得歸故呼天而訴之復念其僚友之處者且自言其畏罪而不敢歸也輯録輔氏曰言其涉行之逺厯時之久故其心之憂如中藥之毒而甚苦也則僚友之處者亦豈有樂事哉此所以思之而涕零如雨又自言我亦豈不懷歸而相與共事哉正以畏不測之罪而不敢歸爾罪罟言其以罪而加人如網罟之取物而物冇不及知者也不言思其室家而欲歸乃言思其僚友者善為辭也然室家之思固亦在其中昔我往矣日月方除直慮反曷云其還嵗聿云莫音慕念我獨兮我事孔庶心之憂矣憚丁佐反我不暇叶胡故反念彼共人眷眷音眷懷顧豈不懷歸畏此譴怒賦也除除舊生新也謂二月初吉也庶衆憚勞也眷眷勤厚之意譴詰戰反怒罪責也言昔以是時往今未知何時可還而嵗已莫矣蓋身獨而事衆是以勤勞而不暇也輯録輔氏曰眷眷懷顧言已之於僚友勤厚眷眷然懷思而顧念之也譴怒則明言其罪責之及耳昔我往矣日月方奧於六反曷云其還政事愈蹙子六反嵗聿云莫采蕭穫菽心之憂矣自詒伊戚叶子六反念彼共人興言出宿豈不懷歸畏此反覆芳福反賦也奧暖輯録疏即春溫亦謂二月也蹙急詒遺丁季反戚憂興起也反覆傾側無常之意也言以政事愈急是以至此嵗暮而猶不得歸輯録輔氏曰采蕭穫菽則嵗莫之事也又自咎其不能見幾逺去而自遺此憂至於不能安寢而出宿於外也嗟爾君子無恆安處靖共爾位正直是與神之聽之式榖以女音汝賦也君子亦指其僚友也恆常也靖與靜同輯録謝氏曰靖如自靖自獻之靖凡事謀之心而安也共如溫共朝夕之共凡事共敬而不敢慢也君子本共又勉之以靖共也與猶助也榖祿也以猶與也上章既自傷悼此章又戒其僚友曰嗟爾君子無以安處為常言當有勞時勿懷安也當靖共爾位惟正直之人是助則神之聽之而以榖祿與女矣嗟爾君子無恆安息靖共爾位好呼報反是正直神之聽之介爾景福叶筆力反賦也息猶處也好是正直愛此正直之人也介景皆大也小明五章三章章十二句二章章六句前三章致憂思之情後二章盡忠告之義輯録陳定宇曰此詩因已之久役於外而思僚友之安處於內者且於已無賢勞之恨而謂憂戚之自詒於彼無憎疾之辭而勉以為正直之是助哀而不傷怨而不怒視北山之詩稍庶幾焉豈賦北山者有父母故其辭極哀怨賦小明者已無父母故其辭頗和平也歟增釋許氏曰詩言其毒太苦憚我不暇可謂甚矣其三章乃曰自詒伊戚不敢咎其上而祗自咎其後二章且告其友勤職事親善人以忠其上詩人之忠厚也鼓鐘將將七羊反淮水湯湯音傷憂心且傷淑人君子懷允不忘賦也將將聲也淮水出信陽軍桐柏山至楚州漣水軍入海輯録信陽軍即今汝寧府信陽縣𨽻河南漣水軍即今淮安府安東縣直𨽻湯湯沸騰之貌淑善懷思允信也此詩之義未詳王氏曰幽王鼓鐘淮水之上為流連之樂久而忘反聞者憂傷而思古之君子不能忘也輯録輔氏曰懷允不忘言其傷今思古而信不能忘也鼓鐘喈喈音皆叶居奚反淮水湝湝戶皆反叶賢雞反憂心且悲淑人君子其德不回叶乎為反賦也喈喈猶將將湝湝猶湯湯悲猶傷也回邪也輯録輔氏曰悲甚於傷樂所以象德其德不回則古之君子樂與德稱也鼓鐘伐鼛古毛反叶居尤反淮有三洲憂心且妯敕留反淑人君子其德不由賦也鼛大鼓也周禮作臯云臯鼓尋有四尺輯録此引冬官韗人文又地官鼓人以鼛鼓鼓役事八足曰尋三洲淮上地蘇氏曰始言湯湯水盛也中言湝湝水流也終言三洲水落而洲見也言幽王之久於淮上也妯動猶若也言不若今王之荒亂也輯録輔氏曰伐鼛舉樂器之大者言之以見其樂之盛也妯甚於悲謂常動而不息也其德不猶言與今之君子不相似也將將喈喈伐鼛言其樂之盛也湯湯湝湝三洲言其時之久也且傷且悲且妯言其憂之甚也樂之盛作之久也而民心之憂益甚則與古之王者憂民之憂樂民之樂者異矣鼓鐘欽欽鼓瑟鼓琴笙磬同音以雅以南叶尼心反以籥以灼反不僭子念反叶七心反賦也欽欽亦聲也磬樂器以石為之琴瑟在堂笙磬在下同音言其和也雅二雅也南二南也籥籥舞也僭亂也言三者皆不僭也蘇氏曰言幽王之不德豈其樂非古歟樂則是而人則非也輯録濮氏曰但時非古之時聞其樂祗見其可傷也孟子告齊宣王者可以觀矣鼓鐘四章章五句一章至三章直刺之四章美其鼓樂而隂刺之此詩之義有不可知者今姑釋其訓詁名物而略以王氏蘇氏之説解之未敢信其必然也輯録胡氏曰歐公云鼓鐘序但言刺幽王不知刺何事據詩文則是作樂於淮上矣然旁考詩書史記皆無幽王東巡之事書曰徐夷並興蓋自成王時徐夷及淮夷已皆不為周臣宣王時嘗遣將征之亦不自往初無幽王東至淮徐之事然則不得作樂於淮上矣當闕其所未詳嚴氏謂古事亦有不見於史而因經以見者詩即史也其論固當然而詩文亦不明言其為幽王也故集傳以為未詳又曰未敢信其必然得之矣楚楚者茨言抽敇留反其棘自昔何為我藝魚世反黍稷我黍與與音餘我稷翼翼我倉既盈我庾維億以為酒食以饗以祀叶逸織反以妥湯果反以侑音又叶夷益反以介景福叶筆力反賦也楚楚盛密貌茨蒺藜也抽除也我為有田祿而奉祭祀者之自稱也與與翼翼皆蕃盛貌露積如字積音漬曰庾十萬曰億輯録嚴氏曰我倉既盈無所藏之則露積為庾其數至億言其多也饗獻也妥安坐也禮曰詔妥尸輯録禮記郊特牲注曰尸始入祝則詔主人拜安尸使之坐蓋祭祀筮族人之子為尸輯録筮尸用無父者祭祖用孫列皆取於同姓之適孫天子諸侯取卿大夫冇爵者謂之公尸既奠迎之使處神坐而拜以安之也侑勸也恐尸或未飽祝侑之曰皇尸未實也侑勸也實飽也儀禮特牲夙興烹饌設筵兒迎尸正祭尸入即位主人拜妥尸尸祭神食祭酒啐酒告止祭鉶嘗之告旨尸三飯告飽祝侑之曰皇尸未實尸又三飯如是者三然後主人酌酒獻尸介大也景亦大也以介景福謂以此大求多福也此詩述公卿有田祿者力於農事以奉其宗廟之祭輯録解頤曰力於農事所以致其勤也以奉宗廟所以致其孝也惟勤故致力於民者盡惟孝故致力於神者詳故言蒺藜之地有抽除其棘者古人何乃為此事乎古人古者治田之人也蓋將使我於此藝黍稷也輯録輔氏曰首四句推本而言以見其不忘所自也王氏以為我倉既盈則無所藏之而露積為庾其數至億者是也然此亦甚言之以見有餘之意耳故我之黍稷既盛倉庾既實則為酒食以饗祀妥侑而介大福也古人墾闢蓋以為孝孫種殖計故種殖有成即為祭祀受福計所以種殖者非他也致祭受福不可無酒食也有此黍稷可不知所用哉其意重在六箇以字此章專主酒食言濟濟子禮反蹌蹌七羊反潔爾牛羊以往蒸嘗或剝或亨普庚反叶鋪郎反或肆或將祝祭于祊補彭反叶補光反祀事孔明叶謨郎反先祖是皇神保是饗叶虛良反孝孫有慶叶祛羊反報以介福萬夀無疆賦也濟濟蹌蹌言有容也輯録輔氏曰古之祭祀用人甚多此言濟濟蹌蹌者謂凡與祭之人皆有容儀也冬祭曰蒸秋祭曰嘗言蒸嘗則禴祠在其中矣但禴主樂祠主言詞此承牛羊之文故以蒸嘗言之剝解剝其皮也亨煮熟之也肆陳之也將奉音捧持而進之也牲體則陳之殽則進之剝烹肆將皆潔牛羊奉蒸嘗之事而皆蒙濟濟蹌蹌一句則無不敬也祊廟門內也孝子不知神之所在故使祝博求之於門內待賔客之處也禮公食大夫皆行事於廟是廟門之內有待賔容之處也魂無不知神無不在故博求之如此孔甚也明猶備也著也濟濟蹌蹌以下五句是薦牲之敬為一節祝祭于祊一句是求神之誠為一節祀事孔明一句則總結之也皇大也君也訓大與君言神來而處尊位保安也神保蓋尸之嘉號楚詞所謂靈保亦以巫降神之稱也輯録朱子曰靈保神巫也神降而託於巫蓋身則巫而心則神也今詩中不説巫當便是尸也孝孫主祭之人也慶猶福也薦牲之禮如此求神使饗之又如此祀事可謂明備矣此先祖之所以來饗孝孫之所以受福者盛大而悠久也此章專主牛羊言執㸑七亂反踖踖音迹叶七略反為爼孔碩叶常約反或燔音煩或炙之敇反叶陟略反君婦莫莫音麥叶木各反為豆孔庶叶陟略反為賔為客叶克各反獻酬市由反交錯禮儀卒度叶徒洛反笑語卒獲叶黃郭反神保是格叶剛鶴反報以介福萬夀攸酢賦也㸑竈也輯録疏饔㸑以煮肉廪㸑以炊米少牢云饔㸑在門東南北上廪㸑在饔㸑之北踖踖敬也為爼者燔者炙者皆執㸑之人而皆蒙踖踖二字也語勢與上章同爼所以載牲體也所謂博碩肥腯是也碩大也燔燒肉也炙炙肝也皆所以從去聲獻也特牲主人獻尸賔長上聲以肝從主婦獻尸兄弟長以燔從是也輯録朱子曰燔者火燒之名炙者逺火之稱以難熟者近火易熟者逺之故肝炙而肉燔也孔疏云從獻謂既獻酒即以此燔炙從之而置之在爼也君婦主婦也輯録輔氏曰君婦者君即主也又所以尊稱之也莫莫清靜而敬至也豆所以盛平聲內羞庶羞主婦薦之也庶多也內羞以黍稷庶羞以肉味輯録房中之羞其籩則糗餌粉餈其豆則酏食糝食庶羞羊臐豕膮皆有胾醢房中之羞內羞也酏音移臐音熏膮音枵胾音志賔客筮而戒之使助祭者既獻尸而遂與之相獻酬也主人酌賔曰獻賔飲去聲主人曰酢主人又自飲而復飲並去聲賔曰酬賔受之奠於席前而不舉至旅而後少去聲長相勸而交錯以遍也特牲迎尸正祭之後主人獻尸主婦亞獻尸賔三獻尸尸皆酢酢畢主人獻賔及衆賔宗人公有司又獻長兄弟衆兄弟及私臣又獻內兄弟畢長兄弟及衆賔長各洗觚為加爵嗣舉奠弟子舉觶於其長為旅酬佐食獻尸祝告利成尸出徹俎賔出輯録傳東西為交邪行為鍇卒盡也度法度也獲得其宜也卒度卒獲言無不合於法無不得其宜也輯録謝氏曰笑語卒獲言旅也語恩澤行於禮法之中和樂生於誠敬之餘也格來酢報也內而主婦外而賔客及賤而執㸑者無不敬以捋事如此此神之所以饗而福之所以降也此章通以爼豆獻酬之事言我孔熯而善反矣式禮莫愆叶起巾反工祝致告徂賚孝孫叶須倫反苾滿必反芬孝祀叶逸織反神嗜飲食卜爾百福叶筆力反如幾音機如式既齊既稷既匡既敕永錫爾極時萬時億賦也熯竭也善其事曰工輯録工於為祝者苾芬香也卜豫與同也幾期也春秋傳曰易幾而哭是也定公元年叔孫成子逆昭公之喪于乾侯子家子不見叔孫易幾而哭注幾哭會也不見叔孫故朝夕哭不同會式法齊整稷疾匡正敕戒整則不亂疾則不慢正則不邪戒則不忽皆莊敬之容也極至也禮行既久筋力竭矣而式禮莫愆敬之至也事有始終敬無間斷彼上章潔牛羊者執㸑者君婦賔客皆極其禮敬如此乃言主祭者之敬其不替又如此則自妥侑以來敬可知也於是祝致神意以嘏音假主人輯録少牢注嘏大也豫主人以大福輔氏曰徂賚二字重釋致告之義如言以其所致告者往而豫孝孫也曰爾飲食芳潔上言酒食牛羊燔炙之類故報爾以福祿使其來如幾其多如法孔氏曰如期不遲晚也如法豐足不乏少也爾禮容莊敬以妥以侑至此式禮莫愆皆是故報爾以衆善之極使爾無一事而不得乎此此字即指極而言之極訓為至則至極而無以復加者也修身而得身修之極齊家治國而得家齊國治之極推之其餘莫不皆然所謂無一事而不得乎此也非神所賜何以若是各隨其事而報之以其類也福祿以報飲食之芳潔衆善之極以報禮容之莊敬各隨其事而報之也但極之所在即福之所在極又可以兼乎福矣少牢嘏詞曰皇尸命工祝承致多福無疆于女音汝孝孫輯録注曰承猶傳也來女孝孫注云來讀曰釐釐賜也即所謂承而致之也使女受祿于天宜稼于田眉夀萬年勿替引之此大夫之禮也公卿大夫其禮皆然故引以為證特牲主人獻尸尸酢主人遂嘏主人此章自主人獻尸時言之而述祝嘏之詞如此禮儀既備叶滿北反鐘鼓既戒叶訖力反孝孫徂位叶力入反工祝致告叶古得反神具醉止皇尸載起鼓鐘送尸神保聿歸諸宰君婦廢徹直列反不遲諸父兄弟備言燕私叶息夷反賦也戒告也告以當奏送尸之樂宜預備也輯録輔氏曰禮儀既備言其禮之無不舉也鐘鼓既戒言其樂之無不奏也如此則祭事以畢矣徂位祭事既畢主人往阼階上西面之位也致告祝傳尸意告利成於主人言孝子之利養去聲成畢也主人出立于阼階上西面祝出西階東面告利成利訓為順成訓為畢言孝子之順養禮畢也於是神醉而尸起送尸而神歸矣神無形尸與神為節度送尸則神歸矣輯録少牢曰告利成畢祝入主人降立于阼階東西面尸遂出于廟門外曰皇尸者尊稱之也鼓鐘者尸出入奏肆夏也先既戒之至比乃奏之鬼神無形言其醉而歸者誠敬之至如見之也諸宰家宰非一人之稱也廢去上聲也輯録箋諸宰徹去諸饌君婦籩豆而已不遲以疾為敬亦不留神惠之意也祭畢既歸賔客之爼同姓則留與之燕以盡私恩祭則燕於寢惟同姓得以昭穆序異姓賔客不可與燕故歸其爼所以尊賔客親骨肉也禮畢而送尸則徹爼而行燕私之禮此章自祭畢時言之樂具入奏叶音族以綏後祿爾殽既將莫怨具慶卟祛羊反既醉既飽叶補苟反小大稽首神嗜飲食使君夀考叶去九反孔惠孔時維其盡叶子忍反之子子孫孫勿替天帝反引之賦也凡廟之制前廟以奉神後寢以藏衣冠輯録通釋曰廟及寢皆南向廟屋五架中架以南通謂之堂以北則分其東為房西為室此大夫之制也室有户牖户東而牖西牖之內為奧神位所在也房之東室之西近南各有廂爾雅所謂室有東西廂曰廟者是也廟之後别為寢以藏祖宗之遺衣冠祭時則授尸以服之其寢如廟之制而無東西廂爾雅所謂室無東西廂曰寢者是也祭於廟而燕於寢故於此將燕而祭時之樂皆入奏於寢也輯録疏燕祭不得同樂而云皆入者歌詠雖異樂器則同故皆入也且於祭既受祿矣故以燕為將受後祿而綏之也祭祀獲成已為受祿燕飲喜樂又為後祿受而綏之者若受之於彼而置之於此使安固也爾殽既進與去聲燕之人無有怨者此言小者即前章之諸父兄弟也燕私舉而人心和悅如此而皆歡慶醉飽稽首輯録頭拜至地而言曰向者之祭神既嗜君之飲食矣是以使君夀考也又言君之祭祀甚順甚時順者順於理時者適其時無所不盡董氏曰內盡志外盡物子子孫孫當不廢而引長之也祭而格神則一身宜受其福祭而盡禮則子孫當守其規此與燕者所以祝主人也此章以燕私之事言之而述與燕者之慶詞如此楚茨六章章十二句增釋許氏曰此詩意趣宏傳辭氣縱逸語緒參差非它詩比讀之茫然不知其際久之始見端倪蓋一章謂勤於稼穡所入者盛得以為祭祀之具二章言牲體之潔三章言爼豆之盛又皆言神享而降福四章祝致神語五章送神而起六章燕宗族之端卒章宗族燕而祝君夀福也吕氏曰楚茨極言祭祀所以事神受福之節致詳致備所以推明先王致力於民者盡則致力於神者詳此本序説故以先王言觀其威儀之盛物品之豐所以交神明逮羣下至於受福無疆者非德盛政修何以致之輯録朱子曰此下諸篇在小雅而非天子之詩故知其為公卿之事蓋畿內之諸侯也信彼南山維禹甸田見反叶徒鄰反之畇畇音勻原隰曽孫田叶地因反之我疆我理南東其畝叶滿彼反賦也南山終南山也甸治也畇畇墾辟音闢貌輯録疏墾耕其地闢除其萊以成桑田也曾孫主祭者之稱曾重平聲也自曾祖以至無窮皆得稱之也疆者為之大界也理者定其溝塗也大界猶十里之成萬夫之川是也十夫有溝百夫冇塗視澮川道路則為小畝壟音隴也長樂劉氏曰其遂東入于溝則其畝南矣其遂南入于溝則其畝東矣周禮百畝為夫夫間有遂九夫為井井間有溝凡遂在田首愚按如此則遂在井之內溝在井之外田首者水之來處也畝以防水則當卑下之處地之大勢東南下故欲水自西而東則為畝在水之南欲水自北而南則為畝在水之東也然髙下相因無定勢舉東南則西北可推故專於下文言順其地勢水勢之所宜則知不可執一論也此詩大指與楚茨略同此即其篇首四句之意也輯録輔氏曰此詩亦是詩人述公卿有田祿者力於農事以奉宗廟之祭也言信乎此南山者本禹之所治輯録通釋曰禹平水土大舜美其功曰地平天成萬世永賴今考於詩尤信也其見於小雅則冇此詩大雅則曰豐水東注維禹之績又曰奕奕梁山維禹甸之魯頌則曰纘禹之緒啇頌則曰禹敷下土方又曰設都于禹之績可以見禹功之在人心可以見人心之知所本也故其原隰墾闢而我得田之於是為之疆理而順其地勢水勢之所宜或南其畝或東其畝也畇畇原隰可見甸之之功我疆我理即是田之之事上天同雲雨于付反雪氛氛敷云反益之以霡亡革反霂音木既優既渥叶烏谷反既霑既足生我百榖賦也同雲雲一色也將雪之候如此氛氛雪貌霡霂小雨貌優渥霑足皆饒洽之意也冬有積雪春而益之以小雨潤澤則饒洽矣雨雪以時斂藏發育得其正故能生我百榖也田之辟者禹之功榖之生者天所賜於篇首二章述之不忘本也疆場音亦翼翼黍稷彧彧於六反叶于逼反曾孫之穡以為酒食畀必寐反我尸賔夀考萬年叶泥因反賦也場畔也翼翼整飭貌彧彧茂盛貌畀與也邱氏曰與尸謂獻孰食并酌齊獻尸是也與賔謂助祭之賔酌齊獻尸尸因酌以酢賔并祭畢燕同姓於寢也祭禮始終用酒食之事如此言其田整飭而榖茂盛者皆曾孫之穡也於是以為酒食而獻之於尸及賔客也輯録通釋曰三獻尸之後主人亦有獻賔之禮隂陽和萬物遂此連上章而言冬雪春雨則隂陽和矣黍稷生長則萬物遂矣而人心歡悅以奉宗廟則神降之福故夀考萬年也此章言地利充斥穡事大成則祭祀之禮莫非至情而神降之福可必矣此章弟一句承首章之意第二句承二章之意中田有廬疆場有瓜叶攻乎反是剝是菹側居反獻之皇祖曾孫夀考叶孔五反受天之祜候古反賦也中田田中也菹酢音醋菜也祜福也一井之田其中百畝為公田內以二十畝分八家為廬舍以便田事輯録疏廬舍在內貴人也公田次之重公也私田在外賤私也於畔上種瓜以盡地利瓜成剝削淹漬以為菹而獻皇祖貴四時之異物順孝子之心也地無遺利祭無遺禮於此可知但菹不止於瓜舉此以為例爾祭以清酒從以騂息營反牡享于祖考叶去久反執其鸞刀以啓其毛取其血膋音聊叶音勞賦也清酒清潔之酒鬱鬯之屬也輯録鬱鬯者禮家以為釀秬為酒煮鬱金香草和之其氣芬芳而條暢也騂赤色周所尚也祭禮先以鬱鬯灌地求神於隂輯録董氏曰酒以灌地降神取其馨香下達然後迎牲執者主人親執也鸞刀刀有鈴也輯録疏刀環有鈴其聲中節膋脂膏也啓其毛以告純也取其血以告殺也牲必騂色故告純牲必特殺故告殺取其膋以升臭也合古沓反之黍稷實之於蕭而燔之以求神於陽也膋必以蕭裹之蕭香蒿也乃以火燒之合其馨香之氣是升臭也記曰周人尚臭灌用鬯臭句鬱合鬯句臭隂達於淵泉灌以圭璋用玉氣也輯録陳氏曰灌之禮以圭璋為瓉之柄用玉之氣亦是尚臭也既灌然後迎牲致隂氣也蕭合黍稷臭陽達於墻屋故既奠然後焫音爇蕭合羶馨同薌香同凡祭慎諸此輯録陳氏曰既奠謂薦熟之時蓋堂上事尸禮畢延尸於戶內而薦之熟祝先酌酒奠於鉶羮之南而尸猶未入蕭脂黍稷之燒正此時也馨香即黍稷也此天子諸侯之禮魂氣歸于天形魄歸于地故祭求諸隂陽之義也輯録朱子曰天地隂陽之氣交合始成人氣便是魂精便是魄到得將死熱氣上出所謂魂升下體漸冷所謂魄降所以祭祀燎以求諸陽灌以求諸隂也問祖先已死以何而求曰只是以我之氣承接其氣便是冇求底道理古人於祭祀極重直是要求而得之商人求諸陽便先作樂發散即陽氣以求之周人求諸隂便焚燎鬱鬯以隂去求之又曰如言殂落徂升也是魂之遊落是魄之降祭求諸陽所以求其魂求諸隂所以求其魄是蒸是享叶虛良反苾苾芬芬祀事孔明叶謨郎反先祖是皇報以介福萬夀無疆賦也蒸進也承上章牲酒言以此而蒸以此而享則飲食芳潔而祭祀明備矣或曰冬祭名信南山六章章六句一章二章三章共一意以黍稷為主故以夀考萬年結之四章自是一意以瓜為主故以受天之祜結之五章六章又共一意以牲酒為主故以萬夀無疆結之但畀尸賔獻皇祖皆擬議於其前至蒸享苾芬而祀事始成也增釋吳師道曰一章疆理修二章雨雪時三章黍稷盛四章菜菹具五章犧牲備六章祀事成嘗細推之首章疆理修起下章種植也二章雨雪起下章有年也三章疆場翼翼者首章修墾之績黍稷彧彧者二章種植之功也此是足上二章之意黍稷既成可為酒食以畀尸賔舉祭之始終言之也四章承上章言田中有黍稷則以為酒食疆埸有瓜則以為菹而獻皇祖也然曰畀曰獻者必供此用將進之辭也五章首言祭是祭之時矣雖主言犧牲而詳及灌鬯焫蕭氣臭匝牲之事併酒黍稷在其中矣卒章文總第三章以下之意是蒸是享總畀獻享言也苾苾芬芬總諸物氣臭言也前言獻之皇祖享于祖考故此言先祖是皇也前言夀考萬年曽孫夀考受天之祜故此言報以介福萬夀無疆也倬陟角反彼甫田叶地因反嵗取十千叶倉新反我取其陳食音嗣我農人自古有年叶泥因反今適南畝叶滿彼反或耘或耔音子叶奬里反黍稷薿薿魚起反攸介攸止蒸我髦音毛士錐里反賦也倬明貌甫大也十千謂一成之田地方十里為田九萬畝輯録井十為通通十為成而以其萬畝為公田蓋九一之法也我食祿主祭之人也陳舊粟也農人私百畝而養去聲公田者也有年豐年也適往也耘除草也耔雍去聲本也雍即壅字本根也蓋后稷為田一畝三畎几畎之長竟畝一畝為三畎一夫百畝則三百畎也廣尺深尺而播種上聲於其中苖葉以上以已通以上猶言既長也稍耨奴豆反鉏也壠草因壝其土以附苖根壠盡畎平則根深而能音耐風與旱也壝愈水反漢書作隤孔疏作壝壝埒也猶培也附根即雍本也能即耐字薿茂盛貌介大攸介攸止舒曠之地可止息之處也蒸進髦俊也俊士秀民也古者士出於農而工商不與去聲焉管仲曰農之子恆為農野處而不昵其秀民之能為士者必足賴也即謂此也出管子小匡篇本作朴野而不昵此與吕氏詩記之文同與本文小異蓋市井工商之子習為狎昵為農之子處鄙朴之地敦本尚實其中若有穎拔之人可以為士則厚重謹恪能勝重任而足為上所倚賴矣集傳引此以明髦士即秀民也輯録輔氏曰言農夫而終之以髦士所以重農也此詩述公卿有田祿者力於農事以奉方社田祖之祭輯録輔氏曰楚茨信南山二詩皆是述公卿有田祿者力於農事以奉其宗廟之祭故首皆推言昔人墾闢之力而我得以耕治以奉祭祀之意甫田之詩乃述公卿有田祿者力於農事以奉方社田祖之祭故首言有年之多與蓄積之富以見於神不可不報之意故言於此大田嵗取萬畝之入以為祿食及其積之久而有餘則又存其新而散其舊以食音嗣農人補不足助不給也蓋以自古有年是以陳陳相因所積如此然其用之之節又合宜而有序如此所以粟雖甚多而無紅腐不可食之患也輯録通釋曰嵗取萬畝之入取之有常也積粟有餘而能散以周農則用之合宜也於有餘之中必散舊而存新則用之冇序也存新散舊而無紅腐之患又見其不至於暴棄天物也又言自古既有年矣今適南畝農人方且或耘或耔而其黍稷又已茂盛則是又將復去聲有年矣故於其所美大止息之處輯録何伯善曰美大就黍稷言之止息就農人言之其説與疏義不同未知然否進我髦士而勞去聲之也南畝即甫田之間髦士即農人之秀者慰勉之意不可人人曉之惟可與言者與之言庶幾達於衆也事此章言其力於農如此以我齊音咨明叶謨郎反與我犧羊以社以方我田既臧農夫之慶叶祛羊反琴瑟擊鼓以御牙嫁反田祖以祈甘雨以介我稷黍以榖我士女賦也齊與粢同曲禮曰稷曰明粢輯録陳氏曰明則足以交神此言齊明便文以協韻耳犧羊純色之羊也輯録疏社為隂祀其犧用純黑色其方祀各以其方之色也社后土也以句音勾龍氏配輯録疏社者五土之神能生萬物者以古之有大功者配之共工氏之霸九州也其子曰后土能平九州故祀以為社左傳共工氏有子曰句龍為后土后土土官之名也死以為社神而祭之故曰句龍為后土後轉為社故世人謂社為后土后土者地之大名也增釋許氏曰疏意謂后土有二名同實異社則祭五土之神而以句龍配非祭大地也方秋祭四方報成萬物萬物既成報其賜也周禮所謂羅弊句致禽以祀祊是也祊即方字羅網也弊止也以網捕獸獸盡而網止則獻所獲之禽以祭四方之神也蓋秋獮之禮如此臧善慶福御迎也田祖先嗇也謂始耕田者即神農也輯録疏若神農始教造田謂之田祖先為稼穡謂之先嗇神其農業謂之神農名殊而實同也增釋許氏曰禮記注先嗇若神農者疏若是不定之辭以神農比擬故云若種曰稼斂曰嗇不云稼穡云嗇者取其成功收斂若嗇而祭也斂去聲周禮籥章凡國祈年于田祖則吹豳雅擊土鼓以樂田畯是也增釋許氏曰此傳田畯與經三章田畯不同傳以神言經以人言也豳詩説詳見豳風總結處榖養也又曰善也言倉廪實而知禮節也輯録王肅本管子牧民篇語言奉其齊音咨盛音成輯録在器曰盛犧牲以祭方社而曰我田之所以善者非我之所能致也乃賴農夫之福而致之耳神以豐年之福賜農人我則因農人而受福也又作樂以祭田祖而祈雨庶有以大其稷黍而養其民人也因報成而知有賴於民者如此則又當祈年而為農夫訃矣是蓋一時之祭而報祈之意具焉者也此章言其奉方社田祖之祭如此輯録胡氏曰此章分兩節農夫之慶以上秋報也琴瑟擊鼓以下又是春祈也解頤曰齊明犧羊禮之盛也禮以備物故於報成之祭言之琴瑟擊鼓樂之盛也樂以達和故於祈年之祭言之上言方社而不及田祖因方社以見田祖也下言田祖而不及方社舉田祖以見方社也上言農夫之慶歸其功於民也下言榖我士女溥其惠於下也曾孫來止以其婦子叶奬里反饁干輒反彼南畝叶滿彼反田畯音俊至喜攘如羊反其左右叶羽已反嘗其旨否叶補美反禾易以豉反長畝同上終善且有叶羽已反曾孫不怒農夫克敏叶母鄙反賦也曾孫主祭者之稱非獨宗廟為然曲禮外事曰曾孫某侯某輯録陳氏曰先儒以外事為治兵然巡狩朝聘盟會之類皆外事也武王禱名山大川曰有道曾孫周王發輯録見武成篇是也饁餉攘取旨美易治長竟有多敏疾也曾孫之來適見農夫之婦子來饁耘者於是與之偕至其所而田畯亦至而喜之乃取其左右之饋而嘗其旨否言其上下相親之甚也輯録謝氏曰攘其左右者所取非一夫之餉也或取諸左或取諸右嘗其旨否者所嘗非止一夫之餉也何者為甘美何者為不甘美無不知也一以知田家之苦樂一以見官民之相親也既又見其禾之易治竟畝如一而知其終當善而且多是以曾孫不怒輯録解頤曰曾孫之來以省耕為職者也田畯之至以勸農為職者也於田畯曰喜於曽孫曰不怒互文以見意也而其農夫益以敏於其事也此申首章之意也自曽孫來止至嘗其旨否皆適南畝之事易治竟畝即耘耔之事農夫克敏則髦士能體勸農之意也曽孫之稼如茨才私反如梁曾孫之庾羊主反如坻直基反如京叶居良反乃求千斯倉乃求萬斯箱黍稷稻梁農夫之慶叶祛羊反報以介福萬夀無疆賦也茨屋蓋言其密比毗至反也輯録疏謂以茅覆屋言其積聚髙大如屋茨耳梁車梁言其穹隆也坻水中之髙地也京髙丘也箱車箱也此言收成之後禾稼既多則求倉以處之求車以載之而言凡此黍稷稻梁皆賴農夫之慶而得之是宜報以大福使之萬夀無疆也其歸美於下而欲厚報之如此此申二章之意也千倉萬箱以上發我田既臧一句報以介福則介稷黍榖士女之云也甫田四章章十句此詩以自古有年一句為大旨夫萬畝之入末嘗取盈而有陳可取以食農人者以自古冇年故也黍稷薿薿則又將有年矣蒸我髦士必謂有年相繼則取陳食爾又可圖也我田既臧則有年已荐臻矣以介稷黍則冀其又有年也至於三章又申首章之意四章又申二章之意則所以祈冇年者愈無窮矣大田多稼既種章勇反既戒既備乃事叶上止反以我覃音琰耜叶養里反俶載南畝叶滿彼反播厥百榖叶工洛反既庭且碩叶常約反曾孫是若賦也種擇其種也戒飭其具也修耒耜具田器覃利俶始載事庭直直則茂拳曲則生不遂矣碩大若順也蘇氏曰田大而種多故於今嵗之冬具來嵗之種戒來嵗之事凡既備矣然後事之事事皆備然後事其事取其利耜而始事於南畝輯録輔氏曰王氏謂畝大抵以南為正故每曰南畝不知何所據但南乃陽明之方故多言之既耕而播之其耕之也勤而種之也時故其生者皆直而大以順曾孫之所欲農夫勤敏而得黍稷茂盛如此用之以順曽孫之所欲也蓋曽孫之所欲者豐年而已故用力致此黍稷以順之此詩為農夫之詞以頌美其上若以答前篇之意也輯録解頤曰大田多稼總言其事以發端也既種既戒善其備於往嵗也既備乃事致其力於今嵗也以我覃耜利其器也俶載南畝耕之勤也播厥百榖種之時也既庭且碩生之盛也几此皆以順曾孫之所欲也既方既皂叶子苟反既堅既好叶許苟反不稂音郎不莠餘久反去起吕反其螟莫延反螣音特及其蟊莫侯反賊無害我田稚音雉田祖有神秉畀炎火叶虎委反賦也方房也謂孚田始生而未合時也曰孚曰甲皆粟皮也劉氏曰榖粒之生必先有房甲而後充實也輯録房謂米生於中若人之房舍甲者以在米外若鎧甲也實未堅者曰皂方始秀也皂始實也堅好則實而成矣稂童粱輯録説文作節禾粟之穗生而不成者莠似苖皆害苖之草也輯録害苖分其土力食心曰螟食葉曰螣食根曰蟊食節曰賊皆害苖之蟲也輯録害苖戕其根株稚幼禾也輯録疏蟲災禾稚者偏甚言其苖既盛矣輯録鄭氏曰盡生房矣盡成實矣盡堅熟矣盡齊好矣而無稂莠擇種之善民力之專時氣之和所致之又必去上聲此四蟲然後可以無害田中之禾然非人力所及也故願田祖之神為去聲我持此四蟲而付之炎火之中也去稂莠在人去蟲蝗在神故冇望於田祖如此姚崇遣使去聲捕蝗引此為證夜中設火火邊掘坑且焚且瘞音意蓋古之遺法如此開元四年有淹於檢反萋萋七西反興雨祁祁雨于付反我公田遂及我私叶意夷反彼有不穫稚此有不斂力檢反穧才計反彼有遺秉此有滯穗伊寡婦之利賦也淹雲興貌萋萋盛貌祁祁徐也雲欲盛盛則多雨雨欲徐徐則入土公田者方里而井井九百畝其中為公田八家皆私百畝而同養公田也穧束秉把也滯亦遺棄之意也輯録吕氏詩記稚謂穗之低小刈蒦之所不及者穧謂刈而遺忘束縛之所不及者秉謂束而輦載之所不盡者滯謂成而折亂秉穫之所不逮者言農夫之心先公後私故望此雲雨而曰天其雨我公田而遂及我之私田乎冀怙君德而蒙其餘惠使收成之際彼有不及穫之稚禾此有不及斂之穧束彼有遺棄之禾把此有滯漏之禾穗而寡婦尚得取之以為利也此見其豐成有餘而不盡取又與鰥寡共之既足以為不費之惠而亦不棄於地也不然則粒米狼戾不殆於輕視天物而慢棄之乎輔氏曰雨我公田者尊君之義也寡婦之利者及衆之仁也愚謂至公無私天道也先公後私民情也利及寡婦則民之情亦至公而無私矣蓋天無心故生物之功溥民有心故尊君上恤窮民無不用其極也此皆當時願望之意曾孫來止以其婦子饁彼南畝子畝並見前篇田畯至喜來方禋音因祀叶逸織反以其騂黑與其黍稷以享以祀同上以介景福叶筆力反賦也精意以享謂之禋來方禋祀來祭四方也語倒如此農夫相告曰曾孫來矣於是與其婦子饁彼南畝之穫者而田畯亦至而喜之也此四句與甫田同但彼則君上勸農而見農夫之勤此則農夫相勸以慰君上之心一為耘耔之時一為收斂之時也曾孫之來又禋祀四方之神而賽禱焉賽者報豐年禱者祈景福四方各用其方色之牲此言騂黑舉南北以見其餘也輯録吕東萊曰南方用騂北方用黑孔氏所謂略舉二方以為韻句是也以介景福農夫欲曾孫之受福也增釋吳師道曰此詩為農夫之詞以頌美其上而亦有稱曽孫可以見俗之質厚而上下親愛之誠大田四章二章章八句二章章九句一章地廣而能盡耕種之功二章苖盛而願除蟲蝗之害三章則願得豐年而望雲雨四章則已得豐年而舉報祈前篇有擊鼓以御田祖之文故或疑此楚茨信南山甫田大田四篇即為豳雅其詳見於豳風之末亦未知其是否也輯録朱子曰楚茨以下四篇即豳雅反覆讀之其辭氣與七月載芟良耜等篇大抵相類斷無可疑然前篇上之人以我田既臧為農夫之慶而欲報之以介福此篇農夫以雨我公田遂及我私而欲其享祀以介景福上下之情所以相賴而相報者如此非盛德其孰能之輯録輔氏曰上之欲報其下者如此則是君以民為體也下之欲報其上者如此則是民以君為心也上下之情相類以為一則君之德固厚而民之德亦厚也瞻彼洛矣維水泱泱於良反無韻未詳君子至止福祿如茨韎音昧韐音閣有奭許力反以作六師賦也洛水名在東都會諸侯之處也輯録問洛水或云兩處朱子曰此只就洛邑言之泱泱深廣也君子指天子也茨積也韎茅搜所染色也輯録茅搜茹藘也古謂之茅搜今謂之茜草亦作蒨一名地血一名牛蔓染絳之草也説文云茅搜染草一入為韎韐韠也合古沓反韋為之輯録疏是蔽膝之衣周官所謂韋辨兵事之服也輯録韋辨詳見六月常服注奭赤貌作猶起也六師六軍也天子六軍輯録按周禮鄉大夫每鄉卿一人六鄉六卿平居無事則各掌其鄉之政教禁令而屬於大司徒有事出征則各率其鄉之萬二千五百人而屬於大司馬所謂軍將皆命卿者是也此天子會諸侯于東都以講武事而諸侯美天子之詩言天子至此洛水之上御戎服而起六師也御戎服起六師尊大威嚴如此以福祿所集而然也故福録如茨在韎韐作師之上此章專美今日之事瞻彼洛矣維水泱泱君子至止鞞補項反琫必孔反有珌賔一反君子萬年保其家室賦也鞞容刀之鞞今刀鞘音笑也琫上飾珌下飾亦戎服也服飾如此尊臨天下福祿盛矣且將長受福祿保有天下而不失也輯録毛氏曰天子玉琫而珧珌諸侯璗琫而璆珌珧音遙璗音蕩璆音求孔氏曰珧蜃甲也黃金謂之璗瞻彼洛矣維水泱泱君子至止福祿既同君子萬年保其家邦叶卜工反賦也同猶聚也福祿既同已盛矣萬年保家邦又將及其久也此二章既美之又祝之蓋上章申韎韐有奭之意而致其祝此章申福祿如茨之意而致其祝天子以天下為家故以家邦家室言瞻彼洛矣三章章六句輯録朱子曰詩多冇酬酢應答之篇瞻彼洛矣是臣歸美其君君子指君也當時朝會於洛水之上而臣祝其君如此裳裳者華又是君報其臣桑扈鴛鴦皆然裳裳者華其葉湑思吕反兮我覯之子我心寫叶想與反兮我心寫兮是以有譽處兮興也裳裳猶堂堂董氏曰古本作常常棣也湑盛貌覯見處安也此天子美諸侯之辭蓋以答瞻彼洛矣也言裳裳者華則其葉湑然而美盛矣我覯之子則其心傾寫而悅樂之矣此以可喜之物為喜見諸侯之興也見裳華之葉湑然已心喜况得見此賢諸侯乎喜可知矣夫能使見者悅樂之如此此釋重言寫兮一句則其有譽處宜矣譽處安樂也既能獲乎上斯宜有其樂此章與蓼蕭首章文勢全相似文勢相似意則不同彼以露在蓼蕭為興而兼言上下之樂此則只以裳華之葉湑然為興故專美人臣能得君心而有其樂也合二章集傳觀之可見裳裳者華藝其黃矣我覯之子維其有章矣維其有章矣是以有慶叶墟羊反矣興也藝黃盛也裳華之藝黃亦有文章粲然之意故以為興章文章也有文章斯有福慶矣文章者德之見於容貌者也和順積中英華發外交際之頃不愆于儀則上得於君而獲福必然矣上章之譽處即此章之福慶也裳裳者華或黃或白叶僕各反我覯之子乘其四駱乘其四駱六轡沃若興也言其車馬威儀之盛裳華之色不齊而之子之馬則其色齊也此反其意以為興也美其文章則有根於中者美其車服則有所以稱其服者二章皆不顯言而自可見我心寫兮之故也左叶祖戈反之左同上之君子宜叶牛何反之右叶羽已反之右同上之君子有叶羽已反之維其有同上之是以似叶養里反之賦也言其才全德備以左之則無所不宜以右之則無所不有此有字是冇之於外維其有之於內是以形之於外者無不似其所有也左之宜右之冇人見其然而不知夫體無不具是以用無不周也此則因其所設施而推其所藴蓄顯顯言之以深見我心寫兮之故也裳裳者華四章章六句北山之什十篇四十六章三百三十四句詩經疏義會通卷十三
