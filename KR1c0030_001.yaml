  text: 欽定四庫全書
  hash: sha256:64d9ff2e7643d8cd3464e7f4c9e75c7d6d85eb6ee80c540d6dcbeeab187b9ddc
  markers:
  - {type: page-break, offset: 0, content: '', id: KR1c0030_WYG_001-1a, image: WYG0077/WYG0077-0014a.png}
body:
  text: 詩經疏義㑹通元朱公遷撰圖說上朱子曰先儒正變之說經無明文可考今姑從之其可疑者則具於本篇云二南為正風所以用之閨門鄉黨邦國而化天下也十三國為變風則亦領在樂官以時存肄觀省而垂鑒戒耳正小雅燕饗之樂正大雅㑹朝之樂受釐陳戒之辭也故或歡欣和恱以盡羣下之情或恭敬齊莊以發先王之德詞氣不同音節亦異多周公制作時所定也及其變也則事未必同而各以其聲附之其次序時世則有不可考者矣靈臺文王所作所以望氛祲察災祥時觀遊節勞佚也辟雍辟璧通雍澤也天子之學大射行禮之處也水旋丘如璧以節觀者故曰辟雍朱子初解曰張子云辟雍古無此名則其制蓋始於此及周有天下遂以名天子之學而諸侯不得立焉太王遷岐胥宇築室作廟立臯門應門立冢土古公亶父後追稱太王王之郭門曰臯門王之正門曰應門太王之時未有制度作二門如此及周有天下遂尊以為天子之門而諸侯不得立焉泮水泮宫之水諸侯之學鄉射之宫謂之泮宫其東西南方有水形如半璧以其半於辟雍故曰泮水而宫亦以名也織女天女也牽牛服駕也啓眀長庚皆金星也以其先日而出故謂之啓眀以其後日而入故謂之長庚天畢畢星也狀如掩兔之畢也箕斗二宿以夏秋之間見於南方云北斗者以其在箕之北也火大火心星也以六月之昏加於地之南方至七月之昏則下而西流矣火伏於九月至十月昏旦並不見唯冬至後旦中至正二三四皆見旦後也左𫝊張躍曰火星中而寒暑退服䖍注云旦中而寒退昏中而暑退定北方之宿營室星也此星昏而正中夏正十月也建亥月小雪中氣之時於是時可以營制宫室故謂之營室衛為狄所滅文公徙居楚丘營立宫室樹八尺之臬而度其日出入之景以定東西又參日中之景以正南北也經云既景乃岡又云相其隂陽度其夕陽𫝊云景測日景以正四方也相視也隂陽向背寒暖之宜也山西曰夕陽嚴氏曰豳在梁山西公劉相此夕陽地以建豳居也今得西山真先生儒家武庫所著公劉相隂陽圖謹按其式作圖如上以備讀詩者考焉冠名殷曰冔周曰冕黼冔黼裳而冔冠也㑹辨如星㑹縫中也王之皮辨縫中每貫結五采玉十二以為飾武公諸侯則玉用三采臺夫須也即涉草也古注謂以夫須皮為笠所以禦暑禦雨緇布冠也撮者其制小僅可撮其髻也古注云太古冠繪龍山華蟲火宗彛五章天子之龍一升一降上公但有降龍龍一首卷然故謂之衮君純羔大夫以豹飾袪褎袪褎皆袂也然袪大而袂袖小錦衣狐裘朝天子之服蘇氏曰此狐裘狐白裘也五色備謂之繡前三幅後四幅繡以藻粉米黼黻四章芾太古蔽膝之象字當作韍古字通用冕服謂之芾其他服謂之􅔖以韋為之邪幅逼也邪纒於足如今行縢逼束其脛正義注云瑱塞耳也充耳是已天子以玉諸侯以石充耳以紞懸瑱當耳也紞用綵線織之天子諸侯五色臣三色君子偕老篇瑱言夫人服飾雜佩者左右佩玉也上橫曰珩繫三組貫以蠙珠中組之半貫瑀末懸衝牙兩旁組各懸琚璜又兩組交貫於瑀上繫珩下繫璜行則衝牙觸璜而有聲也狀如錐角以象骨為之所以解結古注云韘沓也以朱韋為之射以彄沓右手食指將指無名指以遂弦也爾雅云婦人之禕謂之縭孫氏云禕帨巾也故集𫝊曰婦人之禕母戒女而為之施襟結恱也禮記婦事舅姑左佩紛帨注紛帨拭手之巾也說文簪也其端刻雞形揥所以摘髮以象骨為之若今之篦兒
