body:
  text: 詩經䟽義㑹通卷十七元朱公遷撰生民之什三之二厥初生民時維姜嫄音原叶魚倫反生民如何克禋音因克祀叶飬里反以弗無子叶奬里反履帝武敏叶母鄙反歆攸介攸止載震載夙叶相即反載生載育叶曰逼反時維后稷賦也民人也謂周人也時是也姜嫄炎帝後姜姓有邰氏女名嫄爲高辛之世妃世妃正妃也或曰謂其後世子孫之妃也精意以享謂之禋祀祀郊禖也弗之言祓音弗除也也祓無子求有子也古者立郊禖盖祭天於郊而以先媒配也變媒言禖者神之也其禮以𤣥鳥至之日用大牢祀之𤣥鳥以春分日感陽氣為乳育而來故用此日輯録輔氏曰祠以仲春正其候也祭以大牢尊其禮也祀以南郊重其事也然祠禖之禮不知所始詩傳曰簡狄從帝而祀郊禖則是帝嚳簡狄之時已有神矣天子親徃后率九嬪音頻御乃禮天子所御謂天子所嘗御而有娠者帶以弓韣音獨授以弓矢于郊禖前也弓矢者男子所事故以帶以授輯録韣弓衣也見月令通釋曰此上所言祭郊禖之禮乃通言古者天子有此禮耳非專指姜嫄之事也履踐也帝上帝也武迹敏拇音母歆動也猶驚異也介大也震娠音身也夙肅也載震者受孕之始載夙者將生之時生子者及月辰居側室也及月辰謂生月之辰初朔之日也内則妻將生子及月辰居側室䟽云正寝之室在前燕寝在後側室又次燕寝之旁生子不於夫之正室及妻之燕寝必於側室以正室燕寢尊故也育飬也姜嫄出祀郊禖見大人迹而履其拇輯録箋云時有大人迹姜嫄履之足不能滿履其拇趾之䖏遂歆歆然如有人道之感於是即其所大所止之處而震動有娠所大所止注見甫田乃周人所由以生之始也輯録王氏曰緜所謂民之初生則本由太王之興此所謂厥初生民則本由后稷而起也周公制禮尊后稷以配天故作此詩以推本其始生之祥明其受命於天固有以異於常人也輯録輔氏曰初生周人者實姜嫄也生民如何是又問其所以然也以下則述其所以然而終結之以時維后稷一句盖言其所生之子實后禝也后稷始教民播種而利及萬世非天所命而何宜其始生之靈異乎然巨跡之說先儒或頗疑之而張子曰天地之始固未嘗先有人也則人固有化而生者矣盖天地之氣生之也蘇氏亦曰凡物之異於常物者其取天地之氣常多故其生也或異麒麟之生異於犬羊蛟龍之生異於魚鼈物固有然者矣輯録饒䨇峯曰天地泰和元氣之㑹鍾為麟鳯非是有種而生神人之生而有以異於人何足怪哉斯言得之矣以生民歸之姜嫄不稱其父而稱其母又有寘之隘巷以下數者之異故朱子取張子及蘇氏之說後世如劉媪夣與神遇而生漢髙亦此類也誕彌厥月先生如達他永反不坼勅宅反不副孚逼反叶孚迫反無菑音災無害叶音曷以赫厥靈上帝不寧不康禋祀叶飬里反居然生子叶奨里反賦也誕𤼵語辭彌終也終十月之期也先生首生也達小羊也羊子易生無留難也本草曰生物中羊産最易坼副皆裂也赫顯也不寧寧也不康康也居然猶徒然也凡人之生必坼副災害其母而首生之子尤難今姜嫄首生后稷如羊子之易無坼副災害之苦是顯其靈異也上帝豈不寧乎豈不康我之禋祀乎曰寧又曰康疊言之以見上帝安享其祭耳而使我無人道而徒然生是子也輯録輔氏曰首章言其受孕之祥此章言其降生之異受孕既夲於天則降生必異於人也誕寘之隘於懈反巷牛羊腓符非反字之誕寘之平林㑹伐平林誕寘之寒氷鳥覆敷救反翼叶音異之鳥乃去矣后稷呱叶去聲矣實覃實訏叶去聲厥聲載路賦也隘狹腓芘字愛新安胡氏曰集傳於采薇小人所腓引程子曰腓隨動也如足之腓足動則隨而動如是則正與易咸其腓同義意者牛羊見稷以足肚遮芘之如有愛之之意故謂之腓字㑹值也值人伐木而収之覆蓋翼藉也以一翼覆之以一翼藉之也呱啼聲也覃長訏大載滿也滿路言其聲之大也無人道而生子或者以為不祥故棄之而有此異也於是始收而飬之輯録解頥曰人與我同類者也物與我異類者也而無不有愛䕶之意以見天之所生固非人之所能棄也於是始収而飬之則亦知其受命於天而不可以常兒待之矣誕實匍音蒲匐蒲北反克岐克嶷魚極反以就口食蓺之荏而甚反菽荏菽斾斾禾役穟穟音遂麻麥幪幪莫孔反𤓰瓞唪唪布孔反賦也匍匐手足並行也岐嶷峻茂之狀就向也口食自能食也盖六七嵗時也蓺樹也荏菽大豆也斾斾枝旟揚起也言揚起如旟也役列也穟穟苖美好之貎也幪幪然茂宻也唪唪然多實也言后稷能食時已有種殖之志盖其天性然也史記曰棄為兒時其逰戯好去聲下同種植麻麥麻麥美及為成人遂好耕農堯舉以為農師輯録輔氏曰此章則言后稷之於種殖盖天性自然生知非從習得皆所以終首章之意誕后稷之穡有相息亮反之道叶徒口反茀音弗厥豐草叶此苟反種去聲之黄茂叶莫口反實方實苞叶補苟反實種上聲實褎叶徐久反實𤼵實秀叶怱久反實堅實好叶吁口反實頴營井反實栗即有邰他來反家室賦也相助也言盡人力之助也茀治也種布之也黄茂嘉穀也茀豐草治其地也種黄茂擇其種也此所以為相之之道也方房也苞甲而未拆也生意蔵於其中是為房生意蓄而欲泄是為甲甲者草木之仁也此漬其種上聲也種甲拆而可為種也拆則破其種而出之矣褎漸長上聲也輯録嚴氏曰以上言禾之苗也𤼵盡𤼵也盡𤼵猶言極盛謂生意之𤼵止於此盖生莖而將穗之時也秀始穟也輯録嚴氏曰以上言禾之秀也堅其實堅也好形味好也頴實繁碩而垂末也栗不秕補履反也既收成見其實皆栗栗然不秕也輯録嚴氏曰以上言禾之實也邰后稷之母家也豈其或滅或遷而遂以其地封后稷歟言后稷之穡如此輯録輔氏曰夫自浸種以至收成無非盡人力以相助之而但曰穡者要其成而言之耳故堯以其有功於民封於邰使即其母家而居之以主姜嫄之祀故周人亦世祀姜嫄焉増釋金履祥曰后稷之穡凡上章荏菽禾麻𤓰瓞之類但后稷所種斂則各有助其成實之道盖知其性及其漬種之法與地之宜天之時故實有方苞種褎𤼵秀堅好穎栗之美至下章秬秠穈芑則又自后稷而始種之爾堯以棄教民稼穡有功生人故封之又以其母感化而育不由有父故使其繼母氏之國祚之土而命之曰姬氏邰在武功有后稷祠姜嫄祠又見周南誕降嘉種維秬音巨維秠孚鄙反維穈音門維芑音起恒古鄧反之秬秠是穫是畆叶蒲洧反恒之穈芑是任音壬是負叶扶委反以歸肇祀叶飬里反賦也降降是種於民也書曰稷降播種是也秬黒黍也秠黑黍一桴音孚二米者也穈赤粱粟也芑白粱粟也輯録解頥曰稷之降種其名不一而此獨以其可供祭祀者言之秬秠可以供欎鬯穈芑可以供粢盛恒徧也謂徧種之也任肩任也負背負也既成則穫而棲之於畒任負而歸以供祭祀也秬秠言穫畆穈芑言任負互文耳肇始也稷始受國為祭主故曰肇祀誕我祀如何或舂傷容反或揄音由或簸皮我反或蹂音柔釋之叟叟所留反烝之浮浮載謀載惟取蕭祭脂取羝都禮反以軷蒲未反叶蒲昧反載燔載烈如字叶力制反以興嗣嵗叶音雪又如字賦也我祀承上章而言后稷之祀也揄抒音暑臼也孔氏曰謂抒米以出臼也簸揚去糠也蹂蹂禾取穀以繼之也釋淅音昔洮米也米也叟叟聲也浮浮氣也此以上皆以黍稷言盖祭祀之禮必以黍稷為主且承上章之意耳謀卜日擇士也惟齋戒具脩也謀惟即天保所謂吉蠲也湛然純一之謂齊肅然敬惕之謂戒齊戒具脩言二者並至也輯録天官太宰掌百官之誓戒與其具脩前期十日帥執事而卜日遂戒及執事胝滌濯朱氏註曰百官謂與祀者具所以供其物脩所以理其壊戒散齊也遂戒以始齊滌濯謂洗祭器擇士見天保謝氏曰載謀則謀之於衆人載惟則思之於一心蕭蒿也脂膟音律膋音聊也輯録箋云膟膋膓間脂也宗廟之祭取蕭合古沓反膟膋爇之使臭逹墻屋也羝牡羊也軷祭行道之神也曹氏曰内言取蕭外言取羝則自宗廟以至羣祀皆舉矣愚按凡五祀春祭户夏祭竈夏季祭中霤秋祭門冬祭行五祀最小行又最後故舉行祭則餘在其中矣輯録夏官大馭註云行山曰軷盖封土為山祭之以牲既祭乃驅車轢其山而去之所謂犯軷也燔傅音附諸火也烈貫之而加于火也四者皆祭祀之事所以興來嵗而繼徃嵗也取蕭祭脂先宗廟也取羝以軷徧羣神也載謀載惟始之所以戒其事載燔載烈終之所以備其禮故曰四者皆祭祀之事此章發上章以歸肇祀一句故以我祀如何為起語輯録何伯善曰朱子舊註云於是或取蕭以祭脂或取羝以祀軷或燔之或烈之四者皆祭祀之事也卬五郎反盛音成于豆于豆于登其香始升上帝居歆下與今叶胡臭亶時叶上止反后稷肇祀叶飬里反庶無罪悔叶呼委反以迄許乙反于今上與歆叶賦也卬我也木曰豆以薦菹醢也瓦曰登以薦大音泰羮也至敬無文故禮最薄輯録太羹肉汁羮古之義也不調以鹽菜故以瓦器盛之居安也鬼神食氣曰歆胡何臭香亶誠也時言得其時也庶近迄至也此章言其尊祖配天之祭其香始升而上帝已安而饗之言應之疾也此何但芳臭之薦信得其時哉盖自后稷之肇祀則庶無罪悔而至于今矣周人敬天之心傳自后稷今以后稷所以敬天者祀稷而配天則志意相合精神相感神妙之機有不容言者矣后稷肇祀之敬於上章可見盡志盡物皆敬也郊以稷配天此言帝而不言稷者統於尊也帝享則稷亦享之矣曽氏曰自后稷肇祀以來前後相承兢兢業業惟恐一有罪悔獲戾于天閲数百年而此心不易輯録閲歴也故曰庶無罪悔以迄于今言周人世世用心如此也生民八章四章章十句四章章八句一章言其稟受之祥二章三章言其生育之異四章言其種殖本於天性五章言其受封本於農功六章言降種於民以供祭祀而始為祭主七章言祭祀之道情文兼備而嵗舉其事八章乃言今日之祭所以感格者不在乎物而在乎敬也此詩未詳所用豈郊祀之後亦有受釐音僖頒胙之禮也歟輔氏曰此詩專言后稷而不及於天則非可用於郊祀上帝之時矣若謂生民頌后稷宜入於頌而列於雅者雅頌不同體故也祀稷配天頌有思文之詩矣舊説第三章八句第四章十句今按第三章當為十句第四章當為八句則去呱訏路音韻諧恊呱聲載路文勢通貫而此詩八章皆以十句八句相間為次又二章已後七章已前每章章之首皆有誕字輯録輔氏曰先生嘗曰生民詩是叙事詩只得恁地盖叙得那首尾都盡下武文王有聲等詩却有反覆歌咏㡳意思又曰生民等詩也可見祭祀次第此與儀禮正相合敦徒端反彼行葦牛羊勿踐履方苞方體維葉泥泥乃禮反戚戚兄弟待禮反莫逺具爾或肆之筵或授之几興也敦聚貌勾萌之時也輯録勾曲生者萌直生者行道也勿戒止之詞也苞甲而未坼也體成形也泥泥柔澤貌戚戚親也行葦敦然本有生意兄弟戚戚亦本有相親之意也莫猶勿也具俱也爾與邇同肆陳也輯録肆筵行燕禮也授几優尊也疑此祭畢而燕父兄耆老之詩故言敦彼行葦而牛羊勿踐履則方苞方體而葉泥泥矣戚戚兄弟而莫逺具爾則或肆之筵而或授之几矣此以愛物之意興親親之意而其要在勿踐履奠逺具爾二句盖行葦之生不遂以牛羊牧之爾兄弟之情衰薄以踈逺積漸而然爾苟常相近相見則肆筵授几自有不可已者矣此方言其開燕設席之初而殷勤篤厚之意藹然已見於言語之外矣讀者詳之肆筵設席叶祥勺反授几有緝御叶魚駕反或獻或酢才洛反洗爵奠斚古雅反叶居訝反醓他感反醢以薦叶即略反或燔或炙叶陟略反嘉殽脾婢攴反臄渠略反或歌或咢五洛反賦也設席重平聲席也鋪陳曰筵藉之曰席筵在下席在上設於筵之上是重席也少者設席而已老者則加几使有所慿也緝續御侍也有相續代而侍者言不乏使也輯録禮所謂更僕是也輔氏曰首二句承上章而言其意有加無已也進酒於客曰獻客荅之曰酢主人又洗爵醻市流反客客受而奠之不舉也斚爵也夏曰醆殷曰斚周曰爵所洗之爵即所奠之斚互言以成文耳醓醢之多汁者也燔用肉炙用肝臄口上肉也輯録殽之美者以加獻曰脾曰臄皆甘而脆也歌者比音備於琴瑟也比合也凡歌必以弦和之徒擊鼓曰咢徒猶但也但擊鼓不合樂也輔氏曰鼓者衆音之主言鼓則衆音舉矣言侍御獻醻飲酒歌樂之盛也筵以延之席以安之授几以供慿藉緝御以給使今獻醻以通其情物品以備其禮歌樂以和其心此行葦之燕所以為盛也敦音雕下同弓既堅叶古因反四鍭音侯既鈞舎音捨矢既均序賔以賢叶下珍反敦弓既句古候反叶古侯反既挾子恊反四鍭四鍭如樹叶上三反序賔以不侮賦也敦雕通畫也天子雕弓堅猶勁也鍭金鍭剪羽矢也鐵以為鏃而剪羽以為矢也輯録爾雅金鏃剪羽謂之鏃孫炎曰金鏑衛羽使前重也鈞參音驂亭也即稱停之義謂三分之句一在前二在後三訂之而平者前有鐵句重也輯録䟽云四矢皆輕重鈞亭故言四鍭既釣舎釋也謂𤼵矢也均皆中去聲也賢射多中也投壺曰某賢於其若干純音全又如字竒音畸則曰竒均則曰左右均是也賢勝也䟽云二筭為純一筭為竒勝者雙數則曰若干純隻數則曰若于竒猶十筭則曰五純九筭則曰四純一竒也均等也等則左右各執一筭以告曰左右均句彀通謂引滿也所謂志於彀也射禮搢音晉三挾音浹一既挾四鍭則徧釋矣搢揷也方持弦矢曰挾弦縱矢横弦與矢作十字也射用四矢揷三矢於帶間挾一矢以射曰徧釋則四矢俱𤼵而無遺矣如樹如手就樹之言貫革而堅正也巧力俱全故能如此不侮敬也令弟子辭致其辭命也所謂無幠音呼大言也無敖音傲無偝音佩立偝立謂立不正也無踰言者也不歴位與言也四者皆侮慢之容敬之反也輯録投壺陳氏曰弟子賔黨主黨之年穉者幠亦敖也或曰不以中病不中者也不矜已之長愧人之短射以中多為雋以不侮為徳輔氏曰中多刖藝精不侮則徳盛嚴氏曰四鍭既釣統言射者故曰序賔以賢四鍭如樹專言勝者故曰序賔以不侮言既燕而射以為樂也此所謂射則燕射也但燕射用獸侯而象鵠大射用皮侯而設鵠此言貫革則皮侯設鵠而為大射矣當詳輯録儀禮曰禮射不主皮註云大射賔射燕射是也主皮者無侯張獸皮而射之主於獲也陳師凱曰主皮之射二一是卿大夫從君田獵班餘獲而射一是庶人之射其説又與車攻集傳意不同又有習武之射司弓職云弧矢以授射甲革椹質者是也許氏亦曰貫革之射軍旅用之此言貫革未詳何謂吕氏曰孔氏雖王肅燕射之説謂燕射旅酬之後乃為之不當設文於曽孫為主之上豈先為燕射而後酌酒哉遂從鄭氏以為大射抑不知此篇乃成周燕宗族兄弟之詩非大射擇士時也按儀禮燕射如鄉射之禮射雖畢而飲未終舉觶無筭爵献酌尚多言酌大斗祈黄耇於既射之後豈不可乎曾孫維主如字或叶當口反酒醴維醹如主反或叶奴口反酌以大斗叶腫庾反或如字以祈黄耇叶果五反或如字黄耇台湯來反背叶必墨反以引以翼壽考維祺音其以介景福叶律力反賦也曾孫主祭者之稱今祭畢而燕故因而稱之也醹厚也大斗柄長三尺輯録䟽漢禮器制度註勺五升徑六寸祈求也黄耇老人之稱以祈黄耇猶曰以介眉夀云耳古器物欵識輯録音志欵刻也識記也索隠曰識猶表識云用蘄音祈萬夀用蘄眉夀永命多福用蘄眉夀萬年無疆輯録並見吕大臨考古圖皆此類也台鮐湯來反也大老則背有鮐文台背比之黄耇為尤老盖肉消而皮舒故其文如此引導翼輔輔氏曰以引則不昧於所適以翼則不怠於所行祺吉也此頌禱之詞欲其飲此酒而得老夀又相引導輔翼以享夀祺介景福也既得老夀矣又必以善道自相引翼庶以享其祺介其福焉盖必攸好徳而後考終命享之介之在乎人也行葦四章章八句一章言設燕之意二章言燕飲之禮三章言燕射之樂四章言祝頌之情毛七章二章章六句五章章四句鄭八章章四句毛首章以四句興二句不成文理二章又不恊韻鄭首章有起興而無所興皆誤今正之如此慶源輔氏曰先儒分章之誤皆由不知比興之體音韻之節故也是以先生於序説不得不明辯之既醉以酒既飽以徳君子萬年介爾景福叶筆力反賦也徳恩惠也君子謂王也爾亦指王也此父兄所以荅行葦之詩言享其飲食恩意之厚永嘉陳氏曰燕接之間恩澤充足故言飽徳而願其受福如此也二章以後皆以反覆詳言此福也介爾景福與以介景福不同以介景福是求以致之介爾景福則彼自錫之爾既醉以酒爾殽既將君子萬年介爾昭明叶謨即反賦也殽爼實也將行也亦奉持而進之意昭明猶光大也光輝盛大受福之氣象也昭明有融髙朗令終令終有俶尺六反公尸嘉告叶姑沃反賦也融明之盛也春秋傳曰明而未融朗虚明也虚明則明之極盛而無以加矣令終善終也洪範所謂考終命輯録蔡氏曰順受其正也古器物銘所謂令終令命是也二書所言者一身之福耳此詩之令終則福又驗於子孫矣傳必連引以為例者以其語不同也俶始也公尸君尸也周稱王而尸但曰公尸盖因其舊如秦已稱皇帝而其男女猶稱公子公主也嘉告以善言告之謂嘏辭也盖欲善其終者必善其始今固未終也而既有其始矣既有其始必有其終盖即其已然者而將然者從可知也於是公尸以此告之公尸所告者先及善始之事所謂此者即指下文五章之云也首章總祝之以福而已二章三章則祝其明盛之福以漸而進也昭明者明之𤼵有融者明之盛髙朗者明之極也漸進不已則是緝熈至於純嘏矣又按諸家於明融朗三者多以為徳但求之詩意昭明與景福相屬而髙朗又與令終相貫言上下相承皆言福爾况介以昭明之福則可謂以昭明之徳介之可乎故朱子止以光大虚明訓之未嘗指為徳也大抵不受福者昏墊於六極中而受福之君為赫赫之命所屬是以安富尊榮身顕名著治化熈洽休祥畢至其光明俊偉氣象自然耳詩人祝願之意正在此若以為徳則於經於傳皆未見其相合也其告維何籩豆靜嘉叶居何反朋友攸攝攝以威儀叶牛何反賦也靜嘉清潔而美也朋友指賔客助祭者説見楚茨篇輯録通釋曰謂之賔客謂之朋友皆尊之之詞所以重祭事也攝檢也公尸告以汝之祭祀籩豆之薦既靜嘉矣而朋友相攝佐者又皆有威儀當神意也當神意言稱乎神意也籩豆靜嘉敬之見乎物也朋友攸攝敬之資諸人也自此至終篇皆述尸告之辭輯録通釋曰此章述尸告其儀物之盛也威儀孔時叶上止反君子有孝子叶奬里反孝子不匱求位反永錫爾類賦也孝子主人之嗣子也儀禮祭祀之終有嗣舉奠特牲嗣舉奠行於衆賔長加爵之後先時祝洗酌奠奠于鉶南至是使嗣子舉所奠之觶而飲之以致傳付祖考徳澤之意也又見楚茨三章註匱竭類善也善福也此所謂福即首章之景福三章之令終也既得令終則明融髙朗舉皆在其中矣故尤以此為重而詳言之言汝之威儀既得其宜攝以威儀助祭者之威儀也威儀孔時主祭者之威儀也又有孝子以舉奠孝子之孝誠而不竭則宜永錫爾以善矣此釋不匱專自孝子之孝言東萊吕氏曰君子既孝而嗣子又孝其孝可謂源源不竭矣此釋不匱通自君子與孝子言上章言事神之敬此章言奉先之孝孝敬以致祭者所以受福之本也此上二章皆善始之事其類維何室家之壼苦本反叶苦俊反君子萬年永錫祚才故反胤羊刄反賦也壼宫中之巷也言深逺而嚴肅也靜治無􅨣家齊之氣象也家道齊則婦人之賢可知而生賢子孫有兆矣祚福禄也胤子孫也錫之以善莫大於此孔氏曰下章被禄景命即祚也從以孫子之賢即胤也永鍚祚胤則以世繼世而福無窮矣此下三章皆善終之事其胤維何天被皮寄反爾禄君子萬年景命有僕賦也僕附也言將使爾有子孫者先當使爾被天禄而為天命之所附屬自其福之所錫而言則曰被自其福之依附於此而言則曰僕謂夫乆而不替也凡得賢子孫非一朝一夕之故是以其言如此下章乃言子孫之事輯録通釋曰上章言錫善而兼舉祚胤此章述尸告錫祚之事而必𤼵之以其胤維何下章述尸告錫胤之事而必𤼵之以其僕維何盖錫以胤者必錫以祚得其祚者必得其胤反覆互言以見二者相因而兼備也其僕維何釐力之反爾女士鉏里反釐爾女士從以孫子叶奬里反賦也釐予音與也女士女之有士行者謂生淑媛音院使為之妃即配字也此與室家之壼相應從隨也謂又生賢子孫也此與永錫祚胤相應輔氏曰天命附屬於君則必與以賢女而使之生賢子孫耳景命有僕莫大於此觀周家自大王大姜以來之事可見矣按此詩言福既以明融髙朗令終詳言之矣又言其孝敬致祭而得女士以生賢子孫則又因令終有俶一句而詳言之也既醉八章章四句輯録吕氏曰此詩自既醉以酒至髙朗令終皆祭畢而燕頌禱之詞也自令終有俶至於卒章皆追道祭之受福以明頌禱之實也潘氏曰古人祝頌多以夀考及子孫衆多為言如華封人祝堯以為願聖人夀願聖人多男子亦此詩之意又曰觀行葦既醉二詩見人君盡其誠敬於祭祀之時極其恩義於燕飲之際凡父兄耆老所以祝願之者如此則其獲福也宜矣此所謂福無不自已求之者也陳定宇曰由君子之有孝子故世世子以女士而生孫子國家千萬世無窮之福其基本實在於此父兄之意逺矣鳬音扶鷖於雞反在涇公尸來燕來寧爾酒既清爾殽既馨公尸燕飲福禄來成興也鳬水鳥如鴨者孔氏曰長尾背上有文青色卑脚短喙水鳥之謹愿者也本草曰野鴨為鳬鷖鷗也涇水名爾自歌工而指主人也馨香之逺聞也此祭之明日繹而賔尸之樂輔氏曰祭之明日又祭曰繹賔尸者以賔禮而燕尸也輯録孫炎曰尋繹復祭也何氏曰禮繼昨日事但不灌地降神天子諸侯曰繹大夫曰賔尸士曰宴尸天子以卿為尸諸侯以大夫為尸卿大夫以下以孫為尸尸屬昨日配先祖食不忍輙忘故因以復祭殷曰肜周曰繹故言鳬鷖則在涇矣公尸則來燕來寧矣酒清殽馨則公尸燕飲而福禄來成矣此以樂得其所為興成就也為其前日為尸故燕勞之如此無職無位不必期之以徳而勉之以事也故但極祝其福禄也鳬鷖在沙叶桑何反公尸來燕來宜叶牛何反爾酒既多爾殽既嘉叶居何反公尸燕飲福禄來為叶吾禾反興也為猶助也輯録傳沙水旁也説文宜所安也輔氏曰稱也為去聲鳬鷖在渚公尸來燕來處爾酒既湑息汝反爾殽伊脯公尸燕飲福禄來下叶後五反興也渚水中髙地也湑酒之泲躋上聲者也泲見伐木篇輯録輔氏曰處居也下自上而下易詞也鳬鷖在潨在公反公尸來燕來宗既燕于宗福禄攸降叶乎攻反公尸燕飲福禄來崇興也潨水㑹也説文曰小水入大水也來宗之宗尊也于宗之宗廟也崇積而髙大也福降而後崇盖自彼錫之而後積於此也鳬鷖在亹音門公尸來止熏熏叶眉貧反㫖酒欣欣燔炙芬芬叶豊勻反公尸燕飲無有後艱叶居銀反興也亹水流峽中兩岸如門也熏熏和説也欣欣樂也芬芬香也來成來為來下攸降來崇皆即今日言之凡得安樂尊榮如此者是即所謂福也無有後艱則自今以徃永永無隳而福常若此矣鳬鷖五章章六句假中庸春秋傳皆作嘉今當作嘉樂音洛君子叶音刖顯顯令徳冝民冝人受禄于天叶鉄因反保右音又命叶彌并反之自天申之賦也嘉美也君子指王也嘉樂君子猶言樂只君子也民庶民也人在位者也申重也言王之徳既冝民人而受天禄矣明徳有以得人心是即有以受天禄此已然之福也輯録輔氏曰顯顯是明而可見之意令徳顕然明著故民人皆宜之宜謂心愜之人愜之故天禄之也而天之於王猶反覆眷顧之不厭既保之右之命之而又申重之也此將然之福也輔氏曰在已之徳不已故在天之福無窮輯録解頥曰保如天保之保謂有以安之也右如左右之右謂有以助之也命如命令之命謂有以付畀之也既保之而又保之既右之而又右之既命之而又命之所謂申之也疑此即公尸之所以荅鳬鷖者也此詩明徳乃其本宜民宜人以下皆明徳之効驗干禄百福叶筆力反子孫千億穆穆皇皇宜君宜王不愆不忘率由舊章賦也穆穆敬也皇皇美也君諸侯也王天子也愆過輯録謝氏曰不愆則無聦明亂舊章之過不忘則常有繼志述事之心率循也舊章先王之禮樂政刑也言王者干禄而得百神此章以下皆𤼵保右命之之意故其子孫之蕃至于千億適丁歴反為天子庶為諸侯無不穆穆皇皇以遵先王之法者能率由舊章則不愆不忘在其中矣故傳之釋經如此朱子曰子孫千億是願甚子孫之多穆穆皇皇是願其子孫之賢子孫多且賢即所謂百福也愚謂所以干禄者無他上章之顕徳是已輯録陳定宇曰上章言今王之顕徳固所以受福未若後嗣之多賢所以乆其福也威儀抑抑徳音秩秩無怨無惡烏路反率由羣匹受福無疆四方之綱賦也抑抑宻也秩秩有常也匹類也言有威儀聲譽之美輯録輔氏曰威儀見于容止者甚宻而無間徳音形于聲譽者有常而不替其徳可謂全矣又能無私怨惡以任衆賢是以能受無疆之福為四方之綱威儀聲譽徳之著也盛徳如此而不自賢又有公心以任賢則宜乎受福而為四方之綱也為四方之綱則總攝政事維繫人心天下之治皆歸於已矣上章重在信用先王之法此章重在任用天下之賢祝願之意各有所主也此與下章皆稱願其子孫之辭也輯録解頥曰前章則言王者之福本乎天而有以及後世所以為祝頌之辭此章則言其子孫之福本乎徳而有以及天下又所以為稱願之辭也或曰無怨無惡不為人所怨惡也宜民宜人受禄于天是得人即是得天受福無疆四方之綱是得天所以得人天人之相因如此之綱之紀燕及朋友叶羽已反百辟卿士鉏里反媚眉備反于天子叶奬里反不解佳賣反于位民之攸堅許既反賦也燕安也朋友亦謂諸臣也輯録通釋曰集傳言亦者盖此詩指諸臣謂朋友亦如既醉指助祭之臣為朋友也解惰塈息也言人君能綱紀四方而臣下賴之以安則百辟卿士媚而愛之百辟在外之諸侯也卿士在内之羣臣也維欲其不解于位不解于位即之綱之紀而不厭也而為民所安息也於政治之大體而緫之無所遺於其節目而理之無所紊則天下重任皆歸於己矣故臣下恃之以安而愛之願之惟欲君之無逸以逸其民也東萊吕氏曰君燕其臣臣媚其君此上下交而為泰之時也泰之時所憂者怠荒而已此詩所以終於不解于位民之攸塈也方嘉之又規之者盖臯陶賡歌之意也輯録書益稷臯陶賡載歌曰元首明哉股肱良哉庶事康哉即嘉之之意又歌曰元首叢脞哉股肱惰哉萭事墮哉即規之之意民之勞逸在下而樞機在上上逸則下勞矣上勞則下逸矣不觧于位乃民之所由休息也吕氏之説與朱子異上章欲其子孫不敢自賢此章欲其子孫不敢自逸必其任賢可受福而為君勞已則可安民而致治祝願之意是又各有所主也假樂四章章六句此詩祝其君以顯徳致福禄然所謂福禄者不惟得天命於一時尤欲子孫之賢而保治於無窮也輯録通釋曰首章之言乃一詩之大㫖二章之不愆不忘三章之威儀徳音所以為顯顯令徳也三章四方之綱四章之綱之紀而民之攸塈所以宜民也二章之無怨無惡率由羣匹四章燕及朋友媚于天子所以宜人也至於二章之千禄百福子孫千億三章之受福無疆者又皆所謂受禄于天而自天申之者也篤公劉匪居匪康迺埸音易迺疆迺積迺倉迺裹音果餱音侯糧音良于槖他洛反于囊乃即反思輯音集用光弓矢斯張干戈戚揚爰方啓行叶户郎反賦也篤厚也公劉輯録釋文曰王肅云公號劉名尚書傳公爵劉名后稷之曽孫也事見豳風居安康寧也埸疆田畔也輯録董氏曰疆者田之大界埸是小界今之小田塍也塍音承積露積也餱食糧糗丘上聲也輯録餱乾食糧榖食孟子集註餱乾糧則糧即乾糧也此訓餱食糧糗則食即糗也糗熬米麥亦乾糧也無底曰槖有底曰囊輯和戚斧揚鉞輯録鉞大而斧小方始也舊説召康公以成王將涖政當戒以民事故詠公劉之事以告之曰厚哉公劉之於民也輯録謝氏曰周以忠厚為家法篤者厚之至也其在西戎不敢寧居治其田疇實其倉廪既冨且強於是裹其餱糧思以輯和其民人而光顯其國家然後以其弓矢斧鉞之備爰始啓行而遷都於豳焉輯録解頥曰遷都必用武備者一以壯國容一以防外患也盖亦不出其封内也輔氏曰足食足兵然後遷國愚謂此章以勤民足食為本及啓行在道則兵戈之衛亦不可無耳輯録黄實夫曰公劉不輕於用民也必先有以蓄民之財治民之情而後可以用民之力其篤於為民之心可見矣篤公劉于胥斯原既庶既繁叶紛乾反既順迺宣而無永嘆他安反陟則在巘魚輦反叶魚軒反復降在原何以舟叶之遥反之維玉及瑶音遥鞞必頂反琫必孔反容刀叶徒招反賦也胥相也相去聲視也庶繁謂居之者衆也順安宣徧也言居之徧也無永嘆得其所不思舊也巘山頂也舟帶也鞞刀鞘音笑也琫刀上飾也容刀容飾之刀也或曰容刀如言容臭記内則皆佩容臭語録云容臭如今香囊謂鞞琫之中容此刀耳言公劉至豳欲相土以居輯録公劉始於草創而人之從之者已若是其盛是以居邑由是而成也而帶此劔佩以上下於山原也于胥斯原是緫言之陟巘降原又詳言之遷豳之后民之所以安其所者由遷豳之初公劉能盡其心也東萊吕氏曰以如是之佩服而親如是之勞苦斯其所以為厚於民也貴而能勤所以為厚篤公劉逝彼百泉瞻彼溥音普原迺陟南岡乃覯于京叶居良反京師之野叶上與反于時處處于時廬旅于時言言于時語語賦也溥大覯見也京髙丘也師衆也京師髙丘而衆居也諸本作髙山而衆居山字誤董氏曰所謂京師者盖起於此其後世因以所都為京師也逝泉瞻原即上章之降在原也陟岡覯京即上章之陟在巘也此其言之又詳且盡矣輯録董氏曰曰嬪于京依其在京則岐周之京也王配于京則鎬京也春秋所書京師則洛邑也皆仍其本號而稱之猶晉云新絳故絳也増釋曰洛邑亦謂之洛師正京師之意時是也處處居室也廬寄也旅賔旅也直言曰言論難並去聲曰語此章言營度待洛反邑居也自下觀之則徃百泉而望廣原百泉當是衆流所㑹之處地勢平曠故可以瞻廣原也増釋許氏曰通典漢安定郡朝那縣地唐為原州百泉縣盖因詩百泉而得名自上觀之則陟南岡而覯于京於是為之居室於是廬其賔旅於是言其所言於是語其所語無不於斯焉處處者上下之定居也廬旅者賔客所寄宿也言言語語猶所謂爰笑爰語者盖聚族而居聲音相接也上章止言相地此章則相地以定而施營度之功矣輯録一説言言施告令語語議政事篤公劉于京斯依叶於豈反蹌蹌七羊反濟濟子禮反俾筵俾几既登乃依同上乃造七到反其曹執豕于牢酌之用匏歩交反食音嗣之飲之於鴆反君之宗之就用之字為韻賦也依安也安居也蹌蹌濟濟群臣有威儀貎輯録曲禮皆行容大夫濟濟士蹌蹌註濟濟脩飾齊一之貌蹌蹌翔舉舒揚之貌俾使也使人為之設筵几也登登筵也依依几也輯録通釋曰二依字義不同曹群牧之處也以豕為殽用匏為爵儉以質也宗尊也主也嫡子孫主祭祀而族人尊之以為主也此章言宫室既成而落之輯録羅氏曰宫室既成而祭之曰落左氏傳願與諸侯落之既以飲食勞去聲其群臣而又為之君為之宗焉東萊吕氏曰既饗燕而定經制以整屬音燭其民整者齊之而不亂属者聮之而不散上則皆統於君下則各統於宗盖古者建國立宗其事相須輯録李氏曰宗子有五大宗子一小宗子四别子為祖繼别為宗百世不遷者大宗也繼禰之宗繼祖之宗繼曽祖之宗繼髙祖之宗五世則遷者小宗也皆所以主祭祀而統族人如有國有家之重者也楚執戎蠻子而致邑立宗以誘其遺民左傳哀公四年輯録註楚復詐為蠻子作邑立其宗主即其事也宗字之義朱傳吕説各是一意但此方為燕飲言之則朱子之説為切篤公劉既溥既長既景迺岡相息亮反其隂陽觀其流泉其軍三單音丹叶多㳙反度待洛反其隰原徹田為糧度同上其夕陽豳居允荒賦也溥廣也言其芟夷墾辟土地既廣而且長也輯録䟽東西為廣南北為長景考日景以正四方也岡登髙以望也相視也隂陽向背音佩寒暖之宜也流泉氷泉灌溉之利也景所以相隂陽岡所以觀流泉也孔氏曰疆理田畆或南或北必須正其方面故如此愚謂百榖各有所宜如黍宜寒稌宜暑之類則隂陽寒暖不可不知也三單未詳鄭氏曰大國三軍以其餘為羡公劉遷豳民始從之丁夫適滿其数耳謂之單者無羡卒也今存以備一説輯録䟽小司徒云凡起徒役無過家一人以其餘為羡羡謂家之副丁也今言其軍三單則是單而無副徹通也一井之田九百畆八家皆私百畆同飬去聲公田耕則通力而作収則計畆而分也周之徹法自此始其後周公盖因而脩之耳按此則周之徹法始於公劉七月一之日之云則周之正朔始於公劉是雖荒逺之地可以專行然以其國之狹小如此而其逺大之規乃如此非大賢其孰能之輯録王晦叔曰大國三軍之法以治兵徹田什一之法以儲粟周家軍制徹法皆起於此山西曰夕陽輯録夕始得陽也増釋許氏曰䟽云夕陽者總言豳人一國之所處其界在山之西不知是何山也書傳説大王去邠踰梁山註云梁山在岐山東北然則豳國之東有大山者其唯梁山是也允信荒大也此言辨土冝以授所徙之民定其軍賦與其税法又度山西之田以廣之而豳人之居於此益大矣豳地之廣如此已辟者既授所徙之民而定其制增辟者又因後來之民而益其業於是廣而益廣矣篤公劉于豳斯館叶古玩反渉渭為亂取厲取鍛丁亂反止基迺理爰衆爰有叶羽已反夾其皇澗遡其過古禾反澗止旅迺宻芮鞫居六反之即賦也館客舎也亂舟之截流横渡者也厲砥鍛鐵止居基定也理疆理也衆人多也有財足也遡鄉也皇過二澗名芮水名出呉山西北東入涇周禮職方作汭鞫水外也此章又緫叙其始終言其始來未定居之時渉渭取材而為舟以來徃取厲取鍛而成宫室既止基於此矣乃疆理其田野則日益繁庶冨足止基即上章營度邑居之事乃理即上章徹田為糧之事止之則衆理之則有公劉所以富庻其民如此其居有夾澗者有遡澗者其止居之衆日以益宻乃復去聲即芮鞫而居之而豳地日以廣矣即就也上章度其夕陽則耕者益衆此章芮鞫之即則居者益蕃皆後來富盛之效也公劉六章章十句周公以文王以下三詩戒成王則自文王武王至於王季至於大王矣又以七月戒成王則又上及豳人之風俗矣康公又自公劉始遷於豳言之則先公所以典王業者致詳備矣但風雅不同體是以七月之詩宜入國風云王氏曰周之有公劉言乎其時則甚㣲言乎其事則甚勒稱時之甚㣲以戒其盈稱事之甚勤以戒其逸此召康公之志也輯録陳氏曰七月言先公風化公劉則言建國君民之事風雅之不同如此泂音逈酌彼行潦音老挹音揖彼注兹可以餴甫云反饎尺志反叶昌里反豈弟君子民之父母叶滿彼反興也泂逺也行潦流潦也餴烝米一熟而以水沃之乃再烝也饎酒食也君子指玉也舊説以為召康公戒成王言逺酌彼行潦挹酌也之於彼而注之於此尚可以餴饎輯録曹氏曰道上流潦黄濁不可飲然蓄之大器澄停既乆挹取其清者而注之於此尚有用也况豈弟之君子豈不為民之父母乎此以小物之功用興大徳之功用明人君不可無豈弟之徳也夫以文王之盛徳至極無加乃得稱為豈弟召公以此期之成王則其戒君之意逺矣傳曰豈以彊教之弟以悦安之自強以教之不倦也和悦以安之不暴也民皆有父之尊有母之親此引表記語兼釋豈弟之義以彊教之有父道也以悦安之有母道也又曰民之所好好之民之所惡惡之此之謂民之父母此引大學語專釋父母之義所欲與之聚之所惡勿施爾也輯録朱子曰能以民心為已心則是愛民如子而民愛之如父母矣輔氏曰此以成民之才而言也下以體民之心而言也既有以成其才又有以體其心則能盡教育之道矣此其所以為民之父母也泂酌彼行潦挹彼注兹可以濯罍音雷豈弟君子民之攸歸叶古回反興也濯滌也泂酌彼行潦挹彼注兹可以濯溉古愛反叶古氣反豈弟君子民之攸塈許既反興也溉亦滌也塈息也民之攸歸者有膽有依得所注也民之攸塈者有怙有恃得所安也皆所以申父母之義也泂酌三章章五句有卷音權者阿與歌叶飄風自南叶尼心反豈弟君子來游來歌與何叶以矢其音賦也卷曲也阿大陵也豈弟君子指王也輯録曹氏曰豈弟君子樂於循理而已平易近民人君之徳也故詩人美人君之徳必以豈弟言之矢陳也此詩舊説亦召康公作疑公從成王游歌於卷阿之上因王之歌而作此以為戒此章纔叙以𤼵端也成王歌之召公矢其音以和之自此以下皆公所矢之音也輯録地勢美而天氣和則君心悦而臣言入矣盖見成王當此之際其胷次直與天地同流所以召公繼其詠歌而以規戒之言進之也解頥曰盖秦和盛治之時以三光則得其明以四時則得其序以庻類則得其所是誠可樂也然治極而不戒則亂亦於此乎兆此其所可慮也夫惟慮於極治之時此有虞所以有臯陶之賡歌有周所以有召公之巻阿也伴音判奐音喚爾游矣優游爾休矣豈弟君子俾爾彌爾性似先公酋在由反矣賦也伴奐優游閒暇之意伴奐優游承來游來歌言輯録謝氏曰伴奐逍遙閑散之意優游從容閒暇之意休休息也爾君子皆指王也彌終也性猶命也酋終也言爾既伴奐優游矣又呼而告之言使爾終其夀命似先君善始而善終也言先公則先王在其中故傳以先君代先公字伴奐優游今日之福也而我之意又欲使爾後日之伴奐優游長若此則固有其道也此即其燕安之福而誘掖之使樂於用賢爾故呼而告之如此下二章語勢同自此至第四章皆極言夀考福禄之盛以廣王心而歆動之輯録何伯善曰歆好樂也歆動者使之好樂而動其心也五章以後乃告以所以致此之由也爾土宇昄符版反章亦孔之厚叶狠口下主二反矣豈弟君子俾爾彌爾性百神爾主叶當口腫庾二反矣賦也昄章大明也輯録昄當易蒲版反或曰昄當為版版章猶版圖也言爾土宇昄章既甚厚矣輯録尸子曰天地四方曰宇謝氏曰成王土宇之大亦明矣其王業亦可謂甚厚矣又使爾終其身常為天地山川鬼神之主也此章即其富有之業而誘掖之爾受命長矣茀芳弗反禄爾康矣豈弟君子俾爾彌爾性純嘏爾常矣賦也茀嘏皆福也輯録箋純大也常常享之也此章即其康寜之福而誘掖之有馮符氷反有翼有孝有徳以引以翼豈弟君子四方為則賦也馮謂可為依者翼謂可為輔者静專有守則可為依堅彊不屈則可為輔孝謂能事親者徳謂得於已者引導其前也翼相去聲其左右也以用也以之導我則不昧於所適以之相我則不怠於所行東萊吕氏曰賢者之行去聲非一端必曰有孝有徳何也盖人主常與慈祥篤實之人處上聲慈祥以孝言篤實以徳言朱子以馮翼孝徳為四臣吕氏即以孝徳之人為可馮翼者其所以興起善端涵飬徳性鎮其躁音竈而消其邪日改月化有不在言語之間者矣輯録謝氏曰求賢不取非常之才而止曰有孝有徳何也曰孝於親者必忠於君取其孝正求其忠也唐虞以上取人以徳無才徳之分如臯陶九徳皆才也舜禹八元八凱之才皆徳也有徳則才在其中矣言得賢以自輔如此則其徳日脩而四方以為則矣有賢貴於能用故必以引以翼然後其徳可成而四方自以我為則也自此章以下乃言所以致上章福禄之由也顒顒卬卬如圭如璋令聞音問令望叶無方反豈弟君子四方為綱賦也顒顒魚容反卬卬五岡反尊嚴也如圭如璋純㓗也令聞善譽也令望威儀可望法也承上章言得馮翼孝徳之助則能如此而四方以為綱矣此以詳言君子之徳也顒卬以見於外者言圭璋以存諸内者言内外相符如此則聞之而有善譽望之而有威儀庶幾為人君之全徳而四方自以我為綱也綱者衆紀之所繋天下歸於一人猶衆紀屬於一綱耳首章之豈弟君子稱之也二章三章四章之豈弟君子呼而告之也五章言必如此而後可成豈弟君子之徳六章言必如此而後可謂豈弟君子之徳也意之不同如此鳯凰于飛翽翽呼會反其羽亦集爰止藹藹王多吉士鉏里反維君子使媚于天子興也鳯凰靈鳥也輯録説文曰神鳥也其像鴻前麐後蛇頸魚尾鸛顙鴛思龍文龜背燕頷鷄喙五色備舉出於東方君子之國見則天下安寜飛則羣鳥從以萬数麐麟同雄曰鳯雌曰凰翽翽羽聲也鄭氏以為因時鳯凰至故以為喻理或然也輯録蔡氏曰是時周方隆盛鳴鳯在郊鳴于髙岡者乃咏其實也藹藹衆多也媚順愛也鳯凰于飛則翽翽其羽而集於其所止矣藹藹王多吉士則維王之所使而皆媚于天子矣此與下章以人物各有趋向為興既曰君子又曰天子猶曰王于出征以佐天子云爾禽鳥之性必欲得所止賢士之心必欲致於用苟得見用則隨所使令而皆一心媚愛於天子矣下章之意類此上兩章重在得賢以自輔此與下章則言賢者集于王朝如此其多是馮翼孝徳之臣具有而足供使令矣故曰使曰命再三致意而與以引以翼相應也鳯凰于飛翽翽其羽亦傅音附于天叶鐵因反藹藹王多吉人維君子命叶彌并反媚于庶人興也媚于庶人順愛于民也下集所止上戾于天禽鳥之性也上愛天子下愛庶人賢士之心也然不見用則其心不得以自効是故使之命之有望於成王也鳯凰鳴矣于彼髙岡梧桐生矣于彼朝陽菶菶布孔反萋萋七西反雝雝喈喈叶居奚反比也又以興下章之事也山之東曰朝陽輯録朝先見日也鳯凰之性非梧桐不棲非竹實不食即賢者非有道之朝不處非恭敬之實不留也菶菶萋萋梧桐生之盛也雝雝喈喈鳯凰鳴之和也髙岡非潜伏之地朝陽為明盛之處賢者出潜離隠而逢賢君致治之時也其相遇之盛既如此必君盡其禮猶菶萋然則臣得展其所藴猶雝喈然其相與之盛當如此今而賢者集於王朝矣而禮意之隆則有望於成王也君子之車既庶且多君子之馬既閑且馳叶唐何反矢詩不多維以遂歌賦也承上章之興也菶菶萋萋則雝雝喈喈矣君子之車馬則既衆多而閑習矣其意若曰是亦足以待天下之賢者而不厭其多矣遂歌盖繼王之聲而遂歌之猶書所謂賡載歌也梧桐盛則有以致鳯鳴之和車馬盛則足以待賢者之衆興主梧桐取物貴蕃盛之意但康公止陳車馬之盛如此而當以此待賢則其意自見於言外故以矢詩遂歌結之欲王深味其言而自得也輯録遂繼也成也蔡氏曰賡續載成也續帝歌以成其義也王日休曰此詩非不多也召公以為不多者愛君之心無已也卷阿十章六章章五句四章章六句此詩之要在於用賢用賢輔徳則為綱為則乃其自然而伴奐優㳺可保於無窮矣今日之賢士如此其多吾君之車馬如此其盛則招延禮待以引以翼者王之所當致意也增釋許氏曰一章召公因王來㳺來歌矢音以進其誘掖之詞以𤼵端也三章四章皆言已有之福欲王終其夀考果能若是則有其效矣五章欲王用賢脩徳而為四方之則六章言徳備内外身其衆美則為四方之綱七八章鳯凰興吉士吉人正言能佐王也是言賢者見用於有徳之君九章惟梧桐之菶萋鳯凰之雝喈以興下章君子之車馬庶多而閑習則吉士之來者衆矣盖賢者之進必以義上之人致敬以有禮則興起者多矣民亦勞止汔許乙反可小康惠此中國以綏四方無縱詭居毁反隨以謹無良式遏冦虐􅉃七感反不畏明叶謨郎反柔逺能邇以定我王賦也汔㡬也輯録止助語㡬祈機一音近也箋康安也中國京師也四方諸夏也京師諸夏之根本也輯録馮氏曰諸夏諸侯之稱夏大也中國曰夏大之也詭隨不顧是非而妄隨人也謹歛束之意憯曽也明天之明命也􅉃不畏明言不畏正理而無忌憚也柔安也能順習也順習者馴服之以教化之意序説以此為召穆公刺厲王之詩以今考之乃同列相戒之詞耳未必專為去聲刺王而𤼵然其憂時感事之意亦可見矣輯録嚴氏曰朱子此説是也詩言以定我王以為王休又言我雖小子王欲玉女皆語同列之詞以時之亂戒同列所以刺王也蘇氏曰人未有無故而妄從人者維無良之人將恱其君而竊其權以為冦虐則為之輯録解頥曰非詭隨無以媚上而為冦虐之本非冦虐無以威下而遂詭隨之志詭隨者柔惡之所為冦虐者剛惡之所𤼵故無縱詭隨則無良之人肅而冦虐無畏之人止然後柔逺能邇而王室定矣輔氏曰柔逺能邇與惠中國綏四方相應此詩大㫖在於遏小人詭隨無良冦虐無畏皆以言其心術之不一也後言惛怓罔極醜厲繾綣之類亦以極其形容耳輯録彭氏曰民勞甚矣未能遽望其太平也但庶㡬小康耳故教以惠中國而綏四方然所以惠綏者豈有他哉其本在朝廷之上母使小人亂政則柔逺能邇而我王定矣先言惠中國以綏四方此出治之序也後言柔逺能邇此成治之效也書言柔逺能邇而必曰難任人詩言柔逺能邇而必曰謹無良皆有常戒懼之意穆公名虎康公之後增釋許氏曰䟽引左傳服虔註穆公召康公十六世孫今按史記但云召公已下九世至惠侯而不着其年謚謂惠侯當厲王奔彘之時下至十五世則為繆侯繆侯七年為魯隠公元年與䟽不合盖國㣲史失不可考信故傳但曰康公之後厲王名胡成王七世孫也輯録孔䟽世本及周本紀皆云成王生康王康王生昭王昭王生穆王穆王生恭王恭王生懿王及孝王孝王生夷王夷王生厲王凡九世從成王言之不數成王及孝王故七世也民亦勞止汔可小休惠此中國以為民逑無縱詭隨以謹惛怓女交反叶尼猶反式遏㓂虐無俾民憂無棄爾勞以為王休賦也輯録箋休止息也逑聚也惛音昬怓猶讙歡諠二音譁也讙譁即巧言利口之徒勞猶功也言無棄爾之前功也休美也輯録曹氏曰自二章而下皆衍而成篇以暢其意不甚相逺也民亦勞止汔可小息惠此京師以綏四國叶于逼反無縱詭隨以謹罔極式遏冦虐無俾作慝惕得反敬慎威儀以近有徳賦也罔極為惡無窮極之人也有徳有徳之人也既能遏小人又必親君子盖遏小人則無蠧政之憂親君子則有輔仁之益然威儀不謹則君子不可親故中庸九經之目必先脩身而後尊賢也民亦勞止汔可小愒起例反惠此中國俾民憂泄以世反無縱詭隨以謹醜厲式遏冦虐無俾正敗叶蒲寐反戎雖小子而式𢎞大叶特計反賦也愒息泄去厲惡也正敗正道敗壊也戎汝也言汝雖小子而其所為甚廣大不可不謹也以少年而當大任可不謹乎民亦勞止汔可小安惠此中國國無有殘無縱詭隨以謹繾綣式遏冦虐無俾正反王欲玉女音汝是用大諌春秋傳荀子書並作簡音簡賦也繾綣小人之固結其君者也正反反於正也王氏曰正敗者敗而已未盡反也反則無正矣輯録彭氏曰正反則善惡曲直無不倒置天下其可得而正邪毎章言愈切而意愈深玉寳愛之意言王欲以女為玉而寳愛之故我用王之意大諫正於女盖託為王意以相戒也戎雖小子而式𢎞大憂其任負之重也王欲玉女是用大諫體其愛念之深也皆所以為同列謀也民勞五章章十句首章言遏小人則可安人民而定王室二章言遏小人則可保成功以承王休三章言既以遏小人又必親君子四章言遏小人使正道全而不壞五章言遏小人使正道存而不亡上帝板板下民卒癉當簡反出話不然為猶不逺靡聖管管不實於亶猶之未逺是用大諫叶音簡賦也板板反也卒盡癉病猶謀也管管無所依也亶誠也序以此為凡伯刺厲王之詩今考其意亦與前篇相類但責之益深切耳輯録嚴氏曰朱子以此詩為切責僚友用事之人而義歸於刺王與上篇同味詩意信然胡庭芳曰厲王無道召穆凡伯以親賢之故冝極言而力救之顧乃不直致其諌而姑責同僚以使之聞之者豈非亦以監謗之故不欲嬰其鋒以陷於罪而甚吾君之惡也邪吁二公忠愛之懐於此益可見矣此章首言天反其常道而使民盡病矣而女之出言皆不合理為謀又不乆逺其心以為無復聖人但恣已妄行而無所依據又不實之於誠信豈其謀之未逺而然乎出話不然恃其便侫者也為猶不逺蔽於近小者也惟其謀之不逺是以猖狂誕妄無所不至也既以出話為猶並言而又以猶之未逺申結之盖謀出於心而後言出於口二者相對而謀為之主也輯録李迂仲曰愛民者天之常道耳今天使下民皆病則反其常道矣言為猶不逺又言猶之禾逺盖反覆言之自下文以至末章皆是大諌也增釋許氏曰此詩雖同列相戒之言而後三章實君之任盖責同列以道其君使知此也一詩之意在出話不然為猶不逺兩語而猶又話之本也故下唯言猶之未逺世亂乃人所為而曰上帝板板者無所歸咎之詞耳天之方難叶泥㳙反無然憲憲叶虗言反天之方蹶俱衛反無然泄泄以世反辭之輯音集叶祖合反矣民之洽矣辭之懌叶弋灼反矣民之莫矣賦也憲憲欣欣也蹶動也難者艱難而不易處之時動者跪跪而不得安之時泄泄猶沓沓也盖弛緩之意欣欣然不慎也沓沓然不勉也孟子曰事君無義進退無禮言則非先王之道者猶沓沓也非詆毁也輯録朱子曰天方艱難則人當憂懼也今乃欣欣然自以為適天方蹶動則人當斂飭也今乃弛緩而不以為事則是自絶于天矣始也不有夫聖終也自絶于天則何以能立於人之朝哉蹶顛覆之意泄泄怠緩悦從之貌言天欲顛覆周室羣臣無得泄泄然不急救正之沓沓即泄泄之意盖孟子時人語如此輯和洽合懌恱莫定也辭輯而懌則言必以先王之道矣所以民無不合無不定也我雖異事及爾同僚我即爾謀聴我囂囂許驕反我言維服勿以為笑叶思邀反先民有言詢于芻初俱反蕘如謡反賦也異事不同職也同僚同為王臣也春秋傳曰同官為僚定宇陳氏曰觀此言則其為同列相戒甚明即就也囂囂自得不肯受言之貌服事也猶曰我所言者乃今之急事也先民古之賢人也芻蕘采薪者古人尚詢及芻蕘况其僚友乎上章辭輯辭懌與出話不然相應此章我即爾謀與為猶不逺相應我即爾謀則其謀逺矣而爾不我聴可乎哉天之方虐無然謔謔虗虐反老夫灌灌小子蹻蹻其畧反匪我言耄莫報反叶毛博反爾用憂謔多將熇熇叶計各反不可救藥賦也謔戯侮也老夫詩人自稱灌灌欵欵也蹻蹻驕貌輯録李迂仲曰説文蹻蹻舉足髙也以足髙之意觀之是驕之意耄老而昏也熇熇熾盛也輯録釋文熇許酷反一許各反蘇氏曰老者知其不可而盡其欵誠以告之少去聲者不信而驕之故曰非我老耄而妄言乃汝以憂為戯耳夫憂未至而救之猶可為也苟俟其益多則如火之盛不可復救矣上章誘之使聴其言此章警懼之使不可不聴其言皆以盡其告戒之誠也天之方懠才細反叶箋西反無為夸苦花反毗威儀卒迷善人載尸民之方殿屎許伊反則莫我敢葵喪息浪反亂蔑資叶箋西反曽莫惠我師叶霜夷反賦也懠怒夸大毗附也小人之於人不以大言夸之則以諛言毗之也張狂自矜以罔人雷同相和以附人皆小人之態也出話不然則民聽癉辭輯辭懌則民合而定夸大毗附則民愁聽而呻吟反覆言之以見治亂之機實在於此也尸則不言不為飲食而已者也殿都甸反屎呻吟也葵揆也蔑猶滅也資與咨同嗟嘆聲也惠順師衆也戒小人毋得夸毗使威儀迷亂而善人不得有所為也小人自恣正不勝邪而上下之威儀亂矣所以君子不得有為也又言民方愁苦呻吟而莫敢揆度其所以然者是以至於散亂滅亡而卒無能惠我師者也民已窮而君子不得政故國愈亂而仁政不及民天之牖民如壎許亢反如篪音池如璋如圭如取如攜攜無曰益牖民孔易以豉反叶夷益反民之多辟匹亦反下同無自立辟賦也牖開明也程子曰牖開通之義室之暗也故設牖以通明猶言天啓其心也壎唱而篪和璋判而圭合取求攜得而無所費輯録通釋曰言求之即得而無費於已以益之也皆言易也無所費三字訓攜無曰益一句辟邪也言天之開民其易如此以明上之化下其易亦然今民既多邪辟矣豈可又自立邪辟以道之邪易亂為治其機在我而不難民心好亂居位者不可倡其亂也輯録輔氏曰此與下章分明是譏及於王也故先生於民勞首章言此二詩雖不專為刺王而𤼵然其憂時感事之意亦可見矣者是也价音介人維藩叶分邅反大師維垣大邦維屏大宗維翰叶胡田反懐德維寜宗子維城無俾城壊叶胡罪胡威二反無獨斯畏叶紆㑹於非二反賦也价大也大德之人也藩籬師衆垣墻也大邦強國也屏樹也所以為蔽也大宗強族也翰幹也宗子同姓也言是六者皆君之所恃以安而德其本也輯録李迂仲曰王所恃以衛國家者在此數者苟懐之以德則無不寜矣詩人以懐德惟寜間於中則宗子維城亦當以徳懐之也左氏曰君其脩徳以固宗子何城如之所謂宗子維城是也彭氏曰王者之治親親為大雖用人以為藩垣屏而資同姓以為翰翰者所資以立也又必待同姓以為城城者所恃以固也曰大宗曰宗子其意反覆言同姓之至重至切盖垣重於藩屏不可以無翰而城又大而且重焉然在人者皆有形之勢而德之在我乃無形之勢也故獨曰維寧焉有德則得是五者之助不然則親戚叛之而城壊親離則衆叛可知城壊則藩垣屏翰皆壊而獨居獨居而所可畏者至矣獨居猶書言獨夫也敬天之怒無敢戯豫敬天之渝用朱反無敢馳驅昊天曰明叶謨郎反及爾出玉音徃叶如字昊天曰旦叶得絹反及爾游衍叶恰戰反賦也渝變也王徃通言出而有所徃也旦亦明也衍寛縱之意言天之聦明無所不及不可以不敬也板板也難也蹶也虐也懠也其怒而變也甚矣而不之敬也輔氏曰憲憲謔謔蹻蹻憂謔皆戲豫之事也管管泄泄囂囂夸毘皆馳驅之事也愚謂戯豫者自慢之心馳驅者自恣之意皆不知畏天者也以足首章之意亦知其有日監在兹者乎天者理而已理無徃而不在故天無徃而不監知此則敬天之意常存而易亂為治不難矣此一詩之要㫖也張子曰天體物而不遺猶仁體事而無不在也輯録語録問天體物仁體事以見物物各有天理事事皆有仁曰然天體在物上仁體在事上猶言天體於物仁體於事本是言物以天為體事以仁為體縁須着從上説故如此下語又問與體物而不可遺一般否曰然禮儀三百威儀三千輯録禮儀經禮也威儀曲禮也禮儀便是儀禮中士冠禮諸侯冠禮天子冠禮之類大節有三百條如始加再加三加又如坐如尸立如齊之類皆是其中之小者有三千條無一事而非仁也昊天曰明及爾出王昊天曰旦及爾游衍無一物之不體也張子又推之以教學者如此天者理之緫名仁則吾心之天理物不外乎理事不外乎心之理也輯録解頥曰天之怒不可不敬也汝其敢戯豫乎天之變不可不敬也汝其敢馳驅乎昊天曰明及爾出王言一出入之際而天必與之俱也昊天曰旦及爾遊衍言一動息之頃而天必與之同也此所謂陟降厥士日監在兹也此君子之學所以必戒懼慎獨之為貴也板八章章八句一章歸咎於天而責之二章歸咎於天以教之三章既責之又教之四章又歸咎於天切責而儆懼之五章又歸咎於天教戒而切責之六章又望法天欲其易亂以為治七章歸本於徳欲其得人心以輔治八章則告以天所當敬之故庶幾亂之反乎治也輯録嚴氏曰五章以前皆切責僚友之詞六章以後皆責僚友而因以戒王也生民之什十篇六十一章四百三十三句詩經䟽義會通巻十七
