body:
  text: 詩經疏義會通卷十八元朱公遷撰蕩之什三之三蕩蕩上帝下民之辟必亦反疾威上帝其命多辟匹亦反天生蒸民其命匪諶市林反或叶市隆反靡不有初鮮克有終叶諸深反或如字賦也蕩蕩廣大貌辟君也疾威猶暴虐也多辟多邪辟也蒸衆諶信也言此蕩蕩之上帝乃下民之君也此據理而正言蕩蕩二字夲稱美之詞也令此暴虐之上帝其命乃多邪僻者何哉此方怪之而為怨之之詞蓋天生衆民其命有不可信者蓋其降命之初無有不善而人少能以善道自終是以致此大亂使天命亦罔克終如疾威而多僻也此又探其亂亡之故蓋始為怨天之辭而卒自解之如此解之者發明其理而正言之也劉康公曰輯録熊剛大曰劉采邑名康諡也康公定王同母弟所謂王季子也民受天地之中以生所謂命也輯録程子曰氏受天地之中以生天命之謂性也朱子曰此大夲之中也只是恰好處能者飬之以福不能者敗以取禍此之謂也飬之以福則命自我立而福自我致矣豈亂亡之足慮哉輯録吕氏曰福本自有故曰飬禍自外來故曰取王氏曰受天地之中一也則靡不有初敗以取禍者衆則鮮克有終鮮克有終則命靡諶矣又曰此章前四句有怨天之辭後四句乃解前四句謂天之降命本無不善惟人不以善道自終故天命亦不克終如疾威而多邪辟也增釋許氏曰此章言人之多辟非天命之本然人自失其初爾以起後章之意文王曰咨咨女音汝殷商曽是彊禦曽是掊蒲侯反克曽是在位曽是在服叶蒲北反天降慆他刀反德女興是力賦也此設為文王之言也咨嗟也殷商紂也輯録曹氏曰自契始封商地在上洛湯受命亳殷地在蒙今曰殷商并舉之也強禦暴虐之臣也掊克聚斂之臣也服事也慆慢凶德之小人也興起也力如力行之力詩人知厲王之將亡故為此詩託於文王所以嗟嘆殷紂者言此暴虐聚斂之臣在位用事乃天降慆慢之德而害民然非其自為之也乃汝興起此人而力為之耳天之生人不齊有善必有惡進退用舍則係人君之賢否耳是天不可責而用小人者深可責也增釋許氏曰此章言用暴虐聚斂之臣天降慆德指三四句女興是力指五六句文王曰咨咨女殷商而秉義類彊禦多懟直類反流言以對冦攘式內侯作則慮反侯祝周敕反靡届靡究賦也而亦女也義善懟怨也流言浮浪不根之言也侯維也作讀為詛詛祝怨謗也言汝當用善類而反任此暴虐多怨之人上章言強禦掊克此又專以強禦言蓋暴虐者必聚斂言強禦則掊克在其中矣使用流言以應對則是為冦盜攘竊而反居內矣是以致怨謗之無極也暴虐之人取怨多矣而又詭言無怨以欺其上殘賊如此是以來怨謗之甚也增釋許氏曰此章而秉義類謂女以為善類而秉之者乃下文強禦之類蓋心德不明以不義為義也流言者便佞辨捷如水之流也末二句任用非人致民之怨謗無所不至此與上章皆用人之失也文王曰咨咨女殷商女炮白交反烋火交反于中國叶于逼反斂怨以為德不明爾德時無背布內反無側爾德不明以無陪蒲回反無卿賦也炮烋氣健貌暴虐之意也輯録謝氏曰以傲狠作氣勢以暴虐作威聲如虎狼炮烋之狀斂怨以為德多為可怨之事而反自以為德也昏亂之君是非顛倒故其所為如此背後側傍陪二也輯録謂副二王者則三公也言前後左右公卿之臣皆不稱其官如無人也君有明德則能知人而官盛任使矣德既昏昧則舉枉錯直國之空虛無怪也增釋許氏曰此章言尚氣陵物不知修德而惡人以類而聚下章沈湎於酒此兩章皆修己之失也文王曰咨咨女殷商天不湎面善反爾以酒不義從式叶式吏反既愆爾止靡明靡晦叶呼洧反式號式呼火故反俾晝作夜叶羊茹反賦也湎飲酒變色也式用也言天不使爾沈湎於酒而惟不義是從而用也不義與上章義類相反即小人也湎於酒則昏於德不知其為惡類而任之矣止容止也輯録嚴氏曰爾之容止既自取愆過又無明無晦而飲酒不息呌號歡呼使晝作夜荒亂甚矣文王曰咨咨女殷商如蜩如螳音唐如沸如羮叶盧當反小大近喪息浪反叶平聲人尚乎由行叶户郎反內奰皮器反于中國覃及鬼方賦也蜩音條螳皆蟬也如蟬鳴如沸羮皆亂意也小者大者幾於喪亡矣小大指政事言即所謂蜩螳沸羮者尚且由此而行不知變也此人字斥厲王與其用事之臣也奰怒覃延也鬼方逺夷之國也輯録胡庭芳曰夏曰獯鬻商曰鬼方周曰獫狁漢曰丐奴魏曰突厥見唐髙祖紀其實一國而異其名也言自近及逺無不怨怒也增釋許氏曰此章言政事亂下章言棄舊典此兩章皆為政之失也文王曰咨咨女殷商匪上帝不時叶上止反殷不用舊叶巨已反雖無老成人尚有典刑曽是莫聽湯經反大命以傾賦也老成人舊臣也典刑舊法也以先王之良法言曰舊政以萬世之常法言曰典刑循守典刑即是用舊而上章之亂政不行矣輯録謝氏曰三代而上國有大政有大議有大疑皆决於老成人之言曰圗任舊臣人共政殷先王所以立國也曰人惟求舊曰無侮老成人盤庚所以興也曰汝惟商老成人宅心知訓周公所以誨康叔也黎老播棄格人罔敢知吉紂所以亡也在位罔有耆舊俊在厥服平王所以東遷也言非上帝為此不善之時但以殷不用舊致此禍爾雖無老成人與圖先王舊政然典刑尚在可以循守乃無聽用之者是以天命傾覆而不可救也匪上帝不時則非天命不可信也傾大命者有其故矣文王曰咨咨女殷商人亦有言顛沛之揭紀竭去例二反枝葉未有害詐曷暇憩二反本實先撥蒲末反叶方吠筆烈二反殷鍳不逺在夏后之世叶始制私列二反賦也顛沛音貝仆拔皮八本末二反也揭本根蹶音厥起之貌撥猶絶也鍳視也夏后桀也增釋許氏曰孟子注夏禹之世號夏后氏后君也禹受禪於君故夏稱后言大木揭然將蹶枝葉未有折傷而其根本之實已先絶然後此木乃相隨而顛拔爾根夲之實指國家天命言蘇氏曰商周之衰典刑未廢諸侯未畔四夷未起而其君先為不義以自絶於天莫可救止正猶此爾此亦以天為根本之實也殷鍳在夏蓋為文王嘆紂之辭然周鍳之在殷亦可知矣輯録歐陽氏曰非獨周之監殷殷之監夏后之興者當又鍳厲王也增釋此章言君自絶於天則必亡之非以終首章之意此詩賦體而未嘗一及當時之事皆以殷紂言之謂之比亦可也蕩八章章八句首章言其戕敗天命以致亂總言之也二章三章以任小人斂民怨為戕敗天命之故四章以自昏其德為任用小人之故五章又以沈酗酒為德自昏之故則以漸推夲而言之也六章言亂政斂怨之極則申二章三章之意七章言廢棄舊章不遵常法以傾大命則承六章之意而又結首章之意八章言其自戕自伐則又承七章之意而重結首章之意也抑抑威儀維德之隅人亦有言靡哲不愚庶人之愚亦職維疾叶集二反哲人之愚亦維斯戾賦也抑抑密也隅廉角也孔氏曰隅者角也廉者稜也角必有稜故曰亷隅鄭氏曰人密審於威儀者是其德必嚴正也故古之賢者道行心平可外占而知內道行於身如色溫貌恭之類心平者言其用心均平無處不然凡形於身者皆致意也如宫室之制內有繩直則外有廉隅也輯録王氏曰德譬則宫城也儀譬則隅也覩其隅則宫城之中可知矣彭氏曰惟德之隅蓋有諸中必形於外也制於外所以飬其中也觀曽子所言正顔色動容貌孟子所言見於面盎於背是也哲知庶衆職主戾反也衛武公作此詩使人日誦於其側以自警輯録嚴氏曰詩皆自警之言修身治國平天下之道與中庸大學相表裏言抑抑威儀乃德之隅則有哲人之德者固必有哲人之威儀矣而今之所謂哲者未嘗有其威儀則是無哲而不愚矣夫衆人之愚蓋有禀賦之偏宜有是疾古者民有三疾與此義同不足為怪哲人而愚則反戾其常矣無競維人四方其訓之有覺德行下孟反四國順之訏况于反謨定命逺猶辰告叶古得反敬慎威儀維民之則賦也競強也覺直大也覺者明顯之義不回邪狹小則明且顯也訏大謨謀也大謀謂不為一身之謀而有天下之慮也定審定不改易也命號令也猶圖也逺圖謂不為一時之計而為長久之規也辰時告戒也辰告謂以時播告也訏謨定命逺猶辰告治人之事也敬慎威儀治已之事也皆所以盡君人之道也則法也言天地之性人為貴輯録性生也董仲舒曰性者生之質也故能盡人道則四方皆以為訓有覺德行則四方皆順從之此盛德自然之效君道之標格也故必大其謀定其命逺圖時告敬其威儀然後可以為天下法也此五事乃君道之當然必如此然後可為民法也於此勉之則盡人道覺德行可至而順之訓之亦將不期而然矣輯録解頥曰人君必大其謀而後可以定其命必逺其圖而後可以時其告謨之訏猶之逺此自綱領上說所以立一代之規模者也命之定告之辰此自號令上說所以為一時之政事者也此戒其加於人者不可不審諸已也敬慎者戒懼之存乎中威儀者輝光之著乎外威而能敬儀而能慎則容止必可觀進退必可度而斯民無不畏而愛之則而象之此勉其修於己者必有以示於人也其在于今叶音經興迷亂于政叶音征顛覆厥德荒湛都南反下同于酒叶子小反女音女雖湛樂音洛從弗念厥紹市沼反罔敷求先王克共九勇反明刑叶胡光反賦也今武公自言己今日之所為也興尚也尚者尊尚之意言其所行以此為先也女武公使人誦詩而命已之詞也後凡言女言爾言小子者放此湛樂從言惟湛樂之是從也紹謂所承之緒也前人功績謂之緒敷求先王廣求先王所行之道也增釋吳師道曰敷求先王其亦習聞武王告康叔之語乎共執刑法也迷亂于政承謨命猶告言顚覆厥德承敬慎威儀言凡所以亂政敗德者以荒湛于酒故也湛樂雖可從也得不思念所承之緒之重乎今乃不法先王不守明法則湛樂之甚而厥緒危矣反承反說而為切責之詞也肆皇天弗尚叶平聲如彼流泉無淪胥以亡夙興夜寐灑掃廷內維民之章修爾車馬弓矢戎兵叶晡亡反用戒戎作用逖他歷反蠻方賦也弗尚厭棄之也尚則尊崇之矣弗尚則厭而棄之矣淪陷胥相章表戒備戎兵作起逖逺也言天所不尚則無乃淪陷相與而亡如泉流之易乎是以內自庭除之近外及蠻方之逺細而寢興灑掃之常大而車馬戎兵之變慮無不周備無不飭也上章所謂訏謨定命逺猶辰告者於此見矣湛樂如彼則必為天所厭棄矣所以無內外無逺近無細大無常變皆當備飭不可一事之不至也此又先致警懼之詞後致教告之詞以申訏謨定命逺猶辰告兩句之意輯録解頥曰夙興夜寐修身之事也灑掃庭內齊家之事也身者民之主家者國之則身修而家齊是豈不足以為民之章乎車馬所以安身也固不可以不修弓天戎兵所以防患也尤不可以不戒在我者既不至於妄動則在彼者亦不敢以輕侮此又治國之要也詳於內而不遺乎外謹於大而不忽乎細地有逺近之不同而慮之無不周事有常變之不同而備之無不飭此所以為訏謀定命逺猶辰告之實也歟質爾人民謹爾侯度用戒不虞叶元具反慎爾出話敬爾威儀叶牛何反無不柔嘉叶居何反白圭之玷丁簟反尚可磨也斯言之玷不可為叶吾禾反也賦也質成也定也曰成曰定皆安靜之意也侯度諸侯所守之法度也虞慮話言柔安嘉善玷缺也言既治民守法防意外之患矣輯録蘇氏曰苟失其民心慢其侯度則將有不虞之禍起又當謹其言語蓋玉之玷缺尚可磨鑢良豫反使平言語一失莫能救之其戒深切矣質人民謹侯度戒不虞即上章之無所不備也治人之事則備矣而治已之事尤不可慢故以慎爾出話為敬威儀之本此又專為教告之詞以申訏謨定命以下四句之意也故南容一日三去聲復此章而孔子以其兄之子妻去聲之此又推之以為學者之法輯録黃勉齊曰三復謂每誦至此再三反覆以識之非謂一次三復亦非謂只一日三次誦之也無易以䜴反由言無曰苟矣此二句不用韻莫捫音門朕舌言不可逝叶音折與舌叶矣無言不讎叶市又反無德不報叶蒲救反惠于朋友叶羽已反庶民小子叶奬里反子孫繩繩萬民靡不承賦也易輕捫持逝去讎答承奉也言不可輕易其言蓋無人為我執持其舌者故言語由己易致差失常當執持不可放去也不可易不可苟不可放丁寧之詞不一者謹言之功夫固當嚴為之防也且天下之理無有言而不讎無有德而不報者若爾能惠于朋友庶民小子則子孫繩繩而萬民靡不承矣皆謹言之效也朋友羣臣也小子凡後生子弟皆是也國君言語國中之人禍福繫焉能謹其言則人皆蒙其德惠矣是以天命佑之而子孫繩繩人心歸之而萬民靡不承也謹言之效其大如此自此以下專申敬慎威儀一句之意而此章正接慎爾出話言視爾友君子輯音集柔爾顔叶魚堅反不遐有愆相息亮反在爾室尚不愧于屋漏無曰不顯莫豫云覯神之格叶剛鶴反思不可度待洛反思矧可射音亦叶代灼反思賦也輯和也遐何通愆過也尚庶幾也屋漏室西北隅也覯見也格至度測矧况也射斁通厭也言視爾友於君子之時和柔爾之顔色和柔者不暴慢也其戒懼之意常若自省曰豈不至於有過乎蓋常人之情其修於顯者無不如此然視爾獨居於室之時亦當庶幾不愧于屋漏然後可爾無曰此非明顯之處而莫豫見也當知鬼神之妙無物不體其至於是有不可得而測者不顯亦臨猶懼有失况可厭射而不敬乎此言不但修之於外又當戒謹恐懼乎其所不睹不聞也地有隱顯而鬼神之妙無隱顯鬼神無往而不在故敬無往而可忘此章又言持敬之功當如此蓋恐其於顯明之地用功而幽隱之地有間則不免乎色莊也故極言之子思子曰君子不動而敬不言而信用功之密如此輯録言君子之戒謹恐懼無時不然不待言動而後敬信也又曰夫微之顯誠之不可掩如此用功不可不密者以此輯録此自鬼神之體物而言也微與誠對顯與不可掩對自其妙言之曰微自其實言之曰誠此正心誠意之極功極功者言其功夫至到而無以加也輯録不遐有愆是能慎獨而意無不誠矣不愧屋漏是能戒懼而心無不正矣而武公及之則亦聖賢之徒矣辟爾為德俾臧俾嘉叶居何反淑慎爾止不愆于儀叶牛何反不僣不賊鮮息淺反不為則投我以桃報之以李彼童而角實虹户公反小子叶奬里反賦也辟君也指武公也止容止也僣差賊害輯録解頥曰不僣則於事無所差不賊則於理無所害則法也無角曰童虹訌同潰亂也輯録字書虹與訌同既戒以修德之事而又言為德而人法之猶投桃報李之必然也彼謂不必修德而可以服人者是牛羊之童者而求其角也亦徒潰亂汝而已豈可得哉既言功夫之當然又設詞以見效驗之必然又設詞以見妄說之必不然反覆言之以明功夫不可闕而效驗不可誣也荏而甚反染而漸反柔木言緡之絲叶新夷反溫溫恭人維德之基其維哲人告之話言順德之行與言叶其維愚人覆謂我僣叶七尋反民各有心興也荏染柔貌柔木柔忍音刃之木也柔木以興溫恭二者皆見柔美為可尚也緡綸也被之綸以為弓也輯録謝氏曰柔和之木可矯揉而為弓溫恭之人可積纍而成德解頥曰基者堂宇之所由以立溫恭者亦德之所由以成也話言古之善言也覆猶反也僣不信也民各有心言人心不同愚智相越之逺也此章專以溫恭言又以丁寧致意於敬之一字也自其維哲人以下至終篇皆告以不可不聽話言之意於音烏乎音呼小子叶奬里反未知臧否音鄙匪手攜之言示之事叶上止反匪面命之言提其耳借曰未知亦既抱子同上民之靡盈誰夙知而莫音慕成賦也非徒手攜之也而又示之以事非徒面命之也而又提其耳所以喻之者詳且切矣假令言汝未有知識則汝既長大而抱子宜有知矣輯録輔氏曰武公老矣而使人謂其小子可謂不自盈滿矣只此便見其溫柔之意言示之事諭之明也言提其耳告之切也告之者既明且切則宜有警矣而猶不知覺何哉借曰未有知識則亦既抱子矣况耄期之年乎則是宜有警也人若不自盈滿能受教戒則豈有既早知而反晚成者乎謙受益昊天孔昭叶音灼我生靡樂音洛視爾夢夢莫公反我心慘慘當作懆七到反叶七各反誨爾諄諄之純反聽我藐藐美角反匪用為教叶入聲覆用為虐借曰未知亦聿既耄叶音莫賦也夢夢不明亂意也慘慘憂貌輯録輔氏曰言昊天甚明其知我生之靡樂也其所以靡樂者即下文所謂視爾夢夢我心慘慘也諄諄詳熟也藐藐忽略貌輯録人不知自修則以忠教為見虐者多矣耄老也八十九十曰耄左史所謂年九十有五時也於乎小子見上章告爾舊止聽用我謀庶無大悔叶虎委反天方艱難曰喪息浪反厥國叶于逼反取譬不逺昊天不忒他得反回遹于橘反其德俾民大棘賦也舊舊章也或曰久也止語詞庶幸悔恨忒差遹僻棘急也言天運方此艱難將喪厥國矣我之取譬夫豈逺哉觀天道禍福之不差忒則知之矣今汝乃回遹其德而使民至於困急則喪厥國也必矣回遹其德敬之反也自十章至此教告諄切大意皆同然十章其詞婉所以誨之也十一章其詞厲所以責之也十二章其詞危所以懼之也愈言之而意愈深矣抑十二章三章章八句九章章十句楚語左史倚相曰昔衛武公年數九十五矣東陽許文懿曰武公卒於平王之十三年則此詩乃平王時詩未可以東遷雅亡之說斷之也猶針警於國曰自卿以下至于師長上聲士師長大夫也士衆士也苟在朝音潮者無謂我老耄而舍我必恭恪於朝夕以交戒我在輿有旅賁音奔之規旅賁衛士規諫也輯録夏官旅賁氏掌執戈盾夾車而趍車止則持輪位寧有官師之典中庭之左右謂之位門屏之間謂之寧師長也典常也倚几有誦訓之諫倚憑也工師所誦以諫者書之几輯録地官誦訓主訓說四方之事居寢有􅉏音薛御之針􅉏御近臣也臨事有瞽史之道事戎祀也瞽樂師史太史道言也宴居有師工之誦師工皆樂官也史不失書矇不失誦以訓御之御進也於是作懿戒以自警及其沒也謂之睿聖武公輯録真氏曰自卿以下無一人不使任針規之職自在輿以下無一處不欲聞針規之言猶且作抑詩使人誦之不離其側如是而意不誠心不正者未之有也韋昭曰懿讀為抑即此篇也董氏曰侯包言輯録隋經籍志韓詩冀要十卷侯包撰包學韓者也武公行年九十有五猶使人日誦是詩而不離去聲於其側然則序說為刺厲王者誤矣首章專以威儀言二章以聖賢能事為標凖政事威儀為實功三章又以迷亂政事顛覆威儀為戒四章則專言政事五章雖及政事而歸重於威儀六章既言敬威儀之功又言敬威儀之效七章主於威儀而發持敬之極功八章又言威儀當敬而不可慢也如此九章以後反覆告戒專在威儀既以溫溫恭人正言之又以回遹其德反結之然則威儀政事皆所當謹而威儀為最重用功之道則持敬為最切故篇中不愧屋漏一語乃其要之要也增釋許氏曰武公之詩見於經者三淇澳人頌之之辭亦以盡力於學問而成其德也賔之初筵抑則其自作也皆有戒醉酒謹威儀慎言語之意豈武公少年之失在此乎及聞君子之言幡然悔悟而自勑故晚年自為針戒之辭必惓惓於此矣謂之睿聖武公是真有不可及者也菀音欎彼桑柔與劉憂叶篇內多放此其下侯旬捋力活反采其劉瘼音莫此下民不殄心憂倉初亮反兄與恍同填舊說古塵字兮倬彼昊天叶鐵因反寧不我矜比也菀茂旬遍劉殘殄絶也倉兄與愴音創恍音况同悲閔之意也填未詳舊說與陳塵同蓋言久也或疑與癲音顛字同為病之義但召旻篇內二字並出又恐未然今姑闕之舊說此為芮伯刺厲王而作春秋傳亦曰芮良夫之詩文公元年輯録疏芮伯周同姓國杜預云芮國在馮翊臨晉縣則在西都之畿內也則其說是也以桑為比者桑之為物其葉最盛然及其采之也一朝而盡無黃落之漸故取以比周之盛時如葉之茂其隂無所不遍至於厲王肆行暴虐以敗其成業王室忽焉凋弊如桑之既采民失其隂而受其病輯録輔氏曰首二句比周之盛時仁覆天下也次二句比厲王殘虐害及天下也故君子憂之不絶於心悲閔之甚而至於病遂號天而訴之也四牡騤騤旟旐有翩叶批賔反亂生不夷靡國不泯叶彌鄰反民靡有黎具禍以燼叶咨辛反於音烏乎音呼有哀叶音依國步斯頻賦也夷平泯滅黎黑也謂黑首也具俱也燼灰燼也輯録輔氏曰無國不滅無民不燼則甚言之耳步猶運也頻急蹙也厲王之亂天下征役不息故其民見其車馬旌旗而厭苦之自此至第四章皆征役者之怨辭也國步蔑資天不我將叶子兩反靡所止疑魚乞反叶如字云徂何往君子實維秉心無競叶其兩反誰生厲階叶居奚反至今為梗古杏反叶古黨反賦也蔑滅資咨將養也疑讀如儀禮疑立之疑定也鄉射禮賔升西階上疑立主人阼階東疑立鄉飲酒亦有此文又士昏禮婦疑立於席之西輯録注疑立正立自定之貌徂亦往也競爭厲怨梗病也言國將危亡天不我養居無所定徂無所往然非君子之有爭心也誰實為此禍階使至今為病乎輯録解頥曰無爭者君子之所以己亂好爭者小人之所以生亂蓋曰禍有根原其所從來也逺矣憂心殷殷念我土宇我生不辰逢天僤都但反怒叶暖五反自西徂東叶音丁靡所定處多我覯痻武巾反孔棘我圉賦也土鄉宇居辰時僤厚覯見痻病輯録痻當易彌鄰反棘急圉邉也或曰禦也輯録鄭氏曰禦冦之事也多矣我之見病也急矣我之在邉也為謀為毖叶音必亂况斯削告爾憂恤誨爾序爵誰能執熱逝不以濯其何能俶載胥及溺叶奴學反賦也毖慎况滋也序爵辨别賢否之道也輯録李迂仲曰爵自有序上賢則加以上爵中賢則次之下賢則又次之若小加大淫破義則失其序矣曹氏曰外之公侯伯子男內之公卿大夫士皆爵也增釋吳師道曰其下反獲皆以賢否為言執熱手持熱物也輯録逝語詞也蘇氏曰王豈不謀且慎哉然而不得其道適所以長亂而自削耳故告之以其所當憂而誨之以序爵且曰誰能執熱而不濯者賢者之能已亂猶濯之能解熱耳不然則其何能善哉相與入於陷溺而已一章自為悲閔之詞二章三章四章述征役者之怨詞亂亦甚矣此章又為忠告之詞而教之以己亂是則詩人之忠厚也如彼遡風叶孚音反亦孔之僾音愛民有肅心荓普耕反云不逮好呼報反是稼穡力民代食稼穡維寶代食維好賦也遡鄉音向僾唈庵入聲氣不舒也肅進荓使也蘇氏曰君子視厲王之亂悶然如遡風之人唈而不能息雖有欲進之心皆使之曰世亂矣非吾所能及也於是退而稼穡盡其筋力與民同事以代祿食而已當是時也仕進之憂甚於稼穡之勞故曰稼穡維寶代食維好言雖勞而無患也天降喪息浪反亂滅我立王降此蟊賊稼穡卒癢音羊哀恫音通中國具贅之芮反卒荒靡有旅力以念穹蒼賦也恫痛具俱也贅屬音燭也言危也春秋傳曰君若綴旒然與此贅同旒瘤同附肉之懸者輯録見公羊傳襄公十六年卒盡荒虛也旅與膂同穹蒼天也穹言其形蒼言其色言天降喪亂固己滅我所立之王矣又降此蟊賊則我之稼穡又病而不得以代食矣哀此中國皆危盡荒是以危困之極無力以念天禍也上章憂亂而退為家食此章災禍並起而退無可食則皆自痛之詞也此詩之作不知的在何時其言滅我立王則疑在共和之後也厲王流彘二相周召以太子靖幼共理國事故曰共和又蘇氏古史云厲王流彘國無主有賢諸侯曰共伯和諸侯宗之因名其年曰共和輔氏曰此謂滅我立王則為共和以後矣然又謂告爾憂恤誨爾序爵則非追刺之語也故朱子疑之維此惠君民人所瞻叶側姜反秉心宣猶考慎其相息亮反叶平聲維彼不順自獨俾臧自有肺腸俾民卒狂賦也惠順也順於義理也宣遍猶謀相輔狂惑也言彼順理之君所以為民所尊仰者以其能秉持其心周遍謀度考擇其輔相必衆以為賢而後用之考者辨之明慎者用之謹彼不順理之君則自以為善而不考衆謀自有私見而不通衆志所謂愚而好自用也所以使民眩惑至於狂亂也上之人顛倒是非則民之惑亂無怪矣惠人君有賢否故用舍有得失今王不為君而為不順也至此而序爵之云不可誨矣瞻彼中林甡甡所巾反其鹿朋友已譛子念反叶子林反不胥以榖人亦有言進退維谷興也甡甡衆多並行之貌衆多並行則有同類和輯之意譛不信也胥相榖善谷窮也言朋友相譛不能相善曽鹿之不如也此以人不如物起興言上無明君下有惡俗是以進退皆窮也無明君則人道廢故俗惡如此上章舉措失宜而民無以定其志此章讒譛為害而已無所容其身上下俱可怨而實皆怨其上之詞也維此聖人瞻言百里維彼愚人覆狂以喜匪言不能胡斯畏忌叶巨已反賦也聖人炳於幾先輯録炳明也幾平聲幾微兆聯也所視而言者無逺而不察前知如神蓋如此愚人不知禍之將至而反狂以喜今用事者蓋如此我非不能言也如此畏忌何哉言王暴虐人不敢諫也前章言上下胥而為惡如此則危亡著矣又無知幾識微之士而皆安危利菑之人使能言者不敢言之則禍將至而不可救矣維此良人弗求弗迪叶徒沃反維彼忍心是顧是復方六反民之貪亂寧為荼毒賦也迪進也忍殘忍也顧念復重也荼苦菜也味苦氣辛能殺物故謂之荼毒也言不求善人而進用之其所顧念重復而不已者乃忍心不仁之人前云自有肺腸是不智也此云忍心顧復則同惡相濟而不仁甚矣序爵之云又何誨哉輯録解頥曰良人者國之寶也則棄之而如遺忍心者國之賊也則念之而不已民不堪命所以肆行貪亂而安為荼毒也小人在位以忍心倡之則民以忍心行貪毒也上章智愚異見而已難盡其忠此章舉措失宜而民皆肆其惡是亦怨其上之詞也大風有隧音遂有空大谷維此良人作為式榖維彼不順征以中垢古口反叶居六反興也隧道式用榖善也征以中垢未詳其義或曰征行也中𨼆暗也垢汙穢也大風之行有隧蓋多出於空谷之中以興下文君子小人所行亦各有道也此以人物各有趍向為興君子所行者善道小人之行𨼆暗汙穢而已後章民之罔極以下皆見其隱暗汙穢之行也大風有隧貪人敗類聽言則對誦言如醉匪用其良覆俾我悖叶蒲寐反興也敗類猶言圯音痞族也輯録堯典蔡氏曰圯敗族類也言與衆不和傷人害物也王使貪人為政我以其或能聽我之言而對之然亦知其不能聽也故誦言而中心如醉無可與語故自誦其言耳誦言猶云獨語也由王不用善人而反使我至此悖眊音冒也任小人而不聽善言舍君子而不見信用是以使我憂之甚也悖眊即是如醉疊言之爾輯録輔氏曰上章以上兩句興下四句此章則以上一句興下一句耳大風則有隧矣貪人則敗類矣聽言則對四句集傳以為一串說都載在下句我字上厲王說音恱榮夷公輯録韋昭曰榮國名芮良夫曰王室其將卑乎夫音扶榮公好去聲專利而不備大難去聲夫利百物之所生也天地之所載也而或專之其害多矣出外傳周語此詩所謂貪人其榮公也與平聲芮伯之憂非一日矣上言善惡異趨而可辨此言舉措失宜而可怨則又自知之明而無所控告之詞也嗟爾朋友豫豈不知而作如彼飛蟲時亦弋獲叶胡郭反既之隂于鴆反女音汝反豫來赫叶黑各反賦也如彼飛蟲時亦弋獲輯録飛蟲飛鳥弋獲射中也言己之所言或亦有中猶曰千慮而一得也之往隂覆也赫威怒之貌我以言告女是往隂覆於女欲使之改惡為善轉禍為福耳女反來加赫然之怒於已也所謂朋友者即譛已之朋友也此特以其同僚共事耳本即小人之徒也苟為同類之君子則豈反豫來赫乎張子曰既往密告於女反謂我來恐動也亦通輯録通釋曰釋文隂或音如字赫本亦作赫音罅莊子云以梁國赫我是也張子之說蓋用釋文二字之意民之罔極職凉善背叶必墨反為民不利如云不克民之回遹職競用力賦也職專也凉義未詳傳曰凉薄也鄭讀作諒信也疑鄭說為得之善背工為反覆也克勝也回遹邪僻也言民之所以貪亂而不知所止者專由此人名為直諒而實善背又為民所不利之事如恐不勝而力為之也又言民之所以邪僻者亦由此輩專競用力而然也反覆其言所以深惡之也道民以惡貽民以禍莫非小人之為也此其所以致亂也民之未戾職盜為冦凉曰不可覆背善詈力智反雖曰匪豫既作爾歌叶韻未詳賦也戾定也民之所以未定者由有盜臣為之冦也蓋其為信也亦以小人為不可矣及其反背也則又工為惡言以詈君子言之信則非小人言之譛則謗君子是其色厲內荏音稔真可謂穿窬之盜矣然其人又自文音問飾以為此非我言也則我已作爾歌矣言得其情且事已著明不可掩覆去聲也自十四章至此又皆託為僚友相告之詞然始則嗟嘆而責之其詞正中則數其罪而斥之其詞厲終則暴其情狀而究言之其詞决蓋斥其見用者而用之者之罪可見也桑柔十六章八章章八句八章章六句吕氏曰此詩本厲王之亂在於用小人故於聽任之道屢致意焉愚按吕氏之說甚得詩意然五章言告爾憂恤誨爾序爵規之也八章言自獨俾臧自有肺腸怪之也十一章言維彼忍心是顧是復則責之甚也十三章言匪用其良覆俾我悖則怨之深也至最後三章不及於王而惟推見小人之心術則怨王之意不可勝道矣夫以忍心不順之徒貪婪反覆冦盜之輩充斥在朝如此欲免於亂得乎又按此詩十六章義最煩劇今既略疏章㫖於傳文之下但一篇之意必合而觀之然後可通蓋首章為遭亂呼天之詞二章三章四章述征役者之怨詞五章教以用賢救亂則為陳善納誨之詞六章則仕進不如力農七章則在朝在野同一禍患八章則怨王之不智而不能用賢以致民人之惑九章則怨友之不信而不能相善以致善人之困十章言愚人不識禍幾而忠言不敢進十一章言棄賢用盜而以不仁誨其民十二章言君子小人趨向之異十三章又深怨王之用小人十四章至十六章又反覆以責小人而見用小人者為可深怨也小雅正月大雅桑柔皆詩人深悲甚痛之詞故言之長也如此然彼多憂懼此多哀怨則有不容不辨也倬彼雲漢昭回于天叶鐵因反王曰於音烏乎音呼何辜今之人天降喪息浪反亂饑饉薦在甸反臻靡神不舉靡愛斯牲叶桑經反圭璧既卒寧莫我聽他丁反賦也雲漢天河也昭光回轉也言其光隨天而轉也輯録曹氏曰漢在天似雲非雲故曰雲漢也漢者水之精而雨者水之施也天將雨其兆先見於漢故閔雨則望雲漢而占之也天漢起於東方經尾箕之間是為漢津委蛇向西南行至七星南而沒此其回旋之度也薦荐通重也臻至也靡神不舉所謂國有凶荒則索鬼神而祭之也周禮大司徒以荒政十有二聚萬民其十一曰索鬼神言求廢祀而修之也圭璧禮神之玉也輯録春官大宗伯以蒼璧禮天黃琮禮地以青圭禮東方赤璋禮南方白琥禮西方𤣥璜禮北方典瑞云四圭有邸以祀天旅上帝兩圭有邸以祀地旅四望祼圭有瓉以祀先王圭璧以祀日月星辰璋邸射以祀山川皆祭神所用言圭璧總稱卒盡輯録羅氏曰牲用不可盡故言無愛圭璧少而易竭故言既盡寧猶何也舊說以為宣王承厲王之烈烈暴虐也內有撥亂之志遇烖而懼側身修行去聲欲銷去去聲之天下喜於王化復去聲行百姓見憂側反側而不安也見憂謂見被憂矜也故仍叔作此詩以美之輯録箋仍叔周大夫言雲漢者夜晴則天河明故述王仰訴於天之詞如此也此章閔下民之遭禍傷禱祀之無應而致呼天之意也旱既大音泰甚藴隆蟲蟲不殄禋祀自郊徂宫上下奠瘞靡神不宗后稷不克上帝不臨叶力中反耗斁丁故反下土寧丁我躬賦也藴蓄隆盛也蟲蟲熱氣也輯録曹氏曰藴者陽氣之蓄樍也隆者陽氣之驕亢也蟲蟲者鬱積驕亢之氣熏炙而病殄絶也郊祀天地也言郊則社在其中故曰祀天地宫宗廟也上祭天下祭地奠其禮瘞於計反其物孔氏曰奠置之於地瘞埋之於土酒食牲玉之屬皆然輯録濮氏曰祭畢凡幣帛祝冊之屬燎而瘞之宗尊也克勝也言后稷欲救此旱灾而不能勝也臨享也稷以親言帝以尊言也稷即帝帝即稷皆郊祀也斁敗丁當也何以當我之身而有是灾也或曰與其耗斁下土寧使灾害當我身也亦通上章靡神不舉言其槩也此則首以禋祀總言之繼又詳數郊宫奠瘞之實又以靡神不宗結之則天神地示人鬼內外上下無不遍矣此章又傷禱祀之無應閔下民之遭禍而所以呼天者尤切也旱既大甚則不可推吐雷反兢兢業業如霆如雷周餘黎民靡有孑遺叶夷回反下同昊天上帝則不我遺胡不相畏先祖于摧在雷反賦也推去也兢兢恐也業業危也如霆如雷言畏之甚也孑無右臂貌遺餘也言大亂之後承厲王之亂也周之餘民無復有半身之遺者輯録孟子曰說詩者不以文害詞不以詞害志以意逆志是為得之如以詞而已矣雲漢之詩曰周餘黎民靡有孑遺信斯言也是周無遺民也朱子曰若但以其詞而已則如雲漢之言是周之民真無遺種矣惟以意逆志則知作詩者之志在於憂旱而非真無遺民也而上天又降旱災使我亦不見遺也輯録民無遺君安得獨存乎摧滅也言先祖之祀將自此而滅也此亦承憂民之意言之既憂於民又憂於已又憂先祖之祭祀則其恐懼不得不然矣此章又即人即己憂懼不一而所以呼天者愈迫矣旱既大甚則不可沮在吕反赫赫炎炎云我無所大命近止靡瞻靡顧叶果五反羣公先正則不我助叶牀所反父母先祖胡寧忍豫叶演女反賦也沮止也赫赫旱氣也炎炎熱氣也無所無所容也大命近止死將至也瞻仰顧望也羣公先正月令所謂雩祀百辟卿士之有益於民者以祈榖實者也注云此謂古之上公以下句龍后稷之類輯録疏正長也先世為官之長陳氏曰雩者吁嗟其聲以求雨之祭周禮女巫凡邦之大烖歌哭而請亦其義也於群公先正但言其不見助至父母先祖則以恩望之矣所謂垂涕泣而道之也此承則不我遺之意謂天不我佑無所望矣故轉而望於羣公先正及父母先祖如此而其分有親踈故所望有輕重也旱既大甚滌滌徒歷反山川叶樞倫反旱魃蒲末反為虐如惔音談如焚叶符均反我心憚暑憂心如熏群公先正則不我聞叶微勻反昊天上帝寧俾我遁叶徒均反賦也滌滌言山無木川無水如滌而除之也魃旱神也惔燎之也憚勞也畏也熏灼遁逃也言天又不肯使我得逃遁而去也羣公先正則不我聞蓋又甚於不助矣故又反而怨天謂何以不肯使我避賢去位也怨此二章又反憂於已而轉旋號呼所以哀求救者不一也旱既大甚黽勉畏去胡寧癲都田反我以旱􅉃七感不知其故祈年孔夙方社不莫音慕昊天上帝則不我虞叶元其反敬恭明神宜無悔怒賦也黽勉畏去出無所之也癲病􅉃曽也祈年孟春祈榖于上帝孟冬祈來年于天宗是也出月令注云天宗日月星辰也方祭四方也社祭土神也虞度待洛反悔恨也言天曽不度我之心如我之敬事明神宜可以無恨怒也此承遁去之意而言欲去又不可去也其進退維谷甚矣故又追念向者祈年方社如此而冀天之佑己也此章又憂禍患之丁已思祭祀之無缺以致呼天之意也旱既大甚散無友紀鞫居六反哉庶正疚哉冡宰叶奬里反趣七口反馬師氏膳夫左右叶羽已反靡人不周無不能止瞻卬音仰昊天云如何里賦也友紀猶言綱紀也或曰友疑作有凶年離散無所維繫鞫窮也庶正衆官之長上聲下同也見雨無正注疚病也冡宰又衆長之長也趣馬掌馬之官師氏掌以兵守王門者膳夫掌食之官也嵗凶年榖不登輯録孔氏曰嵗取嵗星行一次也年取榖一熟也謂此嵗凶於此年之榖不成熟也則趣馬不秣不以粟食馬師氏弛其兵師氏掌近王之兵故可弛馳道不除王之馳道不治輯録不掃除也祭事不縣不懸其樂膳夫徹膳王减膳不供太牢左右布而不修諸臣布列於位不令有所修造大夫不食粱粱美榖也士飲酒不樂飲酒用樂則過於樂而侈輯録嵗凶以下本毛傳與禮記曲禮語同周救也無不能止言諸臣無有一人不周救百姓者無有自言不能而遂止不為也里憂也與漢書無俚之俚同前漢李布贊云賢者誠重其死夫婢妾賤人感慨而自殺非能勇也其畫無俚之至爾聊賴之意也此章又言羣臣之竭誠救旱如此以致呼天之意也瞻卬昊天有嘒呼惠反其星大夫君子昭假音格無贏音盈大命近止無棄爾成何求為于僞反我以戾庶正叶諸盈反瞻卬昊天曷惠其寧賦也嘒明貌昭明假至也久旱而仰天以望雨則有嘒然之明星未有雨徴也然群臣竭其精誠而助王以昭假于天者已無餘矣此即上章之事雖今死亡將近而不可以棄其前功當益求所以昭假者而修之固非求為我之一身而已乃所以定衆正也民安而後庶官定於是語終又仰天而訴之曰果何時而惠我以安寧乎此章又勉羣臣之益竭其誠以致呼天之意也張子曰不敢斥言雨者畏懼之甚且不敢必云爾七章八章意謂天不念我之憂旱盍念羣臣之救旱以致願望之意也夫以宣王之懼災如此而其羣臣又能以王之心為心君臣上下可謂知恤矣周之中興豈偶然哉雲漢八章章十句輯録吕東萊曰宣王小雅始於六月言其功也大雅始於雲漢言其心也無是心安有是功哉解頥曰余讀雲漢詩見宣王有事天之敬有事神之誠有恤民之仁敬畏以事天而天監之䖍恭以事神而神享之惻怛以恤民而民懷之藴隆之氣消豐穰之效著內治既修外穰斯舉南征北伐無不如意中興之業視文武成康而無愧皆自雲漢一念之烈而基之也神增釋許氏曰一章總言天旱人窮索祭鬼而無應二章言其詳而欲引災歸已若成湯自責三章言民困之極恐墮先王之業謂自厲王之亂周民已少而遺民今又將盡四章祈望於祖禰先正五章欲避位逃禍而不可得六章責事神之或失七章君臣救災之勤八章勸率其臣以終之總而言之宣王遇災憂懼始祈於外神次祈於宗廟既而無驗則自揆事神之誠或未至誠既盡則又盡人事以聽天命也其恐懼修省之意仁愛惻怛之誠反覆淫溢於言辭之間宣王之所以賢仍叔之善於知德立言皆可見矣嵩息中反髙維嶽駿音峻極于天叶鐵因反維嶽降神生甫及申維申及甫維周之翰叶胡于反四國于蕃叶分邅反四方于宣賦也山大而髙曰嵩嶽山之尊者東岱南霍西華去聲北恆是也衡山古南嶽也或云黃帝以灊霍二山為之副或云霍即衡之别名或云漢武以衡山遼逺而移其神於此駿大也甫甫候也即穆王時作吕刑者或曰此是宣王時人而作吕刑者之子孫也當從前說申申伯也皆姜姓之國也輯録李迂仲曰申侯爵以其為方伯故謂之申伯翰幹蕃蔽也宣王之舅申伯出封于謝而尹吉甫作詩以送之言嶽山髙大而降其神靈和氣以生甫侯申伯實能為周之楨幹屏蔽而宣其德澤於天下也輯録謝氏曰有非常之山斯有非常之神氣有非常之神氣斯有非常之人才有非常之人才斯有非常之功業蓋申伯之先神農之後姜氏出神農為唐虞四嶽總領方嶽諸侯而奉嶽神之祭能修其職嶽神享之故此詩推本申伯之所以生以為嶽降神而為之也嶽山髙大而神靈和氣儲蓄深厚故鍾為二賢前後迭出功相比業相齊其生也有自來其出也有所為非偶然也推賢者以配古人其敬重如此此章言其生票之異而才無不具也亹亹申伯王纘祖管反之事于邑于謝南國是式叶失吏反王命召伯叶逋莫反定申伯之宅叶逹各反登是南邦叶卜功反世執其功賦也亹亹強上聲勉之貌輯録朱子曰與亹亹文王者異矣纘繼也使之繼其先世之事也邑國都之處也謝在今鄧州南陽縣孔氏曰先是申國本近謝今命為州牧故改邑於謝周之南土也式使諸侯以為法也召伯召穆公虎也王肅謂召穆公為宣王司空司空掌營國邑故命之登成也世執其功言使申伯後世常守其功也此章言申伯封謝之由天子城謝之意也申伯以諸侯入為卿士亹亹事王王嘉其勤復使纘其先世諸侯之事改大其邑命為方伯而南方諸侯皆法之故使召伯定其宅成其城庶幾申伯以貽子孫也盡尊崇之道致悠久之規禮意無加於此矣或曰大封之禮召公之世職也溥彼韓城燕師所完則康公已掌是職矣輯録通釋曰如或說則此章前四句述王褒封申伯之事後四句述王命穆公為申伯定邑居常守康公之職也王命申伯式是南邦叶卜功反因是謝人以作爾庸王命召伯徹申伯土田叶地因反王命傅御遷其私人賦也庸城也言因謝邑之人而為國也體勢不重則不足以鎮南服故因謝邑民居稠密而以之作邑也鄭氏曰庸功也為國以起其功也徹定其經界正其賦稅也傅御申伯家臣之長也私人家人遷使就國也漢明帝送侯印與東平王蒼諸子而以手詔賜其國中傅蓋古制如此以天子而命諸侯之家臣此其例也此章又述天子城謝之意而見其命事為甚詳也王欲使申伯為法於南國之諸侯故因謝邑民人之衆而使居之且命召伯徹土田以足其用命傅御遷私人以安其居董事之臣皆出上命其所以厚申伯者如此輯録漢東平王蒼來朝歸帝乃遣使手詔賜東平國中傅曰今送列侯印十九枚諸王子年五嵗以上能趍拜者皆令帶之申伯之功召伯是營有俶尺叔反其城寢廟既成既成藐藐王錫申伯叶逋各反四牡蹻蹻渠略反鉤膺濯濯賦也俶始作也藐藐深貌君子營宫室宗廟為先專舉寢廟致重也蹻蹻壯貌輯録鉤膺見采芑濯濯光明貌營謝既畢則錫命以遣之此竣事臨遣之時而備送往之禮也王遣申伯路車乘繩憕反馬叶滿補反我圖爾居莫如南土錫爾介圭以作爾寶叶音補往近鄭音記按說文從辵從元今從斤誤王舅南土是保叶音保賦也介圭諸侯之封圭也封大也近辭也此臨遣之時而述王命之之詞也南國是式德足以為矜式也南土是保才足以為屏蔽也申伯之承重任如此申伯信邁王餞淺賤反于郿芒悲反申伯還南謝于誠歸王命召伯徹申伯土疆以峙直理反其粻音張式遄市專反其行叶户郎反賦也郿在今鳯翔府郿縣輯録今隸陜西在鎬京之西岐周之東而申在鎬京之東南時王在岐周故餞于郿也言信邁誠歸以見王之數音朔留疑於行之不果故也謝于誠歸者誠歸于謝也語倒如此峙積粻糧遄速也召伯之營謝也則已斂其稅賦積其餱糧使廬市有止宿之委積皆去聲輯録何伯善曰周禮注牢米薪芻路增釋許氏曰地官遺人凡㑹客㑹同師役掌其道之委積凡國野之道十里有廬廬有飲食三十里有宿宿有路室路室有委積五十里有市市有候館候館有積注疏倉人主榖廩人主米計是國用以其餘共委積少曰委多曰積故能使申伯無留行也此則啓行之時也方行則有餞送之誠在道則有供億之備送往之禮備矣上言徹土田是井也田以授民人此言徹土疆則取井田什一之賦以為餱糧而供一時之用耳申伯畨畨音波叶分邅反既入于謝徒御嘽嘽吐丹反周邦咸喜戎有良翰叶胡于反不顯申伯王之元舅文武是憲叶虛言反賦也畨畨武勇貌嘽嘽衆盛也戎女也申伯既入于謝周人皆以為喜而相謂曰汝今有良翰矣謝邑之人亦周人耳有良翰者有賢諸侯以為依也元長憲法也言文武之士皆以申伯為法也前言南土是式矣此曰文武是憲而先之以不顯者所以指言其德而探其本也或曰申伯能以文王武王為法也此章豫言其入謝之時民人喜有所依諸侯皆得有所法也申伯之德柔惠且直揉汝又反此萬邦聞音問于四國叶于逼反吉甫作誦其詩孔碩其風肆好以贈申伯賦也柔惠而不直則或流於邪媚矣此臣德之兼全而所謂不顯者正在是也揉治也吉甫尹吉甫周之卿士誦工師所誦之詞也碩大風聲述於言為詩歌於工為誦其聲足以感人則為風肆遂也此章言其美德全而治聲著見己之詩不容不作也嵩髙八章章八句輯録語録問嵩髙蒸民二詩皆是遣大臣出為諸侯築城曰此也曉不得封諸侯固是大事看黍苗詩當初召伯帶領許多車徒人馬去也自勞攘胡庭芳曰嵩髙與黍苖相表裏黍苖不過述召伯營謝之功嵩髙則尹吉甫送申伯雖美申伯多述王命故雅有大小不同也增釋許氏曰詩云四國于蕃四方于宣揉此萬邦見其功也南國是式式是南邦亹亹畨畨柔惠且直聞于四國見其賢也一章神生申伯所以輔周二章定封于謝三章先正經界而後遷民四章有城郭宫室而後錫命五章遣申伯之國六章祖餞委積之勤七章豫誦民之喜其來八章頌其德以送之天生蒸民有物有則民之秉彛音夷好呼報反是懿德天監有周昭假音格于下叶後五反保兹天子生仲山甫賦也蒸衆則法秉執彛常懿美監視昭明假至保祐也仲山甫樊侯之字也輯録疏食采於樊在東都畿內宣王命樊侯仲山甫築城于齊而尹吉甫作詩以送之言天生衆民有是物必有是則輯録所謂氣以成形理亦賦焉者也蓋自百骸九竅苦弔反五臟而逹之君臣父子夫婦長幼朋友無非物也而莫不有法焉如視之明聽之聰貌之恭言之順君臣有義父子有親之類是也凡有一物必有一理固不止是數事也故以如此之類言之是乃民所執之常性故其情無不好此美德者則與彛是性好此懿德是情性本善故情好善而况天之監視有周能以昭明之德感格于下明德在下而感格于天也故保祐之而為之生此賢佐曰仲山甫焉則所以鍾聚也其秀氣而全其美德者又非特如凡民而已也天之生人已均善而無惡矣况為國生賢則又有不同也觀以下諸章所述可見昔孔子讀詩至此而贊之曰為此詩者其知道乎故有物必有則民之秉彛也故好是懿德輯録蔡覺軒曰天命所賦謂之則人性所禀謂之彛存於心而有所得者謂之德其實一而已矣孔子又加一必字於有則之上加一故字於好是之上其㫖愈明矣而孟子引之以證性善之說其指深矣讀者其致思焉可見吉甫深知情性之德而能言之也仲山甫之德柔嘉維則令儀令色小心翼翼古訓是式威儀是力天子是若明命使賦叶韻若賦未詳賦也嘉美令善也儀威儀也色顔色也翼翼恭敬貌古訓先王之遺典也式法力勉若順賦布也東萊吕氏曰柔嘉維則不過其則也過其則斯為弱不得謂之柔嘉矣令儀令色小心翼翼言其表裏柔嘉也古訓是式威儀是力言其學問進修也天子是若明命使賦言其發而措之事業也此章蓋備舉仲山甫之德輔氏曰柔嘉即所謂柔善過其則則入於惡矣令儀令色柔嘉之發於外也小心翼翼柔嘉之存於中也古訓是式學問之不忘也威儀是力進修之不怠也其措之事業則上以承順乎天子下以宣布於諸侯是皆柔嘉之德為之也愚謂表裏柔嘉其德美矣而又加學力以益致其美以此承順於君宜得人君之任使也輯録解頥曰令儀令色以下四者體之所以立也天子是若明命使賦則用之所以行也惟其為用之所以行所以亦可謂之德也王命仲山甫式是百辟音壁無韻未詳纘戎祖考王躬是保出納王命王之喉舌賦政于外四方爰發叶方月反賦也式法戎女也王躬是保所謂保其身體者也出記保傅篇保安守也然則仲山甫蓋以冡宰兼大保而大保抑其世官也與出承而布之也納行而復之也承命而逹之於下行事而復之於君喉舌所以出言也發發而應之也出納王命而為王之喉舌賦政於外而使四方應之皆天子期之之意也東萊吕氏曰仲山甫之職外則總領諸侯內則輔養君德入則典司政本出則經營四方此章蓋備舉仲山甫之職式百辟保王躬必盛德而後能出納王命而賦其政則非剸煩治劇之才不可當此任也是故朝廷衆職不以分命於羣臣而以專命於山甫則其才全德備可見矣肅肅王命仲山甫將之邦國若否音鄙仲山甫明叶謨郎反之既明且哲以保其身夙夜匪解佳賣反以事一人賦也肅肅嚴也將奉行也奉行即上章承而布之之謂若順也順否猶臧否也邦國諸侯之國也知其善而益以王命奬勸之知其不善而必申王命以戒飭之同此王命而施之下國各審其所宜所謂明若否也明謂明於理哲謂察於事明於理者其心於理無所蔽察於事則又隨事究其纎悉而表裏皆無毫髮之或遺矣保身蓋順理以守身非趍利避害而偷以全軀之謂也盡臣道臻治功則享安榮以終其身矣輯録朱子曰只是上文四句所云便是明哲所謂明哲者只是曉天下事理順理而行自然灾害不及其身可以保其祿位然明哲保身亦只是常法若到那舍生取義處又不如此論解怠也一人天子也上承王命而又下察風化之殊必委曲以從俗也外悉治道而又力察理勢之宜必純全以處己也自重遺體而又知委身事君之義必勤勞以盡職也蓋謹於將命者或不宜於下國詳於賦政者或反忽於吾身一意守身者又或不知盡力於王事也惟山甫曲全之蓋前章王所以命山甫者不一而足此章山甫所以盡臣道者亦不一而足也故其相屬如此人亦有言柔則茹忍與反之剛則吐之維仲山甫柔亦不茹剛亦不吐不侮矜古頑反寡叶果五反不畏彊禦賦也人亦有言世俗之言也茹納也易處之事不敢忽難處之事無或憚是不茹柔吐剛者也不茹柔故不侮矜寡不吐剛故不畏強禦不茹不吐總以處事言不侮不畏專以待人言茹柔吐剛斯為柔惡不茹柔不吐剛則其德中正不因物而有偏宜無陵弱畏強之事矣常人徇勢以立言賢者循理以行事故用此美之以發柔嘉之義也以此觀之則仲山甫之柔嘉非軟美之謂而其保身未嘗枉道以徇人可知矣和而不流即柔嘉之德正而有守即保身之道人亦有言德輶羊久反如毛民鮮息淺反克舉之我儀圖叶丁五反之維仲山甫舉之愛莫助叶牀五反之衮職有闕維仲山甫補之賦也輶輕劉氏曰駟驖曰輶車者亦取其馳逐之輕故輶有輕之義儀度徒洛反圖謀也衮職王職也天子龍衮不敢斥言王闕故曰衮職有闕也言人皆言德甚輕而易以䜴反舉然人莫能舉也舉者以身體之也舉其德者似易而實難有是德而不能體之於已則物自物而則自則矣我於是謀度其能舉之者則惟仲山甫而已是以心誠愛之而恨其不能有以助之蓋愛之者秉彛好德之性也而不能助者能舉與否在彼而已固無待於人之助而亦非人之所能助也輔氏曰德者人之所固有自一身言之隨用而足舉之甚易但人為氣稟所昏物欲所纍非知至意誠者莫能舉也愚謂自本然之理言之則人情莫不好此懿德自氣質之稟言之則有能舉不能舉之異觀令儀令色以下數語則山甫之能舉其德可見矣至於王職有闕失亦維仲山甫獨能補之蓋惟大人然後能格正也君心之非未有不能自舉其德而能補君之闕者也輔氏曰舉在我之德補在君之闕非強力者不能至是而山甫之德又不可獨以柔稱矣愚謂舉德所以申二章之意補闕所以申三章四章之意德業俱盛此章備焉仲山甫出祖四牡業業征夫捷捷在接反每懷靡及叶極㭍反四牡彭彭叶鋪郎反八鸞鏘鏘七羊反王命仲山甫城彼東方賦也祖行祭也曹氏曰顔師古云祖者送行之祭因享飲焉昔黃帝之子纍祖好逺逰而死於道故後人祭之以為行神其祭設軷於門外是出門而後祖祭故云出祖也業業健貌捷捷疾貌出祖之時車馬僕從備矣而山甫有汲汲事君之心若不可以逺行也東方齊也車馬既戒行矣以王命城齊則不可留矣傳曰古者諸侯之居逼隘則王者遷其邑而定其居蓋去薄姑而遷於臨菑也孔氏曰史記齊獻公元年徙薄姑都治臨菑輯録羅氏曰齊世家太公封營丘至五世胡公徙都滹姑子獻公徙治臨菑正義薄姑在青州博昌縣東北六十里營丘臨菑見齊風計獻公當夷王之時與此傳不合豈徙於夷王之時至是而始備其城郭之守歟增釋許氏曰三言四牲者先四句惟言車馬征夫之盛而未行次四句言彭彭鏘鏘則往於齊也下四句則道其歸時之盛也四牡騤騤求龜反八鸞喈喈音皆叶居奚反仲山甫徂齊式遄其歸吉甫作誦穆如清風叶孚愔反仲山甫永懷以慰其心賦也式遄其歸不欲其久於外也車馬既啓行矣無他告焉式遄其歸而已遄其歸則庶有以寬其靡及之心也穆深長也清風清微之風化養萬物者也以其逺行而有所懷思與每懷靡及相應故以此詩慰其心焉曽氏曰賦政于外雖仲山甫之職然保王躬補王闕尤其所急城彼東方其心永懷蓋有所不安者尹吉甫深知之作誦而告以遄歸所以安其心也此二章言山甫如齊而已所以作詩之故蒸民八章章八句一章二章言天生山甫而山甫能全其德三章四章言王命山甫而山甫能盡其職五章言其能全此德以待物六章言其能全此德以事君七章八章則言其逺行而有靡及永懷之心是故作詩以慰之也申伯仲山甫皆宣王之賢臣也嶽降神天監周其生稟也同柔惠且直柔嘉維則其有德也又同文武是憲式是百辟其為人所取法也又同然學問進修保王躬補王闕道全而德備任大而責重無或少歉則尤見山甫之為賢尚論二臣者所當知也增釋許氏曰蒸民之詩反覆讃詠雖兼職業事功言之大率主於德爾八章之間凡言仲山甫者十有二於以見惓惓尊慕之意蓋詩人之情與作詩之體於所愛者則喜其名而道之故出車之於南仲采芑之於方叔六月之於吉甫江漢之於召公嵩髙之於申伯韓奕之於韓侯皆屢言之然則尹吉甫可謂知德而善言德行者歟此宣王之所以中興者得賢才之多也奕奕梁山維禹甸之有倬其道下與考叶韓侯受命王親命之纘戎祖考上與道叶無廢朕命夙夜匪解音懈叶訖力反䖍共爾位朕命不易幹古旦反不庭方以佐戎辟音璧賦也奕奕大也梁山韓之鎮也今在同州韓城縣輯録今𨽻陜西西安府甸治也倬明貌韓國名侯爵武王之後也受命蓋即位除喪以士服入見天子而聽命也未受封爵故以士服見纘繼戎汝也言王錫命之使繼世而為諸侯也䖍敬易改幹正也輯録箋作楨幹而正之也不庭方不來庭之國辟君也此又戒之以修其職業之詞也韓侯初立來朝輯録將言韓侯而先言其國有髙大之梁山禹嘗治之其下有倬然之道此韓侯之所從以朝周也始受王命而歸詩人作此以送之序亦以為尹吉甫作今未有據下篇云召穆公凡伯者放此自無廢朕命以下皆述王戒之之詞四牡奕奕孔修且張韓侯入覲以其介圭入覲于王王錫韓侯淑旗綏章簟茀錯衡叶户郎反𤣥衮赤舄鉤膺鏤音漏錫音羊鞹苦郭反鞃苦𢎞反淺幭莫歷反鞗音條革金厄叶於栗反賦也修長張大也介圭封圭封大也執之為贄以合瑞于王也瑞玉也諸侯執圭朝天子執瑁冒之瑁與圭合則無僞淑善也交龍曰旗輯録善猶美也箋云善旗旗之善色者也綏音緌章染鳥羽或旄牛尾為之注於旗竿之首為表章者也韓為侯爵不當服衮但孔氏疏無衣引周禮巾車注謂王子母弟出對者雖為侯伯而車服皆如上公以九為節也然又為特止於其身後世子孫則各服其服是則不可曉者豈周禮至此已變其舊而然歟鏤刻金也馬眉上飾曰錫今當盧也輯録疏當盧者當馬之額盧在眉眼之上按巾車玉路錫樊纓金路鉤樊纓注云金路無錫有鉤此言鉤膺必金路矣而得有鏤錫者蓋特賜之鉤膺見小雅采芑鞹去毛之革也鞃式中也謂兩較之間橫木可慿者較音角見衛淇澳注以鞹持之使牢固也淺虎皮也幭覆去聲式也字一作幦又作幎以有毛之皮覆式上也輯録疏幭幦幎字異而義同玉藻云有羔幦鹿幦春官巾車犬幎皆以有毛之皮為幦幦是蓋覆之名覆在式上也鞗革轡首也金厄以金為環纒扼厄同轡首也此章言其來朝而得車服之盛如此韓侯出祖出宿于屠顯父音甫餞之清酒百壺其殽維何炮白交反鱉鮮魚其䔩音速維何維筍恤尹反及蒲其贈維何乘繩證反馬路車籩豆有且子余反侯氏燕胥賦也既覲而反國必祖者尊其所往去則如始行焉行而祖禮也歸而亦祖則尊其往而盛其禮矣屠地名或曰即杜也顯父周之卿士也䔩菜殽也筍竹萌也蒲蒲蒻也蒲之蒻在泥中白如匕柄甘脆可食輯録輔氏曰酒之多及衆也殽之薄示儉也贈之厚示恩也且多貌侯氏覲禮諸侯來朝者之稱覲禮每以侯氏稱諸侯之來朝者注云不言諸侯言侯氏者明國殊舍異禮不凡之也胥相也或曰語辭此章備言祖送之禮蓋以天子之命而餞之也韓侯取七住反妻汾符云反王之甥蹶俱衛反父音甫之子叶奬里反韓侯迎魚覲反止于蹶之里百兩音亮又如字彭彭叶鋪郎反八鸞鏘鏘不顯其光諸娣大計反從之祁祁巨移反如雲韓侯顧之爛其盈門賦也此言韓侯既覲而還遂以親迎也汾王厲王也厲王流于彘在汾水之上故時人以目王焉猶言莒郊公黎比音毗公也郊比皆地名莒小而處夷黎亦小國無諡以地為稱號而已蹶父周之卿士姞姓也諸娣諸侯一娶九女二國媵之皆有娣姪也輯録公羊傳諸侯娶一國則二國往媵之以娣姪從又嫡妻有娣有姪同姓二國往媵亦有娣有姪則九女也祁祁徐靚也輯録劉氏曰徐言其行動靚言其容飾如雲衆多也此章極稱韓姞族類之貴與其從媵之盛也蹶父孔武靡國不到為于僞反韓姞其一反相息亮反攸莫如韓樂音洛叶力告反孔樂韓土川澤訏訏况甫反魴鱮甫甫麀鹿噳噳愚甫反有熊有羆有猫苗茅二音有虎慶既令居叶斤御斤於二反韓姞燕譽叶羊茹羊諸二反賦也韓姞蹶父之子韓侯妻也相攸擇可嫁之所也訏訏甫甫大也噳噳衆也猫似虎而淺毛慶喜令善也喜其有此善居也燕安譽樂也此則極稱其山川地利之廣饒夫婦室家之和好也故又以相攸之善歸之蹶父焉恩輯録謝氏曰韓侯之宜室家皆宣王信任寵祿之也詩人之意欲臣子知其所自無忘上恩竭智盡忠以報國也輔氏曰上章言韓侯之迎韓姞有以當其心此章言韓姞之歸韓國有以適其意男女相稱夫婦咸和則家道正矣家齊而國治此固天子之所喜而王朝之臣所贊詠也溥彼韓城燕因肩反師所完以先祖受命因時百蠻王錫韓侯其追其貊母伯反奄受北國因以其伯實墉實壑實畝實籍獻其貔音毗皮赤豹黃羆賦也溥大也燕召公之國也師衆也追貊夷狄之國也墉城壑池籍稅也貔猛獸名輯録疏云貔言皮則豹羆亦獻皮也韓初封時召公為司空王命以其衆為築此城此召公指康公言王命者先王命之也如召伯營謝山甫城齊春秋諸侯城邢城楚丘之類也此類皆非自築其城也王以韓侯之先因是百蠻而長上聲之故錫之追貊使為之伯此王字則指宣王言蓋向者先王以百蠻不可無長因封韓侯之祖為之長今宣王又錫以追貊而使韓侯悉長之則國益以大矣以修其城池治其田畝正其稅法而貢其所有於王也輯録解頥曰修城池治田畝正稅法貢土物皆修其職業之謂以終首革之意也韓奕六章章十二句一章來朝而受天子之命二章既朝而得天子之賜三章祖送而歸四章五章親迎以歸六章則因前人之封建增今日之土宇而使修國中之職貢也江漢浮浮武夫滔滔叶他侯反匪安匪遊淮夷來求既出我車既設我旟匪安匪舒淮夷來鋪賦也浮浮水盛貌滔滔順流貌輯録蘇氏曰自周而南出於江漢之間召公率兵循江而下也淮夷夷之在淮上者也輯録陳氏曰淮夷之地不一徐州有夷則在淮北者也揚州有夷則在淮南者也江漢常武二篇同言淮夷以地理考之曰江漢之滸者是淮南之夷也若在淮北則江漢非所由入之路也曰率彼淮浦省此徐土者是淮北之夷也若在淮南則徐土非聨接之地矣鋪陳也陳師以伐之也宣王命召穆公平淮南之夷詩人美之此章總序其事言行者皆莫敢安徐而曰吾之來也惟淮夷是來是伐耳輔氏曰軍行如此其氣鋭其志專有所不戰戰必勝矣故次章即言成功江漢湯湯書羊反武夫洸洸音光經營四方告成于王四方既平王國庶定叶唐丁反時靡有爭叶災陘反王心載寧賦也洸洸武貌庶幸也此章言既伐而成功也淮南者四方之一也一隅有警天下不定故征伐淮南所以經營四方也既告成功則王國可定而王心可寧矣宜其急於告成也下四句言告成之故江漢之滸音虎王命召虎式辟音闢四方徹我疆土匪疚匪棘王國來極于疆于理至于南海叶虎委反賦也虎召穆公名也辟與闢同徹井其田也疚病棘急也極中之表也居中而為四方所取正也言江漢既平王又命召公輯録陳氏曰非謂宣王臨江漢之滸而命召虎也闢四方之侵地而治其疆界非以病之非以急之也但使其來取正於王國而已以上四句述王命之之詞輯録嚴氏曰此章言徹法之事然武事僅定即行疆理稅賦之法疑於病民且疑於急迫矣宣王謂我非疚也非棘也蓋什一天下之中正乃我周之定制欲天下皆於王國來取正焉耳於是遂疆理之盡南海而止也四方亦指此一隅而言耳疆理至於南海亦辟四方之一也淮夷背叛外蠻隨之既伐淮夷則疆理之功不得不然矣此章因其成功益使廣之召虎果能承命而擴充之也蓋至此而奉辭致伐之事畢矣增釋許氏曰此詩三言四方皆指淮夷左右而言非天下之四方也此章言江漢之滸王命召虎而曰式辟四方辭㫖皆可見也曰疆曰理至于南海亦溢美之辭爾王命召虎來旬來宣文武受命召公維翰叶胡于反無曰豫小子叶奬里反召公是似叶養里反肇敏戎公用錫爾祉賦也旬遍宣布也自江漢之滸言之故曰來召公召康公奭也翰幹也豫小子王自稱也肇開戎汝公功也又言王命召虎來此江漢之滸遍治其事以布王命此章再為更端之詞故集傳下一又字而曰昔文武受命惟召公為楨幹今女無曰以豫小子之故也但自為嗣女召公之事耳康公宣布政教在江漢之間今召虎征淮南繼乃祖之業耳故勉之如此使視王事如家事以賦政之勞為述事之孝也能開敏女功發舒展布而力致其功則我當錫女以祉福如下章所云也既陳忠孝之道以勸勉之復明報施之道以歆動之釐力之反爾圭瓉才旱反秬音巨鬯初亮反一卣音酉無韻未詳告于文人錫山土田叶地因反于周受命叶滿井反下同自召祖命虎拜稽首天子萬年叶彌因反賦也釐賜卣尊也輯録羅氏曰爾雅彛卣罍注尊彛為上罍為下卣居中孔氏曰釋器云卣中尊按欎人掌和欎鬯以實彛而陳之則鬯當在彛而此及尚書左傳皆云秬鬯一卣者當祭之時乃在彛未祭則在卣賜時未祭故卣盛之文人先祖之有文德者謂文王也周岐周也召祖穆公之祖康公也此序王賜召公䇿命之詞言錫爾圭瓉秬鬯者使之以祀其先祖周禮小宗伯注天子圭瓉諸侯璋瓉故上公未賜圭瓉則璋瓉而已又告于文人而錫之山川土田以廣其封邑蓋古者爵人必於祖廟示不敢專也輯録祭統曰古者明君爵有德而祿有功必賜爵祿於大廟又使往受命於岐周從其祖康公受命於文王之所以寵異之而召公拜稽首以受王命之䇿書也人臣受恩無可以報謝者但言使君夀考而已既以慶賞之榮及乎爾之祖又以錫命之意告於我之祖又使爾受命之寵得以比擬於爾之先祖賚豫之意不一而足如此宜有天子萬年之祝也前以康公之佐文武者勉其功此以文王之命康公者行其賞以上三章皆述䇿命之詞此又以祝頌之語結之也但三章告命在既克淮南之日四章告命又在始遣將帥之時此章告命則在疆理南海之餘振旅凱還之後也蓋以此章正發用錫爾祉一句又欲以起下章報稱之詞故其次第相承如此虎拜稽首對揚王休叶虛久反作召公考叶去久反天子萬夀叶殖酉反明明天子叶奬里反令聞音問不已矢其文德洽此四國叶越逼反賦也對答揚稱休美考成矢陳也言穆公既受賜遂答稱天子之美命作康公之廟器而勒王䇿命之詞以考其成成成功也昭錫命則見成功矣故曰以考其成蓋接上兩章召公召祖之榮而以此結之也至此而穆公拜賜於宣王真如康公拜賜於文王矣且祝天子以萬夀也刻其䇿命之詞及此祝頌之語蓋上章天子萬年稱諸口而已此章天子萬夀則刻諸䇿命之下也古器物銘云􅌏音辨拜稽首敢對揚天子休命用作朕皇考龔音恭伯尊敦音對􅌏其眉夀萬年無疆􅌏周大夫名龔伯者其父也尊酒器敦盛黍稷器也語正相類但彼自祝其夀而此祝君夀耳祝頌之語刻之廟器此其例也既又美其君之令聞而進之以不已勸其君以文德而不欲其極意於武功古人愛君之心於此可見矣此承上章之意蓋稽首而不足又昭錫命著成功以答稱之答稱而不足又以萬夀祝頌之祝頌而不足又美其中興之譽而益進之又思安集懷來之道而更以文德勸勉之由上章賚豫之意不一而足故此章報謝之意亦不一而足也江漢六章章八句一章致伐二章成功三章復承告命而大其功四章告命出師五章告命行賞六章下報上蓋三章以前既原始要終言之矣四章以後又原始要終而重言之也赫赫明明王命卿士叶音所南仲大音泰下同祖大師皇父音甫整我六師以修我戎叶音汝既敬既戒叶乞力反惠此南國叶越逼反賦也卿士即皇父之官也南仲見出車篇大祖始祖也大師皇父之兼官也輯録陳氏曰自冡宰而下謂之六卿大師而下謂之三公既曰王命卿士又曰大師皇父周家不特設三公皆兼職而已如周公以冡宰兼大師也我為宣王之自我也戎兵器也宣王自將以伐淮北之夷而命卿士之謂南仲為大祖兼大師而字皇父者整治其從行之六軍修其戎事以除淮夷之亂而惠此南方之國詩人作此以美之必言南仲大祖者稱其世功以美大之也敬戒即孔子臨事而懼之意戎事飭矣而少慢焉則取敗之道也故命之如此王謂尹氏命程伯休父左右陳行户郎反戒我師旅率彼淮浦省此徐土不留不處三事就緒象吕反賦也尹氏吉甫也蓋為內史掌䇿命卿大夫也程伯休父周大夫輯録程國伯爵休父字也重黎之後濮氏曰程畿內邑在豐三事未詳或曰三農之事也三農上中下農夫也緒業也戒勿久留其地以廢農功輯録疏大宰九職一曰三農生九榖注云三農原隰及平地言王詔尹氏䇿命程伯休父為司馬使之左右陳其行列循淮浦而省徐州之土蓋伐淮北徐州之夷也上章既命皇父而此章又命程伯休父者蓋王親命大師以三公治其軍事而使內史命司馬以六卿副之耳皇父為大將程伯休父副之上言既敬既戒此言不留不處蓋將驕則慢敵師久則病農其取敗之道均也以上二章為命將之時赫赫業業叶宜却反有嚴天子王舒保作匪紹匪遊徐方繹騷叶蘇侯反震驚徐方如雷如霆徐方震驚賦也赫赫顯也業業大也嚴威也天子自將其威可畏也王舒保作未詳其義或曰舒徐保安傳云作行也箋云言王師舒徐而安行也紹糾緊也遊遨遊也繹連絡也騷擾動也夷厲以來周室衰弱至是而天子自將以征不庭其師始出不疾不徐而徐方之人皆已震動如雷霆作於其上不遑安矣師行有度彼已繹騷而不寧蓋赫業有嚴之先聲有以震驚之是以彼之震驚自爾也天子之威聞之而可畏者如此此起兵在道之時也王奮厥武如震如怒叶暖五反進厥虎臣闞呼檻反如虓火交反虎鋪普吳反敦淮濆符云反仍執醜虜截彼淮浦王師之所賦也進鼓而進之也闞奮怒之貌虓虎之自怒也輯録埤雅曰言將帥之勇發於忠義非激而怒之也鋪布也布其師旅也敦厚也厚集其陳也仍就也老子曰攘臂而仍之出論德篇截截然不可犯之貌截然以兵勢言謂王師所在其威可畏也此陳兵徐土之時王旅嘽嘽吐丹反如飛如翰如江如漢如山之苞叶鋪鉤反如川之流綿綿翼翼不測不克濯征徐國叶越逼反賦也嘽嘽衆盛貌翰羽苞本也如飛如翰疾也如江如漢衆也如山不可動也如川不可禦也靜則不可驚動則不可禦綿綿不可絶也翼翼不可亂也不測不可知也不克不可勝也濯大也師徒衆盛而律又嚴所以奮揚威武而大伐之也此用兵之時也淮南易伐淮北難平故彼以召虎將兵來求來鋪而遂克之此必天子親征而又大用其師如此然後能取勝也王猶允塞徐方既來叶六直反徐方既同天子之功四方既平徐方來庭徐方不回王曰還歸叶古回反賦也猶道允信塞實庭朝回違也還歸班師而歸也前篇召公帥師以出歸告成功故備載其褒賞之詞此篇王實親行故於卒章反復其詞以歸功於天子言王道甚大而逺方懷之非獨兵威然也序所謂因以為戒者是也此凱還之時也輯録解頥曰首章言敬戒以見軍律之嚴卒章言允塞以見王道之大軍律之嚴所以戰而必勝王道之大所以不戰而自服也始而來來而同人以為天子之功也而不知宣王初未嘗以兵力服之也終而曰不回則王道之大信有以服其心矣於是班師振旅而歸因以戒其武功之不可黷而勉其文德之不可以不修也常武六章章八句中興之功非威武不能致宣王所以中興者此詩可見矣殷武之頌髙宗亦然父增釋許氏曰一章命皇父主兵二章命休為副三章言天子自將四章言戰伐五章言軍勢之盛卒章歸美於王瞻卬音仰昊天則不我惠孔填舊說古塵字不寧降此大厲邦靡有定士民其瘵側界反叶則例反蟊音牟賊蟊疾靡有夷届音戒叶居氣反罪罟不收靡有夷瘳敕留反賦也填久厲亂瘵病也蟊賊害苗之蟲也疾害蟊疾害苗之狀夷平届極罟網也此刺幽王嬖褒姒任奄人以致亂之詩輯録奄人注奄精氣閉藏者內門則用奄以守之又作閹首言昊天不惠而降亂無所歸咎之詞也蘇氏曰國有所定則民受其福無所定則受其病於是有小人為之蟊賊刑罪為之網罟凡此皆民之所以病也邦靡有定指國論與國政言國論不定故聽任得以偏用國政不定故刑罰得以偏用此章總言幽王造亂如此人有土田女音汝反有酉由二音之人有民人女覆奪徒活反之此宜無罪女反收殖酉殖由二反之彼宜有罪女覆說音脫之賦也反覆此言其威討削黜之不當收拘說赦也此言其出入生死之不當此章正責幽王刑罰之偏以發上章罪罟不收之意哲夫成城哲婦傾城懿厥哲婦為梟古堯反為鴟處之反婦有長舌維厲之階叶居奚反亂匪降自天叶鐵月反生自婦人匪教匪誨叶呼奚反時維婦寺賦也哲知也城猶國也哲婦蓋指褒姒也傾覆懿美也梟鴟惡聲之鳥也長舌能多言者也階梯也寺奄人也言男子正位乎外為國家之主故有知則能立國婦人以無非無儀為善無所事哲哲則適以覆國而已故此懿美之哲婦而反為梟鴟蓋以其多言而能為禍亂之梯也若是則亂豈直自天降如首章之說哉特由此婦人而已蓋其言雖多而非有教誨之益者是惟婦人與奄人耳豈可近哉上文但言婦人之禍末句兼以奄人為言蓋二者常相倚而為奸不可不并以為賊也歐陽公常言宦者之禍甚於女寵其言尤為深切有國家者可不戒哉此與十二章正責幽王聽任之偏以發首章蟊賊蟊疾之意輯録歐陽氏曰女色而已宦者之害非一端也女色之惑不幸而不悟則禍斯及矣使其一悟捽而去之可也宦者之為禍雖欲悔悟而勢有不得而去也唐昭宗之事是矣孔氏曰奄人防守門閣親近人主庸君以其少小貫習朝夕給使顧訪無猜憚之心恩狎有可恱之色且其人久處宫掖頗曉舊章探知主意或乃色和貌厚挾術懷奸或乃捷對敏才飾巧亂實遂能迷罔視聽愚主信而任之國之滅亡多由此作鞫人忮之䜴反忒譛子念反始竟背音佩叶必墨反豈曰不極伊胡為慝如賈音古三倍君子是識婦無公事休其蠶織賦也鞫窮忮害忒變也譛不信也竟終背反極已慝惡也賈居貨者也三倍獲利之多也公事朝廷之事蠶織婦人之業言婦寺能以其智辨窮人之言輯録輔氏曰智則哲也辨則長舌也其心忮害而變詐無常輯録胡庭芳曰此章極言婦寺之惡也鞫如鞫獄之鞫推勘窮究之意婦寺所以鞫人者其心忮害變忒而已既以譛妄倡始於前而終或不驗於後則亦不復去聲自謂其言之放恣無所極已而反曰是何足為慝乎巧言如簧顔之厚矣此忮忒之常態也夫商賈之利非君子之所宜識如朝廷之事非婦人之所宜與去聲也今賈三倍而君子識其所以然婦人無朝廷之事而舍上聲其蠶織以圖之則豈不為慝哉君子喻利則害於義婦人謀政則害於治天何以刺叶音砌何神不富叶方味反舍音捨爾介狄維豫胥忌不弔不祥威儀不類人之云亡邦國殄瘁賦也刺責介大胥相弔閔也言天何用責王神何用不富王哉用以也天何為而以禍亂責王乎神何為而不以盛大之業富王乎若問詞也凡以王信用婦人之故也是必將有夷狄之大患今王舍之不忌而反以我之正言不諱為忌何哉夫天之降不祥庶幾王懼而自修今王遇灾而不恤又不謹其威儀又無善人以輔之則國之殄瘁宜矣以其嬖惑之深也故不憂將然之狄患而反忌乎正言不恤已然之天禍而且喪威儀賊良善顛倒錯亂如此宜乎天譴神怒而致邦國之殄瘁也上二章言婦寺不可聼任此章極言聽任婦人之言以重結蟊賊蟊疾之意或曰介狄即指婦寺猶所謂女戎者也國語晉獻公與驪戎戰勝獲驪姬以為夫人史蘇曰有男戎必有女戎晉以男戎勝戎戎必以女戎勝晉注云戎兵也言其禍猶兵也天之降罔維其優矣人之云亡心之憂矣天之降罔維其幾矣人之云亡心之悲矣賦也罔罟優多幾近也近者近於極也蓋承上章之意而重言之以警王也憂悲之心邦國殄瘁故也蓋承上章章末兩句而言又以重結罪罟不收之意觱音必沸音弗檻胡監反泉維其深矣心之憂矣寧自今矣不自我先不自我後叶下五反藐藐昊天無不克鞏叶音古無忝皇祖式救爾後同上興也觱沸泉涌貌檻泉泉正出者藐藐髙逺貌鞏固也言泉之瀵涌上出其源深矣我心之憂亦非適今日然也此為事物有所從來之意蓋以源泉之深興憂心之久也然而禍亂之極適當此時蓋已無可為者惟天髙逺雖若無意於物然其功用神明不測雖危亂之極亦無不能鞏固之者幽王苟能改過自新而不忝其祖則天意可回來者猶必可救而子孫亦蒙其福矣亂已如此而猶欲其改過遷善以圖福是則詩人之忠厚也瞻卬七章三章章十句四章章八句旻天疾威天篤降喪息浪反叶桑郎反癲都田反我饑饉民卒流亡我居圉魚吕反卒荒賦也篤厚癲病卒盡也居國中也圉邉陲也輯録荒虛也此刺幽王任用小人以致饑饉侵削之詩也此章言天禍國家使內外困窮如此輯録通釋曰此詩刺王而首言旻天疾威又言天篤降喪下章又言天降罪罟者固為無所歸咎之詞矣而首章則言饑饉之灾卒章則言侵削之事餘章則皆言用小人之意也天降罪罟蟊賊內訌户工反昏椓卜角反靡共音恭潰潰回遹實靖夷我邦叶卜工反賦也訌潰也昏椓昏亂椓喪之人也輯録胡庭芳曰指昏椓為言并閹宦在其中矣共與恭同一說與供同謂共其職也潰潰亂也回遹邪僻也靖治夷平也言此蟊賊昏椓者皆潰亂邪僻之人而王乃使之治平我邦所以致亂也此章推言致亂之由臯臯訿訿音紫曽不知其玷丁險反兢兢業業孔填已見上篇不寧我位孔貶賦也臯臯頑慢之意輯録頑不知道慢不共職訿訿務為謗毁也玷缺也缺失也填久也言小人在位所為如此而王不知其缺至於戒敬恐懼甚久而不寧者其位乃更見貶黜其顛倒錯亂之甚如此此章言其舉枉錯直亦推言致亂之由也如彼嵗旱草不潰集注作遂茂如彼棲音西苴七如反我相息亮反此邦無不潰止叶韻未詳賦也潰遂也棲苴水中浮草棲於木上者輯録苴釋文士加反與楂同言枯槁無潤澤也相視潰亂也此章兩設譬喻而言國家憔悴壞亂如此以申首章之意輯録嚴氏曰谷風有洸有潰潰怒也小旻是用不潰于成召旻草不潰茂潰遂也潰潰回遹無不潰止潰亂也項氏云水之潰者其勢橫暴而四出故怒之甚者為潰怒遂之甚者為潰遂亂之甚者為潰亂皆一理也維昔之富不如時維今之疚不如兹彼疏斯稗薄賣反胡不自替職兄音况下同斯引叶韻未詳賦也時是疚病也疏糲音梓也稗則精矣疏米一斗可得稗米九升替廢也兄恍同引長也言昔之富未嘗若是之疚也而今之疚又未有若此之甚也彼小人之與君子如疏與稗其分審矣而曷不自替以避君子乎而使我心專為此故至於愴恍引長而不能自己也二章三章刺王任用小人此章則刺小人知進而不知退如此池之竭矣不云自頻泉之竭矣不云自中叶諸仍反漙斯害矣職兄斯𢎞不烖我躬叶姑𢎞反比也諸本作賦也誤頻崖輯録箋崖猶外也漙廣𢎞大也池水之鍾也泉水之發也故池之竭由外之不入泉之竭由內之不出言禍亂有所從起而今不云然也用小人者禍亂之本輯録朱子曰看詩不須著意去訓解只平平地涵泳自好因舉池之竭矣四句吟咏久之此其為害亦已廣矣是使我心專為此故至於愴恍日益𢎞大而憂之上言其憂不替此言其憂益甚曰是豈不烖及我躬也乎小人致亂而乃相與容隱之則君子必將蒙禍矣此章又推禍亂之由起而憂禍患之將及也昔先王受命有如召公日辟音闢國百里今也日蹙子六反國百里於音烏乎音呼哀哉維今之人不尚有舊叶臣已反賦也先王文王也召公康公也辟開蹙促也文王之世周公治內召公治外故周人之詩謂之周南諸侯之詩謂之召南所謂日辟國百里云者言文王之化自北而南至於江漢之間服從之國日以益衆及虞芮質成而其旁諸侯聞之相帥歸周者四十餘國焉召公宣布德化其流行之速自然非以力強取之也今謂幽王之時促國蓋犬戎內侵諸侯外畔也小人之賈禍如此又歎息哀痛而言今世雖亂豈不猶有舊德可用之人哉言有之而不用耳此章思昔者之用賢而歎今者之棄賢也前篇欲其改過遷善則亂猶或可已也此則王之惡終不肯改國之亂終不可救末如之何傷今思古而已矣召旻七章四章章五句三章章七句輯録許氏曰一章訴亂二章用羣小致亂三章小人排黜君子四章淍瘵無生意五章歎小人不知退六章慮害及已卒章有舊德不能用因其首章稱旻天卒章稱召公故謂之召旻以别小旻也輯録陳君舉曰周南係於周公召南係於召公豈非化之盛者必有待乎二公也至於風之終係以邠雅之終係以召旻豈非化之衰者必有思乎二公也通釋曰此詩之次居變雅之終而第七章又居此詩之終慨然有懷文武召公之盛以見亂極思治之理其亦猶下泉之終變風歟解頥曰厲王無道而宣王中興以宣王之有志也幽王無道而平王不復中興以平王之無志也噫此雅之所以亡而黍離之所以降為國風也蕩之什十一篇九十二章七百六十九句
