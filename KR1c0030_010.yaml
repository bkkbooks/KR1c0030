body:
  text: 詩經疏義㑹通卷八元朱公遷撰豳一之十五豳國名在禹貢雍去聲州岐山之北原隰之野虞夏之際棄為后稷而封于邰音台及夏之衰棄稷不務言棄去后稷之事而不以蒍務也棄子不窋迍入聲失其官守而自竄于戎狄之間輯録謂之尉季慶州安縣有尉季城亦謂之不窋城孔疏云韋昭以為不窋當太康之時不窋生鞠陶鞠陶生公劉能復扶又反修后稷之業民以富實乃相去聲土地之宜而立國于豳之谷焉十世而大音泰王徙居岐山之陽自公劉至大王凡十世此用史記之說也世本謂后稷至古公二十餘世與此不同或云當從世本輯録金氏曰路史謂稷生斄繭斄繭生叔均自后稷至公劉十餘世按世本自公劉歷慶節皇僕差弗僞榆公非辟方髙圉侯牟亞圉雲都太公組紺諸盩十有二世而生古公亶父史記以不窋為后稷子而又缺辟方侯牟雲都諸盩四世遂謂后稷至文王為十五世許氏曰稷契同時受封契至湯四百餘年而十四世稷至文王十五世其亦誤矣十二世而文王始受天命十三世而武王遂為天子武王崩成王立年幼不能涖阼輯録鄭氏曰涖視也不能視阼階行人君之事周公旦以冡宰攝政乃述后稷公劉之化作詩一篇以戒成王謂之豳風豳不先二南尊文王也不繼二南豳先岐後也不與王風相屬興衰非其類也文王致治周公反正十五國風以是始終之則循環而為治世矣而後人又取周公所作及凡為去聲周公而作之詩以附焉周公之詩不入于雅風雅不同體也不入于魯周公未嘗治魯也不自為國王朝卿士不得専名一國也公之詩無所可係特以七月之故而為豳破斧以下又以公之故而為豳且公所食邑在豳岐之間豳者公之采邑也豳與二南相為始終則尊周公與文王等矣輯録通釋曰七月而後附以鴟梟東山者亦周公所作也附以伐柯破斧九罭狼跋者衆人為周公而作之詩也豳在今邠州三水縣輯録豳即今邠州豳之字為邠唐開元因改古文而改也邰在今京兆府武功縣輯録京兆府即今西安府並𨽻陜西七月流火叶虎委反九月授衣叶上聲一之日觱音必發叶方吠反二之日栗烈叶力制反無衣無褐音曷叶許例反何以卒歲或曰發烈褐皆如字而歲讀如雪三之日于耜叶羊里反四之日舉趾同我婦子叶奬里反饁炎輒反彼南畝叶蒲彼反田畯音俊至喜賦也七月斗建申之月夏之七月也後凡言月者放上聲此輯録通釋曰凡詩中月數皆以寅月起數不特此詩為然也流下也火大火心星也以六月之昏加于地之南方昏而火中堯典在仲夏月令在季夏豳公當夏時以歲差求之當在五六月之交此據月令為說舉大槩耳至七月之昏則下而西流矣天傾西北故自東而西則曰下而西流九月霜降始寒而𧖟績之功亦成故授人以衣使禦寒也授者家長以與家人也一之日謂斗建子一陽復之月二之日謂斗建丑二陽臨之月也變月言日言是月之日也後凡言日者放此月者是歲之月也日者是月之日也一之日二之日言一陽之月之日二陽之月之日也詩主詠歌故變換成文若直言十一月十二月則不成文理非詩矣故張子謂言月又言日别無義例只是順文輯録一之日至四之日皆以陽長而言之蓋周之先公已用此以紀候故周有天下遂為一代之正朔也豳雖小而立國皆有逺大之規證之大雅公劉可見况其地荒逺不能盡從中國其于月數民人或自以意便數之循用既久自成一代之制使商不建丑周亦必為天正矣觱發風寒也栗烈氣寒也褐毛布也輯録孔氏曰褐賤者所服今夷狄作褐皆織毛為之歲夏正之歲也于往也耜田器也輯録耜起土之器易曰斫木為耜揉木為耒蓋取諸益取上入下動之義于耜言往修田器也舉趾舉足而耕也我家長上聲自我也饁餉田也田畯田大夫勸農之官也周公以成王未知稼穯之艱難故陳后稷公劉風化之所由使瞽矇朝夕諷誦以教之輯録真氏曰周家以農事開國成王幼冲周公作詩使瞽矇歌之庶幾王知小民之依不敢荒寧蓋與無逸同一意也此章首言七月暑退將寒故九月而授衣以禦之蓋十一月以後風氣日寒不如是則無以卒歲也將寒之時無所備則既寒之日何所及乎是以豫為之計也正月則往修田器二月則舉趾而耕少者既皆出而在田故老者率婦子而餉之治田早而用力齊是以田畯至而喜之也輯録通釋曰治田早者二月而即舉趾也用力齊者少壯則在田家長婦子則致餉也勸農之道無非欲其不後于時不懈于力邠人乃不待勸而能然田畯所以喜也此章前段言衣之始後段言食之始輔氏曰無衣無褐見其慮事之豫于耜舉趾見其趨事之速同我婦子見其家人之心一田畯至喜見其上下之志通愚謂先時而有備及時而盡力豳人衣食之計蓋如此二章至五章終前段之意六章至八章終後段之意輯録解頥曰七月之詩以衣食為急而衣食所資以豫備為貴必以七月為首者三隂之月隂氣始盛故于是而豫為禦寒之備三陽之月陽氣始盛故于是而豫為治田之備先衣而後食故以七月為首也大寒之候在于丑月而圖之于建中之時收成之候在于酉月而慮之于建寅之日其為豫備可知若寒至而後索衣飢至而後索食則其為計亦晚矣增釋許氏曰凡事豫則立七月之詩豫而已矣有天下國家者豫其所當豫則無有不善矣詩中以日言者雖為建子之義其實主于陽而言然止于四之日者春日載陽春日遲遲即辰月也蠶事必在季春故也建巳為正陽之月不曰六之日而曰四月者蓋隂陽之生皆以漸夏至一隂生非生于夏至之日謂至夏至之日而成一隂也其始實自小滿之日六陽已極而微隂萌兆馴致而成故君子探其理于建已惟以月言之也七月流火九月授衣春日載陽有鳴倉庚叶古良反女執懿筐遵彼微行叶户郎反爰求柔桑春日遲遲采蘩祁祁巨之反女心傷悲殆及公子同歸賦也載始也陽溫和也倉庚黃鸝也懿深美也遵循也微行小徑也柔桑稚桑也遲遲日長而暄也蘩白蒿也所以生𧖟今人猶用之蓋𧖟生未齊未可食桑故以此啖音淡之也祁祁衆多也或曰徐也公子豳公之子也再言流火授衣者將言女功之始故又本于此遂言春日始和有鳴倉庚之時而𧖟始生則執深筐以求稚桑然又有生而未齊者則采蘩者衆而此治𧖟之女感時而傷悲蓋是時公子猶娶于國中而貴家大族連姻公室者亦無不力于𧖟桑之務故其許嫁之女預以將及公子同歸而逺去聲其父母為悲也輯録通釋曰同歸者同親迎之公子而歸以為離親之悲也其風俗之厚而上下之情交相忠愛如此上下忠愛以殆及公子同歸一句生義公子娶婦而有親迎之禮女家歸妹而無愆期之心所謂交相忠愛也後章凡言公子者放此張子曰此章次于耕者重昏嫁夲人情也輯録解頥曰趨事之勤秉心之厚此所以為豳俗也七月流火八月萑户官反葦韋鬼反𧖟月條他雕反桑取彼斧斨七羊反以伐逺揚猗於宜反彼女桑七月鳴鵙圭覔反八月載績載𤣥載黃我朱孔陽為公子裳賦也萑葦即蒹葭也𧖟月治𧖟之月王氏謂𧖟長非一月故不指言某月程子謂計歲氣之早晚不可指定幾月愚按二說皆當此正用其意而云然或引月令而専指為三月則拘矣條桑枝落之采其葉也斧隋音妥圜也銎音穹斧斤受柄處也輯録隋圜而長斨方銎逺揚逺枝揚起者也輯録孔疏皆手所不及者取葉存條曰猗女桑小桑也輯録小者曰女如小墻亦曰女墻小桑不可條取故取其葉而存其條猗猗然耳輯録蘇氏曰葉盡則條猗猗其長也鵙伯勞也伯勞以夏至鳴應隂氣之動七月三隂隂盛也故極鳴績緝也𤣥黑而有赤之色朱赤色陽明也言七月暑退將寒而是歲禦冬之備亦庶幾平聲其成矣又當預擬來歲治𧖟之用故于八月萑葦既成之際而收蓄之將以為曲薄曲薄所以棲蠶用萑葦為之至來歲治𧖟之月則采桑以供𧖟食而大小畢取見𧖟盛而人力至也𧖟事既備又于鳴鵙之後麻熟而可績之時則績其麻以為布輯録王氏曰𧖟生于陽氣之淑時故以倉庚為候麻成于隂德之慝時故以鵙為候而凡此𧖟績之所成者皆染之或𤣥或黃而其朱者尤為鮮明皆以供上而為公子之裳言勞于其事而不自愛以奉其上蓋至誠慘怛之意上以是施之下以是報之也此因在下者之情而上之所施者可見輯録通釋曰至誠慘怛之情一施一報即所謂交相忠愛者也以上上聲二章専言𧖟績之事以終首章前段無衣之意自首章至此皆以暑退將寒言之見寒之積有其漸也故以七月為始四月秀葽於遙反五月鳴蜩徒雕反八月其穫戶郭反十月隕干敏反蘀音託一之日于貉户各反取彼狐貍力之反為公子裘叶渠之反二之日其同載纘子管反武功言私其豵子公反獻豜古年反于公賦也不榮而實曰秀輯録爾雅云木謂之華草謂之榮不榮而實者謂之秀榮而不賔者謂之英葽草名逺志也鄭氏曰物生于陽而成于隂四月純陽而隂已胎葽感隂氣之早者也故物之成者自葽始蜩蟬也七月寒蟬鳴蟬隂類也故鳴始于五月張子曰秀葽者物成之初鳴蜩者歲秋之漸輯録王氏曰陽生則言日隂生則言月然四月正陽秀葽言月何也秀葽以言隂也四月隂生者氣之先至故也穫禾之早者可穫也正秋隂盛成物之時也隕墜蘀落也輯録說文草木皮葉落墮地為蘀黃氏曰落與隕字之義何别當采說文之意乾葉為蘀謂草木隕落也隂氣極殺氣盛貉狐貍也于貉猶言于耜謂往取狐貍也同竭作以狩也輯録地官小司徒云凡起徒役毋過家一人以其餘為羡唯田與追胥竭作注云惟田獵與逐捕冦盜則正卒羡卒盡行纘習而繼之也輯録繼纘武事年常習之使不忘戰也豵一歲豕豜三歲豕也言自四月純陽乾而歷一隂姤四隂觀以至純隂坤之月則大寒之候將至推隂氣之漸進如此雖𧖟桑之功無所不備猶恐其不足以禦寒故于貉而取狐貍之皮以為公子之裘也輯録真氏曰上言織薄于秋求桑于春躬𧖟織之勞以為衣者無所不至猶恐其未足也于貉為裘又有以相之獸之小者私之以為已有而大者則獻之于上亦愛其上之無已也此章専言狩獵以終首章前段無褐之意隂不起于隂而起于陽寒不根于寒而根于暑當純陽之月而純隂極寒已可逆推矣故此章以四月為始輯録通釋曰前兩章終無衣之意固有至誠慘怛忠愛其上之情而此章終無褐之意一則曰為公子裘二則曰獻豜于公亦如上章之意焉是則下之憂夫無衣無褐而欲為之備者皆汲汲邠公家人之身而不敢以已之溫暖為先非邠公有以施之安能使之若是哉五月斯螽音終動股六月莎素和反雞振羽七月在野叶上與反八月在宇九月在户後五反十月蟋蟀入我牀下叶後五反八字一句穹起弓反窒珍悉反熏許云反鼠塞向墐音覲戶同上嗟我婦子叶兹五反曰為改歲入此室處賦也斯螽莎雞蟋蟀一物隨時變化而異其名動股始躍而以股鳴也蟋蟀秋鳴亦隂類也而變化不一動股之時則為斯螽蓋感隂氣之萌故變始于此振羽能飛而以翅鳴也輯録今絡緯蟲是也考工記以股鳴者斯螽是也以翼鳴者莎雞是也宇簷下也暑則在野寒則依人穹空音孔隙也空穿孔也隙罅漏也窒塞悉則反也向北出牖也墐塗也庶人篳户冬則塗之孔氏曰篳户以荆竹織門以其通風故泥之也東萊吕氏曰十月而曰改歲三正之通于民俗尚矣輯録索隱曰尚上也言久逺也然尚矣文出大戴禮周特舉而迭用之耳舜協時月正日啓征有扈數其怠棄三正蔡氏以為子丑寅之建唐虞以前當已有之今按何以卒歲在二之日下則夏正之歲也曰為改歲在十月之下則非夏正之歲矣蓋以建寅數之者時王之正朔也以一之日數之者豳人之紀候也當時民俗蓋兩用之故詩于卒歲改歲亦互見輯録時舉問據七月詩用夏正而不見用商正吕氏謂舉而迭用之何也朱子曰周歷夏商其未有天下之時固用夏商之正朔然其國僻逺無純臣之義又自有私記其時日者故三正皆曾用也按吕氏商周迭用之說似不専為豳風發也言覩蟋蟀之依人則知寒之將至矣于是室中空隙者塞之熏鼠使不得穴于其中塞向以當北風墐户以禦寒氣而語去聲其婦子曰歲將改矣天既寒而事亦已可以入此室處矣此見老者之愛也輯録輔氏曰張子所謂見老者之愛深得其㫖蓋人老則慮事周為計密解頥曰由動股而至入我牀下所以感時物之屢變由穹窒而至于墐户入室所以盡人事之當為豳民于衣食之奉必先老而後幼先貴而後賤獨于改歲入室則老幼貴賤同之所以廣其愛也此章亦以終首章前段禦寒之意此章因候蟲之變化而驗隂氣之始終故以五月為始凡事豫則立七月之詩豫而已七月憂寒已豫矣驗斯螽于五月則又豫觀秀葽于四月則又為豫取明年萑葦于今年之八月則尤為豫也輯録通釋曰已上三章皆言所以為公上禦寒之計此章然後自言禦寒可見其君臣之義尊卑之序矣六月食鬱及薁於六反七月亨普庚反葵及菽音叔八月剝普卜反棗叶音走十月穫稻叶徒苟反為此春酒以介眉夀叶殖酉反七月食瓜叶音孤八月斷壺九月叔苴七餘反采荼音徒薪樗敕書反食音嗣我農夫賦也鬱棣屬薁櫻音纓又音鶯薁也欎車下李薁即薁李皆果名葵菜名輯録爾雅曰莖大葉小花紫黃色可茹菽豆也剝擊也穫稻以釀酒也介助也介眉夀者頌禱之詞也輯録毛傳眉夀毫眉也孔疏眉夀者年老有毫眉秀出壺瓠也輯録斷當音短孔疏斷取而食之劉執中曰瓠枯者可為壺嫩者可供茹八月宜斷其藤令勿復花實所以堅其壺而大其茹食瓜斷壺亦去上聲圃為場之漸也叔拾也苴麻子也輯録孔疏謂拾取麻子以供食也荼苦菜也樗惡木也輯録樗木大不可為材用但可為薪故云耳自此至卒章皆言農圃飲食祭祀燕樂音洛以終首章後段之意而此章果酒嘉蔬以供老疾奉賔祭供老疾奉賔祭皆自以介眉夀一句生義凡子弟舉酒于長必祝賔主勸酬必祝燕不徒燕祭而後有燕故併以祭言之瓜瓠苴荼以為常食少長之義豐儉之節然也此章専言食物而豳土晚寒物遲熟至六月始食新味也故以六月為始輯録陳氏曰取豵以為私取豜以獻公上下之分著矣以美者養老惡者自養長幼之義明矣解頥曰此章當看介眉夀食農夫六字鬱薁之食葵菽之烹棗之剝而春酒之為皆介眉夀之事介有助之之意則非以為常食也瓜之食壺之斷苴之叔荼之采樗之薪皆食農夫之事食有養之之意固以是為常矣然則果酒嘉蔬非不可以及少也而供老病奉賔祭之意多瓜瓠苴荼老者未必不食也而不可以為常于以見食稻食肉乃老者之常而果酒嘉蔬則又于常食之外専以此而致其助也有常食以養之而又有美味以助之此豳人之老所以無凍餒也歟九月築場圃溥故反十月納禾稼叶古護反黍稷重直容反穋音六叶六直反禾麻菽麥叶訖力反嗟我農夫我稼既同上入執宫功晝爾于茅宵爾索綯徒刀反亟紀力反其乘屋其始播百榖賦也場圃同地物生之時則耕治以為圃而種菜茹物成之際則築堅之以為場而納禾稼蓋自田而納之于場也禾者榖連藁秸音戛之總名禾之秀實而在野曰稼先種後熟曰重後種先熟曰穋再言禾者稻秫音述苽音孤梁之屬皆禾也輯録秫似黍米而粒小堪作酒苽雕胡也孔氏曰麻與菽麥則無禾稱故于麻麥之上更言禾字以總諸禾也許氏曰麥非納于十月蓋總言農事畢耳同聚也禾稼之納有遲早至十月則無不納者矣宫邑居之宅也古者民受五畝之宅二畝半為廬在田春夏居之二畝半為宅在邑秋冬居之功葺治之事也輯録王氏曰城中有宅田中有廬出而作于田入而休于室皆授之以時或曰公室官府之役也輯録范氏曰宫功公室之役也董氏曰蓋官府之役古者用民之力歲不過三日是也此即上入二字推之然自田廬至邑居亦可以上入言也前說為優索絞也綯索也乘升也言納于場者無所不備則我稼同矣可以上入都邑而執治宫室之事矣輯録毛傳入為上出為下上時掌反故晝往取茅夜而絞索亟升其屋而治之輯録嚴氏曰晝取茅草將以蓋屋夜作索綯將以縳室也蓋以來歲將復扶又反始播百榖而不暇于此故也不待督責而自相警戒不敢休息如此輯録天運而不息人勤而不已也程子曰古者功作之事皆于冬月閒隙之際如修完屋廬墻垣之類皆為來嵗計皆是一歲既終則復慮其始也輔氏曰詩言民之趨于農功自然如此其亟故孟子引之以證其民事不可緩之說吕氏曰此章終始農事以極憂勤艱難之意此章先言農之終事以起農之始事故以九月為始輯録解頥曰稼之既同若可以少休也而即念夫邑居之當修屋之方乘若可以少緩也而復念夫農功之當始于其築而納之也有以見其歡欣鼓舞之意于其亟而乘之也有以見其勸勉戒飭之意事有始終而其憂勤艱難則無間于始終此所以為厚也歟二之日鑿冰沖沖三之日納于凌力證反隂叶於容反四之日其蚤音早獻羔祭韭音九叶已小反九月肅霜十月滌徒力反場朋酒斯饗叶虛良反曰殺羔羊躋子奚反彼公堂稱彼兕觥號彭反叶古黃反萬夀無疆賦也鑿冰謂取冰于山也沖沖鑿冰之意沖訓和則沖沖者乃舂容之意輯録孔疏非貌非聲故云鑿冰之意周禮正歲十二月令斬冰是也見天官凌人此官府之役也輯録正歲謂夏正季冬納藏也藏冰所以備暑也凌隂冰室也豳土寒多正月風未解凍故冰猶可藏也前言備寒者不一此言藏冰則備暑也備寒所以為下備暑所以為上蚤蚤朝也韭菜名獻羔祭韭而後啓之月令仲春獻羔開冰先薦寢廟是也輯録陳氏曰獻羔以祭司寒之神先薦寢廟者不敢以人之餘奉神也蘇氏曰古者藏冰發冰以節陽氣之盛夫陽氣之在天地譬如火之著音斫于物也故常有以解之十二月陽氣藴伏錮而未發其盛在下則納冰于地中至于二月四陽作大壯蟄蟲起陽始用事則亦始啓冰而廟薦之至于四月陽氣畢達隂氣將絶則冰于是大發食肉之祿老病喪浴冰無不及食肉之祿注云謂在朝廷治其職事就官食者輯録左傳云大夫命婦喪浴至于老疾注云老致仕在家者是以冬無愆陽夏無伏隂春無凄風秋無苦雨雷出不震無災霜雹癘疾不降民不夭札也語本左傳昭公四年申豐之說蘇氏又發明之如此輯録杜氏曰愆過也謂冬溫伏隂謂夏寒凄寒也苦雨霖雨為人所患苦短折為夭夭死為札胡氏曰藏冰開冰亦聖人輔相去聲燮調之一事耳不専恃此以為治去聲也二說宜以胡氏為當肅霜氣肅而霜降也滌場者農事畢而掃場地也兩尊曰朋鄉飲酒之禮兩尊壺于房户間是也置酒曰尊尊于東房之西室户之東在賔主之間示主人與客共有此酒也按古人之堂自半以前虛之為堂半以後實之為室室之東為東房西為西房兩房一室各有户南向出户即為堂矣躋升也公堂君之堂也稱舉也疆竟也竟音境無彊竟則無限止張子曰此章見民忠愛其君之甚既勸趨其藏冰之役又相戒速畢場功殺羊以獻于公舉酒而祝其夀也吕氏曰豳之先公國容未備無君民之間故其禮如此愚謂此章専言奉公之事因鑿冰而以二之日為始七月八章章十一句周禮籥章中即仲字春晝擊土鼓吹即吹字豳詩以逆暑中秋夜迎寒亦如之輯録注籥章吹籥以為詩章土鼓燒土以為匡也逆暑以晝求諸陽迎寒以夜求諸隂逆迎也即謂此詩也輔氏曰此詩専言寒暑之候以為斯民農桑之節故周于逆暑迎寒之際皆用之愚按輔氏之言甚協詩意夫周公因民事而言天時非歷舉四時十二月而致詳于節候也故建辰之月未嘗専及之而餘月或一再四三言或反覆道之不厭蓋其意惟以農桑為主寧計時月之詳略乎而不知者必以蠶月補所未言亦固也王氏曰仰觀星日霜露之變輯録流火春日載陽肅霜之類俯察昆蟲草木之化輯録有鳴倉庚嗚蜩秀葽隕蘀之類以知天時以授民事輯録蠶月條桑授衣築場圃塞向墐户鑿冰之類此二句本承上文以起下文也女服事乎內輯録求桑載績之類男服事乎外輯録于耜舉趾穫稻于貉之類此即以授民事之事也上以誠愛下下以忠利上利順也輯録我朱孔陽為公子裳言私其豵獻豜于公之類此即在下之情而知上之誠愛也父父子子夫夫婦婦輯録此言各得其道也養老而慈幼食力而助弱助弱即于養老慈幼見之入此室處老者為幼者助弱也以介眉之類少者為老者助弱也輯録同我婦子饁彼南畝食我農夫皆是也其祭祀也時此詩惟獻羔祭韭一句為祭祀而果酒嘉蔬以奉賔祭則祭亦在其中矣其燕饗也節進享于君惟羔羊朋酒而已是節儉也此七月之義也輯録真氏曰農者衣食之本惟其關生民之大命是以服天下之至勞今以此詩考之是其心無一念不在乎農也一歲之間無一日不専乎農也一家之內無一人不力乎農也近世張栻入侍經筵言周公之告成王見于詩有如七月見于書有如無逸欲其知稼穡之艱難與小人之依帝王所傳心法之要端在于此其論最為懇至臣愚不佞願詔儒臣以今農夫紅女耕桑勞勩之狀作為歌詩退朝之暇使人日誦乎前且繪畫成圖揭之宫掖布之戚里庶幾聖心惕然不忘小民之依而六宫嬪御外戚近屬亦知衣食之所自來而不狃侈汰之習也鴟梟鴟梟既取我子乂叶入聲無毁我室人叶上聲恩斯勤斯鬻由六反子之閔叶眉貧反斯比也為鳥言以自比也鴟梟鵂鶹音休留惡鳥攫俱縳反爪持也鳥子而食者也室鳥自名其巢也恩情愛也勤篤厚也鬻養閔憂也武王克商使弟管叔鮮蔡叔度監于紂子武庚之國武王崩成王立周公相去聲之而二叔以武庚叛且流言于國曰周公將不利于孺子輯録蔡氏曰流言無根之言如水之流自彼而至此也故周公東征二年乃得管叔武庚而誅之此得字用書文罪人斯得之得而成王猶未知周公之意也公乃作此詩以貽王託為鳥之愛巢者呼鴟梟而謂之曰鴟梟鴟梟爾既取我之子矣無更毁我之室也輯録毁去聲非自壞而隳毁之也以我情愛之心篤厚之意鬻養此子誠可憐憫此可見周公于兄弟至厚也今既取之其毒甚矣况又毁我室乎以比武庚既敗管蔡亂國以自敗者二叔也而謂武庚敗管蔡則公為親者諱也其實二叔以武庚扇惑而後起指為罪之魁也宜哉不可更毁我王室也事本金縢說從張氏故以居東為東征以鴟梟為作于致辭管蔡之後也至蔡氏書傳乃朱子晚年之說又從鄭氏改讀弗辟之辟為避而與此說不同但詩言既取我子則武庚已敗管蔡管叔既已受誅矣今讀鴟梟不必求合于蔡氏書傳也逮天之未隂雨徹彼桑土音杜徒古反綢直留反繆莫侯反牖户後五反今女音汝下民或敢侮豫叶演女反比也逮及徹取也桑土桑根也輯録桑根之皮也綢繆纒綿也牖巢之通氣處户其出入處也亦為鳥言我及天未隂雨之時而往取桑根以纒綿巢之隙穴使之堅固以備隂雨之患則此下土之民誰敢有侮豫者亦以比已深愛王室而預防其患難去聲後同之意故孔子贊之曰為此詩者其知道乎能治其國家誰敢侮之有備則無患此為治之大法也朱子引之以見周公善于為治如此豫手拮音吉据音居豫所捋力活反荼豫所蓄租子胡反豫口卒瘏音徒曰豫未有室家叶古胡反比也拮据手口共作之貌捋取也荼萑音丸苕音迢孔氏曰􅯈為蕉苕謂􅯈之秀穗也􅯈頑去聲可藉慈夜反巢者也蓄積租聚也卒盡瘏病也室家巢也亦為鳥言作巢之始所以拮据以捋荼蓄租勞苦而至于盡病者輯録嚴氏曰手拮据而捋荼蓄租而口卒瘏交錯言之也以巢之未成也以比已之前日所以勤勞如此者以王室之新造而未集故也集就也豫羽譙譙在消反豫尾翛翛素雕反豫室翹翹祈消反風雨所漂匹遙反搖豫維音嘵嘵呼堯反比也譙譙殺色界反也翛翛敝也翹翹危也嘵嘵急也亦為鳥言羽殺尾敝以成其室而未定也風雨又從而漂搖之則我之哀鳴安得而不急哉以比已既勞悴王室又未安而多難乘之輯録解頥曰當是時王心疑于上羣情惑于下亂賊乘機伺間于其側而國𫝑之危甚于風雨之漂搖也則其作詩以喻王亦不得而不汲汲也鴟梟四章章五句一章斥武庚作亂之罪二章自述其所以防亂之意三章言其所以勤勞之故四章言其所以作詩之故事見書金縢篇輯録鄒季友曰藏書之匱金以鑰之縢以緘之二者兼用故謂之金縢所以致其固也按朱子語録前後不同朱子詩傳鴟梟篇亦不用鄭說故今世經師多從孔傳蓋謂成王幼冲周公身任安危之寄豈可避小嫌而輕去哉我徂東山慆慆叶刀反不歸無韻未詳我來自東零雨其濛我東曰歸我心西悲制彼裳衣勿士行戶郎反枚叶謨悲反蜎蜎烏𤣥反者蠋音蜀蒸在桑野叶上與反敦都回反彼獨宿亦在車下叶後五反賦也東山所征之地也輯録李氏曰周在豐鎬管蔡三監叛其地在王室之東周公征之自西而東故謂之東征慆慆言久也零落也濛雨貌裳衣平居之服也勿士行枚未詳其義鄭氏曰士事也行陳去聲謂軍師行伍之列也枚如箸俗作筯銜之有繣音畫繩也結項中諸本項作頸誤頸後曰項以止語也輯録軍法止語為相疑惑蜎蜎動貌蠋桑蟲如𧖟者也蒸發語聲敦獨處上聲不移之貌此則興也物動而人不動故用其語相呼為興成王既得鴟梟之詩又感雷風之變始悟而迎周公于是周公東征已三年矣上篇言東征二年此言東征三年二說不同蓋謂東征之役凡二年其往來首尾則三年也亦本孔氏說詩之意輯録據蔡氏書傳上篇是居東二年此是東征又自三年也黃氏曰居東二年而罪人斯得是即東征之役也若止避地何云罪人斯得耶必如鄭說居東避地者二年其往來已及三年既歸而後三監叛既叛而後出東征又復三年于此則周公攝政七年之間無非奔走道塗之日更于何時輔成王致太平而制禮作樂耶既歸因作此詩以勞去聲歸士蓋為去聲之述其意而言曰我之東征既久而歸途又有遇雨之勞輯録董氏曰我徂東山記其地也慆慆不歸記其久也我來自東記其還也零雨其濛記其時也因追言其在東而言歸之時心已西嚮而悲于是制其平居之服而以為自今可以勿為行陳銜枚之事矣輯録吕氏曰此亦歸士之情也所謂序其情而閔其勞也王氏曰止人毋為謂之勿及其在塗則又覩物起興而自嘆曰彼蜎蜎者蠋則在彼桑野矣此敦然而獨宿者則亦在此車下矣嚴氏曰言獨宿念室家也輯録王氏曰古用車戰則將卒有所蔽倚止則為營衛與塹柵無以異兵械衣服皆可以載其中我徂東山慆慆不歸我來自東零雨其濛果裸力果反之實亦施羊跂反于宇伊威在室蠨音蕭蛸所交反在户後五反町他頂反疃他短反鹿場熠以執反耀以照反宵行叶户郎反不可畏叶於非反也伊可懷叶胡威反也賦也果裸栝音括樓也輯録本草曰栝樓實名黃瓜生苗引藤蔓實在花下大如拳九月熟施延也蔓生延施于宇下也伊威鼠婦也室不掃則有之輯録劉執中曰伊威壁落間小蟲也無人掃則出行于室本草曰鼠婦一名負蟠多在下濕處及土坎中常惹著鼠背故名鼠負今誤作婦字所謂濕生蟲也多足其色如蚓背有橫文蠨蛸小蜘蛛也户無人出入則結網當之輯録陸氏曰蠨蛸名長踦小如蜘蛛而足長喜結網當户人觸之則伸前後足如草使人不疑為蟲故名長踦音欺孔氏曰小蜘蛛長腳者俗呼為蟢子町疃舍傍隙地也輯録程子曰廬傍畦壠無人焉故鹿以為場也熠耀明不定貌宵行蟲名如𧖟夜行喉下有光如螢輯録濮氏曰舊說以熠耀即螢以宵行為夜飛與下章熠耀其羽相戾當知宵行乃蟲名章首四句言其往來之勞在外之久故每章重平聲言見其感念之深遂言已東征而室廬荒廢至于如此亦可畏矣然豈可畏而不歸哉亦可懷思而已此則述其歸未至而思家之情也輯録程子曰丁夫于役田事廢而室廬荒果裸以下是也在彼思念其如此也我徂東山慆慆不歸我來自東零雨其濛鸛古玩反鳴于垤田節反叶地一反婦嘆于室灑掃穹窒我征聿至叶入聲有敦都回反瓜苦蒸在栗薪自我不見于今三年叶尼因反賦也鸛水鳥似鶴者也輯録陸氏曰似鶴而大長頸赤喙白身黑尾翅本草注曰頭無丹項無烏帶身似鶴不善唳但以喙相擊而鳴亦有二種白鸛烏鸛垤蟻塜也穹窒見七月將隂雨則穴處上聲者先知故蟻出垤而鸛就食之遂鳴于其上也輯録孔氏曰蟻輦土為塜以避濕將隂雨水泉上潤故蟻避濕而上鸛是好水之鳥知天將雨故長鳴而喜也行者之妻亦思其夫之勞苦而嘆息于家行者遇雨沾體塗足室家思念于此為甚是以占其候而嘆焉于是灑掃穹窒以待其歸而其夫之行忽已至矣因見苦瓜繫于栗薪之上而曰自我之不見此亦已三年矣栗周土所宜木與苦瓜皆微物也見之而喜則其行久而感深可知矣我徂東山慆慆不歸我來自東零雨其濛倉庚于飛熠耀其羽之子于歸皇駁邦角反其馬叶滿補反親結其縭叶離羅二音九十其儀叶宜俄二音其新孔嘉叶居宜居何二反其舊如之何叶奚何二音賦而興也倉庚飛昏姻時也仲春令㑹男女故云然熠耀鮮明也輯録通釋曰上章熠耀言宵行蟲之光故以為明不定貌此章言倉庚之羽故以為鮮明集傳隨文解義類如此黃白曰皇輯録孔氏曰謂馬色有黃處有白處駵音留赤色白曰駁縭婦人之褘輯録孫炎曰帨巾也也母戒女而為去聲之施襟結帨也襟繫佩帶也輯録昏禮注襟其鴆反帨佩巾九其儀十其儀言其儀之多也美其儀之多者喜其及時也賦時物以起興因見時物而賦之就用其語相呼也而言東征之歸士未有室家者及時而昏姻既甚美矣其舊有室家者相見而喜當如何邪首章言敦彼獨宿夫之念其婦也三章言婦嘆于室婦之念其夫也至于此章則新者及時舊者相見夫婦之樂可知矣周公之勞歸士亦本之人情而已東山四章章十二句序曰一章言其完也二章言其思去聲也三章言其室家之望女音汝也四章樂音洛男女之得及時也君子之于人序其情而閔其勞所以說音悅下同也說以使民民忘其死其惟東山乎愚謂完謂全師而歸無死傷之苦思謂未至而思有愴恨之懷至于室家望女男女及時亦皆其心之所願而不敢言者上之人乃先其未發而歌詠以勞去聲下同苦之輯録方言苦快也郭璞曰苦而為快猶以臭為香治為亂反覆用之也則其歡欣感激之情為如何哉蓋古之勞詩皆如此輯録四牡采薇出車杕杜等篇其上下之際情志交孚雖家人父子之相語無以過之此其所以維持鞏固數十百年而無一旦土崩之患也以繩繫物曰維持以皮束物曰鞏固固結人心蓋若是也輯録朱子曰周公是王室至親諸侯連衡背叛當國大臣豈有坐視不救之理帥師征之乃是正義周公之志非為身謀也為先王謀也非為先王謀也以身任天下之重也又曰東山詩曲盡人情方其盛時則作之于上東山是也及其衰世則作之于下伯兮是也輔氏曰周公之詩七月述后稷公劉衣食斯民之事以告王義則自然之道也鴟梟述已之勤勞以悟成王見為臣之義也東山述歸士之意以慰勞之見用民之宜也三詩誠足以為萬世法非周公其孰能為之通釋曰古之勞詩如四牡采薇出車杕杜等篇皆所以交通上下之情而為固結人心之本也或曰以周公而誅武庚猶以千鈞之重而壓乎鳥卵之上蔑不破矣而奚俟乎三年之久也解頥曰周公之東征也侯于翼有以剪其羽翼而披其枝葉將不必斧鉞干戚之用而罪人斯得矣則周公之于庶殷非以力勝之也以德化之也惟其以德服人也故軍士之從公而東者雖有别離之苦而無死亡之患則周公此舉可謂仁之至而義之盡矣既破我斧又缺我斨七羊反周公東征四國是皇哀我人斯亦孔之將賦也隋駝妥二音銎音芎曰斧方銎曰斨征伐之用也四國四方之國也皇匡也將大也從軍之士以前篇周公勞去聲已之勤故言此以答其意曰東征之役既破我斧而缺我斨其勞甚矣破斧缺斨託言之以見其久役而甚勞耳聖人征伐焉用戰然周公之為此舉蓋將使四方莫敢不一于正而後已其哀我人也豈不大哉公不東征則流言不正王疑不釋四方之亂不息矣然則雖有破斧缺斨之勞而義有所不得辭矣輯録語録聖人之心詩人真是形容得出這是答東山之詩古人苟利國家雖殺身為之而不辭今人箇箇計較利害看他四國如何不安也得不寧也得只是護我斨斧莫得缺壞了此詩說出極分明夫管蔡流言以謗周公而公以六軍之衆往而征之使其心一有出于自私而不在于天下則撫之雖勤勞之雖至而從役之士豈能不怨也哉今觀此詩固足以見周公之心大公至正天下信其無有一毫自愛之私抑又以見當是之時雖被堅執鋭之人亦皆能以周公之心為心而不自為一身一家之計蓋亦莫非聖人之徒也學者于此熟玩而有得焉則其心正大而天地之情真可見矣聖人之心即天地之心也輯録解頥曰武王一戍衣而天下定四國既莫敢不一于正矣及管蔡以武庚叛而四國復有不正者焉周公之東征也固將以我之正正彼之不正也而孰能禦之哉理之逆者不足以犯我之順也辭之曲者不足以抗我之直也氣之餒者不足以敵我之浩然也戮一人而天下服則向之不正者復反于正矣蓋其匡四國即所以哀我人匡四國者以其功言也哀我人者以其心言也惟其心即天地生物之心故其功即天地成物之功也是詩雖作于軍士然亦可謂知聖人者矣黃勉齊曰詩人洞見聖人之情以為破斧缺斨者蓋欲誅管蔡而正四國也集傳曰學者于此熟玩而冇得焉則其心正大而天地之情真可見矣今人須是存得箇正大之心不然則是邪小底人焉得謂之大丈夫既破我斧又缺我錡巨宜反叶巨何反周公東征四國是吪五戈反哀我人斯亦孔之嘉叶居何反賦也錡鑿屬諸本鑿作釡誤吪化嘉善也既破我斧又缺我銶音求周公東征四國是遒在羞反哀我人斯亦孔之休賦也銶木屬輯録韓詩云鑿屬一云今之獨頭斧遒斂而固之也休美也破斧三章章六句反覆嘆之范氏曰象日以殺舜為事舜為天子也則封之管蔡啓商以叛周公之為相去聲也則誅之迹雖不同其道則一也蓋象之禍及于舜而已故舜封之管蔡流言將危周公以間去聲王室得罪于天下故周公誅之非周公誅之天下之所當誅也周公豈得而私之哉殷有天下六百年德之被于民者深矣紂驅其民與武王民幸脫于水火也及痛定而思則商為周矣殷民反則何怪哉當此之時而三監武庚果得乘隙則危殆有不可勝言者周公為冡宰成王又幼苟無所處何以靖之管蔡之誅不免矣是知舜為象計故得全其友愛之天周公為文武天下計不得不盡夫大公至正之道集傳引此以明聖人處物之義而見周公無愧于舜也輯録輔氏曰東山之詩周公能得歸士之心也破斧之詩歸士能得周公之心也所謂上下交而其志同者也伐柯如何匪斧不克取七喻反妻如何匪媒不得比也柯斧柄也克能也媒通二姓之言者也周公居東之時東人言此以比平日欲見周公之難伐柯伐柯其則不逺我遘古豆反之子籩豆有踐踐淺反比也則法也我東人自我也之子指其妻而言也籩竹豆也豆木豆也踐行音杭列之貌言伐柯而有斧則不過即此舊斧之柯而得其新柯之法輯録朱子曰言執柯伐木以為柯者彼柯長短之法在此柯耳娶妻而有媒則亦不過即此見之而成其同牢之禮矣昏禮曰共牢而食注云牢牲牢也共一牲牢而食不異牲輯録士昏禮曰特豚合升注謂同牢也醯醬二豆葅醢四豆無籩東人言此以比今日得見周公之易去聲深喜之之詞也伐柯事之小者也娶妻禮之大者也物有小大而遂其所欲則均可喜也東人之于周公未見而願之之深既見而幸之之甚引伸觸長無非可譬者也伐柯二章章四句增釋許氏曰伐柯非難事也然必須斧娶妻亦非難事也然必須媒東人之于周公被其風而化其德思慕之極瞻之固若在前也然而貴賤之殊道里之逺亦未易見也故其企望如此及其因事而東則幸而得見東人故喜之之意而如二章之所言也九罭于逼反之魚鱒才損反魴音房我覯之子衮古本反衣繡裳興也九罭九囊之網也輯録爾雅曰緵罟謂之九罭魚網也孫炎云謂魚之所入有九囊郭璞云緵今之百囊網也鱒似鯶渾上聲而鱗細眼赤輯録爾雅曰鱒魚目中赤色一道橫貫瞳魚之美者惟螺蚌多獨行見網輒避魴已見音現見汝墳上皆魚之美者也我東人自我也之子指周公也前篇之子承取妻如之何言此篇之子因衮衣繡裳而言蓋作詩非一人而之子乃衆人之通稱也故所指者異衮衣裳九章一曰龍二曰山三曰華蟲雉也四曰火五曰宗彛虎蜼音壘位抽也虎子也輯録爾雅注蜼似獼猴而大黃黑色尾長數尺似獺尾末有岐鼻露向上雨即自懸于樹以尾塞鼻或以兩指皆繢音繪畫也于衣六曰藻七曰粉米八曰黼九曰黻皆繡于裳周制登龍于山登火于宗彛與舜觀古人之象頗異輯録周法皆以蟲獸為章首故如此益稷蔡氏傳曰山取其鎮也龍取其變也華蟲取其文也火取其明也宗彛取其孝也藻水草取其潔也粉米白米取其養也黼若斧形取其斷也黻兩已相戾取其辨也鄒季友曰彛上尊也盛鬱鬯曰彛周禮宗廟彛器有虎彛蜼彛畫虎蜼于彛故以宗彛為虎蜼也取其孝謂宗廟祭器也又注疏云虎蜼同在于彛故此亦并為一章也虎取其嚴猛蜼取其有智天子之龍一升一降上公但有降龍以龍首卷音衮然故謂之衮也出記玉藻周禮典命王之三公八命冕服七章與侯伯同及出封則加一等而服衮按孟子言周公封于魯則公以三公而受出封之命矣此所以有九章之衮衣也此亦周公居東之時東人喜得見之而言九罭之網則有鱒魴之魚矣我覯之子則見其衮衣繡裳之服矣九罭之魚有鱒又有魴之子之服有衣又有裳皆二者兼備之意故以為興鴻飛遵渚公歸無所于女音汝信處興也遵循也渚小洲也女東人自相女也再宿曰信東人聞成王將迎周公又自相謂而言鴻飛則遵渚矣公歸豈無所乎人物各有依歸是皆必然之理也故以為興今特于女信處而已輯録朱子曰此章飛歸字是句腰亦用韻詩中亦有此體鴻飛遵陸公歸不復於女信宿興也高平曰陸不復言將留相王室而不復來東也是以有衮衣兮無以我公歸兮無使我心悲兮賦也承上二章言周公信處信宿於此是以東方有此服衮衣之人又願其且留于此無遽迎公以歸歸則將不復來而使我心悲也輯録解頥曰留公者東人之私情而迎公者天下之公論一人之私情不足以勝天下之公論此東人所以拳拳于公雖欲遂而留之而卒不可得也增釋此章一句尊之之辭也二句親之之辭也三句願留無已之辭也而周公之德可見矣九罭四章一章四句三章章三句一章以得見為喜二章三章以將歸為憂四章以勿歸為願輔氏曰伐柯喜其得見九罭願其久留東人之愛公有加而無已也愚謂周公之心軍士知之周公之德東人喜之而成王幾或不如軍士東人之智非鴟梟之詩貽于前風雷之變彰于後則王之疑終不可解公之忠卒不可白而文武之業隳矣所幸周公之誠足以動乎天而應乎人故亂不終于亂而反乎治也其功不既大哉狼跋蒲末反其胡載疐丁四反其尾公孫音遜碩膚赤舄音昔几几興也跋躐也胡頷下懸肉也載則疐跲鉞入聲也老狼有胡進而躐其胡則退而跲其尾輯録疐當從陟利反躐踐也前倒跲躓也後倒語録曰狼性不能平行每行首尾一俯一仰首至地則尾舉向上胡舉向上則尾疐至地公周公也孫讓碩大膚美也赤舄冕服之舄也輯録鄭氏曰舄有三等赤舄為上冕服之舄詩云王錫韓侯𤣥衮赤舄則諸侯與王同復下曰舄襌下曰屨襌音丹李氏曰天子諸侯冕服用舄他服用屨几几安重貌輯録王氏曰几人所憑以為安者故几几安也愚謂几几所以形容其安重之氣象也周公雖遭疑謗然所以處上聲下同之不失其常故詩人美之此周公居東而王疑未釋之日鴟梟貽王即是時也言狼跋其胡則疐其尾矣公遭流言之變而其安肆自得乃如此此以進退跋疐與安肆自得相反而為興蓋其道隆德盛而安土樂音洛天有不足言者安土樂天本聖人事而猶不足言則無所不安無所不樂聖人之至極而無以加也所以遭大變而不失其常也輯録程子曰周公至公無私進退以道無利欲之蔽故雖危疑之地安于舒泰赤舄几几然安也嚴氏曰凡人處利害之變則舉趾不安其常懼者或至于喪屨喜者或至于折屐詩人以赤舄几几見周公之聖其善觀聖人矣夫公之被毁以管蔡之流言也而詩人以為此非四國之所為四國管蔡商奄也乃公自讓其大美而不居耳蓋不使讒邪之口得以加乎公之忠聖此可見其愛公之深敬公之至而其立言亦有法矣增釋許氏曰語録云此興是反說公孫碩膚如言幸虜營及北狩之意言公之被毁非四國之流言乃公自遜此大美耳此古人善于辭命處如春秋公孫于齊不成說昭公出奔聖人也只得如此說自是體當如此魯昭公分明是為季氏所逐春秋却書孫齊如其自出云耳解頥曰物之纍于形者其進退跋疐無所往而不病聖人之周于德者其進退從容無所往而不宜蓋臨大難而不懼處大變而不憂斷大事而不疑非道隆德盛者固不足以語此非常人之所能及也狼疐其尾載跋其胡公孫碩膚德音不瑕叶洪孤反興也德音猶令聞並去聲也瑕疵音慈病也程子曰周公之處已也夔夔然存恭畏之心其存誠也蕩蕩然無顧慮之意所以不失其聖而德音不瑕也輯録建安葉氏曰夔夔戒謹恐懼之貌存誠者自信之篤也蕩蕩明白坦平之義聖人雖當危疑之地既不忿戾而改常亦不疑懼而失守是為不失其聖也狼跋二章章四句前章言其德容之不變後章言其聲譽之無損伐柯九罭狼跋皆當在東山之前范氏曰神龍或潛或飛能大能小其變化不測然得而畜之若犬羊然有欲故也唯其可以畜之是以亦得醢而食之語夲左傳凡有欲之類莫不可制焉唯聖人無欲故天地萬物不能易也富貴貧賤死生如寒暑晝夜相代乎前吾豈有二其心乎哉亦順受之而已矣舜受堯之天下不以為奉孔子厄于陳蔡而不以為戚周公逺則四國流言近則王不知而赤舄几几德音不瑕其致一也此又兼論三聖人事而示人以處富貴貧賤死生之道初不主于釋經也輯録輔氏曰狼跋之詩首章朱子之說足以盡作詩者之情末章程子之說足以盡周公之德篇末范氏之說足以盡聖賢處窮通之道自有詩以來無人說得到此豳國七篇二十七章二百三句程元問于文中子曰敢問豳風何風也曰變風也元曰周公之際亦有變風乎曰君臣相誚其能正乎成王終疑周公則風遂變矣非周公至誠其孰卒能正之哉元曰居變風之末何也曰夷王以下變風不復正矣夷王名燮厲王父也夫子蓋傷之也故終之以豳風言變之可正也唯周公能之故係之以正變而克正危而克扶始終不失其本其惟周公乎係之豳逺矣哉此以鴟梟以下六篇言之輯録范氏曰邠居風雅之間何也風之所為終而雅之所為始也變風終于曹思明王賢伯之不可得于是次之以邠反之于周公而後至于鹿鳴言周之所以盛者由周公也籥章吹吹同豳詩以逆暑迎寒已見音現于七月之篇矣又曰祈年于田祖則吹豳雅以樂音洛田畯輯録注祈年祈豐年也田祖始耕田者謂神農也田畯古之先教田者祭蠟音乍則吹豳頌以息老物大蠟之禮以歲十二月合聚萬物而索饗之萬物助天成歲事至此為其老而勞乃祀而老息之輯録蠟祭八神先嗇一司嗇二農三郵表畷四貓虎五坊六水庸七昆蟲八則考之于詩未見其篇章之所在故鄭氏三分七月之詩以當之其道情思去聲者為風女心傷悲是也正禮節者為雅以介眉夀食我農夫是也樂音洛成功者為頌十月滌場以下數語是也輯録鄭氏以殆及公子同歸以上為豳風以介眉夀以上為豳雅萬夀無疆以上為豳頌然一篇之詩首尾相應去聲乃剟音輟取其一節而偏用之恐無此理故王氏不取而但謂本有是詩而亡之其說近是或者又疑但以七月全篇隨事而變其音節或以為風或以為雅或以為頌則于理為通而事亦可行輯録雙峯饒氏曰雅有雅之音頌有頌之音風有風之音故邠風亦曰邠雅亦曰邠頌蓋一詩而修二體也如又不然則雅頌之中凡為去聲農事而作者皆可冠去聲以豳號其說具于大田良耜諸篇讀者擇焉可也輯録慈溪黃氏曰按楚茨噫嘻諸詩未易遽指以為豳若如介甫謂豳詩别自有雅頌則豳乃先公方自奮于戎狄之地此時安得有所謂天子之雅頌耶惟前一說謂吹豳之聲可雅可頌為得之按朱子云雅頌之中見為農事而作者皆可冠以豳號輔氏謂若大田良耜諸篇或以音節不同而居雅頌之中則固可從矣然朱子于大田良耜篇末又皆云亦未知其是否故存黃氏之說于此詩經疏義㑹通卷八
