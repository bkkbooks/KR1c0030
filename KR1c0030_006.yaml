body:
  text: 詩經疏義會通卷四元朱公遷撰王一之六王謂用東都洛邑王城畿內方六百里之地輯録孔氏曰漢志云周封圻東西長南北短短長相覆千里按西都方八百里八八六十四為方百里者六十四東都方六百里六六三十六為方百里者三十六二都方百里者百方千里也在禹貢豫州大華並去聲外方之間輯録大華即華山在京兆華隂縣南外方即崈髙山在頴川郡崈髙縣今西京登封縣也增釋金氏曰外方今河南府伊陽縣伊闕鎮之西陸渾山據唐志一名方山蓋古為外方春秋時秦普遷陸渾之戎居此因名陸渾云其山固嵩髙之聫峯然謂為嵩髙則非爾北得河陽漸音尖侵入之義冀州之南也輯録冀州在豫河之北增釋鄙陽張氏曰左傳襄王賜普文公陽樊溫原攢茅之田晉於是始啓南陽杜預云在晉山南河北故曰南陽是未賜晉時為周畿內故知此得河陽應劭注漢河內郡修武縣云直南陽城是晉所啓南陽所謂漸冀州之南也周室之初文王居豐武王居鎬至成王時周公始營洛邑為時會諸侯之所以其土中四方來者道里均故也自是謂豐鎬為西都而洛邑為東都輯録鄭氏曰洛邑謂之王城是為東都今河西是也周公又營成周今洛陽是也陳氏曰鎬京謂之宗周以其為天下所宗也洛邑謂之東都又謂之成周以周道成於此也洛邑天下之至中豐鎬天下之至險於洛邑定鼎以朝諸侯宅王中以涖四海其示天下也公於鎬京定都以據形勝處上遊以制六合其慮天下也逺漢唐並建兩京蓋亦深識天下形勢之所在而有得於成王周公之遺意歟增釋鄱陽張氏曰營洛在成王七年周禮以土圭之法測土深正日景以求地中日至之景尺有五寸謂之地中天地之所合也四時之所交也風雨之所會也隂陽之所和也乃建王國焉正作洛之事也深尺鴆反又尸鴆反景與影同許氏曰東萊先生以為謂之成周乃東都總名河南成周之王城也洛陽成周之下都也平王東遷之後所謂西周者豐鎬也東周者東都也威烈王之後所謂西周者河南也東周者洛陽也地理考異王城本郟鄏在河南縣北九里自平王以下十二王皆都此城至敬王乃遷成周在洛陽縣東北二十六里赧王又居王城郟古洽反鄏而蜀反至幽王嬖音閉褒姒生伯服廢申后及太子宜臼宜臼奔申申侯怒與犬戎攻宗周弒幽王于戲許宜反輯録地名亦水名在驪山之北今新豐有戲亭普文侯鄭武公迎宜臼于申而立之是為平王徙居東都王城輯録孔氏曰鎬京為西周王城為東周及敬王去王城而遷成周自是又謂王城為西周成周為東周增釋金氏曰幽王立褒人有罪請入女子於王以贖罪是為褒姒幽王三年王之後宫見而愛之生子伯服五年廢申后及太子宜臼以褒姒為后伯服為太子宜臼奔申十二年申侯與繒西夷犬戎攻幽王殺幽王驪山下虜褒姒晉文侯鄭武公衛武公秦襄公皆以兵來救晉鄭即申立宜臼是為平王繒慈陵反國在沂州於是王室遂卑與諸侯無異故其詩不為雅而為風然其王號未替也故不曰周而曰王張子曰王次衛者恐混於二南故以三衛問之程子曰諸侯并滅而王迹熄故雅亡而為國風矣增釋許氏曰政令不能行於天下故雅亦無所為而作西都數百年而無風也古之録詩所以示勸戒有雅以道天下之故則無事於采風雅既亡則取民間之詩以紀政俗王風十篇黍離為大夫行役餘皆民問詩也蓋雅必出於朝廷風則在下之歌詠古則必有其制或上可兼下下不可僣上也是以東征之事大於玁狁之役而東山勞歸之詩不在采薇出車之列雖出於變亦不與六月采芑同仆也於此可見風雅之體不可易置矣其地則今河南府及懷孟等州是也輯録河南府即今河南府懷州今懷慶府孟州今孟縣並𨽻河南彼黍離離彼稷之苗行邁靡靡中心搖搖知我者謂我心憂不知我者謂我何求悠悠蒼天叶鐡因反下同此何人哉賦而興也黍榖名苗似蘆髙丈餘穗黑色實圓重離離垂貌稷亦榖也一名穄音祭似黍而小或曰粟也增釋許氏曰黍似粱而非粱稷今之穄也二物稍相類但黍黃而稷黑黍小而稷大今中原皆有之二物似差互今以傳文兩易之曰黍榖名似稷而小穗黃色稷亦榖名一名穄苗似蘆髙丈餘穗黑色實圓重或曰粟也四字如此恐得其實蓋古之粱即今之粟古之粟即今之榖粟榖實之總名説文稷五榖之長謂獨長於衆榖也邁行也靡靡猶遲遲也搖搖無所定也悠悠逺意蒼天者據逺而視之蒼蒼然也周既東遷大夫行役至于宗周過故宗廟宫室盡為禾黍閔周室之顛覆倣徨不忍去故賦其所見黍之離離與稷之苗以興行之靡靡心之搖搖黍之實垂有靡靡之意稷之苗動有搖搖之意本因感歎黍稷而賦之但其下兩句義又相因故為賦而興既嘆時人莫識已意輯録鄭氏曰怪我久留而不去又傷所以致此者果何人哉追怨之深也輯録解頥曰彼宗廟之墟既有黍矣彼宫室之墟復有稷矣兩言彼者見地非一處而莫下盡為禾黍也是以使我行之靡靡則足欲前而不忍也心之搖搖則心若懸而靡定也謂我心憂者知我者也而亦非能有以解我憂也謂我何求者不知我者也則亦奚責於彼哉悠悠蒼天嘆其逺而莫可詰也彼何人哉嘆其罪之不容誅也雖不斥其人而所以追恨之意深矣彼黍離離彼稷之穗音遂行邁靡靡中心如醉知我者謂我心憂不知我者謂我何求悠悠蒼天此何人哉賦而興也穗秀也稷穗下垂如心之醉故以起興醉則無力故以穗下垂為興彼黍離離彼稷之實行邁靡靡中心如噎於結反叶於悉反知我者謂我心憂不知我者謂我何求悠悠蒼天此何人哉賦而興也噎憂深不能喘尺兖反息如噎之然稷之實如心之噎故以起興虗則通實則塞而噎黍離三章章十句元城劉氏曰常人之情於憂樂之事初遇之則其心變焉次遇之則其變少衰三遇之則其心如常矣至於君子忠厚之情則不然其行役往來固非一見也初見稷之苗矣又見稷之穗矣又見稷之實矣此三章之次第而所感之心終始如一不少變而愈深此則詩人之意也輯録謝氏曰天王見弒於驪山天地之大變中國之大恥東周臣子之大雦也文武成康之宗廟而盡為禾黍聞者當流涕矣心搖搖而不忍去天悠悠而不我知能為閔周之詩者一行役大夫之外無人也不知平王而聞此詩也亦有惻于中否乎吾觀書至文侯之命知平王之不足以有為矣所以訓戒晉文侯者惟曰自保其國而已王室之盛衰故都之興廢悉置度外吾於黍離之詩重有感也夫通釋曰小辨詩曰踧踧周道鞠為茂草我心憂傷惄然如搗正若此詩之意然則黍離之感既冇不徒於大夫行役之時而已兆於褒姒母子潛亂之日大夫追怨之辭有所歸矣君子于役不知其期曷至哉叶將黎反雞棲音西于塒音時日之夕矣牛羊下來叶陵之反君子于役如之何弗思叶新齎反賦也君子婦人目其夫之辭鑿墻而棲音西曰塒日夕則羊先歸而牛次之輯録輔氏曰羊性畏露晚出而早歸常先於牛也大夫久役于外其室家思而賦之曰君子行役不知其還反之期且今亦何所至哉輯録輔氏曰曷至哉則不知其今在何所也雞則棲于塒矣日則夕矣牛羊則下來矣是則畜許六反産出入尚有旦暮之節而行役之君子乃無休息之時使我如何而不思也哉君子于役不日不月曷其有佸户括反叶户劣反雞棲于桀日之夕矣牛羊下括古活反叶古劣反君子于役苟無飢渴叶巨列反賦也佸會桀杙音弋橛也括至苟且也君子行役之久不可訃以日月而又不知其何時可以來會也亦庶幾平聲其免於飢渴而已矣言庶幾者望之之辭輯録孔疏庶幸也幾覬也庶幾者幸覩之意此憂之深而思之切也輯録輔氏曰可以日月訃則思有節也知其會期則思猶有止也不日不月則不可訃以日月也曷其有佸則不知其何時可以來會也苟無飢渴則不敢必其歸而但幸其不至於飢渴而已其憂思之情益甚矣君子于役二章章八句前章極思之之心後章致願之之心輯録謝氏曰雨雪霏霏遣戍役而預言歸期也卉木萋萋勞還率而詳言歸期也四牡之使寧幾何時勞之曰我心傷悲吉甫在鎬不過千里勞之曰我行永久吾觀先王之心惟恐一人之勞苦惟恐一人之怨咨何也不如是非所以體群臣也木於推已及物之恕發而為序情閔勞之仁豈有無期度者哉今君子于役至于不知其期仁恕之意民然矣文武宣王之治何時而可復見乎君子陽陽左執簧音黃右招我由房其樂音洛只音止且子徐反賦也陽陽得志之貌簧笙竽管中金葉也蓋笙竽皆以竹管植於匏中而竅苦弔反穴也其管底之側以薄金葉障之吹則鼓之而出聲所謂簧也故笙竽皆謂之簧笙十三簧或十九簧竽三十六簧也由從也房東房也孔疏云房在室旁人出入處也按古人之居中為室室之東為東房西為西房自東房入北階通後堂則東房即所由之路也只且語助辭此詩疑亦前篇婦人所作蓋其夫既歸不以行役為勞而安於貧賤以自樂其家人猶識其意而深嘆美之皆可謂賢矣豈非先王之澤哉或曰序説亦通宜更詳之如序説則房為小寢國君有房中之樂而此之君子猶簡兮之碩人也輯録謝氏曰東周之季君子知世之不可救道之不可行髙蹈逺引自得其樂者多矣未聞以相招祿仕為樂者也今也進不能捐軀以報國退不能潔身以全道呼儔引類仕為伶官陽陽然志得而意滿曰其樂只且自謂不勝其樂矣君子當如是耶古之仁人憂不在一身常以天下之憂為憂樂不在一身必以天下之樂為樂衣人之衣則分人之患乘人之車則載人之難位其朝食其祿視其國治亂安危漠然不加欣戚於吾心甚於南人之視北越人之疾秦仁人不忍為也君子者國人所仰望而法則也出處語默喜怒哀樂皆可以為民極吾不知其樂只且果何樂也東遷之後世與道交喪號為君子者如此嗚呼周轍何時而西乎竊意此詩當從序説較謂前篇婦人所作者為優君子陶陶左執翿徒刀反右執我由敖五刀反其樂只且賦也陶陶和樂之貌翿舞者所持羽旄之屬敖舞位也君子陽陽二章章四句由東房入後堂然後就舞位言之序也如序説則房為作樂之處敖為舞之位其言亦有序矣揚之水不流束薪彼其音記之子不與我戍申懷叶胡威反哉懷哉曷月豫還音旋歸哉興也揚悠揚也水緩流之貌彼其輯録其語助辭之子戍人指其室家而言也戍屯兵以守也申薑姓之國平王之母家也在今鄧州信陽軍之境輯録鄧州即今鄧州屬南陽府信陽軍今改信陽縣屬汝寧府並𨽻河南懷思曷何也平王以申國近楚數被侵伐故遣畿內之民戍之而戍者怨思作此詩也興取之不二字如小星之例輯録通釋曰先儒多以為水弱不流薪楚喻平王微弱不能徵發諸侯蓋由誤認此詩之體此詩乃興之不取義者特取之不二字相應耳故集傳特指其例以明之揚之水不流束楚彼其之子不與我戌甫懷哉懷哉曷月豫還歸哉興也楚木也甫即呂也亦薑姓書吕刑禮記作甫刑而孔氏以為吕侯後為甫侯是也當時蓋以申故而并戍之今未知其國之所在計亦不逺於申許也輯録孔氏曰言甫與許者以其俱為薑姓既重章以變文因借甫許以言申其實不戍許甫也六國時秦趙國為嬴姓史記漢書多謂秦為趙亦此類也揚之水不流束蒲叶滂古反彼其之子不與我戍許懷哉懷哉曷月豫還歸哉興也蒲蒲栁春秋傳云董澤之蒲杜氏云蒲楊栁可以為箭者是也輯録孔氏曰陸璣云蒲栁有兩種皮正青者曰小楊其一種皮紅者曰大楊其葉皆長廣於栁葉皆可為箭幹故宣公十二年傳曰董澤之蒲可勝既乎嚴氏曰毛以為草鄭以為蒲栁皆通蒲草見陳澤波蒲栁見陳東門之楊許國名亦薑姓今頴昌府許昌縣是也輯録頴昌府許昌縣即今河南開封府許州也揚之水三章章六句戍守専為申戍甫與許則以申之故以事勢輕重為先後之序也申侯與犬戎攻宗周而弒幽王則申侯者王法必誅不赦之賊而平王與其臣庶不共戴天之讎也輯録曲禮云父之讎不與共戴天陳氏曰父者子之天不能復父讎仰無以視乎皇天矣報之之意誓不與讎俱生此所以弗共戴天也今平王知有母而不知有父知其立已為有德而不知其弒父為可怨至使復讎討賊之師反為報施去聲酬恩之舉則其忘親逆理而得罪於天已甚矣輯録通釋曰吾意平正所以但知母家之重而不知弒父之讎者皆自疇昔怨父一念之差所致也究其忘親逆理之罪吾於其傳與有責焉又况先王之制諸侯有故則方伯連帥以諸侯之師討之王室有故則方伯連帥以諸侯之師救之天子鄉遂之民供貢賦衛王室而已今平王不能行其威令於天下無以保其母家乃勞天子之民逺為諸侯戍守故周人之戍申者又以非其職而怨思焉則其哀懦微弱而得罪於民又可見矣輯録李迂仲曰以公存心則如采薇以私存心則如揚之水遣戍則同而美刺則異也嗚呼詩亡而後春秋作其不以此也哉輯録輔氏曰亡親逆理以賊人之秉彛非法枉道以使人之勞役此民之所以怨思也欲其悉力致死以報其上難矣哉所謂民至愚而神於此可見先王之所以畏而敬之也此正平王之詩故日詩亡然後春秋作其不以此也哉張南軒曰胡文定公云按弼鄘而下多春秋時詩而謂詩亡然後春秋作何也自黍離降為國風天下無復冇雅而王者之詩亡春秋作於隱公適當雅亡之後夫黍離所以為國風者平王自為之也平王忘國於是王者之迹熄而詩亡天下貿貿焉日趨於異端禽獸之歸故孔子懼而作春秋中谷有蓷吐雷反暵呼但反其乾矣有女仳匹指反離慨口愛反其嘆士丹反矣慨其嘆矣遇人之艱難矣興也蓷隼即萑字隼萑並音追朱惟反也葉似荏荏白蘇也諸本作萑誤方莖白華華生節間即今益母草也輯録本草曰茺蔚一名益母節節生莖如雞冠其子三稜嚴氏曰據本草茺蔚正生海濵池澤其性宜濕暵燥仳别也慨歎聲艱難窮厄也凶年飢饉室家相棄婦人覽物起興而自𫐠其悲歎之詞也有字其字矣字相呼為興中谷有蓷暵其修叶式竹反矣有女仳離條其嘯叶息六反矣條其嘯矣遇人之不淑矣興也修長也輯録陳氏曰長茂者亦為所暵或曰乾也如脯之謂修也條條然嘯貌嘯蹙子六反口出聲也悲恨之深不止於嘆矣淑善也古者謂死喪飢饉輯録爾雅榖不熟曰飢菜不熟曰饉皆曰不淑蓋以吉慶為善事凶禍為不善事雖今人語猶然也曾氏曰凶年而遽相棄背蓋衰薄之甚者而詩人乃曰遇斯人之艱難遇斯人之不淑而無怨懟音墜過甚之詞焉厚之至也中谷有蓷暵其濕矣有女仳離啜張劣反其泣矣啜其泣矣何嗟及矣興也暵濕者旱甚則草之生於濕者亦不免也輯録孔氏曰先言乾次言修後言濕見凶年之淺深也啜泣貌何嗟及矣言事已至此末如之何窮之甚也輯録輔氏曰方其暵且恨之時而曰遇人之艱難遇人之不淑而無怨懟過甚之詞固見其厚矣及其至於傷而泣也則亦曰何嗟及矣而已殆冇知其不可奈何而安於命之意此尤見其厚也豈非先王之澤哉中谷有蓷三章章六句范氏曰世治則室家相保者上之所養也世亂則室家相棄者上之所殘也其使之也勤其取之也厚則夫婦日以衰薄而凶年不免於離散矣伊尹曰匹夫匹婦不獲自盡民主罔與成厥功輯録見商書咸有一德故讀詩者於一物失所而知王政之惡一女見棄而知人民之困周之政荒民散而將無以為國於此亦可見矣輯録謝氏曰夫婦人之大倫也飢饉而相棄人道之大變也婦無一語怨其夫而有哀矜惻怛之意焉知其無可奈何而安之若命此義婦也與忠臣孝子同道人不幸而處三網之變以此存心則綽綽然有餘裕矣有兔爰爰雉離于羅我生之初尚無為叶吾禾反我生之後逢此百罹叶良何反尚寐無吪比也兔性隂狡爰爰緩意雉性耿介離麗平聲歷也羅網尚猶罹音離憂也尚庶幾平聲也吪五戈反動也周室衰微諸侯背音佩叛君子不樂音洛其生而作此詩言張羅本以取兔今兔狡得脫而雉以耿介反離于羅以比小人致亂而以巧計幸免君子無辜而以忠直受禍也輯録吕東萊曰此因所見為比也兔之大以比諸侯雉之小以自比者言諸侯之背叛者恣睢自如而周人反受其禍也為此詩者蓋猶及見西周之盛故曰方我生之初天下尚無事及我生之後而逢時之多難如此然既無如之何則但庶幾寐而不動以死耳或曰興也以兔爰興無為以雉離興百罹也兔脫禍則安靜雉入羅則有憂其義相因亦可為興下章放此有兔爰爰雉離于罦音孚叶步廟反我生之初尚無造我生之後逢此百憂叶一笑反尚寐無覺居孝反叶居笑反比也罦覆車人奢反即今翻車綱也也可以掩兔造亦為也覺寤也有兔爰爰雉離于罿音衝我生之初尚無庸我生之後逢此百凶尚寐無聰比也罿罬音輟也即罦也或曰毛傳施羅於車上也庸用聰聞也無所聞則亦死耳兔爰三章章七句哀傷之意反覆道之綿綿葛藟力軓反在河之滸呼五反終逺于萬反兄弟謂他人父夫矩反謂他人父亦莫我顧叶果五反興也綿綿長而不絶之貌岸上曰滸世衰民散有去其鄉里家族而流離失所者作此詩以自歎言綿綿葛藟則在河之滸矣今乃終逺兄弟而謂他人為己父物得所托人失所依人不如物故以起興增釋許氏曰葛藟本生於山谷丘陵在河之滸非其所以興己之失所也亦通已雖謂彼為父而彼亦不我顧則其窮也甚矣綿綿葛藟在河之涘音俟叶矣始二音終逺兄弟謂他人母叶蒲彼反謂他人母亦莫我有叶羽已反興也水涯曰涘謂他人父者其妻則母也有識有也識有即顧念之意春秋傳曰不有寡君輯録嚴氏曰莫我有言視之若無也綿綿葛藟在河之漘順春反終逺兄弟謂他人昆叶古均反謂他人昆亦莫我聞叶微勻反興也夷上灑下曰漘灑七罪反峭也髙峻也上平坦而下水深為漘漘之為言脣也輯録爾雅注灑先典反深也許氏曰灑猶洗也岸上靣平夷而其下為水洗蕩齧入若脣也昆兄也聞相聞也葛藟三章章六句先言父次言母次言昆此三章相承之序也彼采葛叶居謁反兮一日不見如三月兮賦也采葛所以為絺綌蓋淫奔者託以行也故因以指其人而言思念之深未久而似久也彼采蕭叶踈鳩反兮一日不見如三秋兮賦也蕭荻也荻音狄蒿屬他本作萩非白葉莖粗科生有香氣祭則焫以報氣焫即爇字報氣即升臭也故采之曰三秋則不止三月矣彼采艾兮一日不見如三歲本與艾叶兮賦也艾蒿屬輯録爾雅曰一名冰臺注今艾蒿也乾之可灸九又音救故采之輯録吕東萊曰葛為絺綌蕭共祭祀艾療疾特訓釋三物見采之由不於此取義也曰三歲則不止三秋矣采葛三章章三句思念之意以漸而深輯録輔氏曰采葛采蕭采艾其説託言明矣至於思念之情流而不止如此則為淫奔之辭者宜哉大車檻檻毳尺鋭反衣如菼吐敢反豈不爾思畏子不敢賦也大車大夫車檻檻車行聲也毳衣天子大夫之服王氏曰子男毳冕五章天子之卿六命服與子男等此之大夫則卿也輯録春官典命王之卿六命其大夫四命此以未出封者言及出封則各加一等服亦以此為節也菼蘆之始生也毳衣之屬衣繪而裳繡宗彛藻粉米畫於衣黼黻繡於裳五色皆備其青者如菼考工記五色備謂之繡蓋繡雜五色其青者如菼其赤者如璊此與下章各舉其一耳爾淫奔者相命之詞也子大夫也不敢不敢奔也周衰大夫猶有能以刑政治其私邑者故淫奔者畏而歌之如此然其去二南之化則逺矣此可以觀世變也此詩之言所謂小人革靣民免而無恥者蓋政刑之效視德化不相及也故去二南為逺輯録輔氏曰漢廣之遊女端莊靜一人見而知其不可求野冇死麕之女子貞潔自守人見而知其不可犯此所以為二南之化也豈至於有淫奔之心必待有所畏而後不敢哉今觀此詩則世變之愈下可知矣大車啍啍他敦反毳衣如璊音門豈不爾思畏子不奔賦也啍啍重遲之貌輯録孔氏曰啍啍行之貌故為重遲上言行有聲此言行之貌互相見也璊玉赤色五色備則有赤榖則異室死則同穴叶户橘反謂豫不信有如皎古了反日賦也榖生穴壙音曠皎白也民之欲相奔者畏其大夫自以終身不得如其志也故曰生不得相奔以同室庶幾死得合葬以同穴而已謂豫不信有如皎日約誓之辭也增釋吳師道曰前二章言不敢不奔猶不失為變也此章猶言生不得相從死猶不善云耳故下申以約誓之辭亦邪思之不解者也大車三章章四句首章畏子不敢其辭微二章畏子不奔其辭顯至三章所云則顯顯然其辭確欲之所蔽以漸而深哀痛如黍離可謂忠矣以刑政治民如大車亦庶乎其有能者矣變雖云變而東都之大夫則寥寥乎僅見者也丘中有麻彼留子嗟彼留子嗟將七羊反其來施施叶特遮反賦也麻榖名子可食皮可績為布者輯録本草曰一名麻勃此麻上花勃勃者麻子味甘平無毒園圃所蒔今人作布及履用之子嗟男子之字也將願也施施喜悅之意婦人望其所與私者而不來故疑丘中有麻之處復扶又反有與之私而留之者今安得其施施然而來乎丘中有麥彼留子國彼留子國將其來食賦也子國亦男子字也來食就我而食也丘中有李彼留之子叶奬里反彼留之子貽我佩玖叶舉里反賦也之子并指前二人也貽我佩玖冀其有以贈已也丘中有麻三章章四句始則望其來即已繼則望其食於已終則望其有以贈於已願望之意以漸而深王國十篇二十八章百六十二句以忘親逆理衰懦柔弱之平王為東都之始王則王室可知矣是使民無聊賴如兔爰流離失所如葛藟室家相棄如中谷有蓷而采葛有麻淫奔亂俗又如此周轍而欲西也難哉故覩禾黍痛惜而已鄭一之七鄭邑名本在西都畿內咸林之地宣王以封其弟友為采音菜地後為幽王司徒而死於犬戎之難是為桓公其子武公掘一作滑並音鶻突定平王於東都亦為司徒又得虢檜之地乃徙其封而施舊號於新邑是為新鄭咸林在今華州鄭縣輯録即今陜西西安府華州新鄭即今之鄭州是也輯録即今河南開封府鄭州其封域山川詳見檜風程子曰鄭畿內之諸侯也王變則鄭亦變矣故以鄭次王嚴氏曰周之政令不行則畿內之鄭亦自為列國矣愚謂諸侯吞并則周衰周衰則侯國異政自近者始三衛王鄭相次其以此歟緇衣之宜兮敝豫又改為兮適子之館叶古玩反兮還豫授子之粲兮賦也緇黑色輯録考工記曰三入為纁五入為緅七入為緇緇衣卿大夫居私朝音潮之服也輯録孔氏曰緇衣即士冠禮所云玄冠朝服緇𢃄素韠是也卿士朝於王服皮辨不服緇衣退食私朝服緇衣以聼其所朝之政也宜稱去聲改更平聲適之館舍諸侯入王朝必有寓舍猶後世之稱邸也輯録考工記匠人營國外有九室九卿朝焉注在路門之外九卿贊三公以佐天子而治外政故其入朝而居之粲餐也輯録飲饌曰餐又爾雅注今河北人呼食為餐音孫或曰粲粟之精鑿音作者朱子曰漢有白粲之刑給舂導之役是也輯録許氏曰粟一石得米六斗為糲糲米一石舂為八斗為鑿舊説鄭桓公武公相繼為周司徒善於其職周人愛之故作是詩按序以此美武公辨説從之蓋桓公武公雖皆善其職而世繼其善者尤可美况桓公之死已在幽王被弒時此詩作於東都則為武公之作明矣集傳既引舊説而舉此兩句似乎兼美二公非専美武公也言子之服緇衣也甚宜德稱其服敝則我將為子更為之備禦以慰安之庶幾久於位也且將適子之館既還而又授子以粲問遺以親厚之庶母懷其士也言好之無已也輯録輔氏曰一句美武公之德稱其服也二句欲其服之常新也四句欲其粟之常繼也既欲其服之常新又欲其粟之常繼發乎情形於歌詠如此則其好善之誠心於是為至也程子曰好賢無已之意當就敝豫還豫四字上看緇衣之好兮敝豫又改造叶在早反兮適子之館兮還豫授子之粲兮賦也好猶宜也緇衣之席叶詳籥反兮敝豫又改作兮適子之館兮還豫授子之粲兮賦也席大也程子曰席有安舒之義服稱其德則安舒也緇衣三章章四句殷勤篤厚之意反覆道之記曰好賢如緇衣又曰於緇衣見好賢之至輯録解頥曰緇衣所以為好賢之至者以其始終之如一也始之厚者不能保其終之不薄始之勤者不能保其終之不怠惟緇衣之好賢不然其改造改作既始終之無間而設館授粲復前後之如一衣欲其常新粟欲其常繼儀刑欲其常接乎目議論欲其常接乎耳殷勤繾綣久而不厭所以為好賢之至也將七羊反仲子兮無踰我里無折之舌反我樹杞豈敢愛之畏我父母叶滿彼反仲可懷叶胡威反也父母之言亦可畏叶於非反也賦也將請也仲子男子之字也我女子自我也里二十五家所居也杞栁屬也生水傍樹如栁葉粗而白色理微赤蓋里之地域溝樹也莆田鄭氏曰此淫奔者之辭輔氏曰此雖為淫奔之詩然其心猶有所畏未至於蕩然而無忌也故列於鄭詩之首以見其為風之始變也歟愚謂此與王風大車略相似將仲子兮無踰我墻無折我樹桑豈敢愛之畏我諸兄叶虗陽反仲可懷也諸兄之言亦可畏也賦也墻垣也古者樹墻下以桑將仲子兮無踰我園無折我樹檀叶徒沿反豈敢愛之畏人之多言仲可懷也人之多言亦可畏也賦也園者圃之藩其內可種木也檀皮青滑澤材強韌輯録音刃堅柔難斷可為車將仲子三章章八句自父母而諸兄自諸兄而衆人言之次也增釋許氏曰此詩詞氣類野冇死麕之卒章然有畏父母諸兄國人之言猶為善於彼也此可見理義根於人心有終不可泯者身之陷於淫邪不能禁其欲也有畏人之意良心之存也倘上之教化行而下之風俗厚若此婦人豈不能修飭而以貞信自守邪然則小民心術之微皆上之人有以興喪之耳叔于田叶地因反巷無居人豈無居人不如叔也洵美且仁賦也叔莊公弟共叔段也事見春秋增釋許氏曰左氏傳隱公元年初鄭武公娶于申曰武薑生莊公及共叔段莊公寤生驚薑氏惡之愛段欲立之請於武公公弗許及莊公即位為之請京使居之謂之京城大叔既而大叔命西鄙北鄙二於已又收二以為已邑至於廪延大叔完聚繕甲兵具卒乘將襲鄭公伐京京叛大叔段段出奔共田取禽也巷里塗也洵信美好也仁愛人也假不義而得衆國人愛之故作此詩言叔出而田則所居之巷若無居人矣非實無居人也雖有而不如叔之美且仁是以若無人耳或疑此亦民間男女相恱之詞也叔于狩叶始九反巷無飲酒豈無飲酒不如叔也洵美且好叶許厚反賦也冬獵曰狩輯録杜氏曰狩圍守也冬物畢成獲則取之無所擇也輔氏曰洵美且好猶言好而又好也叔適野叶上與反巷無服馬叶蒲補反豈無服馬不如叔也洵美且武賦也適之也郊外曰野服乘也增釋許氏曰二章三章傳冇音釋而無其説蓋與首章之意同也無飲酒服馬謂無如叔之善飲酒服馬者此詩雖段不義得衆而人愛之然詳味其辭非小人黨惡者之言蓋君子知幾者所作也終篇雖全稱美略無譏刺之辭而所美者惟田狩飲酒之事舍是蓋無足言者且公子居大都専事驅騁田獵沈湎于酒而人心歸仰如此則將何所不至邪禍敗之來豫知之矣叔于田三章章五句愛念之意反覆道之叔于田乘乘下繩證反馬叶蒲補反執轡如組音祖兩驂如舞叔在藪素口反叶素苦反火烈具舉袒音袒裼素歷反暴虎獻于公所將七羊反叔無狃女九反叶女古反戒其傷女音汝賦也叔亦段也車衡車軛也外兩馬曰驂如舞謂諧和中節輯録御法有舞交衢也皆言御之善也藪澤也火焚而射也烈熾盛貌具俱也輯録釋文韓詩云禽獸居之曰藪毛氏曰田者大艾草以為防或舍其中然後焚而射焉孔疏云未田之前誓士戒衆止其間教戰既畢乃出而驅禽納之於防然後焚此所芟之防草而射之此恐未必然一説火火田也焚除萊草而田獵也袒裼肉袒也輯録凡獨言袒者袒去襲而露裼言袒裼者則并袒去裼而露肉也暴空手搏虎也公莊公也狃習也國人戒之曰請叔無習此事恐其或傷汝也蓋叔多材好勇而鄭人愛之如此善御多才也暴虎好勇也戒以無狃鄭人愛之也叔于田乘乘黃兩服上襄兩驂鴈行户郎反叔在藪火烈具揚叔善射忌音記又良御叶魚駕反忌抑磬苦定反控口貢反忌抑縱送忌賦也乘黃四馬皆黃也衡下夾轅兩馬曰服襄駕也馬之上者為上駕猶言上駟也史記孫武傳有上駟中駟下駟之説蓋上中下三等也鴈行者驂少次服後如鴈行也揚起也忌抑皆語助辭騁馬曰磬止馬曰控舍音捨拔音拔曰縱覆彇曰送拔矢括也彇弓弰頭也縱則放矢送則送矢磬控見其善御縱送見其善射此皆美之之詞輯録覆倒也既發矢則弓隨勢傾倒直指於前以送矢叔于田乘乘鴇音保叶補苟反兩服齊首兩驂如手叔在藪火烈具阜符有反叔馬慢叶黃半反忌叔發罕叶虛旰反忌抑釋掤音永忌抑鬯敕亮反弓叶姑宏反忌賦也驪白雜毛曰鴇今所謂烏驄也齊首如手兩服並首在前而兩驂在旁稍次其後如人之兩手也阜盛慢遲也發發矢也罕希釋解也掤矢筒音同蓋春秋傳作氷昭公二十五年公欲去季氏叔孫陷公圍公徒釋甲執氷而踞輯録注氷櫝丸蓋或云櫝丸是箭筒其蓋可以取飲鬯弓囊也與韔同言其田事將畢而從容整暇如此輯録鄭氏曰田事且畢則馬行遲發矢希蓋矢而韜弓亦喜其無傷之詞也馬慢發罕則獸幾盡釋掤鬯弓則事亦已昔懼其或傷今喜其無傷首末兩章相應也大叔于田三章章十句一章獵事舉二章獵事盛三章獵事畢輯録解頥曰段之為人以射則善以御則良以容止則甚習以材力則甚武如是而甚不仁夫惟不仁所以欲紾兄而奪其位也而國人愛之若此者豈盡出於公哉主教不明人心不古顛倒是非混淆黑白固有不勝其可嘆者矣陸氏曰首章作大叔于田者誤蘇氏曰二詩皆曰叔于田故加大以别之不知者乃以段有大叔之號而讀曰泰又加大于首章失之矣輯録解頥曰段之輕浮淺露如此固不得為善矣然莊公所以處之者果得為盡善乎仁人之於弟也亦親愛之而已矣教誨之而已矣若是則莊公所以處段者無以異於舜之處象孰得而議之哉今莊公不然始則恣其所為而不問終則操之已蹙而不恕則是其豫之者乃所以奪之也其寵之者乃所以殘之也其不仁已甚矣聖人録二詩於國風既以著叔段之惡而書鄭伯克段于春秋復以甚莊公之罪其亦可以為後世戒矣按此説本隱公元年左氏傳清人在彭叶普郎反駟介旁旁輔彭反叶輔岡反二矛重直龍反英叶於良反河上乎翺翔賦也清邑名清人清邑之人也彭河上地名駟介四馬而被甲也旁旁馳驅不息之貌二矛酋慈秋反矛夷矛也英以朱羽為矛飾也酋矛長二丈夷矛長二丈四尺並建於車上則其英重纍而見輯録矛鉤兵也考工記注酋夷發聲夷為長酋為短酋之言遒也道迫也言短也建者邪迤立之也纍上聲疊也一本作疊見音現翺翔遊戲之貌鄭文公惡髙克使將清邑之兵禦狄于河上輯録孔氏曰文公捷厲公子閔公二年冬十二月狄入衛衛在河北鄭在河南恐其渡河侵鄭故使髙克將清邑之兵於河上禦之久而不召師散而歸鄭人為之賦此詩言其師出之久無事而不得歸但相與遊戲如此其𫝑必至於潰散而後已爾清人在消駟介麃麃表驕反二矛重喬河上乎逍遙賦也消亦河上地名麃麃武貌矛之上句音勾曰喬所以懸英也英弊而盡所存者喬而已清人在軸叶音胄駟介陶陶叶徒候反左旋右抽叶敕救反中軍作好叶許候反賦也軸亦河上地名陶陶樂音洛而自適之貌左謂御在將去聲下同車之左執轡而御馬者也旋還車也右謂勇力之士在將車之右執兵以擊刺者也抽拔刃也中軍謂將在鼓下居車之中即髙克也將車則將在中左執御右執兵器士卒之車則左執弓右執矛中人御增釋許氏曰凡兵車執弓矢者在左主五兵者在右御者在中唯將車則鼓懸車中而將立鼓下御者在左車右在右好謂容好也東萊吕氏曰言師久而不歸無所聊賴姑遊戲以自樂必潰之𫝑也不言已潰而言將潰其詞深其情危矣清人三章章四句前二章言其遊戲而不歸後一章陳其遊戲之狀也事見春秋增釋許氏曰閔公二年鄭棄其師左氏傳鄭人惡髙克使帥師于河上久而弗召師潰而歸髙克奔陳孔疏是時狄侵衛衛在河北鄭在河南恐其渡河鄭故禦之胡氏曰人君擅一國之名寵生殺豫上聲奪惟我所制耳使髙克不臣之罪已著按而誅之可也情狀未明黜而退之可也愛惜其才以禮馭之亦可也烏何也可假去聲以兵權委諸竟音境上坐視其離散而莫之恤乎春秋書曰鄭棄其師其責之深矣羔裘如濡叶而朱而由二反洵直且侯叶洪姑洪鉤二反彼其音記之子舍音赦命不渝叶容朱容周二反賦也羔裘大夫服也如濡潤澤也洵信直順侯美也其語助辭舍處渝變也言此羔裘潤澤毛順而美彼服此者當生死之際又能以身居其所受之理而不可奪舍命不渝猶曰守義而不變爾輯録輔氏曰舍命不渝所包者闊命有二有指理而言者有指氣而言者此蓋兼之以理而言則居其理而不變以氣而言則居其分而不踰理可以兼氣故集傳止以理言之蓋美其大夫之詞然不知其所指矣羔裘豹飾孔武有力彼其之子邦之司直賦也飾緣去聲袖也禮君用純物臣下之故羔裘而以豹皮為飾也孔甚也豹甚武而有力故服其所飾之裘者如之司主也羔裘晏兮三英粲兮彼其之子邦之彥叶魚盰反兮賦也晏鮮盛也三英裘飾也未詳其制粲光明也彥者士之美稱羔裘三章章四句一章美其存心二章美其從政三章美其為人輯録解頥曰舍命不渝則必不徼幸而苟得而於守身之道得矣邦之司直則必不諛悅以求容而於事君之道盡矣既能順命以持身又能忠直以事上此所以為邦之彥也歟按此云明哲保身者即所謂順理以守身非趨利避害而偷生免死以全軀之謂也遵大路兮摻所覽反執子之袪叶起據反兮無我惡烏路反兮不寁音咱故也賦也遵循摻攬魯敢反通作攬袪袂輯録孔疏袂是袖之大者祛是袖頭小稱俱是衣袖寁速故舊也淫婦為人所棄故於其去也攬其袪而留之曰子無惡我而不留故舊不可以遽絶也宋玉賦有遵大路兮攬子袪之句亦男女相説音恱之詞也輯録通釋曰宋玉登徒子好色賦曰遵大路兮攬子袪贈以芳花詞甚妙注云攬衣袖欲與同歸折芳誦詩以贈遊女也集傳援此為證者蓋宋玉去此詩之時未逺其所引用當得詩人之本旨彼為男語女之詞猶此詩為女語男之詞也遵大路兮摻執子之手兮無我魗市由反叶齒九反兮不寁好叶許口反也賦也魗與醜同欲其不以已為醜而棄之也好情好也輯録輔氏曰無我惡兮不寁故也猶假義以責之至於無我魗兮不寁好也則真情見而詞益哀矣遵大路二章章四句故舊已不可遽棄而况情好之人乎留之之意以漸而深女曰雞鳴士曰昧旦子興視夜明星有爛將翺將翔弋鳬音符與鴈賦也昧晦旦明也昧旦天欲旦昧晦未辨之際也明星啓眀之星先日而出者也弋繳音灼射謂以生死繫矢而射也輯録歐陽氏曰泛而言射則在去聲以射其物而言則在入聲後放此毛韻注繳生絲縷弋箭箸之以罥禽足謂之矰繳鳬水鳥如鴨青色背上有文此詩人述賢夫婦相警戒之詞言女曰雞鳴以警其夫而士曰昧旦則不止於雞鳴矣婦人又語其夫曰若是則子可以起而視夜之如何意者明星已出而爛然則當翺翔而往弋取鳬鴈而歸矣其相與警戒之言如此則不留於宴安也昵尼質切近也之私可知矣弋言加叶居之居何二反之與子宜叶魚竒魚何二反之宜言飲酒與子偕老叶吕孔反琴瑟在御莫不靜好叶許厚反賦也加中去聲也史記所謂以弱弓微繳加諸鳬鴈之上見楚世家是也宜和其所宜也內則所謂鴈宜麥之屬是也牛宜稌羊宜黍豕宜稷犬宜粱鴈宜麥魚宜苽注云言其氣味相成也射者男子之事而中饋婦人之職故婦謂其夫既得鳬鴈以歸則我當為子和其滋味之所宜以之飲酒相樂音洛下同期於偕老而琴瑟之在御者亦莫不安靜而和好其和樂而不淫可見矣御親近也琴瑟靜好則物各得所而家道之齊可見矣夫婦之和其效如此知子之來叶六直反之雜佩以贈叶音則之知子之順之雜佩以問之知子之好呼報反之雜佩以報之賦也來之致其來者如所謂修文德以來之見論語雜佩者左右佩玉也上橫曰珩下繫三組貫以蠙步眠反輯録蚌之别名也珠中組之半貫一大珠曰瑀末懸一玉兩端皆鋭曰衝牙兩旁組半各懸一玉長博而方曰琚其末各懸一玉如半璧而內向曰璜又以兩組貫珠上繫珩兩端下交貫於瑀而下繫兩璜行則衝牙觸璜而有聲也吕氏曰非獨玉也觽音攜又翾規反燧針與針同管凡可佩者皆是也觽以解結燧以取火針以刺病管不知何用或日即玉琯也輯録內則篇注云針管針在管中也贈送順愛問遺也婦又語去聲其夫曰我苟知子之所致而來及所親愛者則將一作當解此雜佩以送遺報答之蓋不惟治其門內之職又欲其君子親賢友善結其歡歡同心而無所愛於服飾之玩也輯録輔氏曰觀此詩則鄭國之俗雖曰淫亂然在下之人夫婦之間猶知禮義勤生業不昵於宴私相安於和樂而又能贊助其君子親賢樂善以輔成其德此可以觀先王之澤與民性之善矣女曰雞鳴三章章六句始則相勉以男子之事繼則願相以閨門之職終則助其先施以篤親友之好此詩與齊雞鳴同意然彼言會朝之事可知其為國君之妃此其男子躬親射弋則士庶人之妻也輯録解頥曰雞鳴而興昧旦而往言其時之有常也翺翔而往鳬鴈而歸言其事之冇常也弋而取之於外宜而和之於內蓋欲各供其職也酒食以養其身琴瑟以和其志蓋欲同享其樂也來者致其來贈者送其往順以愛之好以親之皆來之之意問以遺之報以答之皆贈之之意又見其重不在物而在乎德也前二章相戒以職分之當為後一章相勉以德業之交修有女同車顔如舜華叶芳無反將翺將翔佩玉瓊琚彼美孟薑洵美且都賦也舜木槿也樹如李其華朝生暮落輯録陸佃云取瞬之義今人言一瞬孟字薑姓洵信都間雅也此疑亦淫奔之詩言所與同車之女其美如此而又歎之曰彼美色之孟薑信美矣而又都也輯録輔氏曰鄭詩惟此篇為男悅女之詞有女同行叶户郎反顔如舜英叶於良反將翺將翔佩玉將將七羊反彼美孟薑德音不忘賦也英猶華也將將聲也德音不忘言其賢也好色之人心志蠱惑所美非美故亦以德音稱之德音不忘者言其美德不可忘也輯録王氏曰於瓊琚言德之容於將將言德之音各以其類也有女同車二章章六句一章恱其色二章恱其德山有扶蘇隰有荷華叶芳無反不見子都乃見狂且子餘反興也扶蘇扶胥踈須二音小木也荷華芙渠也輯録釋文曰未開曰菡萏已發曰芙渠子都男子之美者也狂狂人也且語辭也淫女戲其所私者曰山則有扶蘇矣隰則有荷花矣今乃不見子都而見此狂人何哉彼所宜有者皆有此所宜見者不見不宜見者乃見之蓋以尋常之物而興怪異之事也山有橋松隰有遊龍不見子充乃見狡童興也上竦無枝曰橋亦作喬遊枝葉放縱也龍紅草也一名馬蓼葉大而色白生水澤中髙丈餘子充猶子都也充盛也男子之顔色衣服皆美而盛也狡童狡獪古外反之小兒也山有扶蘇二章章四句狡甚於狂故以為序輯録輔氏曰山冇扶蘇已得而其欲未饜之辭蘀兮未得而亟欲得之辭狡童則已絶而又欲别圖之辭褰裳則未絶而防其欲絶之辭增釋許氏曰此詩恐是淫女見絶於男子而復私於人乃思絶者之美好而厭所私者之狂狡也或曰有女同車男戲女山有扶蘇女戲男其男子之言曰有女與我同車同行者貌如舜華舜英我將之以翺翔佩玉固若美矣然豈如彼美孟薑容貌則洵美且都語言則使人不忘哉同車者則所與淫之女孟薑則虗設之辭也女則以山有扶蘇答之如傳意蘀他落反兮蘀兮風其吹女音汝叔兮伯兮倡昌亮反豫和胡卧反叶户圭反女興也蘀木稿而將落者也女指蘀而言也叔伯男子之字也豫女子自豫也女叔伯也此淫女之詞言蘀兮蘀兮則風將吹女矣叔兮伯兮則盍倡豫而豫將和女矣此専以語相應為興增釋金履祥曰蘀木葉之將落者風吹則落矣以見人生之易老故欲且與之相樂也蘀兮蘀兮風其漂匹遙反女叔兮伯兮倡豫要於遙反女興也漂飄同要成也成者所以終其曲也蘀兮二章章四句先和之後要之言之序也彼狡童兮不與我言兮維子之故使我不能餐七丹反叶七宣反兮賦也此亦淫女見絶而戲其人之詞言恱已者衆子雖見絶未至於使我不能餐也彼狡童兮不與我食兮維子之故使我不能息兮賦也息安也輯録輔氏曰男子之淫泆非狂則狡也狡童二章章四句戲謔之意反覆道之子惠思我褰裳涉溱側申反子不我思豈無他人狂童之狂也且子餘反賦也惠愛也溱鄭水名狂童猶狂且狡童也且語辭也淫女語其所私者曰子惠然而思我則將褰裳而涉溱以從子子不我思則豈無他人之可從而必於子哉狂童之狂也且亦謔之之辭子惠思我褰裳涉洧叶于已反子不我思豈無他士鉏里反狂童之狂也且賦也洧亦鄭水名輯録漢地志潁川郡陽城縣陽城山洧水所出東南至長平入潁水經洧水過新鄭縣南溱水從西北來與之合士未娶者之稱褰裳二章章五句戲謔之意反覆道之輯録輔氏曰婦人從一而終者也狡童褰裳二詩則其縱欲而賊理也甚矣子之丰芳容反叶芳用反兮俟我乎巷叶胡貢反兮悔豫不送兮賦也丰豐滿也巷門外也婦人所期之男子已俟乎巷而婦人以有異志不從既則悔之而作是詩也子之昌兮俟我乎堂兮悔豫不將兮賦也昌盛壯貌將亦送也衣於既反錦褧苦逈反衣裳錦褧裳叔兮伯兮駕豫與行賦也褧襌即單也也輯録鄭氏曰蓋以襌縠為之中裳用錦而上加襌縠焉惡其文之著也叔伯或人之字也婦人既悔其始之不送而失此人也則曰我之服飾既盛備矣豈無駕車以迎我而偕行者乎裳錦褧裳衣錦褧衣叔兮伯兮駕豫與歸賦也婦人謂嫁曰歸丰四章二章章三句二章章四句既悔不從其人繼又變志於他人蓋不止於二三其德矣縱欲之意以漸而深東門之墠音善叶上演反茹音如藘力於反在阪音反叶孚臠反其室則邇其人甚逺賦也東門城東門也墠除地町町他頂反者孔氏曰除地去草故云町町輯録除地去草也町町平貌茹藘茅搜音搜也一名茜音倩可以染綘陂音坡者曰阪爾雅注陂陀不平也門之旁有墠墠之外有阪阪之上有草識音志其所與淫者之居也室邇人逺者思之而未得見之詞也東門之栗有踐家室豈不爾思子不我即賦也踐行列貌門之旁有栗栗之下有成行列之家室亦識其處也即就也輯録輔氏曰思之切而冀其亟來就已之辭東門之墠二章章四句一章慕之二章怨之風雨凄凄子西反雞鳴喈喈音皆叶居奚反既見君子云胡不夷賦也凄凄寒涼之氣喈喈雞鳴之聲風雨晦冥蓋淫奔之時君子指所期之男子也夷平也淫奔之女言當此之時見其所期之人而心恱也風雨瀟瀟雞鳴膠膠叶音驕既見君子云胡不瘳叶憐蕭反賦也瀟瀟風雨之聲膠膠猶喈喈也瘳病愈也言積思之病至此而愈也風雨如晦叶呼洧反雞鳴不已既見君子云胡不喜賦也晦昏已止也輯録許氏曰喈喈膠膠不已皆雞聲紛雜之意慶源輔氏曰喜甚於瘳瘳甚於夷云胡不喜言如之何而不喜也蓋喜劇之辭風雨三章章四句喜幸之意反覆道之青青子襟音金悠悠我心縱我不往子寧不嗣音賦也青青純音凖緣去聲之色具父母衣純以青見記深衣子男子也襟領也悠悠思之長也我女子自我也嗣音繼續其聲問也此亦淫奔之詩青青子佩叶蒲眉反悠悠我思叶新齎反縱我不往子寧不來叶陵之反賦也青青組綬輯録玉藻注曰所以胃佩玉相承受者組綬一物也之色佩佩玉也輯録孔氏曰禮不佩青玉以青色組綬𢃄之桃他刀反兮逹他末反叶他恱反兮在城闕兮一日不見如三月兮賦也挑輕儇烜平聲跳躍之貌逹放恣也輯録輔氏曰此淫女望其所與私者既無音問又不見其來而極其怨之辭也子襟三章章四句一章二章則致思而微責之三章則切責而深思之揚之水不流束楚終鮮息淺反兄弟維豫與女女汝同無信人之言人實廷居南反女興也兄弟婚姻之稱輯録爾雅曰婦之黨為婚兄弟壻之黨為姻兄弟注云古人皆謂婚姻為兄弟禮所謂不得嗣為兄弟是也記曽子問壻之伯父致命女氏曰某之子有父母之喪不得嗣為兄弟疏云夫婦有兄弟之義豫女男女自相謂也人他人也廷與誑同淫者相謂言揚之水則不流束楚矣終鮮兄弟則維豫與女矣緩弱之水不能流去其所載寡特之人不能舍去其所依二者皆冇綢繆相與之意故以為興豈可以他人離間去聲之言而疑之哉彼人之言特誑女耳揚之水不流束薪終鮮兄弟維豫二人無信人之言人實不信叶斯人反興也揚之水二章章六句誑女則所欺者一人耳不信則欺人也多矣其誕妄亦已久矣出其東門有女如雲雖則如雲匪我思存縞古老反衣綦巨基反巾聊樂音洛我貟于云反賦也如雲美且衆也縞白色綦蒼艾色青而微白色如艾也縞衣綦巾女服之貧陋者此人自目其室家也輯録嚴氏曰猶云荆叉布裙也貟與云同語辭也人見淫奔之女而作此詩以為此女雖美且衆而非我思之所存我之所思不在此也不如己之室家雖貧且陋而聊可以自樂音洛也是時淫風大行而其間乃有如此之人亦可謂能自好去聲而不為去聲習俗所移矣羞惡烏故反之心人皆有之豈不信哉出其闉音因闍音都有女如荼音徒雖則如荼匪我思且子餘反縞衣茹藘聊可與娛賦也闉曲城也城門之外有副城回曲以障門者闍城臺也城上之臺當門臺也荼茅華輕白可愛者也且語助詞茹藘可以染絳故以名衣服之色娛樂也輯録輔氏曰聊樂我貟自樂其樂也聊可與娛夫婦同樂其樂也出其東門二章章六句自足之意反覆道之輯録輔氏曰鄭詩唯女曰雞鳴與此詩為得夫婦之道夫子録之正以見人性之本善而先王之澤猶未泯也野有蔓草零露漙徒端反叶上兖反兮有美一人清揚婉兮邂逅相遇適我願叶五逺反兮賦而興也蔓延也漙露多貌清揚眉目之間婉然美也詳見齊風猗嗟注邂逅不期而會也男女相遇於野田草露之間故賦其所在以起興言野有蔓草則零露漙矣有美一人則清揚婉矣本即所在而賦之又用其語相呼也邂逅相遇則得以適我願矣野有蔓草零露瀼瀼有美一人婉如清揚邂逅相遇與子偕臧賦而興也瀼瀼亦露多貌臧美也與子偕臧言各得其所欲也野有蔓草二章章六句喜幸之意反覆道之溱與洧方渙渙叶于元反兮士與女方秉蕳古顔反叶古賢反兮女曰觀乎士曰既且子餘反且往觀乎洧之外洵訏况于反且樂音洛維士與女伊其相謔贈之以勺藥賦而興也本即所在而賦之又用其語相呼也渙渙春水盛貌蓋氷解而水散之時也蕳蘭也其莖葉似澤蘭廣而長節節中赤髙四五尺輯録朱子曰蘭與澤蘭相似生水旁紫莖赤節緑葉光潤尖長有岐隂小紫且語辭洵信訏大也勺藥亦香草也三月開花芳色可愛輯録本草注曰勺藥有二種有草勺藥木勺藥鄭國之俗三月上已之辰采蘭水上以祓除不祥輯録韓詩注采作秉故其女問於士曰盍往觀乎士曰吾既往矣女復扶又反要平聲之曰且往觀乎蓋洧水之外其地信寬大而可樂也於是士女相與戲謔且以勺藥相贈而結恩情之厚也此詩淫奔者自敘之詞溱與洧瀏音留其清矣士與女殷其盈矣女曰觀乎士曰既且且往觀乎洧之外洵訏且樂維士與女伊其將謔贈之以勺藥賦而興也瀏深貌殷衆也將當作相聲之誤也溱洧二章章十二句縱欲之意反覆道之鄭國二十一篇五十三章二百八十三句鄭衛之樂皆為淫聲然以詩考之衛詩三十有九而淫奔之詩才四之一鄭詩二十有一而淫奔之詩已不趐七之五衛猶為男恱女之詞而鄭皆為女惑男之語輯録鄭詩惟冇女同車一篇為男恱女之辭衛人猶多刺譏懲創之意而鄭人幾於蕩然無復羞愧悔悟之萌是則鄭聲之淫有甚於衛矣故夫子論為邦獨以鄭聲為戒而不及衛蓋舉重而言固自有次第也詩可以觀豈不信哉鄭國固無足論者然緇衣之賢諸侯羔裘之賢大夫女曰雞鳴之賢夫婦出其東門之獨行君子於淫亂之風而得之亦甚為之喜幸也輯録通釋曰鄭詩之有緇衣羔裘女曰雞鳴出其東門數篇乃礫中之玉也他如大叔于田及清人詩雖無足尚猶幸非為淫奔而作若叔于田則亦未免有男女相恱之疑是其二十一篇之中曉然不為淫奔而作者五六篇而已故曰淫奔之詩不翅七之五然自昔説詩者唯以東門之墠與溱洧為淫詩今朱子乃例以淫奔斥之者蓋即其辭而得其情正以發明放鄭聲之旨不然則衛齊陳詩諸篇非無淫聲夫子何獨以鄭聲為當放哉詩經疏義會通卷四
