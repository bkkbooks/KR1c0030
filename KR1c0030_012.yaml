body:
  text: 詩經疏義㑹通卷十元朱公遷撰彤弓之什二之三彤弓弨尺昭反兮受言藏之我有嘉賓中心貺叶虚王反之鐘鼓既設一朝饗叶虚良反之賦也彤弓朱弓也輯録孔氏曰弓皆漆之以禦霜露彤弓色赤玈弓色黑賜弓赤一而黒十以赤為重耳周禮無彤弓之名夏官司弓矢云唐弓大弓以授勞者弨弛貌弓未張則弨然而弛往體多来體寡也貺與也大飲去聲賔曰饗蘇氏曰凡賜弓矢以饗禮行之孔氏曰饗則烹太牢殽牲爼豆盛於燕此天子燕有功諸侯而錫以弓矢之樂歌也東萊吕氏曰受言藏之言其重也弓人所獻藏之王府以待有功不敢輕與人也中心貺之言其誠也中心實欲貺之非由外也一朝饗之言其速也以王府寳藏去聲下府藏同之弓一朝舉以畀人輯録畀音庇付與也未嘗有遲留顧惜之意也輯録輔氏曰守之者不重則得之者亦輕予之而不誠則其感之也亦淺畀之而不速則其視之也亦玩而不以為恩矣然其所以重所以誠所以速者非懼其得之輕感之淺視之玩也盡吾之理而已後之視府藏為已私分去聲至有以武庫兵賜弄臣者輯録漢哀帝建平四年上𤼵武庫兵送侍中董賢及乳母王阿令執金吾母將隆奏武庫兵器天下公用今便辟弄臣私恩㣲妾而以天下公用給其私門非所以示四方也弄臣戯弄之臣則與受言藏之者異矣賞賜非出於利誘則迫於事勢至有朝賜鐡券而暮屠戮者唐叛臣反將及强節度多賜鐡券其後往往誅之唐荘宗賜朱友謙鐵卷恕死罪後被殺其妻以鐵券示使者曰此不知為何語則與中心貺之者異矣屯音迍膏吝賞輯録羅氏曰易云屯其膏謂徳澤不下及也功臣解體至有印刓五官反圜削也輯録蘇林曰手弄角訛而不忍予音與者項羽事則與一朝饗之者異矣輯錄解頥曰行之以盛禮用之以大樂賜之以重器而所予者則有功之諸侯也誠以將之而無偽速以畀之而不遲則天子之予之也足以為禮而諸侯之受之也亦足以為榮矣彤弓弨兮受言載叶子利反之我有嘉賔中心喜叶去聲之鍾鼓既設一朝右音又叶于記反之賦也載抗之也抗之者安於弓檠之上避雨濕也正輯録通釋曰載於弓檠抗弓體使言其蔵之謹也喜樂也右勸也燕飲之際勸之助歡尊也右為尊位彤弓弨兮受言櫜古刀反叶古號反之我有嘉賓中心好呼報之鍾鼓既設一朝醻市由反叶大到反之賦也櫜韜好説音悦醻報也飲酒之禮主人獻賓賓酢主人主人又酌自飲而遂酌以飲賓謂之醻醻猶厚也一獻一酢報施均矣又有醻是其厚也故以厚訓醻勸也醻以導飲故以為勸彤弓三章章六句輔氏曰此詩首章已盡其意後二章則反覆詠歌之爾愚謂饗有勸醻右先醻後二章三章皆承首章之意也增釋南牎謝氏曰彤弓弨兮有其器也我有嘉賓有其人也鐘鼓既設有其禮也既有其器復有其人必有其禮此燕有功之意也受言蔵之器之重也中心貺之一朝饗之禮之専也既重其器必當其人又専其禮此燕有功之誠也故歌詠之間凡意之出於誠者反覆言之許氏曰此詩専主於錫弓言錫弓則饗盖未有不饗而錫者也春秋傳文公四年寗武子曰諸侯敵王所愾音慨而獻其功於是乎賜之彤弓一彤矢百玈音盧黑也弓矢千以覺報宴注曰愾恨怒也覺明也謂諸侯有四夷之功王賜之弓矢又為去聲歌彤弓以明報功宴樂報其功而燕樂之也鄭氏曰凡諸侯賜弓矢然後専征伐東莱吕氏曰所謂専征者如四夷入邊臣子簒初患反弑輯録逆而奪取之曰簒下殺上曰弑不容待報者其它則九伐之法乃大司馬所職周禮夏官以九伐之法正邦國馮弱犯寡則責之賊賢害民則伐之暴内陵外則壇之野荒民散則削之負固不服則侵之賊殺其親則正之放弑其君則殘之犯令陵正則杜之外内亂鳥獸行則滅之壇音善與墠同以出其君更立其次賢者非諸侯所専也與後世强臣拜表輒行者異矣晉桓温北伐劉牢之討孫恩皆拜表輒行其専擅如此菁菁子丁反者莪五何反在彼中阿既見君子樂音洛且有儀叶五何反興也菁菁盛貌莪蘿蒿也輯録本草注曰一名莪蒿莖葉如青蒿開淡紅紫花結角子長二寸許㣲彎陸氏曰生澤田漸洳之處中阿阿中也大陵曰阿君子指賓客也此亦燕飲去聲賓客之詩言菁菁者莪則在彼中阿矣既見君子則我心喜樂而有禮儀矣此以可喜之物為喜見君子之興也凡見中阿之莪美盛已心喜況得見此盛徳之君子乎喜可知矣以此推之則莪之菁菁與桑之阿難同一例而裳華柞薪其葉湑兮亦同此一例也輯録輔氏曰見賢而樂禮或不足則愛心雖至而敬心不至也樂且有儀則愛敬之心兩盡矣或曰比也以菁菁者莪比君子容貌威儀之盛也諸本脱比也二字今從輔氏説増之下章放此菁菁者莪在彼中沚音止既見君子我心則喜興也此與下章諸本皆作比也今從輔氏説更定中沚沚中也喜樂也菁菁者在彼中陵既見君子錫我百朋興也中陵陵中也古者貨貝五貝為朋漢食貨志五貝者大貝牡貝么貝小貝不成貝也小貝以上各二種為朋不成貝不為朋今按此言五貝為朋其説小異當考輯録孔氏曰鄭因經廣觧之言冇五種之貝其中以相與為朋非緫五貝為一朋也錫我百朋者見之而喜如得重貨之多也錫百朋不足以致我心之喜我心之好徳如常情之好貨也汎汎芳劍反楊舟載沉載浮既見君子我心則休比也楊舟楊木為舟也載則也載沉載浮猶言載清載濁載馳載驅之類輯録黄氏曰言舟汎汎水中或上或下不定之貌戴氏云汎然不繫未有定止增釋吴師道曰載沉載浮沉者抑揚之勢沉非没溺也以比未見君子而心不定也休者休休然言安定也心既安定其喜可知此據今而言之菁菁者莪四章章四句首章喜樂冇禮儀近乎外貌故次章以我心則喜言見其由中達外也三章錫我百朋則甚遂其所欲四章言昔憂今喜則大遂其所願皆以見其真誠之心非偽也六月棲棲音西戎車既飭音勅四牡騤騤求龜反載是常服叶蒲北反玁狁孔熾尺志反我是用急叶音棘王于出征以匡王國叶于逼反賦也六月建未之月也輯録濮氏曰詩言六月徂暑則為夏正可知棲棲猶皇皇不安之貌戎車兵車也輯録周禮車僕掌戎路之萃廣車闕車苹車輕車是也戎路王在軍所乗廣車横陣之車闕車補闕之車苹猶屏也對敵自隠蔽之車輕車馳敵致師之車也萃七内反猶副也謂供副車以待乏用也廣輕皆去聲苹音平飭整也騤騤强貌常服戎事之常服以韎音昧韋為弁又以為衣而素裳白舄也輯録春官司服凡兵事韋弁服李寳之曰皮去毛熟治曰韋韎赤色也凡衣同冠色謝氏曰戎車既飭則車甲器械士卒馬牛皆平時盡備無一物不整齊矣四牡騤騤則戰馬皆平時閲習無一馬不精强矣曰載是常服則裳服皆平時製造無一衣一裳不經檢㸃今特載之車上而已矣增釋許氏曰䟽云載之者以戎服當戰陳之時乃服之在道未服之也玁狁即獫狁北狄也孔甚熾盛匡正也成康既没周室寢衰八世而厲王胡暴虐周人逐之出居于彘玁狁内侵逼近京邑輯録通釋曰據詩文至於涇陽而言也王崩子宣王靖即位命尹吉甫帥音率師伐之有功而歸詩人作歌以序其事如此司馬法冬夏不興師仁本篇云冬夏不興師所以兼愛民也輯録穰苴田完之裔先為齊大司馬故稱司馬穣苴所著書名司馬法今乃六月而出師者以玁狁甚熾其事危急故不得已而王命於是出征以正王國也此章言其出師之故輯録觧頥曰先王之法夷狄侵中國臣子背君父皆天下之大變諸侯有能討之者許之先𤼵而後聞其急如此所以然者以中國不可一日而不尊天理不可一日而不明也今玁狁内侵不得已而應之雖六月出師而人不以為暴者知其過之不在於君上葢以為所以勞我者乃所以安我也匡之為言正也夷狄横則中國危攘夷狄固所以正中國也此述其始受命出征之詞也比毗志反物四驪閑之維則維此六月既成我服叶蒲北反我服既成于三十里王于出征以佐天子叶奨里反賦也比物齊其力也凡大事祭祀朝音潮覲㑹同毛馬而頒之凡軍事物馬而頒之毛馬齊其色物馬齊其力輯録見夏官校人吉事尚文武事尚强也則法也服戎服也三十里一舎也古者吉行日五十里師行日三十里輯録漢文帝詔云七制史觧吉行言行幸也如郊廟如巡狩如封禪之類既比其物而曰四驪則其色又齊可以見馬之有餘矣閑習之而皆中去聲法則又可以見教之有素矣輕録彭氏曰陳氏云以厲王大亂之餘而支玁狁之患意其必倉卒不暇為計而今也比物四驪閑之維則蓋其車馬之脩器械之備非日也一於是此月之中即成我服既成我服即日引道不徐不疾盡舎而止又見其應去聲變之速從事之敏而不失其常度也輯録通釋曰六月之中即成戎服則應變速矣我服既成即日引道則從事敏矣雖速雖敏而軍行止三十里則不失其常度矣王命於此而出征欲其有以敵王所愾而佐天子耳四驪即四牡也我服即常服也語與上章相應如此輯録輔氏曰以佐天子則不止於正王國而已四牡脩廣其大有顒玉容反薄伐玁狁以奏膚公有嚴有翼共音恭武之服叶蒲北反共武之服以定王國叶于逼反賦也脩長廣大也顒大貌奏薦膚大公功嚴威翼敬也共與供同服事也言將帥並去聲皆嚴敬以供武事也馬壮則兵强而奏功可必矣然且不以强盛而忘嚴敬之道也此與上章言將帥之賢上章見其能此章見其賢也然戎事莫先於馬故皆首以為言而反覆稱美之也輯録輔氏曰兵隂事也用之當以嚴敬為主不嚴則不整不敬則不肅將帥皆嚴敬以共武事此王國之所以定也定則不止於匡矣有車馬為之用則足以却玁狁而成大功以嚴敬為之主則足以供武事而定王國吉甫之行師真足以繼南仲之軌迹矣宜宣王之中興也解頥曰兵事不可以不嚴尤不可以不敬書曰欽承天子威命敬也又曰威克厥愛允濟嚴也嚴敬二字乃用師之要道也玁狁匪茹如豫反整居焦穫音護侵鎬胡老反及方至于涇陽織音志文鳥章白斾央央於良反元戎十乗繩證反以先啓行叶户郎反賦也茹度唐入聲整齊也焦穫鎬方皆地名焦未詳所在穫郭璞以為瓠中則今在耀州三原縣也輯録耀州三原縣今𨽻陕西西安府鎬劉向以為千里之鎬則非鎬京之鎬矣亦未詳其所在也方疑即朔方也輯録見出車篇涇陽涇水之北輯録水北曰陽在豐鎬之西北輯録豐鎬在今陜西西安府涇陽縣言其深入為冦也織幟字同又熾試二音鳥章鳥隼之章也旂上畫急疾之鳥以為章白斾繼旐者也以絳帛綴旐末為燕尾輯録白帛也孔疏云獨言鳥章者百官建旟舉百官所以綂其餘也此旟而言旐者散則通名央央鮮明貌元大也戎戎車也軍之前鋒也啓開行道也猶言𤼵程也輯録史記三王世家注曰韓嬰章句云車有大戎十乗謂車縵輪馬被甲衡軛之上盡冇劒㦸名曰陷軍之車王氏曰元戎十乗所謂選鋒也兵法兵無選鋒曰北觧頥曰十乗則為馬四十匹甲士三十人其為步卒七百二十人言玁狁不自度符洛反量深入為冦如此是以建此旌旂選鋒鋭進聲其罪而致討焉直而壮律而臧輯録僖公二十八年左傳云師直為壮曲為老易曰師出以律否臧凶通釋曰今因玁狁為冦而聲罪致討則直而壮矣今討玁狁而旌旂鮮明選鋒鋭進則律而臧矣有所不戰戰必勝矣此章見興師之義討所當討所以為王者之師也戎車既安叶於連反如輊竹二反如軒四牡既佶其乙反既佶且閑叶胡田反薄伐玁狁至於大音泰原文武吉甫萬邦為憲叶許言反賦也輊車之覆而前也軒車之却而後也凡車從後視之如輊從前視之如軒然後適調也佶壮健貌輯録謝氏曰戎車既安矣必曰如輊如軒制度工巧則利於戰鬬也四牡既强矣必曰既佶且閑教訓習熟則耐於馳驅矣大原地名亦曰大鹵今在大原府陽曲縣輯録即今太原府陽曲縣𨽻山西至於大原言逐出之而已不窮追也先王治平聲戎狄之法如此吉甫尹吉甫此時大將去聲也憲法也非文無以附衆非武無以威敵能文能武則萬邦以之為法矣上章歴數玁狁之罪則殄殱之不為過也况車馬整飭如此誅鉏剪滅乃其餘事今則薄伐之追至大原而已又不専稱吉甫之武而先美其文見其能協人心以禦侮非迫人强戰而取勝于敵也此章見用兵之道輯録謝氏曰漢唐而下縉紳甲胄分為兩途愚儒武夫各持一説不知三代將帥必文武全才可以為萬邦之法則者也通釋曰此言吉甫之武必先之以文上言吉甫共武之服必本於嚴翼之徳末言吉甫飲至必及於孝友之友文事武備誠非兩途也北伐可見其武崧高烝民詩可見其文吉甫燕喜既多受祉來歸自鎬我行永久叶舉里反飲於鴆御諸友叶羽已反炰白交反鼈膾鯉侯誰在矣張仲孝友叶羽已反賦也祉福御進輯録炰火熟之名膾細切肉也侯維也張仲吉甫之友也善父母曰孝善兄弟曰友此言吉甫燕飲喜樂多受福祉輔氏曰此吉甫私與其友燕飲而已非天子燕之也愚謂受福不在燕飲之外燕飲喜樂即所以為福也蓋以其歸自鎬而行永久也是以飲酒進饌於朋友而孝友之張仲在焉言其所與燕者之賢所以賢吉甫而善是燕也人必須友以成徳吉甫得孝友之張仲則文武之徳有自来矣張公輔成吉甫之徳吉甫佐成宣王之功其所闗者豈小小哉此章述今日凱旋之樂輯録輔氏曰吉甫以天子之將冇功而歸相與宴者固不一也後篇謂方叔嘗與伐玁狁者亦豈得而不與焉而詩人乃獨舉夫孝友張仲之為賢則又可見吉甫之文而不専以武功為美矣六月六章章八句一章則治兵戒行而致憂勤迫切之心二章則差馬啓行而具敏給從容之意三章則馬壮兵强而整肅將事四章則彼曲我直而勇敢進師五章則嚴兵却敵而其徳為可美六章則凱還飲酒而其友為可稱增釋許氏曰此詩葢從征之君子所作詳味其辭若親履其事者一章緫言盛夏出軍之由二章言車服備而軍出三章言攻伐之事四章言玁狁侵北以啟下章馳逐之所至末章言軍凱還也詩前五章皆言車馬之盛但前四章泛言軍中之車馬五章乃吉甫之車馬一章我我朝廷也二章我我軍旅也卒章我我吉甫也一章之服軍帥之服也二章之服軍衆之服也薄言采芑音起于彼新田于此菑俱其反畆叶毎彼反方叔涖音利止其車三千師干之試叶詩止反方叔率止乗其四騏四騏翼翼路車有奭許力反簟笰音弗魚服叶蒲北反鉤膺鞗音條革叶訖力反興也芑苦菜也青白色摘其葉有白汁出肥可生食輯録肥或作脆亦可蒸為茹即今苦藚音賣菜冝馬食軍行采之人馬皆可食也輯録黄氏曰行軍所仰不徒在於芑而芑菜亦不應如是之多耳然詩人不過因采芑而起興田一嵗曰菑二嵗曰新田三嵗曰畬此與周頌訓畬字不同蓋本鄭注悮也輯録韻㑹曰田一嵗曰菑始反草也二嵗曰畬漸和柔也三嵗曰新田已成田而尚新也四嵗則曰田矣孔氏曰菑者灾也始灾殺其草木也新田新成柔田也畬和也田舒緩也今江東呼初耕地反草為災是也方叔宣王卿士受命為將者也涖臨也其車三千法當用三十萬衆蓋兵車一乗去聲甲士三人步卒七十二人又二十五人將重車在後几百人也輯録詹道傳曰尚書孔疏凡出車一乗則有兩車一正一副一曰輕車甲馬四匹甲士三人在車上左主射右主刺中主御步卒七十二人隨之前拒二十四人左角二十四人右角二十四人共七十二人二曰重車牛十二頭炊家子十人固守衣装五人廐養五人樵汲五人共二十五人皆所以佐兵車者兵車以戰大車以載輜重兩車緫百人然此亦極其盛而言未必實有此數也輯録朱子曰孔氏以為兼起鄉遂之兵王氏謂㑹諸侯之師此皆以辭害意之過詩人但極其盛而稱之耳師衆干扞也扞禦也禦侮之事試肄習也言衆且練也其車三千衆也師干之試練也輯録輔氏曰師衆之所以扞禦夫敵者又練習也率緫率之也翼翼順序貌路車戎路也奭赤貌簟笰以方文竹簟為車蔽也鉤膺馬婁頷有鉤而在膺有樊音鞶有纓也鉤者馬頷之飾樊纓馬膺之飾也樊馬大帶纓鞅央上聲也輯錄鄭氏曰樊纓皆以五采罽飾之罽音計織毛為之周禮春官巾車云金路以賓革路以即戌集傳訓戎路是革路也又五路惟金路有鉤以金為之蘇氏曰金路赤飾許氏曰金路同姓以封方叔或非同姓而方叔元老是為上公亦得乗金路矣孔氏曰方叔不乘革路者臨陣所乘當詳鞗革見音現蓼蕭篇宣王之時蠻荆背音佩叛王命方叔南征軍行采芑而食故賦其事以起興詩言方叔之南征非為采芑而作但因道當時之事而就用六句相呼應爾蓋與兔罝采薇畧同但兔罝采薇是借彼之所事為起語采芑是用已之所事為起語曰薄言采芑則于彼新田于此菑畆矣方叔涖止則其車三千師干之試矣新田在彼菑畆在此師衆如彼練習如此語正相應又遂言其車馬之美以見軍容之盛也此章先言軍衆且練以見軍實之盛繼言車馬如此又以見軍容之盛薄言采芑于彼新田于此中鄉方叔涖止其車三千旂旐央央方叔率止約軧祈支反錯衡叶户郎反八鸞瑲瑲七羊反服其命服朱芾音弗斯皇有瑲葱珩音衡叶户郎反興也中鄉民居其田尤治民居所在而用力易也在輯録蘇氏曰民居下有焉故三字一説中鄉民環居之中間也約束軧轂也以皮纒束兵車之轂而朱之也錯文也鈴在鑣曰鸞馬口兩旁各一四馬故八也瑲瑲聲也輯録錯衡以養日和鸞之聲以養耳命服天子所命之服也朱芾黄朱之芾也皇猶煌煌也瑲玉聲䓤蒼色如葱者也珩佩首横玉也禮三命赤芾葱珩孔氏曰三命至九命皆䓤珩方叔非止三命而已此章先言車馬旌旂之盛繼言將帥威儀之美夫其從容閑暇如此則敵愾不足以動其心克壮之猶冇素矣輯録曹氏曰芾佩非軍服金路非戎車和鸞非戎馬所以然者方叔克壮其猶如吴起將戰不帶劍諸葛武侯不親戎服羊祐輕裘而盛著威名杜預身不跨馬自䏻制勝故詩人詠其車服之美而已按如此説則方叔乗金路而九命也鴥惟必反彼飛隼息允反其飛戾天亦集爰止方叔涖止其車三千師干之試方叔率止鉦音征人伐鼓陳師鞠居六反旅顯允方叔伐鼓淵淵叶於中反振振闐闐徒顛反叶徒隣反興也隼鷂屬急疾之鳥也戾至爰於也鉦鐃也鐲音濁也輯録説文鐃似鈴柄中上下通周禮鼓人注鐲形如小鐘伐擊也鉦以静之鼓以動之鉦鼓各有人而言鉦人伐鼓互文也輯録濮氏曰周禮云鼓人以金鐲節鼓以金鐃止鼓即無鉦名則鐲鐃通謂之鉦而節止實用於鼓故詩云然鞠告也二千五百人為師五百人為旅此言將戰陳其師旅而誓告之也陳師鞠旅亦互文耳輯録顯允見湛露篇淵淵鼓聲平和不暴怒也謂戰時進士衆也振止旅衆也言戰罷而止其衆以入也春秋傳曰出曰治兵入曰振旅是也輯録隠公五年左傳曰三年而治兵入而振旅孔氏曰治兵尚威武也振旅别尊卑也出則㓜賤在前貴勇力也入則尊老在前復常法也闐闐亦鼓聲也或曰盛貌程子曰振旅亦以鼓行金止言隼飛戾天而亦集於所止以興師衆之盛而進退有節如下文所云也飛隼鴥疾以興師旅之盛揚之使進斂之使退亦有戾天集止之意也士卒衆而練軍律肅而齊㑹戰始終此章可見蠢尺允反爾蠻荆大邦為讎方叔元老克壮其猶方叔率止執訊音信獲醜叶尺由反戎車嘽嘽吐丹反嘽嘽焞焞吐反雷如霆如雷顯允方叔征伐玁狁蠻荆来威叶音威賦也蠢者動而無知之貌蠻荆荆州之蠻也大邦猶言中國也元大猶謀也言方叔雖老而謀則壮也輯録方叔元老尊嚴之稱則師卦所謂丈人朱子曰出師之道而任老成之人乃得吉也嘽嘽衆貌焞焞盛也霆疾雷也輯録爾雅注謂霹靂方叔蓋嘗與去聲於北伐之功者是以蠻荆聞其名而皆来畏服也此章既言小醜之逆宿將謀謨之勇而見勝之之故又言師旅之衆大將威名之重而見勝之之故采芑四章章十二句一章二章啓行在道時也三章戰而獲勝時也四章則成功之後而言其獲勝之故也玁狁匪茹犯義者也蠢爾蠻荆無知者也非文武之吉甫無以却玁狁非顯允之方叔無以威蠻荆二詩皆美當時將帥而因可以見宣王中興之功也増釋吴師道曰采芑章十二句三句一韻第四章讎猶醜二句一韻然老醜亦可叶我車既攻我馬既同四牡龐龐鹿同反駕言徂東賦也攻堅同齊也傳曰宗廟齊豪尚純也戎事齊力尚强也田獵齊足尚疾也純則不雜强則不敗疾則得獸龎龎充實也東東都洛邑也周公相去聲成王營洛邑為東都以朝音潮諸侯周室既衰久廢其禮至於宣王内脩政事外攘夷狄復文武之境音景土脩車馬備器械復扶又反㑹諸侯於東都因田獵而選車徒焉故詩人作此以美之首章汎言將往東都也輯録觧頤曰車攻馬同汎言其軍實之盛也四牡龎龎則自君子之所乗者言之也軍政脩治於閒暇之時而四牡充實於啓行之日則可以駕言而徂東矣田車既好叶許厚反四牡孔阜符有反東有甫草叶此苟反駕言行狩叶始九反賦也田車田獵之車好善也阜盛大也車既攻則好馬既同則阜此兩句承上章而言甫草甫田也後為鄭地今開封府中牟縣西圃田澤是也宣王之時未有鄭國圃田属東都畿内故往田也馳騖於諸侯采地不可也故自以閒曠之地共田獵輯録通釋曰宣王嘗封庶弟於西都咸林之地是為鄭桓公其子武公當平王時徙封于東都然後圃田為鄭也此章指言將往狩于圃田也之子于苖叶音毛選徒囂囂五刀反建旐設旄摶音傳獸于敖賦也之子有司也輯録朱子曰不敢斥王故以有司言之苖狩獵之通名也選數也囂囂聲衆盛也數車徒者其聲囂囂則車徒之衆可知且車徒不譁而惟數者有聲又見其静治也敖近滎陽地名也此章言至東都而選徒以獵也輯録吕東莱曰宣王往東都以㑹諸侯為主而二章三章先言田獵者蓋有司先為戒具以待㑹同畢而田獵也觧頥曰徒之選旐之建旄之設皆有司之事也所以然者將欲從王摶獸于敖也徒手曰摶以見師徒之勇而其教之有素也駕彼四牡四牡奕奕赤芾金舄㑹同有繹賦也奕奕連絡布散之貌赤芾諸侯之服輯録王氏曰人君宜朱芾而此赤芾者㑹同故也涖其臣庶則朱芾君道也故方叔服其命服則朱芾㑹同於王則赤芾臣道也故此㑹同則赤芾也金舄赤舄而加金飾亦諸侯之服也輯録鄭氏曰金舄黄朱色也時見音現曰㑹殷見曰同時見者無常期冇事則来朝而受命殷見者十冇二年而王不巡狩則六服衆諸侯皆来朝殷衆也繹陳列聮屬音燭之貌也此章言諸侯來㑹朝於東都也輯錄觧頥曰諸侯之来朝也其来也非一方其止也非一所先後之不同逺近之或異則其所以連絡而布散也及其㑹同于斯也五等各以其爵兩階各以其班尊卑之冇其序貴賤之有其等此所以陳列而聯属也讀是詩者可以想見當時朝㑹之盛決拾既佽音次與柴叶弓矢既調讀如同與同叶射夫既同助我舉柴子智反賦也決以象骨為之著音斫於右手大指所以鉤弦開體體者弓之體開之使内向而来也拾以皮為之著於左臂以遂弦故亦名遂放弦為之遂詩詁云韜左臂拾其衣袖以利弦故曰拾佽比也比毗志反謂以手指相佽比也調謂弓强弱與矢輕重相得也射夫蓋諸侯来㑹者同恊也柴説文作㧘謂積禽也使諸侯之人助而舉之言獲多也此章言既㑹同而田獵也四黄既駕兩驂不猗於寄於箇二反不失其馳叶徒卧反舎音捨矢如破彼寄普過二反賦也猗偏倚不正也馳馳驅之法也輯録通釋曰五御之日三曰過君表五曰逐禽左即御田車馳驅之法也舎矢如破巧而力也輯錄猶今人謂毒而親也蘓氏曰不善射御者詭遇則獲不然不能也今御者不失其馳驅之法而射者舎矢如破則可謂善射御矣輯録王氏曰向曰四牡既言力之强今曰四黄又言色之純也兩驂不猗御能正其馬也不失其馳車行節而法也舎矢如破矢行巧而力也此章言田獵而見其射御之善也上章専言射此章兼言射御輔氏曰戎事不齊豪而六月言四驪此章言四黄皆以見馬之冇餘也蕭蕭馬鳴悠悠斾旌徒御不驚大庖蒲爻反不盈賦也蕭蕭悠悠皆閒暇之貌徒步卒也御車御也驚如漢書夜軍中驚之驚漢景帝三年周亞夫引兵擊吴楚深壁而守夜軍中驚内相攻擊擾亂至帳下亞夫堅卧不起頃之復定不驚言比卒事比去聲及也言自始至終也不喧譁也大庖君庖也不盈言取之有度不極欲也蓋古者田獵獲禽面傷不獻踐音剪毛不獻面傷謂當面射之剪毛謂在傍而逆射之皆嫌誅降之義故不獻獻者獻於君也不成禽不獻惡其害㓜小擇取三等自左膘音縹而射音石之達于右腢音愚為上殺以為乾音干豆為脯置豆中奉宗廟自左脇後髀前射之達于右肩前則中心死疾肉鮮潔也達右耳本者次之以為賓客亦自左脇後髀前射之達右耳根也此則逺心死稍遲肉㣲惡射左髀俾陛二音達于右􅞞音沓為下殺以充君庖自左股外射之達右脇則中脇死最遲肉益惡凡射皆逐後從左廂而射之故曰逐禽左毎禽取三十焉毎等得十上殺中殺下殺為三等其餘以與士大夫習射於澤宫中去聲者取之射中則得取禽輯録射義注曰澤宫名所以擇士也先令習射於澤已乃射於射宫課中否也是以獲雖多而君庖不盈也張子曰饌雖多而無餘者均及於衆而有法耳凡事有法則何患乎不均也舊説不驚驚也不盈盈也亦通此章言其終事嚴而頒禽均也行事從容馭軍整肅處已儉約待人周徧即此章可知之子于征冇聞音問無聲允矣君子展也大成賦也允信展誠也聞師之行而不聞其聲言至肅也上章言選徒囂囂又言徒御不驚此又言有聞無聲葢戎事以嚴肅為主故云曰軍容肅信矣其君子也誠哉其大成也大成以獵事言輯録輔氏曰末二句乃美宣王也大成言其事之有始有終也此章緫序其事之始終而深美之也輯録觧頥曰冇體有用斯謂之君子有始有終斯謂之大成存於中而有興衰撥亂之志所以立其體施於外而有内脩外攘之事所以達其用如此得不謂之君子乎静治於往狩之初所以成其始嚴肅於旋歸之際所以成其終如此得不謂之大成乎體用之兼􅊀始終之無間此王道之所以謂大而詩人所以賛美之也車攻八章章四句以五章以下考之恐當作四章章八句田獵皆為講武事但車攻則㑹諸侯而罔及此吉日則不忘所事而特行之也輯録語録問車攻吉日詩朱子曰好田獵之事古人亦多刺之然宣王之田乃是因此見其車馬之盛紀律之嚴所以為中興之勢者在此其所謂田者異乎尋常之田矣吉日維戊叶莫吼反既伯既禱叶丁口反田車既好叶許口反四牡孔阜符有反升彼大阜從其羣醜賦也戊剛日也外事以剛日故以戊以庚伯馬祖也謂天駟房星之神也房四星謂之天駟輯録晉天文志曰房四星亦曰天駟為天馬主車駕南星曰左驂次左服次右服次右驂亦曰天廄爾雅注龍為天馬故房謂之天駟醜衆也謂禽獸之羣衆也此亦宣王之詩言田獵將用馬力故以吉日祭馬祖而禱之不忘本也輯録夏官校人春祭馬祖孔疏曰常祭在春也既祭而車牢馬健於是可以歴險而從禽也於下章推之是日也其戊辰歟吉日庚午既差我馬叶满浦反獸之所同麀音憂鹿麌麌愚甫反漆沮七徐反之從天子之所賦也庚午亦剛日也差擇齊其足也同聚也鹿牝曰麀麌麌衆多也漆沮水名在西都畿内涇渭之北所謂洛水今自延韋流入鄜音孚坊至同州入河也輯録季氏曰書疏云漆沮在涇水之東一名洛水職方氏所謂雍州其浸渭洛非河南之洛也通釋曰此言漆沮之從猶車攻言甫草敖地彼則狩于東都此則狩于西都也戊辰之日既禱矣越三日庚午遂擇其馬而乗之視獸之所聚麀鹿最多之處而從之惟漆沮之旁為盛宜為天子田獵之所也車攻吉日皆先言擇馬擇馬必先祭馬祖車攻雖不言祭正可以言日類推也瞻彼中原其祁孔有叶羽已反儦儦表驕反俟俟叶于紀反或羣或友叶羽已反悉率左右叶羽已反以燕天子叶奬里反賦也中原原中也祁大也趣則儦儦行則俟俟獸三曰羣二曰友燕樂也言從王者視彼禽獸之多於是率其同事之人各共音恭其事以樂天子也或射或御各共其事也既張我弓既挾子洽户頰二反我矢𤼵彼小豝音巴殪於計反此大兕徐履反以御賓客且以酌醴賦也發發矢也豕牝曰豝一矢而死曰殪兕野牛也言能中去聲㣲而制大也孔氏曰小豝言𤼵謂射即中之大兕言殪謂射之即死愚謂中㣲見其巧制大見其力輯録通釋曰此言射者之善猶車攻言舍矢如破也御進也醴酒名周官五齊去聲二曰醴齊注曰醴成而汁滓壮一反相將如今甜酒也出天官酒正五齊曰泛齊醴齊盎齊緹齊沈齊汁滓相將言汁與滓相黏而不散也緹音體言射而獲禽以為俎實進於賓客而酌醴也車攻之詩終於頒禽吉日之詩終於酌醴王者之田獵豈為口腹計哉吉日四章章六句一章祭禱戒行二章差馬擇地三章狩獵四章獵而獲禽可以供用也東莱吕氏曰車攻吉日所以為復古者何也蓋蒐狩之禮可以見王賦之復焉可以見軍實之盛焉可以見師律之嚴焉可以見上下之情焉可以見綜理之周焉欲明文武之功業者此亦足以觀矣輔氏曰王賦車馬也軍實兵器也律者進退之度也情者下之供事上之御賓其情交相與也至於祭禱必講獵地必擇車馬有備射御有法終事之嚴頒禽之均酌醴之厚無一不至則綜理之周可見矣輯録通釋曰師律之嚴選徒則囂囂徒御則不驚行者冇聞而無聲也上下之情㑹同有繹而助我舉柴悉率左右而以燕天子也鴻鴈于飛肅肅其羽之子于征劬其俱反勞于野叶上與反爰及矜棘氷反人哀此鰥寡叶果五反興也大曰鴻小曰鴈肅肅羽聲也之子流民自相謂也征行也劬勞病苦也矜憐也老而無妻曰鰥老而無夫曰寡舊説周室中衰萬民離散而宣王能勞来並去聲還音旋定安集之輯録王氏曰勞者勞之来者来之往者還之擾者定之危者安之散者集之故流民喜之而作此詩追取其始而言曰鴻鴈于飛則肅肅其羽矣之子于征則劬勞于野矣飛而有聲亦有行役劬勞之意也故以起興且其劬勞者皆鰥寡可哀憐之人也輯録輔氏曰爰及矜人哀此鰥寡又言其所與行者無非可憐之人而就其中又惟鰥寡之可哀也然今亦未有以見其為宣王之詩後三篇放此此章離散時也鴻鴈于飛集于中澤叶徒洛反之子于垣音袁百堵丁古反皆作雖則劬勞其究安宅叶達各反興也中澤澤中也一丈為板五板為堵長一丈髙五板究終也流民自言鴻鴈集于中澤以興已之得其所止而築室以居今雖勞苦而終獲安定也此章安集時也鴻鴈于飛哀鳴嗸嗸五刀反維此哲人謂我劬勞維彼愚人謂我宣驕叶音高比也流民以鴻鴈哀鳴自比而作此歌也前二章以鴻鴈興之子此言鴻鴈而不言之子則以彼而比此也哲知去聲二四同宣示也知者聞我歌知其出於劬勞不知者謂我閒暇而宣驕也韓詩云勞者歌其事輯録外傳飢者歌其食云云魏風亦云我歌且謠不知我者謂我士也驕大抵歌多出於勞苦而不知者常以為驕也此章言作詩所以告哀也鴻鴈三章章六句輯録觧頥曰恵鮮鰥寡文王之所以興也哿矣富人哀此㷀獨幽王之所以亡也爰及矜人哀此鰥寡宣王之所以中興也夫鰥寡孤獨乃天民之窮而無告者聖人一視同仁雖無一物而不在所愛而其發政施仁則必自鰥寡孤獨始誠使鰥寡孤獨各得其所則天下之民無不被其澤者矣宣王之勞来還定安集其有得於文王之家法也歟劬勞于野自其始之流散而言也百堵皆作自其中之還歸而言也其究安宅自其終之安定而言也此詩不作於流離之時而作於安定之日葢痛定思痛者是以知者以為勞苦而不知者則反以為宣驕也夜如何其音基夜未央庭燎之光君子至止鸞聲將將七羊反賦也其語辭央中也庭燎大燭也諸侯將朝音潮下同則司烜音毁以物百枚并卑政反而束之設於門内也郊特牲云庭燎之百由齊桓公始注云庭燎之差天子百公五十侯伯子男三十古制未聞要以物百枚束之今則用松葦竹灌以脂膏愚按如此則所謂物者即松葦竹之屬鄭氏以古制未聞故曰物蓋意度之爾束之以百則大五十三十則以次而小也輯録孔疏云樹之以庭燎之為明是燭之大者君子諸侯也將將鸞鑣聲王將起視朝不安於寢而問夜之早晚曰夜如何哉夜雖未央而庭燎光矣朝者至而聞其鸞聲矣夜如何其夜未艾音乂又如字庭燎晰晰之世反與艾叶君子至止鸞聲噦噦呼㑹反賦也艾盡也晰晰小明也始則明盛至此則明小矣輯録王氏曰光之衰也噦噦近而聞其徐行聲有節也始則稍逺至此則加近矣夜如何其夜鄉許亮反晨庭燎有煇許云反君子至止言觀其旂叶渠斤反賦也鄉晨近曉也煇火氣也天欲明而見其烟光相雜也既至而觀其旂則辨色矣羣臣之朝辨色而入庭燎三章章五句始則未央次則未艾次則鄉晨言之序也庭燎則自有光晰晰而至於見其煇鸞旂則自將將噦噦而至於辨其物言之亦有序矣輯録通釋曰列女傳云宣王嘗晏起姜后脫簮珥待罪於永巷宣王感悟於是勤於政事早朝晏退卒成中興之名以此証之或果宣王詩也增釋許氏曰此固王者勤於視朝之詩可見卧不安席中夜以思惟恐時之後也是以及時視朝而號令嚴肅執事者恪恭陳列以時百官之入朝者亦皆先時而至而車服威儀莫不和整以俟聴朝終篇未嘗言王之勤而勤勞之意自見於言外矣沔綿善反彼流水朝直遥反宗于海叶虎洧反鴥惟必反彼飛隼息允反載飛載止嗟我兄弟邦人諸友叶羽軌反莫肯念亂誰無父母叶滿洧反興也沔水流满也諸侯春見音現天子曰朝夏見曰宗輯録蔡氏曰水勢奔趍於海猶諸侯朝宗于王也此憂亂之詩言流水猶朝宗于海知所向也飛隼猶或有所止知所止也而我之兄弟諸友乃無肯念亂者物若有知人不如物故以起興誰獨無父母乎亂則憂或及之是豈可以不念哉親疎逺近皆無肯念亂者詩人所以深憂之也沔彼流水其流湯湯失羊反鴥彼飛隼載飛載揚念彼不蹟井亦反載起載行叶户郎反心之憂矣不可弭忘興也湯湯波流盛貌不蹟不循道也此章不循者致亂之由下章我友敬者止亂之本載起載行言憂念之深不遑寜處也弭止也水盛隼揚以興憂亂之不能忘也水方盛而未殺隼方揚而未止憂念方来而未息此皆理勢之不可遏者故用彼字相呼而為興也鴥彼飛隼率彼中陵民之訛言寕莫之懲我友敬矣讒言其興興也率循訛偽懲止也隼之髙飛猶循彼中陵言不横絶曠逺知自遏也而民之訛言乃無懲止之者隼不自縱人乃縱讒亦以人不如物而起興然我之友誠能敬以自持矣我友必指在位者蓋邦人諸友中之一人也則讒言何自而興乎自持以敬則小人不敢近其能止讒必矣䜛言之人即上章不蹟者也始憂於人而卒反諸已也始憂於人謂䜛莫肯息卒反諸已謂敬當自持增釋許氏曰末章飛隼而循中陵民言訛偽者何乃莫之懲止耶於是謂其友一當敬以自持否則䜛言其興而見及矣憂而戒之之辭也䜛言固可憂惟敬足以勝之詩人之學知所本矣沔水三章二章章八句一章六句輯録陳定宇曰始念亂而憂及父母終憂䜛而敬以反身憂念之中不忘孝敬詩人忠厚之意也疑當作三章章八句卒章脱前兩句耳一章言人皆不知憂亂二章言已獨憂人之造亂三章言在位者敬以自持則可止䜛而息亂鶴鳴于九臯聲聞音問于野叶上與反魚潛在淵或在于渚樂音洛彼之園爰有樹檀叶徒㳂反下同其下維蘀音託他山之石可以為錯七落反比也鶴鳥名長頸竦身髙腳頂赤身白頸尾黒其鳴髙亮聞八九里臯澤中水溢出所為坎從外數上聲至九喻深逺也輯録釋文曰韓詩云九臯九折之澤濮氏曰澤曲曰臯見楚辭注蘀落也輯録吕叔與曰落葉穢雜錯礪石也此詩之作不可知其所由然必陳善納誨之辭也輯録輔氏曰然不正言其事而必比物而為言者正所謂風刺上者皆不主於正事而生於文辭不以正諫而託物以諫也蓋鶴鳴于九臯而聲聞于野言誠之不可揜也誠中形外非可矯飾為也魚潛在淵而或在于渚言理之無定在也千變萬化非可執一求也園有樹檀而其下維蘀言愛當知其惡也君子而或有未仁不可溺於愛也他山之石而可以為錯言憎當知其善也小人而或有一長不可偏於惡也由是四者引而伸之觸類而長上聲之天下之理其庶幾平聲乎舉此以為例爾四者雖冇不同惟能明善誠身而不蔽於私者處此無難矣輯錄曹氏曰天下之理散於萬事若能反於身而求之觸類而長之未有不可為吾之益者也鶴鳴所以喻誠身魚潜所以喻明理檀蘀石錯又所以正人心好惡之偏因物而推皆可以反求諸身者也解頥曰知誠之不可揜則知念慮方萌而鬼神已知形迹欲掩而肺腑已見所以不可無誠身之功也知理之無定在則知事有精粗而理無精粗事有大小而理無大小所以不可無明善之功也知愛當知其惡憎當知其善則知親愛賤惡之不可以或偏哀矜敖惰之不可以自恣所以於應接之間尤不可不去其私欲之蔽也能是數者則知行並進而明誠兩立好惡不偏而人已兼盡其於治天下不難矣此所以為陳善納誨之辭也歟鶴鳴于九臯聲聞于天叶鉄因反魚在于渚或潛在淵叶一均反樂彼之園爰有樹檀其下維榖他山之石可以攻玉比也榖一名楮惡木也輯録孔疏陸氏云幽州人謂之榖桑荆揚交廣謂之榖中州人謂之楮殷中宗時榖桑共生是也今江南人績其皮以為布又𢷬以為紙樹皮班者是楮白者是榖攻錯也程子曰玉之温潤天下之至美也石之麄厲天下之至惡也然兩玉相磨不可以成器以石磨之然後玉之為器得以成焉猶君子之與小人處上聲也横去聲逆侵加然後脩省息井反畏避動心忍性増益預防輯録葉氏曰君子與小人處為小人所侵陵則脩省其身者必謹畏避小人者必嚴動心而不敢苟安忍性而不敢輊𤼵増益其所不能預防其所未至而義理生焉道徳成焉小人有益於君子乃如此吾聞諸邵子云近則聞於野逺則聞於天汎言之則可以為錯親切言之則可以攻玉也鶴鳴二章章九句教誨之意以漸而深輯録朱子曰鶴鳴做得巧含蓄意思全不𤼵露彤弓之什十篇四十章二百五十九句疑脱兩句當為二百六十一句詩經疏義㑹通卷十
